<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白噪音混合器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #6c63ff;
    --accent2: #48d1cc;
    --text: #e8eaf6;
    --text2: #9198c5;
    --text3: #5a6088;
    --radius: 18px;
    --shadow: 0 8px 32px rgba(0,0,0,0.45);
    --transition: 0.22s cubic-bezier(.4,0,.2,1);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 0;
    overflow-x: hidden;
  }

  /* Background gradient */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(108,99,255,0.18) 0%, transparent 70%),
                radial-gradient(ellipse 60% 40% at 90% 90%, rgba(72,209,204,0.1) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .back-link {
    position: fixed;
    top: 16px;
    left: 18px;
    z-index: 100;
    color: var(--text3);
    text-decoration: none;
    font-size: 13px;
    transition: color var(--transition);
  }
  .back-link:hover { color: var(--text2); }

  .container {
    position: relative;
    z-index: 1;
    max-width: 700px;
    margin: 0 auto;
    padding: 60px 18px 48px;
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header h1 {
    font-size: clamp(24px, 5vw, 34px);
    font-weight: 700;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, #fff 30%, var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    margin-top: 8px;
    color: var(--text3);
    font-size: 14px;
    letter-spacing: 0.03em;
  }

  /* Master control */
  .master-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 22px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow);
  }
  .play-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform var(--transition), box-shadow var(--transition);
    box-shadow: 0 4px 16px rgba(108,99,255,0.45);
  }
  .play-btn:hover { transform: scale(1.08); box-shadow: 0 6px 24px rgba(108,99,255,0.6); }
  .play-btn:active { transform: scale(0.96); }
  .play-btn svg { width: 22px; height: 22px; fill: #fff; }

  .master-info { flex: 1; }
  .master-info .label {
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 4px;
  }
  .master-info .status {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text3);
    margin-right: 7px;
    vertical-align: middle;
    transition: background var(--transition), box-shadow var(--transition);
  }
  .status-dot.active {
    background: var(--accent2);
    box-shadow: 0 0 8px var(--accent2);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 6px var(--accent2); }
    50% { box-shadow: 0 0 14px var(--accent2); }
  }

  .master-vol-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    min-width: 100px;
  }
  .master-vol-wrap span { font-size: 12px; color: var(--text3); }

  /* Cards grid */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: var(--shadow);
    transition: border-color var(--transition), box-shadow var(--transition), transform var(--transition);
    cursor: default;
  }
  .card:hover {
    border-color: rgba(108,99,255,0.4);
    transform: translateY(-2px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
  }
  .card.on {
    border-color: rgba(108,99,255,0.7);
    background: linear-gradient(160deg, #1e2138 0%, var(--surface) 100%);
    box-shadow: 0 8px 32px rgba(108,99,255,0.2);
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .card-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    background: var(--surface2);
    transition: background var(--transition);
  }
  .card.on .card-icon {
    background: linear-gradient(135deg, rgba(108,99,255,0.35), rgba(72,209,204,0.2));
  }
  .card-meta { flex: 1; }
  .card-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
  }
  .card-desc {
    font-size: 12px;
    color: var(--text3);
    margin-top: 2px;
  }

  /* Toggle switch */
  .toggle {
    position: relative;
    width: 40px;
    height: 22px;
    flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-track {
    position: absolute;
    inset: 0;
    background: var(--surface2);
    border-radius: 11px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background var(--transition), border-color var(--transition);
  }
  .toggle-track::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 14px;
    height: 14px;
    background: var(--text3);
    border-radius: 50%;
    transition: transform var(--transition), background var(--transition);
  }
  .toggle input:checked + .toggle-track {
    background: linear-gradient(135deg, var(--accent), #8b85ff);
    border-color: var(--accent);
  }
  .toggle input:checked + .toggle-track::after {
    transform: translateX(18px);
    background: #fff;
  }

  /* Volume slider */
  .vol-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .vol-icon { font-size: 13px; color: var(--text3); flex-shrink: 0; }
  .vol-slider {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--surface2);
    outline: none;
    cursor: pointer;
    transition: opacity var(--transition);
  }
  .vol-slider:disabled { opacity: 0.35; cursor: not-allowed; }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(108,99,255,0.5);
    transition: transform var(--transition);
  }
  .vol-slider:not(:disabled)::-webkit-slider-thumb:hover { transform: scale(1.3); }
  .vol-slider::-moz-range-thumb {
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }
  .vol-val {
    font-size: 12px;
    color: var(--text3);
    min-width: 28px;
    text-align: right;
  }

  /* Master volume slider (larger) */
  .master-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 5px;
    border-radius: 3px;
    background: var(--surface2);
    outline: none;
    cursor: pointer;
  }
  .master-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    cursor: pointer;
    box-shadow: 0 0 8px rgba(108,99,255,0.5);
  }
  .master-slider::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
  }

  /* Visualizer */
  .visualizer {
    width: 100%;
    height: 48px;
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface2);
    margin-bottom: 24px;
  }
  .visualizer canvas { width: 100%; height: 100%; display: block; }

  /* Timer section */
  .timer-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 22px;
    margin-top: 24px;
    box-shadow: var(--shadow);
  }
  .timer-title {
    font-size: 13px;
    color: var(--text3);
    margin-bottom: 12px;
  }
  .timer-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .timer-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
  }
  .timer-btn:hover { border-color: var(--accent); color: var(--accent); }
  .timer-btn.active { background: rgba(108,99,255,0.2); border-color: var(--accent); color: var(--accent); }
  .timer-countdown {
    margin-top: 10px;
    font-size: 13px;
    color: var(--accent2);
    min-height: 18px;
  }

  /* Preset section */
  .preset-section {
    margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 22px;
    box-shadow: var(--shadow);
  }
  .preset-title { font-size: 13px; color: var(--text3); margin-bottom: 12px; }
  .preset-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .preset-btn {
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
  }
  .preset-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  @media (max-width: 480px) {
    .container { padding: 52px 12px 40px; }
    .cards { grid-template-columns: 1fr 1fr; }
    .master-bar { flex-wrap: wrap; }
    .master-vol-wrap { min-width: 80px; }
  }
  @media (max-width: 360px) {
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<div class="container">
  <div class="header">
    <h1>白噪音混合器</h1>
    <p>自由混合环境声音，帮助专注与助眠</p>
  </div>

  <!-- Visualizer -->
  <div class="visualizer">
    <canvas id="vizCanvas"></canvas>
  </div>

  <!-- Master control -->
  <div class="master-bar">
    <button class="play-btn" id="masterPlayBtn" title="全部开关">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="master-info">
      <div class="label">全局控制</div>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">已暂停</span>
      </div>
    </div>
    <div class="master-vol-wrap">
      <span>主音量</span>
      <input type="range" class="master-slider" id="masterVol" min="0" max="100" value="80">
    </div>
  </div>

  <!-- Sound cards -->
  <div class="cards" id="cardsContainer"></div>

  <!-- Preset section -->
  <div class="preset-section">
    <div class="preset-title">场景预设</div>
    <div class="preset-btns">
      <button class="preset-btn" data-preset="focus">专注工作</button>
      <button class="preset-btn" data-preset="sleep">深度助眠</button>
      <button class="preset-btn" data-preset="relax">放松冥想</button>
      <button class="preset-btn" data-preset="nature">自然户外</button>
      <button class="preset-btn" data-preset="clear">清除全部</button>
    </div>
  </div>

  <!-- Timer section -->
  <div class="timer-section">
    <div class="timer-title">定时关闭</div>
    <div class="timer-btns">
      <button class="timer-btn" data-min="15">15分钟</button>
      <button class="timer-btn" data-min="30">30分钟</button>
      <button class="timer-btn" data-min="45">45分钟</button>
      <button class="timer-btn" data-min="60">60分钟</button>
      <button class="timer-btn" data-min="90">90分钟</button>
      <button class="timer-btn" data-min="0">取消</button>
    </div>
    <div class="timer-countdown" id="timerCountdown"></div>
  </div>
</div>

<script>
(function() {
  "use strict";

  // ─── Sound definitions ──────────────────────────────────────────────────────
  var SOUNDS = [
    {
      id: "rain",
      name: "雨声",
      icon: "🌧️",
      desc: "轻柔降雨，静心专注",
      defaultVol: 60,
      color: "#4fc3f7"
    },
    {
      id: "ocean",
      name: "海浪",
      icon: "🌊",
      desc: "浪涛起伏，放松身心",
      defaultVol: 55,
      color: "#26c6da"
    },
    {
      id: "wind",
      name: "风声",
      icon: "🍃",
      desc: "微风穿林，自然纯粹",
      defaultVol: 45,
      color: "#81c784"
    },
    {
      id: "fire",
      name: "篝火",
      icon: "🔥",
      desc: "炉火噼啪，温暖陪伴",
      defaultVol: 50,
      color: "#ff8a65"
    },
    {
      id: "white",
      name: "白噪音",
      icon: "〰️",
      desc: "纯净底噪，屏蔽干扰",
      defaultVol: 40,
      color: "#b0bec5"
    },
    {
      id: "brown",
      name: "棕噪音",
      icon: "🟤",
      desc: "低频深沉，辅助入睡",
      defaultVol: 45,
      color: "#a1887f"
    }
  ];

  // ─── Preset definitions ──────────────────────────────────────────────────────
  var PRESETS = {
    focus: { rain: 55, white: 45, wind: 20 },
    sleep:  { rain: 40, brown: 60, ocean: 30 },
    relax:  { ocean: 60, wind: 40, fire: 30 },
    nature: { rain: 50, wind: 55, ocean: 35 },
    clear:  {}
  };

  // ─── State variables ──────────────────────────────────────────────────────
  var audioCtx = null;
  var masterGain = null;
  var analyser = null;
  var isPlaying = false;
  var soundNodes = {};    // id -> { bufferSource/oscNode, gainNode, isOn }
  var soundStates = {};   // id -> { on: bool, vol: number }
  var masterVolVal = 80;
  var timerInterval = null;
  var timerEndTime = null;
  var activeTimerMin = null;
  var vizAnimId = null;
  var vizCanvas = null;
  var vizCtx = null;
  var vizDataArray = null;

  // ─── LocalStorage helpers ─────────────────────────────────────────────────
  function saveState() {
    var data = {
      masterVol: masterVolVal,
      sounds: soundStates
    };
    try { localStorage.setItem("wnmixer_state", JSON.stringify(data)); } catch(e) {}
  }

  function loadState() {
    try {
      var raw = localStorage.getItem("wnmixer_state");
      if (!raw) return null;
      return JSON.parse(raw);
    } catch(e) { return null; }
  }

  // ─── AudioContext init ────────────────────────────────────────────────────
  function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = masterVolVal / 100;

    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    vizDataArray = new Uint8Array(analyser.frequencyBinCount);

    masterGain.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  // ─── Noise generators ────────────────────────────────────────────────────
  function createWhiteNoiseBuffer(duration) {
    var sampleRate = audioCtx.sampleRate;
    var frameCount = sampleRate * duration;
    var buffer = audioCtx.createBuffer(1, frameCount, sampleRate);
    var data = buffer.getChannelData(0);
    for (var i = 0; i < frameCount; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    return buffer;
  }

  function createBrownNoiseBuffer(duration) {
    var sampleRate = audioCtx.sampleRate;
    var frameCount = sampleRate * duration;
    var buffer = audioCtx.createBuffer(1, frameCount, sampleRate);
    var data = buffer.getChannelData(0);
    var lastOut = 0;
    for (var i = 0; i < frameCount; i++) {
      var white = Math.random() * 2 - 1;
      data[i] = (lastOut + (0.02 * white)) / 1.02;
      lastOut = data[i];
      data[i] *= 3.5;
    }
    return buffer;
  }

  function createLoopSource(buffer) {
    var source = audioCtx.createBufferSource();
    source.buffer = buffer;
    source.loop = true;
    return source;
  }

  // ─── Rain synthesis ───────────────────────────────────────────────────────
  function createRainGraph(gainNode) {
    // Filtered white noise + low-frequency amplitude modulation for rain drops
    var noiseBuffer = createWhiteNoiseBuffer(4);
    var src = createLoopSource(noiseBuffer);

    var hipass = audioCtx.createBiquadFilter();
    hipass.type = "highpass";
    hipass.frequency.value = 400;

    var lopass = audioCtx.createBiquadFilter();
    lopass.type = "lowpass";
    lopass.frequency.value = 8000;

    // Modulation for "drop" effect
    var modGain = audioCtx.createGain();
    var lfo = audioCtx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 0.8;
    var lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.15;
    lfo.connect(lfoGain);
    lfoGain.connect(modGain.gain);
    modGain.gain.value = 0.85;
    lfo.start();

    src.connect(hipass);
    hipass.connect(lopass);
    lopass.connect(modGain);
    modGain.connect(gainNode);
    src.start();

    return { sources: [src, lfo], nodes: [hipass, lopass, modGain, lfoGain] };
  }

  // ─── Ocean synthesis ──────────────────────────────────────────────────────
  function createOceanGraph(gainNode) {
    var noiseBuffer = createWhiteNoiseBuffer(6);
    var src = createLoopSource(noiseBuffer);

    var lopass = audioCtx.createBiquadFilter();
    lopass.type = "lowpass";
    lopass.frequency.value = 700;
    lopass.Q.value = 1;

    var waveGain = audioCtx.createGain();
    var lfo = audioCtx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 0.12;
    var lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.45;
    lfo.connect(lfoGain);
    lfoGain.connect(waveGain.gain);
    waveGain.gain.value = 0.55;
    lfo.start();

    src.connect(lopass);
    lopass.connect(waveGain);
    waveGain.connect(gainNode);
    src.start();

    return { sources: [src, lfo], nodes: [lopass, waveGain, lfoGain] };
  }

  // ─── Wind synthesis ───────────────────────────────────────────────────────
  function createWindGraph(gainNode) {
    var noiseBuffer = createWhiteNoiseBuffer(5);
    var src = createLoopSource(noiseBuffer);

    var bandpass = audioCtx.createBiquadFilter();
    bandpass.type = "bandpass";
    bandpass.frequency.value = 600;
    bandpass.Q.value = 0.5;

    var waveGain = audioCtx.createGain();
    var lfo = audioCtx.createOscillator();
    lfo.type = "sine";
    lfo.frequency.value = 0.22;
    var lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.35;
    lfo.connect(lfoGain);
    lfoGain.connect(waveGain.gain);
    waveGain.gain.value = 0.65;
    lfo.start();

    // Second layer for gusts
    var noiseBuffer2 = createWhiteNoiseBuffer(3);
    var src2 = createLoopSource(noiseBuffer2);
    var hipass2 = audioCtx.createBiquadFilter();
    hipass2.type = "highpass";
    hipass2.frequency.value = 1200;
    var gustGain = audioCtx.createGain();
    gustGain.gain.value = 0.15;
    src2.connect(hipass2);
    hipass2.connect(gustGain);
    gustGain.connect(gainNode);
    src2.start();

    src.connect(bandpass);
    bandpass.connect(waveGain);
    waveGain.connect(gainNode);
    src.start();

    return { sources: [src, src2, lfo], nodes: [bandpass, waveGain, lfoGain, hipass2, gustGain] };
  }

  // ─── Fire synthesis ───────────────────────────────────────────────────────
  function createFireGraph(gainNode) {
    // Low-freq brown noise for crackling base
    var brownBuffer = createBrownNoiseBuffer(4);
    var src = createLoopSource(brownBuffer);

    var lopass = audioCtx.createBiquadFilter();
    lopass.type = "lowpass";
    lopass.frequency.value = 1200;

    // Random crackle using noise bursts
    var crackleGain = audioCtx.createGain();
    crackleGain.gain.value = 0.7;

    var lfo = audioCtx.createOscillator();
    lfo.type = "sawtooth";
    lfo.frequency.value = 1.8;
    var lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.08;
    lfo.connect(lfoGain);
    lfoGain.connect(crackleGain.gain);
    lfo.start();

    src.connect(lopass);
    lopass.connect(crackleGain);
    crackleGain.connect(gainNode);
    src.start();

    return { sources: [src, lfo], nodes: [lopass, crackleGain, lfoGain] };
  }

  // ─── White noise synthesis ────────────────────────────────────────────────
  function createWhiteGraph(gainNode) {
    var noiseBuffer = createWhiteNoiseBuffer(4);
    var src = createLoopSource(noiseBuffer);
    src.connect(gainNode);
    src.start();
    return { sources: [src], nodes: [] };
  }

  // ─── Brown noise synthesis ────────────────────────────────────────────────
  function createBrownGraph(gainNode) {
    var brownBuffer = createBrownNoiseBuffer(6);
    var src = createLoopSource(brownBuffer);
    var lopass = audioCtx.createBiquadFilter();
    lopass.type = "lowpass";
    lopass.frequency.value = 500;
    src.connect(lopass);
    lopass.connect(gainNode);
    src.start();
    return { sources: [src], nodes: [lopass] };
  }

  var SOUND_CREATORS = {
    rain:  createRainGraph,
    ocean: createOceanGraph,
    wind:  createWindGraph,
    fire:  createFireGraph,
    white: createWhiteGraph,
    brown: createBrownGraph
  };

  // ─── Start / stop individual sound ───────────────────────────────────────
  function startSound(id) {
    initAudio();
    if (audioCtx.state === "suspended") { audioCtx.resume(); }

    if (soundNodes[id] && soundNodes[id].running) {
      stopSound(id);
    }

    var gainNode = audioCtx.createGain();
    var vol = (soundStates[id] && soundStates[id].vol !== undefined)
      ? soundStates[id].vol
      : getDefaultVol(id);
    gainNode.gain.value = (vol / 100) * 0.8;
    gainNode.connect(masterGain);

    var creator = SOUND_CREATORS[id];
    var graph = creator(gainNode);

    soundNodes[id] = {
      gainNode: gainNode,
      graph: graph,
      running: true
    };
  }

  function stopSound(id) {
    var node = soundNodes[id];
    if (!node || !node.running) return;
    try {
      node.graph.sources.forEach(function(s) { try { s.stop(); } catch(e) {} });
      node.gainNode.disconnect();
    } catch(e) {}
    soundNodes[id] = { running: false };
  }

  function getDefaultVol(id) {
    for (var i = 0; i < SOUNDS.length; i++) {
      if (SOUNDS[i].id === id) return SOUNDS[i].defaultVol;
    }
    return 50;
  }

  // ─── Master play / pause ──────────────────────────────────────────────────
  function setMasterPlaying(playing) {
    isPlaying = playing;
    if (isPlaying) {
      initAudio();
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      SOUNDS.forEach(function(s) {
        if (soundStates[s.id] && soundStates[s.id].on) {
          startSound(s.id);
        }
      });
      startViz();
    } else {
      SOUNDS.forEach(function(s) { stopSound(s.id); });
      stopViz();
    }
    updateMasterUI();
  }

  function updateMasterUI() {
    var dot = document.getElementById("statusDot");
    var txt = document.getElementById("statusText");
    var icon = document.getElementById("playIcon");
    if (isPlaying) {
      dot.classList.add("active");
      txt.textContent = "播放中";
      icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    } else {
      dot.classList.remove("active");
      txt.textContent = "已暂停";
      icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    }
  }

  // ─── Volume updates ───────────────────────────────────────────────────────
  function setSoundVolume(id, vol) {
    if (!soundStates[id]) soundStates[id] = { on: false, vol: vol };
    soundStates[id].vol = vol;
    var node = soundNodes[id];
    if (node && node.running && node.gainNode) {
      node.gainNode.gain.setTargetAtTime((vol / 100) * 0.8, audioCtx.currentTime, 0.05);
    }
    saveState();
  }

  function setMasterVolume(vol) {
    masterVolVal = vol;
    if (masterGain) {
      masterGain.gain.setTargetAtTime(vol / 100, audioCtx.currentTime, 0.05);
    }
    saveState();
  }

  // ─── Toggle sound on/off ──────────────────────────────────────────────────
  function toggleSound(id, on) {
    if (!soundStates[id]) soundStates[id] = { on: false, vol: getDefaultVol(id) };
    soundStates[id].on = on;
    if (isPlaying) {
      if (on) startSound(id);
      else stopSound(id);
    }
    updateCardUI(id);
    saveState();
  }

  function updateCardUI(id) {
    var card = document.getElementById("card_" + id);
    if (!card) return;
    var st = soundStates[id];
    if (st && st.on) card.classList.add("on");
    else card.classList.remove("on");
    var slider = document.getElementById("vol_" + id);
    if (slider) slider.disabled = !(st && st.on);
  }

  // ─── Visualizer ──────────────────────────────────────────────────────────
  function startViz() {
    if (vizAnimId) return;
    function draw() {
      vizAnimId = requestAnimationFrame(draw);
      if (!analyser || !vizDataArray) return;
      analyser.getByteFrequencyData(vizDataArray);
      var w = vizCanvas.width;
      var h = vizCanvas.height;
      vizCtx.clearRect(0, 0, w, h);
      var barW = (w / vizDataArray.length) * 2.2;
      var x = 0;
      for (var i = 0; i < vizDataArray.length; i++) {
        var v = vizDataArray[i] / 255;
        var barH = v * h;
        var hue = 240 + v * 80;
        var alpha = 0.5 + v * 0.5;
        vizCtx.fillStyle = "hsla(" + hue + ", 80%, 65%, " + alpha + ")";
        vizCtx.fillRect(x, h - barH, barW - 1, barH);
        x += barW;
      }
    }
    draw();
  }

  function stopViz() {
    if (vizAnimId) { cancelAnimationFrame(vizAnimId); vizAnimId = null; }
    if (vizCtx && vizCanvas) {
      vizCtx.clearRect(0, 0, vizCanvas.width, vizCanvas.height);
    }
  }

  // ─── Timer ───────────────────────────────────────────────────────────────
  function setTimer(minutes) {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    timerEndTime = null;
    activeTimerMin = null;
    document.querySelectorAll(".timer-btn").forEach(function(b) { b.classList.remove("active"); });
    document.getElementById("timerCountdown").textContent = "";

    if (!minutes) return;

    activeTimerMin = minutes;
    timerEndTime = Date.now() + minutes * 60 * 1000;

    document.querySelectorAll(".timer-btn").forEach(function(b) {
      if (parseInt(b.dataset.min) === minutes) b.classList.add("active");
    });

    timerInterval = setInterval(function() {
      var remaining = timerEndTime - Date.now();
      if (remaining <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        document.getElementById("timerCountdown").textContent = "定时结束，已停止播放";
        document.querySelectorAll(".timer-btn").forEach(function(b) { b.classList.remove("active"); });
        setMasterPlaying(false);
        return;
      }
      var m = Math.floor(remaining / 60000);
      var s = Math.floor((remaining % 60000) / 1000);
      document.getElementById("timerCountdown").textContent =
        "剩余 " + m + " 分 " + (s < 10 ? "0" : "") + s + " 秒";
    }, 500);
  }

  // ─── Preset apply ────────────────────────────────────────────────────────
  function applyPreset(name) {
    var config = PRESETS[name];
    if (!config) return;

    // Turn all off first
    SOUNDS.forEach(function(s) {
      soundStates[s.id] = soundStates[s.id] || { on: false, vol: s.defaultVol };
      soundStates[s.id].on = false;
      stopSound(s.id);
      updateCardUI(s.id);
      var slider = document.getElementById("vol_" + s.id);
      if (slider) {
        slider.disabled = true;
        slider.value = soundStates[s.id].vol;
        document.getElementById("volval_" + s.id).textContent = soundStates[s.id].vol;
      }
      var toggle = document.getElementById("tog_" + s.id);
      if (toggle) toggle.checked = false;
    });

    // Apply preset
    Object.keys(config).forEach(function(id) {
      var vol = config[id];
      if (!soundStates[id]) soundStates[id] = { on: false, vol: vol };
      soundStates[id].on = true;
      soundStates[id].vol = vol;
      var slider = document.getElementById("vol_" + id);
      if (slider) {
        slider.value = vol;
        slider.disabled = false;
      }
      var volVal = document.getElementById("volval_" + id);
      if (volVal) volVal.textContent = vol;
      var toggle = document.getElementById("tog_" + id);
      if (toggle) toggle.checked = true;
      updateCardUI(id);
      if (isPlaying) startSound(id);
    });

    saveState();
  }

  // ─── Build UI ─────────────────────────────────────────────────────────────
  function buildCards() {
    var container = document.getElementById("cardsContainer");
    container.innerHTML = "";

    SOUNDS.forEach(function(s) {
      var st = soundStates[s.id] || { on: false, vol: s.defaultVol };

      var card = document.createElement("div");
      card.className = "card" + (st.on ? " on" : "");
      card.id = "card_" + s.id;

      card.innerHTML =
        '<div class="card-top">' +
          '<div class="card-icon">' + s.icon + '</div>' +
          '<div class="card-meta">' +
            '<div class="card-name">' + s.name + '</div>' +
            '<div class="card-desc">' + s.desc + '</div>' +
          '</div>' +
          '<label class="toggle" title="开关">' +
            '<input type="checkbox" id="tog_' + s.id + '"' + (st.on ? " checked" : "") + '>' +
            '<div class="toggle-track"></div>' +
          '</label>' +
        '</div>' +
        '<div class="vol-row">' +
          '<span class="vol-icon">🔈</span>' +
          '<input type="range" class="vol-slider" id="vol_' + s.id + '"' +
            ' min="0" max="100" value="' + st.vol + '"' +
            (st.on ? '' : ' disabled') + '>' +
          '<span class="vol-val" id="volval_' + s.id + '">' + st.vol + '</span>' +
        '</div>';

      container.appendChild(card);

      // Toggle event
      (function(id) {
        var togEl = document.getElementById("tog_" + id);
        togEl.addEventListener("change", function() {
          toggleSound(id, togEl.checked);
        });

        var volEl = document.getElementById("vol_" + id);
        volEl.addEventListener("input", function() {
          var v = parseInt(volEl.value);
          document.getElementById("volval_" + id).textContent = v;
          setSoundVolume(id, v);
        });
      })(s.id);
    });
  }

  // ─── Init ─────────────────────────────────────────────────────────────────
  function init() {
    // Canvas setup
    vizCanvas = document.getElementById("vizCanvas");
    vizCtx = vizCanvas.getContext("2d");
    var resizeCanvas = function() {
      vizCanvas.width = vizCanvas.offsetWidth;
      vizCanvas.height = vizCanvas.offsetHeight;
    };
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // Load saved state
    var saved = loadState();
    if (saved) {
      masterVolVal = saved.masterVol || 80;
      if (saved.sounds) {
        SOUNDS.forEach(function(s) {
          if (saved.sounds[s.id]) {
            soundStates[s.id] = {
              on: saved.sounds[s.id].on || false,
              vol: saved.sounds[s.id].vol !== undefined ? saved.sounds[s.id].vol : s.defaultVol
            };
          } else {
            soundStates[s.id] = { on: false, vol: s.defaultVol };
          }
        });
      } else {
        SOUNDS.forEach(function(s) {
          soundStates[s.id] = { on: false, vol: s.defaultVol };
        });
      }
    } else {
      SOUNDS.forEach(function(s) {
        soundStates[s.id] = { on: false, vol: s.defaultVol };
      });
    }

    // Master volume slider
    var mvSlider = document.getElementById("masterVol");
    mvSlider.value = masterVolVal;
    mvSlider.addEventListener("input", function() {
      setMasterVolume(parseInt(mvSlider.value));
    });

    // Master play button
    document.getElementById("masterPlayBtn").addEventListener("click", function() {
      setMasterPlaying(!isPlaying);
    });

    // Build cards
    buildCards();
    updateMasterUI();

    // Preset buttons
    document.querySelectorAll(".preset-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        applyPreset(btn.dataset.preset);
      });
    });

    // Timer buttons
    document.querySelectorAll(".timer-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        setTimer(parseInt(btn.dataset.min));
      });
    });
  }

  // ─── Kick off ─────────────────────────────────────────────────────────────
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
