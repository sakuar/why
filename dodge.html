<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>躲陨石</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a1a;
    --surface: #12122a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #e8e8f8;
    --muted: #7878a8;
    --glow: rgba(108,99,255,0.4);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.02em;
    transition: color 0.2s;
    z-index: 100;
  }
  .back-link:hover { color: var(--text); }

  .header {
    margin-top: 60px;
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 700;
    background: linear-gradient(135deg, #a78bfa, #6c63ff, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.05em;
  }
  .header p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
  }

  .score-bar {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .score-item {
    background: var(--surface);
    border: 1px solid rgba(108,99,255,0.25);
    border-radius: 12px;
    padding: 8px 20px;
    text-align: center;
    min-width: 90px;
  }
  .score-item .label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .score-item .value {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    line-height: 1.3;
  }
  .score-item .value.best { color: #fbbf24; }

  .canvas-wrap {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 0 40px var(--glow), 0 0 0 1px rgba(108,99,255,0.3);
  }

  #gameCanvas {
    display: block;
    background: #07071a;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(7,7,26,0.88);
    backdrop-filter: blur(6px);
    border-radius: 18px;
    gap: 16px;
    transition: opacity 0.3s;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }

  .overlay-title {
    font-size: clamp(24px, 6vw, 36px);
    font-weight: 800;
    background: linear-gradient(135deg, #a78bfa, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .overlay-sub {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    line-height: 1.7;
  }
  .overlay-score {
    font-size: 18px;
    color: var(--text);
    font-weight: 600;
  }
  .overlay-score span { color: var(--accent2); }

  .btn {
    background: linear-gradient(135deg, var(--accent), #38bdf8);
    border: none;
    border-radius: 50px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    padding: 12px 36px;
    cursor: pointer;
    letter-spacing: 0.04em;
    box-shadow: 0 4px 20px rgba(108,99,255,0.45);
    transition: transform 0.15s, box-shadow 0.15s;
    font-family: inherit;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(108,99,255,0.55); }
  .btn:active { transform: translateY(0); }

  .hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    margin-top: 10px;
  }

  @media (max-width: 500px) {
    .header { margin-top: 48px; margin-bottom: 12px; }
    .score-bar { gap: 12px; }
    .score-item { padding: 6px 14px; min-width: 76px; }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<div class="header">
  <h1>☄ 躲陨石</h1>
  <p>操控飞船，在陨石雨中生存</p>
</div>

<div class="score-bar">
  <div class="score-item">
    <div class="label">存活</div>
    <div class="value" id="scoreCur">0</div>
  </div>
  <div class="score-item">
    <div class="label">最高</div>
    <div class="value best" id="scoreBest">0</div>
  </div>
</div>

<div class="canvas-wrap">
  <canvas id="gameCanvas"></canvas>
  <div class="overlay" id="overlay">
    <div class="overlay-title" id="overlayTitle">躲陨石</div>
    <div class="overlay-sub" id="overlaySub">方向键 / 鼠标 / 触屏 控制飞船<br>躲避下落的陨石，存活即分数</div>
    <div class="overlay-score" id="overlayScore" style="display:none"></div>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>
</div>
<div class="hint">← → 方向键 / 鼠标移动 / 触屏拖动</div>

<script>
(function () {
  "use strict";

  /* ─── 常量 ─── */
  var SHIP_W = 36, SHIP_H = 28;
  var STAR_COUNT = 60;
  var BEST_KEY = "dodge_best";

  /* ─── DOM ─── */
  var canvas = document.getElementById("gameCanvas");
  var ctx = canvas.getContext("2d");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlayTitle");
  var overlaySub = document.getElementById("overlaySub");
  var overlayScore = document.getElementById("overlayScore");
  var startBtn = document.getElementById("startBtn");
  var scoreCurEl = document.getElementById("scoreCur");
  var scoreBestEl = document.getElementById("scoreBest");

  /* ─── 状态变量 ─── */
  var W, H;
  var running = false;
  var gameOver = false;
  var startTime = 0;
  var score = 0;
  var best = 0;
  var raf = 0;

  var shipX = 0;
  var targetX = 0;

  var meteors = [];
  var stars = [];
  var particles = [];

  var keyLeft = false;
  var keyRight = false;
  var mouseX = -1;

  var spawnInterval = 0;
  var spawnTimer = 0;
  var meteorSpeed = 0;
  var difficulty = 0;

  /* ─── 尺寸 ─── */
  function resize() {
    var maxW = Math.min(window.innerWidth - 24, 420);
    W = maxW;
    H = Math.min(window.innerHeight * 0.58, 560);
    H = Math.max(H, 340);
    canvas.width = W;
    canvas.height = H;
    if (!running && !gameOver) {
      shipX = W / 2;
      targetX = W / 2;
    }
  }

  /* ─── 星空 ─── */
  function initStars() {
    stars = [];
    for (var i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.2 + 0.3,
        alpha: Math.random() * 0.6 + 0.2,
        speed: Math.random() * 0.3 + 0.1
      });
    }
  }

  function drawStars(dt) {
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      s.y += s.speed * dt * 0.06;
      if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(200,210,255," + s.alpha + ")";
      ctx.fill();
    }
  }

  /* ─── 陨石 ─── */
  function spawnMeteor() {
    var size = Math.random() * 18 + 12;
    meteors.push({
      x: Math.random() * (W - size * 2) + size,
      y: -size - 10,
      r: size,
      speed: meteorSpeed * (Math.random() * 0.5 + 0.75),
      vx: (Math.random() - 0.5) * 1.2,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.04,
      color: pickMeteorColor()
    });
  }

  function pickMeteorColor() {
    var palette = ["#b45309","#92400e","#78350f","#c2410c","#9a3412","#7c2d12"];
    return palette[Math.floor(Math.random() * palette.length)];
  }

  function drawMeteor(m) {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.rot);

    // 发光
    var grd = ctx.createRadialGradient(0, 0, m.r * 0.1, 0, 0, m.r * 1.4);
    grd.addColorStop(0, "rgba(255,120,30,0.22)");
    grd.addColorStop(1, "rgba(255,80,0,0)");
    ctx.beginPath();
    ctx.arc(0, 0, m.r * 1.4, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();

    // 尾迹
    var trd = ctx.createLinearGradient(0, -m.r, 0, -m.r * 3.5);
    trd.addColorStop(0, "rgba(255,140,30,0.35)");
    trd.addColorStop(1, "rgba(255,60,0,0)");
    ctx.beginPath();
    ctx.ellipse(0, -m.r * 2.2, m.r * 0.35, m.r * 1.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = trd;
    ctx.fill();

    // 主体
    ctx.beginPath();
    ctx.arc(0, 0, m.r, 0, Math.PI * 2);
    var mg = ctx.createRadialGradient(-m.r * 0.3, -m.r * 0.3, m.r * 0.05, 0, 0, m.r);
    mg.addColorStop(0, "#e5a050");
    mg.addColorStop(0.5, m.color);
    mg.addColorStop(1, "#2d1a08");
    ctx.fillStyle = mg;
    ctx.fill();

    // 纹理点
    ctx.globalAlpha = 0.25;
    for (var d = 0; d < 4; d++) {
      var ang = d * 1.5;
      var dist = m.r * 0.45;
      ctx.beginPath();
      ctx.arc(Math.cos(ang) * dist, Math.sin(ang) * dist, m.r * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = "#1a0d04";
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* ─── 飞船 ─── */
  function drawShip(x, y) {
    ctx.save();
    ctx.translate(x, y);

    // 发动机光晕
    var eg = ctx.createRadialGradient(0, SHIP_H * 0.6, 0, 0, SHIP_H * 0.6, 18);
    eg.addColorStop(0, "rgba(96,165,250,0.9)");
    eg.addColorStop(0.4, "rgba(59,130,246,0.4)");
    eg.addColorStop(1, "rgba(59,130,246,0)");
    ctx.beginPath();
    ctx.arc(0, SHIP_H * 0.6, 18, 0, Math.PI * 2);
    ctx.fillStyle = eg;
    ctx.fill();

    // 火焰
    var fl = ctx.createLinearGradient(0, SHIP_H * 0.4, 0, SHIP_H + 14);
    fl.addColorStop(0, "rgba(96,165,250,1)");
    fl.addColorStop(0.4, "rgba(59,130,246,0.7)");
    fl.addColorStop(1, "rgba(16,24,80,0)");
    ctx.beginPath();
    ctx.moveTo(-7, SHIP_H * 0.4);
    ctx.quadraticCurveTo(0, SHIP_H + 14 + Math.sin(Date.now() * 0.02) * 4, 7, SHIP_H * 0.4);
    ctx.fillStyle = fl;
    ctx.fill();

    // 船体
    ctx.beginPath();
    ctx.moveTo(0, -SHIP_H * 0.5);
    ctx.bezierCurveTo(SHIP_W * 0.18, 0, SHIP_W * 0.5, SHIP_H * 0.3, SHIP_W * 0.45, SHIP_H * 0.5);
    ctx.lineTo(-SHIP_W * 0.45, SHIP_H * 0.5);
    ctx.bezierCurveTo(-SHIP_W * 0.5, SHIP_H * 0.3, -SHIP_W * 0.18, 0, 0, -SHIP_H * 0.5);
    var sg = ctx.createLinearGradient(-SHIP_W * 0.4, 0, SHIP_W * 0.4, 0);
    sg.addColorStop(0, "#4f46e5");
    sg.addColorStop(0.5, "#818cf8");
    sg.addColorStop(1, "#4f46e5");
    ctx.fillStyle = sg;
    ctx.fill();

    // 驾驶舱
    ctx.beginPath();
    ctx.ellipse(0, 0, SHIP_W * 0.18, SHIP_H * 0.22, 0, 0, Math.PI * 2);
    var cg = ctx.createRadialGradient(-3, -4, 1, 0, 0, SHIP_W * 0.18);
    cg.addColorStop(0, "#e0f2fe");
    cg.addColorStop(0.5, "#38bdf8");
    cg.addColorStop(1, "#0ea5e9");
    ctx.fillStyle = cg;
    ctx.fill();

    // 左右翼
    ctx.beginPath();
    ctx.moveTo(-SHIP_W * 0.4, SHIP_H * 0.3);
    ctx.lineTo(-SHIP_W * 0.7, SHIP_H * 0.6);
    ctx.lineTo(-SHIP_W * 0.35, SHIP_H * 0.55);
    ctx.closePath();
    ctx.fillStyle = "#6366f1";
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(SHIP_W * 0.4, SHIP_H * 0.3);
    ctx.lineTo(SHIP_W * 0.7, SHIP_H * 0.6);
    ctx.lineTo(SHIP_W * 0.35, SHIP_H * 0.55);
    ctx.closePath();
    ctx.fillStyle = "#6366f1";
    ctx.fill();

    ctx.restore();
  }

  /* ─── 粒子爆炸 ─── */
  function spawnExplosion(x, y) {
    for (var i = 0; i < 40; i++) {
      var ang = Math.random() * Math.PI * 2;
      var spd = Math.random() * 5 + 1.5;
      particles.push({
        x: x, y: y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        r: Math.random() * 5 + 2,
        alpha: 1,
        color: ["#f59e0b","#ef4444","#fbbf24","#fff","#6366f1"][Math.floor(Math.random()*5)],
        life: 1
      });
    }
  }

  function updateParticles(dt) {
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt * 0.06;
      p.y += p.vy * dt * 0.06;
      p.vy += 0.08 * dt * 0.06;
      p.life -= 0.022 * dt * 0.06;
      p.alpha = p.life;
      if (p.life <= 0) { particles.splice(i, 1); }
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      ctx.restore();
    }
  }

  /* ─── 碰撞 ─── */
  function checkCollision(m) {
    var sx = shipX;
    var sy = H - SHIP_H - 14;
    var dx = sx - m.x;
    var dy = sy - m.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    return dist < m.r * 0.72 + SHIP_W * 0.32;
  }

  /* ─── 游戏逻辑 ─── */
  function startGame() {
    meteors = [];
    particles = [];
    score = 0;
    running = true;
    gameOver = false;
    startTime = performance.now();
    shipX = W / 2;
    targetX = W / 2;
    mouseX = -1;
    keyLeft = false;
    keyRight = false;
    spawnInterval = 1800;
    spawnTimer = 0;
    meteorSpeed = 2.2;
    difficulty = 0;
    scoreCurEl.textContent = "0";
    overlay.classList.add("hidden");
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(loop);
  }

  var lastTime = 0;
  function loop(ts) {
    var dt = ts - lastTime;
    if (dt > 100) { dt = 100; }
    lastTime = ts;

    if (!running) { return; }

    // 难度递增
    difficulty = (ts - startTime) / 1000;
    spawnInterval = Math.max(300, 1800 - difficulty * 28);
    meteorSpeed = 2.2 + difficulty * 0.09;

    // 生成陨石
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer -= spawnInterval;
      spawnMeteor();
      if (difficulty > 10) { spawnMeteor(); }
    }

    // 飞船移动
    var shipY = H - SHIP_H - 14;
    var speed = 5.5 * (dt / 16.67);

    if (mouseX >= 0) {
      targetX = mouseX;
    } else {
      if (keyLeft) { targetX -= speed; }
      if (keyRight) { targetX += speed; }
    }
    targetX = Math.max(SHIP_W * 0.5 + 4, Math.min(W - SHIP_W * 0.5 - 4, targetX));
    shipX += (targetX - shipX) * 0.22 * (dt / 16.67);

    // 更新陨石
    var hit = false;
    for (var i = meteors.length - 1; i >= 0; i--) {
      var m = meteors[i];
      m.y += m.speed * (dt / 16.67);
      m.x += m.vx * (dt / 16.67);
      m.rot += m.rotSpeed * (dt / 16.67);
      if (m.y > H + m.r + 20) {
        meteors.splice(i, 1);
        continue;
      }
      if (!gameOver && checkCollision(m)) {
        hit = true;
        spawnExplosion(shipX, shipY);
        break;
      }
    }

    // 更新分数
    if (!gameOver) {
      score = Math.floor((performance.now() - startTime) / 100) / 10;
      scoreCurEl.textContent = score.toFixed(1) + "s";
    }

    // 绘制
    ctx.clearRect(0, 0, W, H);

    // 背景渐变
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#07071a");
    bg.addColorStop(1, "#0d0d26");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    drawStars(dt);
    updateParticles(dt);
    drawParticles();

    for (var j = 0; j < meteors.length; j++) {
      drawMeteor(meteors[j]);
    }

    if (!hit && !gameOver) {
      drawShip(shipX, shipY);
    }

    if (hit) {
      gameOver = true;
      running = false;
      endGame();
    }

    raf = requestAnimationFrame(loop);
  }

  function endGame() {
    var finalScore = score;
    if (finalScore > best) {
      best = finalScore;
      try { localStorage.setItem(BEST_KEY, best.toString()); } catch(e) {}
      scoreBestEl.textContent = best.toFixed(1) + "s";
    }
    overlayTitle.textContent = "游戏结束";
    overlaySub.textContent = "";
    overlayScore.style.display = "block";
    overlayScore.innerHTML = "本次存活 <span>" + finalScore.toFixed(1) + " 秒</span>" +
      (finalScore >= best ? "　🏆 新纪录！" : "　最高 " + best.toFixed(1) + " 秒");
    startBtn.textContent = "再来一局";
    overlay.classList.remove("hidden");

    // 继续渲染粒子动画
    var animParticles = function(ts2) {
      if (particles.length === 0) { return; }
      var dt2 = 16;
      ctx.clearRect(0, 0, W, H);
      var bg2 = ctx.createLinearGradient(0, 0, 0, H);
      bg2.addColorStop(0, "#07071a");
      bg2.addColorStop(1, "#0d0d26");
      ctx.fillStyle = bg2;
      ctx.fillRect(0, 0, W, H);
      drawStars(dt2);
      for (var j2 = 0; j2 < meteors.length; j2++) { drawMeteor(meteors[j2]); }
      updateParticles(dt2);
      drawParticles();
      requestAnimationFrame(animParticles);
    };
    requestAnimationFrame(animParticles);
  }

  /* ─── 输入 ─── */
  document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { keyLeft = true; }
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { keyRight = true; }
    if ((e.key === "Enter" || e.key === " ") && !running) { startGame(); }
  });

  document.addEventListener("keyup", function(e) {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { keyLeft = false; }
    if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { keyRight = false; }
  });

  canvas.addEventListener("mousemove", function(e) {
    var rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    targetX = mouseX;
  });

  canvas.addEventListener("mouseleave", function() {
    mouseX = -1;
  });

  canvas.addEventListener("touchstart", function(e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    mouseX = e.touches[0].clientX - rect.left;
    targetX = mouseX;
  }, { passive: false });

  canvas.addEventListener("touchmove", function(e) {
    e.preventDefault();
    var rect = canvas.getBoundingClientRect();
    mouseX = e.touches[0].clientX - rect.left;
    targetX = mouseX;
  }, { passive: false });

  canvas.addEventListener("touchend", function() {
    mouseX = -1;
  });

  startBtn.addEventListener("click", function() {
    startGame();
  });

  window.addEventListener("resize", function() {
    resize();
    initStars();
    if (!running) {
      ctx.clearRect(0, 0, W, H);
      var bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, "#07071a");
      bg.addColorStop(1, "#0d0d26");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);
      drawStars(0);
    }
  });

  /* ─── 初始化 ─── */
  (function init() {
    try {
      var saved = localStorage.getItem(BEST_KEY);
      if (saved) {
        best = parseFloat(saved) || 0;
        scoreBestEl.textContent = best.toFixed(1) + "s";
      }
    } catch(e) {}

    resize();
    initStars();

    // 绘制初始星空
    ctx.clearRect(0, 0, W, H);
    var bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, "#07071a");
    bg.addColorStop(1, "#0d0d26");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(200,210,255," + s.alpha + ")";
      ctx.fill();
    }

    overlayTitle.textContent = "躲陨石";
    overlaySub.innerHTML = "方向键 / 鼠标 / 触屏 控制飞船<br>躲避下落的陨石，存活即分数";
    overlayScore.style.display = "none";
    startBtn.textContent = "开始游戏";
    overlay.classList.remove("hidden");
  })();

})();
</script>
</body>
