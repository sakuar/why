<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>精确年龄</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0a1428;color:#e8eef7;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:46px 16px 60px;}
  .back{position:fixed;top:14px;left:16px;color:#6b6f8a;text-decoration:none;font-size:13px;}
  .back:hover{color:#56b6ff;}
  h1{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#56b6ff,#56cfaf);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{color:#8090a8;font-size:13px;margin:6px 0 18px;}
  input[type=date]{background:#161a28;border:1px solid #2a3550;border-radius:10px;color:#e8eef7;padding:11px 14px;font-size:15px;font-family:inherit;}
  .big{font-size:2.6rem;font-weight:800;margin:18px 0 4px;color:#7ed6ff;}
  .big small{font-size:1rem;color:#8090a8;font-weight:500;margin-left:4px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;width:100%;max-width:560px;margin-top:18px;}
  .card{background:#11192c;border:1px solid #223352;border-radius:14px;padding:16px;text-align:center;}
  .card .v{font-size:1.5rem;font-weight:700;color:#56cfaf;}
  .card .l{font-size:12px;color:#8090a8;margin-top:4px;}
  .next{margin-top:18px;color:#ffd166;font-size:14px;}
</style>
</head>
<body>
<a class="back" href="index.html">← 入口</a>
<h1>精确年龄</h1>
<p class="sub">选择你的出生日期，算到今天的每一天</p>
<input type="date" id="bd">
<div class="big" id="age">—</div>
<div class="grid" id="grid"></div>
<div class="next" id="next"></div>
<script>
"use strict";
(function(){
  var bd=document.getElementById("bd"),ageEl=document.getElementById("age"),grid=document.getElementById("grid"),nextEl=document.getElementById("next");
  function pad(n){return n<10?"0"+n:""+n;}
  var today=new Date();
  bd.max=today.getFullYear()+"-"+pad(today.getMonth()+1)+"-"+pad(today.getDate());
  bd.value="2000-01-01";
  function calc(){
    if(!bd.value){ageEl.textContent="—";grid.innerHTML="";nextEl.textContent="";return;}
    var b=new Date(bd.value+"T00:00:00");
    var now=new Date();
    if(b>now){ageEl.textContent="还没出生呢～";grid.innerHTML="";nextEl.textContent="";return;}
    var y=now.getFullYear()-b.getFullYear();
    var m=now.getMonth()-b.getMonth();
    var d=now.getDate()-b.getDate();
    if(d<0){m--;var pm=new Date(now.getFullYear(),now.getMonth(),0).getDate();d+=pm;}
    if(m<0){y--;m+=12;}
    ageEl.innerHTML=y+'<small>岁</small> '+m+'<small>月</small> '+d+'<small>天</small>';
    var ms=now-b;
    var days=Math.floor(ms/86400000);
    var hours=Math.floor(ms/3600000);
    var mins=Math.floor(ms/60000);
    var weeks=Math.floor(days/7);
    grid.innerHTML=
      card(days.toLocaleString(),"活过的天数")+
      card(weeks.toLocaleString(),"活过的周数")+
      card(hours.toLocaleString(),"活过的小时")+
      card(mins.toLocaleString(),"活过的分钟");
    // 下次生日
    var nb=new Date(now.getFullYear(),b.getMonth(),b.getDate());
    if(nb<now)nb=new Date(now.getFullYear()+1,b.getMonth(),b.getDate());
    var dd=Math.ceil((nb-now)/86400000);
    nextEl.textContent=dd===0?"🎂 今天就是你的生日，生日快乐！":"🎂 距离下个生日还有 "+dd+" 天";
  }
  function card(v,l){return '<div class="card"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';}
  bd.addEventListener("input",calc);
  calc();
})();
</script>
</body>
</html>
