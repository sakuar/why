<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>点的运动轨迹 · 点怎么走出曲线</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#070912;color:#e8eef7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  .wrap{width:100%;max-width:1240px;padding:0 18px;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px;}
  .top h1{font-size:18px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#ffd166,#56b6ff,#b98cff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .top .back{font-size:12px;color:#8090a8;text-decoration:none;border:1px solid #222840;border-radius:8px;padding:6px 11px;}
  .chips{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap;}
  .chip{flex:1;min-width:96px;display:flex;align-items:center;gap:7px;justify-content:center;font-size:13px;padding:11px 8px;border-radius:11px;background:#0e1322;border:1px solid #232c44;color:#aab6cc;cursor:pointer;transition:.14s;}
  .chip:hover{border-color:#3a445e;color:#e8eef7;}
  .chip.on{background:#6c63ff;border-color:#6c63ff;color:#fff;font-weight:700;}
  .work{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:stretch;}
  @media(max-width:780px){.work{grid-template-columns:1fr;}}
  #stage{position:relative;min-width:0;}
  canvas{width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 42%,#0e1426,#06070d 80%);border:1px solid #1c2236;border-radius:14px;touch-action:none;}
  .controls{background:#0e1322;border:1px solid #232c44;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;}
  .controls .ch{font-size:12px;color:#8090a8;font-weight:600;letter-spacing:1px;margin-bottom:12px;}
  .slider{margin-bottom:14px;}.slider:last-child{margin-bottom:0;}
  .slider .sl-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
  .slider .sl-top .nm{color:#cfd8ea;}.slider .sl-top .val{color:#56b6ff;font-weight:700;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#232c44;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;box-shadow:0 0 0 1px #6c63ff;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;}
  .btn{font-size:14px;padding:11px 16px;border-radius:10px;background:#6c63ff;border:1px solid #6c63ff;color:#fff;font-weight:700;cursor:pointer;width:100%;}
  .btn:hover{filter:brightness(1.08);}
  .hint{font-size:12px;color:#5a6680;line-height:1.6;border-top:1px solid #1a2138;padding-top:13px;}
  .info{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:780px){.info{grid-template-columns:1fr;}}
  .readout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;grid-column:1 / -1;}
  .readout .cell{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:14px 12px;text-align:center;}
  .readout .cell .k{font-size:11.5px;color:#8090a8;margin-bottom:6px;}
  .readout .cell .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:#56b6ff;}
  .readout .cell.ok .v{color:#56d6a8;font-size:16px;}
  .card{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:16px 18px;}
  .card .ttl{font-size:13px;font-weight:800;color:#ffd166;margin-bottom:9px;}
  .card .eq{font-size:17px;line-height:1.8;color:#e8eef7;font-family:"Cambria Math","Times New Roman",Georgia,serif;}
  .card .eq sup{font-size:62%;}.card .eq .hl{color:#ffd166;font-weight:700;}
  .card .nt{font-size:13.5px;color:#9aa6bd;line-height:1.8;}.card .nt b{color:#cdd6e8;}
  footer{color:#5a6680;font-size:12px;text-align:center;padding:22px 0 36px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>🧭 点的运动轨迹</h1><a class="back" href="index.html">← 返回</a></div>
  <div class="chips" id="chips"></div>
  <div class="work">
    <div id="stage"><canvas id="cv" width="900" height="540"></canvas></div>
    <div class="controls">
      <div><div class="ch">参数调节</div><div id="params"></div></div>
      <div class="slider"><div class="sl-top"><span class="nm">时间进度</span><span class="val" id="vT">100%</span></div>
        <input type="range" id="sT" min="0" max="1" step="0.005" value="1"></div>
      <button class="btn" id="bPlay">▶ 重新画一遍</button>
      <div class="hint" id="hint"></div>
    </div>
  </div>
  <div class="info">
    <div class="readout">
      <div class="cell"><div class="k">当前 x</div><div class="v" id="rx">—</div></div>
      <div class="cell"><div class="k">当前 y</div><div class="v" id="ry">—</div></div>
      <div class="cell ok"><div class="k">轨迹</div><div class="v" id="rname">—</div></div>
    </div>
    <div class="card"><div class="ttl">轨迹方程（参数式）</div><div class="eq" id="eq"></div></div>
    <div class="card"><div class="ttl">为什么是这条曲线</div><div class="nt" id="note"></div></div>
  </div>
  <footer>一个点按不同规律运动，留下的痕迹就是不同的曲线 · 纯前端单文件教学</footer>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
var W=900,H=540;
function fit(){var st=document.getElementById("stage");var cw=st.clientWidth||900;W=cw;H=Math.round(cw*0.60);if(H<320)H=320;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
var PI=Math.PI,Vw={ox:0,oy:0,s:40};
function fitView(x0,x1,y0,y1){var p=34,sx=(W-2*p)/(x1-x0),sy=(H-2*p)/(y1-y0),s=Math.min(sx,sy);Vw.s=s;Vw.ox=W/2-(x0+x1)/2*s;Vw.oy=H/2+(y0+y1)/2*s;}
function PX(x){return Vw.ox+x*Vw.s;}function PY(y){return Vw.oy-y*Vw.s;}
function axes(){ctx.strokeStyle="rgba(120,140,180,.10)";ctx.lineWidth=1;ctx.beginPath();
  var x0=Math.floor((-Vw.ox)/Vw.s),x1=Math.ceil((W-Vw.ox)/Vw.s),y0=Math.floor((Vw.oy-H)/Vw.s),y1=Math.ceil(Vw.oy/Vw.s);
  for(var x=x0;x<=x1;x++){ctx.moveTo(PX(x),0);ctx.lineTo(PX(x),H);}for(var y=y0;y<=y1;y++){ctx.moveTo(0,PY(y));ctx.lineTo(W,PY(y));}ctx.stroke();
  ctx.strokeStyle="rgba(150,170,210,.4)";ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,PY(0));ctx.lineTo(W,PY(0));ctx.moveTo(PX(0),0);ctx.lineTo(PX(0),H);ctx.stroke();}
function trace(fn,s0,s1,col,w){ctx.strokeStyle=col;ctx.lineWidth=w||3;ctx.beginPath();var n=200;
  for(var i=0;i<=n;i++){var s=s0+(s1-s0)*i/n,p=fn(s);if(i===0)ctx.moveTo(PX(p[0]),PY(p[1]));else ctx.lineTo(PX(p[0]),PY(p[1]));}ctx.stroke();}
function dotP(x,y,col,r){ctx.fillStyle=col;ctx.beginPath();ctx.arc(PX(x),PY(y),r||6,0,2*PI);ctx.fill();ctx.strokeStyle="rgba(0,0,0,.5)";ctx.lineWidth=1;ctx.stroke();}
function circP(cx,cy,r,col,w){ctx.strokeStyle=col;ctx.lineWidth=w||1.5;ctx.beginPath();ctx.arc(PX(cx),PY(cy),r*Vw.s,0,2*PI);ctx.stroke();}
function lineP(x1,y1,x2,y2,col,w,dash){ctx.strokeStyle=col;ctx.lineWidth=w||1.4;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(PX(x1),PY(y1));ctx.lineTo(PX(x2),PY(y2));ctx.stroke();ctx.setLineDash([]);}
var BLs="#56b6ff",YE="#ffd166",GR="#56d6a8",PU="#b98cff";
var idx=0,P={},T=1;

var CONCEPTS=[
{ id:"line",emoji:"📏",name:"直线",
  params:[{k:"k",label:"方向(斜率) k",min:-2,max:2,step:0.1,def:0.6}],
  pt:function(s){return [(-5+10*s), P.k*(-5+10*s)];},
  view:function(){return [-6,6,-5,5];},
  eq:function(){return 'x = t,　y = '+P.k.toFixed(1)+'·t　（方向不变）';},
  hint:"速度方向始终不变 → 走出直线。",
  note:'如果一个点的<b>运动方向始终不变</b>（匀速直线运动），它留下的痕迹就是一条<b>直线</b>。斜率 k 就是方向。',
  name:"直线"
},
{ id:"circle",emoji:"⭕",name:"圆",
  params:[{k:"r",label:"半径 r",min:1.5,max:4.5,step:0.5,def:3}],
  pt:function(s){var a=2*PI*s;return [P.r*Math.cos(a),P.r*Math.sin(a)];},
  view:function(){return [-5,5,-4.2,4.2];},
  eq:function(){return 'x = r·cos t,　y = r·sin t　（r = '+P.r.toFixed(1)+'）';},
  hint:"到一个定点的距离始终不变 → 走出圆。",
  note:'如果一个点<b>到某个定点（圆心）的距离始终不变</b>，它的轨迹就是<b>圆</b>。这正是圆的定义。',
  aux:function(){var a=2*PI*T,p=this.pt(1*Math.min(T,1));var cp=[P.r*Math.cos(a),P.r*Math.sin(a)];
    lineP(0,0,cp[0],cp[1],YE,1.4,[4,3]);dotP(0,0,"#e8eef7",4);},
  name:"圆"
},
{ id:"parabola",emoji:"🎯",name:"抛物线",
  params:[{k:"v",label:"水平初速 v",min:1,max:4,step:0.5,def:2.5},{k:"h",label:"初始高度 h",min:2,max:6,step:0.5,def:5}],
  pt:function(s){var T0=Math.sqrt(2*P.h/9.8),t=s*T0*3.13;return [P.v*t, P.h-0.5*9.8*t*t];},
  view:function(){return [-0.5,9,-0.5,7];},
  eq:function(){return 'x = v·t,　y = h − ½g·t²　→　平抛轨迹';},
  hint:"水平匀速 + 竖直加速下落 → 抛物线。",
  note:'平抛运动：水平方向<b>匀速</b>，竖直方向<b>越落越快</b>（重力加速）。两者合起来，轨迹是<b>抛物线</b>。投篮、喷泉、扔石头都是它。',
  aux:function(){lineP(-0.5,0,9,0,"rgba(120,140,180,.35)",1.5);},
  name:"抛物线"
},
{ id:"ellipse",emoji:"🥚",name:"椭圆",
  params:[{k:"a",label:"半轴 a",min:2,max:5,step:0.5,def:4},{k:"b",label:"半轴 b",min:1.5,max:4,step:0.5,def:2.5}],
  pt:function(s){var t=2*PI*s;return [P.a*Math.cos(t),P.b*Math.sin(t)];},
  view:function(){return [-6,6,-4.5,4.5];},
  eq:function(){return 'x = a·cos t,　y = b·sin t　（a='+P.a.toFixed(1)+', b='+P.b.toFixed(1)+'）';},
  hint:"到两个定点的距离之和不变 → 椭圆（行星轨道就是它）。",
  note:'椭圆 = 把圆在一个方向拉伸。它还有个定义：<b>到两个焦点的距离之和始终不变</b>。行星绕太阳就走椭圆。',
  aux:function(){var c=Math.sqrt(Math.max(0,P.a*P.a-P.b*P.b));dotP(c,0,YE,4);dotP(-c,0,YE,4);},
  name:"椭圆"
},
{ id:"cycloid",emoji:"🎡",name:"摆线",
  params:[{k:"R",label:"滚动圆半径 R",min:1,max:2.5,step:0.25,def:1.5}],
  pt:function(s){var ph=2*PI*s;return [P.R*(ph-Math.sin(ph)), P.R*(1-Math.cos(ph))];},
  view:function(){return [-0.5,2*PI*2.5+0.5,-0.5,5.5];},
  eq:function(){return 'x = R(φ − sinφ),　y = R(1 − cosφ)';},
  hint:"一个圆沿地面滚动，圆边上一点画出的曲线。",
  note:'让一个圆沿着地面<b>滚动一圈</b>，盯住圆边缘上的一个点 —— 它走出的拱形曲线叫<b>摆线</b>。它有个神奇性质：是「最速降线」（下滑最快的滑道形状）。',
  aux:function(){var ph=2*PI*Math.min(T,1);var cx=P.R*ph,cy=P.R;
    lineP(-0.5,0,2*PI*2.5,0,"rgba(120,140,180,.35)",1.5);
    circP(cx,cy,P.R,"rgba(255,209,102,.5)",1.5);dotP(cx,cy,"#8090a8",3);
    var px=P.R*(ph-Math.sin(ph)),py=P.R*(1-Math.cos(ph));lineP(cx,cy,px,py,YE,1.2,[3,3]);},
  name:"摆线"
}
];
function cur(){return CONCEPTS[idx];}
function buildChips(){var box=document.getElementById("chips");box.innerHTML="";
  CONCEPTS.forEach(function(c,i){var el=document.createElement("div");el.className="chip"+(i===idx?" on":"");el.innerHTML='<span>'+(c.id==="circle"?"⭕":c.emoji)+'</span>'+c.name;el.onclick=function(){idx=i;location.hash=c.id;load();};box.appendChild(el);});}
function buildParams(){var box=document.getElementById("params");box.innerHTML="";P={};
  cur().params.forEach(function(pp){P[pp.k]=pp.def;var w=document.createElement("div");w.className="slider";
    w.innerHTML='<div class="sl-top"><span class="nm">'+pp.label+'</span><span class="val" id="v_'+pp.k+'">'+pp.def.toFixed(1)+'</span></div><input type="range" id="r_'+pp.k+'" min="'+pp.min+'" max="'+pp.max+'" step="'+pp.step+'" value="'+pp.def+'">';
    box.appendChild(w);var inp=w.querySelector("input");
    inp.oninput=function(){P[pp.k]=parseFloat(inp.value);document.getElementById("v_"+pp.k).textContent=P[pp.k].toFixed(1);draw();};});}
function draw(){ctx.clearRect(0,0,W,H);var c=cur();var v=c.view();fitView(v[0],v[1],v[2],v[3]);axes();
  if(c.aux)c.aux();
  trace(function(s){return c.pt(s);},0,Math.max(0.0001,T),BLs,3);
  var p=c.pt(Math.min(T,1));dotP(p[0],p[1],GR,7);
  document.getElementById("eq").innerHTML=c.eq();document.getElementById("note").innerHTML=c.note;document.getElementById("hint").textContent=c.hint;
  document.getElementById("rx").textContent=p[0].toFixed(2);document.getElementById("ry").textContent=p[1].toFixed(2);document.getElementById("rname").textContent=c.name;}
function load(){buildChips();buildParams();T=1;document.getElementById("sT").value=1;document.getElementById("vT").textContent="100%";draw();}
document.getElementById("sT").oninput=function(){T=parseFloat(this.value);document.getElementById("vT").textContent=Math.round(T*100)+"%";draw();};
var anim=null;
function play(){if(anim)cancelAnimationFrame(anim);var t0=performance.now(),dur=2600,sT=document.getElementById("sT");
  (function step(now){var p=Math.min(1,(now-t0)/dur);T=p;sT.value=T;document.getElementById("vT").textContent=Math.round(T*100)+"%";draw();if(p<1)anim=requestAnimationFrame(step);else anim=null;})(t0);}
document.getElementById("bPlay").onclick=play;
window.addEventListener("resize",function(){fit();draw();});
(function(){var hs=(location.hash||"").replace("#","");for(var i=0;i<CONCEPTS.length;i++)if(CONCEPTS[i].id===hs)idx=i;})();
fit();load();setTimeout(play,350);
</script>
</body>
</html>
