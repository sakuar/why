<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健康计算器 - BMI 指数</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1a202c;
    --muted: #718096;
    --border: #e2e8f0;
    --thin: #4299e1;
    --normal: #48bb78;
    --overweight: #ed8936;
    --obese: #e53e3e;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }

  .back-link {
    display: inline-block;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 20px;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--text); }

  .container {
    max-width: 480px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }
  .header p {
    color: var(--muted);
    font-size: 14px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px;
    margin-bottom: 16px;
  }

  .input-group {
    margin-bottom: 20px;
  }
  .input-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .input-row input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 99px;
    background: var(--border);
    outline: none;
    cursor: pointer;
    transition: background 0.2s;
  }
  .input-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: #4a90e2;
    box-shadow: 0 2px 6px rgba(74,144,226,0.4);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .input-row input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }
  .input-row input[type="number"] {
    width: 72px;
    text-align: center;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 6px 8px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    background: #f7fafc;
  }
  .input-row input[type="number"]:focus {
    border-color: #4a90e2;
    background: #fff;
  }
  .input-unit {
    font-size: 13px;
    color: var(--muted);
    min-width: 24px;
  }

  .btn-calc {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #4a90e2, #357abd);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.5px;
  }
  .btn-calc:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(74,144,226,0.35);
  }
  .btn-calc:active {
    transform: translateY(0);
  }

  /* Result card */
  .result-card {
    display: none;
    animation: slideUp 0.35s ease;
  }
  .result-card.visible { display: block; }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .bmi-display {
    text-align: center;
    margin-bottom: 24px;
  }
  .bmi-value {
    font-size: 64px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    transition: color 0.4s;
  }
  .bmi-label {
    font-size: 18px;
    font-weight: 600;
    margin-top: 6px;
    transition: color 0.4s;
  }

  /* Scale bar */
  .scale-wrap {
    margin: 20px 0;
  }
  .scale-bar {
    position: relative;
    height: 14px;
    border-radius: 99px;
    background: linear-gradient(to right,
      #4299e1 0%, #4299e1 25%,
      #48bb78 25%, #48bb78 55%,
      #ed8936 55%, #ed8936 75%,
      #e53e3e 75%, #e53e3e 100%
    );
    margin-bottom: 8px;
    overflow: visible;
  }
  .scale-pointer {
    position: absolute;
    top: 50%;
    width: 22px;
    height: 22px;
    background: #fff;
    border: 3px solid #333;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: left 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    z-index: 2;
  }
  .scale-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    padding: 0 2px;
  }
  .scale-sections {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  .scale-section {
    flex: 1;
    text-align: center;
    font-size: 11px;
  }
  .scale-section:first-child { text-align: left; }
  .scale-section:last-child  { text-align: right; }

  /* Stats grid */
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-box {
    background: #f7fafc;
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .stat-box .stat-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 4px;
  }
  .stat-box .stat-value {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  /* Advice */
  .advice-box {
    background: #f0fff4;
    border-left: 4px solid #48bb78;
    border-radius: 0 10px 10px 0;
    padding: 14px 16px;
    font-size: 14px;
    line-height: 1.7;
    color: #2d3748;
    transition: background 0.4s, border-color 0.4s;
  }
  .advice-box.thin    { background: #ebf8ff; border-color: #4299e1; }
  .advice-box.normal  { background: #f0fff4; border-color: #48bb78; }
  .advice-box.over    { background: #fffaf0; border-color: #ed8936; }
  .advice-box.obese   { background: #fff5f5; border-color: #e53e3e; }

  .advice-title {
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 15px;
  }

  /* History */
  .history-card {}
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .history-header h3 {
    font-size: 15px;
    font-weight: 700;
  }
  .btn-clear {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-clear:hover { border-color: #e53e3e; color: #e53e3e; }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: #f7fafc;
    border-radius: 10px;
    font-size: 13px;
  }
  .history-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .history-info { flex: 1; color: var(--muted); }
  .history-bmi  { font-weight: 700; font-size: 15px; }
  .history-status { font-size: 12px; font-weight: 600; }

  .empty-tip {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 12px 0;
  }

  @media (max-width: 380px) {
    .bmi-value { font-size: 52px; }
    .stats-grid { grid-template-columns: 1fr; }
    .card { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← 入口</a>

  <div class="header">
    <h1>健康计算器</h1>
    <p>BMI 体质指数 · 了解你的健康状况</p>
  </div>

  <!-- Input card -->
  <div class="card">
    <div class="input-group">
      <label>身高</label>
      <div class="input-row">
        <input type="range" id="heightRange" min="100" max="220" value="170" step="1">
        <input type="number" id="heightNum" min="100" max="220" value="170">
        <span class="input-unit">cm</span>
      </div>
    </div>
    <div class="input-group">
      <label>体重</label>
      <div class="input-row">
        <input type="range" id="weightRange" min="30" max="200" value="65" step="0.5">
        <input type="number" id="weightNum" min="30" max="200" value="65" step="0.5">
        <span class="input-unit">kg</span>
      </div>
    </div>
    <button class="btn-calc" id="calcBtn">计算 BMI</button>
  </div>

  <!-- Result card -->
  <div class="card result-card" id="resultCard">
    <div class="bmi-display">
      <div class="bmi-value" id="bmiValue">--</div>
      <div class="bmi-label" id="bmiLabel">--</div>
    </div>

    <div class="scale-wrap">
      <div class="scale-bar">
        <div class="scale-pointer" id="scalePointer" style="left:0%"></div>
      </div>
      <div class="scale-labels">
        <span>14</span>
        <span>18.5</span>
        <span>24</span>
        <span>28</span>
        <span>40</span>
      </div>
      <div class="scale-sections">
        <div class="scale-section" style="color:#4299e1">偏瘦</div>
        <div class="scale-section" style="color:#48bb78">正常</div>
        <div class="scale-section" style="color:#ed8936">超重</div>
        <div class="scale-section" style="color:#e53e3e">肥胖</div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-label">理想体重下限</div>
        <div class="stat-value" id="idealMin">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">理想体重上限</div>
        <div class="stat-value" id="idealMax">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">当前体重</div>
        <div class="stat-value" id="currentWeight">--</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">与理想差值</div>
        <div class="stat-value" id="weightDiff">--</div>
      </div>
    </div>

    <div class="advice-box" id="adviceBox">
      <div class="advice-title" id="adviceTitle"></div>
      <div id="adviceText"></div>
    </div>
  </div>

  <!-- History card -->
  <div class="card history-card" id="historyCard">
    <div class="history-header">
      <h3>历史记录</h3>
      <button class="btn-clear" id="clearBtn">清空</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-tip">暂无记录，快来计算你的第一次 BMI 吧</div>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  // ── Constants ─────────────────────────────────────────────────────────────
  var STORAGE_KEY = "bmi_history";
  var BMI_SCALE_MIN = 14;
  var BMI_SCALE_MAX = 40;

  // ── Category config ───────────────────────────────────────────────────────
  var CATEGORIES = [
    {
      key: "thin",
      label: "偏瘦",
      color: "#4299e1",
      min: -Infinity,
      max: 18.5,
      adviceTitle: "体重偏轻，需要增重",
      advice: "你的BMI低于正常范围，建议适当增加高营养食物摄入，如蛋白质、全谷类和健康脂肪。规律进行力量训练有助于增加肌肉量。如持续体重偏低，请咨询医生排查潜在健康问题。"
    },
    {
      key: "normal",
      label: "体重正常",
      color: "#48bb78",
      min: 18.5,
      max: 24,
      adviceTitle: "体重正常，继续保持",
      advice: "恭喜！你的体重处于健康范围内。保持均衡饮食和规律运动，每周至少 150 分钟中等强度有氧运动。保持良好的生活习惯，定期体检，维护长期健康。"
    },
    {
      key: "over",
      label: "超重",
      color: "#ed8936",
      min: 24,
      max: 28,
      adviceTitle: "体重超标，建议控制",
      advice: "你的BMI略高于正常范围。建议适当减少高热量食物和含糖饮料的摄入，增加蔬菜水果比例。每天坚持 30 分钟以上的有氧运动，如快走、游泳或骑车。循序渐进地减重，每月减少 1-2 kg 为宜。"
    },
    {
      key: "obese",
      label: "肥胖",
      color: "#e53e3e",
      min: 28,
      max: Infinity,
      adviceTitle: "肥胖风险，请重视健康",
      advice: "你的BMI已达到肥胖范围，可能面临高血压、糖尿病、心脏病等风险。强烈建议寻求专业营养师和医生的指导，制定科学的减重计划。同时需要从饮食和运动两方面入手，配合定期健康检查。"
    }
  ];

  // ── DOM refs ──────────────────────────────────────────────────────────────
  var heightRange  = document.getElementById("heightRange");
  var heightNum    = document.getElementById("heightNum");
  var weightRange  = document.getElementById("weightRange");
  var weightNum    = document.getElementById("weightNum");
  var calcBtn      = document.getElementById("calcBtn");
  var resultCard   = document.getElementById("resultCard");
  var bmiValue     = document.getElementById("bmiValue");
  var bmiLabel     = document.getElementById("bmiLabel");
  var scalePointer = document.getElementById("scalePointer");
  var idealMin     = document.getElementById("idealMin");
  var idealMax     = document.getElementById("idealMax");
  var currentWeight = document.getElementById("currentWeight");
  var weightDiff   = document.getElementById("weightDiff");
  var adviceBox    = document.getElementById("adviceBox");
  var adviceTitle  = document.getElementById("adviceTitle");
  var adviceText   = document.getElementById("adviceText");
  var historyList  = document.getElementById("historyList");
  var clearBtn     = document.getElementById("clearBtn");

  // ── Helpers ───────────────────────────────────────────────────────────────
  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function getCategory(bmi) {
    for (var i = 0; i < CATEGORIES.length; i++) {
      if (bmi >= CATEGORIES[i].min && bmi < CATEGORIES[i].max) {
        return CATEGORIES[i];
      }
    }
    return CATEGORIES[CATEGORIES.length - 1];
  }

  function bmiToPercent(bmi) {
    var pct = (clamp(bmi, BMI_SCALE_MIN, BMI_SCALE_MAX) - BMI_SCALE_MIN) / (BMI_SCALE_MAX - BMI_SCALE_MIN) * 100;
    return pct;
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveHistory(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch (e) {}
  }

  function formatDate(ts) {
    var d = new Date(ts);
    var pad = function(n) { return n < 10 ? "0" + n : "" + n; };
    return pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  // ── Render history ────────────────────────────────────────────────────────
  function renderHistory() {
    var list = loadHistory();
    if (list.length === 0) {
      historyList.innerHTML = '<div class="empty-tip">暂无记录，快来计算你的第一次 BMI 吧</div>';
      return;
    }
    var html = "";
    for (var i = list.length - 1; i >= 0 && i >= list.length - 8; i--) {
      var item = list[i];
      var cat = getCategory(item.bmi);
      html += '<div class="history-item">'
        + '<div class="history-dot" style="background:' + cat.color + '"></div>'
        + '<div class="history-info">'
        +   '<span>' + item.height + ' cm &nbsp;/&nbsp; ' + item.weight + ' kg</span><br>'
        +   '<span style="font-size:11px">' + formatDate(item.ts) + '</span>'
        + '</div>'
        + '<div style="text-align:right">'
        +   '<div class="history-bmi" style="color:' + cat.color + '">' + item.bmi + '</div>'
        +   '<div class="history-status" style="color:' + cat.color + '">' + cat.label + '</div>'
        + '</div>'
        + '</div>';
    }
    historyList.innerHTML = html;
  }

  // ── Main calculate ────────────────────────────────────────────────────────
  function calculate() {
    var h = parseFloat(heightNum.value);
    var w = parseFloat(weightNum.value);

    if (isNaN(h) || isNaN(w) || h <= 0 || w <= 0) return;

    var hm = h / 100;
    var bmi = Math.round((w / (hm * hm)) * 10) / 10;
    var cat = getCategory(bmi);

    // BMI display
    bmiValue.textContent = bmi.toFixed(1);
    bmiValue.style.color = cat.color;
    bmiLabel.textContent = cat.label;
    bmiLabel.style.color = cat.color;

    // Pointer
    var pct = bmiToPercent(bmi);
    scalePointer.style.left = pct + "%";

    // Ideal weight (BMI 18.5 ~ 24)
    var iMin = Math.round(18.5 * hm * hm * 10) / 10;
    var iMax = Math.round(24   * hm * hm * 10) / 10;
    idealMin.textContent = iMin + " kg";
    idealMax.textContent = iMax + " kg";
    currentWeight.textContent = w + " kg";

    var midIdeal = (iMin + iMax) / 2;
    var diff = Math.round((w - midIdeal) * 10) / 10;
    if (diff > 0) {
      weightDiff.textContent = "+" + diff + " kg";
      weightDiff.style.color = "#e53e3e";
    } else if (diff < 0) {
      weightDiff.textContent = diff + " kg";
      weightDiff.style.color = "#4299e1";
    } else {
      weightDiff.textContent = "0 kg";
      weightDiff.style.color = "#48bb78";
    }

    // Advice
    adviceBox.className = "advice-box " + cat.key;
    adviceTitle.textContent = cat.adviceTitle;
    adviceText.textContent = cat.advice;

    // Show result
    resultCard.classList.add("visible");

    // Save history
    var list = loadHistory();
    list.push({ height: h, weight: w, bmi: bmi.toFixed(1), ts: Date.now() });
    if (list.length > 50) list = list.slice(list.length - 50);
    saveHistory(list);
    renderHistory();
  }

  // ── Sync range <-> number ─────────────────────────────────────────────────
  function syncHeight(src) {
    var v = parseFloat(src.value);
    if (isNaN(v)) return;
    v = clamp(v, 100, 220);
    heightRange.value = v;
    heightNum.value = v;
  }

  function syncWeight(src) {
    var v = parseFloat(src.value);
    if (isNaN(v)) return;
    v = clamp(v, 30, 200);
    weightRange.value = v;
    weightNum.value = v;
  }

  // ── Restore last inputs ───────────────────────────────────────────────────
  function restoreInputs() {
    var list = loadHistory();
    if (list.length > 0) {
      var last = list[list.length - 1];
      heightNum.value = last.height;
      heightRange.value = last.height;
      weightNum.value = last.weight;
      weightRange.value = last.weight;
    }
  }

  // ── Event listeners ───────────────────────────────────────────────────────
  heightRange.addEventListener("input", function() { syncHeight(heightRange); });
  heightNum.addEventListener("input",   function() { syncHeight(heightNum); });
  weightRange.addEventListener("input", function() { syncWeight(weightRange); });
  weightNum.addEventListener("input",   function() { syncWeight(weightNum); });

  calcBtn.addEventListener("click", calculate);

  clearBtn.addEventListener("click", function() {
    saveHistory([]);
    renderHistory();
  });

  // Allow Enter key
  document.addEventListener("keydown", function(e) {
    if (e.key === "Enter") { calculate(); }
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  restoreInputs();
  renderHistory();

})();
</script>
</body>
</html>
