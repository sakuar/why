<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>熔岩灯</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0a0a0f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #back {
    position: fixed;
    top: 14px; left: 16px;
    z-index: 100;
    color: rgba(255,255,255,0.35);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.02em;
    transition: color 0.3s;
  }
  #back:hover { color: rgba(255,255,255,0.75); }
  #canvas {
    display: block;
    width: 100vw; height: 100vh;
    cursor: pointer;
  }
  #hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.28);
    font-size: 12px;
    letter-spacing: 0.05em;
    pointer-events: none;
    transition: opacity 1s;
    white-space: nowrap;
  }
  #palette-label {
    position: fixed;
    bottom: 44px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.45);
    font-size: 13px;
    letter-spacing: 0.08em;
    pointer-events: none;
    transition: opacity 0.6s;
    white-space: nowrap;
  }
</style>
</head>
<body>
<a id="back" href="index.html">← 入口</a>
<canvas id="canvas"></canvas>
<div id="palette-label"></div>
<div id="hint">点击切换配色</div>

<script>
(function() {
  "use strict";

  // ── 配色方案 ──────────────────────────────────────────────
  const PALETTES = [
    {
      name: "熔岩橙红",
      bg: "#0d0608",
      colors: ["#ff4500","#ff6a00","#ee0979","#ff6b6b","#ffa07a","#c0392b"]
    },
    {
      name: "极光青紫",
      bg: "#040d14",
      colors: ["#00d2ff","#7b2ff7","#00f2fe","#4facfe","#a18cd1","#30cfd0"]
    },
    {
      name: "翡翠森林",
      bg: "#03100a",
      colors: ["#00c853","#69f0ae","#1de9b6","#00bfa5","#76ff03","#43a047"]
    },
    {
      name: "糖果粉霓",
      bg: "#0f050f",
      colors: ["#f953c6","#b91d73","#ff758c","#ff7eb3","#e96dcc","#c471ed"]
    },
    {
      name: "深海蓝金",
      bg: "#020912",
      colors: ["#f7971e","#ffd200","#ffecd2","#fcb69f","#4e54c8","#8f94fb"]
    }
  ];

  // ── 状态 ──────────────────────────────────────────────────
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const hintEl = document.getElementById("hint");
  const labelEl = document.getElementById("palette-label");

  let W = 0, H = 0;
  let paletteIndex = 0;
  let blobs = [];
  let animId = null;
  let hintTimer = null;

  // metaball 分辨率缩放（性能 vs 质量）
  const SCALE = 0.35;
  let offW = 0, offH = 0;
  let offCanvas = null;
  let offCtx = null;
  let imageData = null;

  // ── localStorage ──────────────────────────────────────────
  function loadState() {
    try {
      var saved = localStorage.getItem("lavaLampPalette");
      if (saved !== null) {
        var idx = parseInt(saved, 10);
        if (!isNaN(idx) && idx >= 0 && idx < PALETTES.length) {
          paletteIndex = idx;
        }
      }
    } catch(e) {}
  }

  function saveState() {
    try {
      localStorage.setItem("lavaLampPalette", String(paletteIndex));
    } catch(e) {}
  }

  // ── 颜色工具 ──────────────────────────────────────────────
  function hexToRgb(hex) {
    var r = parseInt(hex.slice(1,3),16);
    var g = parseInt(hex.slice(3,5),16);
    var b = parseInt(hex.slice(5,7),16);
    return [r,g,b];
  }

  function lerpColor(c1, c2, t) {
    return [
      Math.round(c1[0] + (c2[0]-c1[0])*t),
      Math.round(c1[1] + (c2[1]-c1[1])*t),
      Math.round(c1[2] + (c2[2]-c1[2])*t)
    ];
  }

  // ── Blob 类 ───────────────────────────────────────────────
  function Blob(x, y, r, colorA, colorB) {
    this.x = x;
    this.y = y;
    this.r = r;
    this.colorA = colorA; // [r,g,b]
    this.colorB = colorB;
    this.colorT = Math.random();
    this.colorSpeed = (Math.random() * 0.003 + 0.001) * (Math.random()<0.5?1:-1);
    // 浮动参数
    this.baseY = y;
    this.vy = (Math.random() * 0.4 + 0.2) * (Math.random()<0.5?1:-1);
    this.vx = (Math.random() * 0.15 - 0.075);
    this.ax = 0; this.ay = 0;
    // 相位，让每个blob节律不同
    this.phase = Math.random() * Math.PI * 2;
    this.phaseSpeed = Math.random() * 0.008 + 0.004;
    this.wobbleAmp = Math.random() * 0.18 + 0.05;
    // 半径脉动
    this.rBase = r;
    this.rPhase = Math.random() * Math.PI * 2;
    this.rSpeed = Math.random() * 0.012 + 0.005;
  }

  Blob.prototype.update = function(dt) {
    this.phase += this.phaseSpeed * dt;
    this.rPhase += this.rSpeed * dt;
    // 浮力：向中心Y有轻微回弹，加sinusoidal扰动
    var centerY = H * 0.5;
    var dist = this.y - centerY;
    this.ay = -dist * 0.00008 + Math.sin(this.phase) * this.wobbleAmp;
    this.ax = -this.x * 0.00004 + (W*0.5 - this.x) * 0.00003;
    this.vy += this.ay * dt;
    this.vx += this.ax * dt;
    // 阻尼
    this.vy *= 0.998;
    this.vx *= 0.995;
    // 速度限制
    var maxV = 1.2;
    if (Math.abs(this.vy) > maxV) this.vy = maxV * Math.sign(this.vy);
    if (Math.abs(this.vx) > maxV * 0.4) this.vx = maxV * 0.4 * Math.sign(this.vx);
    this.y += this.vy * dt;
    this.x += this.vx * dt;
    // 边界弹回
    var margin = this.r * 0.5;
    if (this.y < margin) { this.y = margin; this.vy = Math.abs(this.vy) * 0.6; }
    if (this.y > H - margin) { this.y = H - margin; this.vy = -Math.abs(this.vy) * 0.6; }
    if (this.x < margin) { this.x = margin; this.vx = Math.abs(this.vx) * 0.5; }
    if (this.x > W - margin) { this.x = W - margin; this.vx = -Math.abs(this.vx) * 0.5; }
    // 颜色渐变
    this.colorT += this.colorSpeed * dt;
    if (this.colorT > 1) { this.colorT = 1; this.colorSpeed *= -1; }
    if (this.colorT < 0) { this.colorT = 0; this.colorSpeed *= -1; }
    // 半径脉动
    this.r = this.rBase * (1 + 0.08 * Math.sin(this.rPhase));
  };

  Blob.prototype.color = function() {
    return lerpColor(this.colorA, this.colorB, this.colorT);
  };

  // ── 初始化 blobs ──────────────────────────────────────────
  function createBlobs() {
    blobs = [];
    var palette = PALETTES[paletteIndex];
    var cols = palette.colors.map(hexToRgb);
    var count = 7;
    for (var i = 0; i < count; i++) {
      var r = Math.random() * (Math.min(W,H) * 0.12) + Math.min(W,H) * 0.06;
      var x = Math.random() * W * 0.7 + W * 0.15;
      var y = Math.random() * H * 0.7 + H * 0.15;
      var ci1 = Math.floor(Math.random() * cols.length);
      var ci2 = (ci1 + 1 + Math.floor(Math.random() * (cols.length-1))) % cols.length;
      blobs.push(new Blob(x, y, r, cols[ci1], cols[ci2]));
    }
  }

  // ── 离屏 canvas（metaball 计算用） ────────────────────────
  function initOffscreen() {
    offW = Math.floor(W * SCALE);
    offH = Math.floor(H * SCALE);
    offCanvas = document.createElement("canvas");
    offCanvas.width = offW;
    offCanvas.height = offH;
    offCtx = offCanvas.getContext("2d");
    imageData = offCtx.createImageData(offW, offH);
  }

  // ── metaball 渲染 ─────────────────────────────────────────
  function renderMetaballs() {
    var data = imageData.data;
    var threshold = 1.0;
    var bgRgb = hexToRgb(PALETTES[paletteIndex].bg);

    for (var py = 0; py < offH; py++) {
      for (var px = 0; px < offW; px++) {
        var wx = px / SCALE;
        var wy = py / SCALE;
        var sum = 0;
        // 加权颜色累加
        var wr = 0, wg = 0, wb = 0;

        for (var k = 0; k < blobs.length; k++) {
          var b = blobs[k];
          var dx = wx - b.x;
          var dy = wy - b.y;
          var d2 = dx*dx + dy*dy;
          var r2 = b.r * b.r;
          if (d2 < 1e-4) d2 = 1e-4;
          var w = r2 / d2;
          sum += w;
          var c = b.color();
          wr += c[0] * w;
          wg += c[1] * w;
          wb += c[2] * w;
        }

        var idx = (py * offW + px) * 4;
        if (sum >= threshold) {
          // 归一化颜色
          var inv = 1 / sum;
          var t = Math.min((sum - threshold) / threshold * 2.5, 1);
          // 边缘柔化
          var cr = Math.round(wr * inv);
          var cg = Math.round(wg * inv);
          var cb = Math.round(wb * inv);
          // 与背景混合（边缘淡入）
          data[idx]   = Math.round(bgRgb[0] + (cr - bgRgb[0]) * t);
          data[idx+1] = Math.round(bgRgb[1] + (cg - bgRgb[1]) * t);
          data[idx+2] = Math.round(bgRgb[2] + (cb - bgRgb[2]) * t);
          data[idx+3] = 255;
        } else {
          // 背景：带微弱辉光
          var glow = Math.min(sum / threshold, 1.0);
          glow = glow * glow * 0.35;
          // 找最近blob的颜色做辉光
          var maxW = 0; var glowC = [0,0,0];
          for (var m = 0; m < blobs.length; m++) {
            var dx2 = wx - blobs[m].x;
            var dy2 = wy - blobs[m].y;
            var d22 = dx2*dx2 + dy2*dy2;
            var w2 = blobs[m].r * blobs[m].r / (d22 < 1e-4 ? 1e-4 : d22);
            if (w2 > maxW) { maxW = w2; glowC = blobs[m].color(); }
          }
          data[idx]   = Math.round(bgRgb[0] + (glowC[0] - bgRgb[0]) * glow);
          data[idx+1] = Math.round(bgRgb[1] + (glowC[1] - bgRgb[1]) * glow);
          data[idx+2] = Math.round(bgRgb[2] + (glowC[2] - bgRgb[2]) * glow);
          data[idx+3] = 255;
        }
      }
    }

    offCtx.putImageData(imageData, 0, 0);
    ctx.drawImage(offCanvas, 0, 0, W, H);
  }

  // ── 高光叠加（让灯柱感更强）────────────────────────────────
  function renderOverlay() {
    // 竖向渐变遮罩，模拟灯管玻璃反光
    var grd = ctx.createLinearGradient(0, 0, W, 0);
    grd.addColorStop(0,   "rgba(255,255,255,0.04)");
    grd.addColorStop(0.1, "rgba(255,255,255,0.10)");
    grd.addColorStop(0.18,"rgba(255,255,255,0.03)");
    grd.addColorStop(0.5, "rgba(255,255,255,0.00)");
    grd.addColorStop(0.82,"rgba(255,255,255,0.02)");
    grd.addColorStop(0.9, "rgba(255,255,255,0.07)");
    grd.addColorStop(1,   "rgba(255,255,255,0.03)");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    // 顶部和底部热辐射渐变
    var topGrd = ctx.createLinearGradient(0, 0, 0, H*0.15);
    topGrd.addColorStop(0, "rgba(255,200,100,0.12)");
    topGrd.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = topGrd;
    ctx.fillRect(0, 0, W, H*0.15);

    var botGrd = ctx.createLinearGradient(0, H, 0, H*0.85);
    botGrd.addColorStop(0, "rgba(255,120,50,0.10)");
    botGrd.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = botGrd;
    ctx.fillRect(0, H*0.85, W, H*0.15);

    // 灯柱左右黑边遮罩（瓶形感）
    var edgeW = W * 0.06;
    var leftEdge = ctx.createLinearGradient(0, 0, edgeW, 0);
    leftEdge.addColorStop(0, "rgba(0,0,0,0.55)");
    leftEdge.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = leftEdge;
    ctx.fillRect(0, 0, edgeW, H);

    var rightEdge = ctx.createLinearGradient(W, 0, W-edgeW, 0);
    rightEdge.addColorStop(0, "rgba(0,0,0,0.55)");
    rightEdge.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = rightEdge;
    ctx.fillRect(W-edgeW, 0, edgeW, H);
  }

  // ── 主循环 ────────────────────────────────────────────────
  var lastTime = 0;
  function loop(ts) {
    var dt = Math.min((ts - lastTime) / 16.67, 3);
    lastTime = ts;
    if (dt < 0) dt = 1;

    for (var i = 0; i < blobs.length; i++) {
      blobs[i].update(dt);
    }

    renderMetaballs();
    renderOverlay();

    animId = requestAnimationFrame(loop);
  }

  // ── 切换配色 ──────────────────────────────────────────────
  function switchPalette() {
    paletteIndex = (paletteIndex + 1) % PALETTES.length;
    saveState();
    var name = PALETTES[paletteIndex].name;
    labelEl.textContent = name;
    labelEl.style.opacity = "1";
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function() {
      labelEl.style.opacity = "0";
    }, 2000);
    // 重新分配颜色给已有 blobs（平滑过渡效果）
    var cols = PALETTES[paletteIndex].colors.map(hexToRgb);
    for (var i = 0; i < blobs.length; i++) {
      var ci1 = Math.floor(Math.random() * cols.length);
      var ci2 = (ci1 + 1 + Math.floor(Math.random() * (cols.length-1))) % cols.length;
      blobs[i].colorA = cols[ci1];
      blobs[i].colorB = cols[ci2];
    }
  }

  // ── resize ────────────────────────────────────────────────
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    initOffscreen();
  }

  // ── 事件绑定 ──────────────────────────────────────────────
  canvas.addEventListener("click", switchPalette);
  canvas.addEventListener("touchend", function(e) {
    e.preventDefault();
    switchPalette();
  }, { passive: false });

  window.addEventListener("resize", function() {
    resize();
    // 重新分配 blob 位置到新尺寸范围内
    for (var i = 0; i < blobs.length; i++) {
      if (blobs[i].x > W) blobs[i].x = W * Math.random();
      if (blobs[i].y > H) blobs[i].y = H * Math.random();
    }
  });

  // ── 隐藏提示 ─────────────────────────────────────────────
  setTimeout(function() {
    hintEl.style.opacity = "0";
  }, 3500);

  // ── 启动 ─────────────────────────────────────────────────
  loadState();
  resize();
  createBlobs();
  labelEl.style.opacity = "0";
  animId = requestAnimationFrame(loop);

})();
</script>
</body>
</html>
