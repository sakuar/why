<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回文大师</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #16213e;
    --accent: #7c3aed;
    --accent2: #a855f7;
    --accent3: #c084fc;
    --gold: #f59e0b;
    --gold2: #fcd34d;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --success: #10b981;
    --fail: #f43f5e;
    --border: rgba(124, 58, 237, 0.25);
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    line-height: 1.6;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    color: var(--text3);
    text-decoration: none;
    font-size: 13px;
    z-index: 100;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--text2); }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 20px 60px;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }
  .header-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 12px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .header h1 {
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent3), var(--gold2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .header p {
    color: var(--text2);
    font-size: 14px;
    margin-top: 6px;
  }

  /* Input Section */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }

  .input-label {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .input-label span { font-size: 16px; }

  .input-wrapper {
    position: relative;
  }
  #main-input {
    width: 100%;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    color: var(--text);
    font-size: 18px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    resize: vertical;
    min-height: 80px;
    letter-spacing: 0.5px;
  }
  #main-input::placeholder { color: var(--text3); }
  #main-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
  }
  #main-input.is-palindrome {
    border-color: var(--success);
    box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
  }
  #main-input.not-palindrome {
    border-color: var(--fail);
    box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.1);
  }

  .char-count {
    text-align: right;
    font-size: 12px;
    color: var(--text3);
    margin-top: 6px;
  }

  /* Result Badge */
  .result-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    margin-top: 16px;
    transition: all 0.4s ease;
    min-height: 52px;
  }
  .result-badge.empty {
    background: rgba(255,255,255,0.03);
    color: var(--text3);
    border: 1px dashed rgba(255,255,255,0.1);
  }
  .result-badge.palindrome {
    background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.05));
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: var(--success);
  }
  .result-badge.not-palindrome {
    background: rgba(244, 63, 94, 0.06);
    border: 1px solid rgba(244, 63, 94, 0.25);
    color: var(--fail);
  }
  .result-icon {
    font-size: 22px;
    flex-shrink: 0;
  }
  .result-text { flex: 1; }
  .result-sub {
    font-size: 12px;
    font-weight: 400;
    opacity: 0.75;
    margin-top: 2px;
  }

  /* Confetti burst */
  .confetti-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    opacity: 0;
    animation: confetti-fall 1.8s ease-out forwards;
  }
  @keyframes confetti-fall {
    0%   { opacity: 1; transform: translateY(-20px) rotate(0deg) scale(1); }
    100% { opacity: 0; transform: translateY(400px) rotate(720deg) scale(0.3); }
  }

  /* Reversed display */
  .mirror-display {
    margin-top: 14px;
    padding: 12px 16px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    font-size: 14px;
    color: var(--text2);
    display: none;
    word-break: break-all;
  }
  .mirror-display.visible { display: block; }
  .mirror-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .mirror-text {
    font-family: monospace;
    font-size: 16px;
    letter-spacing: 1px;
  }
  .mirror-text .match-char { color: var(--success); }
  .mirror-text .mismatch-char { color: var(--fail); }

  /* Finder Section */
  .section-title {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title span { font-size: 15px; }

  #finder-input {
    width: 100%;
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s;
    resize: vertical;
    min-height: 70px;
  }
  #finder-input::placeholder { color: var(--text3); }
  #finder-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15);
  }

  .finder-controls {
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .min-len-label {
    font-size: 13px;
    color: var(--text2);
    white-space: nowrap;
  }
  .min-len-input {
    width: 56px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    text-align: center;
    transition: border-color 0.2s;
  }
  .min-len-input:focus { border-color: var(--accent); }

  .btn {
    padding: 8px 20px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
  }
  .btn-primary:active { transform: translateY(0); }

  .finder-result {
    margin-top: 16px;
  }
  .finder-highlighted {
    font-size: 16px;
    line-height: 2;
    word-break: break-all;
    padding: 14px 16px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    min-height: 52px;
  }
  .pal-highlight {
    background: linear-gradient(135deg, rgba(124,58,237,0.35), rgba(168,85,247,0.25));
    border-radius: 4px;
    padding: 1px 2px;
    color: var(--accent3);
    font-weight: 600;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
  }
  .pal-highlight:hover {
    background: linear-gradient(135deg, rgba(124,58,237,0.55), rgba(168,85,247,0.45));
  }
  .pal-highlight.gold {
    background: linear-gradient(135deg, rgba(245,158,11,0.35), rgba(252,211,77,0.2));
    color: var(--gold2);
  }
  .pal-highlight.gold:hover {
    background: linear-gradient(135deg, rgba(245,158,11,0.55), rgba(252,211,77,0.4));
  }

  .finder-stats {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text3);
  }
  .finder-stats strong { color: var(--accent3); }

  /* Palindrome list */
  .pal-list {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 130px;
    overflow-y: auto;
  }
  .pal-tag {
    background: rgba(124,58,237,0.15);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 13px;
    color: var(--accent3);
    cursor: default;
    transition: background 0.2s;
  }
  .pal-tag:hover { background: rgba(124,58,237,0.25); }

  /* Examples */
  .examples-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .example-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .example-item:hover {
    border-color: rgba(124,58,237,0.5);
    background: rgba(124,58,237,0.08);
    transform: translateX(3px);
  }
  .example-item:active { transform: translateX(1px); }
  .example-num {
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    background: rgba(124,58,237,0.15);
    border-radius: 4px;
    padding: 2px 7px;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .example-content { flex: 1; }
  .example-text {
    font-size: 15px;
    color: var(--text);
    font-weight: 500;
    margin-bottom: 3px;
  }
  .example-note {
    font-size: 12px;
    color: var(--text3);
  }
  .example-use {
    font-size: 12px;
    color: var(--accent3);
    opacity: 0.7;
    flex-shrink: 0;
    align-self: center;
  }

  /* History */
  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .history-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .history-tag:hover {
    border-color: rgba(124,58,237,0.4);
    color: var(--text);
  }
  .history-tag .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .history-tag .dot.yes { background: var(--success); }
  .history-tag .dot.no  { background: var(--fail); }
  .history-empty {
    font-size: 13px;
    color: var(--text3);
    font-style: italic;
  }
  .history-clear {
    font-size: 12px;
    color: var(--text3);
    cursor: pointer;
    text-decoration: underline;
    background: none;
    border: none;
    font-family: inherit;
    transition: color 0.2s;
  }
  .history-clear:hover { color: var(--fail); }

  /* Tabs for finder modes */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 14px;
    background: var(--surface2);
    border-radius: 10px;
    padding: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 8px 12px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    background: transparent;
    color: var(--text3);
    font-family: inherit;
    transition: all 0.2s;
  }
  .tab-btn.active {
    background: var(--surface);
    color: var(--text);
    box-shadow: 0 1px 4px rgba(0,0,0,0.3);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Scroll */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(124,58,237,0.3); border-radius: 2px; }

  /* Responsive */
  @media (max-width: 480px) {
    .container { padding: 40px 14px 48px; }
    .card { padding: 18px 14px; }
    #main-input { font-size: 16px; }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>
<div class="confetti-container" id="confetti-container"></div>

<div class="container">
  <div class="header">
    <span class="header-icon">🔤</span>
    <h1>回文大师</h1>
    <p>正读倒读，皆为同一字</p>
  </div>

  <!-- Detector Card -->
  <div class="card">
    <div class="input-label"><span>✏️</span> 输入文字，实时检测是否为回文</div>
    <div class="input-wrapper">
      <textarea id="main-input" placeholder="在这里输入文字…例如：上海自来水来自海上" spellcheck="false"></textarea>
    </div>
    <div class="char-count" id="char-count">0 个字符</div>

    <div class="result-badge empty" id="result-badge">
      <span class="result-icon">💬</span>
      <div class="result-text">
        <div>等待输入…</div>
      </div>
    </div>

    <div class="mirror-display" id="mirror-display">
      <div class="mirror-label">逐字对比（原文 vs 反转）</div>
      <div class="mirror-text" id="mirror-text"></div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" data-tab="finder">🔍 回文查找器</button>
      <button class="tab-btn" data-tab="examples">📚 经典示例</button>
      <button class="tab-btn" data-tab="history">🕘 历史记录</button>
    </div>

    <!-- Finder Panel -->
    <div class="tab-panel active" id="tab-finder">
      <div class="section-title"><span>🔍</span> 从长句中找出所有回文片段</div>
      <textarea id="finder-input" placeholder="输入一段文字，点击查找…&#10;例如：上海自来水来自海上，人人为我，我为人人。" spellcheck="false"></textarea>
      <div class="finder-controls">
        <span class="min-len-label">最短长度：</span>
        <input class="min-len-input" type="number" id="min-len" value="2" min="2" max="20">
        <button class="btn btn-primary" id="find-btn">查 找</button>
      </div>
      <div class="finder-result" id="finder-result"></div>
    </div>

    <!-- Examples Panel -->
    <div class="tab-panel" id="tab-examples">
      <div class="section-title"><span>📚</span> 点击可填入检测框</div>
      <div class="examples-grid" id="examples-grid"></div>
    </div>

    <!-- History Panel -->
    <div class="tab-panel" id="tab-history">
      <div class="section-title" style="justify-content:space-between;">
        <span style="display:flex;align-items:center;gap:6px;"><span>🕘</span> 最近检测的词句</span>
        <button class="history-clear" id="clear-history">清空</button>
      </div>
      <div id="history-area"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ===== Constants ===== */
  var HISTORY_KEY = "palindrome_history_v1";
  var MAX_HISTORY = 30;

  var EXAMPLES = [
    { text: "上海自来水来自海上", note: "经典中文回文" },
    { text: "山东落花生花落东山", note: "地名回文对联" },
    { text: "人人为我我为人人", note: "互助精神回文" },
    { text: "A man a plan a canal Panama", note: "英文经典回文" },
    { text: "Was it a car or a cat I saw", note: "英文趣味回文" },
    { text: "Never odd or even", note: "英文奇偶回文" },
    { text: "雾锁山头山锁雾天连水尾水连天", note: "双行对联回文" },
    { text: "冰水为水冰", note: "简短中文回文" }
  ];

  var CONFETTI_COLORS = [
    "#7c3aed", "#a855f7", "#c084fc",
    "#f59e0b", "#fcd34d", "#10b981",
    "#f43f5e", "#38bdf8"
  ];

  /* ===== DOM refs ===== */
  var mainInput      = document.getElementById("main-input");
  var charCount      = document.getElementById("char-count");
  var resultBadge    = document.getElementById("result-badge");
  var mirrorDisplay  = document.getElementById("mirror-display");
  var mirrorText     = document.getElementById("mirror-text");
  var finderInput    = document.getElementById("finder-input");
  var minLenInput    = document.getElementById("min-len");
  var findBtn        = document.getElementById("find-btn");
  var finderResult   = document.getElementById("finder-result");
  var examplesGrid   = document.getElementById("examples-grid");
  var historyArea    = document.getElementById("history-area");
  var clearHistoryBtn= document.getElementById("clear-history");
  var confettiCont   = document.getElementById("confetti-container");

  /* ===== State ===== */
  var lastIsPalindrome = false;
  var confettiTimer = null;

  /* ===== Core Logic ===== */
  function normalize(str) {
    return str
      .replace(/[\s　 .,，。！!？?;；:：'"'"「」『』【】〔〕·…—\-_\/\\|@#$%^&*()（）\[\]{}]/g, "")
      .toLowerCase();
  }

  function isPalindrome(str) {
    var s = normalize(str);
    if (s.length === 0) return false;
    var rev = s.split("").reverse().join("");
    return s === rev;
  }

  function getMirrorHTML(str) {
    var s = normalize(str);
    if (s.length === 0) return "";
    var rev = s.split("").reverse().join("");
    var html = "";
    for (var i = 0; i < s.length; i++) {
      var match = s[i] === rev[i];
      var cls = match ? "match-char" : "mismatch-char";
      html += '<span class="' + cls + '">' + escapeHTML(s[i]) + '</span>';
    }
    return html;
  }

  function escapeHTML(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  /* Find palindromes (Manacher-like approach, O(n^2) simple) */
  function findAllPalindromes(str, minLen) {
    var s = normalize(str);
    if (s.length === 0) return [];
    var found = [];
    var seen = {};

    function tryAdd(sub) {
      if (sub.length >= minLen && !seen[sub]) {
        seen[sub] = true;
        var r = sub.split("").reverse().join("");
        if (sub === r) found.push(sub);
      }
    }

    /* expand around center */
    for (var c = 0; c < s.length; c++) {
      /* odd length */
      for (var r = 0; c - r >= 0 && c + r < s.length; r++) {
        if (s[c - r] !== s[c + r]) break;
        tryAdd(s.substring(c - r, c + r + 1));
      }
      /* even length */
      for (var r2 = 0; c - r2 >= 0 && c + r2 + 1 < s.length; r2++) {
        if (s[c - r2] !== s[c + r2 + 1]) break;
        tryAdd(s.substring(c - r2, c + r2 + 2));
      }
    }

    found.sort(function (a, b) { return b.length - a.length; });
    return found;
  }

  /* Build highlighted HTML for the original (normalized) string */
  function buildHighlightHTML(str, palindromes) {
    var s = normalize(str);
    if (s.length === 0) return "";
    if (palindromes.length === 0) return escapeHTML(s);

    /* mark positions: find first occurrence of each palindrome */
    var marks = new Array(s.length).fill(0); /* 0=none,1=short,2=long */
    var longest = palindromes[0] ? palindromes[0].length : 0;

    for (var pi = 0; pi < palindromes.length; pi++) {
      var pal = palindromes[pi];
      var idx = s.indexOf(pal);
      if (idx === -1) continue;
      var level = pal.length === longest ? 2 : 1;
      for (var k = idx; k < idx + pal.length; k++) {
        if (marks[k] < level) marks[k] = level;
      }
    }

    var html = "";
    var i2 = 0;
    while (i2 < s.length) {
      if (marks[i2] === 0) {
        html += escapeHTML(s[i2]);
        i2++;
      } else {
        var lv = marks[i2];
        var j = i2;
        while (j < s.length && marks[j] === lv) j++;
        var seg = s.substring(i2, j);
        var cls = lv === 2 ? "pal-highlight gold" : "pal-highlight";
        html += '<mark class="' + cls + '" title="' + escapeHTML(seg) + '">' + escapeHTML(seg) + '</mark>';
        i2 = j;
      }
    }
    return html;
  }

  /* ===== Confetti ===== */
  function launchConfetti() {
    if (confettiTimer) { clearTimeout(confettiTimer); }
    confettiCont.innerHTML = "";
    var count = 40;
    for (var i = 0; i < count; i++) {
      (function (idx) {
        var piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = (10 + Math.random() * 80) + "vw";
        piece.style.top = "-10px";
        piece.style.background = CONFETTI_COLORS[idx % CONFETTI_COLORS.length];
        piece.style.animationDelay = (Math.random() * 0.6) + "s";
        piece.style.animationDuration = (1.2 + Math.random() * 0.8) + "s";
        piece.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
        var size = 6 + Math.random() * 6;
        piece.style.width = size + "px";
        piece.style.height = size + "px";
        confettiCont.appendChild(piece);
      })(i);
    }
    confettiTimer = setTimeout(function () {
      confettiCont.innerHTML = "";
    }, 2500);
  }

  /* ===== Update detector UI ===== */
  function updateDetector() {
    var val = mainInput.value;
    var normalized = normalize(val);
    var len = val.replace(/\s/g, "").length;
    charCount.textContent = len + " 个字符";

    if (normalized.length === 0) {
      resultBadge.className = "result-badge empty";
      resultBadge.innerHTML = '<span class="result-icon">💬</span><div class="result-text"><div>等待输入…</div></div>';
      mainInput.className = "";
      mirrorDisplay.className = "mirror-display";
      lastIsPalindrome = false;
      return;
    }

    var result = isPalindrome(val);

    if (result) {
      if (!lastIsPalindrome) launchConfetti();
      resultBadge.className = "result-badge palindrome";
      resultBadge.innerHTML =
        '<span class="result-icon">🎉</span>' +
        '<div class="result-text">' +
          '<div>是回文！正读倒读完全相同</div>' +
          '<div class="result-sub">共 ' + normalized.length + ' 个有效字符</div>' +
        '</div>';
      mainInput.className = "is-palindrome";
    } else {
      resultBadge.className = "result-badge not-palindrome";
      resultBadge.innerHTML =
        '<span class="result-icon">❌</span>' +
        '<div class="result-text">' +
          '<div>不是回文</div>' +
          '<div class="result-sub">正读与倒读不同，共 ' + normalized.length + ' 个有效字符</div>' +
        '</div>';
      mainInput.className = "not-palindrome";
    }

    /* Mirror comparison */
    if (normalized.length > 1 && normalized.length <= 80) {
      mirrorText.innerHTML = getMirrorHTML(val);
      mirrorDisplay.className = "mirror-display visible";
    } else {
      mirrorDisplay.className = "mirror-display";
    }

    lastIsPalindrome = result;
    saveToHistory(val, result);
  }

  /* ===== History ===== */
  function loadHistory() {
    try {
      var raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveHistory(arr) {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
    } catch (e) {}
  }

  function saveToHistory(text, ispal) {
    if (normalize(text).length < 2) return;
    var arr = loadHistory();
    /* remove duplicate */
    arr = arr.filter(function (item) { return item.text !== text; });
    arr.unshift({ text: text, pal: ispal });
    if (arr.length > MAX_HISTORY) arr = arr.slice(0, MAX_HISTORY);
    saveHistory(arr);
    renderHistory();
  }

  function renderHistory() {
    var arr = loadHistory();
    if (arr.length === 0) {
      historyArea.innerHTML = '<div class="history-empty">暂无记录</div>';
      return;
    }
    var html = '<div class="history-list">';
    for (var i = 0; i < arr.length; i++) {
      var item = arr[i];
      var dotCls = item.pal ? "yes" : "no";
      var display = item.text.length > 16 ? item.text.substring(0, 16) + "…" : item.text;
      html += '<div class="history-tag" data-text="' + escapeHTML(item.text) + '">' +
        '<span class="dot ' + dotCls + '"></span>' +
        escapeHTML(display) +
        '</div>';
    }
    html += '</div>';
    historyArea.innerHTML = html;

    var tags = historyArea.querySelectorAll(".history-tag");
    for (var j = 0; j < tags.length; j++) {
      tags[j].addEventListener("click", function () {
        mainInput.value = this.getAttribute("data-text");
        updateDetector();
        switchTab("finder");
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  }

  /* ===== Examples ===== */
  function renderExamples() {
    var html = "";
    for (var i = 0; i < EXAMPLES.length; i++) {
      var ex = EXAMPLES[i];
      html += '<div class="example-item" data-text="' + escapeHTML(ex.text) + '">' +
        '<span class="example-num">' + (i + 1) + '</span>' +
        '<div class="example-content">' +
          '<div class="example-text">' + escapeHTML(ex.text) + '</div>' +
          '<div class="example-note">' + escapeHTML(ex.note) + '</div>' +
        '</div>' +
        '<span class="example-use">点击使用 →</span>' +
      '</div>';
    }
    examplesGrid.innerHTML = html;

    var items = examplesGrid.querySelectorAll(".example-item");
    for (var j = 0; j < items.length; j++) {
      items[j].addEventListener("click", function () {
        mainInput.value = this.getAttribute("data-text");
        updateDetector();
        switchTab("finder");
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  }

  /* ===== Finder ===== */
  function runFinder() {
    var text = finderInput.value.trim();
    if (!text) {
      finderResult.innerHTML = '<div style="font-size:13px;color:var(--text3);">请先输入文字</div>';
      return;
    }
    var minLen = parseInt(minLenInput.value, 10) || 2;
    if (minLen < 2) minLen = 2;

    var pals = findAllPalindromes(text, minLen);
    var normalized = normalize(text);

    if (pals.length === 0) {
      finderResult.innerHTML =
        '<div style="font-size:13px;color:var(--text3);">未找到长度 ≥ ' + minLen + ' 的回文片段</div>';
      return;
    }

    var highlightedHTML = buildHighlightHTML(text, pals);
    var tagsHTML = "";
    for (var i = 0; i < Math.min(pals.length, 20); i++) {
      tagsHTML += '<div class="pal-tag">' + escapeHTML(pals[i]) + '</div>';
    }

    finderResult.innerHTML =
      '<div class="finder-highlighted">' + highlightedHTML + '</div>' +
      '<div class="finder-stats">共找到 <strong>' + pals.length + '</strong> 个回文片段（金色为最长）</div>' +
      '<div class="pal-list">' + tagsHTML + '</div>';
  }

  /* ===== Tabs ===== */
  function switchTab(name) {
    var btns = document.querySelectorAll(".tab-btn");
    var panels = document.querySelectorAll(".tab-panel");
    for (var i = 0; i < btns.length; i++) {
      var tabName = btns[i].getAttribute("data-tab");
      if (tabName === name) {
        btns[i].className = "tab-btn active";
        document.getElementById("tab-" + name).className = "tab-panel active";
      } else {
        btns[i].className = "tab-btn";
        document.getElementById("tab-" + tabName).className = "tab-panel";
      }
    }
  }

  /* ===== Event bindings ===== */
  mainInput.addEventListener("input", updateDetector);

  findBtn.addEventListener("click", runFinder);
  finderInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.ctrlKey) runFinder();
  });

  clearHistoryBtn.addEventListener("click", function () {
    localStorage.removeItem(HISTORY_KEY);
    renderHistory();
  });

  var tabBtns = document.querySelectorAll(".tab-btn");
  for (var ti = 0; ti < tabBtns.length; ti++) {
    tabBtns[ti].addEventListener("click", function () {
      switchTab(this.getAttribute("data-tab"));
    });
  }

  /* ===== Init ===== */
  renderExamples();
  renderHistory();
  updateDetector();

})();
</script>
</body>
</html>
