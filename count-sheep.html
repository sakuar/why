<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数羊助眠</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0d1b2a;
    min-height: 100vh;
    overflow-x: hidden;
    color: #e8dfc8;
    user-select: none;
  }

  #back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    font-size: 13px;
    color: #7a9bb5;
    text-decoration: none;
    z-index: 100;
    opacity: 0.7;
    transition: opacity 0.3s;
  }
  #back-link:hover { opacity: 1; }

  /* Sky gradient */
  #sky {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, #1a2d4a 0%, #0d1b2a 60%, #060e18 100%);
    z-index: 0;
  }

  /* Stars */
  #stars {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  /* Moon */
  #moon {
    position: fixed;
    top: 40px;
    right: 60px;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 38%, #fff8e7, #f0d98c 40%, #c8a84b 100%);
    box-shadow: 0 0 30px 10px rgba(240, 210, 100, 0.25), 0 0 80px 30px rgba(220, 190, 80, 0.1);
    z-index: 2;
    animation: moonGlow 4s ease-in-out infinite alternate;
  }
  @keyframes moonGlow {
    from { box-shadow: 0 0 30px 10px rgba(240,210,100,0.2), 0 0 80px 30px rgba(220,190,80,0.08); }
    to   { box-shadow: 0 0 40px 16px rgba(240,210,100,0.35), 0 0 100px 40px rgba(220,190,80,0.15); }
  }

  /* Clouds */
  .cloud {
    position: fixed;
    z-index: 3;
    opacity: 0.18;
    animation: cloudDrift linear infinite;
  }
  @keyframes cloudDrift {
    from { transform: translateX(-200px); }
    to   { transform: translateX(110vw); }
  }

  /* Ground */
  #ground {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 38%;
    z-index: 4;
    background: linear-gradient(to bottom, #1a3a28 0%, #112a1c 60%, #0a1f14 100%);
    border-radius: 60% 60% 0 0 / 20px 20px 0 0;
  }

  /* Fence */
  #fence-wrap {
    position: fixed;
    bottom: 34%;
    left: 0;
    right: 0;
    z-index: 6;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }
  #fence {
    display: flex;
    align-items: flex-end;
    gap: 0;
  }
  .fence-post {
    width: 8px;
    height: 48px;
    background: linear-gradient(to bottom, #8b6f47, #6b4f2f);
    border-radius: 3px 3px 0 0;
    margin: 0 2px;
  }
  .fence-rail {
    position: absolute;
    left: 0; right: 0;
    height: 6px;
    background: linear-gradient(to bottom, #a07848, #7a5830);
    border-radius: 3px;
  }
  #fence-container {
    position: relative;
    width: 280px;
    height: 48px;
  }

  /* Scene container */
  #scene {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }

  /* Sheep */
  .sheep {
    position: absolute;
    bottom: 32%;
    pointer-events: none;
    transform-origin: center bottom;
  }
  .sheep svg {
    display: block;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }

  /* Main UI */
  #ui {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 48px;
    pointer-events: none;
  }

  #counter-box {
    text-align: center;
    margin-bottom: 28px;
    pointer-events: none;
  }
  #count-label {
    font-size: 15px;
    color: #8ab4cc;
    letter-spacing: 0.1em;
    margin-bottom: 6px;
    opacity: 0.85;
  }
  #count-number {
    font-size: 80px;
    font-weight: 200;
    color: #dde8f0;
    line-height: 1;
    letter-spacing: -0.02em;
    transition: transform 0.15s ease, color 0.4s;
    text-shadow: 0 0 40px rgba(180,210,240,0.3);
  }
  #count-number.bump {
    transform: scale(1.15);
    color: #b8d8f0;
  }

  #hint-text {
    font-size: 15px;
    color: #a0c4b8;
    margin-bottom: 24px;
    min-height: 22px;
    text-align: center;
    letter-spacing: 0.05em;
    opacity: 0;
    transition: opacity 0.8s ease;
    padding: 0 24px;
  }
  #hint-text.visible { opacity: 1; }

  #tap-btn {
    pointer-events: all;
    cursor: pointer;
    background: linear-gradient(135deg, #2a4a6a 0%, #1e3a52 100%);
    border: 1.5px solid rgba(140,190,230,0.25);
    border-radius: 50px;
    padding: 16px 48px;
    font-size: 18px;
    color: #c8dff0;
    letter-spacing: 0.08em;
    box-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.2s;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  #tap-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    background: linear-gradient(135deg, #325a7a 0%, #264862 100%);
  }
  #tap-btn:active {
    transform: scale(0.96);
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  #reset-btn {
    pointer-events: all;
    margin-top: 14px;
    background: none;
    border: none;
    color: #567a8a;
    font-size: 13px;
    cursor: pointer;
    letter-spacing: 0.06em;
    padding: 4px 12px;
    border-radius: 20px;
    transition: color 0.2s;
    outline: none;
  }
  #reset-btn:hover { color: #8ab4cc; }

  /* Milestone toast */
  #toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: rgba(18, 34, 52, 0.92);
    border: 1px solid rgba(140,200,240,0.2);
    border-radius: 20px;
    padding: 24px 36px;
    text-align: center;
    color: #c8e0f4;
    font-size: 18px;
    line-height: 1.7;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s ease;
    backdrop-filter: blur(8px);
    max-width: 88vw;
  }
  #toast.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: all;
  }
  #toast-close {
    display: inline-block;
    margin-top: 14px;
    font-size: 13px;
    color: #7aaabf;
    cursor: pointer;
    padding: 4px 16px;
    border: 1px solid rgba(120,180,220,0.2);
    border-radius: 20px;
    transition: background 0.2s;
  }
  #toast-close:hover { background: rgba(120,180,220,0.1); }

  /* Sheep jump animation lane */
  @keyframes sheepJump {
    0%   { transform: translateX(0) translateY(0) scaleX(1); opacity: 1; }
    20%  { transform: translateX(60px) translateY(-10px) scaleX(1); }
    40%  { transform: translateX(120px) translateY(-55px) scaleX(1); }
    55%  { transform: translateX(170px) translateY(-65px) scaleX(1); }
    70%  { transform: translateX(220px) translateY(-20px) scaleX(1); }
    82%  { transform: translateX(270px) translateY(0px) scaleX(1); }
    92%  { transform: translateX(320px) translateY(0px) scaleX(1); opacity: 1; }
    100% { transform: translateX(420px) translateY(0px) scaleX(1); opacity: 0; }
  }
  .sheep.jumping {
    animation: sheepJump 1.8s cubic-bezier(0.4, 0, 0.6, 1) forwards;
  }

  /* Ambient sheep on ground */
  .sheep-ambient {
    position: absolute;
    bottom: 32%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .sheep-ambient.visible { opacity: 0.55; }

  @media (max-width: 480px) {
    #count-number { font-size: 64px; }
    #moon { width: 54px; height: 54px; top: 28px; right: 28px; }
    #tap-btn { padding: 14px 36px; font-size: 16px; }
  }
</style>
</head>
<body>

<a href="index.html" id="back-link">← 入口</a>

<div id="sky"></div>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="moon"></div>
<div id="ground"></div>

<!-- Fence -->
<div id="fence-wrap">
  <div id="fence-container">
    <div id="fence"></div>
  </div>
</div>

<!-- Jumping sheep scene -->
<div id="scene"></div>

<!-- Clouds -->
<div id="clouds-wrap"></div>

<!-- UI -->
<div id="ui">
  <div id="counter-box">
    <div id="count-label">已数小羊</div>
    <div id="count-number">0</div>
  </div>
  <div id="hint-text"></div>
  <button id="tap-btn">轻点 · 数一只羊</button>
  <button id="reset-btn">重新开始</button>
</div>

<!-- Toast -->
<div id="toast">
  <div id="toast-msg"></div>
  <div id="toast-close">好的，继续数羊 ☽</div>
</div>

<script>
(function () {
  "use strict";

  /* ── 常量 ── */
  var STORAGE_KEY = "count_sheep_v1";
  var MILESTONES = [10, 20, 30, 50, 100];
  var MILESTONE_MSGS = {
    10:  "十只小羊跳过去了\n闭上眼睛，深呼一口气…",
    20:  "二十只啦\n肩膀放松，手臂放松…",
    30:  "三十只小羊在月光下奔跑\n呼吸越来越慢…",
    50:  "五十只！\n你的眼皮是不是有点重了？\n就这样，慢慢地…",
    100: "一百只小羊！\n你真的很棒\n现在，把一切交给梦境吧… ✦"
  };
  var IDLE_HINTS = [
    "轻点屏幕，让小羊跳起来…",
    "月光很柔和，小羊等你数…",
    "深吸一口气，再数一只…",
    "放松，慢慢数…",
    "",
    ""
  ];

  /* ── DOM ── */
  var starsCanvas   = document.getElementById("stars");
  var sceneEl       = document.getElementById("scene");
  var fenceEl       = document.getElementById("fence");
  var countNumEl    = document.getElementById("count-number");
  var hintTextEl    = document.getElementById("hint-text");
  var tapBtn        = document.getElementById("tap-btn");
  var resetBtn      = document.getElementById("reset-btn");
  var toastEl       = document.getElementById("toast");
  var toastMsgEl    = document.getElementById("toast-msg");
  var toastCloseEl  = document.getElementById("toast-close");
  var cloudsWrap    = document.getElementById("clouds-wrap");

  /* ── State ── */
  var sheepCount = 0;
  var isAnimating = false;
  var hintTimer = null;
  var triggeredMilestones = {};

  /* ── Load from localStorage ── */
  (function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        sheepCount = data.count || 0;
        triggeredMilestones = data.milestones || {};
      }
    } catch (e) { /* ignore */ }
  })();

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        count: sheepCount,
        milestones: triggeredMilestones
      }));
    } catch (e) { /* ignore */ }
  }

  /* ── Stars ── */
  function drawStars() {
    var ctx = starsCanvas.getContext("2d");
    var W = window.innerWidth;
    var H = window.innerHeight;
    starsCanvas.width = W;
    starsCanvas.height = H;
    ctx.clearRect(0, 0, W, H);
    var count = Math.floor((W * H) / 3500);
    for (var i = 0; i < count; i++) {
      var x = Math.random() * W;
      var y = Math.random() * H * 0.72;
      var r = Math.random() * 1.4 + 0.2;
      var alpha = Math.random() * 0.7 + 0.2;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(220,235,255," + alpha + ")";
      ctx.fill();
    }
  }

  /* ── Fence ── */
  function buildFence() {
    var html = "";
    for (var i = 0; i < 14; i++) {
      html += '<div class="fence-post"></div>';
    }
    fenceEl.innerHTML = html;
    var rail1 = document.createElement("div");
    rail1.className = "fence-rail";
    rail1.style.bottom = "18px";
    var rail2 = document.createElement("div");
    rail2.className = "fence-rail";
    rail2.style.bottom = "6px";
    var container = document.getElementById("fence-container");
    container.style.position = "relative";
    container.appendChild(rail1);
    container.appendChild(rail2);
  }

  /* ── Clouds ── */
  function makeClouds() {
    var defs = [
      { top: "12%", dur: 90, delay: 0,  scale: 1 },
      { top: "20%", dur: 130, delay: 40, scale: 0.7 },
      { top: "8%",  dur: 110, delay: 20, scale: 1.2 }
    ];
    defs.forEach(function (d) {
      var el = document.createElement("div");
      el.className = "cloud";
      el.style.top = d.top;
      el.style.left = "-200px";
      el.style.animationDuration = d.dur + "s";
      el.style.animationDelay = "-" + d.delay + "s";
      el.style.transform = "scale(" + d.scale + ")";
      el.innerHTML = cloudSVG();
      cloudsWrap.appendChild(el);
    });
  }

  function cloudSVG() {
    return '<svg width="180" height="60" viewBox="0 0 180 60" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      '<ellipse cx="90" cy="40" rx="80" ry="18" fill="white"/>' +
      '<ellipse cx="70" cy="32" rx="42" ry="22" fill="white"/>' +
      '<ellipse cx="110" cy="34" rx="36" ry="20" fill="white"/>' +
      '<ellipse cx="90" cy="26" rx="28" ry="18" fill="white"/>' +
      '</svg>';
  }

  /* ── Sheep SVG ── */
  function sheepSVG(size) {
    size = size || 64;
    var s = size / 64;
    return '<svg width="' + size + '" height="' + Math.round(52 * s) + '" viewBox="0 0 64 52" fill="none" xmlns="http://www.w3.org/2000/svg">' +
      // body wool
      '<ellipse cx="32" cy="26" rx="22" ry="16" fill="#e8e0d0"/>' +
      '<circle cx="18" cy="22" r="10" fill="#ddd6c6"/>' +
      '<circle cx="26" cy="17" r="11" fill="#e8e0d0"/>' +
      '<circle cx="36" cy="16" r="12" fill="#ddd6c6"/>' +
      '<circle cx="46" cy="22" r="10" fill="#e8e0d0"/>' +
      '<circle cx="40" cy="28" r="9" fill="#ddd6c6"/>' +
      '<circle cx="24" cy="29" r="9" fill="#e8e0d0"/>' +
      // head
      '<ellipse cx="52" cy="24" rx="10" ry="9" fill="#c8b89a"/>' +
      // ear
      '<ellipse cx="52" cy="15" rx="4" ry="5" fill="#c8b89a" transform="rotate(-10 52 15)"/>' +
      '<ellipse cx="52" cy="15" rx="2.5" ry="3.5" fill="#e8a0a0" transform="rotate(-10 52 15)"/>' +
      // eye
      '<circle cx="56" cy="22" r="2" fill="#2a2016"/>' +
      '<circle cx="57" cy="21.2" r="0.7" fill="white"/>' +
      // nose
      '<ellipse cx="60" cy="26" rx="2.5" ry="1.5" fill="#b89080"/>' +
      // mouth smile
      '<path d="M58 27.5 Q60 29 62 27.5" stroke="#9a7060" stroke-width="1" fill="none" stroke-linecap="round"/>' +
      // legs
      '<rect x="20" y="38" width="5" height="12" rx="2.5" fill="#c8b89a"/>' +
      '<rect x="28" y="39" width="5" height="11" rx="2.5" fill="#c8b89a"/>' +
      '<rect x="36" y="39" width="5" height="11" rx="2.5" fill="#c8b89a"/>' +
      '<rect x="44" y="38" width="5" height="12" rx="2.5" fill="#c8b89a"/>' +
      // hooves
      '<rect x="20" y="47" width="5" height="4" rx="2" fill="#6a5a4a"/>' +
      '<rect x="28" y="47" width="5" height="4" rx="2" fill="#6a5a4a"/>' +
      '<rect x="36" y="47" width="5" height="4" rx="2" fill="#6a5a4a"/>' +
      '<rect x="44" y="47" width="5" height="4" rx="2" fill="#6a5a4a"/>' +
      // tail
      '<circle cx="10" cy="28" r="6" fill="#ddd6c6"/>' +
      '</svg>';
  }

  /* ── Jump sheep animation ── */
  function spawnJumpingSheep() {
    var el = document.createElement("div");
    el.className = "sheep";
    // Start left of fence, centered vertically on ground line
    el.style.left = (window.innerWidth / 2 - 200) + "px";
    el.innerHTML = sheepSVG(56);
    sceneEl.appendChild(el);

    // Trigger reflow then add class
    void el.offsetWidth;
    el.classList.add("jumping");

    el.addEventListener("animationend", function () {
      el.parentNode && el.parentNode.removeChild(el);
      isAnimating = false;
    });
  }

  /* ── Ambient sheep on ground ── */
  var ambientSheepEls = [];
  function updateAmbientSheep() {
    var visible = Math.min(sheepCount, 5);
    // Add if needed
    while (ambientSheepEls.length < visible) {
      var el = document.createElement("div");
      el.className = "sheep-ambient";
      var pct = 15 + ambientSheepEls.length * 12;
      el.style.left = pct + "%";
      el.style.bottom = (30 + Math.random() * 4) + "%";
      var sz = 32 + Math.random() * 16;
      el.innerHTML = sheepSVG(Math.round(sz));
      sceneEl.appendChild(el);
      ambientSheepEls.push(el);
      // Delay visibility
      (function (e) {
        setTimeout(function () { e.classList.add("visible"); }, 50);
      })(el);
    }
  }

  /* ── Counter bump ── */
  function bumpCount() {
    countNumEl.classList.remove("bump");
    void countNumEl.offsetWidth;
    countNumEl.classList.add("bump");
    setTimeout(function () { countNumEl.classList.remove("bump"); }, 200);
  }

  /* ── Hint cycling ── */
  var hintIdx = 0;
  function showNextHint() {
    var h = IDLE_HINTS[hintIdx % IDLE_HINTS.length];
    hintIdx++;
    if (h) {
      hintTextEl.textContent = h;
      hintTextEl.classList.add("visible");
    } else {
      hintTextEl.classList.remove("visible");
    }
  }

  function scheduleHint() {
    clearTimeout(hintTimer);
    hintTimer = setTimeout(function () {
      showNextHint();
      scheduleHint();
    }, 6000);
  }

  /* ── Milestone toast ── */
  function checkMilestone(n) {
    if (MILESTONES.indexOf(n) !== -1 && !triggeredMilestones[n]) {
      triggeredMilestones[n] = true;
      saveState();
      showToast(MILESTONE_MSGS[n]);
    }
  }

  function showToast(msg) {
    toastMsgEl.innerHTML = msg.replace(/\n/g, "<br>");
    toastEl.classList.add("show");
  }

  function hideToast() {
    toastEl.classList.remove("show");
  }

  /* ── Main tap ── */
  function onTap() {
    if (isAnimating) return;
    isAnimating = true;

    sheepCount++;
    countNumEl.textContent = sheepCount;
    bumpCount();
    saveState();

    // Clear hint briefly
    hintTextEl.classList.remove("visible");
    clearTimeout(hintTimer);

    spawnJumpingSheep();
    updateAmbientSheep();
    checkMilestone(sheepCount);

    scheduleHint();
  }

  /* ── Reset ── */
  function onReset() {
    if (!confirm("重新从零开始数羊？")) return;
    sheepCount = 0;
    triggeredMilestones = {};
    saveState();
    countNumEl.textContent = "0";
    hintTextEl.classList.remove("visible");
    // Remove ambient sheep
    ambientSheepEls.forEach(function (e) {
      e.parentNode && e.parentNode.removeChild(e);
    });
    ambientSheepEls = [];
    hideToast();
  }

  /* ── Star twinkle ── */
  function twinkleStars() {
    var ctx = starsCanvas.getContext("2d");
    var W = starsCanvas.width;
    var H = starsCanvas.height;
    // Pick random star and flash it
    var x = Math.random() * W;
    var y = Math.random() * H * 0.72;
    var r = Math.random() * 1.8 + 0.4;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(200,225,255,0.9)";
    ctx.fill();
    setTimeout(function () {
      ctx.clearRect(x - r - 1, y - r - 1, r * 2 + 2, r * 2 + 2);
    }, 600);
  }

  /* ── Init ── */
  function init() {
    drawStars();
    buildFence();
    makeClouds();

    // Restore count display
    countNumEl.textContent = sheepCount;
    updateAmbientSheep();

    // Events
    tapBtn.addEventListener("click", onTap);
    resetBtn.addEventListener("click", onReset);
    toastCloseEl.addEventListener("click", hideToast);

    // Keyboard support
    document.addEventListener("keydown", function (e) {
      if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        onTap();
      }
      if (e.code === "Escape") hideToast();
    });

    // Resize
    window.addEventListener("resize", function () {
      drawStars();
    });

    // Twinkle loop
    setInterval(twinkleStars, 1200);

    // Initial hint
    setTimeout(showNextHint, 3000);
    scheduleHint();
  }

  init();

})();
</script>
</body>
</html>
