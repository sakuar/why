<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>假装在工作</title>
<style>
  html,body { margin:0; height:100%; background:#0a0e14; overflow:hidden;
    font-family: "SF Mono","Consolas","Courier New",monospace; }
  #screen { position:absolute; inset:0; padding:14px 16px 40px; overflow:hidden;
    color:#3fe06b; font-size:13px; line-height:1.5; white-space:pre-wrap; }
  .dim{color:#2b7a45;} .warn{color:#e0c040;} .err{color:#ff5f56;} .info{color:#56b6ff;}
  .path{color:#9b8cff;} .ok{color:#3fe06b;}
  #bar { position:fixed; bottom:0; left:0; right:0; height:30px; background:#070a0f;
    border-top:1px solid #1c2530; display:flex; align-items:center; gap:14px;
    padding:0 14px; color:#5a6b80; font-size:11px; z-index:5; }
  #bar b{color:#3fe06b;}
  .toolbar { position:fixed; top:12px; right:12px; display:flex; gap:6px; z-index:10; }
  .toolbar button { background:#121a24; color:#7d93ad; border:1px solid #243040;
    border-radius:6px; padding:6px 11px; font-size:11px; cursor:pointer; font-family:inherit; }
  .toolbar button:hover{ color:#cfe; border-color:#3fe06b; }
  .toolbar button.on{ background:#10331f; color:#3fe06b; border-color:#3fe06b; }
  .hint { position:fixed; top:12px; left:14px; color:#3a485a; font-size:11px; z-index:10; }
  .hint a{ color:#5a6b80; }
  /* 矩阵雨用 canvas */
  #matrix{ position:absolute; inset:0; display:none; }
  .progressline{ display:inline-block; }
</style>
</head>
<body>
<div class="hint"><a href="index.html">← 入口</a> · 按 <b>空格</b> 暂停 · <b>F</b> 全屏</div>
<div class="toolbar" id="toolbar"></div>
<canvas id="matrix"></canvas>
<div id="screen"></div>
<div id="bar">
  <span>MODE: <b id="m-mode">COMPILING</b></span>
  <span>CPU: <b id="m-cpu">0%</b></span>
  <span>MEM: <b id="m-mem">0M</b></span>
  <span>NET: <b id="m-net">0 KB/s</b></span>
  <span>ELAPSED: <b id="m-time">00:00</b></span>
</div>

<script>
const screen=document.getElementById('screen');
const rnd=(a,b)=>Math.floor(a+Math.random()*(b-a));
const pick=a=>a[rnd(0,a.length)];
const hex=n=>Array.from({length:n},()=>"0123456789abcdef"[rnd(0,16)]).join('');

// ——— 各模式的行生成器 ———
const FILES=["core/engine.ts","utils/parser.go","db/migrate.sql","api/handler.rs","ui/render.tsx",
  "auth/token.js","cache/redis.cpp","net/socket.py","model/train.py","crypto/aes.c"];
const PKGS=["react","webpack","lodash","tensorflow","numpy","tokio","serde","express","kafka","grpc"];
const MODES={
  COMPILING:{label:"编译项目",gen(){
    const f=pick(FILES);
    const r=Math.random();
    if(r<0.12) return `<span class="warn">warning</span>: unused variable in <span class="path">${f}</span>:${rnd(10,400)}`;
    if(r<0.18) return `<span class="info">→</span> linking <span class="path">${f.replace(/\..+/,'.o')}</span> ... <span class="ok">done</span>`;
    if(r<0.22) return `<span class="dim">  optimizing</span> [${"█".repeat(rnd(1,20)).padEnd(20,'░')}] ${rnd(5,99)}%`;
    return `<span class="ok">CC</span> <span class="path">${f}</span> <span class="dim">(${rnd(2,180)}ms)</span>`;
  }},
  DOWNLOAD:{label:"下载依赖",gen(){
    const p=pick(PKGS), v=`${rnd(1,9)}.${rnd(0,20)}.${rnd(0,40)}`;
    const r=Math.random();
    if(r<0.5) return `<span class="info">⬇</span> ${p}@${v} <span class="dim">${rnd(40,9000)} KB</span> [${"━".repeat(rnd(1,24)).padEnd(24,'·')}]`;
    if(r<0.65) return `<span class="ok">✓</span> resolved <span class="path">${p}</span> <span class="dim">sha256:${hex(12)}</span>`;
    return `<span class="dim">  extracting node_modules/${p}/dist/index.js</span>`;
  }},
  TRAIN:{label:"训练模型",gen(){
    const ep=this._ep=(this._ep||0);
    const loss=(2.4*Math.exp(-ep/120)+Math.random()*0.05).toFixed(4);
    const acc=(Math.min(99.4, 40+ep*0.4+Math.random()*2)).toFixed(2);
    this._ep++;
    if(Math.random()<0.1) return `<span class="info">checkpoint</span> saved → <span class="path">model_ep${ep}.pt</span>`;
    return `epoch <span class="ok">${String(ep).padStart(3,' ')}</span>/300  loss=<span class="warn">${loss}</span>  acc=<span class="ok">${acc}%</span>  lr=3e-4  <span class="dim">${rnd(8,60)}ms/it</span>`;
  }},
  SCAN:{label:"安全扫描",gen(){
    const ip=`${rnd(10,250)}.${rnd(0,255)}.${rnd(0,255)}.${rnd(1,254)}`;
    const r=Math.random();
    if(r<0.08) return `<span class="err">[CRITICAL]</span> open port ${pick([22,3389,445,8080])} on ${ip}`;
    if(r<0.2) return `<span class="warn">[WARN]</span> weak cipher detected @ ${ip}:443`;
    if(r<0.3) return `<span class="ok">[OK]</span> ${ip} — no anomalies <span class="dim">(${rnd(2,90)}ms)</span>`;
    return `<span class="dim">scanning</span> ${ip}/24 ... probing ${pick(["TCP","UDP","ICMP"])} <span class="dim">pkt#${hex(6)}</span>`;
  }},
  DEPLOY:{label:"部署上线",gen(){
    const r=Math.random();
    const svc=pick(["api-gateway","worker-3","redis","postgres","nginx","auth-svc"]);
    if(r<0.15) return `<span class="info">kubectl</span> rollout status deploy/${svc} ... <span class="ok">ready</span>`;
    if(r<0.25) return `<span class="warn">⟳</span> draining connections on ${svc} (${rnd(1,40)} active)`;
    if(r<0.32) return `<span class="ok">✔</span> health check ${svc} <span class="dim">200 OK ${rnd(2,50)}ms</span>`;
    return `<span class="dim">[deploy]</span> pushing image <span class="path">registry/${svc}:${hex(7)}</span> layer ${rnd(1,12)}/12`;
  }},
};

// ——— 状态 ———
let mode="COMPILING", paused=false, t0=Date.now(), lines=[], rafLines;
const order=Object.keys(MODES);

// 工具栏
const toolbar=document.getElementById('toolbar');
order.forEach(k=>{
  const b=document.createElement('button'); b.textContent=MODES[k].label; b.dataset.k=k;
  b.onclick=()=>setMode(k); toolbar.appendChild(b);
});
const matrixBtn=document.createElement('button'); matrixBtn.textContent="代码雨"; matrixBtn.dataset.k="MATRIX";
matrixBtn.onclick=()=>setMode("MATRIX"); toolbar.appendChild(matrixBtn);

function setMode(k){
  mode=k;
  [...toolbar.children].forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  document.getElementById('m-mode').textContent = k==="MATRIX"?"DECRYPTING":k;
  if(k==="MATRIX"){ startMatrix(); screen.style.display='none'; }
  else { stopMatrix(); screen.style.display='block'; if(MODES[k]) MODES[k]._ep=0; }
}

// ——— 滚动日志 ———
function maxLines(){ return Math.floor((window.innerHeight-70)/19); }
function addLine(){
  if(paused || mode==="MATRIX") return;
  const html=MODES[mode].gen();
  lines.push(html);
  while(lines.length>maxLines()) lines.shift();
  screen.innerHTML=lines.join('\n');
}
let acc=0;
function loop(ts){
  rafLines=requestAnimationFrame(loop);
  if(!loop.last)loop.last=ts;
  acc+=ts-loop.last; loop.last=ts;
  const interval = mode==="TRAIN"?90 : mode==="DEPLOY"?180 : 55;
  if(acc>interval){ acc=0; addLine(); }
}
requestAnimationFrame(loop);

// ——— 状态栏数字乱跳 ———
setInterval(()=>{
  if(paused)return;
  document.getElementById('m-cpu').textContent=rnd(30,99)+'%';
  document.getElementById('m-mem').textContent=rnd(800,6400)+'M';
  document.getElementById('m-net').textContent=(Math.random()*900+10).toFixed(1)+' KB/s';
},700);
setInterval(()=>{
  const s=Math.floor((Date.now()-t0)/1000);
  document.getElementById('m-time').textContent=
    String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
},1000);

// ——— 矩阵代码雨 ———
const mcv=document.getElementById('matrix'), mctx=mcv.getContext('2d');
let drops=[], matrixOn=false;
function resizeMatrix(){ mcv.width=innerWidth; mcv.height=innerHeight;
  const cols=Math.floor(innerWidth/14); drops=Array(cols).fill(0).map(()=>rnd(0,innerHeight/14)); }
function startMatrix(){ mcv.style.display='block'; matrixOn=true; resizeMatrix(); }
function stopMatrix(){ mcv.style.display='none'; matrixOn=false; }
const glyphs="ｱｲｳｴｵｶｷｸ01ABCDEF<>/{}$#@".split('');
function matrixLoop(){
  requestAnimationFrame(matrixLoop);
  if(!matrixOn||paused)return;
  mctx.fillStyle='rgba(10,14,20,.08)'; mctx.fillRect(0,0,mcv.width,mcv.height);
  mctx.font='14px monospace';
  drops.forEach((y,i)=>{
    const x=i*14;
    mctx.fillStyle = Math.random()<0.02?'#cfeede':'#3fe06b';
    mctx.fillText(pick(glyphs),x,y*14);
    if(y*14>mcv.height && Math.random()>0.975) drops[i]=0; else drops[i]++;
  });
}
matrixLoop();

// ——— 交互 ———
addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); paused=!paused;
    document.getElementById('m-mode').textContent=paused?'PAUSED':(mode==="MATRIX"?"DECRYPTING":mode); }
  if(e.key==='f'||e.key==='F'){ if(!document.fullscreenElement)document.documentElement.requestFullscreen(); else document.exitFullscreen(); }
});
addEventListener('resize',()=>{ if(matrixOn)resizeMatrix(); });

setMode("COMPILING");
</script>
</body>
</html>
