<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    color: #e0e0e0;
  }

  .back-link {
    position: fixed;
    top: 12px;
    left: 14px;
    color: rgba(255,255,255,0.4);
    text-decoration: none;
    font-size: 13px;
    transition: color 0.2s;
    z-index: 100;
  }
  .back-link:hover { color: rgba(255,255,255,0.8); }

  .container {
    margin-top: 48px;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #e0e0e0;
    text-shadow: 0 0 20px rgba(99,179,237,0.5);
  }

  .panel {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 28px;
    backdrop-filter: blur(10px);
    width: 100%;
    justify-content: space-between;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .stat-label {
    font-size: 11px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .stat-value {
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #63b3ed;
    text-shadow: 0 0 10px rgba(99,179,237,0.4);
    min-width: 48px;
    text-align: center;
  }

  #reset-btn {
    background: rgba(99,179,237,0.15);
    border: 1px solid rgba(99,179,237,0.35);
    border-radius: 12px;
    color: #63b3ed;
    font-size: 22px;
    width: 48px;
    height: 48px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #reset-btn:hover {
    background: rgba(99,179,237,0.28);
    transform: scale(1.08);
  }
  #reset-btn:active { transform: scale(0.95); }

  .board-wrap {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 12px;
    backdrop-filter: blur(10px);
  }

  #board {
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 3px;
  }

  .cell {
    width: 36px;
    height: 36px;
    border-radius: 7px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s, background 0.15s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    outline: none;
  }

  .cell.hidden {
    background: linear-gradient(145deg, rgba(99,179,237,0.25), rgba(99,179,237,0.1));
    border: 1px solid rgba(99,179,237,0.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .cell.hidden:hover {
    background: linear-gradient(145deg, rgba(99,179,237,0.38), rgba(99,179,237,0.2));
    transform: scale(1.06);
  }
  .cell.hidden:active { transform: scale(0.94); }

  .cell.revealed {
    background: rgba(0,0,0,0.25);
    border: 1px solid rgba(255,255,255,0.06);
    cursor: default;
  }

  .cell.flagged {
    background: linear-gradient(145deg, rgba(252,129,74,0.3), rgba(252,129,74,0.15));
    border: 1px solid rgba(252,129,74,0.35);
  }

  .cell.mine-hit {
    background: linear-gradient(145deg, #e53e3e, #c53030) !important;
    border: 1px solid #fc8181 !important;
    animation: shake 0.35s ease;
  }

  .cell.mine-show {
    background: rgba(229,62,62,0.2);
    border: 1px solid rgba(229,62,62,0.3);
  }

  .cell.safe-flag {
    background: rgba(72,187,120,0.2);
    border: 1px solid rgba(72,187,120,0.3);
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-4px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }

  @keyframes flip-in {
    0% { transform: scale(0.6); opacity: 0.3; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }

  .cell.reveal-anim { animation: flip-in 0.18s ease; }

  .n1 { color: #63b3ed; }
  .n2 { color: #68d391; }
  .n3 { color: #fc8181; }
  .n4 { color: #9f7aea; }
  .n5 { color: #f6ad55; }
  .n6 { color: #76e4f7; }
  .n7 { color: #f687b3; }
  .n8 { color: #e2e8f0; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 200;
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .overlay.show { opacity: 1; pointer-events: all; }

  .result-box {
    background: linear-gradient(135deg, rgba(22,33,62,0.97), rgba(15,52,96,0.97));
    border: 1px solid rgba(99,179,237,0.3);
    border-radius: 20px;
    padding: 36px 44px;
    text-align: center;
    transform: scale(0.85);
    transition: transform 0.3s;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .overlay.show .result-box { transform: scale(1); }

  .result-icon { font-size: 52px; margin-bottom: 12px; }

  .result-title {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }

  .result-win .result-title { color: #68d391; }
  .result-lose .result-title { color: #fc8181; }

  .result-time {
    font-size: 15px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 24px;
  }

  .play-again {
    background: linear-gradient(135deg, #4299e1, #3182ce);
    border: none;
    border-radius: 12px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    padding: 12px 32px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .play-again:hover {
    background: linear-gradient(135deg, #63b3ed, #4299e1);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(66,153,225,0.4);
  }
  .play-again:active { transform: translateY(0); }

  .best-time {
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    margin-top: 10px;
  }

  @media (max-width: 360px) {
    .cell { width: 32px; height: 32px; font-size: 12px; border-radius: 6px; }
    #board { gap: 2px; }
    .board-wrap { padding: 8px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="container">
  <h1>扫 雷</h1>

  <div class="panel">
    <div class="stat">
      <span class="stat-label">剩余雷</span>
      <span class="stat-value" id="mine-count">10</span>
    </div>
    <button id="reset-btn" title="重新开始">🙂</button>
    <div class="stat">
      <span class="stat-label">时间</span>
      <span class="stat-value" id="timer">0</span>
    </div>
  </div>

  <div class="board-wrap">
    <div id="board"></div>
  </div>

  <div class="best-time" id="best-display"></div>
</div>

<div class="overlay" id="overlay">
  <div class="result-box" id="result-box">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-title" id="result-title"></div>
    <div class="result-time" id="result-time"></div>
    <button class="play-again" id="play-again">再来一局</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ── 常量 ── */
  var ROWS = 9;
  var COLS = 9;
  var MINE_COUNT = 10;
  var STORAGE_KEY = "minesweeper_best";

  /* ── 状态变量 ── */
  var board = [];       // [{mine, count, revealed, flagged}]
  var gameState = "idle"; // idle | running | won | lost
  var timerVal = 0;
  var timerInterval = null;
  var firstClick = true;

  /* ── DOM 引用 ── */
  var boardEl = document.getElementById("board");
  var mineCountEl = document.getElementById("mine-count");
  var timerEl = document.getElementById("timer");
  var resetBtn = document.getElementById("reset-btn");
  var overlay = document.getElementById("overlay");
  var resultBox = document.getElementById("result-box");
  var resultIcon = document.getElementById("result-icon");
  var resultTitle = document.getElementById("result-title");
  var resultTime = document.getElementById("result-time");
  var playAgainBtn = document.getElementById("play-again");
  var bestDisplay = document.getElementById("best-display");

  /* ── 辅助 ── */
  function idx(r, c) { return r * COLS + c; }

  function neighbors(r, c) {
    var list = [];
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        var nr = r + dr;
        var nc = c + dc;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
          list.push({ r: nr, c: nc });
        }
      }
    }
    return list;
  }

  /* ── 初始化棋盘 ── */
  function initBoard() {
    board = [];
    for (var i = 0; i < ROWS * COLS; i++) {
      board.push({ mine: false, count: 0, revealed: false, flagged: false });
    }
  }

  function placeMines(safeR, safeC) {
    var placed = 0;
    while (placed < MINE_COUNT) {
      var r = Math.floor(Math.random() * ROWS);
      var c = Math.floor(Math.random() * COLS);
      var cell = board[idx(r, c)];
      if (cell.mine) continue;
      if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
      cell.mine = true;
      placed++;
    }
    for (var ri = 0; ri < ROWS; ri++) {
      for (var ci = 0; ci < COLS; ci++) {
        if (board[idx(ri, ci)].mine) continue;
        var cnt = 0;
        var nb = neighbors(ri, ci);
        for (var k = 0; k < nb.length; k++) {
          if (board[idx(nb[k].r, nb[k].c)].mine) cnt++;
        }
        board[idx(ri, ci)].count = cnt;
      }
    }
  }

  /* ── 渲染 ── */
  function renderBoard() {
    boardEl.innerHTML = "";
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cell = board[idx(r, c)];
        var el = document.createElement("div");
        el.className = "cell";
        el.dataset.r = r;
        el.dataset.c = c;

        if (cell.revealed) {
          el.classList.add("revealed");
          if (cell.mine) {
            el.classList.add("mine-hit");
            el.textContent = "💣";
          } else if (cell.count > 0) {
            el.textContent = cell.count;
            el.classList.add("n" + cell.count);
          }
        } else if (cell.flagged) {
          el.classList.add("flagged");
          el.textContent = "🚩";
        } else {
          el.classList.add("hidden");
        }

        el.addEventListener("click", onCellClick);
        el.addEventListener("contextmenu", onCellRightClick);
        el.addEventListener("touchstart", onTouchStart, { passive: true });
        el.addEventListener("touchend", onTouchEnd);

        boardEl.appendChild(el);
      }
    }
  }

  function updateCellEl(r, c, animate) {
    var cell = board[idx(r, c)];
    var els = boardEl.querySelectorAll(".cell");
    var el = els[idx(r, c)];
    if (!el) return;

    el.className = "cell";
    el.textContent = "";

    if (cell.revealed) {
      el.classList.add("revealed");
      if (animate) el.classList.add("reveal-anim");
      if (cell.mine) {
        el.textContent = "💣";
      } else if (cell.count > 0) {
        el.textContent = cell.count;
        el.classList.add("n" + cell.count);
      }
    } else if (cell.flagged) {
      el.classList.add("flagged");
      el.textContent = "🚩";
    } else {
      el.classList.add("hidden");
    }
  }

  function updateMineCounter() {
    var flags = 0;
    for (var i = 0; i < board.length; i++) {
      if (board[i].flagged) flags++;
    }
    mineCountEl.textContent = MINE_COUNT - flags;
  }

  /* ── 计时器 ── */
  function startTimer() {
    if (timerInterval) return;
    timerInterval = setInterval(function () {
      timerVal++;
      timerEl.textContent = timerVal;
    }, 1000);
  }

  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }

  /* ── 展开逻辑 ── */
  function revealCell(r, c) {
    var cell = board[idx(r, c)];
    if (cell.revealed || cell.flagged) return;
    cell.revealed = true;
    updateCellEl(r, c, true);

    if (cell.count === 0 && !cell.mine) {
      var nb = neighbors(r, c);
      for (var k = 0; k < nb.length; k++) {
        revealCell(nb[k].r, nb[k].c);
      }
    }
  }

  /* ── 检查胜利 ── */
  function checkWin() {
    for (var i = 0; i < board.length; i++) {
      if (!board[i].mine && !board[i].revealed) return false;
    }
    return true;
  }

  /* ── 游戏结束 ── */
  function endGame(won) {
    stopTimer();
    gameState = won ? "won" : "lost";
    resetBtn.textContent = won ? "😎" : "😵";

    if (!won) {
      for (var i = 0; i < board.length; i++) {
        if (board[i].mine && !board[i].flagged) {
          board[i].revealed = true;
        }
        if (board[i].flagged && !board[i].mine) {
          /* show wrong flag */
        }
      }
      renderBoard();
    }

    var best = getBest();
    if (won && (best === null || timerVal < best)) {
      saveBest(timerVal);
      best = timerVal;
    }

    resultBox.className = "result-box " + (won ? "result-win" : "result-lose");
    resultIcon.textContent = won ? "🎉" : "💥";
    resultTitle.textContent = won ? "恭喜通关！" : "踩雷了！";
    resultTime.textContent = won ? ("用时 " + timerVal + " 秒") : "下次加油～";

    overlay.classList.add("show");
    updateBestDisplay();
  }

  /* ── 最佳记录 ── */
  function getBest() {
    var v = localStorage.getItem(STORAGE_KEY);
    return v !== null ? parseInt(v, 10) : null;
  }

  function saveBest(t) {
    localStorage.setItem(STORAGE_KEY, t);
  }

  function updateBestDisplay() {
    var best = getBest();
    if (best !== null) {
      bestDisplay.textContent = "最佳记录：" + best + " 秒";
    } else {
      bestDisplay.textContent = "";
    }
  }

  /* ── 重置 ── */
  function resetGame() {
    stopTimer();
    timerVal = 0;
    timerEl.textContent = "0";
    firstClick = true;
    gameState = "idle";
    resetBtn.textContent = "🙂";
    overlay.classList.remove("show");
    initBoard();
    renderBoard();
    updateMineCounter();
    updateBestDisplay();
  }

  /* ── 事件：左键 ── */
  function onCellClick(e) {
    e.preventDefault();
    if (gameState === "won" || gameState === "lost") return;
    var r = parseInt(this.dataset.r, 10);
    var c = parseInt(this.dataset.c, 10);
    var cell = board[idx(r, c)];
    if (cell.revealed || cell.flagged) return;

    if (firstClick) {
      firstClick = false;
      placeMines(r, c);
      gameState = "running";
      startTimer();
    }

    if (cell.mine) {
      cell.revealed = true;
      updateCellEl(r, c, false);
      endGame(false);
      return;
    }

    revealCell(r, c);

    if (checkWin()) {
      endGame(true);
    }
  }

  /* ── 事件：右键 ── */
  function onCellRightClick(e) {
    e.preventDefault();
    if (gameState === "won" || gameState === "lost") return;
    var r = parseInt(this.dataset.r, 10);
    var c = parseInt(this.dataset.c, 10);
    var cell = board[idx(r, c)];
    if (cell.revealed) return;
    cell.flagged = !cell.flagged;
    updateCellEl(r, c, false);
    updateMineCounter();
  }

  /* ── 长按模拟右键（移动端） ── */
  var touchTimer = null;
  var touchMoved = false;

  function onTouchStart(e) {
    touchMoved = false;
    var target = this;
    touchTimer = setTimeout(function () {
      if (!touchMoved) {
        onCellRightClick.call(target, { preventDefault: function () {} });
      }
    }, 500);
  }

  function onTouchEnd(e) {
    if (touchTimer) {
      clearTimeout(touchTimer);
      touchTimer = null;
    }
  }

  document.addEventListener("touchmove", function () {
    touchMoved = true;
    if (touchTimer) {
      clearTimeout(touchTimer);
      touchTimer = null;
    }
  }, { passive: true });

  /* ── 绑定固定按钮 ── */
  resetBtn.addEventListener("click", resetGame);
  playAgainBtn.addEventListener("click", resetGame);

  /* ── 启动 ── */
  resetGame();

}());
</script>
</body>
</html>
