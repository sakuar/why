<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>周公解梦</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fdf6e3;
    --surface: #fffbf0;
    --surface2: #f5ead0;
    --border: #d4b483;
    --border-light: #e8d5a8;
    --gold: #b8860b;
    --gold-dark: #8b6508;
    --red: #8b1a1a;
    --red-light: #c0392b;
    --text: #3c2a0e;
    --text-muted: #7a5c30;
    --text-light: #a08040;
    --tag-bg: #f0e0b0;
    --tag-text: #7a4a0a;
    --shadow: 0 2px 12px rgba(100,60,0,0.10);
    --shadow-hover: 0 6px 24px rgba(100,60,0,0.18);
    --radius: 14px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Songti SC", "STSong", "SimSun", "宋体", Georgia, serif;
    min-height: 100vh;
    padding: 0;
  }

  /* 返回链接 */
  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    z-index: 100;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    opacity: 0.7;
    transition: opacity 0.2s;
    background: rgba(253,246,227,0.85);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border-light);
  }
  .back-link:hover { opacity: 1; }

  /* 顶部装饰 */
  .header-wrap {
    background: linear-gradient(160deg, #4a1a00 0%, #7a3010 40%, #a04020 100%);
    padding: 48px 20px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header-wrap::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .header-deco {
    font-size: 40px;
    margin-bottom: 8px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .header-title {
    font-size: clamp(28px, 6vw, 42px);
    color: #f5d88a;
    letter-spacing: 8px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
    font-weight: normal;
  }
  .header-sub {
    color: rgba(245,216,138,0.65);
    font-size: 13px;
    letter-spacing: 4px;
    margin-top: 8px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* 主体 */
  .main {
    max-width: 800px;
    margin: 0 auto;
    padding: 28px 16px 60px;
  }

  /* 搜索区 */
  .search-section {
    margin-bottom: 28px;
  }
  .search-box {
    display: flex;
    gap: 10px;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 50px;
    padding: 6px 6px 6px 20px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.25s, border-color 0.25s;
  }
  .search-box:focus-within {
    border-color: var(--gold);
    box-shadow: var(--shadow-hover), 0 0 0 3px rgba(184,134,11,0.12);
  }
  .search-input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 16px;
    color: var(--text);
    font-family: inherit;
    min-width: 0;
  }
  .search-input::placeholder { color: var(--text-light); }
  .search-btn {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #fff8e8;
    border: none;
    border-radius: 40px;
    padding: 10px 22px;
    font-size: 15px;
    cursor: pointer;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: 2px;
    transition: transform 0.15s, box-shadow 0.15s;
    white-space: nowrap;
  }
  .search-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(184,134,11,0.35); }
  .search-btn:active { transform: translateY(0); }

  /* 热门标签 */
  .tags-label {
    font-size: 12px;
    color: var(--text-light);
    margin: 14px 0 8px 4px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: 1px;
  }
  .tags-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .tag {
    background: var(--tag-bg);
    color: var(--tag-text);
    border: 1px solid var(--border-light);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: background 0.18s, transform 0.15s, border-color 0.18s;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
  }
  .tag:hover {
    background: var(--border);
    border-color: var(--gold);
    transform: translateY(-2px);
  }

  /* 搜索结果 */
  .result-section {
    margin-bottom: 32px;
  }
  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-header {
    background: linear-gradient(135deg, #6b2a00, #9a3a10);
    color: #f5d88a;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .result-icon { font-size: 28px; }
  .result-title-wrap {}
  .result-keyword { font-size: 20px; letter-spacing: 3px; }
  .result-category {
    font-size: 11px;
    color: rgba(245,216,138,0.65);
    letter-spacing: 2px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    margin-top: 2px;
  }
  .result-body { padding: 20px; }
  .result-meaning {
    font-size: 16px;
    line-height: 1.9;
    color: var(--text);
    border-left: 3px solid var(--gold);
    padding-left: 14px;
    margin-bottom: 16px;
  }
  .result-details {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .detail-item {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    border: 1px solid var(--border-light);
  }
  .detail-label {
    font-size: 11px;
    color: var(--text-light);
    letter-spacing: 1px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    margin-bottom: 4px;
  }
  .detail-value {
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
  }
  .result-lucky { color: var(--gold-dark); font-weight: bold; }
  .result-warn { color: var(--red); }

  .no-result {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
    font-size: 15px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .no-result-icon { font-size: 40px; margin-bottom: 12px; }

  /* 分类浏览 */
  .section-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 17px;
    color: var(--red);
    letter-spacing: 3px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border-light);
  }
  .section-title::before {
    content: '';
    display: block;
    width: 4px;
    height: 18px;
    background: linear-gradient(to bottom, var(--gold), var(--red));
    border-radius: 2px;
  }

  /* 分类 Tab */
  .cat-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }
  .cat-tab {
    background: var(--surface2);
    border: 1px solid var(--border-light);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .cat-tab.active, .cat-tab:hover {
    background: linear-gradient(135deg, var(--gold), var(--gold-dark));
    color: #fff8e8;
    border-color: var(--gold);
  }

  /* 梦境网格 */
  .dreams-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px;
  }
  .dream-card {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: var(--radius-sm);
    padding: 14px 12px;
    cursor: pointer;
    transition: all 0.22s;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .dream-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(184,134,11,0.05), transparent);
    opacity: 0;
    transition: opacity 0.22s;
  }
  .dream-card:hover {
    border-color: var(--gold);
    box-shadow: var(--shadow-hover);
    transform: translateY(-3px);
  }
  .dream-card:hover::after { opacity: 1; }
  .dream-icon { font-size: 26px; margin-bottom: 6px; }
  .dream-name {
    font-size: 14px;
    color: var(--text);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }
  .dream-brief {
    font-size: 11px;
    color: var(--text-light);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* 历史记录 */
  .history-section { margin-top: 32px; }
  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .history-item {
    background: var(--surface2);
    border: 1px solid var(--border-light);
    border-radius: 20px;
    padding: 5px 12px 5px 14px;
    font-size: 13px;
    color: var(--tag-text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.18s;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .history-item:hover { background: var(--border); }
  .history-del {
    font-size: 14px;
    color: var(--text-light);
    line-height: 1;
    padding: 0 2px;
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.15s;
  }
  .history-del:hover { opacity: 1; color: var(--red); }
  .clear-history {
    font-size: 12px;
    color: var(--text-light);
    cursor: pointer;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    text-decoration: underline;
    margin-left: auto;
    display: block;
    text-align: right;
    margin-top: 8px;
  }
  .clear-history:hover { color: var(--red); }

  /* 底部 */
  .footer {
    text-align: center;
    color: var(--text-light);
    font-size: 12px;
    padding: 20px;
    letter-spacing: 2px;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    border-top: 1px solid var(--border-light);
  }

  /* 分隔 */
  .divider {
    height: 1px;
    background: linear-gradient(to right, transparent, var(--border-light), transparent);
    margin: 28px 0;
  }

  @media (max-width: 500px) {
    .result-details { grid-template-columns: 1fr; }
    .dreams-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
    .header-title { letter-spacing: 4px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="header-wrap">
  <div class="header-deco">☽</div>
  <h1 class="header-title">周 公 解 梦</h1>
  <p class="header-sub">梦有所思 · 象有所指 · 趋吉避凶</p>
</div>

<div class="main">

  <!-- 搜索区 -->
  <div class="search-section">
    <div class="search-box">
      <input class="search-input" id="searchInput" type="text" placeholder="输入梦境关键词，如：蛇、飞翔、掉牙…" autocomplete="off" maxlength="20">
      <button class="search-btn" id="searchBtn">解 梦</button>
    </div>
    <div class="tags-label">热门梦境：</div>
    <div class="tags-wrap" id="hotTags"></div>
  </div>

  <!-- 搜索结果 -->
  <div class="result-section" id="resultSection" style="display:none;"></div>

  <div class="divider"></div>

  <!-- 分类浏览 -->
  <div class="section-title">分类梦典</div>
  <div class="cat-tabs" id="catTabs"></div>
  <div class="dreams-grid" id="dreamsGrid"></div>

  <!-- 历史记录 -->
  <div class="history-section" id="historySection" style="display:none;">
    <div class="divider"></div>
    <div class="section-title">解梦记录</div>
    <div class="history-list" id="historyList"></div>
    <span class="clear-history" id="clearHistory">清空记录</span>
  </div>

</div>

<div class="footer">周公解梦 · 仅供娱乐 · 切勿迷信</div>

<script>
(function() {
  "use strict";

  // ============================================================

  var DREAMS = [
    // 动物类
    { id: 1, keyword: "蛇", aliases: ["蛇梦", "见蛇"], icon: "🐍", cat: "动物", brief: "财富与小人",

  // ============================================================
  //  工具函数
  // ============================================================
  function findDream(keyword) {
    var kw = keyword.trim();
    if (!kw) return null;
    var lkw = kw.toLowerCase();
    // 精确匹配 keyword
    for (var i = 0; i < DREAMS.length; i++) {
      if (DREAMS[i].keyword === kw) return DREAMS[i];
    }
    // aliases 匹配
    for (var j = 0; j < DREAMS.length; j++) {
      var d = DREAMS[j];
      for (var k = 0; k < d.aliases.length; k++) {
        if (d.aliases[k].toLowerCase() === lkw) return d;
      }
    }
    // keyword 包含
    for (var m = 0; m < DREAMS.length; m++) {
      if (DREAMS[m].keyword.indexOf(kw) !== -1 || kw.indexOf(DREAMS[m].keyword) !== -1) return DREAMS[m];
    }
    // aliases 包含
    for (var n = 0; n < DREAMS.length; n++) {
      var dn = DREAMS[n];
      for (var p = 0; p < dn.aliases.length; p++) {
        if (dn.aliases[p].indexOf(kw) !== -1 || kw.indexOf(dn.aliases[p]) !== -1) return dn;
      }
    }
    return null;
  }

  function omenColor(omen) {
    if (!omen) return "";
    if (omen.indexOf("大吉") !== -1) return "color:#b8860b;font-weight:bold;";
    if (omen.indexOf("吉") !== -1) return "color:#7a9a30;font-weight:bold;";
    if (omen.indexOf("凶") !== -1) return "color:#8b1a1a;font-weight:bold;";
    if (omen.indexOf("警示") !== -1) return "color:#c0392b;";
    return "color:#3c2a0e;";
  }

  // ============================================================
  //  渲染函数
  // ============================================================
  function renderHotTags() {
    var html = "";
    for (var i = 0; i < HOT_KEYWORDS.length; i++) {
      html += '<span class="tag" data-kw="' + HOT_KEYWORDS[i] + '">' + HOT_KEYWORDS[i] + '</span>';
    }
    hotTagsEl.innerHTML = html;
    var tags = hotTagsEl.querySelectorAll(".tag");
    for (var j = 0; j < tags.length; j++) {
      tags[j].addEventListener("click", function() {
        searchInput.value = this.getAttribute("data-kw");
        doSearch();
      });
    }
  }

  function renderResult(dream, keyword) {
    if (!dream) {
      resultSection.style.display = "block";
      resultSection.innerHTML = '<div class="result-card"><div class="no-result">'
        + '<div class="no-result-icon">🔍</div>'
        + '<div>未找到"' + escHtml(keyword) + '"的解梦记录</div>'
        + '<div style="font-size:12px;margin-top:8px;color:var(--text-light);">试试：蛇、水、飞翔、掉牙、考试、坠落…</div>'
        + '</div></div>';
      return;
    }
    resultSection.style.display = "block";
    resultSection.innerHTML = '<div class="result-card">'
      + '<div class="result-header">'
      + '<div class="result-icon">' + dream.icon + '</div>'
      + '<div class="result-title-wrap">'
      + '<div class="result-keyword">梦见 · ' + escHtml(dream.keyword) + '</div>'
      + '<div class="result-category">' + escHtml(dream.cat) + ' · ' + escHtml(dream.brief) + '</div>'
      + '</div></div>'
      + '<div class="result-body">'
      + '<div class="result-meaning">' + escHtml(dream.meaning) + '</div>'
      + '<div class="result-details">'
      + '<div class="detail-item"><div class="detail-label">吉凶</div><div class="detail-value" style="' + omenColor(dream.omen) + '">' + escHtml(dream.omen) + '</div></div>'
      + '<div class="detail-item"><div class="detail-label">吉利方位</div><div class="detail-value result-lucky">' + escHtml(dream.direction) + '</div></div>'
      + '<div class="detail-item"><div class="detail-label">吉祥提示</div><div class="detail-value">' + escHtml(dream.lucky) + '</div></div>'
      + '<div class="detail-item"><div class="detail-label">注意事项</div><div class="detail-value result-warn">' + escHtml(dream.warn || "无") + '</div></div>'
      + '</div></div></div>';
    resultSection.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  function escHtml(str) {
    return (str || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function renderCatTabs() {
    var html = "";
    for (var i = 0; i < CATEGORIES.length; i++) {
      var active = CATEGORIES[i] === currentCat ? " active" : "";
      html += '<span class="cat-tab' + active + '" data-cat="' + CATEGORIES[i] + '">' + CATEGORIES[i] + '</span>';
    }
    catTabsEl.innerHTML = html;
    var tabs = catTabsEl.querySelectorAll(".cat-tab");
    for (var j = 0; j < tabs.length; j++) {
      tabs[j].addEventListener("click", function() {
        currentCat = this.getAttribute("data-cat");
        renderCatTabs();
        renderDreamsGrid();
      });
    }
  }

  function renderDreamsGrid() {
    var filtered = currentCat === "全部" ? DREAMS : DREAMS.filter(function(d) { return d.cat === currentCat; });
    var html = "";
    for (var i = 0; i < filtered.length; i++) {
      var d = filtered[i];
      html += '<div class="dream-card" data-id="' + d.id + '">'
        + '<div class="dream-icon">' + d.icon + '</div>'
        + '<div class="dream-name">' + escHtml(d.keyword) + '</div>'
        + '<div class="dream-brief">' + escHtml(d.brief) + '</div>'
        + '</div>';
    }
    dreamsGridEl.innerHTML = html;
    var cards = dreamsGridEl.querySelectorAll(".dream-card");
    for (var j = 0; j < cards.length; j++) {
      cards[j].addEventListener("click", function() {
        var id = parseInt(this.getAttribute("data-id"), 10);
        var dream = null;
        for (var k = 0; k < DREAMS.length; k++) {
          if (DREAMS[k].id === id) { dream = DREAMS[k]; break; }
        }
        if (dream) {
          searchInput.value = dream.keyword;
          addHistory(dream.keyword);
          renderResult(dream, dream.keyword);
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      });
    }
  }

  function renderHistory() {
    if (searchHistory.length === 0) {
      historySection.style.display = "none";
      return;
    }
    historySection.style.display = "block";
    var html = "";
    for (var i = searchHistory.length - 1; i >= 0; i--) {
      html += '<span class="history-item" data-idx="' + i + '">'
        + escHtml(searchHistory[i])
        + '<span class="history-del" data-idx="' + i + '">×</span>'
        + '</span>';
    }
    historyListEl.innerHTML = html;

    var items = historyListEl.querySelectorAll(".history-item");
    for (var j = 0; j < items.length; j++) {
      items[j].addEventListener("click", function(e) {
        if (e.target.classList.contains("history-del")) {
          var idx = parseInt(e.target.getAttribute("data-idx"), 10);
          searchHistory.splice(idx, 1);
          saveHistory();
          renderHistory();
          return;
        }
        var kw = this.textContent.replace("×", "").trim();
        searchInput.value = kw;
        doSearch();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }
  }

  function addHistory(kw) {
    var idx = searchHistory.indexOf(kw);
    if (idx !== -1) searchHistory.splice(idx, 1);
    searchHistory.push(kw);
    if (searchHistory.length > 20) searchHistory.shift();
    saveHistory();
    renderHistory();
  }

  function saveHistory() {
    try { localStorage.setItem("dream_history", JSON.stringify(searchHistory)); } catch(e) {}
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem("dream_history");
      if (raw) searchHistory = JSON.parse(raw);
      if (!Array.isArray(searchHistory)) searchHistory = [];
    } catch(e) { searchHistory = []; }
  }

  function doSearch() {
    var kw = searchInput.value.trim();
    if (!kw) return;
    var dream = findDream(kw);
    addHistory(kw);
    renderResult(dream, kw);
  }

  // ============================================================
  //  事件绑定
  // ============================================================
  searchBtn.addEventListener("click", doSearch);

  searchInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") doSearch();
  });

  clearHistoryEl.addEventListener("click", function() {
    searchHistory = [];
    saveHistory();
    renderHistory();
  });

  // ============================================================
  //  初始化（所有变量和函数定义完毕后才执行）
  // ============================================================
  loadHistory();
  renderHotTags();
  renderCatTabs();
  renderDreamsGrid();
  renderHistory();

})();
</script>
</body>
</html>
