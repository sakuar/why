<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字符画生成器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #252840;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #e8eaf6;
    --text-muted: #7986cb;
    --border: #2e3152;
    --radius: 12px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    padding: 16px;
  }

  .back-link {
    display: inline-block;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 24px;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .back-link:hover { opacity: 1; }

  .container {
    max-width: 900px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .header p {
    color: var(--text-muted);
    font-size: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
  }

  .controls {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: end;
  }

  @media (max-width: 600px) {
    .controls {
      grid-template-columns: 1fr;
    }
  }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    font-weight: 500;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  input[type="text"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 16px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
  }

  .char-input {
    width: 60px !important;
    text-align: center;
    font-size: 20px !important;
    font-weight: bold;
    letter-spacing: 2px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: #fff;
  }
  .btn-primary:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(108,99,255,0.4);
  }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover {
    background: var(--border);
  }

  .btn-copy {
    background: var(--surface2);
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 8px 16px;
    font-size: 13px;
  }
  .btn-copy:hover {
    background: rgba(108,99,255,0.1);
  }
  .btn-copy.copied {
    background: rgba(16,185,129,0.1);
    color: #10b981;
    border-color: #10b981;
  }

  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .preset-btn {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
  }
  .preset-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .output-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .output-label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .output-area {
    background: #0a0c14;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 20px;
    overflow-x: auto;
    min-height: 120px;
    position: relative;
  }

  #ascii-output {
    font-family: "Courier New", Courier, monospace;
    font-size: clamp(10px, 2vw, 14px);
    line-height: 1.2;
    white-space: pre;
    color: var(--accent);
    text-shadow: 0 0 8px rgba(108,99,255,0.4);
    display: block;
    transition: opacity 0.3s;
  }

  .placeholder-text {
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
    padding: 20px;
    font-family: inherit;
  }

  .char-palette {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }

  .char-chip {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--surface2);
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    transition: all 0.2s;
    font-family: "Courier New", monospace;
    color: var(--text);
  }
  .char-chip:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: scale(1.1);
  }
  .char-chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 10px rgba(108,99,255,0.5);
  }

  .section-title {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
    font-weight: 500;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  .fade-in {
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .glow-pulse {
    animation: glowPulse 2s ease-in-out infinite;
  }
  @keyframes glowPulse {
    0%, 100% { text-shadow: 0 0 8px rgba(108,99,255,0.4); }
    50% { text-shadow: 0 0 20px rgba(108,99,255,0.8), 0 0 40px rgba(108,99,255,0.3); }
  }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← 入口</a>

  <div class="header">
    <h1>字符画生成器</h1>
    <p>输入文字，生成大号 ASCII 艺术字</p>
  </div>

  <div class="card">
    <div class="controls">
      <div class="field">
        <label>输入文字（英文字母 / 数字）</label>
        <input type="text" id="input-text" placeholder="HELLO 123" maxlength="20" autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label>填充字符</label>
        <input type="text" id="fill-char" class="char-input" maxlength="1" value="█" autocomplete="off">
      </div>
      <button class="btn btn-primary" id="gen-btn">生 成</button>
    </div>

    <div class="presets">
      <span style="font-size:12px;color:var(--text-muted);align-self:center;">示例：</span>
      <button class="preset-btn" data-text="HELLO">HELLO</button>
      <button class="preset-btn" data-text="LOVE">LOVE</button>
      <button class="preset-btn" data-text="2025">2025</button>
      <button class="preset-btn" data-text="HI">HI</button>
      <button class="preset-btn" data-text="OK">OK</button>
      <button class="preset-btn" data-text="ABC">ABC</button>
    </div>
  </div>

  <div class="card">
    <p class="section-title">填充字符面板（点击切换）</p>
    <div class="char-palette" id="char-palette"></div>
  </div>

  <div class="card">
    <div class="output-header">
      <span class="output-label">输出结果</span>
      <button class="btn btn-copy" id="copy-btn">复制</button>
    </div>
    <div class="output-area">
      <pre id="ascii-output"><span class="placeholder-text">在上方输入文字后点击「生成」…</span></pre>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  // ── 5×5 点阵字体定义 ──────────────────────────────────────────
  // 每个字符用 5 行字符串表示，每行 5 个 0/1
  var FONT = {
    "A": ["01110","10001","11111","10001","10001"],
    "B": ["11110","10001","11110","10001","11110"],
    "C": ["01111","10000","10000","10000","01111"],
    "D": ["11110","10001","10001","10001","11110"],
    "E": ["11111","10000","11110","10000","11111"],
    "F": ["11111","10000","11110","10000","10000"],
    "G": ["01111","10000","10111","10001","01111"],
    "H": ["10001","10001","11111","10001","10001"],
    "I": ["11111","00100","00100","00100","11111"],
    "J": ["00111","00010","00010","10010","01100"],
    "K": ["10001","10010","11100","10010","10001"],
    "L": ["10000","10000","10000","10000","11111"],
    "M": ["10001","11011","10101","10001","10001"],
    "N": ["10001","11001","10101","10011","10001"],
    "O": ["01110","10001","10001","10001","01110"],
    "P": ["11110","10001","11110","10000","10000"],
    "Q": ["01110","10001","10001","10011","01111"],
    "R": ["11110","10001","11110","10010","10001"],
    "S": ["01111","10000","01110","00001","11110"],
    "T": ["11111","00100","00100","00100","00100"],
    "U": ["10001","10001","10001","10001","01110"],
    "V": ["10001","10001","10001","01010","00100"],
    "W": ["10001","10001","10101","11011","10001"],
    "X": ["10001","01010","00100","01010","10001"],
    "Y": ["10001","01010","00100","00100","00100"],
    "Z": ["11111","00010","00100","01000","11111"],
    "0": ["01110","10011","10101","11001","01110"],
    "1": ["00100","01100","00100","00100","01110"],
    "2": ["01110","10001","00110","01000","11111"],
    "3": ["11110","00001","01110","00001","11110"],
    "4": ["00010","00110","01010","11111","00010"],
    "5": ["11111","10000","11110","00001","11110"],
    "6": ["01110","10000","11110","10001","01110"],
    "7": ["11111","00001","00010","00100","01000"],
    "8": ["01110","10001","01110","10001","01110"],
    "9": ["01110","10001","01111","00001","01110"],
    " ": ["00000","00000","00000","00000","00000"],
    "!": ["00100","00100","00100","00000","00100"],
    "?": ["01110","10001","00110","00000","00100"],
    ".": ["00000","00000","00000","00000","00100"],
    "-": ["00000","00000","11111","00000","00000"],
    "+": ["00000","00100","01110","00100","00000"],
    "*": ["10101","01110","11111","01110","10101"],
    "@": ["01110","10011","10111","10000","01111"],
    "#": ["01010","11111","01010","11111","01010"]
  };

  var PALETTE_CHARS = ["█","▓","▒","░","#","@","*","$","%","&","X","O","+","=","~","^","·","/","\\","|"];

  // ── DOM 引用 ─────────────────────────────────────────────────
  var inputText  = document.getElementById("input-text");
  var fillChar   = document.getElementById("fill-char");
  var genBtn     = document.getElementById("gen-btn");
  var copyBtn    = document.getElementById("copy-btn");
  var asciiOut   = document.getElementById("ascii-output");
  var charPalette = document.getElementById("char-palette");

  // ── 状态 ────────────────────────────────────────────────────
  var currentOutput = "";

  // ── 工具函数 ─────────────────────────────────────────────────
  function loadStorage() {
    try {
      var saved = localStorage.getItem("ascii-art-state");
      if (saved) {
        var state = JSON.parse(saved);
        if (state.text)  inputText.value = state.text;
        if (state.fill)  fillChar.value  = state.fill;
      }
    } catch (e) {}
  }

  function saveStorage() {
    try {
      localStorage.setItem("ascii-art-state", JSON.stringify({
        text: inputText.value,
        fill: fillChar.value
      }));
    } catch (e) {}
  }

  function renderAscii(text, fill) {
    var ch = fill || "█";
    var chars = text.toUpperCase().split("");
    if (chars.length === 0) return "";

    var rows = ["","","","",""];
    for (var ci = 0; ci < chars.length; ci++) {
      var c = chars[ci];
      var pattern = FONT[c] || FONT[" "];
      for (var row = 0; row < 5; row++) {
        var line = pattern[row];
        for (var col = 0; col < 5; col++) {
          rows[row] += (line[col] === "1") ? ch : " ";
        }
        rows[row] += "  "; // 字符间距
      }
    }
    return rows.join("\n");
  }

  function generate() {
    var text = inputText.value.trim();
    if (!text) {
      asciiOut.textContent = "";
      asciiOut.innerHTML = '<span class="placeholder-text">请输入文字后点击生成…</span>';
      currentOutput = "";
      return;
    }
    var fill = fillChar.value || "█";
    var result = renderAscii(text, fill);
    currentOutput = result;
    asciiOut.className = "fade-in glow-pulse";
    asciiOut.textContent = result;
    saveStorage();
  }

  function buildPalette() {
    charPalette.innerHTML = "";
    var currentFill = fillChar.value || "█";
    for (var i = 0; i < PALETTE_CHARS.length; i++) {
      var ch = PALETTE_CHARS[i];
      var chip = document.createElement("button");
      chip.className = "char-chip" + (ch === currentFill ? " active" : "");
      chip.textContent = ch;
      chip.setAttribute("data-char", ch);
      chip.addEventListener("click", function() {
        fillChar.value = this.getAttribute("data-char");
        updatePaletteActive();
        generate();
      });
      charPalette.appendChild(chip);
    }
  }

  function updatePaletteActive() {
    var chips = charPalette.querySelectorAll(".char-chip");
    var currentFill = fillChar.value || "█";
    for (var i = 0; i < chips.length; i++) {
      if (chips[i].getAttribute("data-char") === currentFill) {
        chips[i].classList.add("active");
      } else {
        chips[i].classList.remove("active");
      }
    }
  }

  function copyToClipboard() {
    if (!currentOutput) return;
    var btn = copyBtn;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(currentOutput).then(function() {
        btn.textContent = "已复制 ✓";
        btn.classList.add("copied");
        setTimeout(function() {
          btn.textContent = "复制";
          btn.classList.remove("copied");
        }, 2000);
      });
    } else {
      // 降级方案
      var ta = document.createElement("textarea");
      ta.value = currentOutput;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      btn.textContent = "已复制 ✓";
      btn.classList.add("copied");
      setTimeout(function() {
        btn.textContent = "复制";
        btn.classList.remove("copied");
      }, 2000);
    }
  }

  // ── 事件绑定 ─────────────────────────────────────────────────
  genBtn.addEventListener("click", generate);

  inputText.addEventListener("keydown", function(e) {
    if (e.key === "Enter") generate();
  });

  fillChar.addEventListener("input", function() {
    // 只保留第一个字符
    if (this.value.length > 1) this.value = this.value[0];
    updatePaletteActive();
    if (currentOutput) generate();
  });

  copyBtn.addEventListener("click", copyToClipboard);

  var presetBtns = document.querySelectorAll(".preset-btn");
  for (var pi = 0; pi < presetBtns.length; pi++) {
    presetBtns[pi].addEventListener("click", function() {
      inputText.value = this.getAttribute("data-text");
      generate();
    });
  }

  // ── 初始化（放在最后）────────────────────────────────────────
  loadStorage();
  buildPalette();
  if (inputText.value) {
    generate();
  }

})();
</script>
</body>
</html>
