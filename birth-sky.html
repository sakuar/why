<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你出生那天</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4ff;
    --card: #ffffff;
    --primary: #6c63ff;
    --primary-light: #a89cff;
    --accent: #ff6b9d;
    --text: #2d2d3a;
    --text-soft: #7b7b9a;
    --border: #e4e4f0;
    --shadow: 0 8px 32px rgba(108,99,255,0.10);
    --radius: 20px;
  }

  body {
    background: var(--bg);
    min-height: 100vh;
    font-family: "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color: var(--text);
    padding: 20px 16px 48px;
  }

  .back-link {
    display: inline-block;
    font-size: 13px;
    color: var(--text-soft);
    text-decoration: none;
    margin-bottom: 24px;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .back-link:hover { opacity: 1; }

  .container {
    max-width: 480px;
    margin: 0 auto;
  }

  .hero {
    text-align: center;
    margin-bottom: 32px;
  }
  .hero-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 12px;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  .hero h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.02em;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p {
    margin-top: 6px;
    font-size: 14px;
    color: var(--text-soft);
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px;
    margin-bottom: 20px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .input-row input[type="date"] {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 15px;
    color: var(--text);
    background: #fafaff;
    outline: none;
    transition: border-color 0.25s, box-shadow 0.25s;
    font-family: inherit;
  }
  .input-row input[type="date"]:focus {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(108,99,255,0.12);
  }
  .btn {
    padding: 12px 20px;
    background: linear-gradient(135deg, var(--primary), #9b59ff);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    white-space: nowrap;
    font-family: inherit;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(108,99,255,0.3); }
  .btn:active { transform: translateY(0); }

  .result-area {
    display: none;
    animation: fadeUp 0.5s ease both;
  }
  .result-area.show { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .date-title {
    text-align: center;
    font-size: 20px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 20px;
    letter-spacing: 0.03em;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-bottom: 24px;
  }
  .tag {
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(135deg, #f3f0ff, #ffe8f4);
    border-radius: 14px;
    padding: 12px 18px;
    min-width: 90px;
    flex: 1;
    max-width: 130px;
    transition: transform 0.2s;
  }
  .tag:hover { transform: scale(1.04); }
  .tag-icon { font-size: 24px; margin-bottom: 4px; }
  .tag-label { font-size: 11px; color: var(--text-soft); margin-bottom: 2px; }
  .tag-value { font-size: 16px; font-weight: 700; color: var(--text); }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-box {
    background: linear-gradient(135deg, #f8f7ff, #fff0fa);
    border-radius: 14px;
    padding: 16px 14px;
    text-align: center;
    transition: transform 0.2s;
  }
  .stat-box:hover { transform: scale(1.03); }
  .stat-num {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.1;
  }
  .stat-unit {
    font-size: 12px;
    color: var(--text-soft);
    margin-top: 4px;
  }

  .quote-box {
    background: linear-gradient(135deg, #6c63ff18, #ff6b9d12);
    border-left: 3px solid var(--primary-light);
    border-radius: 0 12px 12px 0;
    padding: 14px 16px;
    font-size: 14px;
    color: var(--text);
    line-height: 1.7;
    font-style: italic;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 20px 0;
  }

  .extra-row {
    display: flex;
    justify-content: space-around;
    text-align: center;
    gap: 8px;
  }
  .extra-item { flex: 1; }
  .extra-label { font-size: 11px; color: var(--text-soft); margin-bottom: 2px; }
  .extra-val { font-size: 14px; font-weight: 600; color: var(--text); }

  .error-msg {
    display: none;
    color: #e05;
    font-size: 13px;
    margin-top: 8px;
    text-align: center;
  }
  .error-msg.show { display: block; }

  @media (max-width: 380px) {
    .input-row { flex-direction: column; }
    .btn { width: 100%; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .stat-num { font-size: 22px; }
  }
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back-link">← 入口</a>

  <div class="hero">
    <span class="hero-icon">🌟</span>
    <h1>你出生那天</h1>
    <p>输入生日，发现那天藏着的秘密</p>
  </div>

  <div class="card">
    <div class="input-row">
      <input type="date" id="birthInput" placeholder="选择生日" max="" />
      <button class="btn" id="calcBtn">探索</button>
    </div>
    <div class="error-msg" id="errorMsg">请选择一个有效的日期（不能是未来哦）</div>
  </div>

  <div class="result-area" id="resultArea">
    <div class="card">
      <div class="date-title" id="dateTitleEl"></div>

      <div class="tags" id="tagsEl"></div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-num" id="daysEl">0</div>
          <div class="stat-unit">你已活了这么多天</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="weeksEl">0</div>
          <div class="stat-unit">走过了这些周</div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="extra-row">
        <div class="extra-item">
          <div class="extra-label">你的年龄</div>
          <div class="extra-val" id="ageEl"></div>
        </div>
        <div class="extra-item">
          <div class="extra-label">下次生日</div>
          <div class="extra-val" id="nextBirthdayEl"></div>
        </div>
        <div class="extra-item">
          <div class="extra-label">出生季节</div>
          <div class="extra-val" id="seasonEl"></div>
        </div>
      </div>

      <div class="divider"></div>

      <div class="quote-box" id="quoteEl"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var WEEKDAYS = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  var ZODIAC_ANIMALS = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
  var ZODIAC_ICONS =   ["🐭","🐮","🐯","🐰","🐲","🐍","🐴","🐑","🐵","🐔","🐶","🐷"];
  var CONSTELLATIONS = [
    { name:"摩羯座", icon:"♑", start:[12,22], end:[1,19] },
    { name:"水瓶座", icon:"♒", start:[1,20],  end:[2,18] },
    { name:"双鱼座", icon:"♓", start:[2,19],  end:[3,20] },
    { name:"白羊座", icon:"♈", start:[3,21],  end:[4,19] },
    { name:"金牛座", icon:"♉", start:[4,20],  end:[5,20] },
    { name:"双子座", icon:"♊", start:[5,21],  end:[6,20] },
    { name:"巨蟹座", icon:"♋", start:[6,21],  end:[7,22] },
    { name:"狮子座", icon:"♌", start:[7,23],  end:[8,22] },
    { name:"处女座", icon:"♍", start:[8,23],  end:[9,22] },
    { name:"天秤座", icon:"♎", start:[9,23],  end:[10,22] },
    { name:"天蝎座", icon:"♏", start:[10,23], end:[11,21] },
    { name:"射手座", icon:"♐", start:[11,22], end:[12,21] }
  ];
  var SEASONS = [
    { name:"冬季", icon:"❄️" },
    { name:"春季", icon:"🌸" },
    { name:"春季", icon:"🌸" },
    { name:"春季", icon:"🌸" },
    { name:"夏季", icon:"☀️" },
    { name:"夏季", icon:"☀️" },
    { name:"夏季", icon:"☀️" },
    { name:"秋季", icon:"🍂" },
    { name:"秋季", icon:"🍂" },
    { name:"秋季", icon:"🍂" },
    { name:"冬季", icon:"❄️" },
    { name:"冬季", icon:"❄️" }
  ];

  var QUOTES = [
    "宇宙等待了一百三十八亿年，才在那一天迎来了你。",
    "你出生的那个瞬间，世界上又多了一个独一无二的灵魂。",
    "那天之后，某些人的生命开始因为你而变得不同。",
    "每一个普通的日子，都因为有了你而变得珍贵。",
    "你带着自己的光来到这里，照亮了某些人的某些时刻。",
    "时间的长河里，你恰好出现在最好的那个节点。",
    "那天的风、那天的云，都见证了你来到这个世界。",
    "你是某年某月某日最美好的事情。",
    "从那天起，你就是这个世界的一部分，从未缺席。",
    "岁月会老去，但你来到世界的那个瞬间永远年轻。"
  ];

  var birthInput = document.getElementById("birthInput");
  var calcBtn = document.getElementById("calcBtn");
  var errorMsg = document.getElementById("errorMsg");
  var resultArea = document.getElementById("resultArea");
  var dateTitleEl = document.getElementById("dateTitleEl");
  var tagsEl = document.getElementById("tagsEl");
  var daysEl = document.getElementById("daysEl");
  var weeksEl = document.getElementById("weeksEl");
  var ageEl = document.getElementById("ageEl");
  var nextBirthdayEl = document.getElementById("nextBirthdayEl");
  var seasonEl = document.getElementById("seasonEl");
  var quoteEl = document.getElementById("quoteEl");

  function getZodiac(year) {
    var idx = (year - 1900) % 12;
    if (idx < 0) idx += 12;
    return { animal: ZODIAC_ANIMALS[idx], icon: ZODIAC_ICONS[idx] };
  }

  function getConstellation(month, day) {
    for (var i = 0; i < CONSTELLATIONS.length; i++) {
      var c = CONSTELLATIONS[i];
      if (i === 0) {
        if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) {
          return c;
        }
      } else {
        if (
          (month === c.start[0] && day >= c.start[1]) ||
          (month === c.end[0] && day <= c.end[1])
        ) {
          return c;
        }
      }
    }
    return CONSTELLATIONS[0];
  }

  function getSeason(month) {
    return SEASONS[month - 1];
  }

  function calcAge(birthYear, birthMonth, birthDay, now) {
    var age = now.getFullYear() - birthYear;
    var m = now.getMonth() + 1 - birthMonth;
    if (m < 0 || (m === 0 && now.getDate() < birthDay)) age--;
    return age;
  }

  function getNextBirthday(birthMonth, birthDay, now) {
    var year = now.getFullYear();
    var next = new Date(year, birthMonth - 1, birthDay);
    if (next <= now) next = new Date(year + 1, birthMonth - 1, birthDay);
    var diff = Math.ceil((next - now) / 86400000);
    if (diff === 0) return "就是今天 🎉";
    return diff + " 天后";
  }

  function pickQuote(birthDay, birthMonth) {
    var idx = (birthDay * 3 + birthMonth * 7) % QUOTES.length;
    return QUOTES[idx];
  }

  function formatNum(n) {
    return n.toLocaleString("zh-CN");
  }

  function calculate() {
    var val = birthInput.value;
    errorMsg.classList.remove("show");
    resultArea.classList.remove("show");

    if (!val) {
      errorMsg.classList.add("show");
      return;
    }

    var parts = val.split("-");
    var year = parseInt(parts[0], 10);
    var month = parseInt(parts[1], 10);
    var day = parseInt(parts[2], 10);

    var birthDate = new Date(year, month - 1, day);
    var now = new Date();
    now.setHours(0, 0, 0, 0);

    if (birthDate > now) {
      errorMsg.classList.add("show");
      return;
    }

    localStorage.setItem("birth_sky_date", val);

    var weekday = WEEKDAYS[birthDate.getDay()];
    var zodiac = getZodiac(year);
    var constellation = getConstellation(month, day);
    var season = getSeason(month);

    var diffMs = now - birthDate;
    var totalDays = Math.floor(diffMs / 86400000);
    var totalWeeks = Math.floor(totalDays / 7);

    var age = calcAge(year, month, day, now);
    var nextBd = getNextBirthday(month, day, now);
    var quote = pickQuote(day, month);

    var monthNames = ["一","二","三","四","五","六","七","八","九","十","十一","十二"];

    dateTitleEl.textContent = year + " 年 " + monthNames[month-1] + " 月 " + day + " 日";

    tagsEl.innerHTML = [
      '<div class="tag"><div class="tag-icon">📅</div><div class="tag-label">星期</div><div class="tag-value">' + weekday + '</div></div>',
      '<div class="tag"><div class="tag-icon">' + zodiac.icon + '</div><div class="tag-label">生肖</div><div class="tag-value">' + zodiac.animal + '年</div></div>',
      '<div class="tag"><div class="tag-icon">' + constellation.icon + '</div><div class="tag-label">星座</div><div class="tag-value">' + constellation.name + '</div></div>'
    ].join("");

    daysEl.textContent = formatNum(totalDays);
    weeksEl.textContent = formatNum(totalWeeks);

    ageEl.textContent = age + " 岁";
    nextBirthdayEl.textContent = nextBd;
    seasonEl.textContent = season.icon + " " + season.name;

    quoteEl.textContent = "「" + quote + "」";

    resultArea.classList.remove("show");
    void resultArea.offsetWidth;
    resultArea.classList.add("show");
  }

  function init() {
    var today = new Date();
    var yy = today.getFullYear();
    var mm = String(today.getMonth() + 1).padStart(2, "0");
    var dd = String(today.getDate()).padStart(2, "0");
    birthInput.setAttribute("max", yy + "-" + mm + "-" + dd);

    var saved = localStorage.getItem("birth_sky_date");
    if (saved) {
      birthInput.value = saved;
      calculate();
    }

    calcBtn.addEventListener("click", calculate);
    birthInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") calculate();
    });
  }

  init();

}());
</script>
</body>
</html>
