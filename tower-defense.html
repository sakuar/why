<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>塔防</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:#0c0f1a;color:#e8eef7;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:40px 10px 30px;user-select:none;}
  .back{position:fixed;top:14px;left:16px;color:#6b6f8a;text-decoration:none;font-size:13px;z-index:30;}
  .back:hover{color:#56cfaf;}
  h1{font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#56cfaf,#7ed6ff,#c3a6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;}
  .hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:576px;margin-bottom:8px;}
  .stat{background:#161c2b;border:1px solid #222840;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .stat small{color:#8090a8;font-weight:400;font-size:11px;}
  .spd{margin-left:auto;display:flex;gap:6px;}
  .spd button{background:#161c2b;border:1px solid #222840;color:#aab6cc;border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer;font-weight:600;}
  .spd button.on{background:#6c63ff;color:#fff;border-color:#6c63ff;}
  .wrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);width:100%;max-width:576px;}
  canvas{display:block;width:100%;height:auto;background:#1a2e1f;touch-action:none;cursor:crosshair;}
  .ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,12,20,.9);backdrop-filter:blur(4px);text-align:center;padding:20px;transition:.2s;}
  .ovl.hidden{opacity:0;pointer-events:none;}
  .ovl h2{font-size:1.7rem;margin-bottom:8px;}
  .ovl h2.win{color:#56cfaf;} .ovl h2.lose{color:#ff6584;}
  .ovl p{color:#aab6cc;font-size:13px;line-height:1.9;margin-bottom:18px;max-width:380px;}
  .ovl b{color:#ffd166;}
  .btn{background:#56cfaf;color:#06251c;border:none;border-radius:11px;padding:12px 34px;font-size:16px;font-weight:700;cursor:pointer;}
  .btn:hover{background:#6fe0c2;}
  .bar{width:100%;max-width:576px;margin-top:10px;}
  .shop{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .tw{background:#161c2b;border:1px solid #222840;border-radius:12px;padding:9px 4px;text-align:center;cursor:pointer;transition:.12s;position:relative;}
  .tw:hover{border-color:#39415c;}
  .tw.on{border-color:#56cfaf;background:#16302a;}
  .tw.poor{opacity:.45;cursor:not-allowed;}
  .tw .ic{font-size:22px;}
  .tw .nm{font-size:12px;font-weight:700;margin-top:2px;}
  .tw .pr{font-size:12px;color:#ffd166;margin-top:1px;}
  .tw .de{font-size:10px;color:#7a8299;margin-top:1px;}
  .ctrl{background:#161c2b;border:1px solid #2a3450;border-radius:12px;padding:12px;display:none;}
  .ctrl.show{display:block;}
  .ctrl .top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .ctrl .ic{font-size:26px;}
  .ctrl .ti{font-weight:700;font-size:15px;}
  .ctrl .lv{font-size:11px;color:#ffd166;}
  .ctrl .props{font-size:12px;color:#aab6cc;line-height:1.7;margin-bottom:10px;}
  .ctrl .acts{display:flex;gap:8px;}
  .ctrl button{flex:1;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;}
  .ctrl .up{background:#56cfaf;color:#06251c;}
  .ctrl .up:disabled{background:#27302c;color:#5a6680;cursor:not-allowed;}
  .ctrl .sell{background:#2a2030;color:#ff9aa8;border:1px solid #4a2a38;}
  .ctrl .close{background:#1e2435;color:#aab6cc;flex:0 0 46px;}
  .hint{color:#5a6680;font-size:12px;text-align:center;margin-top:10px;line-height:1.7;}
</style>
</head>
<body>
<a class="back" href="index.html">← 入口</a>
<h1>🏰 塔防</h1>
<div class="hud">
  <div class="stat">❤️ <span id="lives">20</span></div>
  <div class="stat">🪙 <span id="gold">200</span></div>
  <div class="stat">🌊 <span id="wave">0</span><small>/20</small></div>
  <div class="spd">
    <button id="next">出战 ▶</button>
    <button id="s1" class="on">1×</button>
    <button id="s2">2×</button>
  </div>
</div>
<div class="wrap">
  <canvas id="cv" width="576" height="432"></canvas>
  <div class="ovl" id="ovl">
    <h2 id="ot">🏰 塔防</h2>
    <p id="op">怪物会沿道路冲向终点，漏过去就扣 ❤️。<br>在草地上建塔拦截，击杀得 🪙，攒钱<b>升级或多建</b>。<br>撑过 20 波即获胜，小心每 5 波的 BOSS！</p>
    <button class="btn" id="startBtn">开始</button>
  </div>
</div>
<div class="bar">
  <div class="shop" id="shop"></div>
  <div class="ctrl" id="ctrl"></div>
  <div class="hint">点下方塔种 → 点草地建造 · 点已建的塔可升级/出售</div>
</div>
<script>
"use strict";
(function(){
  var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  var COLS=12,ROWS=9,CELL=48,W=cv.width,H=cv.height;

  var TOWERS={
    arrow:{name:"箭塔",icon:"🏹",color:"#7ed6ff",cost:50,up:[45,75],desc:"单体速射",
      L:[{dmg:9,range:108,rate:500,bs:7},{dmg:15,range:122,rate:440,bs:7.5},{dmg:26,range:138,rate:380,bs:8}]},
    cannon:{name:"炮塔",icon:"💣",color:"#ff8c42",cost:95,up:[85,150],desc:"范围爆炸",
      L:[{dmg:20,range:98,rate:1050,bs:4.6,splash:42},{dmg:34,range:110,rate:950,bs:4.8,splash:50},{dmg:56,range:124,rate:850,bs:5,splash:60}]},
    frost:{name:"冰塔",icon:"❄️",color:"#9be7ff",cost:70,up:[55,95],desc:"减速敌人",
      L:[{dmg:4,range:92,rate:680,bs:6,slow:0.45,slowT:1100},{dmg:7,range:104,rate:620,bs:6,slow:0.55,slowT:1400},{dmg:11,range:118,rate:560,bs:6,slow:0.66,slowT:1700}]},
    sniper:{name:"狙击",icon:"🎯",color:"#c3a6ff",cost:130,up:[110,190],desc:"超远高伤",
      L:[{dmg:60,range:230,rate:1600,bs:13},{dmg:105,range:255,rate:1450,bs:14},{dmg:185,range:285,rate:1300,bs:15}]}
  };
  var ENEMIES={
    normal:{hp:42,speed:54,reward:8,color:"#ff6b6b",r:13,name:"普通"},
    fast:{hp:28,speed:104,reward:11,color:"#ffd166",r:11,name:"疾行"},
    tank:{hp:160,speed:32,reward:22,color:"#a07dff",r:18,name:"坦克"},
    boss:{hp:1100,speed:28,reward:140,color:"#ff3860",r:25,name:"BOSS"}
  };

  var PATH=[[-1,4],[2,4],[2,7],[6,7],[6,1],[9,1],[9,5],[12,5]];
  var way=[],occ={};
  function mark(c,r){ if(c>=0&&c<COLS&&r>=0&&r<ROWS) occ[c+","+r]=1; }
  (function buildPath(){
    for(var i=0;i<PATH.length;i++) way.push({x:PATH[i][0]*CELL+CELL/2,y:PATH[i][1]*CELL+CELL/2});
    for(var s=0;s<PATH.length-1;s++){
      var a=PATH[s],b=PATH[s+1],cx=a[0],cy=a[1];
      var sx=Math.sign(b[0]-a[0]),sy=Math.sign(b[1]-a[1]);
      while(cx!==b[0]||cy!==b[1]){ mark(cx,cy); cx+=sx; cy+=sy; }
      mark(b[0],b[1]);
    }
  })();

  // 游戏状态
  var lives,gold,wave,state,timeScale,towers,enemies,bullets,fx;
  var spawnQ,spawnIdx,spawnTimer,buildType,selected,hoverCell,muted=false;
  var TOTAL_WAVES=20;

  function reset(){
    lives=20;gold=200;wave=0;state="ready";timeScale=1;
    towers=[];enemies=[];bullets=[];fx=[];
    spawnQ=[];spawnIdx=0;spawnTimer=0;buildType=null;selected=null;hoverCell=null;
    syncHUD();renderShop();hideCtrl();
  }
  function syncHUD(){
    document.getElementById("lives").textContent=lives;
    document.getElementById("gold").textContent=gold;
    document.getElementById("wave").textContent=wave;
    var nb=document.getElementById("next");
    if(state==="ready"){ nb.textContent= wave===0? "出战 ▶":"下一波 ▶"; nb.disabled=false; nb.style.opacity=1; }
    else if(state==="wave"){ nb.textContent="进行中…"; nb.disabled=true; nb.style.opacity=.5; }
  }

  function makeWave(n){
    var arr=[],count=6+Math.floor(n*1.7);
    for(var i=0;i<count;i++){
      var type="normal";
      if(n>=2 && i%4===3) type="fast";
      if(n>=4 && i%6===5) type="tank";
      if(n>=7 && Math.random()<0.12) type="tank";
      arr.push(type);
    }
    if(n%5===0) arr.push("boss");
    return arr;
  }
  function startWave(){
    if(state!=="ready") return;
    wave++;
    spawnQ=makeWave(wave);spawnIdx=0;spawnTimer=0;state="wave";
    deselect();syncHUD();
  }
  function spawnEnemy(type){
    var d=ENEMIES[type];
    var hpScale=1+(wave-1)*0.26, spScale=1+(wave-1)*0.015;
    enemies.push({type:type,x:way[0].x,y:way[0].y,wp:1,
      hp:d.hp*hpScale,max:d.hp*hpScale,speed:d.speed*spScale,
      r:d.r,color:d.color,reward:d.reward,slow:0,slowT:0,dead:false});
  }

  // ---- 主循环 ----
  var lastT=0;
  function loop(now){
    var dt=(now-lastT)/1000; lastT=now;
    if(dt>0.05) dt=0.05;
    if(state==="wave") step(dt*timeScale);
    draw();
    requestAnimationFrame(loop);
  }
  function step(dt){
    // 生成
    if(spawnIdx<spawnQ.length){
      spawnTimer-=dt*1000;
      if(spawnTimer<=0){ spawnEnemy(spawnQ[spawnIdx]); spawnIdx++; spawnTimer=Math.max(280,650-wave*12); }
    }
    // 敌人移动
    for(var i=enemies.length-1;i>=0;i--){
      var e=enemies[i];
      if(e.dead){ enemies.splice(i,1); continue; }
      var spd=e.speed;
      if(e.slowT>0){ e.slowT-=dt*1000; spd*=(1-e.slow); }
      var tg=way[e.wp];
      if(!tg){ leak(e); enemies.splice(i,1); continue; }
      var dx=tg.x-e.x,dy=tg.y-e.y,dist=Math.sqrt(dx*dx+dy*dy),move=spd*dt;
      if(dist<=move){ e.x=tg.x;e.y=tg.y;e.wp++; if(e.wp>=way.length){ leak(e); enemies.splice(i,1); } }
      else { e.x+=dx/dist*move; e.y+=dy/dist*move; }
    }
    // 塔开火
    for(var t=0;t<towers.length;t++){
      var tw=towers[t],st=stat(tw);
      tw.cd-=dt*1000;
      if(tw.cd<=0){
        var target=null,best=-1;
        for(var k=0;k<enemies.length;k++){
          var en=enemies[k]; if(en.dead) continue;
          var ddx=en.x-tw.x,ddy=en.y-tw.y;
          if(ddx*ddx+ddy*ddy<=st.range*st.range){
            var prog=en.wp*10000-(Math.abs(way[en.wp]?way[en.wp].x-en.x:0)+Math.abs(way[en.wp]?way[en.wp].y-en.y:0));
            if(prog>best){ best=prog; target=en; }
          }
        }
        if(target){
          tw.cd=st.rate; tw.ang=Math.atan2(target.y-tw.y,target.x-tw.x);
          bullets.push({x:tw.x,y:tw.y,tg:target,ex:target.x,ey:target.y,bs:st.bs,
            dmg:st.dmg,splash:st.splash||0,slow:st.slow||0,slowT:st.slowT||0,color:TOWERS[tw.type].color});
          beep(tw.type==="cannon"?120:tw.type==="sniper"?320:520,0.03);
        }
      }
    }
    // 子弹
    for(var b=bullets.length-1;b>=0;b--){
      var bu=bullets[b];
      if(bu.tg && !bu.tg.dead){ bu.ex=bu.tg.x; bu.ey=bu.tg.y; }
      var bx=bu.ex-bu.x,by=bu.ey-bu.y,bd=Math.sqrt(bx*bx+by*by),bm=bu.bs*dt*60;
      if(bd<=bm||bd<2){
        hitAt(bu); bullets.splice(b,1);
      } else { bu.x+=bx/bd*bm; bu.y+=by/bd*bm; }
    }
    // 特效
    for(var f=fx.length-1;f>=0;f--){ fx[f].life-=dt; if(fx[f].life<=0) fx.splice(f,1); else { fx[f].y+=fx[f].vy*dt; } }
    // 波次结束
    if(state==="wave" && spawnIdx>=spawnQ.length && enemies.length===0){
      if(wave>=TOTAL_WAVES){ win(); }
      else { state="ready"; gold+=20+wave*3; popText(W/2,H/2,"波次清空 +"+(20+wave*3),"#ffd166",1.4); syncHUD(); }
    }
  }
  function hitAt(bu){
    if(bu.splash>0){
      addFx(bu.ex,bu.ey,bu.color,true);
      for(var k=0;k<enemies.length;k++){
        var en=enemies[k]; if(en.dead) continue;
        var dx=en.x-bu.ex,dy=en.y-bu.ey;
        if(dx*dx+dy*dy<=bu.splash*bu.splash) damage(en,bu.dmg,bu);
      }
    } else {
      addFx(bu.ex,bu.ey,bu.color,false);
      if(bu.tg && !bu.tg.dead) damage(bu.tg,bu.dmg,bu);
    }
  }
  function damage(en,dmg,bu){
    en.hp-=dmg;
    if(bu.slow>0){ en.slow=bu.slow; en.slowT=bu.slowT; }
    if(en.hp<=0 && !en.dead){ en.dead=true; gold+=en.reward; popText(en.x,en.y,"+"+en.reward,"#ffd166",0.9); syncHUD(); beep(700,0.04); }
  }
  function leak(e){
    var dmg=e.type==="boss"?5:1;
    lives-=dmg; if(lives<0) lives=0;
    popText(way[way.length-1].x,way[way.length-1].y,"-"+dmg+" ❤️","#ff6584",1);
    syncHUD();
    if(lives<=0) lose();
  }

  function stat(tw){ var L=TOWERS[tw.type].L[tw.lvl]; return L; }

  // ---- 绘制 ----
  function draw(){
    // 草地
    for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
      ctx.fillStyle=((r+c)%2)?"#1d3322":"#1a2e1f";
      ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
    }
    // 道路
    ctx.strokeStyle="#3a2e22";ctx.lineWidth=CELL*0.74;ctx.lineJoin="round";ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(way[0].x,way[0].y);for(var i=1;i<way.length;i++)ctx.lineTo(way[i].x,way[i].y);ctx.stroke();
    ctx.strokeStyle="#4a3b2b";ctx.lineWidth=CELL*0.56;ctx.stroke();
    // 终点
    var ep=way[way.length-1];
    ctx.fillStyle="#ff6584";ctx.font="20px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("🏁",ep.x-6,ep.y);
    // 建造预览
    if(buildType && hoverCell){
      var ok=canBuild(hoverCell.c,hoverCell.r) && gold>=TOWERS[buildType].cost;
      var px=hoverCell.c*CELL+CELL/2,py=hoverCell.r*CELL+CELL/2;
      ctx.fillStyle=ok?"rgba(86,207,175,.25)":"rgba(255,101,132,.25)";
      ctx.fillRect(hoverCell.c*CELL+2,hoverCell.r*CELL+2,CELL-4,CELL-4);
      ctx.beginPath();ctx.arc(px,py,TOWERS[buildType].L[0].range,0,6.2832);
      ctx.fillStyle=ok?"rgba(86,207,175,.08)":"rgba(255,101,132,.06)";ctx.fill();
      ctx.strokeStyle=ok?"rgba(86,207,175,.4)":"rgba(255,101,132,.4)";ctx.lineWidth=1;ctx.stroke();
    }
    // 选中射程
    if(selected){
      ctx.beginPath();ctx.arc(selected.x,selected.y,stat(selected).range,0,6.2832);
      ctx.fillStyle="rgba(126,214,255,.08)";ctx.fill();
      ctx.strokeStyle="rgba(126,214,255,.5)";ctx.lineWidth=1.5;ctx.stroke();
    }
    // 塔
    for(var t=0;t<towers.length;t++) drawTower(towers[t]);
    // 敌人
    for(var e=0;e<enemies.length;e++) drawEnemy(enemies[e]);
    // 子弹
    for(var b=0;b<bullets.length;b++){
      var bu=bullets[b];
      ctx.beginPath();ctx.arc(bu.x,bu.y,bu.splash>0?5:3.5,0,6.2832);
      ctx.fillStyle=bu.color;ctx.shadowColor=bu.color;ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;
    }
    // 特效
    for(var f=0;f<fx.length;f++) drawFx(fx[f]);
  }
  function drawTower(tw){
    var c=TOWERS[tw.type].color,x=tw.x,y=tw.y;
    ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.arc(x,y+3,CELL*0.34,0,6.2832);ctx.fill();
    ctx.fillStyle="#10141f";ctx.beginPath();ctx.arc(x,y,CELL*0.34,0,6.2832);ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle=c;ctx.stroke();
    ctx.font="19px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(TOWERS[tw.type].icon,x,y+1);
    // 等级点
    for(var i=0;i<=tw.lvl;i++){
      ctx.beginPath();ctx.arc(x-7+i*7,y+CELL*0.34-2,2.4,0,6.2832);ctx.fillStyle="#ffd166";ctx.fill();
    }
  }
  function drawEnemy(e){
    if(e.slowT>0){ ctx.fillStyle="rgba(120,200,255,.4)";ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,6.2832);ctx.fill(); }
    ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.2832);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.85)";ctx.beginPath();ctx.arc(e.x-e.r*0.3,e.y-e.r*0.3,e.r*0.3,0,6.2832);ctx.fill();
    // 血条
    var w=e.r*2,hp=Math.max(0,e.hp/e.max);
    ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(e.x-w/2,e.y-e.r-8,w,4);
    ctx.fillStyle=hp>0.5?"#56cfaf":hp>0.25?"#ffd166":"#ff6584";
    ctx.fillRect(e.x-w/2,e.y-e.r-8,w*hp,4);
  }
  function addFx(x,y,color,big){ fx.push({x:x,y:y,color:color,life:0.28,max:0.28,r:big?22:11,boom:true}); }
  function popText(x,y,txt,color,life){ fx.push({x:x,y:y,txt:txt,color:color,life:life,max:life,vy:-26}); }
  function drawFx(f){
    var a=f.life/f.max;
    if(f.txt){
      ctx.globalAlpha=Math.min(1,a*1.4);ctx.fillStyle=f.color;ctx.font="bold 13px system-ui";ctx.textAlign="center";
      ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=a;ctx.strokeStyle=f.color;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1-a+0.3),0,6.2832);ctx.stroke();ctx.globalAlpha=1;
    }
  }

  // ---- 交互 ----
  function cellAt(x,y){ return {c:Math.floor(x/CELL),r:Math.floor(y/CELL)}; }
  function canBuild(c,r){
    if(c<0||c>=COLS||r<0||r>=ROWS) return false;
    if(occ[c+","+r]) return false;
    for(var i=0;i<towers.length;i++) if(towers[i].cc===c&&towers[i].rr===r) return false;
    return true;
  }
  function towerAt(x,y){
    for(var i=0;i<towers.length;i++){ var dx=towers[i].x-x,dy=towers[i].y-y; if(dx*dx+dy*dy<(CELL*0.4)*(CELL*0.4)) return towers[i]; }
    return null;
  }
  function toLocal(ev){
    var rect=cv.getBoundingClientRect();
    var cx=(ev.touches?ev.touches[0].clientX:ev.clientX);
    var cy=(ev.touches?ev.touches[0].clientY:ev.clientY);
    return {x:(cx-rect.left)*(cv.width/rect.width),y:(cy-rect.top)*(cv.height/rect.height)};
  }
  cv.addEventListener("mousemove",function(ev){ if(!buildType){hoverCell=null;return;} var p=toLocal(ev); hoverCell=cellAt(p.x,p.y); });
  cv.addEventListener("mouseleave",function(){ hoverCell=null; });
  cv.addEventListener("click",function(ev){
    if(state==="over"||state==="win") return;
    var p=toLocal(ev),cell=cellAt(p.x,p.y);
    if(buildType){
      if(canBuild(cell.c,cell.r) && gold>=TOWERS[buildType].cost){
        gold-=TOWERS[buildType].cost;
        towers.push({type:buildType,cc:cell.c,rr:cell.r,x:cell.c*CELL+CELL/2,y:cell.r*CELL+CELL/2,lvl:0,cd:0,ang:0,invested:TOWERS[buildType].cost});
        beep(440,0.05);syncHUD();renderShop();
      } else { popText(p.x,p.y, gold<TOWERS[buildType].cost?"金币不足":"这里不能建","#ff6584",0.8); }
      return;
    }
    var tw=towerAt(p.x,p.y);
    if(tw){ selectTower(tw); } else { deselect(); }
  });

  // ---- 商店 / 升级面板 ----
  var shop=document.getElementById("shop"),ctrl=document.getElementById("ctrl");
  function renderShop(){
    var html="";
    for(var key in TOWERS){
      var T=TOWERS[key],poor=gold<T.cost?" poor":"",on=buildType===key?" on":"";
      html+='<div class="tw'+poor+on+'" data-t="'+key+'"><div class="ic">'+T.icon+'</div><div class="nm">'+T.name+'</div><div class="pr">🪙'+T.cost+'</div><div class="de">'+T.desc+'</div></div>';
    }
    shop.innerHTML=html;
  }
  shop.addEventListener("click",function(ev){
    var el=ev.target.closest?ev.target.closest(".tw"):null; if(!el) return;
    var key=el.getAttribute("data-t");
    if(gold<TOWERS[key].cost){ return; }
    buildType=(buildType===key)?null:key;
    deselect(true);renderShop();
  });
  function selectTower(tw){
    selected=tw;buildType=null;renderShop();
    shop.style.display="none";ctrl.classList.add("show");
    renderCtrl();
  }
  function renderCtrl(){
    if(!selected) return;
    var tw=selected,T=TOWERS[tw.type],L=T.L[tw.lvl],max=tw.lvl>=T.L.length-1;
    var upCost=max?0:T.up[tw.lvl];
    var props='伤害 '+L.dmg+' · 射程 '+Math.round(L.range)+' · 速度 '+(1000/L.rate).toFixed(1)+'/秒';
    if(L.splash) props+=' · 溅射';
    if(L.slow) props+=' · 减速'+Math.round(L.slow*100)+'%';
    var sell=Math.floor(tw.invested*0.6);
    var upBtn=max?'<button class="up" disabled>已满级</button>'
      :'<button class="up" id="upBtn"'+(gold<upCost?' disabled':'')+'>升级 🪙'+upCost+'</button>';
    ctrl.innerHTML='<div class="top"><span class="ic">'+T.icon+'</span><div><div class="ti">'+T.name+
      ' <span class="lv">Lv.'+(tw.lvl+1)+'/'+T.L.length+'</span></div></div></div>'+
      '<div class="props">'+props+'</div><div class="acts">'+upBtn+
      '<button class="sell" id="sellBtn">出售 🪙'+sell+'</button>'+
      '<button class="close" id="closeBtn">✕</button></div>';
    var ub=document.getElementById("upBtn");
    if(ub) ub.addEventListener("click",function(){
      if(tw.lvl>=T.L.length-1||gold<upCost) return;
      gold-=upCost;tw.invested+=upCost;tw.lvl++;beep(660,0.05);syncHUD();renderShop();renderCtrl();
    });
    document.getElementById("sellBtn").addEventListener("click",function(){
      gold+=sell;var ix=towers.indexOf(tw);if(ix>=0)towers.splice(ix,1);beep(300,0.05);syncHUD();renderShop();deselect();
    });
    document.getElementById("closeBtn").addEventListener("click",function(){ deselect(); });
  }
  function hideCtrl(){ ctrl.classList.remove("show");ctrl.innerHTML="";shop.style.display="grid"; }
  function deselect(keepShop){ selected=null; hideCtrl(); if(!keepShop) renderShop(); }

  // ---- 结束 ----
  var ovl=document.getElementById("ovl"),ot=document.getElementById("ot"),op=document.getElementById("op"),sb=document.getElementById("startBtn");
  function win(){ state="win"; ot.textContent="🎉 守住了！"; ot.className="win"; op.innerHTML="你撑过了全部 <b>20</b> 波进攻！<br>最终剩余 ❤️ <b>"+lives+"</b>"; sb.textContent="再玩一次"; ovl.classList.remove("hidden"); }
  function lose(){ state="over"; ot.textContent="💀 防线告破"; ot.className="lose"; op.innerHTML="基地失守在第 <b>"+wave+"</b> 波。<br>再调整下塔的布局试试？"; sb.textContent="重新开始"; ovl.classList.remove("hidden"); }

  // ---- 音效 ----
  var AC=null;
  function beep(freq,dur){
    if(muted) return;
    try{
      if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
      var o=AC.createOscillator(),g=AC.createGain();
      o.frequency.value=freq;o.type="triangle";
      g.gain.value=0.04;o.connect(g);g.connect(AC.destination);
      o.start();g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
      o.stop(AC.currentTime+dur+0.02);
    }catch(e){}
  }

  // ---- 按钮 ----
  document.getElementById("next").addEventListener("click",startWave);
  document.getElementById("s1").addEventListener("click",function(){ timeScale=1;this.classList.add("on");document.getElementById("s2").classList.remove("on"); });
  document.getElementById("s2").addEventListener("click",function(){ timeScale=2;this.classList.add("on");document.getElementById("s1").classList.remove("on"); });
  sb.addEventListener("click",function(){ reset(); ovl.classList.add("hidden"); });

  reset();
  requestAnimationFrame(function(t){ lastT=t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
