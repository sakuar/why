<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>手绘路线塔防</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{background:#0c0f1a;color:#e8eef7;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:36px 10px 30px;user-select:none;}
  .back{position:fixed;top:14px;left:16px;color:#6b6f8a;text-decoration:none;font-size:13px;z-index:30;}
  .back:hover{color:#56cfaf;}
  h1{font-size:1.45rem;font-weight:800;background:linear-gradient(135deg,#56cfaf,#7ed6ff,#c3a6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;}
  .hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:648px;margin-bottom:8px;}
  .stat{background:#161c2b;border:1px solid #222840;border-radius:10px;padding:7px 12px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .stat small{color:#8090a8;font-weight:400;font-size:11px;}
  .spd{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .spd button{background:#161c2b;border:1px solid #222840;color:#aab6cc;border-radius:9px;padding:7px 11px;font-size:13px;cursor:pointer;font-weight:600;}
  .spd button.on{background:#6c63ff;color:#fff;border-color:#6c63ff;}
  .spd button:disabled{opacity:.5;cursor:default;}
  .wrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5);width:100%;max-width:648px;}
  canvas{display:block;width:100%;height:auto;background:#16203a;touch-action:none;cursor:crosshair;}
  .ovl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,12,20,.9);backdrop-filter:blur(4px);text-align:center;padding:20px;transition:.2s;}
  .ovl.hidden{opacity:0;pointer-events:none;}
  .ovl h2{font-size:1.7rem;margin-bottom:8px;}
  .ovl h2.win{color:#56cfaf;} .ovl h2.lose{color:#ff6584;}
  .ovl p{color:#aab6cc;font-size:13px;line-height:1.9;margin-bottom:18px;max-width:420px;}
  .ovl b{color:#ffd166;}
  .btn{background:#56cfaf;color:#06251c;border:none;border-radius:11px;padding:12px 34px;font-size:16px;font-weight:700;cursor:pointer;}
  .btn:hover{background:#6fe0c2;}
  .bar{width:100%;max-width:648px;margin-top:10px;}
  .pathbar{display:none;align-items:center;gap:8px;flex-wrap:wrap;background:#161c2b;border:1px solid #2a3450;border-radius:12px;padding:10px;}
  .pathbar.show{display:flex;}
  .pathbar button{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:700;cursor:pointer;}
  .pathbar .ok{background:#56cfaf;color:#06251c;}
  .pathbar .ok:disabled{background:#27302c;color:#5a6680;cursor:not-allowed;}
  .pathbar .re{background:#2a2030;color:#ff9aa8;border:1px solid #4a2a38;}
  .pathbar .ptip{color:#8aa0c8;font-size:12px;margin-left:auto;}
  .shop{display:none;grid-template-columns:repeat(4,1fr);gap:8px;}
  .shop.show{display:grid;}
  .tw{background:#161c2b;border:1px solid #222840;border-radius:12px;padding:9px 4px;text-align:center;cursor:pointer;transition:.12s;position:relative;}
  .tw:hover{border-color:#39415c;}
  .tw.on{border-color:#56cfaf;background:#16302a;}
  .tw.poor{opacity:.45;cursor:not-allowed;}
  .tw .ic{font-size:22px;}
  .tw .nm{font-size:12px;font-weight:700;margin-top:2px;}
  .tw .pr{font-size:12px;color:#ffd166;margin-top:1px;}
  .tw .de{font-size:10px;color:#7a8299;margin-top:1px;}
  .ctrl{background:#161c2b;border:1px solid #2a3450;border-radius:12px;padding:12px;display:none;}
  .ctrl.show{display:block;}
  .ctrl .top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .ctrl .ic{font-size:26px;}
  .ctrl .ti{font-weight:700;font-size:15px;}
  .ctrl .lv{font-size:11px;color:#ffd166;}
  .ctrl .props{font-size:12px;color:#aab6cc;line-height:1.7;margin-bottom:10px;}
  .ctrl .skbtn{width:100%;margin-bottom:9px;border:1px solid #4a3a6a;background:#241f3a;color:#ffd166;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;}
  .ctrl .skbtn:disabled{background:#1c2030;color:#5a6680;border-color:#2a3450;cursor:not-allowed;}
  .ctrl .acts{display:flex;gap:8px;}
  .ctrl button.up,.ctrl button.sell,.ctrl button.close{flex:1;border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;cursor:pointer;}
  .ctrl .up{background:#56cfaf;color:#06251c;}
  .ctrl .up:disabled{background:#27302c;color:#5a6680;cursor:not-allowed;}
  .ctrl .sell{background:#2a2030;color:#ff9aa8;border:1px solid #4a2a38;}
  .ctrl .close{background:#1e2435;color:#aab6cc;flex:0 0 46px;}
  .hint{color:#5a6680;font-size:12px;text-align:center;margin-top:10px;line-height:1.7;}
</style>
</head>
<body>
<a class="back" href="index.html">← 入口</a>
<h1>🏰 手绘路线塔防</h1>
<div class="hud">
  <div class="stat">❤️ <span id="lives">20</span></div>
  <div class="stat">🪙 <span id="gold">220</span></div>
  <div class="stat">🌊 <span id="wave">0</span><small>/30</small></div>
  <div class="spd">
    <button id="next">先画路线</button>
    <button id="autowave" class="on">🌊自动</button>
    <button id="auto" class="on">⚡自动</button>
    <button id="s1" class="on">1×</button>
    <button id="s2">2×</button>
  </div>
</div>
<div class="wrap">
  <canvas id="cv" width="648" height="486"></canvas>
  <div class="ovl" id="ovl">
    <h2 id="ot">🏰 手绘路线塔防</h2>
    <p id="op">先用鼠标从入口 <b>⬆️</b> 按住拖到终点 <b>🏁</b>，<b>亲手画出</b>怪物的进攻路线。<br>点「确认路线」锁定后，再在路线旁<b>建塔</b>拦截。<br>撑过 20 波即获胜，小心每 5 波的 BOSS！</p>
    <button class="btn" id="startBtn">开始</button>
  </div>
</div>
<div class="bar">
  <div class="pathbar" id="pathbar">
    <button class="ok" id="confirmPath">确认路线 ✓</button>
    <button class="re" id="redraw">重画</button>
    <span class="ptip">从 ⬆️ 按住拖到 🏁 画出进攻路线（可往回拖擦除）</span>
  </div>
  <div class="shop" id="shop"></div>
  <div class="ctrl" id="ctrl"></div>
  <div class="hint" id="hint">先画出一条进攻路线并确认</div>
</div>
<script>
"use strict";
(function(){
  var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  var COLS=12,ROWS=9,CELL=54,W=cv.width,H=cv.height;
  var START={c:0,r:4}, END={c:11,r:4};
  function centerX(c){ return c*CELL+CELL/2; }
  function centerY(r){ return r*CELL+CELL/2; }

  var TOWERS={
    arrow:{name:"箭塔",icon:"🏹",color:"#7ed6ff",cost:50,up:[45,75],desc:"单体速射",
      skill:{name:"狂暴",icon:"⚡",cd:13000,dur:4500},
      L:[{dmg:9,range:118,rate:480,bs:7},{dmg:15,range:134,rate:420,bs:7.5},{dmg:27,range:150,rate:360,bs:8}]},
    cannon:{name:"炮塔",icon:"💣",color:"#ff8c42",cost:95,up:[85,150],desc:"范围爆炸",
      skill:{name:"火力覆盖",icon:"💥",cd:17000,mult:3.2,rmul:1.7},
      L:[{dmg:20,range:108,rate:1050,bs:4.6,splash:48},{dmg:34,range:120,rate:950,bs:4.8,splash:56},{dmg:58,range:136,rate:850,bs:5,splash:68}]},
    frost:{name:"冰塔",icon:"❄️",color:"#9be7ff",cost:70,up:[55,95],desc:"减速敌人",
      skill:{name:"绝对零度",icon:"🧊",cd:16000,dur:2600,rmul:1.5},
      L:[{dmg:4,range:102,rate:660,bs:6,slow:0.45,slowT:1100},{dmg:7,range:114,rate:600,bs:6,slow:0.55,slowT:1400},{dmg:12,range:128,rate:540,bs:6,slow:0.66,slowT:1700}]},
    sniper:{name:"狙击",icon:"🎯",color:"#c3a6ff",cost:130,up:[110,190],desc:"超远高伤",
      skill:{name:"处决",icon:"☠️",cd:15000,pct:0.55,flat:120},
      L:[{dmg:60,range:250,rate:1600,bs:13},{dmg:108,range:278,rate:1450,bs:14},{dmg:190,range:308,rate:1300,bs:15}]},
    chain:{name:"电塔",icon:"⚡",color:"#ffe14d",cost:90,up:[80,135],desc:"链式闪电",
      skill:{name:"过载",icon:"🌩️",cd:16000,rmul:1.4,mult:2.6},
      L:[{dmg:12,range:132,rate:760,jumps:3,jr:100},{dmg:20,range:146,rate:700,jumps:4,jr:108},{dmg:34,range:162,rate:640,jumps:5,jr:118}]},
    poison:{name:"毒塔",icon:"☠️",color:"#7fd957",cost:75,up:[65,110],desc:"持续掉血",
      skill:{name:"剧毒云",icon:"🟢",cd:15000,rmul:1.6,pdps:34,pdur:5000},
      L:[{dmg:3,range:116,rate:900,bs:6,pdps:9,pdur:3000},{dmg:5,range:130,rate:820,bs:6,pdps:16,pdur:3500},{dmg:8,range:144,rate:740,bs:6,pdps:28,pdur:4000}]},
    mine:{name:"金矿",icon:"💰",color:"#ffd166",cost:120,up:[100,160],desc:"每隔几秒产金(限3)",noatk:true,
      skill:{name:"暴富",icon:"🤑",cd:22000,bonus:90},
      L:[{gold:7,interval:3800,range:0},{gold:11,interval:3500,range:0},{gold:16,interval:3200,range:0}]},
    buff:{name:"光环",icon:"🔆",color:"#56cfaf",cost:110,up:[95,150],desc:"增益周围塔(限3)",noatk:true,
      skill:{name:"冲锋号",icon:"📣",cd:18000,dur:5000},
      L:[{range:106,dmgMul:0.2,rateMul:0.15},{range:120,dmgMul:0.3,rateMul:0.22},{range:134,dmgMul:0.45,rateMul:0.32}]}
  };
  var ENEMIES={
    swarm:{hp:16,speed:62,reward:3,color:"#ffe08a",r:10,name:"虫群"},
    normal:{hp:48,speed:60,reward:6,color:"#ff6b6b",r:14,name:"普通"},
    fast:{hp:30,speed:116,reward:8,color:"#ffd166",r:12,name:"疾行"},
    tank:{hp:210,speed:34,reward:13,color:"#a07dff",r:19,name:"坦克"},
    shield:{hp:70,shield:90,speed:50,reward:9,color:"#5ad2ff",r:15,name:"护盾"},
    healer:{hp:95,speed:52,reward:10,color:"#7fe08a",r:15,name:"治疗",heal:14,healRange:100},
    splitter:{hp:120,speed:54,reward:9,color:"#ff9f5a",r:17,name:"分裂",split:3,splitType:"swarm"},
    flyer:{hp:60,speed:98,reward:7,color:"#d6b8ff",r:12,name:"飞怪",immuneSlow:true},
    boss:{hp:4500,speed:28,reward:100,color:"#ff3860",r:26,name:"BOSS",summon:true}
  };
  var TOTAL_WAVES=30;
  var LIMIT={mine:3,buff:3};   // 经济/增益塔数量上限，防滚雪球

  // 游戏状态
  var lives,gold,wave,state,phase,timeScale,towers,enemies,bullets,fx;
  var pathCells,way,occ,drawing,spawnQ,spawnIdx,spawnTimer,buildType,selected,hoverCell,muted=false,autoSkill=true,autoWave=true,waveCountdown=0;

  function reset(){
    lives=20;gold=150;wave=0;state="ready";phase="draw";timeScale=1;
    towers=[];enemies=[];bullets=[];fx=[];
    pathCells=[{c:START.c,r:START.r}];way=[];occ={};drawing=false;
    spawnQ=[];spawnIdx=0;spawnTimer=0;buildType=null;selected=null;hoverCell=null;
    updatePhaseUI();syncHUD();renderShop();hideCtrl();
  }
  function syncHUD(){
    document.getElementById("lives").textContent=lives;
    document.getElementById("gold").textContent=gold;
    document.getElementById("wave").textContent=wave;
    var nb=document.getElementById("next");
    if(phase==="draw"){ nb.textContent="先画路线"; nb.disabled=true; nb.style.opacity=.5; }
    else if(state==="ready"){ nb.textContent= wave===0? "出战 ▶":"下一波 ▶"; nb.disabled=false; nb.style.opacity=1; }
    else if(state==="wave"){ nb.textContent="进行中…"; nb.disabled=true; nb.style.opacity=.5; }
  }
  var pathbar=document.getElementById("pathbar"),shop=document.getElementById("shop"),hintEl=document.getElementById("hint");
  function updatePhaseUI(){
    if(phase==="draw"){ pathbar.classList.add("show"); shop.classList.remove("show"); ctrl.classList.remove("show");
      hintEl.innerHTML="从 ⬆️ 按住拖到 🏁 画出进攻路线，再点「确认路线」"; }
    else { pathbar.classList.remove("show"); shop.classList.add("show");
      hintEl.innerHTML="选塔种后<b>按住拖动</b>=连续建塔 · 蓝线=怪物路线 · 点塔可升级/技能/出售"; }
  }

  // ---- 路线 ----
  function cellEq(a,b){ return a.c===b.c&&a.r===b.r; }
  function adj(a,b){ return Math.abs(a.c-b.c)+Math.abs(a.r-b.r)===1; }
  function inPath(c,r){ for(var i=0;i<pathCells.length;i++) if(pathCells[i].c===c&&pathCells[i].r===r) return i; return -1; }
  function pathDone(){ return pathCells.length>=2 && cellEq(pathCells[pathCells.length-1],END); }
  function lockPath(){
    way=[]; occ={};
    for(var i=0;i<pathCells.length;i++){ way.push({x:centerX(pathCells[i].c),y:centerY(pathCells[i].r)}); occ[pathCells[i].c+","+pathCells[i].r]=1; }
  }

  function makeWave(n){
    var arr=[],count=10+Math.floor(n*2.6);
    for(var i=0;i<count;i++){
      var type="normal";
      if(n>=2 && i%4===3) type="fast";
      if(n>=3 && i%5===0) type="swarm";
      if(n>=4 && i%6===5) type="tank";
      if(n>=5 && i%7===4) type="shield";
      if(n>=7 && i%9===6) type="healer";
      if(n>=8 && i%8===7) type="splitter";
      if(n>=10 && i%6===2) type="flyer";
      if(n>=13 && Math.random()<0.16) type="tank";
      arr.push(type);
    }
    if(n%4===0) arr.push("boss");
    if(n>=14 && n%4===0) arr.push("boss");
    if(n>=24 && n%4===0) arr.push("boss");
    return arr;
  }
  function startWave(){
    if(phase!=="play"||state!=="ready") return;
    wave++;
    spawnQ=makeWave(wave);spawnIdx=0;spawnTimer=0;state="wave";
    deselect();syncHUD();
  }
  function hpScaleNow(){ return 1+(wave-1)*0.36 + (wave>12?(wave-12)*0.30:0); }
  function spScaleNow(){ return 1+(wave-1)*0.018; }
  function makeEnemy(type,x,y,wp,hpMul){
    var d=ENEMIES[type], hs=hpScaleNow()*(hpMul||1), ss=spScaleNow();
    return {type:type,x:x,y:y,wp:wp,
      hp:d.hp*hs,max:d.hp*hs,shield:(d.shield||0)*hs,maxShield:(d.shield||0)*hs,
      speed:d.speed*ss,r:d.r,color:d.color,reward:d.reward,
      immuneSlow:!!d.immuneSlow,heal:d.heal||0,healRange:d.healRange||0,healT:0,
      split:d.split||0,splitType:d.splitType||"swarm",summon:!!d.summon,summonT:2500,
      slow:0,slowT:0,pdps:0,pT:0,dead:false};
  }
  function spawnEnemy(type){ enemies.push(makeEnemy(type,way[0].x,way[0].y,1)); }
  function doSplit(en){
    for(var i=0;i<en.split;i++){ var e=makeEnemy(en.splitType,en.x+(i-1)*9,en.y,en.wp,0.5); e.reward=2; enemies.push(e); }
  }
  function spawnMinion(boss){ var e=makeEnemy("swarm",boss.x,boss.y,boss.wp,1); e.reward=2; enemies.push(e); }

  // ---- 主循环 ----
  var lastT=0,animT=0;
  function loop(now){
    var dt=(now-lastT)/1000; lastT=now;
    if(dt>0.05) dt=0.05;
    animT+=dt;
    if(phase==="play" && state==="wave") step(dt*timeScale);
    else if(phase==="play" && state==="ready" && autoWave && wave>=1 && wave<TOTAL_WAVES){
      waveCountdown-=dt*timeScale;
      var nbtn=document.getElementById("next");
      if(waveCountdown>0){ nbtn.textContent="自动 "+Math.ceil(waveCountdown)+"s ▶"; }
      else { startWave(); }
    }
    draw();
    requestAnimationFrame(loop);
  }
  function step(dt){
    if(spawnIdx<spawnQ.length){
      spawnTimer-=dt*1000;
      if(spawnTimer<=0){ spawnEnemy(spawnQ[spawnIdx]); spawnIdx++; spawnTimer=Math.max(240,600-wave*10); }
    }
    for(var i=enemies.length-1;i>=0;i--){
      var e=enemies[i];
      if(e.dead){ enemies.splice(i,1); continue; }
      if(e.pT>0){ e.pT-=dt*1000; e.hp-=e.pdps*dt; if(e.hp<=0){ e.dead=true; gold+=e.reward; popText(e.x,e.y,"+"+e.reward,"#7fd957",0.9); syncHUD(); if(e.split>0) doSplit(e); enemies.splice(i,1); continue; } }
      if(e.heal>0){ e.healT-=dt*1000; if(e.healT<=0){ e.healT=900; for(var hh=0;hh<enemies.length;hh++){ var oh=enemies[hh]; if(oh.dead||oh===e) continue; var hx=oh.x-e.x,hy=oh.y-e.y; if(hx*hx+hy*hy<=e.healRange*e.healRange) oh.hp=Math.min(oh.max,oh.hp+e.heal); } addFx(e.x,e.y,"#7fe08a",true); } }
      if(e.summon){ e.summonT-=dt*1000; if(e.summonT<=0){ e.summonT=3000; spawnMinion(e); popText(e.x,e.y-e.r-10,"召唤!","#ff6b6b",0.8); } }
      var spd=e.speed;
      if(e.slowT>0){ e.slowT-=dt*1000; spd*=(1-e.slow); }
      var tg=way[e.wp];
      if(!tg){ leak(e); enemies.splice(i,1); continue; }
      var dx=tg.x-e.x,dy=tg.y-e.y,d=Math.sqrt(dx*dx+dy*dy),move=spd*dt;
      if(d<=move){ e.x=tg.x;e.y=tg.y;e.wp++; if(e.wp>=way.length){ leak(e); enemies.splice(i,1); } }
      else if(move>0){ e.x+=dx/d*move; e.y+=dy/d*move; }
    }
    for(var t=0;t<towers.length;t++){
      var tw=towers[t],T=TOWERS[tw.type],st=stat(tw);
      if(tw.skCd>0) tw.skCd-=dt*1000;
      if(tw.berserkT>0) tw.berserkT-=dt*1000;
      if(tw.chargeT>0) tw.chargeT-=dt*1000;
      if(autoSkill && T.skill && tw.skCd<=0 && shouldAutoCast(tw)) castSkill(tw);
      if(T.noatk){
        if(tw.type==="mine"){ tw.mineT-=dt*1000;
          if(tw.mineT<=0){ gold+=st.gold; popText(tw.x,tw.y-6,"+"+st.gold+" 🪙","#ffd166",1); tw.mineT=st.interval; syncHUD(); } }
        continue;
      }
      tw.cd-=dt*1000;
      var aura=auraFor(tw);
      var rate=st.rate/aura.rm; if(tw.berserkT>0) rate*=0.42;
      if(tw.cd<=0){
        var target=null,best=-Infinity;
        for(var k=0;k<enemies.length;k++){
          var en=enemies[k]; if(en.dead) continue;
          var ddx=en.x-tw.x,ddy=en.y-tw.y;
          if(ddx*ddx+ddy*ddy<=st.range*st.range){
            var prog=en.wp*10000-(Math.abs(way[en.wp]?way[en.wp].x-en.x:0)+Math.abs(way[en.wp]?way[en.wp].y-en.y:0));
            if(prog>best){ best=prog; target=en; }
          }
        }
        if(target){
          tw.cd=rate; tw.ang=Math.atan2(target.y-tw.y,target.x-tw.x);
          var dmg=st.dmg*aura.dm;
          if(tw.type==="chain"){ fireChain(tw,target,dmg,st); }
          else {
            bullets.push({x:tw.x,y:tw.y,tg:target,ex:target.x,ey:target.y,bs:st.bs,
              dmg:dmg,splash:st.splash||0,slow:st.slow||0,slowT:st.slowT||0,
              pdps:st.pdps||0,pdur:st.pdur||0,color:T.color});
          }
          beep(tw.type==="cannon"?120:tw.type==="sniper"?320:tw.type==="chain"?260:520,0.03);
        }
      }
    }
    for(var b=bullets.length-1;b>=0;b--){
      var bu=bullets[b];
      if(bu.tg && !bu.tg.dead){ bu.ex=bu.tg.x; bu.ey=bu.tg.y; }
      var bx=bu.ex-bu.x,by=bu.ey-bu.y,bd=Math.sqrt(bx*bx+by*by),bm=bu.bs*dt*60;
      if(bd<=bm||bd<2){ hitAt(bu); bullets.splice(b,1); }
      else { bu.x+=bx/bd*bm; bu.y+=by/bd*bm; }
    }
    for(var f=fx.length-1;f>=0;f--){ fx[f].life-=dt; if(fx[f].life<=0) fx.splice(f,1); else if(fx[f].vy!=null){ fx[f].y+=fx[f].vy*dt; } }
    if(state==="wave" && spawnIdx>=spawnQ.length && enemies.length===0){
      if(wave>=TOTAL_WAVES){ win(); }
      else { state="ready"; var bonus=10+wave; gold+=bonus; waveCountdown=2.5; popText(W/2,H/2,"波次清空 +"+bonus,"#ffd166",1.4); syncHUD(); }
    }
  }
  function hitAt(bu){
    if(bu.splash>0){
      addFx(bu.ex,bu.ey,bu.color,true);
      for(var k=0;k<enemies.length;k++){ var en=enemies[k]; if(en.dead) continue;
        var dx=en.x-bu.ex,dy=en.y-bu.ey; if(dx*dx+dy*dy<=bu.splash*bu.splash) damage(en,bu.dmg,bu.slow,bu.slowT); }
    } else {
      addFx(bu.ex,bu.ey,bu.color,false);
      if(bu.tg && !bu.tg.dead){ damage(bu.tg,bu.dmg,bu.slow,bu.slowT);
        if(bu.pdps>0 && !bu.tg.dead){ bu.tg.pdps=Math.max(bu.tg.pdps||0,bu.pdps); bu.tg.pT=bu.pdur; } }
    }
  }
  function auraFor(tw){
    var dm=1,rm=1;
    for(var i=0;i<towers.length;i++){ var b=towers[i]; if(b.type!=="buff") continue;
      var L=stat(b),dx=b.x-tw.x,dy=b.y-tw.y;
      if(dx*dx+dy*dy<=L.range*L.range){ dm+=L.dmgMul; rm+=L.rateMul; if(b.chargeT>0) rm+=0.6; } }
    return {dm:dm,rm:rm};
  }
  function fireChain(tw,first,dmg,st){
    var jumps=st.jumps||3, jr=st.jr||90, from=first, used=[first];
    arcFx(tw.x,tw.y,first.x,first.y); damage(first,dmg,0,0);
    for(var j=1;j<jumps;j++){
      var tgt=null,md=jr*jr;
      for(var k=0;k<enemies.length;k++){ var en=enemies[k]; if(en.dead||used.indexOf(en)>=0) continue;
        var dx=en.x-from.x,dy=en.y-from.y,dd=dx*dx+dy*dy; if(dd<md){ md=dd; tgt=en; } }
      if(!tgt) break;
      arcFx(from.x,from.y,tgt.x,tgt.y); damage(tgt,dmg*0.85,0,0); used.push(tgt); from=tgt;
    }
  }
  function damage(en,dmg,slowAmt,slowT){
    if(en.shield>0){ en.shield-=dmg; if(en.shield<0){ dmg=-en.shield; en.shield=0; } else { dmg=0; } }
    en.hp-=dmg;
    if(slowAmt>0 && !en.immuneSlow){ en.slow=slowAmt; en.slowT=slowT; }
    if(en.hp<=0 && !en.dead){ en.dead=true; gold+=en.reward; popText(en.x,en.y,"+"+en.reward,"#ffd166",0.9); syncHUD(); beep(700,0.04); if(en.split>0) doSplit(en); }
  }
  function leak(e){
    var dmg=e.type==="boss"?5:1;
    lives-=dmg; if(lives<0) lives=0;
    popText(way[way.length-1].x,way[way.length-1].y,"-"+dmg+" ❤️","#ff6584",1);
    syncHUD();

  function stat(tw){ return TOWERS[tw.type].L[tw.lvl]; }

  // ---- 主动技能 ----
  function shouldAutoCast(tw){
    if(tw.type==="mine") return false;                // 暴富不自动(避免被动刷钱失控)，需手动
    var i;
    if(tw.type==="sniper"){ for(i=0;i<enemies.length;i++) if(!enemies[i].dead) return true; return false; }
    var st=stat(tw),sk=TOWERS[tw.type].skill,R=st.range*(sk.rmul||1);
    for(i=0;i<enemies.length;i++){ var en=enemies[i]; if(en.dead) continue; var dx=en.x-tw.x,dy=en.y-tw.y; if(dx*dx+dy*dy<=R*R) return true; }

  function castSkill(tw){

    var st=stat(tw),R;

    } else if(tw.type==="cannon"){

        var dx=en.x-tw.x,dy=en.y-tw.y; if(dx*dx+dy*dy<=R*R){ damage(en,st.dmg*sk.mult,0,0); addFx(en.x,en.y,"#ff8c42",false); } }
      popText(tw.x,tw.y-10,"火力覆盖 💥","#ff8c42",1.2);
    } else if(tw.type==="frost"){
      R=st.range*sk.rmul;
      for(var j=0;j<enemies.length;j++){ var e2=enemies[j]; if(e2.dead) continue;
        var ex=e2.x-tw.x,ey=e2.y-tw.y; if(ex*ex+ey*ey<=R*R){ e2.slow=0.99; e2.slowT=sk.dur; addFx(e2.x,e2.y,"#9be7ff",false); } }

    } else if(tw.type==="chain"){

        var p1=e4.x-tw.x,p2=e4.y-tw.y; if(p1*p1+p2*p2<=R*R){ damage(e4,st.dmg*sk.mult,0,0); arcFx(tw.x,tw.y,e4.x,e4.y); } }
      popText(tw.x,tw.y-10,"过载 🌩️","#ffe14d",1.2);

        var q1=e5.x-tw.x,q2=e5.y-tw.y; if(q1*q1+q2*q2<=R*R){ e5.pdps=Math.max(e5.pdps||0,sk.pdps); e5.pT=sk.pdur; addFx(e5.x,e5.y,"#7fd957",false); } }
      addFx(tw.x,tw.y,"#7fd957",true); popText(tw.x,tw.y-10,"剧毒云 🟢","#7fd957",1.2);
    } else if(tw.type==="mine"){
      gold+=sk.bonus; popText(tw.x,tw.y-10,"暴富 +"+sk.bonus+" 🪙","#ffd166",1.3); syncHUD();
    } else if(tw.type==="buff"){
      tw.chargeT=sk.dur; addFx(tw.x,tw.y,"#56cfaf",true); popText(tw.x,tw.y-10,"冲锋号 📣","#56cfaf",1.3);
    }

  // ---- 绘制 ----
  function draw(){
    for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
      ctx.fillStyle=((r+c)%2)?"#1b2740":"#18233a";
      ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
      ctx.strokeStyle="rgba(255,255,255,.03)";ctx.lineWidth=1;ctx.strokeRect(c*CELL+.5,r*CELL+.5,CELL-1,CELL-1);
    }
    var sx=centerX(START.c),sy=centerY(START.r),ex=centerX(END.c),ey=centerY(END.r);
    if(phase==="draw"){
      // 已画路线格
      for(var i=0;i<pathCells.length;i++){ var pc=pathCells[i]; ctx.fillStyle="rgba(86,207,175,.18)"; ctx.fillRect(pc.c*CELL+2,pc.r*CELL+2,CELL-4,CELL-4); }
      if(pathCells.length>=2){
        ctx.strokeStyle="#56cfaf";ctx.lineWidth=5;ctx.lineJoin="round";ctx.lineCap="round";ctx.shadowColor="#56cfaf";ctx.shadowBlur=10;
        ctx.beginPath();ctx.moveTo(centerX(pathCells[0].c),centerY(pathCells[0].r));
        for(var j=1;j<pathCells.length;j++) ctx.lineTo(centerX(pathCells[j].c),centerY(pathCells[j].r));
        ctx.stroke();ctx.shadowBlur=0;
      }
    } else {
      // 道路
      for(var k=0;k<pathCells.length;k++){ var rc=pathCells[k]; ctx.fillStyle="#2a3654"; ctx.fillRect(rc.c*CELL,rc.r*CELL,CELL,CELL); }
      if(way.length>=2){
        drawPathLine(way,"#7ed6ff",false); drawFlowDots(way);
      }
    }
    // 起点终点
    ctx.fillStyle="rgba(126,214,255,.20)";ctx.fillRect(START.c*CELL,START.r*CELL,CELL,CELL);
    ctx.fillStyle="rgba(86,207,175,.20)";ctx.fillRect(END.c*CELL,END.r*CELL,CELL,CELL);
    ctx.font="22px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText("⬆️",sx,sy);ctx.fillText("🏁",ex,ey);

    if(phase==="play"){
      // 建造预览
      if(buildType && hoverCell){
        var ok=canBuild(hoverCell.c,hoverCell.r) && gold>=TOWERS[buildType].cost;
        var px=centerX(hoverCell.c),py=centerY(hoverCell.r);
        ctx.fillStyle=ok?"rgba(86,207,175,.25)":"rgba(255,101,132,.25)";
        ctx.fillRect(hoverCell.c*CELL+2,hoverCell.r*CELL+2,CELL-4,CELL-4);
        ctx.beginPath();ctx.arc(px,py,TOWERS[buildType].L[0].range,0,6.2832);
        ctx.fillStyle=ok?"rgba(86,207,175,.07)":"rgba(255,101,132,.05)";ctx.fill();
        ctx.strokeStyle=ok?"rgba(86,207,175,.4)":"rgba(255,101,132,.4)";ctx.lineWidth=1;ctx.stroke();
      }
      if(selected){
        ctx.beginPath();ctx.arc(selected.x,selected.y,stat(selected).range,0,6.2832);
        ctx.fillStyle="rgba(126,214,255,.08)";ctx.fill();
        ctx.strokeStyle="rgba(126,214,255,.5)";ctx.lineWidth=1.5;ctx.stroke();
      }
      for(var t=0;t<towers.length;t++) drawTower(towers[t]);
      for(var e=0;e<enemies.length;e++) drawEnemy(enemies[e]);
      for(var b=0;b<bullets.length;b++){ var bu=bullets[b];
        ctx.beginPath();ctx.arc(bu.x,bu.y,bu.splash>0?5:3.5,0,6.2832);
        ctx.fillStyle=bu.color;ctx.shadowColor=bu.color;ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0; }
    }
    for(var f=0;f<fx.length;f++) drawFx(fx[f]);
  }
  function drawTower(tw){
    var c=TOWERS[tw.type].color,x=tw.x,y=tw.y;
    if(tw.type==="buff"){ var BL=stat(tw); ctx.strokeStyle=tw.chargeT>0?"rgba(86,207,175,.6)":"rgba(86,207,175,.22)";ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(x,y,BL.range,0,6.2832);ctx.stroke();ctx.setLineDash([]); }
    ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.arc(x,y+3,CELL*0.34,0,6.2832);ctx.fill();
    ctx.fillStyle="#1a2238";ctx.fillRect(x-CELL*0.38,y-CELL*0.38,CELL*0.76,CELL*0.76);
    ctx.fillStyle="#10141f";ctx.beginPath();ctx.arc(x,y,CELL*0.3,0,6.2832);ctx.fill();
    ctx.lineWidth=2.5;ctx.strokeStyle=c;ctx.stroke();
    if(tw.berserkT>0){ ctx.strokeStyle="rgba(255,209,102,.8)";ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,CELL*0.42,0,6.2832);ctx.stroke(); }
    if(TOWERS[tw.type].skill && tw.skCd<=0){ ctx.fillStyle="#ffd166";ctx.beginPath();ctx.arc(x+CELL*0.28,y-CELL*0.28,3.2,0,6.2832);ctx.fill(); }
    ctx.font="20px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#fff";
    ctx.fillText(TOWERS[tw.type].icon,x,y+1);
    for(var i=0;i<=tw.lvl;i++){ ctx.beginPath();ctx.arc(x-7+i*7,y+CELL*0.34-1,2.4,0,6.2832);ctx.fillStyle="#ffd166";ctx.fill(); }
  }
  function drawEnemy(e){
    if(e.slowT>0){ ctx.fillStyle="rgba(120,200,255,.4)";ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,6.2832);ctx.fill(); }
    ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,6.2832);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.85)";ctx.beginPath();ctx.arc(e.x-e.r*0.3,e.y-e.r*0.3,e.r*0.3,0,6.2832);ctx.fill();
    if(e.shield>0){ ctx.strokeStyle="rgba(90,210,255,.95)";ctx.lineWidth=2.6;ctx.beginPath();ctx.arc(e.x,e.y,e.r+4,0,6.2832);ctx.stroke(); }
    if(e.immuneSlow){ ctx.strokeStyle="rgba(214,184,255,.8)";ctx.lineWidth=1.6;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(e.x,e.y,e.r+3,0,6.2832);ctx.stroke();ctx.setLineDash([]); }
    if(e.heal>0){ ctx.fillStyle="#eafff0";ctx.fillRect(e.x-1.5,e.y-5,3,10);ctx.fillRect(e.x-5,e.y-1.5,10,3); }
    if(e.split>0){ ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(e.x,e.y,e.r*0.5,0,6.2832);ctx.stroke(); }
    if(e.pT>0){ ctx.fillStyle="#7fd957";ctx.beginPath();ctx.arc(e.x+e.r*0.62,e.y-e.r*0.62,2.6,0,6.2832);ctx.fill(); }
    var w=e.r*2,hp=Math.max(0,e.hp/e.max);
    ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(e.x-w/2,e.y-e.r-8,w,4);
    ctx.fillStyle=hp>0.5?"#56cfaf":hp>0.25?"#ffd166":"#ff6584";
    ctx.fillRect(e.x-w/2,e.y-e.r-8,w*hp,4);
  }
  function drawPathLine(pts,color,dashed){
    if(!pts||pts.length<2) return;
    ctx.save();
    if(dashed) ctx.setLineDash([9,7]);
    ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineJoin="round";ctx.lineCap="round";
    ctx.shadowColor=color;ctx.shadowBlur=8;ctx.globalAlpha=dashed?0.95:0.55;
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.stroke();ctx.restore();
  }
  function drawFlowDots(pts){
    if(!pts||pts.length<2) return;
    var seg=[],total=0,i;
    for(i=0;i<pts.length-1;i++){ var dx=pts[i+1].x-pts[i].x,dy=pts[i+1].y-pts[i].y; var l=Math.sqrt(dx*dx+dy*dy); seg.push(l); total+=l; }
    var spacing=26, off=(animT*46)%spacing;
    ctx.fillStyle="rgba(180,230,255,.9)";
    for(var dpos=off; dpos<total; dpos+=spacing){
      var acc=0,si=0;
      while(si<seg.length && acc+seg[si]<dpos){ acc+=seg[si]; si++; }
      if(si>=seg.length) break;
      var t=(dpos-acc)/(seg[si]||1);
      var x=pts[si].x+(pts[si+1].x-pts[si].x)*t, y=pts[si].y+(pts[si+1].y-pts[si].y)*t;
      ctx.beginPath();ctx.arc(x,y,2.6,0,6.2832);ctx.fill();
    }
  }
  function addFx(x,y,color,big){ fx.push({x:x,y:y,color:color,life:0.28,max:0.28,r:big?26:12,vy:null}); }
  function arcFx(x1,y1,x2,y2){ fx.push({arc:true,x:x1,y:y1,x2:x2,y2:y2,color:"#ffe14d",life:0.2,max:0.2,vy:null}); }
  function popText(x,y,txt,color,life){ fx.push({x:x,y:y,txt:txt,color:color,life:life,max:life,vy:-26}); }
  function drawFx(f){
    var a=f.life/f.max;
    if(f.arc){
      ctx.globalAlpha=a;ctx.strokeStyle=f.color;ctx.shadowColor=f.color;ctx.shadowBlur=9;ctx.lineWidth=2.4;
      var mx=(f.x+f.x2)/2+Math.sin(a*40)*5,my=(f.y+f.y2)/2+Math.cos(a*40)*5;
      ctx.beginPath();ctx.moveTo(f.x,f.y);ctx.quadraticCurveTo(mx,my,f.x2,f.y2);ctx.stroke();
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    } else if(f.txt){
      ctx.globalAlpha=Math.min(1,a*1.4);ctx.fillStyle=f.color;ctx.font="bold 13px system-ui";ctx.textAlign="center";
      ctx.fillText(f.txt,f.x,f.y);ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=a;ctx.strokeStyle=f.color;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1-a+0.3),0,6.2832);ctx.stroke();ctx.globalAlpha=1;
    }
  }

  // ---- 交互 ----
  function cellAt(x,y){ return {c:Math.floor(x/CELL),r:Math.floor(y/CELL)}; }
  function inBounds(c,r){ return c>=0&&c<COLS&&r>=0&&r<ROWS; }
  function canBuild(c,r){
    if(!inBounds(c,r)) return false;
    if(occ[c+","+r]) return false;
    for(var i=0;i<towers.length;i++) if(towers[i].cc===c&&towers[i].rr===r) return false;
    return true;
  }
  function towerAt(x,y){
    var cell=cellAt(x,y);
    for(var i=0;i<towers.length;i++){ if(towers[i].cc===cell.c&&towers[i].rr===cell.r) return towers[i]; }
    return null;
  }
  function toLocal(ev){
    var rect=cv.getBoundingClientRect();
    var cx=(ev.touches?ev.touches[0].clientX:ev.clientX);
    var cy=(ev.touches?ev.touches[0].clientY:ev.clientY);
    return {x:(cx-rect.left)*(cv.width/rect.width),y:(cy-rect.top)*(cv.height/rect.height)};
  }
  // 画线路扩展(支持快速拖动跨格)
  function extendPath(cell){
    if(!inBounds(cell.c,cell.r)) return;
    var end=pathCells[pathCells.length-1];
    if(cellEq(cell,end)) return;
    if(pathCells.length>=2 && cellEq(cell,pathCells[pathCells.length-2])){ pathCells.pop(); return; }
    if(cellEq(end,END)) return;            // 到终点不再延伸
    if(adj(cell,end) && inPath(cell.c,cell.r)<0) pathCells.push({c:cell.c,r:cell.r});
  }
  // 建造
  var lastBuildKey=null;
  function countType(ty){ var n=0; for(var i=0;i<towers.length;i++) if(towers[i].type===ty) n++; return n; }
  function tryBuildAt(cell){
    if(!buildType) return;
    if(gold<TOWERS[buildType].cost){ popText(centerX(cell.c),centerY(cell.r),"金币不足","#ff6584",0.7); return; }
    if(LIMIT[buildType] && countType(buildType)>=LIMIT[buildType]){ popText(centerX(cell.c),centerY(cell.r),TOWERS[buildType].name+"已达上限 "+LIMIT[buildType],"#ff6584",0.8); return; }
    if(canBuild(cell.c,cell.r)){
      gold-=TOWERS[buildType].cost;
      towers.push({type:buildType,cc:cell.c,rr:cell.r,x:centerX(cell.c),y:centerY(cell.r),lvl:0,cd:0,ang:0,skCd:0,berserkT:0,mineT:0,chargeT:0,invested:TOWERS[buildType].cost});
      beep(440,0.05);syncHUD();renderShop();
    } else { popText(centerX(cell.c),centerY(cell.r),"不能建","#ff6584",0.6); }
  }
  cv.addEventListener("pointerdown",function(ev){
    var p=toLocal(ev),cell=cellAt(p.x,p.y);
    if(phase==="draw"){
      var end=pathCells[pathCells.length-1];
      if(cellEq(cell,START)){ pathCells=[{c:START.c,r:START.r}]; drawing=true; }
      else if(cellEq(cell,end)){ drawing=true; }
      else if(inBounds(cell.c,cell.r) && adj(cell,end) && inPath(cell.c,cell.r)<0){ drawing=true; extendPath(cell); }
      updateConfirmBtn();
      return;
    }
    if(state==="over"||state==="win") return;
    var hit=towerAt(p.x,p.y);
    if(hit){ buildType=null; selectTower(hit); return; }   // 点中已建的塔 → 优先选中(查看/升级)
    if(buildType){ drawing=true; lastBuildKey=cell.c+","+cell.r; tryBuildAt(cell); }
    else { deselect(); }
  });
  cv.addEventListener("pointermove",function(ev){
    var p=toLocal(ev),cell=cellAt(p.x,p.y);
    if(phase==="draw"){ if(drawing){ extendPath(cell); updateConfirmBtn(); } return; }
    hoverCell=buildType?cell:null;
    if(drawing&&buildType){ var key=cell.c+","+cell.r; if(key!==lastBuildKey){ lastBuildKey=key; tryBuildAt(cell); } }
  });
  cv.addEventListener("pointerup",function(){ drawing=false; });
  cv.addEventListener("pointercancel",function(){ drawing=false; });
  cv.addEventListener("pointerleave",function(){ drawing=false; hoverCell=null; });

  // ---- 路线确认 / 重画 ----
  var confirmBtn=document.getElementById("confirmPath"),redrawBtn=document.getElementById("redraw");
  function updateConfirmBtn(){ confirmBtn.disabled=!pathDone(); }
  confirmBtn.addEventListener("click",function(){
    if(!pathDone()){ popText(centerX(END.c),centerY(END.r),"先把线画到 🏁","#ff6584",1.2); return; }
    lockPath(); phase="play"; updatePhaseUI(); syncHUD(); renderShop(); beep(660,0.06);
  });
  redrawBtn.addEventListener("click",function(){ pathCells=[{c:START.c,r:START.r}]; updateConfirmBtn(); beep(300,0.05); });

  // ---- 商店 / 升级面板 ----
  var ctrl=document.getElementById("ctrl");
  function renderShop(){
    var html="";
    for(var key in TOWERS){
      var T=TOWERS[key],poor=gold<T.cost?" poor":"",on=buildType===key?" on":"";
      html+='<div class="tw'+poor+on+'" data-t="'+key+'"><div class="ic">'+T.icon+'</div><div class="nm">'+T.name+'</div><div class="pr">🪙'+T.cost+'</div><div class="de">'+T.desc+'</div></div>';
    }
    shop.innerHTML=html;
  }
  shop.addEventListener("click",function(ev){
    var el=ev.target.closest?ev.target.closest(".tw"):null; if(!el) return;
    var key=el.getAttribute("data-t");
    if(gold<TOWERS[key].cost){ return; }
    buildType=(buildType===key)?null:key;
    deselect(true);renderShop();
  });
  function selectTower(tw){ selected=tw;buildType=null;renderShop();shop.classList.remove("show");ctrl.classList.add("show");renderCtrl(); }
  function renderCtrl(){
    if(!selected) return;
    var tw=selected,T=TOWERS[tw.type],L=T.L[tw.lvl],max=tw.lvl>=T.L.length-1;
    var upCost=max?0:T.up[tw.lvl];
    var props;
    if(tw.type==="mine"){ props='每 '+(L.interval/1000).toFixed(1)+' 秒产 🪙'+L.gold; }
    else if(tw.type==="buff"){ props='范围 '+Math.round(L.range)+' · 增伤 +'+Math.round(L.dmgMul*100)+'% · 增速 +'+Math.round(L.rateMul*100)+'%'; }
    else {
      props='伤害 '+L.dmg+' · 射程 '+Math.round(L.range)+' · 速度 '+(1000/L.rate).toFixed(1)+'/秒';
      if(L.splash) props+=' · 溅射';
      if(L.slow) props+=' · 减速'+Math.round(L.slow*100)+'%';
      if(L.jumps) props+=' · 链 '+L.jumps+' 目标';
      if(L.pdps) props+=' · 毒 '+L.pdps+'/秒';
    }
    var sell=Math.floor(tw.invested*0.6);
    var sk=T.skill,skBtn='';
    if(sk){ var rdy=tw.skCd<=0;
      skBtn='<button class="skbtn" id="skBtn"'+(rdy?'':' disabled')+'>'+sk.icon+' '+sk.name+(rdy?' · 就绪':' · '+Math.ceil(tw.skCd/1000)+'s')+'</button>'; }
    var upBtn=max?'<button class="up" disabled>已满级</button>'
      :'<button class="up" id="upBtn"'+(gold<upCost?' disabled':'')+'>升级 🪙'+upCost+'</button>';
    ctrl.innerHTML='<div class="top"><span class="ic">'+T.icon+'</span><div><div class="ti">'+T.name+
      ' <span class="lv">Lv.'+(tw.lvl+1)+'/'+T.L.length+'</span></div></div></div>'+
      '<div class="props">'+props+'</div>'+skBtn+'<div class="acts">'+upBtn+
      '<button class="sell" id="sellBtn">出售 🪙'+sell+'</button>'+
      '<button class="close" id="closeBtn">✕</button></div>';
    var ub=document.getElementById("upBtn");
    if(ub) ub.addEventListener("click",function(){
      if(tw.lvl>=T.L.length-1||gold<upCost) return;
      gold-=upCost;tw.invested+=upCost;tw.lvl++;beep(660,0.05);syncHUD();renderShop();renderCtrl(); });
    var skb=document.getElementById("skBtn");
    if(skb) skb.addEventListener("click",function(){ castSkill(tw); });
    document.getElementById("sellBtn").addEventListener("click",function(){
      gold+=sell;var ix=towers.indexOf(tw);if(ix>=0)towers.splice(ix,1);
      beep(300,0.05);syncHUD();renderShop();deselect(); });
    document.getElementById("closeBtn").addEventListener("click",function(){ deselect(); });
  }
  function hideCtrl(){ ctrl.classList.remove("show"); ctrl.innerHTML=""; if(phase==="play") shop.classList.add("show"); }
  function deselect(keepShop){ selected=null; hideCtrl(); if(!keepShop) renderShop(); }

  // ---- 结束 ----
  var ovl=document.getElementById("ovl"),ot=document.getElementById("ot"),op=document.getElementById("op"),sb=document.getElementById("startBtn");
  function win(){ state="win"; ot.textContent="🎉 守住了！"; ot.className="win"; op.innerHTML="你的防线挡住了全部 <b>20</b> 波进攻！<br>最终剩余 ❤️ <b>"+lives+"</b>"; sb.textContent="再玩一次"; ovl.classList.remove("hidden"); }
  function lose(){ state="over"; ot.textContent="💀 防线告破"; ot.className="lose"; op.innerHTML="基地失守在第 <b>"+wave+"</b> 波。<br>下次把路线画得更绕、火力更集中？"; sb.textContent="重新开始"; ovl.classList.remove("hidden"); }

  // ---- 音效 ----
  var AC=null;
  function beep(freq,dur){
    if(muted) return;
    try{
      if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
      var o=AC.createOscillator(),g=AC.createGain();
      o.frequency.value=freq;o.type="triangle";
      g.gain.value=0.04;o.connect(g);g.connect(AC.destination);
      o.start();g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
      o.stop(AC.currentTime+dur+0.02);
    }catch(e){}
  }

  // ---- 按钮 ----
  document.getElementById("next").addEventListener("click",startWave);
  document.getElementById("auto").addEventListener("click",function(){ autoSkill=!autoSkill; this.textContent=autoSkill?"⚡自动":"⚡手动"; if(autoSkill) this.classList.add("on"); else this.classList.remove("on"); });
  document.getElementById("autowave").addEventListener("click",function(){ autoWave=!autoWave; this.textContent=autoWave?"🌊自动":"🌊手动"; if(autoWave){ this.classList.add("on"); waveCountdown=2.5; } else { this.classList.remove("on"); syncHUD(); } });
  document.getElementById("s1").addEventListener("click",function(){ timeScale=1;this.classList.add("on");document.getElementById("s2").classList.remove("on"); });
  document.getElementById("s2").addEventListener("click",function(){ timeScale=2;this.classList.add("on");document.getElementById("s1").classList.remove("on"); });
  sb.addEventListener("click",function(){ reset(); ovl.classList.add("hidden"); });

  reset();
  requestAnimationFrame(function(t){ lastT=t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
