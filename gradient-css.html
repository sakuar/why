<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>渐变生成器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f2f7;
    --card: #ffffff;
    --border: #e2e6f0;
    --text: #1a1d2e;
    --muted: #6b7280;
    --accent: #6366f1;
    --accent-light: #eef2ff;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  .back-link {
    display: inline-block;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    margin-bottom: 20px;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--accent); }

  .page-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .page-sub {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .layout {
    max-width: 860px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    padding: 24px;
  }

  /* Preview */
  .preview-card {
    grid-column: 1 / -1;
  }

  .preview-box {
    width: 100%;
    height: 200px;
    border-radius: 12px;
    transition: background 0.35s ease;
    position: relative;
    overflow: hidden;
  }

  .preview-box::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 12px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
  }

  /* Controls card */
  .section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .color-stops {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 20px;
  }

  .stop-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .stop-row label {
    font-size: 13px;
    color: var(--muted);
    min-width: 36px;
  }

  .color-swatch-wrap {
    position: relative;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: border-color 0.2s, transform 0.15s;
    flex-shrink: 0;
  }
  .color-swatch-wrap:hover {
    border-color: var(--accent);
    transform: scale(1.05);
  }

  .color-swatch-wrap input[type="color"] {
    position: absolute;
    inset: -6px;
    width: calc(100% + 12px);
    height: calc(100% + 12px);
    border: none;
    cursor: pointer;
    opacity: 0;
  }

  .color-preview {
    width: 100%;
    height: 100%;
    border-radius: 8px;
    pointer-events: none;
    transition: background 0.2s;
  }

  .hex-input {
    flex: 1;
    height: 40px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 0 10px;
    font-size: 13px;
    font-family: "SF Mono", "Fira Code", monospace;
    color: var(--text);
    background: #fafbff;
    outline: none;
    transition: border-color 0.2s;
    text-transform: uppercase;
    min-width: 0;
  }
  .hex-input:focus { border-color: var(--accent); }

  .stop-pos {
    width: 56px;
    height: 40px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 0 8px;
    font-size: 13px;
    color: var(--text);
    background: #fafbff;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
    flex-shrink: 0;
  }
  .stop-pos:focus { border-color: var(--accent); }

  .stop-count-btns {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .icon-btn {
    width: 32px;
    height: 32px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: #fafbff;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .icon-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Angle */
  .angle-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 8px;
  }

  .angle-dial-wrap {
    width: 54px;
    height: 54px;
    flex-shrink: 0;
    position: relative;
    cursor: grab;
    user-select: none;
  }
  .angle-dial-wrap:active { cursor: grabbing; }

  .dial-circle {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: #fafbff;
    position: relative;
    transition: border-color 0.2s;
  }
  .angle-dial-wrap:hover .dial-circle { border-color: var(--accent); }

  .dial-needle {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 2px;
    height: 20px;
    background: var(--accent);
    border-radius: 1px;
    transform-origin: bottom center;
    transform: translateX(-50%) translateY(-100%) rotate(0deg);
    transition: transform 0.05s;
  }

  .dial-dot {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    background: var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .angle-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right, var(--accent-light), var(--accent));
    outline: none;
    cursor: pointer;
  }
  .angle-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(99,102,241,0.4);
    transition: transform 0.15s;
  }
  .angle-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

  .angle-value {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    min-width: 42px;
    text-align: right;
  }

  /* Gradient type */
  .type-row {
    display: flex;
    gap: 8px;
    margin-bottom: 0;
  }

  .type-btn {
    flex: 1;
    height: 36px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: #fafbff;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }
  .type-btn:hover { border-color: var(--accent); color: var(--accent); }
  .type-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* CSS Output */
  .output-card { grid-column: 1 / -1; }

  .css-output-wrap {
    position: relative;
    margin-bottom: 12px;
  }

  .css-output {
    width: 100%;
    background: #0f1117;
    color: #a5f3fc;
    border-radius: 10px;
    padding: 16px;
    font-size: 13px;
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    border: none;
    outline: none;
    resize: none;
    line-height: 1.7;
    min-height: 80px;
  }

  .copy-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .copy-btn:hover { background: #4f46e5; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(99,102,241,0.4); }
  .copy-btn:active { transform: translateY(0); }
  .copy-btn.copied { background: #10b981; }

  .copy-btn .copy-icon { font-size: 16px; }

  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .random-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 20px;
    background: linear-gradient(135deg, #f43f5e, #f97316, #eab308);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .random-btn:hover { opacity: 0.88; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(244,63,94,0.35); }
  .random-btn:active { transform: translateY(0); }

  /* Presets */
  .presets-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap: 8px;
  }

  .preset-chip {
    height: 40px;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.18s;
    position: relative;
  }
  .preset-chip:hover { transform: scale(1.06); border-color: rgba(255,255,255,0.6); }
  .preset-chip.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

  /* Notification toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1d2e;
    color: #fff;
    padding: 10px 20px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 500;
    pointer-events: none;
    transition: transform 0.3s cubic-bezier(.34,1.56,.64,1), opacity 0.3s;
    opacity: 0;
    z-index: 999;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div style="max-width:860px;margin:0 auto;">
  <a href="index.html" class="back-link">← 入口</a>
  <div class="page-title">渐变生成器</div>
  <div class="page-sub">可视化调整颜色和角度，一键复制 CSS 代码</div>
</div>

<div class="layout">

  <!-- Preview -->
  <div class="card preview-card">
    <div class="section-label">实时预览</div>
    <div class="preview-box" id="previewBox"></div>
  </div>

  <!-- Controls -->
  <div class="card">
    <div class="section-label">颜色节点</div>

    <div class="color-stops" id="colorStops"></div>

    <div class="stop-count-btns">
      <button class="icon-btn" id="btnRemoveStop" title="删除最后一个颜色">−</button>
      <button class="icon-btn" id="btnAddStop" title="添加颜色">+</button>
    </div>

    <div class="section-label">角度</div>
    <div class="angle-row">
      <div class="angle-dial-wrap" id="angleDial">
        <div class="dial-circle">
          <div class="dial-needle" id="dialNeedle"></div>
          <div class="dial-dot"></div>
        </div>
      </div>
      <input type="range" class="angle-slider" id="angleSlider" min="0" max="360" value="135">
      <span class="angle-value" id="angleValue">135°</span>
    </div>

    <div class="section-label" style="margin-top:16px;">类型</div>
    <div class="type-row">
      <button class="type-btn active" data-type="linear" id="btnLinear">线性</button>
      <button class="type-btn" data-type="radial" id="btnRadial">径向</button>
      <button class="type-btn" data-type="conic" id="btnConic">锥形</button>
    </div>
  </div>

  <!-- Presets -->
  <div class="card">
    <div class="section-label">精选配色</div>
    <div class="presets-grid" id="presetsGrid"></div>
  </div>

  <!-- Output -->
  <div class="card output-card">
    <div class="section-label">生成的 CSS 代码</div>
    <div class="css-output-wrap">
      <textarea class="css-output" id="cssOutput" rows="4" readonly></textarea>
    </div>
    <div class="btn-row">
      <button class="copy-btn" id="copyBtn">
        <span class="copy-icon">⎘</span> 复制代码
      </button>
      <button class="random-btn" id="randomBtn">
        ✦ 随机漂亮配色
      </button>
    </div>
  </div>

</div>

<div class="toast" id="toast">已复制到剪贴板！</div>

<script>
(function () {
  "use strict";

  /* ============ Constants ============ */
  var STORAGE_KEY = "gradient_gen_state";

  var PRESETS = [
    { stops: ["#667eea", "#764ba2"], angle: 135 },
    { stops: ["#f093fb", "#f5576c"], angle: 135 },
    { stops: ["#4facfe", "#00f2fe"], angle: 135 },
    { stops: ["#43e97b", "#38f9d7"], angle: 135 },
    { stops: ["#fa709a", "#fee140"], angle: 135 },
    { stops: ["#a18cd1", "#fbc2eb"], angle: 135 },
    { stops: ["#ffecd2", "#fcb69f"], angle: 120 },
    { stops: ["#ff9a9e", "#fecfef", "#fecfef"], angle: 180 },
    { stops: ["#a1c4fd", "#c2e9fb"], angle: 120 },
    { stops: ["#fd7043", "#ffb74d", "#fff176"], angle: 90 },
    { stops: ["#1a1a2e", "#16213e", "#0f3460"], angle: 135 },
    { stops: ["#0f0c29", "#302b63", "#24243e"], angle: 135 },
    { stops: ["#11998e", "#38ef7d"], angle: 135 },
    { stops: ["#ee0979", "#ff6a00"], angle: 135 },
    { stops: ["#c471ed", "#12c2e9", "#f64f59"], angle: 135 },
    { stops: ["#f7971e", "#ffd200"], angle: 135 },
    { stops: ["#56ccf2", "#2f80ed"], angle: 135 },
    { stops: ["#e96c5a", "#f4a261", "#e9c46a"], angle: 90 },
  ];

  var RANDOM_PALETTES = [
    ["#ff6b6b", "#feca57", "#48dbfb"],
    ["#ff9ff3", "#54a0ff", "#5f27cd"],
    ["#00d2d3", "#1dd1a1", "#10ac84"],
    ["#ff6348", "#ff4757", "#2f3542"],
    ["#a29bfe", "#6c5ce7", "#fd79a8"],
    ["#fdcb6e", "#e17055", "#d63031"],
    ["#55efc4", "#00b894", "#00cec9"],
    ["#74b9ff", "#0984e3", "#2d3436"],
    ["#fab1a0", "#e17055", "#636e72"],
    ["#ffeaa7", "#fdcb6e", "#e17055"],
    ["#dfe6e9", "#b2bec3", "#636e72"],
    ["#fd79a8", "#e84393", "#6c5ce7"],
    ["#00b4d8", "#90e0ef", "#caf0f8"],
    ["#f72585", "#7209b7", "#3a0ca3"],
    ["#4cc9f0", "#4361ee", "#3f37c9"],
    ["#06d6a0", "#118ab2", "#073b4c"],
  ];

  /* ============ State ============ */
  var state = {
    stops: ["#667eea", "#764ba2"],
    positions: [0, 100],
    angle: 135,
    type: "linear"
  };

  /* ============ DOM refs ============ */
  var previewBox = document.getElementById("previewBox");
  var colorStopsContainer = document.getElementById("colorStops");
  var angleSlider = document.getElementById("angleSlider");
  var angleValue = document.getElementById("angleValue");
  var dialNeedle = document.getElementById("dialNeedle");
  var angleDial = document.getElementById("angleDial");
  var cssOutput = document.getElementById("cssOutput");
  var copyBtn = document.getElementById("copyBtn");
  var randomBtn = document.getElementById("randomBtn");
  var presetsGrid = document.getElementById("presetsGrid");
  var btnAddStop = document.getElementById("btnAddStop");
  var btnRemoveStop = document.getElementById("btnRemoveStop");
  var toast = document.getElementById("toast");
  var btnLinear = document.getElementById("btnLinear");
  var btnRadial = document.getElementById("btnRadial");
  var btnConic = document.getElementById("btnConic");

  /* ============ Helpers ============ */
  function hexToRgb(hex) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return [r, g, b];
  }

  function isValidHex(hex) {
    return /^#[0-9A-Fa-f]{6}$/.test(hex);
  }

  function clamp(v, lo, hi) {
    return Math.max(lo, Math.min(hi, v));
  }

  function distributePositions(n) {
    var arr = [];
    for (var i = 0; i < n; i++) {
      arr.push(Math.round((i / (n - 1)) * 100));
    }
    return arr;
  }

  function buildGradientCss() {
    var stopsStr = state.stops.map(function (c, i) {
      return c + " " + state.positions[i] + "%";
    }).join(", ");

    if (state.type === "linear") {
      return "linear-gradient(" + state.angle + "deg, " + stopsStr + ")";
    } else if (state.type === "radial") {
      return "radial-gradient(circle, " + stopsStr + ")";
    } else {
      return "conic-gradient(from " + state.angle + "deg, " + stopsStr + ")";
    }
  }

  function buildFullCss() {
    return "background: " + buildGradientCss() + ";";
  }

  /* ============ Render ============ */
  function updatePreview() {
    var grad = buildGradientCss();
    previewBox.style.background = grad;
  }

  function updateAngleUI() {
    angleSlider.value = state.angle;
    angleValue.textContent = state.angle + "°";
    dialNeedle.style.transform = "translateX(-50%) translateY(-100%) rotate(" + state.angle + "deg)";
  }

  function renderStopRows() {
    colorStopsContainer.innerHTML = "";
    state.stops.forEach(function (color, idx) {
      var row = document.createElement("div");
      row.className = "stop-row";

      var label = document.createElement("label");
      label.textContent = "色 " + (idx + 1);

      var swatchWrap = document.createElement("div");
      swatchWrap.className = "color-swatch-wrap";

      var preview = document.createElement("div");
      preview.className = "color-preview";
      preview.style.background = color;

      var colorInput = document.createElement("input");
      colorInput.type = "color";
      colorInput.value = color;

      (function (i) {
        colorInput.addEventListener("input", function () {
          state.stops[i] = colorInput.value;
          preview.style.background = colorInput.value;
          hexField.value = colorInput.value.toUpperCase();
          update();
        });
      }(idx));

      swatchWrap.appendChild(preview);
      swatchWrap.appendChild(colorInput);

      var hexField = document.createElement("input");
      hexField.type = "text";
      hexField.className = "hex-input";
      hexField.value = color.toUpperCase();
      hexField.maxLength = 7;
      hexField.placeholder = "#000000";

      (function (i, sw, pv, cf) {
        hexField.addEventListener("input", function () {
          var val = hexField.value.trim();
          if (!val.startsWith("#")) val = "#" + val;
          if (isValidHex(val)) {
            state.stops[i] = val;
            pv.style.background = val;
            cf.value = val;
            update();
          }
        });
        hexField.addEventListener("blur", function () {
          if (!isValidHex(hexField.value.trim())) {
            hexField.value = state.stops[i].toUpperCase();
          }
        });
      }(idx, swatchWrap, preview, colorInput));

      var posField = document.createElement("input");
      posField.type = "number";
      posField.className = "stop-pos";
      posField.value = state.positions[idx];
      posField.min = 0;
      posField.max = 100;
      posField.title = "位置 %";

      (function (i) {
        posField.addEventListener("input", function () {
          var v = parseInt(posField.value, 10);
          if (!isNaN(v)) {
            state.positions[i] = clamp(v, 0, 100);
            update();
          }
        });
      }(idx));

      row.appendChild(label);
      row.appendChild(swatchWrap);
      row.appendChild(hexField);
      row.appendChild(posField);
      colorStopsContainer.appendChild(row);
    });

    btnRemoveStop.disabled = state.stops.length <= 2;
    btnAddStop.disabled = state.stops.length >= 5;
  }

  function renderPresets() {
    presetsGrid.innerHTML = "";
    PRESETS.forEach(function (p, idx) {
      var chip = document.createElement("div");
      chip.className = "preset-chip";
      var grad = "linear-gradient(" + p.angle + "deg, " + p.stops.join(", ") + ")";
      chip.style.background = grad;
      chip.title = p.stops.join(" → ");
      chip.addEventListener("click", function () {
        applyPreset(p);
        document.querySelectorAll(".preset-chip").forEach(function (c) { c.classList.remove("active"); });
        chip.classList.add("active");
      });
      presetsGrid.appendChild(chip);
    });
  }

  function applyPreset(p) {
    state.stops = p.stops.slice();
    state.angle = p.angle;
    state.positions = distributePositions(state.stops.length);
    state.type = "linear";
    updateTypeButtons();
    updateAngleUI();
    renderStopRows();
    update();
  }

  function updateTypeButtons() {
    [btnLinear, btnRadial, btnConic].forEach(function (btn) {
      btn.classList.remove("active");
    });
    if (state.type === "linear") btnLinear.classList.add("active");
    else if (state.type === "radial") btnRadial.classList.add("active");
    else btnConic.classList.add("active");

    var angleRow = angleSlider.parentElement;
    angleRow.style.opacity = (state.type === "radial") ? "0.35" : "1";
    angleRow.style.pointerEvents = (state.type === "radial") ? "none" : "";
  }

  function update() {
    updatePreview();
    cssOutput.value = buildFullCss();
    saveState();
  }

  /* ============ Persistence ============ */
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var saved = JSON.parse(raw);
        if (saved && Array.isArray(saved.stops) && saved.stops.length >= 2) {
          state.stops = saved.stops;
          state.angle = (typeof saved.angle === "number") ? saved.angle : 135;
          state.type = saved.type || "linear";
          state.positions = Array.isArray(saved.positions) && saved.positions.length === saved.stops.length
            ? saved.positions
            : distributePositions(saved.stops.length);
        }
      }
    } catch (e) {}
  }

  /* ============ Events ============ */
  angleSlider.addEventListener("input", function () {
    state.angle = parseInt(angleSlider.value, 10);
    updateAngleUI();
    update();
  });

  /* Dial drag */
  var dialDragging = false;

  function getDialAngle(e) {
    var rect = angleDial.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var dx = (e.touches ? e.touches[0].clientX : e.clientX) - cx;
    var dy = (e.touches ? e.touches[0].clientY : e.clientY) - cy;
    var deg = Math.round(Math.atan2(dx, -dy) * (180 / Math.PI));
    if (deg < 0) deg += 360;
    return deg;
  }

  angleDial.addEventListener("mousedown", function (e) {
    dialDragging = true;
    state.angle = getDialAngle(e);
    updateAngleUI();
    update();
    e.preventDefault();
  });

  angleDial.addEventListener("touchstart", function (e) {
    dialDragging = true;
    state.angle = getDialAngle(e);
    updateAngleUI();
    update();
  }, { passive: true });

  document.addEventListener("mousemove", function (e) {
    if (!dialDragging) return;
    state.angle = getDialAngle(e);
    updateAngleUI();
    update();
  });

  document.addEventListener("touchmove", function (e) {
    if (!dialDragging) return;
    state.angle = getDialAngle(e);
    updateAngleUI();
    update();
  }, { passive: true });

  document.addEventListener("mouseup", function () { dialDragging = false; });
  document.addEventListener("touchend", function () { dialDragging = false; });

  btnAddStop.addEventListener("click", function () {
    if (state.stops.length >= 5) return;
    var last = state.stops[state.stops.length - 1];
    var rgb = hexToRgb(last);
    var newR = clamp(rgb[0] + 40, 0, 255);
    var newG = clamp(rgb[1] - 20, 0, 255);
    var newB = clamp(rgb[2] + 60, 0, 255);
    var newColor = "#" + [newR, newG, newB].map(function (v) {
      return ("0" + v.toString(16)).slice(-2);
    }).join("");
    state.stops.push(newColor);
    state.positions = distributePositions(state.stops.length);
    renderStopRows();
    update();
  });

  btnRemoveStop.addEventListener("click", function () {
    if (state.stops.length <= 2) return;
    state.stops.pop();
    state.positions = distributePositions(state.stops.length);
    renderStopRows();
    update();
  });

  [btnLinear, btnRadial, btnConic].forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.type = btn.getAttribute("data-type");
      updateTypeButtons();
      update();
    });
  });

  var toastTimer = null;
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove("show");
    }, 2000);
  }

  copyBtn.addEventListener("click", function () {
    var text = cssOutput.value;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        copyBtn.classList.add("copied");
        copyBtn.innerHTML = '<span class="copy-icon">✓</span> 已复制！';
        showToast("已复制到剪贴板！");
        setTimeout(function () {
          copyBtn.classList.remove("copied");
          copyBtn.innerHTML = '<span class="copy-icon">⎘</span> 复制代码';
        }, 2000);
      });
    } else {
      cssOutput.select();
      document.execCommand("copy");
      showToast("已复制到剪贴板！");
    }
  });

  randomBtn.addEventListener("click", function () {
    var palette = RANDOM_PALETTES[Math.floor(Math.random() * RANDOM_PALETTES.length)];
    var n = Math.random() > 0.4 ? 2 : 3;
    state.stops = palette.slice(0, n);
    state.angle = Math.floor(Math.random() * 360);
    state.positions = distributePositions(state.stops.length);
    state.type = "linear";
    updateTypeButtons();
    updateAngleUI();
    renderStopRows();
    update();
    document.querySelectorAll(".preset-chip").forEach(function (c) { c.classList.remove("active"); });

    randomBtn.style.transform = "scale(0.95)";
    setTimeout(function () { randomBtn.style.transform = ""; }, 120);
  });

  /* ============ Init ============ */
  loadState();
  renderPresets();
  renderStopRows();
  updateAngleUI();
  updateTypeButtons();
  update();

}());
</script>
</body>
</html>
