<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222635;
    --border: #2e3348;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --text: #e2e8f0;
    --text-muted: #8892a4;
    --green: #34d399;
    --yellow: #fbbf24;
    --orange: #f97316;
    --red: #f87171;
    --radius: 14px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    padding: 16px;
    line-height: 1.6;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 24px;
    transition: color .2s;
    position: relative;
    z-index: 1;
  }
  .back-link:hover { color: var(--text); }

  .container {
    max-width: 520px;
    margin: 0 auto;
  }

  .hero {
    text-align: center;
    margin-bottom: 32px;
  }
  .hero h1 {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .hero p { color: var(--text-muted); font-size: 14px; }

  /* Tab switcher */
  .tabs {
    display: flex;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: all .25s;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 12px rgba(108,99,255,.4);
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }

  /* Password display */
  .pwd-display {
    position: relative;
    margin-bottom: 16px;
  }
  .pwd-output {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    font-size: 16px;
    padding: 14px 50px 14px 16px;
    letter-spacing: .05em;
    word-break: break-all;
    min-height: 54px;
    line-height: 1.4;
    outline: none;
    resize: none;
    transition: border-color .2s;
  }
  .pwd-output:focus { border-color: var(--accent); }

  .copy-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    padding: 6px;
    border-radius: 6px;
    transition: all .2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .copy-btn:hover { color: var(--accent2); background: rgba(108,99,255,.1); }
  .copy-btn.copied { color: var(--green); }

  /* Strength bar */
  .strength-wrap { margin-bottom: 18px; }
  .strength-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 6px;
  }
  .strength-name { font-weight: 600; }
  .strength-score { color: var(--text-muted); }
  .strength-bar-bg {
    height: 6px;
    background: var(--surface2);
    border-radius: 99px;
    overflow: hidden;
  }
  .strength-bar {
    height: 100%;
    border-radius: 99px;
    transition: width .4s cubic-bezier(.4,0,.2,1), background .4s;
    width: 0%;
  }

  /* Controls */
  .control-group { margin-bottom: 18px; }
  .control-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .control-label span {
    font-weight: 600;
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 13px;
  }

  /* Range slider */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    background: var(--surface2);
    border-radius: 99px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--bg);
    box-shadow: 0 0 8px rgba(108,99,255,.5);
    cursor: pointer;
    transition: transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type=range]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--bg);
    cursor: pointer;
  }

  /* Checkboxes */
  .checks-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .check-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    cursor: pointer;
    transition: all .2s;
    user-select: none;
  }
  .check-item:hover { border-color: var(--accent); }
  .check-item.checked { border-color: var(--accent); background: rgba(108,99,255,.08); }
  .check-item input[type=checkbox] { display: none; }
  .check-box {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all .2s;
    background: var(--surface);
  }
  .check-item.checked .check-box {
    background: var(--accent);
    border-color: var(--accent);
  }
  .check-tick {
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    opacity: 0;
    transform: scale(0);
    transition: all .2s;
  }
  .check-item.checked .check-tick { opacity: 1; transform: scale(1); }
  .check-text { font-size: 13px; font-weight: 500; }
  .check-sample { font-size: 11px; color: var(--text-muted); font-family: monospace; }

  /* Generate button */
  .gen-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    padding: 14px;
    cursor: pointer;
    transition: all .2s;
    box-shadow: 0 4px 20px rgba(108,99,255,.35);
    letter-spacing: .02em;
  }
  .gen-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(108,99,255,.5);
  }
  .gen-btn:active { transform: translateY(0); }

  /* Memo mode */
  .memo-section { display: none; }
  .memo-section.visible { display: block; }
  .strong-section { display: block; }
  .strong-section.hidden { display: none; }

  .word-count-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .word-count-row label { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .number-btns {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 4px 10px;
  }
  .num-btn {
    background: none;
    border: none;
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    transition: color .15s;
  }
  .num-btn:hover { color: var(--accent2); }
  .num-val { font-weight: 700; font-size: 15px; min-width: 20px; text-align: center; }

  .sep-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .sep-row label { font-size: 13px; color: var(--text-muted); }
  .sep-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .sep-btn {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
    font-family: monospace;
  }
  .sep-btn.active { border-color: var(--accent); color: var(--accent2); background: rgba(108,99,255,.1); }

  /* History */
  .history-section { margin-top: 16px; }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .history-title { font-size: 13px; color: var(--text-muted); font-weight: 600; }
  .clear-hist {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    transition: color .15s;
  }
  .clear-hist:hover { color: var(--red); }
  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 180px;
    overflow-y: auto;
  }
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }
  .hist-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 12px;
    gap: 10px;
    transition: border-color .2s;
  }
  .hist-item:hover { border-color: var(--accent); }
  .hist-pwd {
    font-family: monospace;
    font-size: 13px;
    color: var(--text);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
  }
  .hist-copy {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 12px;
    transition: color .15s;
    flex-shrink: 0;
  }
  .hist-copy:hover { color: var(--accent2); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 22px;
    border-radius: 99px;
    font-size: 14px;
    font-weight: 500;
    box-shadow: 0 8px 32px rgba(0,0,0,.4);
    transition: transform .3s cubic-bezier(.4,0,.2,1), opacity .3s;
    opacity: 0;
    z-index: 999;
    white-space: nowrap;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  @media (max-width: 400px) {
    .checks-grid { grid-template-columns: 1fr 1fr; }
    .card { padding: 16px; }
  }
</style>
</head>
<body>
<div class="container">
  <a class="back-link" href="index.html">&#8592; 入口</a>

  <div class="hero">
    <h1>&#128272; 密码生成器</h1>
    <p>生成强密码，保护账号安全</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-strong">强密码模式</button>
    <button class="tab-btn" id="tab-memo">易记单词组合</button>
  </div>

  <!-- 强密码模式 -->
  <div class="strong-section" id="strong-section">
    <div class="card">
      <div class="pwd-display">
        <textarea class="pwd-output" id="pwd-output" rows="2" readonly spellcheck="false" placeholder="点击生成按钮..."></textarea>
        <button class="copy-btn" id="copy-btn" title="复制密码">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
        </button>
      </div>

      <div class="strength-wrap">
        <div class="strength-label">
          <span class="strength-name" id="strength-name">—</span>
          <span class="strength-score" id="strength-score"></span>
        </div>
        <div class="strength-bar-bg">
          <div class="strength-bar" id="strength-bar"></div>
        </div>
      </div>

      <div class="control-group">
        <div class="control-label">
          密码长度
          <span id="len-display">16</span>
        </div>
        <input type="range" id="len-range" min="6" max="32" value="16">
      </div>

      <div class="control-group">
        <div class="control-label">字符类型</div>
        <div class="checks-grid">
          <label class="check-item checked" id="lbl-upper">
            <input type="checkbox" id="chk-upper" checked>
            <div class="check-box"><span class="check-tick">&#10003;</span></div>
            <div>
              <div class="check-text">大写字母</div>
              <div class="check-sample">A–Z</div>
            </div>
          </label>
          <label class="check-item checked" id="lbl-lower">
            <input type="checkbox" id="chk-lower" checked>
            <div class="check-box"><span class="check-tick">&#10003;</span></div>
            <div>
              <div class="check-text">小写字母</div>
              <div class="check-sample">a–z</div>
            </div>
          </label>
          <label class="check-item checked" id="lbl-number">
            <input type="checkbox" id="chk-number" checked>
            <div class="check-box"><span class="check-tick">&#10003;</span></div>
            <div>
              <div class="check-text">数字</div>
              <div class="check-sample">0–9</div>
            </div>
          </label>
          <label class="check-item" id="lbl-symbol">
            <input type="checkbox" id="chk-symbol">
            <div class="check-box"><span class="check-tick">&#10003;</span></div>
            <div>
              <div class="check-text">符号</div>
              <div class="check-sample">!@#$%</div>
            </div>
          </label>
        </div>
      </div>

      <button class="gen-btn" id="gen-strong-btn">&#9889; 生成密码</button>
    </div>
  </div>

  <!-- 易记单词组合 -->
  <div class="memo-section" id="memo-section">
    <div class="card">
      <div class="pwd-display">
        <textarea class="pwd-output" id="memo-output" rows="2" readonly spellcheck="false" placeholder="点击生成按钮..."></textarea>
        <button class="copy-btn" id="memo-copy-btn" title="复制密码">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
          </svg>
        </button>
      </div>

      <div class="strength-wrap">
        <div class="strength-label">
          <span class="strength-name" id="memo-strength-name">—</span>
          <span class="strength-score" id="memo-strength-score"></span>
        </div>
        <div class="strength-bar-bg">
          <div class="strength-bar" id="memo-strength-bar"></div>
        </div>
      </div>

      <div class="word-count-row">
        <label>单词数量</label>
        <div class="number-btns">
          <button class="num-btn" id="word-dec">&#8722;</button>
          <span class="num-val" id="word-count-display">4</span>
          <button class="num-btn" id="word-inc">&#43;</button>
        </div>
      </div>

      <div class="sep-row">
        <label>分隔符</label>
        <div class="sep-btns" id="sep-btns">
          <button class="sep-btn active" data-sep="-">-</button>
          <button class="sep-btn" data-sep=".">.</button>
          <button class="sep-btn" data-sep="_">_</button>
          <button class="sep-btn" data-sep=" ">空格</button>
          <button class="sep-btn" data-sep="">无</button>
        </div>
      </div>

      <div class="checks-grid" style="margin-bottom:18px">
        <label class="check-item" id="lbl-memo-cap">
          <input type="checkbox" id="chk-memo-cap">
          <div class="check-box"><span class="check-tick">&#10003;</span></div>
          <div>
            <div class="check-text">首字母大写</div>
            <div class="check-sample">Hello</div>
          </div>
        </label>
        <label class="check-item" id="lbl-memo-num">
          <input type="checkbox" id="chk-memo-num">
          <div class="check-box"><span class="check-tick">&#10003;</span></div>
          <div>
            <div class="check-text">末尾加数字</div>
            <div class="check-sample">...42</div>
          </div>
        </label>
      </div>

      <button class="gen-btn" id="gen-memo-btn">&#9889; 生成易记密码</button>
    </div>
  </div>

  <!-- 历史记录 -->
  <div class="card history-section">
    <div class="history-header">
      <span class="history-title">最近生成记录</span>
      <button class="clear-hist" id="clear-hist-btn">清空记录</button>
    </div>
    <div class="history-list" id="history-list">
      <span style="color:var(--text-muted);font-size:13px;text-align:center;padding:8px 0;">暂无记录</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  "use strict";

  // ─── Word list ──────────────────────────────────────────────────────────────
  const WORDS = [
    "apple","brave","cloud","delta","eagle","flame","grove","happy","ivory","jungle",
    "karma","lemon","maple","noble","ocean","pearl","queen","river","storm","tiger",
    "ultra","vivid","water","xenon","yacht","zebra","amber","blaze","coral","dusty",
    "ember","frost","ghost","honey","indie","jewel","knack","lunar","magic","night",
    "opera","panda","quest","radio","solar","thunder","unity","vapor","witch","extra",
    "young","zesty","arctic","beach","candy","dance","elite","fancy","giant","hotel",
    "index","jazzy","kitty","light","misty","ninja","onion","piano","quirk","rally",
    "spice","tasty","ultra","vibes","windy","crisp","sharp","clean","swift","brave",
    "fresh","lucky","sunny","rainy","snowy","rocky","sandy","muddy","dusty","smoky",
    "fiery","chilly","warm","cool","mild","wild","calm","loud","soft","bold",
    "grand","great","super","ultra","mega","mini","micro","nano","hyper","turbo"
  ];

  const CHARS_UPPER  = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  const CHARS_LOWER  = "abcdefghijklmnopqrstuvwxyz";
  const CHARS_NUMBER = "0123456789";
  const CHARS_SYMBOL = "!@#$%^&*()-_=+[]{}|;:,.<>?";

  // ─── State ──────────────────────────────────────────────────────────────────
  let currentTab    = "strong";
  let wordCount     = 4;
  let currentSep    = "-";
  let history       = [];

  // ─── DOM refs ───────────────────────────────────────────────────────────────
  const tabStrong        = document.getElementById("tab-strong");
  const tabMemo          = document.getElementById("tab-memo");
  const strongSection    = document.getElementById("strong-section");
  const memoSection      = document.getElementById("memo-section");

  const pwdOutput        = document.getElementById("pwd-output");
  const copyBtn          = document.getElementById("copy-btn");
  const strengthBar      = document.getElementById("strength-bar");
  const strengthName     = document.getElementById("strength-name");
  const strengthScore    = document.getElementById("strength-score");
  const lenRange         = document.getElementById("len-range");
  const lenDisplay       = document.getElementById("len-display");

  const chkUpper         = document.getElementById("chk-upper");
  const chkLower         = document.getElementById("chk-lower");
  const chkNumber        = document.getElementById("chk-number");
  const chkSymbol        = document.getElementById("chk-symbol");
  const lblUpper         = document.getElementById("lbl-upper");
  const lblLower         = document.getElementById("lbl-lower");
  const lblNumber        = document.getElementById("lbl-number");
  const lblSymbol        = document.getElementById("lbl-symbol");

  const genStrongBtn     = document.getElementById("gen-strong-btn");

  const memoOutput       = document.getElementById("memo-output");
  const memoCopyBtn      = document.getElementById("memo-copy-btn");
  const memoStrengthBar  = document.getElementById("memo-strength-bar");
  const memoStrengthName = document.getElementById("memo-strength-name");
  const memoStrengthScore= document.getElementById("memo-strength-score");
  const wordDecBtn       = document.getElementById("word-dec");
  const wordIncBtn       = document.getElementById("word-inc");
  const wordCountDisplay = document.getElementById("word-count-display");
  const sepBtns          = document.getElementById("sep-btns");

  const chkMemoCap       = document.getElementById("chk-memo-cap");
  const chkMemoNum       = document.getElementById("chk-memo-num");
  const lblMemoCap       = document.getElementById("lbl-memo-cap");
  const lblMemoNum       = document.getElementById("lbl-memo-num");

  const genMemoBtn       = document.getElementById("gen-memo-btn");
  const historyList      = document.getElementById("history-list");
  const clearHistBtn     = document.getElementById("clear-hist-btn");
  const toastEl          = document.getElementById("toast");

  // ─── Utility ────────────────────────────────────────────────────────────────
  function secureRandom(max) {
    const arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] % max;
  }

  function pickChar(charset) {
    return charset[secureRandom(charset.length)];
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = secureRandom(i + 1);
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  // ─── Toast ──────────────────────────────────────────────────────────────────
  let toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toastEl.classList.remove("show");
    }, 1800);
  }

  // ─── Copy ───────────────────────────────────────────────────────────────────
  function copyText(text, btn) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        flashCopied(btn);
      }).catch(function() {
        fallbackCopy(text, btn);
      });
    } else {
      fallbackCopy(text, btn);
    }
  }

  function fallbackCopy(text, btn) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); flashCopied(btn); } catch(e) {}
    document.body.removeChild(ta);
  }

  function flashCopied(btn) {
    btn.classList.add("copied");
    showToast("已复制到剪贴板 ✓");
    setTimeout(function() { btn.classList.remove("copied"); }, 1500);
  }

  // ─── Strength calculation ────────────────────────────────────────────────────
  function calcStrength(pwd) {
    if (!pwd) return { score: 0, label: "—", color: "transparent" };
    let score = 0;
    const len = pwd.length;
    if (len >= 8)  score += 1;
    if (len >= 12) score += 1;
    if (len >= 18) score += 1;
    if (len >= 24) score += 1;
    if (/[A-Z]/.test(pwd)) score += 1;
    if (/[a-z]/.test(pwd)) score += 1;
    if (/[0-9]/.test(pwd)) score += 1;
    if (/[^A-Za-z0-9]/.test(pwd)) score += 2;
    // uniqueness
    const unique = new Set(pwd).size;
    if (unique > len * 0.6) score += 1;

    const pct = Math.min(100, Math.round(score / 11 * 100));
    let label, color;
    if (pct < 30) { label = "非常弱"; color = "var(--red)"; }
    else if (pct < 50) { label = "较弱"; color = "var(--orange)"; }
    else if (pct < 70) { label = "一般"; color = "var(--yellow)"; }
    else if (pct < 88) { label = "强"; color = "var(--green)"; }
    else { label = "非常强"; color = "var(--accent2)"; }
    return { score: pct, label, color };
  }

  function applyStrength(pwd, barEl, nameEl, scoreEl) {
    const s = calcStrength(pwd);
    barEl.style.width = s.score + "%";
    barEl.style.background = s.color;
    nameEl.textContent = s.label;
    nameEl.style.color = s.color;
    scoreEl.textContent = pwd ? s.score + " / 100" : "";
  }

  // ─── Strong password generation ─────────────────────────────────────────────
  function generateStrong() {
    const len    = parseInt(lenRange.value, 10);
    const upper  = chkUpper.checked;
    const lower  = chkLower.checked;
    const number = chkNumber.checked;
    const symbol = chkSymbol.checked;

    if (!upper && !lower && !number && !symbol) {
      showToast("请至少勾选一种字符类型");
      return "";
    }

    let pool = "";
    const required = [];
    if (upper)  { pool += CHARS_UPPER;  required.push(pickChar(CHARS_UPPER)); }
    if (lower)  { pool += CHARS_LOWER;  required.push(pickChar(CHARS_LOWER)); }
    if (number) { pool += CHARS_NUMBER; required.push(pickChar(CHARS_NUMBER)); }
    if (symbol) { pool += CHARS_SYMBOL; required.push(pickChar(CHARS_SYMBOL)); }

    const rest = [];
    for (let i = required.length; i < len; i++) {
      rest.push(pickChar(pool));
    }

    const all = shuffle(required.concat(rest));
    return all.join("");
  }

  // ─── Memo password generation ────────────────────────────────────────────────
  function generateMemo() {
    const wc  = wordCount;
    const cap = chkMemoCap.checked;
    const num = chkMemoNum.checked;

    const picked = [];
    for (let i = 0; i < wc; i++) {
      let w = WORDS[secureRandom(WORDS.length)];
      if (cap) w = capitalize(w);
      picked.push(w);
    }

    let pwd = picked.join(currentSep);
    if (num) {
      const n = secureRandom(90) + 10;
      pwd += (currentSep || "") + n;
    }
    return pwd;
  }

  // ─── History ─────────────────────────────────────────────────────────────────
  function loadHistory() {
    try {
      const raw = localStorage.getItem("pwdgen_history");
      if (raw) history = JSON.parse(raw);
    } catch(e) { history = []; }
  }

  function saveHistory() {
    try { localStorage.setItem("pwdgen_history", JSON.stringify(history)); } catch(e) {}
  }

  function addHistory(pwd) {
    if (!pwd) return;
    history = history.filter(function(h) { return h !== pwd; });
    history.unshift(pwd);
    if (history.length > 12) history = history.slice(0, 12);
    saveHistory();
    renderHistory();
  }

  function renderHistory() {
    if (!history.length) {
      historyList.innerHTML = '<span style="color:var(--text-muted);font-size:13px;text-align:center;padding:8px 0;">暂无记录</span>';
      return;
    }
    historyList.innerHTML = "";
    history.forEach(function(pwd) {
      const item = document.createElement("div");
      item.className = "hist-item";

      const span = document.createElement("span");
      span.className = "hist-pwd";
      span.title = pwd;
      span.textContent = pwd;
      span.addEventListener("click", function() {
        copyText(pwd, copyBtnRef);
      });

      const btn = document.createElement("button");
      btn.className = "hist-copy";
      btn.textContent = "复制";
      btn.addEventListener("click", function() {
        copyText(pwd, btn);
      });

      item.appendChild(span);
      item.appendChild(btn);
      historyList.appendChild(item);
    });
  }

  // A dummy ref for history item copy flash (reuse copyBtn)
  const copyBtnRef = copyBtn;

  // ─── Checkbox toggle visual ──────────────────────────────────────────────────
  function syncCheckLabel(chk, lbl) {
    if (chk.checked) {
      lbl.classList.add("checked");
    } else {
      lbl.classList.remove("checked");
    }
  }

  function bindCheck(chk, lbl) {
    lbl.addEventListener("click", function(e) {
      e.preventDefault();
      chk.checked = !chk.checked;
      syncCheckLabel(chk, lbl);
    });
  }

  // ─── Tab switching ───────────────────────────────────────────────────────────
  function switchTab(tab) {
    currentTab = tab;
    if (tab === "strong") {
      tabStrong.classList.add("active");
      tabMemo.classList.remove("active");
      strongSection.classList.remove("hidden");
      memoSection.classList.remove("visible");
    } else {
      tabMemo.classList.add("active");
      tabStrong.classList.remove("active");
      strongSection.classList.add("hidden");
      memoSection.classList.add("visible");
    }
  }

  // ─── Separator buttons ───────────────────────────────────────────────────────
  function updateSepBtns() {
    const btns = sepBtns.querySelectorAll(".sep-btn");
    btns.forEach(function(b) {
      if (b.dataset.sep === currentSep) {
        b.classList.add("active");
      } else {
        b.classList.remove("active");
      }
    });
  }

  // ─── Load saved settings ─────────────────────────────────────────────────────
  function loadSettings() {
    try {
      const raw = localStorage.getItem("pwdgen_settings");
      if (!raw) return;
      const s = JSON.parse(raw);
      if (s.len) { lenRange.value = s.len; lenDisplay.textContent = s.len; }
      if (typeof s.upper === "boolean") { chkUpper.checked = s.upper; syncCheckLabel(chkUpper, lblUpper); }
      if (typeof s.lower === "boolean") { chkLower.checked = s.lower; syncCheckLabel(chkLower, lblLower); }
      if (typeof s.number === "boolean") { chkNumber.checked = s.number; syncCheckLabel(chkNumber, lblNumber); }
      if (typeof s.symbol === "boolean") { chkSymbol.checked = s.symbol; syncCheckLabel(chkSymbol, lblSymbol); }
      if (s.wordCount) { wordCount = s.wordCount; wordCountDisplay.textContent = wordCount; }
      if (typeof s.sep === "string") { currentSep = s.sep; updateSepBtns(); }
      if (typeof s.memoCap === "boolean") { chkMemoCap.checked = s.memoCap; syncCheckLabel(chkMemoCap, lblMemoCap); }
      if (typeof s.memoNum === "boolean") { chkMemoNum.checked = s.memoNum; syncCheckLabel(chkMemoNum, lblMemoNum); }
    } catch(e) {}
  }

  function saveSettings() {
    try {
      localStorage.setItem("pwdgen_settings", JSON.stringify({
        len: lenRange.value,
        upper: chkUpper.checked,
        lower: chkLower.checked,
        number: chkNumber.checked,
        symbol: chkSymbol.checked,
        wordCount: wordCount,
        sep: currentSep,
        memoCap: chkMemoCap.checked,
        memoNum: chkMemoNum.checked
      }));
    } catch(e) {}
  }

  // ─── Event bindings ──────────────────────────────────────────────────────────
  tabStrong.addEventListener("click", function() { switchTab("strong"); });
  tabMemo.addEventListener("click",   function() { switchTab("memo"); });

  lenRange.addEventListener("input", function() {
    lenDisplay.textContent = lenRange.value;
    saveSettings();
  });

  bindCheck(chkUpper, lblUpper);
  bindCheck(chkLower, lblLower);
  bindCheck(chkNumber, lblNumber);
  bindCheck(chkSymbol, lblSymbol);
  bindCheck(chkMemoCap, lblMemoCap);
  bindCheck(chkMemoNum, lblMemoNum);

  [chkUpper, chkLower, chkNumber, chkSymbol, chkMemoCap, chkMemoNum].forEach(function(c) {
    c.addEventListener("change", saveSettings);
  });

  genStrongBtn.addEventListener("click", function() {
    const pwd = generateStrong();
    if (!pwd) return;
    pwdOutput.value = pwd;
    applyStrength(pwd, strengthBar, strengthName, strengthScore);
    addHistory(pwd);
    saveSettings();
  });

  copyBtn.addEventListener("click", function() {
    copyText(pwdOutput.value, copyBtn);
  });

  genMemoBtn.addEventListener("click", function() {
    const pwd = generateMemo();
    if (!pwd) return;
    memoOutput.value = pwd;
    applyStrength(pwd, memoStrengthBar, memoStrengthName, memoStrengthScore);
    addHistory(pwd);
    saveSettings();
  });

  memoCopyBtn.addEventListener("click", function() {
    copyText(memoOutput.value, memoCopyBtn);
  });

  wordDecBtn.addEventListener("click", function() {
    if (wordCount > 2) { wordCount--; wordCountDisplay.textContent = wordCount; saveSettings(); }
  });
  wordIncBtn.addEventListener("click", function() {
    if (wordCount < 8) { wordCount++; wordCountDisplay.textContent = wordCount; saveSettings(); }
  });

  sepBtns.addEventListener("click", function(e) {
    const btn = e.target.closest(".sep-btn");
    if (!btn) return;
    currentSep = btn.dataset.sep;
    updateSepBtns();
    saveSettings();
  });

  clearHistBtn.addEventListener("click", function() {
    history = [];
    saveHistory();
    renderHistory();
    showToast("记录已清空");
  });

  // ─── Init ────────────────────────────────────────────────────────────────────
  loadSettings();
  loadHistory();
  renderHistory();

  // Initial sync for checkboxes
  syncCheckLabel(chkUpper, lblUpper);
  syncCheckLabel(chkLower, lblLower);
  syncCheckLabel(chkNumber, lblNumber);
  syncCheckLabel(chkSymbol, lblSymbol);
  syncCheckLabel(chkMemoCap, lblMemoCap);
  syncCheckLabel(chkMemoNum, lblMemoNum);

  // Auto-generate on load
  (function() {
    const pwd = generateStrong();
    if (pwd) {
      pwdOutput.value = pwd;
      applyStrength(pwd, strengthBar, strengthName, strengthScore);
      addHistory(pwd);
    }
  })();

})();
</script>
</body>
</html>
