<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>颜文字库</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f7f3ff;
    --surface: #ffffff;
    --primary: #7c5cbf;
    --primary-light: #a884e8;
    --primary-dark: #5a3e9a;
    --accent: #ff85c1;
    --text: #2d2040;
    --text-muted: #8b7aa0;
    --border: #e8dff7;
    --shadow: 0 4px 20px rgba(124,92,191,0.10);
    --radius: 14px;
    --radius-sm: 8px;
    --transition: 0.18s cubic-bezier(0.4,0,0.2,1);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* 返回入口 */
  .back-link {
    display: inline-block;
    position: fixed;
    top: 14px;
    left: 16px;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    z-index: 100;
    transition: color var(--transition);
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(6px);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }
  .back-link:hover { color: var(--primary); }

  /* 顶部 */
  .header {
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
    padding: 56px 20px 30px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Ccircle cx='30' cy='30' r='20'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
  }
  .header h1 {
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.2);
  }
  .header p {
    color: rgba(255,255,255,0.75);
    font-size: 13px;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  /* 搜索框 */
  .search-wrap {
    max-width: 480px;
    margin: 20px auto 0;
    position: relative;
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 44px 10px 16px;
    border-radius: 24px;
    border: none;
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-size: 14px;
    outline: none;
    backdrop-filter: blur(8px);
    transition: background var(--transition);
  }
  .search-wrap input::placeholder { color: rgba(255,255,255,0.6); }
  .search-wrap input:focus { background: rgba(255,255,255,0.3); }
  .search-icon {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    opacity: 0.7;
    pointer-events: none;
  }

  /* 分类切换 */
  .tabs-wrap {
    position: sticky;
    top: 0;
    z-index: 50;
    background: var(--bg);
    padding: 14px 0 10px;
    box-shadow: 0 2px 12px rgba(124,92,191,0.07);
  }
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 16px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
    user-select: none;
  }
  .tab:hover { border-color: var(--primary-light); color: var(--primary); }
  .tab.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 3px 12px rgba(124,92,191,0.35);
    transform: translateY(-1px);
  }

  /* 统计信息 */
  .stats {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    padding: 10px 16px 4px;
  }

  /* 网格 */
  .grid-wrap {
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 16px 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: 10px;
  }
  .kaomoji-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 10px 12px;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
    position: relative;
    overflow: hidden;
    user-select: none;
  }
  .kaomoji-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    opacity: 0;
    transition: opacity var(--transition);
    border-radius: var(--radius);
  }
  .kaomoji-card:hover {
    border-color: var(--primary-light);
    box-shadow: var(--shadow);
    transform: translateY(-3px) scale(1.02);
  }
  .kaomoji-card:hover::before { opacity: 0.05; }
  .kaomoji-card:active { transform: translateY(-1px) scale(0.99); }
  .kaomoji-card.copied {
    border-color: var(--accent);
    animation: pop 0.3s ease;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .kaomoji-text {
    font-size: 18px;
    line-height: 1.5;
    word-break: break-all;
    letter-spacing: 0.5px;
    position: relative;
    z-index: 1;
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .kaomoji-hint {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    position: relative;
    z-index: 1;
    opacity: 0;
    transition: opacity var(--transition);
  }
  .kaomoji-card:hover .kaomoji-hint { opacity: 1; }

  /* 最近复制区 */
  .recent-wrap {
    max-width: 900px;
    margin: 20px auto 0;
    padding: 0 16px;
  }
  .recent-title {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .recent-title span { opacity: 0.6; font-size: 12px; }
  .recent-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .recent-item {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 5px 10px;
    font-size: 14px;
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
  }
  .recent-item:hover {
    border-color: var(--accent);
    background: #fff0f7;
  }

  /* Toast 提示 */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--primary-dark);
    color: #fff;
    padding: 10px 22px;
    border-radius: 24px;
    font-size: 14px;
    box-shadow: 0 6px 24px rgba(90,62,154,0.35);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
    z-index: 9999;
    white-space: nowrap;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* 无结果 */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 15px;
  }
  .empty-icon { font-size: 48px; display: block; margin-bottom: 12px; }

  /* 响应式 */
  @media (max-width: 480px) {
    .header h1 { font-size: 22px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
    .kaomoji-text { font-size: 15px; }
  }
</style>

<div class="grid-wrap">

</div>

  // ─── 工具函数 ─────────────────────────────────────────────────────────────
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toastEl.classList.remove("show");
    }, 1800);
  }

  function copyText(text, cardEl) {
    var fallback = function() {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:-9999px;left:-9999px;";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch(e) {}
      document.body.removeChild(ta);
      showToast("已复制 " + text);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function() {
        showToast("已复制 " + text);
      }, fallback);
    } else {
      fallback();
    }
    if (cardEl) {
      cardEl.classList.add("copied");
      setTimeout(function() { cardEl.classList.remove("copied"); }, 400);
    }
    addRecent(text);
  }

  function addRecent(text) {
    recentList = recentList.filter(function(x) { return x !== text; });
    recentList.unshift(text);
    if (recentList.length > 12) recentList = recentList.slice(0, 12);
    try { localStorage.setItem("kaomoji_recent", JSON.stringify(recentList)); } catch(e) {}
    renderRecent();
  }

  function loadRecent() {
    try {
      var saved = localStorage.getItem("kaomoji_recent");
      if (saved) recentList = JSON.parse(saved);
    } catch(e) { recentList = []; }
  }

  // ─── 渲染函数 ─────────────────────────────────────────────────────────────
  function getAllItems() {
    var all = [];
    Object.keys(DATA).forEach(function(cat) {
      DATA[cat].forEach(function(item) {
        all.push({ text: item, cat: cat });
      });
    });
    return all;
  }

  function getFilteredItems() {
    var items = [];
    var q = searchQuery.trim().toLowerCase();
    var categories = Object.keys(DATA);

    if (currentCategory === "全部") {
      items = getAllItems();
    } else {
      var catItems = DATA[currentCategory] || [];
      items = catItems.map(function(text) { return { text: text, cat: currentCategory }; });
    }

    if (q) {
      items = items.filter(function(item) {
        return item.text.toLowerCase().indexOf(q) !== -1;
      });
    }
    return items;
  }

  function renderTabs() {
    var categories = ["全部"].concat(Object.keys(DATA));
    tabsEl.innerHTML = "";
    categories.forEach(function(cat) {
      var btn = document.createElement("button");
      btn.className = "tab" + (cat === currentCategory ? " active" : "");
      var emoji = {
        "全部": "✨", "开心": "😄", "难过": "😢", "生气": "😠", "卖萌": "🐱",
        "惊讶": "😲", "无语": "😑", "爱心": "❤", "尴尬": "😳",
        "思考": "🤔", "睡觉": "😴", "打招呼": "👋", "冷漠": "😐"
      }[cat] || "•";
      btn.textContent = emoji + " " + cat;
      btn.addEventListener("click", function() {
        currentCategory = cat;
        searchQuery = "";
        searchInputEl.value = "";
        renderTabs();
        renderGrid();
      });
      tabsEl.appendChild(btn);
    });
  }

  function renderGrid() {
    var items = getFilteredItems();
    statsEl.textContent = "共 " + items.length + " 个颜文字";
    gridEl.innerHTML = "";

    if (items.length === 0) {
      gridEl.innerHTML = '<div class="empty"><span class="empty-icon">( ・_・)</span>没有找到相关颜文字</div>';
      return;
    }

    var frag = document.createDocumentFragment();
    items.forEach(function(item) {
      var card = document.createElement("div");
      card.className = "kaomoji-card";
      card.innerHTML =
        '<div class="kaomoji-text">' + item.text + '</div>' +
        '<div class="kaomoji-hint">点击复制</div>';
      card.addEventListener("click", function() {
        copyText(item.text, card);
      });
      frag.appendChild(card);
    });
    gridEl.appendChild(frag);
  }

  function renderRecent() {
    if (recentList.length === 0) {
      recentWrapEl.style.display = "none";
      return;
    }
    recentWrapEl.style.display = "block";
    recentGridEl.innerHTML = "";
    var frag = document.createDocumentFragment();
    recentList.forEach(function(text) {
      var item = document.createElement("div");
      item.className = "recent-item";
      item.textContent = text;
      item.title = "点击再次复制";
      item.addEventListener("click", function() {
        copyText(text, null);
      });
      frag.appendChild(item);
    });
    recentGridEl.appendChild(frag);
  }

  // ─── 事件绑定 ─────────────────────────────────────────────────────────────
  searchInputEl.addEventListener("input", function() {
    searchQuery = this.value;
    renderGrid();
  });

  // ─── 初始化（放在最后）─────────────────────────────────────────────────────
  loadRecent();
  renderTabs();
  renderGrid();
  renderRecent();

})();
</script>
</body>
</html>
