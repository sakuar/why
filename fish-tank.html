<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>养鱼缸</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{background:#020812;color:#e8eef7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  .back{position:fixed;top:14px;left:16px;color:#6fa8d8;text-decoration:none;font-size:13px;z-index:5;}
  .back:hover{color:#bfe3ff;}
  .hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#3a6a9a;font-size:13px;z-index:5;pointer-events:none;}
  canvas{display:block;position:fixed;inset:0;}
</style>
</head>
<body>
<a class="back" href="index.html">← 入口</a>
<canvas id="cv"></canvas>
<div class="hint">点水面撒鱼食，小鱼会游过来抢 🐟</div>
<script>
"use strict";
(function(){
  var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  var W,H;
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  window.addEventListener("resize",resize);resize();
  var COLORS=["#ff8c42","#ffd166","#56cfaf","#7ed6ff","#ff6b9d","#c3a6ff","#ff5e5e"];
  var fishes=[],foods=[],bubbles=[];
  function Fish(){
    this.x=Math.random()*W;this.y=80+Math.random()*(H-160);
    this.size=12+Math.random()*14;
    this.color=COLORS[Math.floor(Math.random()*COLORS.length)];
    this.a=Math.random()*Math.PI*2;this.speed=0.6+Math.random()*0.8;this.t=Math.random()*100;
  }
  Fish.prototype.step=function(){
    this.t+=0.08;
    // 找最近的食物
    var target=null,md=1e9;
    for(var i=0;i<foods.length;i++){var dx=foods[i].x-this.x,dy=foods[i].y-this.y,d=dx*dx+dy*dy;if(d<md){md=d;target=foods[i];}}
    if(target){var ta=Math.atan2(target.y-this.y,target.x-this.x);this.a=ta;
      if(md<this.size*this.size){target.eaten=true;}
      this.x+=Math.cos(this.a)*this.speed*1.8;this.y+=Math.sin(this.a)*this.speed*1.8;
    }else{
      this.a+=Math.sin(this.t*0.5)*0.04;
      this.x+=Math.cos(this.a)*this.speed;this.y+=Math.sin(this.a)*this.speed;
    }
    if(this.x<20){this.x=20;this.a=Math.PI-this.a;}
    if(this.x>W-20){this.x=W-20;this.a=Math.PI-this.a;}
    if(this.y<70){this.y=70;this.a=-this.a;}
    if(this.y>H-40){this.y=H-40;this.a=-this.a;}
  };
  Fish.prototype.draw=function(){
    var s=this.size,x=this.x,y=this.y;
    ctx.save();ctx.translate(x,y);
    var dir=(Math.cos(this.a)>=0)?1:-1;ctx.scale(dir,1);
    var wag=Math.sin(this.t*3)*0.4;
    // 尾巴
    ctx.fillStyle=this.color;
    ctx.beginPath();ctx.moveTo(-s*0.7,0);
    ctx.lineTo(-s*1.4,-s*0.6+wag*s);ctx.lineTo(-s*1.4,s*0.6+wag*s);ctx.closePath();ctx.fill();
    // 身体
    ctx.beginPath();ctx.ellipse(0,0,s,s*0.62,0,0,Math.PI*2);ctx.fill();
    // 眼睛
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(s*0.45,-s*0.15,s*0.16,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#111";ctx.beginPath();ctx.arc(s*0.5,-s*0.15,s*0.08,0,Math.PI*2);ctx.fill();
    ctx.restore();
  };
  function Bubble(){this.x=Math.random()*W;this.y=H;this.r=2+Math.random()*4;this.v=0.5+Math.random();}
  for(var i=0;i<7;i++)fishes.push(new Fish());
  for(var b=0;b<14;b++){var bb=new Bubble();bb.y=Math.random()*H;bubbles.push(bb);}
  cv.addEventListener("pointerdown",function(e){
    for(var k=0;k<3;k++)foods.push({x:e.clientX+(Math.random()-0.5)*20,y:e.clientY,vy:0.6,eaten:false});
  });
  function loop(){
    // 水背景渐变
    var g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,"#063a5e");g.addColorStop(1,"#02101f");
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // 沙底
    ctx.fillStyle="#1a2a1a";ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,H-26);
    for(var sx=0;sx<=W;sx+=40)ctx.lineTo(sx,H-26+Math.sin(sx*0.05)*8);
    ctx.lineTo(W,H);ctx.closePath();ctx.fill();
    // 气泡
    for(var i=0;i<bubbles.length;i++){var p=bubbles[i];p.y-=p.v;if(p.y<0){p.y=H;p.x=Math.random()*W;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.strokeStyle="rgba(180,220,255,0.3)";ctx.lineWidth=1;ctx.stroke();}
    // 食物下沉
    for(var f=foods.length-1;f>=0;f--){var fd=foods[f];fd.y+=fd.vy;
      if(fd.eaten||fd.y>H-30){foods.splice(f,1);continue;}
      ctx.fillStyle="#d9a441";ctx.beginPath();ctx.arc(fd.x,fd.y,3,0,Math.PI*2);ctx.fill();}
    for(var n=0;n<fishes.length;n++){fishes[n].step();fishes[n].draw();}
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
