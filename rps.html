<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>石头剪刀布</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --card: #22263a;
    --border: #2e3450;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --accent3: #43e97b;
    --text: #e8eaf6;
    --muted: #8b91b5;
    --win: #43e97b;
    --lose: #ff6584;
    --draw: #f9ca24;
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 40px;
    background-image: radial-gradient(ellipse at 20% 50%, rgba(108,99,255,0.08) 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 20%, rgba(255,101,132,0.06) 0%, transparent 50%);
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    opacity: 0.7;
    transition: opacity 0.2s;
    z-index: 99;
  }
  .back-link:hover { opacity: 1; }

  header {
    text-align: center;
    padding: 56px 0 24px;
  }
  header h1 {
    font-size: clamp(26px, 6vw, 38px);
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #a78bfa, #6c63ff, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 6px;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 520px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 8px;
    text-align: center;
  }
  .stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  .stat-val {
    font-size: 22px;
    font-weight: 700;
  }
  .stat-val.win { color: var(--win); }
  .stat-val.lose { color: var(--lose); }
  .stat-val.draw { color: var(--draw); }
  .stat-val.streak { color: var(--accent); }

  .record-bar {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 28px;
    font-size: 13px;
    color: var(--muted);
  }
  .record-bar span { color: #fbbf24; font-weight: 700; font-size: 15px; }

  .arena {
    width: 100%;
    max-width: 520px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 28px 20px 24px;
    margin-bottom: 28px;
    position: relative;
    overflow: hidden;
  }
  .arena::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 1px;
    height: 100%;
    background: var(--border);
  }

  .sides {
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 20px;
  }
  .side {
    flex: 1;
    text-align: center;
  }
  .side-label {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  .hand-display {
    width: 90px;
    height: 90px;
    margin: 0 auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    background: var(--card);
    border: 2px solid var(--border);
    transition: transform 0.3s, box-shadow 0.3s;
    user-select: none;
    line-height: 1;
  }
  .hand-display.player-side { border-color: var(--accent); box-shadow: 0 0 18px rgba(108,99,255,0.15); }
  .hand-display.cpu-side { border-color: var(--accent2); box-shadow: 0 0 18px rgba(255,101,132,0.15); }

  @keyframes shakePlayer {
    0%,100% { transform: translateY(0) rotate(0deg); }
    20% { transform: translateY(-12px) rotate(-8deg); }
    40% { transform: translateY(4px) rotate(6deg); }
    60% { transform: translateY(-8px) rotate(-4deg); }
    80% { transform: translateY(2px) rotate(2deg); }
  }
  @keyframes shakeCpu {
    0%,100% { transform: translateY(0) rotate(0deg); }
    20% { transform: translateY(-10px) rotate(8deg); }
    40% { transform: translateY(4px) rotate(-6deg); }
    60% { transform: translateY(-6px) rotate(4deg); }
    80% { transform: translateY(2px) rotate(-2deg); }
  }
  @keyframes revealBounce {
    0% { transform: scale(0.5) rotate(-15deg); opacity:0; }
    60% { transform: scale(1.15) rotate(4deg); opacity:1; }
    100% { transform: scale(1) rotate(0deg); opacity:1; }
  }
  @keyframes winPulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .hand-display.animate-shake { animation: shakePlayer 0.6s ease; }
  .hand-display.animate-shake-cpu { animation: shakeCpu 0.6s ease; }
  .hand-display.animate-reveal { animation: revealBounce 0.4s cubic-bezier(.22,.8,.36,1) forwards; }
  .hand-display.animate-win { animation: winPulse 0.5s ease 0.4s 2; }

  .result-panel {
    text-align: center;
    min-height: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 0 4px;
  }
  .result-text {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
    transition: all 0.3s;
  }
  .result-text.win { color: var(--win); text-shadow: 0 0 20px rgba(67,233,123,0.5); }
  .result-text.lose { color: var(--lose); text-shadow: 0 0 20px rgba(255,101,132,0.5); }
  .result-text.draw { color: var(--draw); text-shadow: 0 0 20px rgba(249,202,36,0.4); }
  .result-sub { font-size: 12px; color: var(--muted); }

  @keyframes resultIn {
    from { transform: scale(0.7) translateY(-8px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
  }
  .result-text.show { animation: resultIn 0.35s cubic-bezier(.22,.8,.36,1) forwards; }

  .choices {
    width: 100%;
    max-width: 520px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .choice-btn {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 8px 14px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: transform 0.15s, border-color 0.2s, box-shadow 0.2s, background 0.2s;
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  .choice-btn:hover:not(:disabled) {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px rgba(108,99,255,0.2);
    background: #272b40;
  }
  .choice-btn:active:not(:disabled) {
    transform: translateY(-1px) scale(0.97);
  }
  .choice-btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .choice-emoji {
    font-size: 38px;
    line-height: 1;
    display: block;
  }
  .choice-name {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 1px;
  }

  @keyframes btnPress {
    0% { transform: scale(1); }
    40% { transform: scale(0.9); }
    70% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  .choice-btn.pressed { animation: btnPress 0.35s ease; }

  .action-row {
    width: 100%;
    max-width: 520px;
    display: flex;
    justify-content: center;
  }
  .reset-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: var(--radius-sm);
    padding: 9px 22px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(255,101,132,0.06);
  }

  .countdown {
    font-size: 48px;
    font-weight: 900;
    color: var(--accent);
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0;
    z-index: 10;
  }
  @keyframes countPop {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
    30% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
    70% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0; }
  }
  .countdown.pop { animation: countPop 0.55s ease forwards; }

  .history-section {
    width: 100%;
    max-width: 520px;
    margin-top: 4px;
  }
  .history-title {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .history-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .hist-item {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    border: 1.5px solid var(--border);
    background: var(--card);
    position: relative;
  }
  .hist-item.w { border-color: var(--win); }
  .hist-item.l { border-color: var(--lose); }
  .hist-item.d { border-color: var(--draw); }

  @media (max-width: 400px) {
    .hand-display { width: 72px; height: 72px; font-size: 36px; }
    .choice-emoji { font-size: 30px; }
    .stat-val { font-size: 18px; }
    .stats-grid { gap: 7px; }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<header>
  <h1>石头剪刀布</h1>
  <p>点击出拳，和电脑一决高下</p>
</header>

<div class="stats-grid">
  <div class="stat-card">
    <div class="stat-label">胜</div>
    <div class="stat-val win" id="stat-win">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">负</div>
    <div class="stat-val lose" id="stat-lose">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">平</div>
    <div class="stat-val draw" id="stat-draw">0</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">连胜</div>
    <div class="stat-val streak" id="stat-streak">0</div>
  </div>
</div>

<div class="record-bar">
  <span>最高连胜纪录：<span id="stat-best">0</span> 连</span>
  <span style="font-size:11px;color:var(--muted);font-weight:400;">共 <span id="stat-total">0</span> 局</span>
</div>

<div class="arena" id="arena">
  <div class="countdown" id="countdown"></div>
  <div class="sides">
    <div class="side">
      <div class="side-label">你</div>
      <div class="hand-display player-side" id="player-hand">✊</div>
    </div>
    <div class="side">
      <div class="side-label">电脑</div>
      <div class="hand-display cpu-side" id="cpu-hand">✊</div>
    </div>
  </div>
  <div class="result-panel">
    <div class="result-text" id="result-text">准备出拳！</div>
    <div class="result-sub" id="result-sub">选择你的手势</div>
  </div>
</div>

<div class="choices">
  <button class="choice-btn" id="btn-rock" data-choice="rock">
    <span class="choice-emoji">✊</span>
    <span class="choice-name">石头</span>
  </button>
  <button class="choice-btn" id="btn-scissors" data-choice="scissors">
    <span class="choice-emoji">✌️</span>
    <span class="choice-name">剪刀</span>
  </button>
  <button class="choice-btn" id="btn-paper" data-choice="paper">
    <span class="choice-emoji">🖐️</span>
    <span class="choice-name">布</span>
  </button>
</div>

<div class="action-row">
  <button class="reset-btn" id="reset-btn">重置统计</button>
</div>

<div class="history-section">
  <div class="history-title">最近对局</div>
  <div class="history-list" id="history-list"></div>
</div>

<script>
(function() {
  "use strict";

  var STORAGE_KEY = "rps_state_v1";

  var CHOICES = ["rock", "scissors", "paper"];
  var EMOJI = { rock: "✊", scissors: "✌️", paper: "🖐️" };
  var NAMES = { rock: "石头", scissors: "剪刀", paper: "布" };

  // win[a] beats win[a]'s value
  var BEATS = { rock: "scissors", scissors: "paper", paper: "rock" };

  var state = {
    wins: 0,
    loses: 0,
    draws: 0,
    streak: 0,
    best: 0,
    total: 0,
    history: []
  };

  var busy = false;

  var elPlayerHand = document.getElementById("player-hand");
  var elCpuHand = document.getElementById("cpu-hand");
  var elResultText = document.getElementById("result-text");
  var elResultSub = document.getElementById("result-sub");
  var elStatWin = document.getElementById("stat-win");
  var elStatLose = document.getElementById("stat-lose");
  var elStatDraw = document.getElementById("stat-draw");
  var elStatStreak = document.getElementById("stat-streak");
  var elStatBest = document.getElementById("stat-best");
  var elStatTotal = document.getElementById("stat-total");
  var elHistoryList = document.getElementById("history-list");
  var elCountdown = document.getElementById("countdown");
  var elResetBtn = document.getElementById("reset-btn");
  var elBtnRock = document.getElementById("btn-rock");
  var elBtnScissors = document.getElementById("btn-scissors");
  var elBtnPaper = document.getElementById("btn-paper");
  var allBtns = [elBtnRock, elBtnScissors, elBtnPaper];

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        state.wins = parsed.wins || 0;
        state.loses = parsed.loses || 0;
        state.draws = parsed.draws || 0;
        state.streak = parsed.streak || 0;
        state.best = parsed.best || 0;
        state.total = parsed.total || 0;
        state.history = Array.isArray(parsed.history) ? parsed.history.slice(-30) : [];
      }
    } catch (e) {
      // ignore
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
      // ignore
    }
  }

  function updateUI() {
    elStatWin.textContent = state.wins;
    elStatLose.textContent = state.loses;
    elStatDraw.textContent = state.draws;
    elStatStreak.textContent = state.streak;
    elStatBest.textContent = state.best;
    elStatTotal.textContent = state.total;
    renderHistory();
  }

  function renderHistory() {
    elHistoryList.innerHTML = "";
    var recent = state.history.slice(-20);
    for (var i = 0; i < recent.length; i++) {
      var item = recent[i];
      var div = document.createElement("div");
      div.className = "hist-item " + item.result;
      div.title = NAMES[item.player] + " vs " + NAMES[item.cpu] + " (" + (item.result === "w" ? "胜" : item.result === "l" ? "负" : "平") + ")";
      div.textContent = EMOJI[item.player];
      elHistoryList.appendChild(div);
    }
  }

  function setButtonsDisabled(val) {
    for (var i = 0; i < allBtns.length; i++) {
      allBtns[i].disabled = val;
    }
  }

  function removeClass(el, cls) {
    el.classList.remove(cls);
  }

  function playCountdown(cb) {
    var steps = ["3", "2", "1", "出！"];
    var idx = 0;
    function next() {
      if (idx >= steps.length) { cb(); return; }
      elCountdown.textContent = steps[idx];
      elCountdown.classList.remove("pop");
      void elCountdown.offsetWidth;
      elCountdown.classList.add("pop");
      idx++;
      setTimeout(next, 480);
    }
    next();
  }

  function animate(el, cls, duration) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    setTimeout(function() { el.classList.remove(cls); }, duration);
  }

  function showResult(outcome) {
    elResultText.classList.remove("win", "lose", "draw", "show");
    void elResultText.offsetWidth;
    if (outcome === "win") {
      elResultText.textContent = "你赢了！";
      elResultText.className = "result-text win show";
      elResultSub.textContent = "棒！继续保持";
    } else if (outcome === "lose") {
      elResultText.textContent = "你输了！";
      elResultText.className = "result-text lose show";
      elResultSub.textContent = "别气馁，再来一局";
    } else {
      elResultText.textContent = "平局！";
      elResultText.className = "result-text draw show";
      elResultSub.textContent = "势均力敌，不分胜负";
    }
  }

  function play(playerChoice) {
    if (busy) return;
    busy = true;
    setButtonsDisabled(true);

    // Press animation on chosen button
    var chosenBtn = document.querySelector("[data-choice='" + playerChoice + "']");
    if (chosenBtn) {
      animate(chosenBtn, "pressed", 400);
    }

    // Show shake animation
    elPlayerHand.textContent = EMOJI[playerChoice];
    elCpuHand.textContent = "✊";
    animate(elPlayerHand, "animate-shake", 700);
    animate(elCpuHand, "animate-shake-cpu", 700);

    elResultText.className = "result-text";
    elResultText.textContent = "出拳中…";
    elResultSub.textContent = "";

    setTimeout(function() {
      var cpuChoice = CHOICES[Math.floor(Math.random() * CHOICES.length)];

      // Reveal
      elPlayerHand.textContent = EMOJI[playerChoice];
      elCpuHand.textContent = EMOJI[cpuChoice];

      animate(elPlayerHand, "animate-reveal", 500);
      animate(elCpuHand, "animate-reveal", 500);

      var outcome;
      if (playerChoice === cpuChoice) {
        outcome = "draw";
      } else if (BEATS[playerChoice] === cpuChoice) {
        outcome = "win";
      } else {
        outcome = "lose";
      }

      // Update state
      state.total++;
      if (outcome === "win") {
        state.wins++;
        state.streak++;
        if (state.streak > state.best) {
          state.best = state.streak;
        }
        setTimeout(function() { animate(elPlayerHand, "animate-win", 1100); }, 350);
      } else if (outcome === "lose") {
        state.loses++;
        state.streak = 0;
      } else {
        state.draws++;
      }

      state.history.push({
        player: playerChoice,
        cpu: cpuChoice,
        result: outcome === "win" ? "w" : outcome === "lose" ? "l" : "d"
      });
      if (state.history.length > 30) { state.history = state.history.slice(-30); }

      saveState();
      updateUI();
      showResult(outcome);

      setTimeout(function() {
        busy = false;
        setButtonsDisabled(false);
      }, 600);

    }, 700);
  }

  function resetStats() {
    if (!confirm("确定要清空所有统计数据吗？")) return;
    state.wins = 0;
    state.loses = 0;
    state.draws = 0;
    state.streak = 0;
    state.best = 0;
    state.total = 0;
    state.history = [];
    elPlayerHand.textContent = "✊";
    elCpuHand.textContent = "✊";
    elResultText.className = "result-text";
    elResultText.textContent = "准备出拳！";
    elResultSub.textContent = "选择你的手势";
    saveState();
    updateUI();
  }

  function init() {
    loadState();
    updateUI();

    for (var i = 0; i < allBtns.length; i++) {
      (function(btn) {
        btn.addEventListener("click", function() {
          play(btn.getAttribute("data-choice"));
        });
      })(allBtns[i]);
    }

    elResetBtn.addEventListener("click", resetStats);
  }

  init();

})();
</script>
</body>
</html>
