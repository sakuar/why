<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小站合集 · Mini Sites</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:#0c0f1a; color:#e8eef7; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; padding:48px 16px 70px; }
  .hero{ text-align:center; margin-bottom:14px; }
  h1{ font-size:clamp(26px,5vw,40px); font-weight:800; letter-spacing:1px; background:linear-gradient(90deg,#ffd166,#ff8aa0,#b98cff,#56b6ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p{ color:#8090a8; margin-top:10px; font-size:14px; }
  .progress{ max-width:980px; margin:18px auto 36px; }
  .progress .bar{ height:8px; background:rgba(255,255,255,.08); border-radius:6px; overflow:hidden; }
  .progress .bar i{ display:block; height:100%; width:80%; background:linear-gradient(90deg,#b98cff,#56b6ff); border-radius:6px; }
  .progress .lbl{ text-align:center; color:#8090a8; font-size:12px; margin-top:8px; letter-spacing:1px; }
  .cat{ max-width:980px; margin:0 auto 26px; }
  .cat h2{ font-size:14px; color:#aab6cc; font-weight:600; letter-spacing:2px; margin:0 4px 12px; display:flex; align-items:center; gap:8px; }
  .cat h2::after{ content:""; flex:1; height:1px; background:rgba(255,255,255,.08); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(195px,1fr)); gap:12px; }
  a.card{ text-decoration:none; color:inherit; position:relative; overflow:hidden; border-radius:13px; padding:15px; min-height:98px; display:flex; flex-direction:column; justify-content:flex-end; border:1px solid rgba(255,255,255,.08); transition:.22s; }
  a.card:hover{ transform:translateY(-4px); border-color:rgba(255,255,255,.28); box-shadow:0 16px 36px rgba(0,0,0,.5); }
  .card .emoji{ font-size:22px; position:absolute; top:13px; left:15px; filter:drop-shadow(0 3px 8px rgba(0,0,0,.4)); }
  .card h3{ font-size:14px; font-weight:700; }
  .card .desc{ color:#aab6cc; font-size:11px; margin-top:4px; line-height:1.45; }
  .c-time{ background:radial-gradient(ellipse at top right,#1b3a6b,#0a1428); }
  .c-decide{ background:radial-gradient(ellipse at top right,#3a2a5e,#160f28); }
  .c-word{ background:radial-gradient(ellipse at top right,#5e4a1f,#281f0f); }
  .c-tool{ background:radial-gradient(ellipse at top right,#0f3330,#0a1414); }
  .c-visual{ background:radial-gradient(ellipse at top right,#5e2a48,#280f1f); }
  .c-game{ background:radial-gradient(ellipse at top right,#2a4a2f,#101f14); }
  .c-heal{ background:radial-gradient(ellipse at top right,#3a5a35,#13301a); }
  .c-know{ background:radial-gradient(ellipse at top right,#1f4a5e,#0f2128); }
  footer{ max-width:980px; margin:34px auto 0; color:#5a6680; font-size:12px; text-align:center; line-height:1.8; }
  footer a{ color:#8090a8; }
</style>
</head>
<body>
<div class="hero"><h1>小站合集</h1><p>一堆纯前端单文件小玩具 · 双击即开 · 无需联网</p></div>
<div class="progress"><div class="bar"><i></i></div><div class="lbl">已上线 80 个 · 目标 100</div></div>
<div id="app"></div>
<footer>全部代码在本地，数据只存在你自己的浏览器里。<br>持续生长中，朝着 100 个小站前进 · <a href="https://github.com/sakuar/why">源码</a></footer>
<script>
"use strict";
var CATS=[
["🌍 时间 · 天文","c-time",[["earth-night","🌍","此刻地球的夜晚","看全球真实昼夜分界线"],["moon-phase","🌙","此刻月相","看看今晚的月亮"],["life-progress","⏳","生命进度条","你这辈子过了百分之几"],["sunset-countdown","🌇","日落倒计时","追逐今日的黄昏"],["world-clock","🕐","世界时钟墙","各城市实时时间"],["birth-sky","🌟","你出生那天","生日里藏的秘密"],["star-age","🪐","星球年龄","你在火星几岁"],["second-counter","⏱️","你活了多少秒","实时跳动的生命"],["holiday-countdown","🎉","节日倒计时","离下个节日还几天"]]],
["🎲 决策 · 占卜","c-decide",[["decision-maker","🎲","一句话决定器","荒诞占卜帮你拍板"],["dinner-wheel","🍽️","晚饭转盘","今天吃什么交给转盘"],["magic8","🎱","神奇8号球","摇一摇问答案"],["tarot","🔮","塔罗牌","抽一张看运势"],["fortune","🧧","今日运势","看看今天的运气"],["truth-dare","🎭","真心话大冒险","抽一个敢不敢"],["draw-lots","🎋","抽签筒","求一支签"]]],
["✍️ 文字 · 语言","c-word",[["zhongerbing","⚔️","中二台词机","召唤你的中二魂"],["emoji-translate","😀","句子转emoji","给文字加点emoji"],["morse","📡","摩斯电码机","滴滴答答传讯息"],["acrostic","📜","藏头诗","名字藏进诗里"],["fake-language","👽","假语言生成器","造一门异世界语"],["caesar","🔐","凯撒密码","古老的位移加密"],["kaomoji","😸","颜文字库","点一下就复制"],["pen-name","🖋️","笔名生成器","取个好笔名"],["ascii-art","🔤","字符画","文字变艺术字"],["palindrome","🔄","回文大师","正反读都一样"],["glitch-text","📺","故障文字","赛博故障效果"]]],
["🛠️ 工具 · 实用","c-tool",[["fake-work","💻","假装在工作","全屏假日志摸鱼神器"],["breathing","🫧","呼吸引导","跟着4-7-8呼吸静下来"],["gradient-css","🎨","渐变生成器","调出好看的渐变+CSS"],["pomodoro","🍅","番茄钟","专注 25 分钟"],["number-spell","💰","数字转大写","金额转中文大写"],["white-noise","🌊","白噪音","雨声海浪助眠专注"],["metronome","🎼","节拍器","稳定你的节奏"],["password-gen","🔑","密码生成器","生成超强密码"],["color-wheel","🎡","取色轮","调色取色复制"],["unit-fun","🍌","趣味单位换算","换算成香蕉和猫"],["word-count","📝","字数统计","数数有多少字"],["stopwatch","⏲️","秒表计时","计时与倒数"],["color-archaeology","🏺","颜色考古","传统色的故事"]]],
["🎆 视觉 · 生成艺术","c-visual",[["fireworks","🎆","点击烟花","指尖绽放粒子烟花"],["mandala","🌸","曼陀罗生成器","画一朵对称的花"],["kaleidoscope","🔭","万花筒","对称镜像万花筒"],["pixel-draw","🖌️","像素画板","画个像素小图"],["fractal-tree","🌳","分形树","递归生长的树"],["starfield","✨","星空壁纸","生成专属星空"],["cursor-trail","🌠","鼠标拖尾","绚丽光带跟随"],["poster","🖼️","几何海报","生成抽象海报"],["name-art","🎴","名字艺术","名字生成图案"]]],
["🕹️ 小游戏","c-game",[["game-2048","🔢","2048","合并数字方块"],["snake","🐍","贪吃蛇","经典贪吃蛇"],["memory","🃏","记忆翻牌","翻牌配对考记忆"],["reaction","⚡","反应测试","测测你多快"],["whack-a-mole","🔨","打地鼠","眼疾手快敲地鼠"],["minesweeper","💣","扫雷","经典扫雷"],["tictactoe","⭕","井字棋","和AI下三子棋"],["breakout","🧱","打砖块","弹球敲掉砖块"],["simon","🎵","西蒙记忆","记住颜色序列"],["puzzle15","🧩","数字华容道","滑动复原数字"],["rps","✊","石头剪刀布","和电脑猜拳"],["sudoku","9️⃣","数独","填满九宫格"],["guess-number","🎯","猜数字","1到100猜猜看"],["dodge","🚀","躲陨石","躲开下落的陨石"]]],
["🌱 情绪 · 治愈","c-heal",[["pixel-garden","🌱","像素花园","按真实时间生长的植物"],["praise","🌈","夸夸机","来被夸一夸"],["bubble-wrap","🫧","捏泡泡纸","啵啵啵解压"],["bonfire","🏕️","虚拟篝火","围炉听柴火噼啪"],["cactus","🌵","电子仙人掌","养一颗仙人掌"],["mood-diary","📔","情绪日记","记录每天的心情"],["future-letter","💌","给未来的信","写封信给未来自己"],["count-sheep","🐑","数羊助眠","数羊慢慢入睡"],["gratitude","🙏","感恩日记","记录感恩小事"],["worry-burn","🔥","烦恼焚烧炉","写下烦恼烧掉它"],["zen-garden","🪨","禅意沙盘","枯山水耙痕"]]],
["🧠 知识 · 好奇","c-know",[["typing-test","⌨️","打字速度测试","测测你的手速"],["planet-weight","🪐","各星球体重","你在木星有多重"],["cold-fact","💡","随机冷知识","来一条冷知识"],["today-history","📅","历史上的今天","今天发生过什么"],["light-speed","🌌","光速旅行","光要走多久到火星"],["population","👥","世界人口","实时人口跳动"]]]
];
var root=document.getElementById("app"),h="",i,j,c,it;
for(i=0;i<CATS.length;i++){
  c=CATS[i];
  h+='<section class="cat"><h2>'+c[0]+'</h2><div class="grid">';
  for(j=0;j<c[2].length;j++){ it=c[2][j];
    h+='<a class="card '+c[1]+'" href="'+it[0]+'.html"><span class="emoji">'+it[1]+'</span><h3>'+it[2]+'</h3><div class="desc">'+it[3]+'</div></a>';
  }
  h+='</div></section>';
}
root.innerHTML=h;
</script>
</body>
</html>
