<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小站合集 · 100 个小玩具</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:#0c0f1a; color:#e8eef7; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; padding:48px 16px 70px; }
  .hero{ text-align:center; margin-bottom:14px; }
  h1{ font-size:clamp(26px,5vw,40px); font-weight:800; letter-spacing:1px; background:linear-gradient(90deg,#ffd166,#ff8aa0,#b98cff,#56b6ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p{ color:#8090a8; margin-top:10px; font-size:14px; }
  .progress{ max-width:980px; margin:18px auto 36px; }
  .progress .bar{ height:8px; background:rgba(255,255,255,.08); border-radius:6px; overflow:hidden; }
  .progress .bar i{ display:block; height:100%; width:100%; background:linear-gradient(90deg,#ffd166,#ff8aa0,#b98cff,#56b6ff); border-radius:6px; }
  .progress .lbl{ text-align:center; color:#ffd166; font-size:13px; margin-top:8px; letter-spacing:1px; font-weight:600; }
  .cat{ max-width:980px; margin:0 auto 26px; }
  .cat h2{ font-size:14px; color:#aab6cc; font-weight:600; letter-spacing:2px; margin:0 4px 12px; display:flex; align-items:center; gap:8px; }
  .cat h2::after{ content:""; flex:1; height:1px; background:rgba(255,255,255,.08); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(195px,1fr)); gap:12px; }
  a.card{ text-decoration:none; color:inherit; position:relative; overflow:hidden; border-radius:13px; padding:15px; min-height:98px; display:flex; flex-direction:column; justify-content:flex-end; border:1px solid rgba(255,255,255,.08); transition:.22s; }
  a.card:hover{ transform:translateY(-4px); border-color:rgba(255,255,255,.28); box-shadow:0 16px 36px rgba(0,0,0,.5); }
  .card .emoji{ font-size:22px; position:absolute; top:13px; left:15px; }
  .card h3{ font-size:14px; font-weight:700; }
  .c-time{ background:radial-gradient(ellipse at top right,#1b3a6b,#0a1428); }
  .c-decide{ background:radial-gradient(ellipse at top right,#3a2a5e,#160f28); }
  .c-word{ background:radial-gradient(ellipse at top right,#5e4a1f,#281f0f); }
  .c-tool{ background:radial-gradient(ellipse at top right,#0f3330,#0a1414); }
  .c-visual{ background:radial-gradient(ellipse at top right,#5e2a48,#280f1f); }
  .c-game{ background:radial-gradient(ellipse at top right,#2a4a2f,#101f14); }
  .c-heal{ background:radial-gradient(ellipse at top right,#3a5a35,#13301a); }
  .c-know{ background:radial-gradient(ellipse at top right,#1f4a5e,#0f2128); }
  footer{ max-width:980px; margin:34px auto 0; color:#5a6680; font-size:12px; text-align:center; line-height:1.8; }
  footer a{ color:#8090a8; }
</style>
</head>
<body>
<div class="hero"><h1>小站合集</h1><p>100 个纯前端单文件小玩具 · 双击即开 · 无需联网</p></div>
<div class="progress"><div class="bar"><i></i></div><div class="lbl">🎉 已集齐 100 个 · 目标达成</div></div>
<div id="app"></div>
<footer>全部代码在本地，数据只存在你自己的浏览器里。<br>100 个小玩具，慢慢玩 · <a href="https://github.com/sakuar/why">源码</a></footer>
<script>
"use strict";
var C=[
["🌍 时间·天文","c-time",[["earth-night","🌍","此刻地球的夜晚"],["moon-phase","🌙","此刻月相"],["life-progress","⏳","生命进度条"],["sunset-countdown","🌇","日落倒计时"],["world-clock","🕐","世界时钟墙"],["birth-sky","🌟","你出生那天"],["star-age","🪐","星球年龄"],["second-counter","⏱️","你活了多少秒"],["holiday-countdown","🎉","节日倒计时"],["biorhythm","📈","生物节律"],["age-calc","📆","精确年龄"]]],
["🎲 决策·占卜","c-decide",[["decision-maker","⚖️","一句话决定器"],["dinner-wheel","🍽️","晚饭转盘"],["magic8","🎱","神奇8号球"],["tarot","🔮","塔罗牌"],["fortune","🧧","今日运势"],["truth-dare","🎭","真心话大冒险"],["draw-lots","🎋","抽签筒"],["dice","🎲","骰子"],["spin-bottle","🍾","转瓶子"]]],
["✍️ 文字·语言","c-word",[["zhongerbing","⚔️","中二台词机"],["emoji-translate","😀","句子转emoji"],["morse","📡","摩斯电码机"],["acrostic","📜","藏头诗"],["fake-language","👽","假语言生成器"],["caesar","🔐","凯撒密码"],["kaomoji","😸","颜文字库"],["pen-name","🖋️","笔名生成器"],["ascii-art","🔤","字符画"],["palindrome","🔄","回文大师"],["glitch-text","📺","故障文字"],["fake-book","📚","假书生成器"],["word-cloud","☁️","词云生成"]]],
["🛠️ 工具·实用","c-tool",[["fake-work","💻","假装在工作"],["breathing","🫧","呼吸引导"],["gradient-css","🎨","渐变生成器"],["pomodoro","🍅","番茄钟"],["number-spell","💰","数字转大写"],["white-noise","🌊","白噪音"],["metronome","🎼","节拍器"],["password-gen","🔑","密码生成器"],["color-wheel","🎡","取色轮"],["unit-fun","🍌","趣味单位换算"],["word-count","📝","字数统计"],["stopwatch","⏲️","秒表计时"],["color-archaeology","🏺","颜色考古"],["bmi","🩺","健康计算器"],["tuner","🎸","调音器"],["encode","🔣","编解码玩具"],["fake-data","🎰","假数据生成"]]],
["🎆 视觉·生成艺术","c-visual",[["fireworks","🎆","点击烟花"],["mandala","🌸","曼陀罗生成器"],["kaleidoscope","🔭","万花筒"],["pixel-draw","🖌️","像素画板"],["fractal-tree","🌳","分形树"],["starfield","✨","星空壁纸"],["cursor-trail","🌠","鼠标拖尾"],["poster","🖼️","几何海报"],["name-art","🎴","名字艺术"],["lava-lamp","🌋","熔岩灯"],["ripple","💧","水波纹"]]],
["🕹️ 小游戏","c-game",[["game-2048","🔢","2048"],["snake","🐍","贪吃蛇"],["memory","🃏","记忆翻牌"],["reaction","⚡","反应测试"],["whack-a-mole","🔨","打地鼠"],["minesweeper","💣","扫雷"],["tictactoe","⭕","井字棋"],["breakout","🧱","打砖块"],["simon","🎵","西蒙记忆"],["puzzle15","🧩","数字华容道"],["rps","✊","石头剪刀布"],["sudoku","9️⃣","数独"],["guess-number","🎯","猜数字"],["dodge","🚀","躲陨石"],["tetris","🟦","俄罗斯方块"],["flappy","🐤","像素小鸟"]]],
["🌱 情绪·治愈","c-heal",[["pixel-garden","🌱","像素花园"],["praise","🌈","夸夸机"],["bubble-wrap","🫧","捏泡泡纸"],["bonfire","🏕️","虚拟篝火"],["cactus","🌵","电子仙人掌"],["mood-diary","📔","情绪日记"],["future-letter","💌","给未来的信"],["count-sheep","🐑","数羊助眠"],["gratitude","🙏","感恩日记"],["worry-burn","🔥","烦恼焚烧炉"],["zen-garden","🪨","禅意沙盘"],["rain-window","🌧️","雨窗"],["fish-tank","🐟","养鱼缸"],["jellyfish","🎐","发光水母"]]],
["🧠 知识·好奇","c-know",[["typing-test","⌨️","打字速度测试"],["planet-weight","🪐","各星球体重"],["cold-fact","💡","随机冷知识"],["today-history","📅","历史上的今天"],["light-speed","🌌","光速旅行"],["population","👥","世界人口"],["dream-dict","💤","周公解梦"],["constellation","⭐","星座物语"],["zodiac","🐲","生肖物语"]]]
];
var r=document.getElementById("app"),h="",i,j,c,it;
for(i=0;i<C.length;i++){c=C[i];h+='<section class="cat"><h2>'+c[0]+' <span style="color:#5a6680;font-weight:400">('+c[2].length+')</span></h2><div class="grid">';for(j=0;j<c[2].length;j++){it=c[2][j];h+='<a class="card '+c[1]+'" href="'+it[0]+'.html"><span class="emoji">'+it[1]+'</span><h3>'+it[2]+'</h3></a>';}h+='</div></section>';}
r.innerHTML=h;
</script>
</body>
</html>
