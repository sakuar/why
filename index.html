<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>几何之旅 · 从点到线到面到体</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:#0c0f1a; color:#e8eef7; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; padding:44px 16px 70px; }
  .hero{ text-align:center; margin-bottom:14px; }
  h1{ font-size:clamp(26px,5vw,40px); font-weight:800; letter-spacing:1px; background:linear-gradient(90deg,#ffd166,#56b6ff,#b98cff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p{ color:#8090a8; margin-top:12px; font-size:14px; line-height:1.7; }
  .dimbar{ max-width:1100px; margin:22px auto 30px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .dimbar .d{ display:flex; align-items:center; gap:8px; font-size:13px; color:#8090a8; }
  .dimbar .d b{ color:#cdd6e8; font-weight:700; }
  .dimbar .arrow{ color:#3a445e; }
  .cat{ max-width:1100px; margin:0 auto 30px; }
  .cat h2{ font-size:15px; color:#e8eef7; font-weight:700; letter-spacing:1px; margin:0 4px 14px; display:flex; align-items:center; gap:10px; }
  .cat h2 .dim{ font-size:11px; font-weight:600; color:#0c0f1a; background:#56b6ff; border-radius:6px; padding:2px 8px; letter-spacing:.5px; }
  .cat h2 .c{ color:#5a6680; font-weight:400; font-size:13px; }
  .cat h2::after{ content:""; flex:1; height:1px; background:rgba(255,255,255,.08); }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:13px; }
  a.card,.card{ text-decoration:none; color:inherit; position:relative; overflow:hidden; border-radius:14px; padding:16px; min-height:106px; display:flex; flex-direction:column; justify-content:flex-end; border:1px solid rgba(255,255,255,.08); transition:.22s; }
  a.card:hover{ transform:translateY(-4px); border-color:rgba(255,255,255,.28); box-shadow:0 16px 36px rgba(0,0,0,.5); }
  .card .emoji{ font-size:24px; position:absolute; top:14px; left:16px; }
  .card .badge{ position:absolute; top:14px; right:14px; font-size:10px; font-weight:700; color:#ffd166; border:1px solid rgba(255,209,102,.4); border-radius:6px; padding:2px 7px; }
  .card h3{ font-size:15px; font-weight:700; }
  .card .desc{ font-size:12px; color:#9aa6bd; margin-top:5px; line-height:1.5; }
  /* 维度配色 */
  .c-gen{ background:radial-gradient(ellipse at top right,#4a2e6b,#1c0f2e); }
  .c-pt{ background:radial-gradient(ellipse at top right,#5e4a1f,#28200f); }
  .c-ln{ background:radial-gradient(ellipse at top right,#1f4a5e,#0f2128); }
  .c-fc{ background:radial-gradient(ellipse at top right,#1f3a5e,#0f1c2e); }
  .c-sd{ background:radial-gradient(ellipse at top right,#2a4a2f,#101f14); }
  .c-soon{ background:#11151f; border-style:dashed; cursor:default; }
  .c-soon:hover{ transform:none; box-shadow:none; border-color:rgba(255,255,255,.12); }
  .c-soon .emoji{ opacity:.4; }
  .c-soon h3{ color:#69748c; }
  footer{ max-width:1100px; margin:40px auto 0; color:#5a6680; font-size:12px; text-align:center; line-height:1.9; }
</style>
</head>
<body>
<div class="hero">
  <h1>📐 几何之旅</h1>
  <p>从 <b>点</b> 到 <b>线</b>，从线到 <b>面</b>，从面到 <b>立体</b> —— 拖动参数，亲眼看见每个公式怎么长出来。</p>
</div>

<div class="dimbar">
  <span class="d">● <b>点</b> 0维</span><span class="arrow">→</span>
  <span class="d">╱ <b>线</b> 1维</span><span class="arrow">→</span>
  <span class="d">▦ <b>面</b> 2维</span><span class="arrow">→</span>
  <span class="d">⬛ <b>体</b> 3维</span>
</div>

<div id="app"></div>

<footer>纯前端单文件教学合集 · 所有计算都在你的浏览器本地完成 · 无需安装</footer>

<script>
"use strict";
/* 每个分区: [标题, 维度标签, 卡片类名, [ [slug, emoji, 标题, 描述, soon?] ] ] */
var C=[
  ["🔣 符号篇 · 读懂数学的语言","工具","c-gen",[
    ["symbols","🔣","数学符号大全","81 个符号的读法/含义/例子 — sin·∩·∫·∠ 等带图解互动"]
  ]],
  ["🌌 维度生成 · 一切的起点","贯穿","c-gen",[
    ["dimension","🌱","点动成线·线动成面·面动成体","拖一拖，看点扫出线、线扫出面、面扫出体 — 测度 = 底 × 移动距离"]
  ]],
  ["● 点 · 0 维","0维","c-pt",[
    ["point-line#dist","📏","坐标与两点距离","距离 = √(Δx²+Δy²)，其实就是勾股"],
    ["locus","🧭","点的运动轨迹","点怎么走出直线、圆、抛物线、摆线"]
  ]],
  ["╱ 线 · 1 维","1维","c-ln",[
    ["point-line#angle","📐","角的度量","拖一拖，看锐角/直角/钝角与度数"],
    ["point-line#parallel","∥","平行与垂直","斜率相同则平行，乘积 −1 则垂直"],
    ["point-line#lines","📍","线段·射线·直线","延伸一下，看三者区别"]
  ]],
  ["▦ 面 · 2 维 · 多边形与圆","2维","c-fc",[
    ["area-circle","⭕","圆面积从哪来","切扇形拼成长方形 — 看面积爬向 πr²"],
    ["area-cut#rect","◻️","长方形与正方形","面积 = 数方格 = 底×高（一切的根）"],
    ["area-cut#para","▱","平行四边形 → 长方形","剪一刀补过去，面积不变"],
    ["area-cut#tri","🔺","三角形 → 平行四边形","复制倒扣拼一起，取一半"],
    ["area-cut#trap","⏢","梯形面积","½ ×(上底+下底)× 高 怎么来"],
    ["area-cut#rhom","◇","菱形","对角线矩形的一半 = ½ d₁d₂"],
    ["circle-family#polygon","⬡","正多边形","边数越多越接近圆"],
    ["circle-family#sector","🥧","扇形 / 弓形","圆的一部分怎么算"],
    ["circle-family#annulus","⭕","圆环 (annulus)","大圆挖小圆 = π(R²−r²)"]
  ]],
  ["🍩 旋转体 · Pappus 定理（一个公式统一四种立体）","旋转","c-gen",[
    ["pappus#cyl","▭","矩形 → 圆柱","截面绕轴转一圈，V = A × 2πR"],
    ["pappus#cone","◣","三角形 → 圆锥","形心到轴 r/3，自动得出 ⅓"],
    ["pappus#sphere","◗","半圆 → 球","形心 4r/3π，转出 4⁄3πr³"],
    ["pappus#torus","🍩","圆 → 环面 / 甜甜圈","V = 2π²Rr²"],
    ["shell","🧅","为什么？圆柱壳法证明","剥成一圈圈薄管，看 V=2πR·A 怎么来"]
  ]],
  ["🍰 切片求和 · 曲线图形（微积分启蒙）","切片","c-gen",[
    ["slice#ellipse","🥚","椭圆","π·a·b — 圆压扁，或切竖条累加"],
    ["slice#para","🅿️","抛物线下面积","w³⁄3 — 外接矩形的 ⅓"],
    ["slice#sphere","🔮","球（切片推导）","横切成一摞圆盘 → 4⁄3πr³"],
    ["slice#cap","⛑️","球冠 · 球的部分体积","πh²(r−h⁄3)，h=2r 时回到整球"]
  ]],
  ["⬛ 体 · 3 维 · 立体图形","3维","c-sd",[
    ["solid#box","📦","长方体 / 正方体","体积 = 底面积 × 高，可旋转看"],
    ["solid#cyl","🥫","圆柱","底面圆 × 高 = πr²h，侧面展开"],
    ["solid#cone","🍦","圆锥","同底等高圆柱的 ⅓"],
    ["solid#sphere","🔮","球","体积 4⁄3 πr³，表面积 4πr²"],
    ["solid#prism","🧊","棱柱 / 棱锥","直柱与尖锥，锥是柱的 1/3"],
    ["solid#frustum","🪣","圆台 (frustum)","锥被切去尖顶剩下的一截"],
    ["euler","💎","多面体 · 欧拉公式","顶点 − 棱 + 面 = 2"]
  ]],
  ["📈 坐标 · 函数 · 解析几何","坐标","c-fc",[
    ["math-edu","📐","公式课堂","一次/二次函数·勾股·圆 — 拖滑块看图形变化"],
    ["transform","📊","函数图像变换","平移/伸缩/翻折 — 拖参数看图怎么动"],
    ["exp-log","📈","指数与对数","aˣ 与 logₐx 互为反函数，关于 y=x 对称"],
    ["piecewise","📐","分段函数·绝对值","不同区间不同公式 · V形 · 连续性"],
    ["conic","🛰️","圆锥曲线","椭圆/双曲线/抛物线 — 焦点定义"]
  ]],
  ["〰️ 三角函数 · 向量","代数","c-ln",[
    ["trig-wave","〰️","三角函数图像","单位圆生成正弦波 — A/ω/φ 怎么影响波形"],
    ["vector","➡️","向量","加减/数乘/点积 — 拖分量看几何意义"]
  ]],
  ["📊 统计 · 概率 · 数列","数据","c-fc",[
    ["statistics","📊","统计","平均数/中位数/方差 · 正态分布"],
    ["probability","🎲","概率","大数定律 · 古典概型 · 两骰子之和"],
    ["sequence","🔢","数列","等差/等比 · 通项与求和"],
    ["counting","🎰","排列组合","排列 A · 组合 C · 杨辉三角"],
    ["binomial","🧮","二项式定理","(a+b)ⁿ 展开 · 系数=杨辉三角"]
  ]],
  ["🚀 进阶 · 微积分与复数","进阶","c-gen",[
    ["derivative","📈","导数入门","割线逼近切线 — 瞬时变化率"],
    ["complex","🔵","复数","复平面 · 加法平移 · 乘法旋转缩放"],
    ["trig-identity","🔄","三角恒等变换","和角公式 · 二倍角 — 单位圆上转一转"],
    ["solid-angle","📐","立体几何的角","线面角 · 二面角（可旋转 3D）"]
  ]]
];

var app=document.getElementById("app");
function card(t,cls){
  var soon=t[4];
  if(soon){
    return '<div class="card c-soon">'+
      '<span class="emoji">'+t[1]+'</span><span class="badge">敬请期待</span>'+
      '<h3>'+t[2]+'</h3><div class="desc">'+t[3]+'</div></div>';
  }
  var hi=t[0].indexOf("#"), href=hi>=0?t[0].slice(0,hi)+".html#"+t[0].slice(hi+1):t[0]+".html";
  return '<a class="card '+cls+'" href="'+href+'">'+
    '<span class="emoji">'+t[1]+'</span>'+
    '<h3>'+t[2]+'</h3><div class="desc">'+t[3]+'</div></a>';
}
var h="";
for(var i=0;i<C.length;i++){ var c=C[i];
  var done=0; for(var z=0;z<c[3].length;z++) if(!c[3][z][4]) done++;
  h+='<section class="cat"><h2><span class="dim">'+c[1]+'</span>'+c[0]+
     ' <span class="c">'+done+'/'+c[3].length+'</span></h2><div class="grid">';
  for(var j=0;j<c[3].length;j++) h+=card(c[3][j],c[2]);
  h+='</div></section>';
}
app.innerHTML=h;
</script>
</body>
</html>
