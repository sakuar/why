<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>3D 线框实验室</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#080a12;color:#e8eef7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden;}
  .top{width:100%;max-width:860px;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;}
  .top h1{font-size:17px;font-weight:800;letter-spacing:1px;
    background:linear-gradient(90deg,#56b6ff,#b98cff,#ff8aa0);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .top .back{font-size:12px;color:#8090a8;text-decoration:none;border:1px solid #222840;border-radius:8px;padding:5px 10px;}
  #stage{position:relative;width:100%;max-width:860px;flex:0 0 auto;}
  canvas{width:100%;display:block;background:radial-gradient(ellipse at 50% 40%,#101626,#06070d 75%);
    border:1px solid #1c2236;border-radius:14px;touch-action:none;cursor:grab;}
  canvas:active{cursor:grabbing;}
  .hint3d{position:absolute;left:12px;bottom:10px;font-size:11px;color:#5a6680;pointer-events:none;}
  .panel{width:100%;max-width:860px;padding:10px 14px 30px;}
  .row{margin-bottom:12px;}
  .row .lab{font-size:12px;color:#8090a8;font-weight:600;letter-spacing:1px;margin-bottom:7px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-size:13px;padding:7px 13px;border-radius:20px;background:#141a29;border:1px solid #232c44;color:#aab6cc;cursor:pointer;transition:.13s;white-space:nowrap;}
  .chip:hover{border-color:#3a445e;color:#e8eef7;}
  .chip.on{background:#6c63ff;border-color:#6c63ff;color:#fff;}
  .chip .em{margin-right:4px;}
  .mode .chip.on{background:#1f8a70;border-color:#1f8a70;}
  /* 参数滑块 */
  #params{display:grid;grid-template-columns:1fr 1fr;gap:11px 18px;}
  @media(max-width:520px){#params{grid-template-columns:1fr;}}
  .slider{}
  .slider .sl-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .slider .sl-top .nm{color:#cfd8ea;}
  .slider .sl-top .val{color:#56b6ff;font-weight:700;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:#232c44;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;box-shadow:0 0 0 1px #6c63ff;}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:#cfd8ea;cursor:pointer;user-select:none;}
  .sw{width:38px;height:21px;border-radius:11px;background:#232c44;position:relative;transition:.15s;flex:0 0 auto;}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#8090a8;transition:.15s;}
  .toggle.on .sw{background:#6c63ff;}
  .toggle.on .sw::after{left:19px;background:#fff;}
  .btn{font-size:12.5px;padding:7px 13px;border-radius:9px;background:#141a29;border:1px solid #232c44;color:#aab6cc;cursor:pointer;}
  .btn:active{transform:scale(.96);}
  .globals{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;margin-top:4px;}
  .globals .slider{min-width:150px;flex:1;}
</style>
</head>
<body>
<div class="top">
  <h1>🔷 3D 线框实验室</h1>
  <a class="back" href="index.html">← 返回合集</a>
</div>

<div id="stage">
  <canvas id="cv" width="860" height="540"></canvas>
  <div class="hint3d">拖动旋转 · 滚轮/双指缩放</div>
</div>

<div class="panel">
  <div class="row">
    <div class="lab">模型</div>
    <div class="chips" id="modelChips"></div>
  </div>
  <div class="row">
    <div class="lab">渲染模式</div>
    <div class="chips mode" id="modeChips"></div>
  </div>
  <div class="row">
    <div class="lab">参数（随模型变化）</div>
    <div id="params"></div>
  </div>
  <div class="row">
    <div class="lab">全局</div>
    <div class="globals">
      <div class="toggle on" id="autoTog"><span class="sw"></span><span>自动旋转</span></div>
      <div class="slider"><div class="sl-top"><span class="nm">旋转速度</span><span class="val" id="vSpeed">0.5</span></div>
        <input type="range" id="rSpeed" min="0" max="2" step="0.05" value="0.5"></div>
      <div class="slider"><div class="sl-top"><span class="nm">色调</span><span class="val" id="vHue">210</span></div>
        <input type="range" id="rHue" min="0" max="360" step="1" value="210"></div>
      <button class="btn" id="btnReset">重置视角</button>
    </div>
  </div>
</div>

<script>
"use strict";
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");

/* ============================== 向量/几何工具 ============================== */
function vadd(a,b){return [a[0]+b[0],a[1]+b[1],a[2]+b[2]];}
function vscale(a,s){return [a[0]*s,a[1]*s,a[2]*s];}

// 沿一条三维曲线生成"管"(圆截面),返回 {V,E,F}
function tubeAlong(curve,closed,tubeR,radial){
  var V=[],E=[],F=[];
  var n=curve.length;
  // 为每个曲线点构造一个法平面上的圆
  var prevN=null;
  for(var i=0;i<n;i++){
    var p=curve[i];
    var a=curve[(i-1+n)%n], b=curve[(i+1)%n];
    if(!closed){a=curve[Math.max(0,i-1)];b=curve[Math.min(n-1,i+1)];}
    var T=[b[0]-a[0],b[1]-a[1],b[2]-a[2]];
    var tl=Math.hypot(T[0],T[1],T[2])||1;T=[T[0]/tl,T[1]/tl,T[2]/tl];
    // 任取与 T 不平行的向量求法向
    var up=Math.abs(T[1])<0.92?[0,1,0]:[1,0,0];
    var N=[T[1]*up[2]-T[2]*up[1],T[2]*up[0]-T[0]*up[2],T[0]*up[1]-T[1]*up[0]];
    var nl=Math.hypot(N[0],N[1],N[2])||1;N=[N[0]/nl,N[1]/nl,N[2]/nl];
    var B=[T[1]*N[2]-T[2]*N[1],T[2]*N[0]-T[0]*N[2],T[0]*N[1]-T[1]*N[0]];
    var base=V.length;
    for(var j=0;j<radial;j++){
      var ang=j/radial*Math.PI*2;
      var c=Math.cos(ang),s=Math.sin(ang);
      V.push([p[0]+(N[0]*c+B[0]*s)*tubeR, p[1]+(N[1]*c+B[1]*s)*tubeR, p[2]+(N[2]*c+B[2]*s)*tubeR]);
    }
    // 环向边
    for(var j2=0;j2<radial;j2++)E.push([base+j2,base+(j2+1)%radial]);
  }
  // 纵向边 + 面
  var rings=n;
  for(var i2=0;i2<rings-(closed?0:1);i2++){
    var r0=i2*radial, r1=((i2+1)%rings)*radial;
    for(var j3=0;j3<radial;j3++){
      var jn=(j3+1)%radial;
      E.push([r0+j3,r1+j3]);
      F.push([r0+j3,r1+j3,r1+jn,r0+jn]);
    }
  }
  return {V:V,E:E,F:F};
}

/* ============================== 模型生成器 ============================== */
function addGridFace(g,origin,du,dv,n){
  var base=g.V.length;
  for(var i=0;i<=n;i++)for(var j=0;j<=n;j++){
    g.V.push(vadd(vadd(origin,vscale(du,i/n)),vscale(dv,j/n)));
  }
  function idx(i,j){return base+i*(n+1)+j;}
  for(var i2=0;i2<=n;i2++)for(var j2=0;j2<=n;j2++){
    if(i2<n)g.E.push([idx(i2,j2),idx(i2+1,j2)]);
    if(j2<n)g.E.push([idx(i2,j2),idx(i2,j2+1)]);
  }
  for(var i3=0;i3<n;i3++)for(var j3=0;j3<n;j3++){
    g.F.push([idx(i3,j3),idx(i3+1,j3),idx(i3+1,j3+1),idx(i3,j3+1)]);
  }
}
function buildCube(p){
  var n=Math.round(p.seg), g={V:[],E:[],F:[]}, s=0.95;
  addGridFace(g,[ s,-s,-s],[0,2*s,0],[0,0,2*s],n);
  addGridFace(g,[-s,-s,-s],[0,0,2*s],[0,2*s,0],n);
  addGridFace(g,[-s, s,-s],[2*s,0,0],[0,0,2*s],n);
  addGridFace(g,[-s,-s,-s],[0,0,2*s],[2*s,0,0],n);
  addGridFace(g,[-s,-s, s],[2*s,0,0],[0,2*s,0],n);
  addGridFace(g,[-s,-s,-s],[0,2*s,0],[2*s,0,0],n);
  return g;
}
function buildSphere(p){
  var su=Math.round(p.lon), sv=Math.round(p.lat), R=1.25, g={V:[],E:[],F:[]};
  for(var i=0;i<=sv;i++){var th=i/sv*Math.PI;
    for(var j=0;j<=su;j++){var ph=j/su*Math.PI*2;
      g.V.push([R*Math.sin(th)*Math.cos(ph), R*Math.cos(th), R*Math.sin(th)*Math.sin(ph)]);}}
  function idx(i,j){return i*(su+1)+j;}
  for(var i2=0;i2<=sv;i2++)for(var j2=0;j2<=su;j2++){
    if(i2<sv)g.E.push([idx(i2,j2),idx(i2+1,j2)]);
    if(j2<su)g.E.push([idx(i2,j2),idx(i2,j2+1)]);
  }
  for(var i3=0;i3<sv;i3++)for(var j3=0;j3<su;j3++)g.F.push([idx(i3,j3),idx(i3,j3+1),idx(i3+1,j3+1),idx(i3+1,j3)]);
  return g;
}
function buildTorus(p){
  var su=Math.round(p.seg), sv=Math.round(p.ring), R=p.R, r=p.r, g={V:[],E:[],F:[]};
  for(var i=0;i<=su;i++){var u=i/su*Math.PI*2;
    for(var j=0;j<=sv;j++){var v=j/sv*Math.PI*2;
      g.V.push([(R+r*Math.cos(v))*Math.cos(u),r*Math.sin(v),(R+r*Math.cos(v))*Math.sin(u)]);}}
  function idx(i,j){return i*(sv+1)+j;}
  for(var i2=0;i2<=su;i2++)for(var j2=0;j2<=sv;j2++){
    if(i2<su)g.E.push([idx(i2,j2),idx(i2+1,j2)]);
    if(j2<sv)g.E.push([idx(i2,j2),idx(i2,j2+1)]);
  }
  for(var i3=0;i3<su;i3++)for(var j3=0;j3<sv;j3++)g.F.push([idx(i3,j3),idx(i3+1,j3),idx(i3+1,j3+1),idx(i3,j3+1)]);
  return g;
}
function buildCylinder(p){
  var n=Math.round(p.sides), h=Math.round(p.layers), R=0.95, H=2.0, g={V:[],E:[],F:[]};
  for(var i=0;i<=h;i++){var y=-H/2+H*i/h;
    for(var j=0;j<=n;j++){var a=j/n*Math.PI*2;g.V.push([R*Math.cos(a),y,R*Math.sin(a)]);}}
  function idx(i,j){return i*(n+1)+j;}
  for(var i2=0;i2<=h;i2++)for(var j2=0;j2<=n;j2++){
    if(j2<n)g.E.push([idx(i2,j2),idx(i2,j2+1)]);
    if(i2<h)g.E.push([idx(i2,j2),idx(i2+1,j2)]);
  }
  for(var i3=0;i3<h;i3++)for(var j3=0;j3<n;j3++)g.F.push([idx(i3,j3),idx(i3,j3+1),idx(i3+1,j3+1),idx(i3+1,j3)]);
  return g;
}
function buildCone(p){
  var n=Math.round(p.sides), h=Math.round(p.layers), R=1.0, H=2.0, g={V:[],E:[],F:[]};
  for(var i=0;i<=h;i++){var t=i/h, y=-H/2+H*t, rr=R*(1-t);
    for(var j=0;j<=n;j++){var a=j/n*Math.PI*2;g.V.push([rr*Math.cos(a),y,rr*Math.sin(a)]);}}
  function idx(i,j){return i*(n+1)+j;}
  for(var i2=0;i2<=h;i2++)for(var j2=0;j2<=n;j2++){
    if(j2<n)g.E.push([idx(i2,j2),idx(i2,j2+1)]);
    if(i2<h)g.E.push([idx(i2,j2),idx(i2+1,j2)]);
  }
  for(var i3=0;i3<h;i3++)for(var j3=0;j3<n;j3++)g.F.push([idx(i3,j3),idx(i3,j3+1),idx(i3+1,j3+1),idx(i3+1,j3)]);
  return g;
}
function buildHelix(p){
  var turns=p.turns, R=0.85, H=2.0, N=Math.round(turns*48), curve=[];
  for(var i=0;i<=N;i++){var t=i/N, a=t*turns*Math.PI*2;
    curve.push([R*Math.cos(a), -H/2+H*t, R*Math.sin(a)]);}
  return tubeAlong(curve,false,p.tube,Math.round(p.radial));
}
function buildKnot(p){
  var P=Math.round(p.p), Q=Math.round(p.q), N=Math.round(p.seg), curve=[];
  for(var i=0;i<N;i++){var t=i/N*Math.PI*2;
    var r=Math.cos(Q*t)+2.2;
    curve.push([r*Math.cos(P*t)*0.55, r*Math.sin(P*t)*0.55, -Math.sin(Q*t)*0.55]);}
  return tubeAlong(curve,true,p.tube,Math.round(p.radial));
}
function buildWave(p){
  var n=Math.round(p.grid), f=p.freq, A=p.amp, S=1.5, g={V:[],E:[],F:[]};
  for(var i=0;i<=n;i++)for(var j=0;j<=n;j++){
    var x=-S+2*S*i/n, z=-S+2*S*j/n;
    var y=A*Math.sin(f*x*Math.PI)*Math.cos(f*z*Math.PI);
    g.V.push([x,y,z]);
  }
  function idx(i,j){return i*(n+1)+j;}
  for(var i2=0;i2<=n;i2++)for(var j2=0;j2<=n;j2++){
    if(i2<n)g.E.push([idx(i2,j2),idx(i2+1,j2)]);
    if(j2<n)g.E.push([idx(i2,j2),idx(i2,j2+1)]);
  }
  for(var i3=0;i3<n;i3++)for(var j3=0;j3<n;j3++)g.F.push([idx(i3,j3),idx(i3+1,j3),idx(i3+1,j3+1),idx(i3,j3+1)]);
  return g;
}
function buildDNA(p){
  var turns=p.turns, R=0.7, H=2.0, N=Math.round(turns*40), rung=Math.round(p.rungs), g={V:[],E:[],F:[]};
  var strandA=[],strandB=[];
  for(var i=0;i<=N;i++){var t=i/N, a=t*turns*Math.PI*2, y=-H/2+H*t;
    var pa=[R*Math.cos(a),y,R*Math.sin(a)], pb=[R*Math.cos(a+Math.PI),y,R*Math.sin(a+Math.PI)];
    g.V.push(pa);strandA.push(g.V.length-1);
    g.V.push(pb);strandB.push(g.V.length-1);
  }
  for(var k=0;k<strandA.length-1;k++){g.E.push([strandA[k],strandA[k+1]]);g.E.push([strandB[k],strandB[k+1]]);}
  var step=Math.max(1,Math.round(strandA.length/rung));
  for(var m=0;m<strandA.length;m+=step)g.E.push([strandA[m],strandB[m]]);
  return g;
}

/* ============================== 模型注册 ============================== */
var MODELS=[
  {id:"cube",  em:"🧊", name:"立方体", build:buildCube, params:[{k:"seg",label:"细分",min:1,max:10,step:1,def:3}]},
  {id:"sphere",em:"🔵", name:"球体",  build:buildSphere, params:[{k:"lon",label:"经线",min:4,max:48,step:1,def:20},{k:"lat",label:"纬线",min:3,max:36,step:1,def:14}]},
  {id:"torus", em:"🍩", name:"圆环",  build:buildTorus, params:[{k:"R",label:"主半径",min:0.6,max:1.6,step:0.05,def:1.0},{k:"r",label:"管半径",min:0.1,max:0.7,step:0.02,def:0.4},{k:"seg",label:"主分段",min:6,max:60,step:1,def:30},{k:"ring",label:"管分段",min:4,max:32,step:1,def:14}]},
  {id:"cyl",   em:"🥫", name:"圆柱",  build:buildCylinder, params:[{k:"sides",label:"边数",min:3,max:48,step:1,def:18},{k:"layers",label:"竖向层",min:1,max:12,step:1,def:4}]},
  {id:"cone",  em:"🔺", name:"圆锥",  build:buildCone, params:[{k:"sides",label:"边数",min:3,max:48,step:1,def:18},{k:"layers",label:"竖向层",min:1,max:12,step:1,def:5}]},
  {id:"helix", em:"🌀", name:"螺旋弹簧",build:buildHelix, params:[{k:"turns",label:"圈数",min:1,max:10,step:0.5,def:4},{k:"tube",label:"管粗",min:0.04,max:0.3,step:0.01,def:0.13},{k:"radial",label:"管面数",min:3,max:16,step:1,def:8}]},
  {id:"knot",  em:"🪢", name:"环面扭结",build:buildKnot, params:[{k:"p",label:"p (绕主轴)",min:1,max:7,step:1,def:2},{k:"q",label:"q (绕管轴)",min:1,max:9,step:1,def:3},{k:"seg",label:"曲线分段",min:60,max:400,step:10,def:200},{k:"tube",label:"管粗",min:0.04,max:0.25,step:0.01,def:0.1},{k:"radial",label:"管面数",min:3,max:12,step:1,def:7}]},
  {id:"wave",  em:"🌊", name:"波浪曲面",build:buildWave, params:[{k:"grid",label:"网格数",min:6,max:50,step:1,def:26},{k:"freq",label:"频率",min:0.5,max:5,step:0.1,def:2},{k:"amp",label:"振幅",min:0,max:1.2,step:0.05,def:0.5}]},
  {id:"dna",   em:"🧬", name:"DNA双螺旋",build:buildDNA, params:[{k:"turns",label:"圈数",min:1,max:8,step:0.5,def:3},{k:"rungs",label:"碱基对",min:4,max:60,step:1,def:24}]}
];
var MODES=[{id:"wire",name:"线框"},{id:"points",name:"点阵"},{id:"solid",name:"实体"},{id:"both",name:"实体+线框"}];

/* ============================== 状态 ============================== */
var S={model:"cube", mode:"wire", vals:{}, geo:null,
       rotX:-0.45, rotY:0.6, auto:true, speed:0.5, hue:210, zoom:1,
       drag:false, lastX:0, lastY:0, pinchD:0};
function curModel(){for(var i=0;i<MODELS.length;i++)if(MODELS[i].id===S.model)return MODELS[i];return MODELS[0];}
function rebuild(){
  var m=curModel(), p={};
  for(var i=0;i<m.params.length;i++){var pr=m.params[i];p[pr.k]=(S.vals[m.id]&&S.vals[m.id][pr.k]!==undefined)?S.vals[m.id][pr.k]:pr.def;}
  S.geo=m.build(p);
}
function ensureVals(m){if(!S.vals[m.id]){S.vals[m.id]={};for(var i=0;i<m.params.length;i++)S.vals[m.id][m.params[i].k]=m.params[i].def;}}

/* ============================== 渲染 ============================== */
function fit(){
  var w=Math.min(860,window.innerWidth);
  var h=Math.round(Math.min(560,window.innerHeight*0.56));
  cv.width=w; cv.height=Math.max(360,h);
}
function rotatePt(v){
  var cx=Math.cos(S.rotX),sx=Math.sin(S.rotX),cy=Math.cos(S.rotY),sy=Math.sin(S.rotY);
  var x=v[0],y=v[1],z=v[2];
  // 绕 X
  var y1=y*cx - z*sx, z1=y*sx + z*cx;
  // 绕 Y
  var x2=x*cy + z1*sy, z2=-x*sy + z1*cy;
  return [x2,y1,z2];
}
var FL=3.4;
function project(rv){
  var persp=FL/(FL+rv[2]);
  var base=Math.min(cv.width,cv.height)*0.34*S.zoom;
  return [cv.width/2 + rv[0]*persp*base, cv.height/2 - rv[1]*persp*base, rv[2], persp];
}
function draw(){
  if(S.auto)S.rotY+=S.speed*0.012;
  ctx.clearRect(0,0,cv.width,cv.height);
  var g=S.geo; if(!g){requestAnimationFrame(draw);return;}
  // 旋转+投影所有顶点
  var RV=new Array(g.V.length), PV=new Array(g.V.length), zmin=1e9,zmax=-1e9;
  for(var i=0;i<g.V.length;i++){var rv=rotatePt(g.V[i]);RV[i]=rv;PV[i]=project(rv);if(rv[2]<zmin)zmin=rv[2];if(rv[2]>zmax)zmax=rv[2];}
  var zr=(zmax-zmin)||1;
  function depth01(z){return 1-(z-zmin)/zr;} // 近=1 远=0
  var hue=S.hue;

  // 实体面(画家算法:远先画)
  if((S.mode==="solid"||S.mode==="both") && g.F && g.F.length){
    var faces=[];
    for(var fi=0;fi<g.F.length;fi++){var f=g.F[fi];var za=0;for(var k=0;k<f.length;k++)za+=RV[f[k]][2];za/=f.length;
      // 简单法向光照
      var A=RV[f[0]],B=RV[f[1]],C=RV[f[2]];
      var nx=(B[1]-A[1])*(C[2]-A[2])-(B[2]-A[2])*(C[1]-A[1]);
      var ny=(B[2]-A[2])*(C[0]-A[0])-(B[0]-A[0])*(C[2]-A[2]);
      var nz=(B[0]-A[0])*(C[1]-A[1])-(B[1]-A[1])*(C[0]-A[0]);
      var nl=Math.hypot(nx,ny,nz)||1; var light=Math.abs(nz/nl); // 朝向相机更亮
      faces.push({f:f,z:za,light:light});
    }
    faces.sort(function(a,b){return b.z-a.z;});
    for(var fj=0;fj<faces.length;fj++){var fc=faces[fj], f2=fc.f;
      ctx.beginPath();
      for(var k2=0;k2<f2.length;k2++){var pp=PV[f2[k2]];if(k2===0)ctx.moveTo(pp[0],pp[1]);else ctx.lineTo(pp[0],pp[1]);}
      ctx.closePath();
      var d=depth01(fc.z);
      var L=18+fc.light*40+d*14;
      ctx.fillStyle="hsl("+((hue+d*40)%360)+","+(58+d*22)+"%,"+L+"%)";
      ctx.fill();
      if(S.mode==="both"){ctx.strokeStyle="hsla("+((hue+60)%360)+",90%,"+(60+d*30)+"%,0.55)";ctx.lineWidth=1;ctx.stroke();}
    }
  }

  // 线框
  if(S.mode==="wire"||S.mode==="both"){
    var edges=[];
    for(var ei=0;ei<g.E.length;ei++){var e=g.E[ei];var z=(RV[e[0]][2]+RV[e[1]][2])/2;edges.push({e:e,z:z});}
    edges.sort(function(a,b){return b.z-a.z;});
    if(S.mode==="wire")ctx.lineWidth=1.4;else ctx.lineWidth=1;
    for(var ej=0;ej<edges.length;ej++){var ed=edges[ej].e;var p0=PV[ed[0]],p1=PV[ed[1]];
      if(S.mode==="both")continue; // both 模式线框已在面上描过
      var d2=depth01(edges[ej].z);
      ctx.strokeStyle="hsl("+((hue+d2*50)%360)+",85%,"+(34+d2*48)+"%)";
      ctx.globalAlpha=0.45+d2*0.55;
      ctx.beginPath();ctx.moveTo(p0[0],p0[1]);ctx.lineTo(p1[0],p1[1]);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  // 点阵
  if(S.mode==="points"){
    var order=[];for(var pi=0;pi<g.V.length;pi++)order.push(pi);
    order.sort(function(a,b){return RV[b][2]-RV[a][2];});
    for(var pj=0;pj<order.length;pj++){var vi=order[pj];var pp2=PV[vi];var d3=depth01(RV[vi][2]);
      var rr=1.2+d3*3.2;
      ctx.fillStyle="hsl("+((hue+d3*50)%360)+",90%,"+(40+d3*45)+"%)";
      ctx.globalAlpha=0.4+d3*0.6;
      ctx.beginPath();ctx.arc(pp2[0],pp2[1],rr,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  requestAnimationFrame(draw);
}

/* ============================== UI ============================== */
function renderModelChips(){
  var h="";for(var i=0;i<MODELS.length;i++){var m=MODELS[i];
    h+='<div class="chip'+(m.id===S.model?" on":"")+'" data-m="'+m.id+'"><span class="em">'+m.em+'</span>'+m.name+'</div>';}
  document.getElementById("modelChips").innerHTML=h;
}
function renderModeChips(){
  var h="";for(var i=0;i<MODES.length;i++){var m=MODES[i];
    h+='<div class="chip'+(m.id===S.mode?" on":"")+'" data-mode="'+m.id+'">'+m.name+'</div>';}
  document.getElementById("modeChips").innerHTML=h;
}
function renderParams(){
  var m=curModel();ensureVals(m);var h="";
  for(var i=0;i<m.params.length;i++){var pr=m.params[i];var val=S.vals[m.id][pr.k];
    h+='<div class="slider"><div class="sl-top"><span class="nm">'+pr.label+'</span><span class="val" id="pv_'+pr.k+'">'+fmt(val)+'</span></div>'+
       '<input type="range" data-p="'+pr.k+'" min="'+pr.min+'" max="'+pr.max+'" step="'+pr.step+'" value="'+val+'"></div>';
  }
  document.getElementById("params").innerHTML=h;
}
function fmt(v){return (Math.round(v*100)/100).toString();}

document.getElementById("modelChips").addEventListener("click",function(e){
  var c=e.target.closest(".chip");if(!c)return;S.model=c.getAttribute("data-m");
  renderModelChips();renderParams();rebuild();
});
document.getElementById("modeChips").addEventListener("click",function(e){
  var c=e.target.closest(".chip");if(!c)return;S.mode=c.getAttribute("data-mode");renderModeChips();
});
document.getElementById("params").addEventListener("input",function(e){
  var inp=e.target;if(inp.tagName!=="INPUT")return;var k=inp.getAttribute("data-p");
  var m=curModel();S.vals[m.id][k]=parseFloat(inp.value);
  var lbl=document.getElementById("pv_"+k);if(lbl)lbl.textContent=fmt(parseFloat(inp.value));
  rebuild();
});

// 全局控制
var autoTog=document.getElementById("autoTog");
autoTog.addEventListener("click",function(){S.auto=!S.auto;autoTog.classList.toggle("on",S.auto);});
document.getElementById("rSpeed").addEventListener("input",function(e){S.speed=parseFloat(e.target.value);document.getElementById("vSpeed").textContent=fmt(S.speed);});
document.getElementById("rHue").addEventListener("input",function(e){S.hue=parseFloat(e.target.value);document.getElementById("vHue").textContent=Math.round(S.hue);});
document.getElementById("btnReset").addEventListener("click",function(){S.rotX=-0.45;S.rotY=0.6;S.zoom=1;});

// 拖拽旋转 + 缩放
cv.addEventListener("pointerdown",function(e){S.drag=true;S.lastX=e.clientX;S.lastY=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",function(e){if(!S.drag)return;
  var dx=e.clientX-S.lastX, dy=e.clientY-S.lastY;S.lastX=e.clientX;S.lastY=e.clientY;
  S.rotY+=dx*0.008;S.rotX+=dy*0.008;
  S.rotX=Math.max(-Math.PI/2,Math.min(Math.PI/2,S.rotX));
});
cv.addEventListener("pointerup",function(){S.drag=false;});
cv.addEventListener("pointercancel",function(){S.drag=false;});
cv.addEventListener("wheel",function(e){e.preventDefault();S.zoom*=(e.deltaY<0?1.08:0.926);S.zoom=Math.max(0.3,Math.min(4,S.zoom));},{passive:false});
// 双指缩放
cv.addEventListener("touchmove",function(e){
  if(e.touches.length===2){e.preventDefault();
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(S.pinchD){S.zoom*=d/S.pinchD;S.zoom=Math.max(0.3,Math.min(4,S.zoom));}
    S.pinchD=d;S.drag=false;}
},{passive:false});
cv.addEventListener("touchend",function(){S.pinchD=0;});

window.addEventListener("resize",fit);

/* ============================== 启动 ============================== */
fit();renderModelChips();renderModeChips();renderParams();rebuild();
requestAnimationFrame(draw);
</script>
</body>
</html>
