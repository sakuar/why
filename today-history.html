<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>历史上的今天</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --primary: #3b5bdb;
    --primary-light: #4c6ef5;
    --accent: #e64980;
    --text: #1a1a2e;
    --text-sub: #5a6a85;
    --border: #e2e8f0;
    --shadow: 0 4px 24px rgba(59,91,219,0.08);
    --radius: 16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    font-size: 13px;
    color: var(--text-sub);
    text-decoration: none;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    padding: 5px 11px;
    border-radius: 20px;
    border: 1px solid var(--border);
    transition: color 0.2s, box-shadow 0.2s;
    z-index: 100;
  }
  .back-link:hover { color: var(--primary); box-shadow: 0 2px 8px rgba(59,91,219,0.15); }

  .hero {
    background: linear-gradient(135deg, #3b5bdb 0%, #7048e8 60%, #e64980 100%);
    color: #fff;
    text-align: center;
    padding: 60px 20px 40px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Ccircle cx='30' cy='30' r='20'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") repeat;
    pointer-events: none;
  }
  .hero-date {
    font-size: clamp(42px, 10vw, 72px);
    font-weight: 800;
    letter-spacing: -2px;
    line-height: 1;
    text-shadow: 0 2px 16px rgba(0,0,0,0.2);
  }
  .hero-label {
    font-size: 15px;
    opacity: 0.85;
    margin-top: 8px;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .hero-sub {
    font-size: 13px;
    opacity: 0.7;
    margin-top: 6px;
  }

  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px 16px 0;
  }
  .date-nav button {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 38px;
    height: 38px;
    font-size: 18px;
    cursor: pointer;
    color: var(--primary);
    transition: background 0.2s, box-shadow 0.2s;
    display: flex; align-items: center; justify-content: center;
  }
  .date-nav button:hover { background: #eef2ff; box-shadow: 0 2px 8px rgba(59,91,219,0.15); }
  .date-nav .date-display {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    min-width: 100px;
    text-align: center;
  }
  .today-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 7px 16px;
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.2s, transform 0.1s;
  }
  .today-btn:hover { background: var(--primary-light); transform: scale(1.04); }

  .stats-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 16px auto 0;
    font-size: 13px;
    color: var(--text-sub);
  }
  .stats-bar .count-badge {
    background: var(--primary);
    color: #fff;
    border-radius: 12px;
    padding: 2px 10px;
    font-weight: 700;
    font-size: 13px;
  }

  .filter-bar {
    display: flex;
    gap: 8px;
    padding: 16px 16px 0;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 800px;
    margin: 0 auto;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-btn {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-sub);
    white-space: nowrap;
    transition: all 0.2s;
    font-weight: 500;
  }
  .filter-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }
  .filter-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

  .cards-container {
    max-width: 800px;
    margin: 20px auto 0;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    display: flex;
    gap: 16px;
    align-items: flex-start;
    border-left: 4px solid transparent;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    animation: fadeUp 0.35s ease both;
    cursor: pointer;
    position: relative;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(59,91,219,0.13);
    border-left-color: var(--primary);
  }
  .card.favorited { border-left-color: var(--accent); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card-year {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 900;
    color: var(--primary);
    min-width: 70px;
    line-height: 1.1;
    letter-spacing: -1px;
    flex-shrink: 0;
    text-align: center;
  }
  .card-body { flex: 1; min-width: 0; }
  .card-tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    margin-bottom: 6px;
    letter-spacing: 0.5px;
  }
  .card-event {
    font-size: 15px;
    line-height: 1.6;
    color: var(--text);
    font-weight: 500;
  }
  .card-detail {
    font-size: 13px;
    color: var(--text-sub);
    margin-top: 6px;
    line-height: 1.6;
    display: none;
  }
  .card.expanded .card-detail { display: block; }
  .card-fav {
    position: absolute;
    top: 14px;
    right: 14px;
    background: none;
    border: none;
    font-size: 18px;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.2s, transform 0.2s;
    padding: 2px;
  }
  .card-fav:hover, .card.favorited .card-fav { opacity: 1; }
  .card.favorited .card-fav { transform: scale(1.2); }

  .tag-政治 { background: #fff0f6; color: #c2255c; }
  .tag-科技 { background: #e8f4fd; color: #1971c2; }
  .tag-文化 { background: #fff9db; color: #e67700; }
  .tag-军事 { background: #fff5f5; color: #c92a2a; }
  .tag-体育 { background: #ebfbee; color: #2f9e44; }
  .tag-灾难 { background: #f8f9fa; color: #495057; }
  .tag-探索 { background: #f3f0ff; color: #6741d9; }
  .tag-经济 { background: #fff4e6; color: #d9480f; }
  .tag-社会 { background: #e6fcf5; color: #087f5b; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-sub);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 15px; }

  .fav-section {
    max-width: 800px;
    margin: 32px auto 0;
    padding: 0 16px;
  }
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-sub);
    letter-spacing: 1px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .timeline-year {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-sub);
    letter-spacing: 1px;
    padding: 4px 0 4px 4px;
    margin-top: 4px;
  }

  .scroll-top {
    position: fixed;
    bottom: 24px;
    right: 20px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 44px;
    height: 44px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(59,91,219,0.3);
    transition: opacity 0.3s, transform 0.2s;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
  }
  .scroll-top.visible { opacity: 1; pointer-events: auto; }
  .scroll-top:hover { transform: scale(1.1); }

  @media (max-width: 500px) {
    .hero { padding: 50px 16px 32px; }
    .card { padding: 14px; gap: 12px; }
    .card-year { min-width: 54px; font-size: 22px; }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<div class="hero">
  <div class="hero-label">历史上的今天</div>
  <div class="hero-date" id="heroDate">--月--日</div>
  <div class="hero-sub" id="heroWeekday"></div>
</div>

<div class="date-nav">
  <button id="prevDay" title="前一天">&#8249;</button>
  <div class="date-display" id="dateDisplay"></div>
  <button id="nextDay" title="后一天">&#8250;</button>
  <button class="today-btn" id="todayBtn">今天</button>
</div>

<div class="stats-bar">
  <span>共找到</span>
  <span class="count-badge" id="countBadge">0</span>
  <span>条历史记录</span>
</div>

<div class="filter-bar" id="filterBar"></div>

<div class="cards-container" id="cardsContainer"></div>

<div class="fav-section" id="favSection" style="display:none;">
  <div class="section-title">收藏的事件</div>
  <div id="favList"></div>
</div>

<button class="scroll-top" id="scrollTop">↑</button>

  // 合并数据库
  var ALL_DB = {};
  var k;
  for (k in DB) { if (DB.hasOwnProperty(k)) ALL_DB[k] = DB[k]; }
  for (k in EXTRA) { if (EXTRA.hasOwnProperty(k)) ALL_DB[k] = EXTRA[k]; }

  // ---- 状态变量 ----
  var currentDate = new Date();
  var viewMonth = currentDate.getMonth() + 1;
  var viewDay = currentDate.getDate();
  var activeTag = "全部";
  var favorites = [];

  var WEEKDAYS = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  var MONTHS = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];

  // ---- DOM 引用 ----
  var heroDateEl = document.getElementById("heroDate");
  var heroWeekdayEl = document.getElementById("heroWeekday");
  var dateDisplayEl = document.getElementById("dateDisplay");
  var countBadgeEl = document.getElementById("countBadge");
  var filterBarEl = document.getElementById("filterBar");
  var cardsContainerEl = document.getElementById("cardsContainer");
  var favSectionEl = document.getElementById("favSection");
  var favListEl = document.getElementById("favList");
  var scrollTopBtn = document.getElementById("scrollTop");
  var prevDayBtn = document.getElementById("prevDay");
  var nextDayBtn = document.getElementById("nextDay");
  var todayBtn = document.getElementById("todayBtn");

  // ---- 工具函数 ----
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function getKey(m, d) { return pad(m) + "-" + pad(d); }

  function getDateObj(m, d) {
    var now = new Date();
    return new Date(now.getFullYear(), m - 1, d);
  }

  function loadFavorites() {
    try {
      var raw = localStorage.getItem("th_favorites");
      if (raw) { favorites = JSON.parse(raw); }
    } catch(e) { favorites = []; }
  }

  function saveFavorites() {
    try { localStorage.setItem("th_favorites", JSON.stringify(favorites)); } catch(e) {}
  }

  function isFavorited(year, event) {
    for (var i = 0; i < favorites.length; i++) {
      if (favorites[i].year === year && favorites[i].event === event) return true;
    }
    return false;
  }

  function toggleFavorite(year, event, tag, detail) {
    var idx = -1;
    for (var i = 0; i < favorites.length; i++) {
      if (favorites[i].year === year && favorites[i].event === event) { idx = i; break; }
    }
    if (idx >= 0) {
      favorites.splice(idx, 1);
    } else {
      favorites.push({year: year, event: event, tag: tag, detail: detail});
    }
    saveFavorites();
    renderPage();
  }

  function getTagColor(tag) {
    var colors = {
      "政治":"#c2255c","科技":"#1971c2","文化":"#e67700","军事":"#c92a2a",
      "体育":"#2f9e44","灾难":"#495057","探索":"#6741d9","经济":"#d9480f","社会":"#087f5b"
    };
    return colors[tag] || "#555";
  }

  // ---- 获取当日数据 ----
  function getEventsForDate(m, d) {
    var key = getKey(m, d);
    return ALL_DB[key] || [];
  }

  // ---- 获取所有标签 ----
  function getTagsFromEvents(events) {
    var tags = [];
    var seen = {};
    for (var i = 0; i < events.length; i++) {
      var t = events[i].tag;
      if (!seen[t]) { seen[t] = true; tags.push(t); }
    }
    return tags;
  }

  // ---- 渲染函数 ----
  function renderHero() {
    var d = getDateObj(viewMonth, viewDay);
    heroDateEl.textContent = viewMonth + "月" + viewDay + "日";
    heroWeekdayEl.textContent = WEEKDAYS[d.getDay()] + " · " + MONTHS[viewMonth - 1];
    dateDisplayEl.textContent = viewMonth + "月" + viewDay + "日";
  }

  function renderFilters(events) {
    var tags = getTagsFromEvents(events);
    filterBarEl.innerHTML = "";

    var allBtn = document.createElement("button");
    allBtn.className = "filter-btn" + (activeTag === "全部" ? " active" : "");
    allBtn.textContent = "全部";
    allBtn.addEventListener("click", function() {
      activeTag = "全部";
      renderPage();
    });
    filterBarEl.appendChild(allBtn);

    for (var i = 0; i < tags.length; i++) {
      (function(tag) {
        var btn = document.createElement("button");
        btn.className = "filter-btn" + (activeTag === tag ? " active" : "");
        btn.textContent = tag;
        btn.addEventListener("click", function() {
          activeTag = tag;
          renderPage();
        });
        filterBarEl.appendChild(btn);
      })(tags[i]);
    }
  }

  function renderCards(events) {
    cardsContainerEl.innerHTML = "";

    var filtered = events;
    if (activeTag !== "全部") {
      filtered = [];
      for (var i = 0; i < events.length; i++) {
        if (events[i].event_tag === activeTag || events[i].tag === activeTag) {
          filtered.push(events[i]);
        }
      }
    }

    countBadgeEl.textContent = filtered.length;

    if (filtered.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = '<div class="icon">📅</div><p>这一天暂无历史记录<br><span style="font-size:12px;opacity:0.6">换个日期试试？</span></p>';
      cardsContainerEl.appendChild(empty);
      return;
    }

    // 按年份排序
    var sorted = filtered.slice().sort(function(a, b) { return a.year - b.year; });

    for (var j = 0; j < sorted.length; j++) {
      (function(item, idx) {
        var faved = isFavorited(item.year, item.event);
        var card = document.createElement("div");
        card.className = "card" + (faved ? " favorited" : "");
        card.style.animationDelay = (idx * 0.06) + "s";

        var yearDisplay = item.year < 0 ? "公元前" + Math.abs(item.year) : item.year + "年";

        card.innerHTML =
          '<div class="card-year">' + (item.year < 0 ? "前" + Math.abs(item.year) : item.year) + '</div>' +
          '<div class="card-body">' +
            '<span class="card-tag tag-' + item.tag + '">' + item.tag + '</span>' +
            '<div class="card-event">' + item.event + '</div>' +
            (item.detail ? '<div class="card-detail">' + item.detail + '</div>' : '') +
          '</div>' +
          '<button class="card-fav" title="' + (faved ? "取消收藏" : "收藏") + '">' + (faved ? "★" : "☆") + '</button>';

        // 展开/收起详情
        card.addEventListener("click", function(e) {
          if (e.target.classList.contains("card-fav")) return;
          card.classList.toggle("expanded");
        });

        // 收藏按钮
        var favBtn = card.querySelector(".card-fav");
        favBtn.addEventListener("click", function(e) {
          e.stopPropagation();
          toggleFavorite(item.year, item.event, item.tag, item.detail);
        });

        cardsContainerEl.appendChild(card);
      })(sorted[j], j);
    }
  }

  function renderFavorites() {
    if (favorites.length === 0) {
      favSectionEl.style.display = "none";
      return;
    }
    favSectionEl.style.display = "block";
    favListEl.innerHTML = "";
    for (var i = 0; i < favorites.length; i++) {
      (function(item) {
        var div = document.createElement("div");
        div.className = "card favorited";
        div.style.marginBottom = "10px";
        div.innerHTML =
          '<div class="card-year" style="color:#e64980">' + (item.year < 0 ? "前" + Math.abs(item.year) : item.year) + '</div>' +
          '<div class="card-body">' +
            '<span class="card-tag tag-' + item.tag + '">' + item.tag + '</span>' +
            '<div class="card-event">' + item.event + '</div>' +
            (item.detail ? '<div class="card-detail">' + item.detail + '</div>' : '') +
          '</div>' +
          '<button class="card-fav" title="取消收藏">★</button>';

        div.addEventListener("click", function(e) {
          if (e.target.classList.contains("card-fav")) return;
          div.classList.toggle("expanded");
        });
        var fb = div.querySelector(".card-fav");
        fb.addEventListener("click", function(e) {
          e.stopPropagation();
          toggleFavorite(item.year, item.event, item.tag, item.detail);
        });
        favListEl.appendChild(div);
      })(favorites[i]);
    }
  }

  function renderPage() {
    var events = getEventsForDate(viewMonth, viewDay);
    renderHero();
    renderFilters(events);
    renderCards(events);
    renderFavorites();
  }

  // ---- 日期导航 ----
  function changeDay(delta) {
    var d = getDateObj(viewMonth, viewDay);
    d.setDate(d.getDate() + delta);
    viewMonth = d.getMonth() + 1;
    viewDay = d.getDate();
    activeTag = "全部";
    renderPage();
    window.scrollTo({top: 0, behavior: "smooth"});
  }

  // ---- 事件绑定 ----
  prevDayBtn.addEventListener("click", function() { changeDay(-1); });
  nextDayBtn.addEventListener("click", function() { changeDay(1); });
  todayBtn.addEventListener("click", function() {
    var now = new Date();
    viewMonth = now.getMonth() + 1;
    viewDay = now.getDate();
    activeTag = "全部";
    renderPage();
    window.scrollTo({top: 0, behavior: "smooth"});
  });

  window.addEventListener("scroll", function() {
    if (window.scrollY > 300) {
      scrollTopBtn.classList.add("visible");
    } else {
      scrollTopBtn.classList.remove("visible");
    }
  });
  scrollTopBtn.addEventListener("click", function() {
    window.scrollTo({top: 0, behavior: "smooth"});
  });

  // ---- 初始化 ----
  loadFavorites();
  renderPage();

})();
</script>
