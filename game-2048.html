<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #faf8ef;
    font-family: "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    color: #776e65;
  }

  .back-link {
    position: fixed;
    top: 12px;
    left: 14px;
    font-size: 13px;
    color: #9f8d7a;
    text-decoration: none;
    opacity: 0.75;
    transition: opacity 0.2s;
    z-index: 100;
  }
  .back-link:hover { opacity: 1; }

  .header {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 36px;
    margin-bottom: 16px;
  }

  .title {
    font-size: 52px;
    font-weight: 900;
    color: #776e65;
    letter-spacing: -2px;
    line-height: 1;
  }

  .scores-wrap {
    display: flex;
    gap: 8px;
  }

  .score-box {
    background: #bbada0;
    border-radius: 6px;
    padding: 6px 14px;
    text-align: center;
    min-width: 72px;
  }
  .score-box .label {
    font-size: 11px;
    font-weight: 700;
    color: #eee4da;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .score-box .value {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    line-height: 1.2;
    transition: transform 0.1s;
  }
  .score-box .value.bump {
    animation: scoreBump 0.18s ease-out;
  }
  @keyframes scoreBump {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.25); }
    100% { transform: scale(1); }
  }

  .controls {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }

  .desc-text {
    font-size: 13px;
    color: #9f8d7a;
    line-height: 1.5;
  }

  .btn-new {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn-new:hover { background: #7a6755; }
  .btn-new:active { transform: scale(0.96); }

  .board-wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
  }

  .board-bg {
    background: #bbada0;
    border-radius: 10px;
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    aspect-ratio: 1 / 1;
    width: 100%;
  }

  .cell-bg {
    background: rgba(238, 228, 218, 0.35);
    border-radius: 6px;
  }

  .tiles-layer {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    bottom: 10px;
    pointer-events: none;
  }

  .tile {
    position: absolute;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    transition: top 0.12s ease, left 0.12s ease, transform 0.12s ease, opacity 0.12s ease;
    will-change: top, left, transform;
    user-select: none;
  }

  .tile.new-tile {
    animation: tileAppear 0.2s ease-out forwards;
  }
  @keyframes tileAppear {
    0%   { transform: scale(0.5); opacity: 0.5; }
    60%  { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1);   opacity: 1; }
  }

  .tile.merge-tile {
    animation: tileMerge 0.18s ease-out forwards;
  }
  @keyframes tileMerge {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }

  /* Tile colors */
  .t2    { background:#eee4da; color:#776e65; }
  .t4    { background:#ede0c8; color:#776e65; }
  .t8    { background:#f2b179; color:#f9f6f2; }
  .t16   { background:#f59563; color:#f9f6f2; }
  .t32   { background:#f67c5f; color:#f9f6f2; }
  .t64   { background:#f65e3b; color:#f9f6f2; }
  .t128  { background:#edcf72; color:#f9f6f2; }
  .t256  { background:#edcc61; color:#f9f6f2; }
  .t512  { background:#edc850; color:#f9f6f2; }
  .t1024 { background:#edc53f; color:#f9f6f2; }
  .t2048 { background:#edc22e; color:#f9f6f2; }
  .thigh { background:#3c3a32; color:#f9f6f2; }

  .overlay {
    position: absolute;
    inset: 0;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s;
    z-index: 20;
  }
  .overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .overlay-gameover { background: rgba(238, 228, 218, 0.72); }
  .overlay-win      { background: rgba(237, 194, 46, 0.5); }

  .overlay-title {
    font-size: 44px;
    font-weight: 900;
    color: #776e65;
  }
  .overlay-win .overlay-title { color: #f9f6f2; text-shadow: 0 2px 8px rgba(0,0,0,0.15); }

  .overlay .btn-new {
    font-size: 16px;
    padding: 11px 28px;
  }

  .hint {
    margin-top: 14px;
    font-size: 12px;
    color: #bba898;
    text-align: center;
  }

  @media (max-width: 420px) {
    .title { font-size: 38px; }
    .score-box .value { font-size: 18px; }
    .score-box { min-width: 60px; padding: 5px 10px; }
    .board-bg { padding: 8px; gap: 8px; }
    .tiles-layer { top:8px; left:8px; right:8px; bottom:8px; }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<div class="header">
  <div class="title">2048</div>
  <div class="scores-wrap">
    <div class="score-box">
      <div class="label">分数</div>
      <div class="value" id="scoreVal">0</div>
    </div>
    <div class="score-box">
      <div class="label">最高</div>
      <div class="value" id="bestVal">0</div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="desc-text">合并相同数字，目标达到 <strong>2048</strong></div>
  <button class="btn-new" id="btnNew">新游戏</button>
</div>

<div class="board-wrap" id="boardWrap">
  <div class="board-bg" id="boardBg"></div>
  <div class="tiles-layer" id="tilesLayer"></div>
  <div class="overlay overlay-gameover" id="overlayGameover">
    <div class="overlay-title">游戏结束</div>
    <button class="btn-new" id="btnRetry">再来一局</button>
  </div>
  <div class="overlay overlay-win" id="overlayWin">
    <div class="overlay-title">恭喜达成！</div>
    <button class="btn-new" id="btnContinue">继续挑战</button>
  </div>
</div>

<div class="hint">方向键 / WASD 移动 · 手机可滑动屏幕</div>

<script>
(function() {
  'use strict';

  const GRID = 4;
  let board = [];       // 2d array of values
  let score = 0;
  let best = parseInt(localStorage.getItem('2048_best') || '0', 10);
  let gameOver = false;
  let won = false;
  let keepPlaying = false;
  let animating = false;

  // DOM refs
  const scoreEl   = document.getElementById('scoreVal');
  const bestEl    = document.getElementById('bestVal');
  const tilesLayer = document.getElementById('tilesLayer');
  const overlayGO = document.getElementById('overlayGameover');
  const overlayWin= document.getElementById('overlayWin');

  // Init grid backgrounds
  const bgGrid = document.getElementById('boardBg');
  for (let i = 0; i < GRID * GRID; i++) {
    const c = document.createElement('div');
    c.className = 'cell-bg';
    bgGrid.appendChild(c);
  }

  bestEl.textContent = best;

  // ---- GAME LOGIC ----

  function newGame() {
    board = Array.from({length: GRID}, () => Array(GRID).fill(0));
    score = 0;
    gameOver = false;
    won = false;
    keepPlaying = false;
    updateScore(0, true);
    overlayGO.classList.remove('show');
    overlayWin.classList.remove('show');
    addRandom();
    addRandom();
    renderTiles(true);
  }

  function addRandom() {
    const empty = [];
    for (let r = 0; r < GRID; r++)
      for (let c = 0; c < GRID; c++)
        if (board[r][c] === 0) empty.push([r, c]);
    if (!empty.length) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
    return [r, c];
  }

  function updateScore(add, reset) {
    if (reset) score = 0;
    else score += add;
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      localStorage.setItem('2048_best', best);
    }
    if (add > 0) {
      scoreEl.classList.remove('bump');
      void scoreEl.offsetWidth;
      scoreEl.classList.add('bump');
    }
  }

  // Move in a direction; returns {moved, mergedPositions, newPos}
  function move(dir) {
    // dir: 0=up 1=right 2=down 3=left
    let moved = false;
    let gained = 0;
    const mergedAt = []; // [r,c] that just merged (for animation class)
    const newAt = [];    // [r,c] newly placed after move

    // We'll work on rows/cols depending on direction
    // Normalize: always slide "left" after rotating the view
    // Instead, handle each direction directly.

    function slideLine(line) {
      // remove zeros
      let arr = line.filter(v => v !== 0);
      let merged = Array(arr.length).fill(false);
      for (let i = 0; i < arr.length - 1; i++) {
        if (!merged[i] && arr[i] === arr[i+1]) {
          arr[i] *= 2;
          gained += arr[i];
          arr.splice(i+1, 1);
          merged.splice(i+1, 1);
          merged[i] = true;
        }
      }
      while (arr.length < GRID) arr.push(0);
      return { result: arr, mergedFlags: merged };
    }

    function getRow(r) { return board[r].slice(); }
    function setRow(r, arr) {
      for (let c = 0; c < GRID; c++) board[r][c] = arr[c];
    }
    function getCol(c) { return board.map(row => row[c]); }
    function setCol(c, arr) {
      for (let r = 0; r < GRID; r++) board[r][c] = arr[r];
    }

    if (dir === 3) { // left
      for (let r = 0; r < GRID; r++) {
        const orig = getRow(r);
        const {result, mergedFlags} = slideLine(orig);
        if (result.some((v,i) => v !== orig[i])) moved = true;
        setRow(r, result);
        mergedFlags.forEach((m, i) => { if (m) mergedAt.push([r, i]); });
      }
    } else if (dir === 1) { // right
      for (let r = 0; r < GRID; r++) {
        const orig = getRow(r).reverse();
        const {result, mergedFlags} = slideLine(orig);
        const rev = result.reverse();
        const origRev = getRow(r);
        if (rev.some((v,i) => v !== origRev[i])) moved = true;
        setRow(r, rev);
        mergedFlags.reverse().forEach((m, i) => { if (m) mergedAt.push([r, GRID-1-i]); });
      }
    } else if (dir === 0) { // up
      for (let c = 0; c < GRID; c++) {
        const orig = getCol(c);
        const {result, mergedFlags} = slideLine(orig);
        if (result.some((v,i) => v !== orig[i])) moved = true;
        setCol(c, result);
        mergedFlags.forEach((m, i) => { if (m) mergedAt.push([i, c]); });
      }
    } else if (dir === 2) { // down
      for (let c = 0; c < GRID; c++) {
        const orig = getCol(c).reverse();
        const {result, mergedFlags} = slideLine(orig);
        const rev = result.reverse();
        const origRev = getCol(c);
        if (rev.some((v,i) => v !== origRev[i])) moved = true;
        setCol(c, rev);
        mergedFlags.reverse().forEach((m, i) => { if (m) mergedAt.push([GRID-1-i, c]); });
      }
    }

    return { moved, gained, mergedAt };
  }

  function canMove() {
    for (let r = 0; r < GRID; r++)
      for (let c = 0; c < GRID; c++) {
        if (board[r][c] === 0) return true;
        if (c < GRID-1 && board[r][c] === board[r][c+1]) return true;
        if (r < GRID-1 && board[r][c] === board[r+1][c]) return true;
      }
    return false;
  }

  function hasValue(v) {
    return board.some(row => row.includes(v));
  }

  // ---- RENDERING ----

  // Track tile DOM elements by (r,c)
  let tileEls = {}; // key: "r,c" -> {el, val}

  function tileClass(v) {
    if (v <= 2048) return 't' + v;
    return 'thigh';
  }

  function fontSize(v) {
    const s = String(v).length;
    if (s <= 2) return '42px';
    if (s === 3) return '34px';
    if (s === 4) return '26px';
    return '20px';
  }

  // Compute pixel position of a tile given (r, c)
  function tilePos(r, c) {
    // tiles-layer inner size = boardBg inner size
    const layer = tilesLayer;
    const W = layer.offsetWidth;
    const gap = 10;
    // on narrow screens gap reduced
    const actualGap = W < 300 ? 8 : 10;
    const cellSize = (W - actualGap * (GRID - 1)) / GRID;
    return {
      top: r * (cellSize + actualGap),
      left: c * (cellSize + actualGap),
      size: cellSize
    };
  }

  function renderTiles(instant) {
    // Full re-render
    tilesLayer.innerHTML = '';
    tileEls = {};

    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        const v = board[r][c];
        if (!v) continue;
        const el = makeTileEl(v, r, c);
        if (instant) {
          el.style.transition = 'none';
          el.classList.remove('new-tile');
        }
        tilesLayer.appendChild(el);
        tileEls[r + ',' + c] = { el, val: v };
      }
    }
  }

  function makeTileEl(v, r, c) {
    const el = document.createElement('div');
    el.className = 'tile ' + tileClass(v);
    el.textContent = v;
    const pos = tilePos(r, c);
    el.style.width  = pos.size + 'px';
    el.style.height = pos.size + 'px';
    el.style.top    = pos.top  + 'px';
    el.style.left   = pos.left + 'px';
    el.style.fontSize = fontSize(v);
    return el;
  }

  // Animate a move: given old board snapshot, current board state, mergedAt, newPos
  function animateMove(oldBoard, mergedAt, newTilePos, cb) {
    animating = true;

    // Build map: for each (r,c) in new board that has a value, find where it came from
    // Strategy: re-render current state but start tiles from old positions.

    // Step 1: place tiles at old positions
    tilesLayer.innerHTML = '';
    tileEls = {};

    // We'll create an el for each old tile, then transition to new position
    // For simplicity: create all new-state tiles at old coords, animate to new coords

    // First: identify old non-zero tiles
    const oldTiles = [];
    for (let r = 0; r < GRID; r++)
      for (let c = 0; c < GRID; c++)
        if (oldBoard[r][c]) oldTiles.push({ r, c, v: oldBoard[r][c] });

    // Build new state tiles (render all at final positions)
    // Then also render slide animations
    // We'll use a simpler approach: render final state, but add new-tile & merge-tile classes

    // Render final board tiles (positioned correctly)
    for (let r = 0; r < GRID; r++) {
      for (let c = 0; c < GRID; c++) {
        const v = board[r][c];
        if (!v) continue;
        const el = makeTileEl(v, r, c);
        // Check if merged
        const isMerged = mergedAt.some(([mr,mc]) => mr===r && mc===c);
        if (isMerged) {
          el.classList.add('merge-tile');
        }
        // Check if new tile
        const isNew = newTilePos && newTilePos[0] === r && newTilePos[1] === c;
        if (isNew) {
          el.classList.add('new-tile');
        }
        tilesLayer.appendChild(el);
        tileEls[r+','+c] = {el, val: v};
      }
    }

    setTimeout(() => {
      animating = false;
      cb && cb();
    }, 160);
  }

  // ---- INPUT HANDLING ----

  function handleDirection(dir) {
    if (animating || gameOver) return;
    if (won && !keepPlaying) return;

    const oldBoard = board.map(r => r.slice());
    const { moved, gained, mergedAt } = move(dir);
    if (!moved) return;

    updateScore(gained);

    const newPos = addRandom();

    animateMove(oldBoard, mergedAt, newPos, () => {
      // check win
      if (!won && hasValue(2048)) {
        won = true;
        if (!keepPlaying) {
          overlayWin.classList.add('show');
          return;
        }
      }
      // check game over
      if (!canMove()) {
        gameOver = true;
        overlayGO.classList.add('show');
      }
    });
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    const map = {
      ArrowUp: 0, ArrowRight: 1, ArrowDown: 2, ArrowLeft: 3,
      w: 0, d: 1, s: 2, a: 3,
      W: 0, D: 1, S: 2, A: 3
    };
    if (map[e.key] !== undefined) {
      e.preventDefault();
      handleDirection(map[e.key]);
    }
  });

  // Touch / swipe
  let touchStartX = 0, touchStartY = 0;
  const board_el = document.getElementById('boardWrap');

  board_el.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, {passive: true});

  board_el.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    const absDx = Math.abs(dx), absDy = Math.abs(dy);
    if (Math.max(absDx, absDy) < 20) return;
    if (absDx > absDy) {
      handleDirection(dx > 0 ? 1 : 3);
    } else {
      handleDirection(dy > 0 ? 2 : 0);
    }
  }, {passive: true});

  // Prevent page scroll on swipe inside board
  board_el.addEventListener('touchmove', e => e.preventDefault(), {passive: false});

  // Buttons
  document.getElementById('btnNew').addEventListener('click', newGame);
  document.getElementById('btnRetry').addEventListener('click', newGame);
  document.getElementById('btnContinue').addEventListener('click', () => {
    keepPlaying = true;
    overlayWin.classList.remove('show');
  });

  // Recalculate tile positions on resize
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => renderTiles(true), 100);
  });

  // Start!
  newGame();

})();
</script>
</body>
</html>
