<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>梯度下降 · 机器学习怎么找最优</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#070912;color:#e8eef7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  .wrap{width:100%;max-width:1240px;padding:0 18px;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px;}
  .top h1{font-size:18px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#ffd166,#56b6ff,#b98cff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .top .back{font-size:12px;color:#8090a8;text-decoration:none;border:1px solid #222840;border-radius:8px;padding:6px 11px;}
  .badge{font-size:12px;color:#56d6a8;margin:2px 2px 12px;}
  .chips{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap;}
  .chip{flex:1;min-width:130px;display:flex;align-items:center;gap:7px;justify-content:center;font-size:13px;padding:11px 8px;border-radius:11px;background:#0e1322;border:1px solid #232c44;color:#aab6cc;cursor:pointer;transition:.14s;}
  .chip:hover{border-color:#3a445e;color:#e8eef7;}
  .chip.on{background:#6c63ff;border-color:#6c63ff;color:#fff;font-weight:700;}
  .work{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:stretch;}
  @media(max-width:780px){.work{grid-template-columns:1fr;}}
  #stage{position:relative;min-width:0;}
  canvas{width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 42%,#0e1426,#06070d 80%);border:1px solid #1c2236;border-radius:14px;touch-action:none;}
  .controls{background:#0e1322;border:1px solid #232c44;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;}
  .controls .ch{font-size:12px;color:#8090a8;font-weight:600;letter-spacing:1px;margin-bottom:12px;}
  .slider{margin-bottom:13px;}.slider:last-child{margin-bottom:0;}
  .slider .sl-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;}
  .slider .sl-top .nm{color:#cfd8ea;}.slider .sl-top .val{color:#56b6ff;font-weight:700;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#232c44;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;box-shadow:0 0 0 1px #6c63ff;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;}
  .btn{font-size:14px;padding:11px 16px;border-radius:10px;background:#6c63ff;border:1px solid #6c63ff;color:#fff;font-weight:700;cursor:pointer;width:100%;}
  .hint{font-size:12px;color:#5a6680;line-height:1.6;border-top:1px solid #1a2138;padding-top:13px;}
  .info{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:780px){.info{grid-template-columns:1fr;}}
  .readout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;grid-column:1 / -1;}
  .readout .cell{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:14px 12px;text-align:center;}
  .readout .cell .k{font-size:11.5px;color:#8090a8;margin-bottom:6px;}
  .readout .cell .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:#56b6ff;}
  .readout .cell.ok .v{color:#56d6a8;}.readout .cell.hi .v{color:#ffd166;}
  .card{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:16px 18px;}
  .card .ttl{font-size:13px;font-weight:800;color:#ffd166;margin-bottom:9px;}
  .card .eq{font-size:16px;line-height:1.8;color:#e8eef7;font-family:"Cambria Math","Times New Roman",Georgia,serif;}
  .card .eq .hl{color:#ffd166;font-weight:700;}
  .card .nt{font-size:13.5px;color:#9aa6bd;line-height:1.8;}.card .nt b{color:#cdd6e8;}
  footer{color:#5a6680;font-size:12px;text-align:center;padding:22px 0 36px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>📉 梯度下降 · 怎么找最低点</h1><a class="back" href="index.html">← 返回</a></div>
  <div class="badge">🎯 应用场景：机器学习训练模型的核心 · 用到 导数（切线斜率）</div>
  <div class="chips" id="chips"></div>
  <div class="work">
    <div id="stage"><canvas id="cv" width="900" height="560"></canvas></div>
    <div class="controls">
      <div><div class="ch">参数调节</div><div id="params"></div></div>
      <button class="btn" id="bPlay">▶ 一步步往下滚</button>
      <div class="hint" id="hint"></div>
    </div>
  </div>
  <div class="info">
    <div class="readout">
      <div class="cell"><div class="k">当前位置 x</div><div class="v" id="rx">—</div></div>
      <div class="cell hi"><div class="k">当前高度（损失）</div><div class="v" id="ry">—</div></div>
      <div class="cell ok"><div class="k">梯度（切线斜率）</div><div class="v" id="rg">—</div></div>
    </div>
    <div class="card"><div class="ttl">更新规则</div><div class="eq" id="eq"></div></div>
    <div class="card"><div class="ttl">怎么理解</div><div class="nt" id="note"></div></div>
  </div>
  <footer>小球沿切线方向往低处走：x ← x − 学习率 × 斜率 · 这就是 AI「学习」的本质 · 纯前端单文件教学</footer>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
var W=900,H=560,Vw={xmin:-4,xmax:4,ymin:-1,ymax:6};
function fit(){var st=document.getElementById("stage");var cw=st.clientWidth||900;W=cw;H=Math.round(cw*0.62);if(H<320)H=320;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
function PX(x){var p=30;return p+(x-Vw.xmin)/(Vw.xmax-Vw.xmin)*(W-2*p);}
function PY(y){var p=22;return p+(Vw.ymax-y)/(Vw.ymax-Vw.ymin)*(H-2*p);}
var idx=0,P={};
var CONCEPTS=[
  {id:"bowl",name:"碗形 (单一最低点)",f:function(x){return 0.4*x*x;},df:function(x){return 0.8*x;},view:[-4,4,-0.5,6]},
  {id:"wavy",name:"双谷 (有局部最优陷阱)",f:function(x){return 0.12*x*x*x*x-0.7*x*x+0.2*x+1.6;},df:function(x){return 0.48*x*x*x-1.4*x+0.2;},view:[-3.2,3.2,-0.5,4]}
];
function grid(){ctx.strokeStyle="rgba(120,140,180,.09)";ctx.lineWidth=1;ctx.beginPath();
  for(var x=Math.ceil(Vw.xmin);x<=Vw.xmax;x++){ctx.moveTo(PX(x),0);ctx.lineTo(PX(x),H);}
  for(var y=Math.ceil(Vw.ymin);y<=Vw.ymax;y++){ctx.moveTo(0,PY(y));ctx.lineTo(W,PY(y));}ctx.stroke();
  ctx.strokeStyle="rgba(150,170,210,.35)";ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(0,PY(0));ctx.lineTo(W,PY(0));ctx.moveTo(PX(0),0);ctx.lineTo(PX(0),H);ctx.stroke();}
function plot(f,col,w){ctx.strokeStyle=col;ctx.lineWidth=w||2.8;ctx.beginPath();var st=false;
  for(var px=30;px<=W-30;px+=2){var x=Vw.xmin+(px-30)/(W-60)*(Vw.xmax-Vw.xmin),y=f(x),py=PY(y);if(py<-600||py>H+600){st=false;continue;}if(!st){ctx.moveTo(px,py);st=true;}else ctx.lineTo(px,py);}ctx.stroke();}
function buildChips(){var box=document.getElementById("chips");box.innerHTML="";
  CONCEPTS.forEach(function(c,i){var el=document.createElement("div");el.className="chip"+(i===idx?" on":"");el.textContent=c.name;el.onclick=function(){idx=i;location.hash=c.id;load();};box.appendChild(el);});}
function buildParams(){var box=document.getElementById("params");box.innerHTML="";P={};var c=CONCEPTS[idx];
  var defs=[{k:"x0",label:"起点 x₀",min:c.view[0]+0.2,max:c.view[1]-0.2,step:0.1,def:c.view[1]-0.6},{k:"lr",label:"学习率（步长）",min:0.05,max:1.2,step:0.05,def:0.3},{k:"steps",label:"走几步",min:0,max:30,step:1,def:8}];
  defs.forEach(function(pp){P[pp.k]=pp.def;var w=document.createElement("div");w.className="slider";
    var d=pp.k==="steps"?pp.def.toFixed(0):pp.def.toFixed(2);
    w.innerHTML='<div class="sl-top"><span class="nm">'+pp.label+'</span><span class="val" id="v_'+pp.k+'">'+d+'</span></div><input type="range" id="r_'+pp.k+'" min="'+pp.min+'" max="'+pp.max+'" step="'+pp.step+'" value="'+pp.def+'">';
    box.appendChild(w);var inp=w.querySelector("input");
    inp.oninput=function(){P[pp.k]=parseFloat(inp.value);document.getElementById("v_"+pp.k).textContent=pp.k==="steps"?P[pp.k].toFixed(0):P[pp.k].toFixed(2);draw();};});}
function trajectory(){var c=CONCEPTS[idx],xs=[P.x0];var x=P.x0;
  for(var i=0;i<P.steps;i++){x=x-P.lr*c.df(x);if(!isFinite(x)||Math.abs(x)>50){xs.push(x>0?50:-50);break;}xs.push(x);}return xs;}
function draw(){ctx.clearRect(0,0,W,H);var c=CONCEPTS[idx];Vw.xmin=c.view[0];Vw.xmax=c.view[1];Vw.ymin=c.view[2];Vw.ymax=c.view[3];grid();
  plot(c.f,"#56b6ff",2.8);
  var xs=trajectory();
  // 轨迹
  for(var i=0;i<xs.length;i++){var x=xs[i],y=c.f(x);
    if(i>0){var px0=xs[i-1];ctx.strokeStyle="rgba(255,209,102,.6)";ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(PX(px0),PY(c.f(px0)));ctx.lineTo(PX(x),PY(y));ctx.stroke();}
    ctx.fillStyle=i===xs.length-1?"#56d6a8":"rgba(255,209,102,.7)";ctx.beginPath();ctx.arc(PX(x),PY(y),i===xs.length-1?7:4,0,2*Math.PI);ctx.fill();}
  // 当前点切线
  var cx=xs[xs.length-1],cy=c.f(cx),k=c.df(cx);
  var y1=k*(Vw.xmin-cx)+cy,y2=k*(Vw.xmax-cx)+cy;
  ctx.strokeStyle="rgba(86,214,168,.7)";ctx.lineWidth=2;ctx.setLineDash([6,4]);ctx.beginPath();ctx.moveTo(PX(Vw.xmin),PY(y1));ctx.lineTo(PX(Vw.xmax),PY(y2));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle="#8090a8";ctx.font="12px system-ui";ctx.textAlign="left";ctx.textBaseline="top";ctx.fillText("蓝=损失曲线  黄=每步位置  绿=当前(沿切线下坡)",PX(Vw.xmin)+4,8);
  document.getElementById("rx").textContent=cx.toFixed(3);
  document.getElementById("ry").textContent=cy.toFixed(3);
  document.getElementById("rg").textContent=k.toFixed(3);
  document.getElementById("eq").innerHTML='x ← x − <span class="hl">学习率</span> × f′(x)　（沿切线斜率的<b>反方向</b>走一步）';
  document.getElementById("note").innerHTML='想找函数的<b>最低点</b>（机器学习里就是「损失最小」）。<br>办法：在当前点求<b>切线斜率 f′(x)</b>（导数页），往斜率的<b>反方向</b>挪一小步，就是往下坡走。重复，就滚到谷底。<br><b>学习率太大</b>会在谷两边反复横跳甚至冲飞；<b>太小</b>则走得很慢。换「双谷」会发现：起点不同，可能掉进<b>局部最优</b>出不来。';
  document.getElementById("hint").textContent="把学习率拖到 1.0 以上看「冲飞」；用双谷、从右边起步，看它卡在右谷出不来。";}
function load(){buildChips();buildParams();draw();}
var anim=null;
function play(){if(anim)cancelAnimationFrame(anim);var n=0,target=P.steps;P.steps=0;
  (function step(){P.steps=n;document.getElementById("v_steps").textContent=n;document.getElementById("r_steps").value=n;draw();n++;if(n<=target)anim=setTimeout(function(){requestAnimationFrame(step);},220);else anim=null;})();}
document.getElementById("bPlay").onclick=play;
window.addEventListener("resize",function(){fit();draw();});
(function(){var hs=(location.hash||"").replace("#","");for(var i=0;i<CONCEPTS.length;i++)if(CONCEPTS[i].id===hs)idx=i;})();
fit();load();
</script>
</body>
</html>
