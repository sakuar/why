<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骰子投掷器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #16213e;
    --accent: #e94560;
    --accent2: #f5a623;
    --accent3: #0f3460;
    --text: #e8e8f0;
    --text-muted: #8888aa;
    --border: #2a2a4a;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
    --radius: 16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 16px;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    z-index: 100;
    transition: color 0.2s;
    background: rgba(15,15,26,0.8);
    padding: 4px 8px;
    border-radius: 6px;
  }
  .back-link:hover { color: var(--text); }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding-top: 48px;
  }

  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(135deg, #e94560, #f5a623);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }
  .header p {
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 6px;
  }

  .config-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }

  .config-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .config-row:last-child { margin-bottom: 0; }

  .config-label {
    font-size: 13px;
    color: var(--text-muted);
    width: 60px;
    flex-shrink: 0;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .qty-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .die-type-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .sel-btn {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sel-btn:hover {
    border-color: var(--accent);
    color: var(--text);
    transform: translateY(-1px);
  }
  .sel-btn.active {
    border-color: var(--accent);
    background: linear-gradient(135deg, #e9456022, #f5a62322);
    color: var(--accent2);
    box-shadow: 0 0 12px rgba(233,69,96,0.3);
  }

  .die-type-btn {
    width: auto;
    padding: 0 14px;
    font-size: 12px;
  }

  .roll-btn {
    width: 100%;
    height: 60px;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, #e94560, #c0392b);
    color: white;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(233,69,96,0.4);
    position: relative;
    overflow: hidden;
  }
  .roll-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    transition: left 0.5s;
  }
  .roll-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(233,69,96,0.5);
  }
  .roll-btn:hover::before { left: 100%; }
  .roll-btn:active { transform: translateY(0); }
  .roll-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .dice-stage {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    min-height: 160px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
  }

  .dice-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 16px;
  }

  .die-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .die-canvas-wrap {
    position: relative;
  }

  @keyframes rollAnim {
    0%   { transform: rotate(0deg) scale(1); }
    20%  { transform: rotate(-15deg) scale(0.9); }
    40%  { transform: rotate(20deg) scale(1.1); }
    60%  { transform: rotate(-10deg) scale(0.95); }
    80%  { transform: rotate(8deg) scale(1.05); }
    100% { transform: rotate(0deg) scale(1); }
  }
  @keyframes bounceIn {
    0%   { transform: scale(0.5); opacity: 0; }
    60%  { transform: scale(1.1); opacity: 1; }
    80%  { transform: scale(0.95); }
    100% { transform: scale(1); }
  }

  .die-canvas-wrap.rolling canvas {
    animation: rollAnim 0.6s ease-in-out;
  }
  .die-canvas-wrap.bounce-in canvas {
    animation: bounceIn 0.4s ease-out forwards;
  }

  .die-value-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
  }

  .result-summary {
    text-align: center;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    width: 100%;
  }
  .result-total {
    font-size: 2.4rem;
    font-weight: 900;
    background: linear-gradient(135deg, #f5a623, #e94560);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
  }
  .result-detail {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
    letter-spacing: 0.5px;
  }
  .result-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .empty-hint {
    color: var(--text-muted);
    font-size: 14px;
    text-align: center;
  }
  .empty-hint .dice-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.3;
  }

  .history-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .history-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    letter-spacing: 1px;
  }
  .clear-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .clear-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .history-list {
    list-style: none;
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    animation: fadeSlide 0.3s ease-out;
  }
  .history-item:last-child { border-bottom: none; }
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .history-desc { color: var(--text-muted); }
  .history-vals { color: var(--text); font-weight: 500; }
  .history-sum {
    font-weight: 800;
    color: var(--accent2);
    min-width: 40px;
    text-align: right;
  }

  .empty-history {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 12px 0;
  }

  canvas { display: block; }

  @media (max-width: 400px) {
    .sel-btn { width: 36px; height: 36px; font-size: 12px; }
    .die-type-btn { padding: 0 10px; }
    .header h1 { font-size: 1.6rem; }
    .result-total { font-size: 2rem; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="app">
  <div class="header">
    <h1>骰子投掷器</h1>
    <p>桌游 &amp; TRPG 专用 · 支持多骰同投</p>
  </div>

  <div class="config-panel">
    <div class="config-row">
      <span class="config-label">骰子数</span>
      <div class="qty-selector" id="qty-selector"></div>
    </div>
    <div class="config-row">
      <span class="config-label">面数</span>
      <div class="die-type-selector" id="type-selector"></div>
    </div>
  </div>

  <button class="roll-btn" id="roll-btn">掷 骰 子</button>

  <div class="dice-stage" id="dice-stage">
    <div class="empty-hint" id="empty-hint">
      <div class="dice-icon">🎲</div>
      <div>选择骰子，点击投掷</div>
    </div>
    <div class="dice-grid" id="dice-grid" style="display:none"></div>
    <div class="result-summary" id="result-summary" style="display:none">
      <div class="result-label">合计</div>
      <div class="result-total" id="result-total">0</div>
      <div class="result-detail" id="result-detail"></div>
    </div>
  </div>

  <div class="history-panel">
    <div class="history-header">
      <span class="history-title">投掷记录</span>
      <button class="clear-btn" id="clear-btn">清空</button>
    </div>
    <ul class="history-list" id="history-list">
      <li class="empty-history" id="empty-history">暂无记录</li>
    </ul>
  </div>
</div>

<script>
(function() {
  "use strict";

  /* ===== 常量 ===== */
  var DIE_TYPES = [4, 6, 8, 20];
  var QTY_OPTIONS = [1, 2, 3, 4, 5, 6];
  var STORAGE_KEY = "dice_history_v1";
  var CANVAS_SIZE = 72;

  /* ===== 状态 ===== */
  var selectedQty = 1;
  var selectedType = 6;
  var history = [];
  var isRolling = false;

  /* ===== DOM refs ===== */
  var qtySelector = document.getElementById("qty-selector");
  var typeSelector = document.getElementById("type-selector");
  var rollBtn = document.getElementById("roll-btn");
  var diceGrid = document.getElementById("dice-grid");
  var emptyHint = document.getElementById("empty-hint");
  var resultSummary = document.getElementById("result-summary");
  var resultTotal = document.getElementById("result-total");
  var resultDetail = document.getElementById("result-detail");
  var historyList = document.getElementById("history-list");
  var emptyHistory = document.getElementById("empty-history");
  var clearBtn = document.getElementById("clear-btn");

  /* ===== 颜色映射 ===== */
  var DIE_COLORS = {
    4:  { face: "#1a3a5c", stroke: "#4a9eff", dot: "#a8d8ff", text: "#e8f4ff" },
    6:  { face: "#2d1b4e", stroke: "#9b59b6", dot: "#dda0dd", text: "#f0e0ff" },
    8:  { face: "#1a4a2e", stroke: "#27ae60", dot: "#7dcea0", text: "#d5f5e3" },
    20: { face: "#4a1a1a", stroke: "#e94560", dot: "#f1948a", text: "#fde8e8" }
  };

  /* ===== 绘制函数 ===== */
  function drawD6(ctx, val, colors, size) {
    var s = size;
    var pad = 6;
    var r = 12;
    ctx.clearRect(0, 0, s, s);

    // 阴影
    ctx.shadowColor = colors.stroke + "66";
    ctx.shadowBlur = 10;

    // 背景
    var grad = ctx.createLinearGradient(pad, pad, s - pad, s - pad);
    grad.addColorStop(0, colors.face);
    grad.addColorStop(1, shadeColor(colors.face, -20));
    ctx.beginPath();
    roundRect(ctx, pad, pad, s - pad*2, s - pad*2, r);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.shadowBlur = 0;

    // 边框
    ctx.strokeStyle = colors.stroke;
    ctx.lineWidth = 2;
    ctx.stroke();

    // 高光
    var hl = ctx.createLinearGradient(pad, pad, s/2, s/2);
    hl.addColorStop(0, "rgba(255,255,255,0.15)");
    hl.addColorStop(1, "rgba(255,255,255,0)");
    ctx.beginPath();
    roundRect(ctx, pad, pad, s - pad*2, s - pad*2, r);
    ctx.fillStyle = hl;
    ctx.fill();

    // 点
    drawD6Dots(ctx, val, colors, s);
  }

  function drawD6Dots(ctx, val, colors, s) {
    var cx = s / 2;
    var cy = s / 2;
    var off = s * 0.27;
    var r = s * 0.08;
    var positions = {
      1: [[cx, cy]],
      2: [[cx - off, cy - off], [cx + off, cy + off]],
      3: [[cx - off, cy - off], [cx, cy], [cx + off, cy + off]],
      4: [[cx - off, cy - off], [cx + off, cy - off], [cx - off, cy + off], [cx + off, cy + off]],
      5: [[cx - off, cy - off], [cx + off, cy - off], [cx, cy], [cx - off, cy + off], [cx + off, cy + off]],
      6: [[cx - off, cy - off], [cx + off, cy - off], [cx - off, cy], [cx + off, cy], [cx - off, cy + off], [cx + off, cy + off]]
    };
    var pts = positions[val] || positions[1];
    ctx.fillStyle = colors.dot;
    ctx.shadowColor = colors.dot;
    ctx.shadowBlur = 4;
    for (var i = 0; i < pts.length; i++) {
      ctx.beginPath();
      ctx.arc(pts[i][0], pts[i][1], r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
  }

  function drawPolygonDie(ctx, sides, val, colors, size) {
    var s = size;
    ctx.clearRect(0, 0, s, s);
    var cx = s / 2;
    var cy = s / 2;
    var radius = s * 0.42;

    // 阴影
    ctx.shadowColor = colors.stroke + "88";
    ctx.shadowBlur = 12;

    // 面
    var grad = ctx.createRadialGradient(cx - radius*0.2, cy - radius*0.2, 0, cx, cy, radius);
    grad.addColorStop(0, shadeColor(colors.face, 20));
    grad.addColorStop(1, colors.face);
    ctx.beginPath();
    drawPolygon(ctx, cx, cy, radius, sides);
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.shadowBlur = 0;

    // 边框
    ctx.strokeStyle = colors.stroke;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // 高光（内层小多边形）
    ctx.beginPath();
    drawPolygon(ctx, cx - radius*0.05, cy - radius*0.1, radius * 0.5, sides);
    ctx.strokeStyle = "rgba(255,255,255,0.12)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // 数字
    ctx.shadowColor = colors.text;
    ctx.shadowBlur = 6;
    ctx.fillStyle = colors.text;
    ctx.font = "bold " + Math.round(s * 0.28) + "px -apple-system, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(String(val), cx, cy + 1);
    ctx.shadowBlur = 0;
  }

  function drawPolygon(ctx, cx, cy, r, n) {
    var angle = -Math.PI / 2;
    var step = (Math.PI * 2) / n;
    ctx.moveTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    for (var i = 1; i < n; i++) {
      angle += step;
      ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    }
    ctx.closePath();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
  }

  function shadeColor(hex, amount) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    r = Math.max(0, Math.min(255, r + amount));
    g = Math.max(0, Math.min(255, g + amount));
    b = Math.max(0, Math.min(255, b + amount));
    return "#" + [r, g, b].map(function(v) {
      return v.toString(16).padStart(2, "0");
    }).join("");
  }

  function drawDie(canvas, sides, val) {
    var ctx = canvas.getContext("2d");
    var colors = DIE_COLORS[sides] || DIE_COLORS[6];
    if (sides === 6) {
      drawD6(ctx, val, colors, CANVAS_SIZE);
    } else {
      drawPolygonDie(ctx, sides, val, colors, CANVAS_SIZE);
    }
  }

  function randomDie(sides) {
    return Math.floor(Math.random() * sides) + 1;
  }

  /* ===== 构建选择器 ===== */
  function buildSelectors() {
    QTY_OPTIONS.forEach(function(n) {
      var btn = document.createElement("button");
      btn.className = "sel-btn" + (n === selectedQty ? " active" : "");
      btn.textContent = n;
      btn.setAttribute("data-qty", n);
      btn.addEventListener("click", function() {
        selectedQty = n;
        document.querySelectorAll("#qty-selector .sel-btn").forEach(function(b) {
          b.classList.toggle("active", parseInt(b.getAttribute("data-qty")) === selectedQty);
        });
        savePrefs();
      });
      qtySelector.appendChild(btn);
    });

    DIE_TYPES.forEach(function(d) {
      var btn = document.createElement("button");
      btn.className = "sel-btn die-type-btn" + (d === selectedType ? " active" : "");
      btn.textContent = "d" + d;
      btn.setAttribute("data-type", d);
      btn.addEventListener("click", function() {
        selectedType = d;
        document.querySelectorAll("#type-selector .sel-btn").forEach(function(b) {
          b.classList.toggle("active", parseInt(b.getAttribute("data-type")) === selectedType);
        });
        savePrefs();
      });
      typeSelector.appendChild(btn);
    });
  }

  /* ===== 掷骰逻辑 ===== */
  function roll() {
    if (isRolling) return;
    isRolling = true;
    rollBtn.disabled = true;

    var qty = selectedQty;
    var sides = selectedType;
    var values = [];
    for (var i = 0; i < qty; i++) {
      values.push(randomDie(sides));
    }

    emptyHint.style.display = "none";
    diceGrid.style.display = "flex";
    resultSummary.style.display = "block";

    // 清空骰子区
    diceGrid.innerHTML = "";

    // 创建画布
    var canvases = [];
    for (var j = 0; j < qty; j++) {
      var wrap = document.createElement("div");
      wrap.className = "die-wrap";
      var cwrap = document.createElement("div");
      cwrap.className = "die-canvas-wrap rolling";
      var canvas = document.createElement("canvas");
      canvas.width = CANVAS_SIZE;
      canvas.height = CANVAS_SIZE;
      canvas.style.width = CANVAS_SIZE + "px";
      canvas.style.height = CANVAS_SIZE + "px";
      cwrap.appendChild(canvas);
      var lbl = document.createElement("div");
      lbl.className = "die-value-label";
      lbl.textContent = "d" + sides;
      wrap.appendChild(cwrap);
      wrap.appendChild(lbl);
      diceGrid.appendChild(wrap);
      canvases.push({ canvas: canvas, cwrap: cwrap });
    }

    // 滚动动画期间随机显示数字
    var frames = 0;
    var totalFrames = 18;
    var interval = setInterval(function() {
      frames++;
      for (var k = 0; k < canvases.length; k++) {
        var rnd = randomDie(sides);
        drawDie(canvases[k].canvas, sides, rnd);
      }
      if (frames >= totalFrames) {
        clearInterval(interval);
        // 显示最终值
        for (var m = 0; m < canvases.length; m++) {
          canvases[m].cwrap.classList.remove("rolling");
          canvases[m].cwrap.classList.add("bounce-in");
          drawDie(canvases[m].canvas, sides, values[m]);
        }
        // 显示结果
        var sum = values.reduce(function(a, b) { return a + b; }, 0);
        resultTotal.textContent = sum;
        var detailStr = qty + "d" + sides + " → [" + values.join(", ") + "]";
        resultDetail.textContent = detailStr;
        // 加入历史
        addHistory(qty, sides, values, sum);
        isRolling = false;
        rollBtn.disabled = false;
      }
    }, 33);
  }

  /* ===== 历史记录 ===== */
  function addHistory(qty, sides, values, sum) {
    var entry = {
      qty: qty,
      sides: sides,
      values: values,
      sum: sum,
      time: Date.now()
    };
    history.unshift(entry);
    if (history.length > 30) history.length = 30;
    saveHistory();
    renderHistory();
  }

  function renderHistory() {
    historyList.innerHTML = "";
    if (history.length === 0) {
      var li = document.createElement("li");
      li.className = "empty-history";
      li.id = "empty-history";
      li.textContent = "暂无记录";
      historyList.appendChild(li);
      return;
    }
    history.forEach(function(entry) {
      var li = document.createElement("li");
      li.className = "history-item";
      var desc = document.createElement("span");
      desc.className = "history-desc";
      desc.textContent = entry.qty + "d" + entry.sides;
      var vals = document.createElement("span");
      vals.className = "history-vals";
      vals.textContent = "[" + entry.values.join(", ") + "]";
      var sumEl = document.createElement("span");
      sumEl.className = "history-sum";
      sumEl.textContent = entry.sum;
      li.appendChild(desc);
      li.appendChild(vals);
      li.appendChild(sumEl);
      historyList.appendChild(li);
    });
  }

  /* ===== localStorage ===== */
  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch(e) {}
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) history = parsed;
      }
    } catch(e) {}
  }

  function savePrefs() {
    try {
      localStorage.setItem("dice_prefs_v1", JSON.stringify({ qty: selectedQty, type: selectedType }));
    } catch(e) {}
  }

  function loadPrefs() {
    try {
      var raw = localStorage.getItem("dice_prefs_v1");
      if (raw) {
        var p = JSON.parse(raw);
        if (p.qty && QTY_OPTIONS.indexOf(p.qty) !== -1) selectedQty = p.qty;
        if (p.type && DIE_TYPES.indexOf(p.type) !== -1) selectedType = p.type;
      }
    } catch(e) {}
  }

  /* ===== 事件绑定 ===== */
  function bindEvents() {
    rollBtn.addEventListener("click", roll);
    clearBtn.addEventListener("click", function() {
      history = [];
      saveHistory();
      renderHistory();
    });
    document.addEventListener("keydown", function(e) {
      if (e.code === "Space" || e.key === "Enter") {
        var tag = document.activeElement && document.activeElement.tagName;
        if (tag !== "BUTTON" && tag !== "INPUT") {
          e.preventDefault();
          roll();
        }
      }
    });
  }

  /* ===== 初始化（所有声明之后） ===== */
  loadPrefs();
  loadHistory();
  buildSelectors();
  bindEvents();
  renderHistory();

})();
</script>
</body>
</html>
