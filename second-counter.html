<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你活了多少秒</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --bg2: #111827;
    --card: #1a2236;
    --card2: #1e2a42;
    --accent: #6c63ff;
    --accent2: #f59e0b;
    --accent3: #10b981;
    --accent4: #ef4444;
    --accent5: #3b82f6;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --border: rgba(108,99,255,0.2);
    --glow: rgba(108,99,255,0.15);
  }

  html { font-size: 16px; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    z-index: 100;
    color: var(--text2);
    text-decoration: none;
    font-size: 13px;
    opacity: 0.7;
    transition: opacity 0.2s;
    background: rgba(0,0,0,0.3);
    padding: 4px 10px;
    border-radius: 20px;
    backdrop-filter: blur(6px);
  }
  .back-link:hover { opacity: 1; color: var(--text); }

  /* Animated background */
  .bg-anim {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    animation: orbFloat linear infinite;
    opacity: 0.12;
  }
  .bg-orb:nth-child(1) { width: 500px; height: 500px; background: #6c63ff; top: -200px; left: -150px; animation-duration: 20s; }
  .bg-orb:nth-child(2) { width: 400px; height: 400px; background: #f59e0b; bottom: -150px; right: -100px; animation-duration: 25s; animation-direction: reverse; }
  .bg-orb:nth-child(3) { width: 300px; height: 300px; background: #10b981; top: 50%; left: 50%; animation-duration: 18s; }

  @keyframes orbFloat {
    0%   { transform: translate(0,0) scale(1); }
    33%  { transform: translate(30px,-40px) scale(1.05); }
    66%  { transform: translate(-20px,30px) scale(0.95); }
    100% { transform: translate(0,0) scale(1); }
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 60px 16px 40px;
  }

  .hero-title {
    text-align: center;
    margin-bottom: 8px;
  }
  .hero-title h1 {
    font-size: clamp(1.6rem, 5vw, 2.6rem);
    font-weight: 700;
    background: linear-gradient(135deg, #a78bfa, #6c63ff, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }
  .hero-title p {
    color: var(--text2);
    font-size: 14px;
    margin-top: 6px;
  }

  /* Input section */
  .input-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    margin: 28px 0 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    box-shadow: 0 4px 30px var(--glow);
  }
  .input-section label {
    font-size: 14px;
    color: var(--text2);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .input-section input[type="datetime-local"] {
    flex: 1;
    min-width: 200px;
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    color: var(--text);
    padding: 10px 14px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }
  .input-section input[type="datetime-local"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,99,255,0.2);
  }
  .input-section input[type="datetime-local"]::-webkit-calendar-picker-indicator {
    filter: invert(1) opacity(0.6);
    cursor: pointer;
  }
  .btn-start {
    background: linear-gradient(135deg, #6c63ff, #a78bfa);
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .btn-start:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(108,99,255,0.4); }
  .btn-start:active { transform: translateY(0); }

  /* Main display hidden until started */
  .display-area { display: none; }
  .display-area.active { display: block; }

  /* Big second counter */
  .mega-counter {
    text-align: center;
    margin-bottom: 28px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px 20px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 40px var(--glow);
  }
  .mega-counter::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(108,99,255,0.05), transparent 60%);
    pointer-events: none;
  }
  .mega-label {
    font-size: 13px;
    color: var(--text2);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .mega-number {
    font-size: clamp(2.8rem, 10vw, 6rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    line-height: 1;
    background: linear-gradient(135deg, #a78bfa, #6c63ff, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: megaPulse 1s ease-in-out infinite;
    word-break: break-all;
  }
  @keyframes megaPulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.9; transform: scale(1.01); }
  }
  .mega-unit {
    font-size: 14px;
    color: var(--text2);
    margin-top: 10px;
    letter-spacing: 1px;
  }

  /* Grid of stat cards */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px 16px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .stat-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
  .stat-card::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 0 0 18px 18px;
  }
  .stat-card.c1::after { background: linear-gradient(90deg, #6c63ff, #a78bfa); }
  .stat-card.c2::after { background: linear-gradient(90deg, #f59e0b, #fcd34d); }
  .stat-card.c3::after { background: linear-gradient(90deg, #10b981, #34d399); }
  .stat-card.c4::after { background: linear-gradient(90deg, #3b82f6, #60a5fa); }
  .stat-card.c5::after { background: linear-gradient(90deg, #ef4444, #f87171); }
  .stat-card.c6::after { background: linear-gradient(90deg, #8b5cf6, #c4b5fd); }

  .stat-icon {
    font-size: 22px;
    margin-bottom: 8px;
    display: block;
    animation: iconBeat 1.2s ease-in-out infinite;
  }
  .stat-card.c5 .stat-icon { animation-duration: 0.85s; }

  @keyframes iconBeat {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.15); }
  }

  .stat-number {
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    margin-bottom: 6px;
    word-break: break-all;
  }
  .stat-card.c1 .stat-number { color: #a78bfa; }
  .stat-card.c2 .stat-number { color: #fcd34d; }
  .stat-card.c3 .stat-number { color: #34d399; }
  .stat-card.c4 .stat-number { color: #60a5fa; }
  .stat-card.c5 .stat-number { color: #f87171; }
  .stat-card.c6 .stat-number { color: #c4b5fd; }

  .stat-label {
    font-size: 12px;
    color: var(--text2);
    letter-spacing: 0.5px;
  }

  /* Digit flip animation on change */
  .flip {
    animation: flipIn 0.25s ease-out;
  }
  @keyframes flipIn {
    0%   { transform: translateY(-8px); opacity: 0; }
    100% { transform: translateY(0);    opacity: 1; }
  }

  /* Progress / life bar */
  .life-bar-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px var(--glow);
  }
  .life-bar-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .life-bar-header span { font-size: 13px; color: var(--text2); }
  .life-bar-header strong { font-size: 14px; color: var(--text); }
  .life-bar-track {
    height: 10px;
    background: rgba(255,255,255,0.07);
    border-radius: 99px;
    overflow: hidden;
  }
  .life-bar-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #6c63ff, #f59e0b, #ef4444);
    transition: width 1s linear;
    position: relative;
  }
  .life-bar-fill::after {
    content: '';
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 6px;
    background: rgba(255,255,255,0.8);
    border-radius: 99px;
    box-shadow: 0 0 8px #fff;
    animation: barGlow 1s ease-in-out infinite;
  }
  @keyframes barGlow {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }
  .life-bar-hint {
    font-size: 12px;
    color: var(--text2);
    margin-top: 8px;
    text-align: right;
  }

  /* Fun fact */
  .fun-fact {
    background: linear-gradient(135deg, rgba(108,99,255,0.12), rgba(59,130,246,0.08));
    border: 1px solid rgba(108,99,255,0.25);
    border-radius: 16px;
    padding: 18px 20px;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.7;
    text-align: center;
  }
  .fun-fact strong { color: var(--text); }

  /* Heartbeat line */
  .heartbeat-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    margin: 16px 0 4px;
  }
  .hb-bar {
    width: 3px;
    border-radius: 99px;
    background: #ef4444;
    animation: hbAnim 1.2s ease-in-out infinite;
    opacity: 0.8;
  }
  @keyframes hbAnim {
    0%,100% { height: 4px; }
    50%      { height: 20px; }
  }

  footer {
    text-align: center;
    color: var(--text2);
    font-size: 12px;
    margin-top: 32px;
    opacity: 0.5;
  }

  @media (max-width: 480px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .mega-number { font-size: clamp(2rem, 12vw, 3.5rem); }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="bg-anim">
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
</div>

<div class="container">
  <div class="hero-title">
    <h1>你活了多少秒？</h1>
    <p>每一秒都是独一无二的礼物</p>
  </div>

  <div class="input-section">
    <label for="birthInput">出生日期</label>
    <input type="datetime-local" id="birthInput" />
    <button class="btn-start" id="btnStart">开始计算</button>
  </div>

  <div class="display-area" id="displayArea">

    <div class="mega-counter">
      <div class="mega-label">你已经活了</div>
      <div class="mega-number" id="megaSeconds">0</div>
      <div class="mega-unit">秒</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card c1">
        <span class="stat-icon">⏱</span>
        <div class="stat-number" id="statMinutes">0</div>
        <div class="stat-label">分钟</div>
      </div>
      <div class="stat-card c2">
        <span class="stat-icon">🕐</span>
        <div class="stat-number" id="statHours">0</div>
        <div class="stat-label">小时</div>
      </div>
      <div class="stat-card c3">
        <span class="stat-icon">📅</span>
        <div class="stat-number" id="statDays">0</div>
        <div class="stat-label">天</div>
      </div>
      <div class="stat-card c4">
        <span class="stat-icon">🌙</span>
        <div class="stat-number" id="statWeeks">0</div>
        <div class="stat-label">周</div>
      </div>
      <div class="stat-card c5">
        <span class="stat-icon">❤️</span>
        <div class="stat-number" id="statHeartbeat">0</div>
        <div class="stat-label">次心跳</div>
      </div>
      <div class="stat-card c6">
        <span class="stat-icon">🌬</span>
        <div class="stat-number" id="statBreath">0</div>
        <div class="stat-label">次呼吸</div>
      </div>
    </div>

    <div class="life-bar-section">
      <div class="life-bar-header">
        <span>生命进度（预期寿命 80 岁）</span>
        <strong id="lifePercent">0%</strong>
      </div>
      <div class="life-bar-track">
        <div class="life-bar-fill" id="lifeBarFill" style="width:0%"></div>
      </div>
      <div class="life-bar-hint" id="lifeBarHint">还剩约 &mdash; 天</div>
    </div>

    <div class="heartbeat-line" id="heartbeatLine"></div>

    <div class="fun-fact" id="funFact">
      正在计算中…
    </div>

  </div>

  <footer>数据仅供参考 · 心跳约 75次/分 · 呼吸约 16次/分</footer>
</div>

<script>
(function () {
  "use strict";

  /* ── 常量 ── */
  var HEARTBEAT_PER_SEC = 75 / 60;
  var BREATH_PER_SEC    = 16 / 60;
  var LIFE_EXPECTANCY_S = 80 * 365.25 * 24 * 3600;

  /* ── DOM refs ── */
  var birthInput    = document.getElementById("birthInput");
  var btnStart      = document.getElementById("btnStart");
  var displayArea   = document.getElementById("displayArea");
  var megaSeconds   = document.getElementById("megaSeconds");
  var statMinutes   = document.getElementById("statMinutes");
  var statHours     = document.getElementById("statHours");
  var statDays      = document.getElementById("statDays");
  var statWeeks     = document.getElementById("statWeeks");
  var statHeartbeat = document.getElementById("statHeartbeat");
  var statBreath    = document.getElementById("statBreath");
  var lifePercent   = document.getElementById("lifePercent");
  var lifeBarFill   = document.getElementById("lifeBarFill");
  var lifeBarHint   = document.getElementById("lifeBarHint");
  var heartbeatLine = document.getElementById("heartbeatLine");
  var funFact       = document.getElementById("funFact");

  /* ── State ── */
  var birthTime = null;
  var timerHandle = null;
  var lastSeconds = -1;

  /* ── Helpers ── */
  function fmt(n) {
    return Math.floor(n).toLocaleString("zh-CN");
  }

  function setFlip(el, val) {
    var str = fmt(val);
    if (el.textContent !== str) {
      el.textContent = str;
      el.classList.remove("flip");
      void el.offsetWidth;
      el.classList.add("flip");
    }
  }

  function buildHeartbeat() {
    heartbeatLine.innerHTML = "";
    var heights = [4, 4, 18, 6, 12, 4, 4, 4, 4, 4, 4, 4, 22, 8, 14, 4, 4, 4, 4, 4, 4, 4, 4];
    heights.forEach(function (h, i) {
      var bar = document.createElement("div");
      bar.className = "hb-bar";
      bar.style.height = h + "px";
      bar.style.animationDelay = (i * 0.05) + "s";
      heartbeatLine.appendChild(bar);
    });
  }

  function getFunFact(seconds) {
    var days   = seconds / 86400;
    var hours  = seconds / 3600;
    var hb     = Math.floor(seconds * HEARTBEAT_PER_SEC);
    if (days < 1) {
      return "你刚出生没多久，欢迎来到这个世界！每一秒都是新体验。";
    } else if (days < 365) {
      return "你已经活了 <strong>" + Math.floor(days) + " 天</strong>，心脏已经跳动了约 <strong>" + fmt(hb) + " 次</strong>。";
    } else if (days < 365 * 10) {
      return "你已度过 <strong>" + Math.floor(days / 365) + " 年零 " + Math.floor(days % 365) + " 天</strong>，心脏跳动超过 <strong>" + fmt(hb) + " 次</strong>。加油！";
    } else if (days < 365 * 30) {
      return "你已经历了 <strong>" + Math.floor(hours) + " 小时</strong>的人生，心跳累计 <strong>" + fmt(hb) + " 次</strong>，每一次都是奇迹。";
    } else if (days < 365 * 60) {
      return "资深地球人！心脏已为你跳动 <strong>" + fmt(hb) + " 次</strong>，见证了无数日落与日出。";
    } else {
      return "人生智者！<strong>" + fmt(Math.floor(seconds)) + " 秒</strong>的积累，造就了独一无二的你。";
    }
  }

  /* ── Core tick ── */
  function tick() {
    if (!birthTime) { return; }
    var now     = Date.now();
    var elapsed = (now - birthTime) / 1000;
    if (elapsed < 0) { elapsed = 0; }

    var secs    = Math.floor(elapsed);
    var minutes = elapsed / 60;
    var hours   = elapsed / 3600;
    var days    = elapsed / 86400;
    var weeks   = days / 7;
    var hb      = elapsed * HEARTBEAT_PER_SEC;
    var breath  = elapsed * BREATH_PER_SEC;

    /* big number - update every second */
    if (secs !== lastSeconds) {
      lastSeconds = secs;
      setFlip(megaSeconds, secs);
    }

    setFlip(statMinutes,   Math.floor(minutes));
    setFlip(statHours,     Math.floor(hours));
    setFlip(statDays,      Math.floor(days));
    setFlip(statWeeks,     Math.floor(weeks));
    setFlip(statHeartbeat, Math.floor(hb));
    setFlip(statBreath,    Math.floor(breath));

    /* life bar */
    var pct = Math.min(elapsed / LIFE_EXPECTANCY_S * 100, 100);
    var pctStr = pct.toFixed(4) + "%";
    lifePercent.textContent = pct.toFixed(2) + "%";
    lifeBarFill.style.width = pctStr;

    var remainDays = Math.max(0, Math.floor((LIFE_EXPECTANCY_S - elapsed) / 86400));
    lifeBarHint.innerHTML = "还剩约 <strong>" + remainDays.toLocaleString("zh-CN") + "</strong> 天（以 80 岁预期寿命估算）";

    /* fun fact */
    funFact.innerHTML = getFunFact(elapsed);
  }

  /* ── Start ── */
  function startCounter() {
    var val = birthInput.value;
    if (!val) {
      birthInput.focus();
      birthInput.style.borderColor = "#ef4444";
      setTimeout(function () { birthInput.style.borderColor = ""; }, 1200);
      return;
    }
    var parsed = new Date(val).getTime();
    if (isNaN(parsed)) {
      alert("请输入有效的出生日期");
      return;
    }
    if (parsed > Date.now()) {
      alert("出生日期不能是未来时间哦~");
      return;
    }

    birthTime = parsed;
    localStorage.setItem("sc_birthTime", String(birthTime));

    displayArea.classList.add("active");
    buildHeartbeat();

    if (timerHandle) { clearInterval(timerHandle); }
    tick();
    timerHandle = setInterval(tick, 200);

    displayArea.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  /* ── Event listeners ── */
  btnStart.addEventListener("click", startCounter);
  birthInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { startCounter(); }
  });

  /* ── Restore from localStorage ── */
  function init() {
    var saved = localStorage.getItem("sc_birthTime");
    if (saved) {
      var t = Number(saved);
      if (!isNaN(t) && t > 0) {
        birthTime = t;
        /* populate input */
        var d = new Date(t);
        var pad = function (n) { return String(n).padStart(2, "0"); };
        var local = d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
                    "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
        birthInput.value = local;

        displayArea.classList.add("active");
        buildHeartbeat();
        tick();
        timerHandle = setInterval(tick, 200);
      }
    }
  }

  /* ── Run ── */
  init();

}());
</script>
</body>
</html>
