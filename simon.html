<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>西蒙记忆</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e8eaf0;
    --text-muted: #7a7d8e;
    --accent: #6c63ff;
    --radius: 18px;
    --red: #ff4757;
    --yellow: #ffd32a;
    --green: #2ed573;
    --blue: #1e90ff;
    --red-lit: #ff8fa3;
    --yellow-lit: #ffe066;
    --green-lit: #7effa0;
    --blue-lit: #7ecfff;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 40px;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    z-index: 100;
    transition: color .2s;
  }
  .back-link:hover { color: var(--text); }

  header {
    margin-top: 56px;
    text-align: center;
  }
  header h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 700;
    letter-spacing: .04em;
    background: linear-gradient(135deg, #a78bfa, #6c63ff, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    margin-top: 6px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .score-row {
    display: flex;
    gap: 24px;
    margin-top: 24px;
    justify-content: center;
  }
  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 22px;
    text-align: center;
    min-width: 90px;
  }
  .score-card .label {
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .08em;
  }
  .score-card .value {
    font-size: 26px;
    font-weight: 700;
    margin-top: 2px;
    color: var(--text);
    transition: transform .15s;
  }
  .score-card .value.pop {
    transform: scale(1.3);
  }

  .status-bar {
    margin-top: 20px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #status {
    font-size: 15px;
    color: var(--text-muted);
    transition: color .3s;
  }
  #status.warn { color: #ff6b81; }
  #status.go { color: var(--green); }

  /* Simon board */
  .board-wrap {
    margin-top: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .board {
    position: relative;
    width: min(320px, 82vw);
    height: min(320px, 82vw);
  }

  .quad {
    position: absolute;
    width: calc(50% - 6px);
    height: calc(50% - 6px);
    border: none;
    cursor: pointer;
    transition: filter .08s, transform .08s;
    border-radius: 0;
    outline: none;
  }
  .quad:disabled { cursor: default; }

  /* corner radii per quadrant */
  .quad.red    { top: 0; left: 0;       border-radius: var(--radius) 4px 4px 4px; background: var(--red); }
  .quad.yellow { top: 0; right: 0;      border-radius: 4px var(--radius) 4px 4px; background: var(--yellow); }
  .quad.green  { bottom: 0; left: 0;    border-radius: 4px 4px 4px var(--radius); background: var(--green); }
  .quad.blue   { bottom: 0; right: 0;   border-radius: 4px 4px var(--radius) 4px; background: var(--blue); }

  .quad::after {
    content: '';
    position: absolute;
    inset: 0;
    background: #fff;
    opacity: 0;
    border-radius: inherit;
    transition: opacity .08s;
  }

  .quad.lit::after { opacity: .38; }
  .quad.lit { transform: scale(1.04); }

  /* center circle */
  .center {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 72px; height: 72px;
    background: var(--bg);
    border-radius: 50%;
    border: 3px solid var(--border);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .center-inner {
    width: 40px; height: 40px;
    background: var(--surface);
    border-radius: 50%;
    border: 2px solid var(--border);
  }

  /* start button */
  .btn-start {
    margin-top: 32px;
    padding: 12px 44px;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 100px;
    cursor: pointer;
    letter-spacing: .04em;
    transition: background .2s, transform .12s, box-shadow .2s;
    box-shadow: 0 4px 20px rgba(108,99,255,.4);
  }
  .btn-start:hover { background: #7c75ff; transform: translateY(-1px); box-shadow: 0 6px 24px rgba(108,99,255,.5); }
  .btn-start:active { transform: translateY(1px); }
  .btn-start:disabled { opacity: .45; cursor: default; transform: none; box-shadow: none; }

  .progress-wrap {
    margin-top: 22px;
    width: min(320px, 82vw);
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), #38bdf8);
    border-radius: 99px;
    transition: width .3s ease;
  }

  footer {
    margin-top: 40px;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.8;
  }

  @media (max-width: 400px) {
    .score-card { padding: 8px 14px; min-width: 70px; }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<header>
  <h1>西蒙记忆</h1>
  <p>跟随机器演示，按序复现颜色序列</p>
</header>

<div class="score-row">
  <div class="score-card">
    <div class="label">当前关卡</div>
    <div class="value" id="cur-level">0</div>
  </div>
  <div class="score-card">
    <div class="label">最高关卡</div>
    <div class="value" id="best-level">0</div>
  </div>
</div>

<div class="status-bar">
  <span id="status">按下开始，挑战你的记忆极限</span>
</div>

<div class="board-wrap">
  <div class="board" id="board">
    <button class="quad red"    id="btn-red"    aria-label="红色"></button>
    <button class="quad yellow" id="btn-yellow" aria-label="黄色"></button>
    <button class="quad green"  id="btn-green"  aria-label="绿色"></button>
    <button class="quad blue"   id="btn-blue"   aria-label="蓝色"></button>
    <div class="center"><div class="center-inner"></div></div>
  </div>
</div>

<div class="progress-wrap">
  <div id="progress-bar"></div>
</div>

<button class="btn-start" id="btn-start">开始游戏</button>

<footer>
  关卡越深，序列越长<br>错误即结束，最高记录本地保存
</footer>

<script>
(function () {
  "use strict";

  /* ── 常量 ── */
  var COLORS = ["red", "yellow", "green", "blue"];
  var FREQS  = { red: 220, yellow: 330, green: 440, blue: 550 };
  var LIT_DUR = 400;   // ms 每格亮灯时长
  var GAP_DUR = 150;   // ms 灭灯间隙
  var SPEED_FACTOR = 0.93; // 每关加速系数

  /* ── DOM 引用（全部在 HTML 中存在） ── */
  var elCurLevel   = document.getElementById("cur-level");
  var elBestLevel  = document.getElementById("best-level");
  var elStatus     = document.getElementById("status");
  var elStart      = document.getElementById("btn-start");
  var elProgress   = document.getElementById("progress-bar");
  var btnMap = {
    red:    document.getElementById("btn-red"),
    yellow: document.getElementById("btn-yellow"),
    green:  document.getElementById("btn-green"),
    blue:   document.getElementById("btn-blue")
  };

  /* ── 状态 ── */
  var sequence   = [];
  var playerIdx  = 0;
  var level      = 0;
  var bestLevel  = 0;
  var isPlaying  = false;
  var isDemo     = false;
  var audioCtx   = null;

  /* ── localStorage ── */
  function loadBest() {
    var v = localStorage.getItem("simon_best");
    bestLevel = v ? parseInt(v, 10) : 0;
    elBestLevel.textContent = bestLevel;
  }

  function saveBest() {
    localStorage.setItem("simon_best", String(bestLevel));
  }

  /* ── WebAudio ── */
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playTone(color, duration) {
    try {
      var ctx = getAudioCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = "sine";
      osc.frequency.setValueAtTime(FREQS[color], ctx.currentTime);
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.35, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000 - 0.02);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + duration / 1000);
    } catch (e) { /* 静默失败，不影响游戏 */ }
  }

  function playError() {
    try {
      var ctx = getAudioCtx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(120, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(60, ctx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.48);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.5);
    } catch (e) { /* 静默失败 */ }
  }

  /* ── 视觉反馈 ── */
  function lightUp(color, duration) {
    var btn = btnMap[color];
    btn.classList.add("lit");
    playTone(color, duration);
    return new Promise(function (resolve) {
      setTimeout(function () {
        btn.classList.remove("lit");
        resolve();
      }, duration);
    });
  }

  function setDisabled(disabled) {
    COLORS.forEach(function (c) {
      btnMap[c].disabled = disabled;
    });
  }

  function setStatus(msg, cls) {
    elStatus.className = cls || "";
    elStatus.textContent = msg;
  }

  function updateCurLevel(n) {
    elCurLevel.textContent = n;
    elCurLevel.classList.remove("pop");
    void elCurLevel.offsetWidth; // reflow
    elCurLevel.classList.add("pop");
    setTimeout(function () { elCurLevel.classList.remove("pop"); }, 200);
  }

  function updateBestLevel(n) {
    elBestLevel.textContent = n;
    elBestLevel.classList.remove("pop");
    void elBestLevel.offsetWidth;
    elBestLevel.classList.add("pop");
    setTimeout(function () { elBestLevel.classList.remove("pop"); }, 200);
  }

  function updateProgress(current, total) {
    var pct = total > 0 ? Math.round((current / total) * 100) : 0;
    elProgress.style.width = pct + "%";
  }

  /* ── 演示序列 ── */
  function calcDuration() {
    var base = LIT_DUR;
    for (var i = 0; i < level - 1; i++) { base *= SPEED_FACTOR; }
    return Math.max(base, 180);
  }

  function runDemo() {
    isDemo = true;
    setDisabled(true);
    setStatus("注意观察...", "");

    var dur = calcDuration();
    var i = 0;

    function next() {
      if (i >= sequence.length) {
        isDemo = false;
        setDisabled(false);
        setStatus("请按序复现！", "go");
        playerIdx = 0;
        updateProgress(0, sequence.length);
        return;
      }
      var color = sequence[i];
      i++;
      lightUp(color, dur).then(function () {
        setTimeout(next, GAP_DUR);
      });
    }

    setTimeout(next, 500);
  }

  /* ── 进入新关卡 ── */
  function nextLevel() {
    level++;
    var randomColor = COLORS[Math.floor(Math.random() * COLORS.length)];
    sequence.push(randomColor);
    updateCurLevel(level);
    if (level > bestLevel) {
      bestLevel = level;
      updateBestLevel(bestLevel);
      saveBest();
    }
    runDemo();
  }

  /* ── 玩家输入 ── */
  function onPlayerPress(color) {
    if (!isPlaying || isDemo) return;

    lightUp(color, 250);

    var expected = sequence[playerIdx];
    playerIdx++;

    if (color !== expected) {
      // 错误
      endGame(false);
      return;
    }

    updateProgress(playerIdx, sequence.length);

    if (playerIdx >= sequence.length) {
      // 本关全部正确
      setDisabled(true);
      setStatus("正确！进入第 " + (level + 1) + " 关", "go");
      setTimeout(nextLevel, 900);
    }
  }

  /* ── 结束游戏 ── */
  function endGame(win) {
    isPlaying = false;
    isDemo = false;
    setDisabled(true);
    playError();
    setStatus("失败！最终关卡：" + level + "　最高记录：" + bestLevel, "warn");
    elProgress.style.width = "0%";
    elStart.disabled = false;
    elStart.textContent = "再来一局";
    // 短暂闪烁所有按钮
    COLORS.forEach(function (c) { btnMap[c].classList.add("lit"); });
    setTimeout(function () {
      COLORS.forEach(function (c) { btnMap[c].classList.remove("lit"); });
    }, 500);
  }

  /* ── 开始游戏 ── */
  function startGame() {
    sequence = [];
    playerIdx = 0;
    level = 0;
    isPlaying = true;
    isDemo = false;
    elStart.disabled = true;
    elStart.textContent = "游戏中…";
    elProgress.style.width = "0%";
    updateCurLevel(0);
    setTimeout(nextLevel, 400);
  }

  /* ── 事件绑定 ── */
  COLORS.forEach(function (color) {
    btnMap[color].addEventListener("click", function () {
      onPlayerPress(color);
    });
    // 触摸优化
    btnMap[color].addEventListener("touchstart", function (e) {
      e.preventDefault();
      onPlayerPress(color);
    }, { passive: false });
  });

  elStart.addEventListener("click", startGame);

  /* ── 初始化（放在最后） ── */
  loadBest();
  setDisabled(true);

}());
</script>
</body>
</html>
