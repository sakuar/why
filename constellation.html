<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星座物语</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a1a;
    --card-bg: rgba(20, 20, 50, 0.85);
    --accent: #a78bfa;
    --accent2: #f472b6;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --border: rgba(167, 139, 250, 0.25);
    --glow: rgba(167, 139, 250, 0.15);
    --radius: 16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* 星空背景 */
  #starfield {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .back-link {
    position: fixed;
    top: 14px; left: 16px;
    z-index: 100;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .back-link:hover { opacity: 1; color: var(--accent); }

  .container {
    position: relative;
    z-index: 1;
    max-width: 960px;
    margin: 0 auto;
    padding: 60px 20px 40px;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }
  header h1 {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    text-shadow: none;
  }
  header p {
    color: var(--muted);
    margin-top: 10px;
    font-size: 15px;
    letter-spacing: 1px;
  }

  /* 星座选择网格 */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 12px;
    margin-bottom: 40px;
  }

  .sign-btn {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 6px 10px;
    cursor: pointer;
    text-align: center;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s, background 0.2s;
    color: var(--text);
    user-select: none;
    backdrop-filter: blur(8px);
  }
  .sign-btn:hover {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 8px 24px var(--glow);
  }
  .sign-btn.active {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(167,139,250,0.2), rgba(244,114,182,0.15));
    box-shadow: 0 0 20px var(--glow);
    transform: translateY(-3px);
  }
  .sign-btn .symbol {
    font-size: 28px;
    display: block;
    line-height: 1;
    margin-bottom: 6px;
  }
  .sign-btn .name {
    font-size: 13px;
    font-weight: 500;
  }

  /* 详情卡片 */
  #detail-area {
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .detail-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 32px;
    backdrop-filter: blur(12px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px var(--border);
  }

  .detail-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }
  .detail-symbol {
    font-size: 64px;
    line-height: 1;
    filter: drop-shadow(0 0 12px var(--accent));
  }
  .detail-title h2 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .detail-title .date-range {
    color: var(--muted);
    font-size: 14px;
    margin-top: 4px;
    letter-spacing: 0.5px;
  }
  .detail-title .element-badge {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .info-item {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .info-item .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 6px;
  }
  .info-item .value {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }

  .traits-section {
    margin-bottom: 24px;
  }
  .section-title {
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .trait-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .trait-tag {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px;
    background: rgba(167,139,250,0.12);
    border: 1px solid rgba(167,139,250,0.25);
    color: var(--accent);
    font-weight: 500;
    transition: background 0.2s;
  }
  .trait-tag:hover {
    background: rgba(167,139,250,0.22);
  }

  .lucky-section {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .lucky-item {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
  }
  .lucky-item .lucky-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .lucky-item .lucky-value {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .color-dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }

  .compatible-section { margin-bottom: 8px; }
  .compat-signs {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .compat-sign {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    background: rgba(244,114,182,0.1);
    border: 1px solid rgba(244,114,182,0.25);
    color: var(--accent2);
    font-weight: 500;
  }
  .compat-sign span:first-child { font-size: 18px; }

  .desc-section {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 14px;
    line-height: 1.8;
  }

  /* 今日运势 */
  .fortune-card {
    margin-top: 20px;
    background: linear-gradient(135deg, rgba(167,139,250,0.1), rgba(244,114,182,0.08));
    border: 1px solid rgba(167,139,250,0.2);
    border-radius: 12px;
    padding: 20px;
  }
  .fortune-card .section-title { margin-bottom: 10px; }
  .fortune-stars {
    font-size: 20px;
    margin-bottom: 8px;
  }
  .fortune-text {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.7;
  }

  /* 收藏按钮 */
  .fav-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 20px;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
  }
  .fav-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .fav-btn.fav-active { background: rgba(244,114,182,0.15); border-color: var(--accent2); color: var(--accent2); }

  .placeholder {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 15px;
  }
  .placeholder .big-icon { font-size: 48px; margin-bottom: 16px; }

  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .sign-btn { padding: 10px 4px 8px; }
    .sign-btn .symbol { font-size: 22px; }
    .sign-btn .name { font-size: 11px; }
    .detail-card { padding: 20px; }
    .detail-symbol { font-size: 48px; }
    .lucky-section { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .info-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
    .detail-header { gap: 14px; }
  }
</style>
</head>

  /* ============ 状态 ============ */
  var currentSign = null;
  var favorites = [];
  var detailKey = null;

  /* ============ 工具函数 ============ */
  function loadFavorites() {
    try {
      var raw = localStorage.getItem("constellation_favorites");
      favorites = raw ? JSON.parse(raw) : [];
    } catch (e) {
      favorites = [];
    }
  }

  function saveFavorites() {
    try {
      localStorage.setItem("constellation_favorites", JSON.stringify(favorites));
    } catch (e) {}
  }

  function isFavorite(id) {
    return favorites.indexOf(id) !== -1;
  }

  function toggleFavorite(id) {
    var idx = favorites.indexOf(id);
    if (idx === -1) {
      favorites.push(id);
    } else {
      favorites.splice(idx, 1);
    }
    saveFavorites();
  }

  function getDailyFortune(sign) {
    var today = new Date();
    var seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate() + sign.id.length;
    return sign.fortunes[seed % sign.fortunes.length];
  }

  function getFortuneStars(sign) {
    var today = new Date();
    var seed = today.getFullYear() * 100 + today.getDate() + sign.name.charCodeAt(0);
    var count = (seed % 3) + 3;
    var stars = "";
    for (var i = 0; i < 5; i++) {
      stars += i < count ? "★" : "☆";
    }
    return stars;
  }

  function getElementLabel(element) {
    return element;
  }

  /* ============ 渲染 ============ */
  function renderGrid() {
    var grid = document.getElementById("sign-grid");
    if (!grid) return;
    var html = "";
    for (var i = 0; i < SIGNS.length; i++) {
      var s = SIGNS[i];
      html += '<button class="sign-btn" data-id="' + s.id + '" aria-label="' + s.name + '">'
        + '<span class="symbol">' + s.symbol + '</span>'
        + '<span class="name">' + s.name + '</span>'
        + '</button>';
    }
    grid.innerHTML = html;

    var btns = grid.querySelectorAll(".sign-btn");
    for (var j = 0; j < btns.length; j++) {
      btns[j].addEventListener("click", function () {
        var id = this.getAttribute("data-id");
        selectSign(id);
      });
    }
  }

  function selectSign(id) {
    currentSign = null;
    for (var i = 0; i < SIGNS.length; i++) {
      if (SIGNS[i].id === id) { currentSign = SIGNS[i]; break; }
    }
    if (!currentSign) return;

    try { localStorage.setItem("constellation_last", id); } catch (e) {}

    var btns = document.querySelectorAll(".sign-btn");
    for (var j = 0; j < btns.length; j++) {
      btns[j].classList.toggle("active", btns[j].getAttribute("data-id") === id);
    }

    renderDetail(currentSign);
  }

  function renderDetail(sign) {
    var area = document.getElementById("detail-area");
    if (!area) return;

    var fav = isFavorite(sign.id);
    var fortune = getDailyFortune(sign);
    var stars = getFortuneStars(sign);

    var compatHTML = "";
    for (var i = 0; i < sign.compatible.length; i++) {
      compatHTML += '<span class="compat-sign"><span>' + sign.compatSymbols[i] + '</span><span>' + sign.compatible[i] + '</span></span>';
    }

    var traitHTML = "";
    for (var k = 0; k < sign.traits.length; k++) {
      traitHTML += '<span class="trait-tag">' + sign.traits[k] + '</span>';
    }

    var html = '<div class="detail-card" id="detail-card">'
      + '<div class="detail-header">'
      + '<div class="detail-symbol">' + sign.symbol + '</div>'
      + '<div class="detail-title">'
      + '<h2>' + sign.name + '</h2>'
      + '<div class="date-range">' + sign.dates + '</div>'
      + '<span class="element-badge" style="background:' + sign.elementColor + '22;color:' + sign.elementColor + ';border:1px solid ' + sign.elementColor + '44">' + sign.element + '</span>'
      + '</div>'
      + '</div>'

      + '<div class="info-grid">'
      + '<div class="info-item"><div class="label">守护星</div><div class="value">🪐 ' + sign.planet + '</div></div>'
      + '<div class="info-item"><div class="label">元素</div><div class="value">' + getElementLabel(sign.element) + '</div></div>'
      + '<div class="info-item"><div class="label">幸运日</div><div class="value">📅 ' + sign.luckyDay + '</div></div>'
      + '<div class="info-item"><div class="label">幸运数字</div><div class="value">🔢 ' + sign.luckyNumber + '</div></div>'
      + '</div>'

      + '<div class="lucky-section">'
      + '<div class="lucky-item"><div class="lucky-label">幸运色</div><div class="lucky-value"><span class="color-dot" style="background:' + sign.luckyColorHex + '"></span>' + sign.luckyColor + '</div></div>'
      + '<div class="lucky-item"><div class="lucky-label">幸运数</div><div class="lucky-value">' + sign.luckyNumber + '</div></div>'
      + '<div class="lucky-item"><div class="lucky-label">守护星</div><div class="lucky-value">' + sign.planet + '</div></div>'
      + '</div>'

      + '<div class="traits-section"><div class="section-title">性格特点</div><div class="trait-tags">' + traitHTML + '</div></div>'

      + '<div class="compatible-section"><div class="section-title">最配星座</div><div class="compat-signs">' + compatHTML + '</div></div>'

      + '<div class="desc-section">' + sign.desc + '</div>'

      + '<div class="fortune-card">'
      + '<div class="section-title">今日运势</div>'
      + '<div class="fortune-stars" style="color:#f6ad55">' + stars + '</div>'
      + '<div class="fortune-text">' + fortune + '</div>'
      + '</div>'

      + '<button class="fav-btn' + (fav ? ' fav-active' : '') + '" id="fav-btn" aria-label="收藏">'
      + (fav ? '♥ 已收藏' : '♡ 加入收藏')
      + '</button>'
      + '</div>';

    area.innerHTML = html;

    var favBtn = document.getElementById("fav-btn");
    if (favBtn) {
      detailKey = sign.id;
      favBtn.addEventListener("click", function () {
        toggleFavorite(detailKey);
        var isFav = isFavorite(detailKey);
        this.textContent = isFav ? "♥ 已收藏" : "♡ 加入收藏";
        this.classList.toggle("fav-active", isFav);
      });
    }
  }

  /* ============ 星空画布 ============ */
  function initStarfield() {
    var canvas = document.getElementById("starfield");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");

    var stars = [];
    var W = 0;
    var H = 0;
    var animFrame = null;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function createStars() {
      stars = [];
      var count = Math.floor((W * H) / 8000);
      for (var i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: Math.random() * 1.5 + 0.2,
          alpha: Math.random() * 0.8 + 0.2,
          speed: Math.random() * 0.004 + 0.001,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    var t = 0;
    function draw() {
      ctx.clearRect(0, 0, W, H);
      t += 0.015;
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        var a = s.alpha * (0.6 + 0.4 * Math.sin(t * s.speed * 80 + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(200, 200, 255, " + a + ")";
        ctx.fill();
      }
      animFrame = requestAnimationFrame(draw);
    }

    window.addEventListener("resize", function () {
      resize();
      createStars();
    });

    resize();
    createStars();
    draw();
  }

  /* ============ 初始化 ============ */
  function init() {
    loadFavorites();
    renderGrid();
    initStarfield();

    try {
      var last = localStorage.getItem("constellation_last");
      if (last) { selectSign(last); }
    } catch (e) {}
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
