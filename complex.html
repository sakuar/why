<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>复数 · 复平面 · 加法 · 乘法</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#070912;color:#e8eef7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  .wrap{width:100%;max-width:1240px;padding:0 18px;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px;}
  .top h1{font-size:18px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#ffd166,#56b6ff,#b98cff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .top .back{font-size:12px;color:#8090a8;text-decoration:none;border:1px solid #222840;border-radius:8px;padding:6px 11px;}
  .chips{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap;}
  .chip{flex:1;min-width:96px;display:flex;align-items:center;gap:7px;justify-content:center;font-size:13px;padding:11px 8px;border-radius:11px;background:#0e1322;border:1px solid #232c44;color:#aab6cc;cursor:pointer;transition:.14s;}
  .chip:hover{border-color:#3a445e;color:#e8eef7;}
  .chip.on{background:#6c63ff;border-color:#6c63ff;color:#fff;font-weight:700;}
  .work{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:stretch;}
  @media(max-width:780px){.work{grid-template-columns:1fr;}}
  #stage{position:relative;min-width:0;}
  canvas{width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 42%,#0e1426,#06070d 80%);border:1px solid #1c2236;border-radius:14px;touch-action:none;}
  .controls{background:#0e1322;border:1px solid #232c44;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;}
  .controls .ch{font-size:12px;color:#8090a8;font-weight:600;letter-spacing:1px;margin-bottom:12px;}
  .slider{margin-bottom:13px;}.slider:last-child{margin-bottom:0;}
  .slider .sl-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;}
  .slider .sl-top .nm{color:#cfd8ea;}.slider .sl-top .val{color:#56b6ff;font-weight:700;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#232c44;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;box-shadow:0 0 0 1px #6c63ff;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;}
  .hint{font-size:12px;color:#5a6680;line-height:1.6;border-top:1px solid #1a2138;padding-top:13px;}
  .info{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:780px){.info{grid-template-columns:1fr;}}
  .readout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;grid-column:1 / -1;}
  .readout .cell{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:14px 12px;text-align:center;}
  .readout .cell .k{font-size:11.5px;color:#8090a8;margin-bottom:6px;}
  .readout .cell .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:#56b6ff;}
  .readout .cell.ok .v{color:#56d6a8;}.readout .cell.hi .v{color:#ffd166;}
  .card{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:16px 18px;}
  .card .ttl{font-size:13px;font-weight:800;color:#ffd166;margin-bottom:9px;}
  .card .eq{font-size:17px;line-height:1.8;color:#e8eef7;font-family:"Cambria Math","Times New Roman",Georgia,serif;}
  .card .eq .hl{color:#ffd166;font-weight:700;}
  .card .nt{font-size:13.5px;color:#9aa6bd;line-height:1.8;}.card .nt b{color:#cdd6e8;}
  footer{color:#5a6680;font-size:12px;text-align:center;padding:22px 0 36px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>🔵 复数 · 复平面 · 加法 · 乘法</h1><a class="back" href="index.html">← 返回</a></div>
  <div class="chips" id="chips"></div>
  <div class="work">
    <div id="stage"><canvas id="cv" width="900" height="560"></canvas></div>
    <div class="controls">
      <div><div class="ch">参数调节（实部 / 虚部）</div><div id="params"></div></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
  <div class="info">
    <div class="readout">
      <div class="cell"><div class="k" id="k0">结果</div><div class="v" id="r0">—</div></div>
      <div class="cell hi"><div class="k" id="k1">模 |z|</div><div class="v" id="r1">—</div></div>
      <div class="cell ok"><div class="k" id="k2">辐角 θ</div><div class="v" id="r2">—</div></div>
    </div>
    <div class="card"><div class="ttl">公式</div><div class="eq" id="eq"></div></div>
    <div class="card"><div class="ttl">几何意义</div><div class="nt" id="note"></div></div>
  </div>
  <footer>复数 a+bi 就是复平面上的点 (a, b)；i 的作用是「逆时针转 90°」· 纯前端单文件教学</footer>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
var W=900,H=560,Vw={ox:0,oy:0,s:40};
function fit(){var st=document.getElementById("stage");var cw=st.clientWidth||900;W=cw;H=Math.round(cw*0.62);if(H<320)H=320;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);
  var span=12,p=30,s=Math.min((W-2*p)/span,(H-2*p)/span);Vw.s=s;Vw.ox=W/2;Vw.oy=H/2;}
function PX(x){return Vw.ox+x*Vw.s;}function PY(y){return Vw.oy-y*Vw.s;}
var PI=Math.PI;
function grid(){ctx.strokeStyle="rgba(120,140,180,.09)";ctx.lineWidth=1;ctx.beginPath();
  for(var x=-6;x<=6;x++){ctx.moveTo(PX(x),0);ctx.lineTo(PX(x),H);}for(var y=-6;y<=6;y++){ctx.moveTo(0,PY(y));ctx.lineTo(W,PY(y));}ctx.stroke();
  ctx.strokeStyle="rgba(150,170,210,.4)";ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,PY(0));ctx.lineTo(W,PY(0));ctx.moveTo(PX(0),0);ctx.lineTo(PX(0),H);ctx.stroke();
  ctx.fillStyle="#5a6680";ctx.font="11px system-ui";ctx.textAlign="right";ctx.textBaseline="top";ctx.fillText("实轴",W-8,PY(0)+6);ctx.textAlign="left";ctx.fillText("虚轴 i",PX(0)+6,6);}
function arrow(x1,y1,x2,y2,col,w){var p1={x:PX(x1),y:PY(y1)},p2={x:PX(x2),y:PY(y2)};ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w||3;ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.stroke();
  var ang=Math.atan2(p2.y-p1.y,p2.x-p1.x),hl=11;ctx.beginPath();ctx.moveTo(p2.x,p2.y);ctx.lineTo(p2.x-hl*Math.cos(ang-0.4),p2.y-hl*Math.sin(ang-0.4));ctx.lineTo(p2.x-hl*Math.cos(ang+0.4),p2.y-hl*Math.sin(ang+0.4));ctx.closePath();ctx.fill();}
function segp(x1,y1,x2,y2,col,w,dash){ctx.strokeStyle=col;ctx.lineWidth=w||1.4;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(PX(x1),PY(y1));ctx.lineTo(PX(x2),PY(y2));ctx.stroke();ctx.setLineDash([]);}
function lbl(txt,x,y,col,dx,dy){ctx.fillStyle=col;ctx.font="bold 13px system-ui";ctx.textAlign="left";ctx.textBaseline="middle";ctx.fillText(txt,PX(x)+(dx||8),PY(y)+(dy||-8));}
function cstr(a,b){return a.toFixed(1)+(b>=0?" + ":" − ")+Math.abs(b).toFixed(1)+"i";}
var A="#56b6ff",B="#b98cff",R="#56d6a8",YE="#ffd166";
var idx=0,P={};
function mag(a,b){return Math.sqrt(a*a+b*b);}function arg(a,b){return Math.atan2(b,a)*180/PI;}

var CONCEPTS=[
{ id:"repr",emoji:"📍",name:"表示",
  params:[{k:"a",label:"实部 a",min:-5,max:5,step:0.5,def:3},{k:"b",label:"虚部 b",min:-5,max:5,step:0.5,def:2}],
  read:function(){return [cstr(P.a,P.b),mag(P.a,P.b).toFixed(2),arg(P.a,P.b).toFixed(1)+"°"];},
  eq:function(){return 'z = a + bi = '+cstr(P.a,P.b)+'　·　|z| = √(a²+b²) = <span class="hl">'+mag(P.a,P.b).toFixed(2)+'</span>';},
  hint:"复数 a+bi 就是平面上的点 (a, b)。",
  note:'<b>复数 z = a + bi</b> 对应复平面上的点 <b>(a, b)</b> 或一个向量。<br><b>模 |z|</b> = 向量长度 = √(a²+b²)；<b>辐角 θ</b> = 向量与实轴正方向的夹角。',
  draw:function(){grid();arrow(0,0,P.a,P.b,A,3);dot(P.a,P.b);lbl("z="+cstr(P.a,P.b),P.a,P.b,A);
    // 辐角弧
    var th=Math.atan2(P.b,P.a);ctx.strokeStyle=YE;ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(PX(0),PY(0),26,0,-th,th<0);ctx.stroke();
    segp(P.a,0,P.a,P.b,"rgba(86,182,255,.4)",1,[3,3]);segp(0,P.b,P.a,P.b,"rgba(86,182,255,.4)",1,[3,3]);}
},
{ id:"add",emoji:"➕",name:"加法",
  params:[{k:"a",label:"z₁ 实部",min:-4,max:4,step:0.5,def:3},{k:"b",label:"z₁ 虚部",min:-4,max:4,step:0.5,def:1},{k:"c",label:"z₂ 实部",min:-4,max:4,step:0.5,def:1},{k:"d",label:"z₂ 虚部",min:-4,max:4,step:0.5,def:2}],
  read:function(){var rx=P.a+P.c,ry=P.b+P.d;return [cstr(rx,ry),mag(rx,ry).toFixed(2),arg(rx,ry).toFixed(1)+"°"];},
  eq:function(){return '(a+bi)+(c+di) = (a+c)+(b+d)i = <span class="hl">'+cstr(P.a+P.c,P.b+P.d)+'</span>';},
  hint:"实部加实部、虚部加虚部 = 向量相加。",
  note:'复数<b>加法</b>就是<b>向量加法</b>：实部与实部相加、虚部与虚部相加。<br>几何上把 z₂ 接在 z₁ 后面（平行四边形法则），对角线就是和。',
  draw:function(){grid();var rx=P.a+P.c,ry=P.b+P.d;
    segp(P.a,P.b,rx,ry,"rgba(185,140,255,.5)",1.4,[5,4]);segp(P.c,P.d,rx,ry,"rgba(86,182,255,.5)",1.4,[5,4]);
    arrow(0,0,P.a,P.b,A,3);lbl("z₁",P.a,P.b,A);arrow(0,0,P.c,P.d,B,3);lbl("z₂",P.c,P.d,B);
    arrow(0,0,rx,ry,R,3.4);lbl("z₁+z₂",rx,ry,R);}
},
{ id:"mul",emoji:"✖️",name:"乘法",
  params:[{k:"a",label:"z₁ 实部",min:-3,max:3,step:0.5,def:2},{k:"b",label:"z₁ 虚部",min:-3,max:3,step:0.5,def:1},{k:"c",label:"z₂ 实部",min:-3,max:3,step:0.5,def:0},{k:"d",label:"z₂ 虚部",min:-3,max:3,step:0.5,def:1}],
  read:function(){var rx=P.a*P.c-P.b*P.d,ry=P.a*P.d+P.b*P.c;return [cstr(rx,ry),mag(rx,ry).toFixed(2),arg(rx,ry).toFixed(1)+"°"];},
  eq:function(){var rx=P.a*P.c-P.b*P.d,ry=P.a*P.d+P.b*P.c;return 'z₁·z₂ = (ac−bd)+(ad+bc)i = <span class="hl">'+cstr(rx,ry)+'</span>　|z₁z₂|=|z₁||z₂|';},
  hint:"模相乘、辐角相加。乘 i（即 0+1i）= 逆时针转 90°。",
  note:'复数<b>乘法</b> = <b>模相乘、辐角相加</b>（旋转 + 缩放）。<br>特别地，乘以 <b>i</b> 就是把向量<b>逆时针旋转 90°</b>（模不变）；乘 i 两次 = 转 180° = ×(−1)，这就是 i²=−1 的几何含义。',
  draw:function(){grid();var rx=P.a*P.c-P.b*P.d,ry=P.a*P.d+P.b*P.c;
    arrow(0,0,P.a,P.b,A,3);lbl("z₁",P.a,P.b,A);arrow(0,0,P.c,P.d,B,3);lbl("z₂",P.c,P.d,B);
    arrow(0,0,rx,ry,R,3.4);lbl("z₁·z₂",rx,ry,R);
    ctx.fillStyle="#9aa6bd";ctx.font="12px system-ui";ctx.textAlign="left";ctx.textBaseline="top";
    ctx.fillText("辐角: "+arg(P.a,P.b).toFixed(0)+"° + "+arg(P.c,P.d).toFixed(0)+"° = "+arg(rx,ry).toFixed(0)+"°",PX(Vw.xmin)+6||14,8);}
}
];
function dot(x,y){ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(PX(x),PY(y),5,0,2*PI);ctx.fill();}
function buildChips(){var box=document.getElementById("chips");box.innerHTML="";
  CONCEPTS.forEach(function(c,i){var el=document.createElement("div");el.className="chip"+(i===idx?" on":"");el.innerHTML='<span>'+c.emoji+'</span>'+c.name;el.onclick=function(){idx=i;location.hash=c.id;load();};box.appendChild(el);});}
function buildParams(){var box=document.getElementById("params");box.innerHTML="";P={};
  CONCEPTS[idx].params.forEach(function(pp){P[pp.k]=pp.def;var w=document.createElement("div");w.className="slider";
    w.innerHTML='<div class="sl-top"><span class="nm">'+pp.label+'</span><span class="val" id="v_'+pp.k+'">'+pp.def.toFixed(1)+'</span></div><input type="range" id="r_'+pp.k+'" min="'+pp.min+'" max="'+pp.max+'" step="'+pp.step+'" value="'+pp.def+'">';
    box.appendChild(w);var inp=w.querySelector("input");
    inp.oninput=function(){P[pp.k]=parseFloat(inp.value);document.getElementById("v_"+pp.k).textContent=P[pp.k].toFixed(1);draw();};});}
function draw(){ctx.clearRect(0,0,W,H);var c=CONCEPTS[idx];Vw.xmin=-6;c.draw();
  var r=c.read();document.getElementById("k0").textContent="结果 z";document.getElementById("r0").textContent=r[0];
  document.getElementById("k1").textContent="模 |z|";document.getElementById("r1").textContent=r[1];
  document.getElementById("k2").textContent="辐角 θ";document.getElementById("r2").textContent=r[2];
  document.getElementById("eq").innerHTML=c.eq();document.getElementById("note").innerHTML=c.note;document.getElementById("hint").textContent=c.hint;}
function load(){buildChips();buildParams();draw();}
window.addEventListener("resize",function(){fit();draw();});
(function(){var hs=(location.hash||"").replace("#","");for(var i=0;i<CONCEPTS.length;i++)if(CONCEPTS[i].id===hs)idx=i;})();
fit();load();
</script>
</body>
</html>
