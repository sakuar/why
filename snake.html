<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#0f1117; color:#e0e0f0; min-height:100vh;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:16px; user-select:none; }
  .back{ position:fixed; top:14px; left:16px; color:#6b6f8a; text-decoration:none; font-size:13px; }
  .back:hover{ color:#6c63ff; }
  h1{ margin-top:44px; font-size:1.8rem; font-weight:700;
    background:linear-gradient(135deg,#6c63ff,#56cfaf); -webkit-background-clip:text;
    background-clip:text; -webkit-text-fill-color:transparent; }
  .sub{ color:#6b6f8a; font-size:13px; margin:6px 0 18px; }
  .scores{ display:flex; gap:20px; margin-bottom:16px; }
  .sbox{ background:#1a1d27; border:1px solid #2a2d3e; border-radius:12px;
    padding:9px 22px; text-align:center; min-width:88px; }
  .slabel{ font-size:11px; color:#6b6f8a; letter-spacing:1px; }
  .sval{ font-size:1.5rem; font-weight:700; }
  .sbox.best .sval{ color:#f7c948; }
  .wrap{ position:relative; border-radius:14px; overflow:hidden; box-shadow:0 8px 32px rgba(108,99,255,.18); }
  canvas{ display:block; background:#171a28; }
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:rgba(15,17,23,.85); backdrop-filter:blur(4px); transition:opacity .25s; }
  .overlay.hidden{ opacity:0; pointer-events:none; }
  .otitle{ font-size:1.5rem; font-weight:700; margin-bottom:8px; }
  .otitle.over{ color:#ff6584; }
  .otitle.ready{ color:#56cfaf; }
  .osub{ color:#9a9ec0; font-size:14px; margin-bottom:22px; text-align:center; line-height:1.7; white-space:pre-line; }
  .btn{ background:#6c63ff; color:#fff; border:none; border-radius:10px; padding:11px 34px;
    font-size:15px; font-weight:600; cursor:pointer; box-shadow:0 4px 16px rgba(108,99,255,.35); transition:.15s; }
  .btn:hover{ background:#8a82ff; transform:translateY(-1px); }
  .hint{ margin-top:16px; color:#6b6f8a; font-size:12px; text-align:center; line-height:1.8; }
  .dpad{ display:none; margin-top:18px; flex-direction:column; align-items:center; }
  .drow{ display:flex; }
  .dbtn{ width:54px; height:54px; margin:3px; background:#1a1d27; border:1px solid #2a2d3e;
    color:#e0e0f0; font-size:20px; border-radius:8px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .dbtn:active{ background:#6c63ff; }
  @media (max-width:560px){ .hint{ display:none; } .dpad{ display:flex; } h1{ margin-top:36px; } }
</style>
</head>
<body>
<a class="back" href="index.html">← 入口</a>
<h1>贪吃蛇</h1>
<p class="sub">方向键 / WASD 控制 · 空格暂停</p>

<div class="scores">
  <div class="sbox"><div class="slabel">得分</div><div class="sval" id="score">0</div></div>
  <div class="sbox best"><div class="slabel">最高分</div><div class="sval" id="best">0</div></div>
</div>

<div class="wrap">
  <canvas id="cv" width="440" height="440"></canvas>
  <div class="overlay" id="overlay">
    <div class="otitle ready" id="otitle">贪吃蛇</div>
    <div class="osub" id="osub">控制蛇吃食物，越吃越长{br}撞墙或撞到自己就结束</div>
    <button class="btn" id="startBtn">开始游戏</button>
  </div>
</div>

<div class="hint">方向键 ↑ ↓ ← → 或 WASD 控制 ｜ 空格 暂停 / 继续</div>

<div class="dpad">
  <div class="drow"><div class="dbtn" data-d="up">↑</div></div>
  <div class="drow">
    <div class="dbtn" data-d="left">←</div>
    <div class="dbtn" data-d="down">↓</div>
    <div class="dbtn" data-d="right">→</div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var COLS=20, ROWS=20;
  var cv=document.getElementById("cv");
  var ctx=cv.getContext("2d");
  var cell=cv.width/COLS; // 22

  var scoreEl=document.getElementById("score");
  var bestEl=document.getElementById("best");
  var overlay=document.getElementById("overlay");
  var otitle=document.getElementById("otitle");
  var osub=document.getElementById("osub");
  var startBtn=document.getElementById("startBtn");

  // 修正初始文案里的换行占位
  osub.textContent="控制蛇吃食物，越吃越长\n撞墙或撞到自己就结束";

  var snake, dir, nextDir, food, score, running, paused, timer;
  var best=parseInt(localStorage.getItem("snake_best")||"0",10);
  bestEl.textContent=best;

  function init(){
    var mc=Math.floor(COLS/2), mr=Math.floor(ROWS/2);
    snake=[{x:mc,y:mr},{x:mc-1,y:mr},{x:mc-2,y:mr}];
    dir={x:1,y:0}; nextDir={x:1,y:0};
    score=0; scoreEl.textContent="0";
    placeFood();
  }

  function placeFood(){
    var free=[];
    for(var y=0;y<ROWS;y++) for(var x=0;x<COLS;x++){
      var on=false;
      for(var i=0;i<snake.length;i++) if(snake[i].x===x&&snake[i].y===y){on=true;break;}
      if(!on) free.push({x:x,y:y});
    }
    food=free.length? free[Math.floor(Math.random()*free.length)] : {x:0,y:0};
  }

  function start(){
    init();
    running=true; paused=false;
    overlay.classList.add("hidden");
    clearInterval(timer);
    timer=setInterval(step,130);
    render();
  }

  function step(){
    if(!running||paused) return;
    dir={x:nextDir.x,y:nextDir.y};
    var head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    // 撞墙
    if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){ return over(); }
    // 撞自身（移动后尾巴会让出，所以检查除尾巴外的身体）
    for(var i=0;i<snake.length-1;i++){ if(snake[i].x===head.x&&snake[i].y===head.y){ return over(); } }
    var ate=(head.x===food.x&&head.y===food.y);
    snake.unshift(head);
    if(ate){
      score+=10; scoreEl.textContent=score;
      if(score>best){ best=score; bestEl.textContent=best; localStorage.setItem("snake_best",String(best)); }
      placeFood();
    } else {
      snake.pop();
    }
    render();
  }

  function over(){
    running=false; clearInterval(timer);
    otitle.textContent="游戏结束"; otitle.className="otitle over";
    osub.textContent="得分 "+score+"　最高分 "+best;
    startBtn.textContent="再来一局";
    overlay.classList.remove("hidden");
  }

  function togglePause(){
    if(!running) return;
    paused=!paused;
    if(paused){
      otitle.textContent="已暂停"; otitle.className="otitle";
      osub.textContent="按空格或点按钮继续";
      startBtn.textContent="继续";
      overlay.classList.remove("hidden");
    } else {
      overlay.classList.add("hidden");
    }
  }

  function render(){
    ctx.clearRect(0,0,cv.width,cv.height);
    // 网格背景
    ctx.fillStyle="#171a28"; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.strokeStyle="#1f2236"; ctx.lineWidth=1;
    for(var i=0;i<=COLS;i++){
      ctx.beginPath(); ctx.moveTo(i*cell,0); ctx.lineTo(i*cell,cv.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*cell); ctx.lineTo(cv.width,i*cell); ctx.stroke();
    }
    // 食物
    var fx=food.x*cell+cell/2, fy=food.y*cell+cell/2;
    ctx.beginPath(); ctx.arc(fx,fy,cell*0.34,0,Math.PI*2);
    ctx.fillStyle="#ff6584"; ctx.fill();
    // 蛇
    for(var s=snake.length-1;s>=0;s--){
      var seg=snake[s];
      ctx.fillStyle = s===0 ? "#a8f0da" : "#56cfaf";
      roundRect(seg.x*cell+1, seg.y*cell+1, cell-2, cell-2, 5);
      ctx.fill();
    }
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
  }

  function setDir(nx,ny){
    if(!running||paused) return;
    if(dir.x===-nx&&dir.y===-ny) return; // 禁止直接反向
    nextDir={x:nx,y:ny};
  }

  document.addEventListener("keydown",function(e){
    var k=e.key;
    if(k==="ArrowUp"||k==="w"||k==="W"){ e.preventDefault(); setDir(0,-1); }
    else if(k==="ArrowDown"||k==="s"||k==="S"){ e.preventDefault(); setDir(0,1); }
    else if(k==="ArrowLeft"||k==="a"||k==="A"){ e.preventDefault(); setDir(-1,0); }
    else if(k==="ArrowRight"||k==="d"||k==="D"){ e.preventDefault(); setDir(1,0); }
    else if(k===" "){ e.preventDefault(); togglePause(); }
  });

  var dmap={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
  var dbtns=document.querySelectorAll(".dbtn");
  for(var b=0;b<dbtns.length;b++){
    (function(btn){
      btn.addEventListener("click",function(){
        var d=dmap[btn.getAttribute("data-d")];
        setDir(d[0],d[1]);
      });
    })(dbtns[b]);
  }

  startBtn.addEventListener("click",function(){
    if(paused) togglePause(); else start();
  });

  // 初始画面
  init(); render();
})();
</script>
</body>
</html>
