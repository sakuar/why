<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素画板</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f13;
    --surface: #1a1a24;
    --surface2: #22222f;
    --border: #2e2e40;
    --accent: #7c6ff7;
    --accent2: #f7726f;
    --text: #e8e8f0;
    --text2: #8888aa;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,.5);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    gap: 20px;
  }

  .back-link {
    position: fixed;
    top: 12px;
    left: 14px;
    font-size: 12px;
    color: var(--text2);
    text-decoration: none;
    z-index: 100;
    transition: color .2s;
  }
  .back-link:hover { color: var(--text); }

  header {
    text-align: center;
    margin-top: 8px;
  }
  header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: .04em;
  }
  header p {
    font-size: .78rem;
    color: var(--text2);
    margin-top: 4px;
  }

  .workspace {
    display: flex;
    gap: 20px;
    align-items: flex-start;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    max-width: 780px;
  }

  /* Canvas area */
  .canvas-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
    flex-shrink: 0;
  }

  #pixel-canvas {
    display: block;
    cursor: crosshair;
    border-radius: 6px;
    image-rendering: pixelated;
    touch-action: none;
    transition: box-shadow .2s;
  }
  #pixel-canvas:hover {
    box-shadow: 0 0 0 2px var(--accent);
  }

  /* Sidebar */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-width: 210px;
    flex: 1;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    box-shadow: var(--shadow);
  }

  .panel-title {
    font-size: .72rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--text2);
    margin-bottom: 10px;
    font-weight: 600;
  }

  /* Color preview + picker */
  .color-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  #color-preview {
    width: 38px;
    height: 38px;
    border-radius: 8px;
    border: 2px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .15s, border-color .15s;
  }
  #color-preview:hover { transform: scale(1.08); border-color: var(--accent); }

  #color-picker {
    opacity: 0;
    position: absolute;
    width: 1px;
    height: 1px;
  }

  .color-hex {
    font-size: .82rem;
    color: var(--text);
    font-family: monospace;
    letter-spacing: .05em;
  }

  /* Palette */
  .palette {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 5px;
  }
  .swatch {
    aspect-ratio: 1;
    border-radius: 5px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform .12s, border-color .12s;
  }
  .swatch:hover { transform: scale(1.18); border-color: rgba(255,255,255,.4); }
  .swatch.active { border-color: #fff; transform: scale(1.12); }

  /* Tools */
  .tools {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .tool-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: .82rem;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
    font-weight: 500;
  }
  .tool-btn:hover { background: var(--border); border-color: var(--accent); transform: translateY(-1px); }
  .tool-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tool-btn .icon { font-size: 1rem; }

  /* Actions */
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .act-btn {
    flex: 1;
    min-width: 80px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-size: .82rem;
    cursor: pointer;
    text-align: center;
    transition: background .15s, border-color .15s, transform .1s;
    font-weight: 500;
  }
  .act-btn:hover { background: var(--border); border-color: var(--accent2); transform: translateY(-1px); }
  .act-btn.danger { border-color: var(--accent2); }
  .act-btn.danger:hover { background: var(--accent2); color: #fff; }
  .act-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .act-btn.primary:hover { background: #9087ff; }

  /* Grid size selector */
  .size-btns { display: flex; gap: 6px; }
  .size-btn {
    padding: 5px 11px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text2);
    font-size: .78rem;
    cursor: pointer;
    transition: all .15s;
    font-weight: 500;
  }
  .size-btn:hover { border-color: var(--accent); color: var(--text); }
  .size-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Grid toggle */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
  }
  .toggle-label { font-size: .82rem; color: var(--text2); }
  .toggle {
    width: 34px;
    height: 18px;
    border-radius: 9px;
    background: var(--border);
    cursor: pointer;
    position: relative;
    transition: background .2s;
    border: none;
    outline: none;
  }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #fff;
    top: 3px;
    left: 3px;
    transition: transform .2s;
  }
  .toggle.on::after { transform: translateX(16px); }

  /* Toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(60px);
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 20px;
    border-radius: 20px;
    font-size: .84rem;
    opacity: 0;
    transition: transform .3s, opacity .3s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
    box-shadow: var(--shadow);
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* Preview mini */
  .preview-wrap {
    margin-top: 10px;
    display: flex;
    justify-content: center;
  }
  #mini-preview {
    border-radius: 6px;
    border: 1px solid var(--border);
    image-rendering: pixelated;
  }

  @media (max-width: 560px) {
    .workspace { gap: 14px; }
    .sidebar { min-width: unset; width: 100%; }
    body { padding: 10px; gap: 12px; }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<header>
  <h1>像素画板</h1>
  <p>在格子里描绘你的像素世界</p>
</header>

<div class="workspace">
  <div class="canvas-wrap">
    <canvas id="pixel-canvas"></canvas>
  </div>

  <div class="sidebar">
    <!-- Color panel -->
    <div class="panel">
      <div class="panel-title">颜色</div>
      <div class="color-row">
        <div id="color-preview" title="点击选色"></div>
        <input type="color" id="color-picker">
        <span class="color-hex" id="hex-label">#000000</span>
      </div>
      <div class="palette" id="palette"></div>
    </div>

    <!-- Tools panel -->
    <div class="panel">
      <div class="panel-title">工具</div>
      <div class="tools">
        <button class="tool-btn active" id="tool-pen" title="画笔">
          <span class="icon">✏️</span> 画笔
        </button>
        <button class="tool-btn" id="tool-eraser" title="橡皮">
          <span class="icon">🧹</span> 橡皮
        </button>
        <button class="tool-btn" id="tool-fill" title="填充">
          <span class="icon">🪣</span> 填充
        </button>
        <button class="tool-btn" id="tool-eyedrop" title="取色">
          <span class="icon">💧</span> 取色
        </button>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">显示网格线</span>
        <button class="toggle on" id="grid-toggle" aria-label="切换网格"></button>
      </div>
    </div>

    <!-- Grid size -->
    <div class="panel">
      <div class="panel-title">画布尺寸</div>
      <div class="size-btns">
        <button class="size-btn active" data-size="16">16×16</button>
        <button class="size-btn" data-size="32">32×32</button>
        <button class="size-btn" data-size="64">64×64</button>
      </div>
    </div>

    <!-- Actions -->
    <div class="panel">
      <div class="panel-title">操作</div>
      <div class="actions">
        <button class="act-btn" id="btn-undo">↩ 撤销</button>
        <button class="act-btn" id="btn-redo">↪ 重做</button>
        <button class="act-btn danger" id="btn-clear">🗑 清空</button>
        <button class="act-btn primary" id="btn-export">⬇ 导出PNG</button>
      </div>
      <div class="preview-wrap">
        <canvas id="mini-preview" width="64" height="64" title="实时预览"></canvas>
      </div>
    </div>
  </div>
</div>

<div id="toast">已保存</div>

<script>
(function () {
  "use strict";

  /* ===== Constants ===== */
  var STORAGE_KEY = "pixeldraw_v2";
  var CELL_SIZE_MAP = { 16: 28, 32: 16, 64: 10 };
  var DEFAULT_GRID = 16;

  /* ===== Default palette ===== */
  var DEFAULT_PALETTE = [
    "#000000","#ffffff","#ff4444","#ff8800","#ffdd00","#44cc44",
    "#00aaff","#6644ff","#ff44aa","#aa6622","#888888","#cccccc",
    "#ff99aa","#aaffcc","#aaddff","#ffeeaa",
    "#1a1a2e","#16213e","#0f3460","#e94560",
    "#ffd460","#a8e063","#56ccf2","#f7971e",
    "#c0392b","#27ae60","#2980b9","#8e44ad",
    "#f39c12","#1abc9c","#e74c3c","#2ecc71"
  ];

  /* ===== State ===== */
  var gridSize = DEFAULT_GRID;
  var cellSize = CELL_SIZE_MAP[gridSize];
  var pixels = [];            // flat array, length = gridSize*gridSize, each = color string or null
  var currentColor = "#ff4444";
  var currentTool = "pen";
  var showGrid = true;
  var isDrawing = false;
  var lastCell = -1;
  var undoStack = [];
  var redoStack = [];
  var paletteColors = DEFAULT_PALETTE.slice();
  var saveTimer = null;

  /* ===== DOM refs ===== */
  var canvas = document.getElementById("pixel-canvas");
  var ctx = canvas.getContext("2d");
  var miniCanvas = document.getElementById("mini-preview");
  var miniCtx = miniCanvas.getContext("2d");
  var colorPreview = document.getElementById("color-preview");
  var colorPicker = document.getElementById("color-picker");
  var hexLabel = document.getElementById("hex-label");
  var paletteEl = document.getElementById("palette");
  var gridToggle = document.getElementById("grid-toggle");
  var toastEl = document.getElementById("toast");

  var toolBtns = {
    pen: document.getElementById("tool-pen"),
    eraser: document.getElementById("tool-eraser"),
    fill: document.getElementById("tool-fill"),
    eyedrop: document.getElementById("tool-eyedrop")
  };

  /* ===== Helpers ===== */
  function idx(row, col) { return row * gridSize + col; }

  function cellFromEvent(e) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var clientX, clientY;
    if (e.touches) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    var x = (clientX - rect.left) * scaleX;
    var y = (clientY - rect.top) * scaleY;
    var col = Math.floor(x / cellSize);
    var row = Math.floor(y / cellSize);
    if (col < 0 || col >= gridSize || row < 0 || row >= gridSize) return -1;
    return idx(row, col);
  }

  function clonePixels() { return pixels.slice(); }

  function pushUndo() {
    undoStack.push(clonePixels());
    if (undoStack.length > 80) undoStack.shift();
    redoStack = [];
  }

  /* ===== Draw ===== */
  function renderCanvas() {
    var w = gridSize * cellSize;
    ctx.clearRect(0, 0, w, w);

    for (var i = 0; i < gridSize; i++) {
      for (var j = 0; j < gridSize; j++) {
        var color = pixels[idx(i, j)];
        if (color) {
          ctx.fillStyle = color;
          ctx.fillRect(j * cellSize, i * cellSize, cellSize, cellSize);
        } else {
          // checkerboard for transparent
          var light = (i + j) % 2 === 0 ? "#2a2a3a" : "#1e1e2a";
          ctx.fillStyle = light;
          ctx.fillRect(j * cellSize, i * cellSize, cellSize, cellSize);
        }
      }
    }

    if (showGrid && cellSize >= 8) {
      ctx.strokeStyle = "rgba(255,255,255,0.06)";
      ctx.lineWidth = 0.5;
      for (var gi = 0; gi <= gridSize; gi++) {
        ctx.beginPath();
        ctx.moveTo(gi * cellSize, 0);
        ctx.lineTo(gi * cellSize, w);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, gi * cellSize);
        ctx.lineTo(w, gi * cellSize);
        ctx.stroke();
      }
    }

    renderMini();
  }

  function renderMini() {
    var mw = miniCanvas.width;
    var mh = miniCanvas.height;
    miniCtx.clearRect(0, 0, mw, mh);
    var ps = mw / gridSize;
    for (var i = 0; i < gridSize; i++) {
      for (var j = 0; j < gridSize; j++) {
        var color = pixels[idx(i, j)];
        miniCtx.fillStyle = color || (((i + j) % 2 === 0) ? "#2a2a3a" : "#1e1e2a");
        miniCtx.fillRect(j * ps, i * ps, ps, ps);
      }
    }
  }

  /* ===== Tools ===== */
  function applyPen(cellIdx, color) {
    pixels[cellIdx] = color;
  }

  function applyEraser(cellIdx) {
    pixels[cellIdx] = null;
  }

  function floodFill(startIdx, newColor) {
    var targetColor = pixels[startIdx];
    if (targetColor === newColor) return;
    var stack = [startIdx];
    var visited = new Uint8Array(pixels.length);
    while (stack.length > 0) {
      var ci = stack.pop();
      if (ci < 0 || ci >= pixels.length) continue;
      if (visited[ci]) continue;
      if (pixels[ci] !== targetColor) continue;
      visited[ci] = 1;
      pixels[ci] = newColor;
      var row = Math.floor(ci / gridSize);
      var col = ci % gridSize;
      if (col > 0) stack.push(idx(row, col - 1));
      if (col < gridSize - 1) stack.push(idx(row, col + 1));
      if (row > 0) stack.push(idx(row - 1, col));
      if (row < gridSize - 1) stack.push(idx(row + 1, col));
    }
  }

  function applyTool(cellIdx) {
    if (cellIdx < 0) return;
    if (currentTool === "pen") {
      applyPen(cellIdx, currentColor);
    } else if (currentTool === "eraser") {
      applyEraser(cellIdx);
    } else if (currentTool === "fill") {
      floodFill(cellIdx, currentColor);
    } else if (currentTool === "eyedrop") {
      var picked = pixels[cellIdx];
      if (picked) {
        setColor(picked);
        setTool("pen");
      }
    }
    renderCanvas();
  }

  /* ===== Color ===== */
  function setColor(hex) {
    currentColor = hex;
    colorPreview.style.background = hex;
    colorPicker.value = hex;
    hexLabel.textContent = hex.toUpperCase();
  }

  /* ===== Tool selection ===== */
  function setTool(name) {
    currentTool = name;
    Object.keys(toolBtns).forEach(function (k) {
      toolBtns[k].classList.toggle("active", k === name);
    });
    if (name === "eraser") {
      canvas.style.cursor = "cell";
    } else if (name === "fill") {
      canvas.style.cursor = "crosshair";
    } else if (name === "eyedrop") {
      canvas.style.cursor = "zoom-in";
    } else {
      canvas.style.cursor = "crosshair";
    }
  }

  /* ===== Palette ===== */
  function buildPalette() {
    paletteEl.innerHTML = "";
    paletteColors.forEach(function (c) {
      var sw = document.createElement("div");
      sw.className = "swatch";
      if (c === currentColor) sw.classList.add("active");
      sw.style.background = c;
      sw.title = c;
      sw.addEventListener("click", function () {
        setColor(c);
        document.querySelectorAll(".swatch").forEach(function (s) { s.classList.remove("active"); });
        sw.classList.add("active");
        setTool("pen");
      });
      paletteEl.appendChild(sw);
    });
  }

  /* ===== Save / Load ===== */
  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      saveState();
      showToast("已自动保存");
    }, 1200);
  }

  function saveState() {
    try {
      var data = {
        gridSize: gridSize,
        pixels: pixels,
        palette: paletteColors,
        color: currentColor
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    } catch (e) { /* ignore quota errors */ }
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      var data = JSON.parse(raw);
      if (!data || !data.pixels) return false;
      gridSize = data.gridSize || DEFAULT_GRID;
      pixels = data.pixels;
      if (pixels.length !== gridSize * gridSize) return false;
      if (data.palette && data.palette.length === DEFAULT_PALETTE.length) {
        paletteColors = data.palette;
      }
      if (data.color) currentColor = data.color;
      cellSize = CELL_SIZE_MAP[gridSize] || 16;
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ===== Grid size change ===== */
  function setGridSize(size) {
    if (size === gridSize) return;
    pushUndo();
    gridSize = size;
    cellSize = CELL_SIZE_MAP[size] || 16;
    pixels = new Array(size * size).fill(null);
    redoStack = [];
    undoStack = [];
    updateCanvasSize();
    renderCanvas();
    updateSizeButtons();
    scheduleSave();
  }

  function updateSizeButtons() {
    document.querySelectorAll(".size-btn").forEach(function (btn) {
      btn.classList.toggle("active", parseInt(btn.dataset.size, 10) === gridSize);
    });
  }

  function updateCanvasSize() {
    var w = gridSize * cellSize;
    canvas.width = w;
    canvas.height = w;
  }

  /* ===== Toast ===== */
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 2000);
  }

  /* ===== Export PNG ===== */
  function exportPNG() {
    var exportCanvas = document.createElement("canvas");
    var exportSize = Math.max(gridSize * 8, 256);
    var exportCell = exportSize / gridSize;
    exportCanvas.width = exportSize;
    exportCanvas.height = exportSize;
    var ectx = exportCanvas.getContext("2d");
    for (var i = 0; i < gridSize; i++) {
      for (var j = 0; j < gridSize; j++) {
        var color = pixels[idx(i, j)];
        ectx.fillStyle = color || "rgba(0,0,0,0)";
        ectx.fillRect(j * exportCell, i * exportCell, exportCell, exportCell);
      }
    }
    var link = document.createElement("a");
    link.download = "pixel-art-" + gridSize + "x" + gridSize + ".png";
    link.href = exportCanvas.toDataURL("image/png");
    link.click();
    showToast("PNG 已导出");
  }

  /* ===== Event listeners ===== */
  function onPointerDown(e) {
    e.preventDefault();
    isDrawing = true;
    lastCell = -1;
    var ci = cellFromEvent(e);
    if (ci >= 0) {
      pushUndo();
      applyTool(ci);
      lastCell = ci;
      scheduleSave();
    }
  }

  function onPointerMove(e) {
    e.preventDefault();
    if (!isDrawing) return;
    var ci = cellFromEvent(e);
    if (ci >= 0 && ci !== lastCell) {
      if (currentTool === "pen" || currentTool === "eraser") {
        applyTool(ci);
        lastCell = ci;
        scheduleSave();
      }
    }
  }

  function onPointerUp(e) {
    isDrawing = false;
    lastCell = -1;
  }

  canvas.addEventListener("mousedown", onPointerDown);
  canvas.addEventListener("mousemove", onPointerMove);
  canvas.addEventListener("mouseup", onPointerUp);
  canvas.addEventListener("mouseleave", onPointerUp);
  canvas.addEventListener("touchstart", onPointerDown, { passive: false });
  canvas.addEventListener("touchmove", onPointerMove, { passive: false });
  canvas.addEventListener("touchend", onPointerUp);

  // Color picker
  colorPreview.addEventListener("click", function () { colorPicker.click(); });
  colorPicker.addEventListener("input", function () {
    setColor(colorPicker.value);
    document.querySelectorAll(".swatch").forEach(function (s) { s.classList.remove("active"); });
  });

  // Tool buttons
  Object.keys(toolBtns).forEach(function (k) {
    toolBtns[k].addEventListener("click", function () { setTool(k); });
  });

  // Grid toggle
  gridToggle.addEventListener("click", function () {
    showGrid = !showGrid;
    gridToggle.classList.toggle("on", showGrid);
    renderCanvas();
  });

  // Size buttons
  document.querySelectorAll(".size-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var size = parseInt(btn.dataset.size, 10);
      if (size !== gridSize) {
        if (confirm("切换画布尺寸将清空当前画布，确认吗？")) {
          setGridSize(size);
        }
      }
    });
  });

  // Undo / Redo
  document.getElementById("btn-undo").addEventListener("click", function () {
    if (undoStack.length === 0) { showToast("没有可撤销的操作"); return; }
    redoStack.push(clonePixels());
    pixels = undoStack.pop();
    renderCanvas();
    scheduleSave();
    showToast("已撤销");
  });

  document.getElementById("btn-redo").addEventListener("click", function () {
    if (redoStack.length === 0) { showToast("没有可重做的操作"); return; }
    undoStack.push(clonePixels());
    pixels = redoStack.pop();
    renderCanvas();
    scheduleSave();
    showToast("已重做");
  });

  // Clear
  document.getElementById("btn-clear").addEventListener("click", function () {
    if (confirm("确认清空画布？此操作不可撤销。")) {
      pushUndo();
      pixels = new Array(gridSize * gridSize).fill(null);
      renderCanvas();
      scheduleSave();
      showToast("画布已清空");
    }
  });

  // Export
  document.getElementById("btn-export").addEventListener("click", exportPNG);

  // Keyboard shortcuts
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if ((e.ctrlKey || e.metaKey) && e.key === "z") {
      e.preventDefault();
      document.getElementById("btn-undo").click();
    } else if ((e.ctrlKey || e.metaKey) && (e.key === "y" || (e.shiftKey && e.key === "z"))) {
      e.preventDefault();
      document.getElementById("btn-redo").click();
    } else if (e.key === "b" || e.key === "B") {
      setTool("pen");
    } else if (e.key === "e" || e.key === "E") {
      setTool("eraser");
    } else if (e.key === "f" || e.key === "F") {
      setTool("fill");
    } else if (e.key === "i" || e.key === "I") {
      setTool("eyedrop");
    }
  });

  /* ===== Init ===== */
  function init() {
    var loaded = loadState();
    if (!loaded) {
      gridSize = DEFAULT_GRID;
      cellSize = CELL_SIZE_MAP[gridSize];
      pixels = new Array(gridSize * gridSize).fill(null);
    } else {
      cellSize = CELL_SIZE_MAP[gridSize] || 16;
    }

    updateCanvasSize();
    updateSizeButtons();
    setColor(currentColor);
    buildPalette();
    setTool("pen");
    renderCanvas();
  }

  init();

})();
</script>
</body>
</html>
