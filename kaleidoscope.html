<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万花筒</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0a0a12;
    color: #e0e0f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    color: rgba(180,180,220,0.5);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.02em;
    transition: color 0.2s;
    z-index: 100;
  }
  #back-link:hover { color: rgba(200,200,255,0.9); }

  #canvas-wrap {
    position: relative;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 60px rgba(120,80,255,0.3), 0 0 120px rgba(80,120,255,0.15);
  }

  canvas {
    display: block;
    cursor: crosshair;
    border-radius: 50%;
  }

  #controls {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding: 10px 18px;
    border-radius: 40px;
    z-index: 100;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ctrl-label {
    font-size: 12px;
    color: rgba(200,200,240,0.7);
    white-space: nowrap;
  }

  .ctrl-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    color: #d0d0f0;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.18s, transform 0.12s;
    white-space: nowrap;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.16); }
  .ctrl-btn:active { transform: scale(0.95); }

  .axis-num {
    font-size: 16px;
    font-weight: 700;
    color: #c0b0ff;
    min-width: 22px;
    text-align: center;
  }

  .divider {
    width: 1px;
    height: 20px;
    background: rgba(255,255,255,0.12);
  }

  #clear-btn {
    background: rgba(255,80,80,0.1);
    border-color: rgba(255,80,80,0.2);
    color: #ff9090;
  }
  #clear-btn:hover { background: rgba(255,80,80,0.22); }

  #tip {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(200,200,240,0.35);
    font-size: 14px;
    pointer-events: none;
    transition: opacity 0.6s;
    text-align: center;
    line-height: 1.8;
  }
</style>
</head>
<body>

<a href="index.html" id="back-link">← 入口</a>

<div id="canvas-wrap">
  <canvas id="c"></canvas>
</div>

<div id="controls">
  <span class="ctrl-label">对称轴</span>
  <button class="ctrl-btn" id="axis-minus">－</button>
  <span class="axis-num" id="axis-display">6</span>
  <button class="ctrl-btn" id="axis-plus">＋</button>
  <div class="divider"></div>
  <button class="ctrl-btn" id="palette-btn">切换配色</button>
  <div class="divider"></div>
  <button class="ctrl-btn" id="clear-btn">清空</button>
</div>

<div id="tip">在圆形画布上移动鼠标<br>开始绘制万花筒</div>

<script>
(function() {
  "use strict";

  /* ── 配色方案 ── */
  var PALETTES = [
    { name: "极光", hueBase: 200, hueRange: 160, sat: "90%", lit: "65%" },
    { name: "烈焰", hueBase: 0,   hueRange: 80,  sat: "95%", lit: "60%" },
    { name: "森林", hueBase: 100, hueRange: 80,  sat: "80%", lit: "55%" },
    { name: "糖果", hueBase: 280, hueRange: 200, sat: "85%", lit: "70%" },
    { name: "暮色", hueBase: 240, hueRange: 120, sat: "70%", lit: "60%" },
    { name: "黄金", hueBase: 30,  hueRange: 60,  sat: "95%", lit: "55%" }
  ];

  /* ── 状态变量 ── */
  var canvas, ctx, W, H, CX, CY, R;
  var axes = 6;
  var paletteIdx = 0;
  var drawing = false;
  var prevX = null, prevY = null;
  var hueOffset = 0;
  var animId = null;
  var drawnAnything = false;
  var tipEl;

  /* ── localStorage 持久化 ── */
  function loadState() {
    try {
      var s = localStorage.getItem("kaleidoscope_state");
      if (s) {
        var d = JSON.parse(s);
        if (typeof d.axes === "number") axes = Math.max(2, Math.min(24, d.axes));
        if (typeof d.paletteIdx === "number") paletteIdx = d.paletteIdx % PALETTES.length;
      }
    } catch(e) {}
  }

  function saveState() {
    try {
      localStorage.setItem("kaleidoscope_state", JSON.stringify({ axes: axes, paletteIdx: paletteIdx }));
    } catch(e) {}
  }

  /* ── Canvas 尺寸 ── */
  function calcSize() {
    var vw = window.innerWidth;
    var vh = window.innerHeight;
    var avail = Math.min(vw, vh - 90);
    R = Math.floor(avail * 0.46);
    W = R * 2;
    H = R * 2;
    CX = R;
    CY = R;
  }

  function resizeCanvas() {
    calcSize();
    var wrap = document.getElementById("canvas-wrap");
    canvas.width = W;
    canvas.height = H;
    wrap.style.width = W + "px";
    wrap.style.height = H + "px";
  }

  /* ── 颜色计算 ── */
  function getColor() {
    var p = PALETTES[paletteIdx];
    var h = (p.hueBase + hueOffset % p.hueRange) % 360;
    return "hsl(" + h + "," + p.sat + "," + p.lit + ")";
  }

  /* ── 绘制线段（镜像） ── */
  function drawMirroredLine(x1, y1, x2, y2) {
    var color = getColor();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.shadowColor = color;
    ctx.shadowBlur = 6;

    var step = (Math.PI * 2) / axes;
    for (var i = 0; i < axes; i++) {
      var angle = step * i;
      var cos = Math.cos(angle);
      var sin = Math.sin(angle);

      /* 正向 */
      ctx.beginPath();
      ctx.moveTo(CX + cos * x1 - sin * y1, CY + sin * x1 + cos * y1);
      ctx.lineTo(CX + cos * x2 - sin * y2, CY + sin * x2 + cos * y2);
      ctx.stroke();

      /* 镜像翻转 */
      ctx.beginPath();
      ctx.moveTo(CX + cos * x1 + sin * y1, CY + sin * x1 - cos * y1);
      ctx.lineTo(CX + cos * x2 + sin * y2, CY + sin * x2 - cos * y2);
      ctx.stroke();
    }
  }

  /* ── 鼠标/触摸坐标转换 ── */
  function getRelPos(e) {
    var rect = canvas.getBoundingClientRect();
    var clientX, clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    } else {
      clientX = e.clientX;
      clientY = e.clientY;
    }
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    return {
      x: (clientX - rect.left) * scaleX - CX,
      y: (clientY - rect.top) * scaleY - CY
    };
  }

  /* ── 颜色动画帧 ── */
  function animate() {
    hueOffset += 0.4;
    animId = requestAnimationFrame(animate);
  }

  /* ── 事件处理 ── */
  function onPointerDown(e) {
    e.preventDefault();
    drawing = true;
    var pos = getRelPos(e);
    prevX = pos.x;
    prevY = pos.y;
    if (!drawnAnything) {
      drawnAnything = true;
      tipEl.style.opacity = "0";
    }
  }

  function onPointerMove(e) {
    e.preventDefault();
    if (!drawing) return;
    var pos = getRelPos(e);
    if (prevX !== null) {
      drawMirroredLine(prevX, prevY, pos.x, pos.y);
    }
    prevX = pos.x;
    prevY = pos.y;
  }

  function onPointerUp(e) {
    drawing = false;
    prevX = null;
    prevY = null;
  }

  /* ── 控件事件 ── */
  function updateAxisDisplay() {
    document.getElementById("axis-display").textContent = axes;
  }

  function initControls() {
    document.getElementById("axis-minus").addEventListener("click", function() {
      if (axes > 2) { axes--; updateAxisDisplay(); saveState(); }
    });
    document.getElementById("axis-plus").addEventListener("click", function() {
      if (axes < 24) { axes++; updateAxisDisplay(); saveState(); }
    });
    document.getElementById("palette-btn").addEventListener("click", function() {
      paletteIdx = (paletteIdx + 1) % PALETTES.length;
      document.getElementById("palette-btn").textContent = "配色：" + PALETTES[paletteIdx].name;
      saveState();
    });
    document.getElementById("clear-btn").addEventListener("click", function() {
      ctx.clearRect(0, 0, W, H);
      drawnAnything = false;
      tipEl.style.opacity = "1";
    });
  }

  /* ── 初始化 ── */
  function init() {
    loadState();

    canvas = document.getElementById("c");
    ctx = canvas.getContext("2d");
    tipEl = document.getElementById("tip");

    resizeCanvas();
    updateAxisDisplay();
    document.getElementById("palette-btn").textContent = "配色：" + PALETTES[paletteIdx].name;

    /* 鼠标事件 */
    canvas.addEventListener("mousedown", onPointerDown);
    canvas.addEventListener("mousemove", onPointerMove);
    canvas.addEventListener("mouseup", onPointerUp);
    canvas.addEventListener("mouseleave", onPointerUp);

    /* 触摸事件 */
    canvas.addEventListener("touchstart", onPointerDown, { passive: false });
    canvas.addEventListener("touchmove", onPointerMove, { passive: false });
    canvas.addEventListener("touchend", onPointerUp);

    /* 窗口缩放 */
    window.addEventListener("resize", function() {
      /* 保存当前画面 */
      var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      resizeCanvas();
      /* 重绘已有内容（缩放适配） */
      var tmpCanvas = document.createElement("canvas");
      tmpCanvas.width = imgData.width;
      tmpCanvas.height = imgData.height;
      var tmpCtx = tmpCanvas.getContext("2d");
      tmpCtx.putImageData(imgData, 0, 0);
      ctx.drawImage(tmpCanvas, 0, 0, W, H);
    });

    initControls();
    animate();
  }

  init();

})();
</script>
</body>
</html>
