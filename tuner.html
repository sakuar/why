<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调音器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f14;
    --surface: #1a1a24;
    --surface2: #22222f;
    --border: #2e2e40;
    --accent: #7c6dfa;
    --accent2: #a78bfa;
    --accent-glow: rgba(124, 109, 250, 0.35);
    --text: #e8e8f0;
    --text-muted: #7878a0;
    --text-dim: #4a4a6a;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --note-c: #f87171;
    --note-d: #fb923c;
    --note-e: #fbbf24;
    --note-f: #34d399;
    --note-g: #38bdf8;
    --note-a: #a78bfa;
    --note-b: #f472b6;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    min-height: 100vh;
    padding: 0 0 60px 0;
  }

  .back-link {
    display: inline-block;
    padding: 8px 16px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--text); }

  .container {
    max-width: 640px;
    margin: 0 auto;
    padding: 0 16px;
  }

  header {
    text-align: center;
    padding: 16px 0 32px;
  }
  header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  header p {
    margin-top: 6px;
    color: var(--text-muted);
    font-size: 13px;
  }

  /* 当前播放显示区 */
  .display-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .display-card.playing {
    border-color: var(--accent);
    box-shadow: 0 0 32px var(--accent-glow);
  }
  .display-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 0%, rgba(124,109,250,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .note-big {
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    color: var(--accent2);
  }
  .note-big.pop {
    animation: notePop 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes notePop {
    0%   { transform: scale(0.7); opacity: 0.5; }
    60%  { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  .freq-display {
    margin-top: 8px;
    font-size: 32px;
    font-weight: 300;
    color: var(--text);
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
  }
  .freq-display span.unit {
    font-size: 16px;
    color: var(--text-muted);
    margin-left: 3px;
  }

  .note-label {
    margin-top: 6px;
    font-size: 14px;
    color: var(--text-muted);
    height: 20px;
  }

  /* 波形动画 */
  .wave-wrap {
    margin: 16px 0 0;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
  }
  .wave-bar {
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
    opacity: 0.5;
    height: 4px;
    transition: height 0.1s;
  }
  .playing .wave-bar {
    animation: waveAnim 0.8s ease-in-out infinite;
    opacity: 0.8;
  }
  @keyframes waveAnim {
    0%, 100% { height: 4px; }
    50% { height: 28px; }
  }
  .playing .wave-bar:nth-child(1) { animation-delay: 0s; }
  .playing .wave-bar:nth-child(2) { animation-delay: 0.07s; }
  .playing .wave-bar:nth-child(3) { animation-delay: 0.14s; }
  .playing .wave-bar:nth-child(4) { animation-delay: 0.21s; }
  .playing .wave-bar:nth-child(5) { animation-delay: 0.28s; }
  .playing .wave-bar:nth-child(6) { animation-delay: 0.21s; }
  .playing .wave-bar:nth-child(7) { animation-delay: 0.14s; }
  .playing .wave-bar:nth-child(8) { animation-delay: 0.07s; }
  .playing .wave-bar:nth-child(9) { animation-delay: 0s; }

  /* 吉他弦区 */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .guitar-section {
    margin-bottom: 24px;
  }

  .guitar-strings {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }

  .string-row {
    display: flex;
    align-items: center;
    padding: 0 16px;
    height: 60px;
    cursor: pointer;
    position: relative;
    transition: background 0.15s;
    border-bottom: 1px solid var(--border);
  }
  .string-row:last-child { border-bottom: none; }
  .string-row:hover { background: var(--surface2); }
  .string-row.active {
    background: rgba(124,109,250,0.12);
  }
  .string-row:active { transform: none; }

  .string-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-muted);
    flex-shrink: 0;
    transition: all 0.2s;
  }
  .string-row.active .string-num {
    background: var(--accent);
    color: #fff;
  }

  .string-visual {
    flex: 1;
    margin: 0 14px;
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
  }
  .string-line {
    position: absolute;
    left: 0;
    right: 0;
    border-radius: 2px;
    background: linear-gradient(90deg, transparent, var(--text-dim), transparent);
    transition: all 0.2s;
  }
  /* 弦的粗细 */
  .string-row:nth-child(1) .string-line { height: 3px; background: linear-gradient(90deg, transparent, #c8a87a, transparent); }
  .string-row:nth-child(2) .string-line { height: 2.5px; background: linear-gradient(90deg, transparent, #b8b8c8, transparent); }
  .string-row:nth-child(3) .string-line { height: 2px; background: linear-gradient(90deg, transparent, #b8b8c8, transparent); }
  .string-row:nth-child(4) .string-line { height: 1.5px; background: linear-gradient(90deg, transparent, #d0d0e0, transparent); }
  .string-row:nth-child(5) .string-line { height: 1.5px; background: linear-gradient(90deg, transparent, #d0d0e0, transparent); }
  .string-row:nth-child(6) .string-line { height: 1px; background: linear-gradient(90deg, transparent, #e0e0f0, transparent); }

  .string-row.active .string-line {
    background: linear-gradient(90deg, transparent, var(--accent2), transparent) !important;
    animation: stringVibrate 0.15s ease-in-out infinite alternate;
  }
  @keyframes stringVibrate {
    from { transform: translateY(-1.5px); }
    to   { transform: translateY(1.5px); }
  }

  .string-info {
    text-align: right;
    flex-shrink: 0;
    min-width: 80px;
  }
  .string-note {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    transition: color 0.2s;
  }
  .string-row.active .string-note { color: var(--accent2); }
  .string-freq {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }

  .string-row .play-hint {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity 0.15s;
    color: var(--accent);
    font-size: 18px;
  }

  /* 音名键盘区 */
  .notes-section {
    margin-bottom: 24px;
  }

  .notes-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }

  .note-btn {
    aspect-ratio: 1;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0px;
    transition: transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s, filter 0.2s;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .note-btn .note-hz {
    font-size: 9px;
    font-weight: 400;
    opacity: 0.75;
    letter-spacing: 0;
  }
  .note-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.15);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .note-btn:hover::after { opacity: 1; }
  .note-btn:active { transform: scale(0.93); }
  .note-btn.active-note {
    transform: scale(1.06);
    box-shadow: 0 0 18px 4px rgba(255,255,255,0.2);
    filter: brightness(1.15);
  }

  .note-c { background: linear-gradient(135deg, #f87171, #ef4444); color: #fff; }
  .note-d { background: linear-gradient(135deg, #fb923c, #f97316); color: #fff; }
  .note-e { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #1a1a10; }
  .note-f { background: linear-gradient(135deg, #34d399, #10b981); color: #0a2010; }
  .note-g { background: linear-gradient(135deg, #38bdf8, #0ea5e9); color: #051520; }
  .note-a { background: linear-gradient(135deg, #a78bfa, #8b5cf6); color: #fff; }
  .note-b { background: linear-gradient(135deg, #f472b6, #ec4899); color: #fff; }

  /* 八度选择 */
  .octave-section {
    margin-bottom: 24px;
  }
  .octave-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .octave-btn {
    padding: 8px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .octave-btn:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  .octave-btn.active-oct {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  /* 音量/时长控制 */
  .controls-section {
    margin-bottom: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  .controls-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }
  .controls-row:last-child { margin-bottom: 0; }
  .ctrl-label {
    font-size: 12px;
    color: var(--text-muted);
    width: 54px;
    flex-shrink: 0;
  }
  .ctrl-slider {
    flex: 1;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  .ctrl-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent2);
    cursor: pointer;
    box-shadow: 0 0 6px var(--accent-glow);
    transition: transform 0.15s;
  }
  .ctrl-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .ctrl-val {
    font-size: 12px;
    color: var(--text-muted);
    width: 36px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* 音色选择 */
  .timbre-section {
    margin-bottom: 24px;
  }
  .timbre-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .timbre-btn {
    padding: 8px 18px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .timbre-btn:hover { border-color: var(--accent); color: var(--text); }
  .timbre-btn.active-timbre {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--accent2);
  }

  /* 标准音参考 */
  .ref-section {
    margin-bottom: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
  }
  .ref-label { font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
  .ref-val {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent2);
    font-variant-numeric: tabular-nums;
    min-width: 70px;
  }
  .ref-slider {
    flex: 1;
    min-width: 140px;
    -webkit-appearance: none;
    appearance: none;
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  .ref-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent2);
    cursor: pointer;
    box-shadow: 0 0 6px var(--accent-glow);
    transition: transform 0.15s;
  }
  .ref-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
  .ref-reset {
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    color: var(--text-muted);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .ref-reset:hover { border-color: var(--accent); color: var(--text); }

  /* 持续/单次模式 */
  .mode-toggle {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    width: fit-content;
    margin-bottom: 24px;
  }
  .mode-btn {
    padding: 8px 20px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
  }
  .mode-btn.active-mode {
    background: var(--accent);
    color: #fff;
  }

  /* 停止按钮 */
  .stop-btn {
    display: none;
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 40px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 24px var(--accent-glow);
    transition: all 0.2s;
    z-index: 100;
    letter-spacing: 1px;
  }
  .stop-btn.visible { display: block; animation: fadeUp 0.3s ease; }
  .stop-btn:hover { background: var(--accent2); transform: translateX(-50%) scale(1.04); }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateX(-50%) translateY(16px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  /* 历史记录 */
  .history-section {
    margin-bottom: 16px;
  }
  .history-list {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    min-height: 32px;
  }
  .history-chip {
    padding: 4px 12px;
    border-radius: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    font-variant-numeric: tabular-nums;
  }
  .history-chip:hover { border-color: var(--accent); color: var(--text); }

  @media (max-width: 480px) {
    header h1 { font-size: 22px; }
    .note-big { font-size: 54px; }
    .freq-display { font-size: 24px; }
    .notes-grid { grid-template-columns: repeat(7, 1fr); gap: 5px; }
    .note-btn { font-size: 14px; border-radius: 8px; }
    .note-btn .note-hz { font-size: 8px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="container">
  <header>
    <h1>调音器</h1>
    <p>吉他标准调音 · 通用音名参考</p>
  </header>

  <!-- 显示区 -->
  <div class="display-card" id="displayCard">
    <div class="note-big" id="noteBig">--</div>
    <div class="freq-display" id="freqDisplay">-- <span class="unit">Hz</span></div>
    <div class="note-label" id="noteLabel">点击下方按键开始播放</div>
    <div class="wave-wrap" id="waveWrap">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
  </div>

  <!-- 标准音A4设置 -->
  <div class="ref-section">
    <span class="ref-label">标准音 A4</span>
    <span class="ref-val" id="refVal">440 Hz</span>
    <input type="range" class="ref-slider" id="refSlider" min="430" max="450" value="440" step="1">
    <button class="ref-reset" id="refReset">重置</button>
  </div>

  <!-- 播放模式 -->
  <div class="mode-toggle" id="modeToggle">
    <button class="mode-btn active-mode" data-mode="hold">长按持续</button>
    <button class="mode-btn" data-mode="once">单次短音</button>
    <button class="mode-btn" data-mode="loop">循环</button>
  </div>

  <!-- 音色 -->
  <div class="timbre-section">
    <div class="section-title">音色</div>
    <div class="timbre-btns" id="timbreBtns">
      <button class="timbre-btn active-timbre" data-timbre="sine">纯音</button>
      <button class="timbre-btn" data-timbre="triangle">三角波</button>
      <button class="timbre-btn" data-timbre="sawtooth">锯齿波</button>
      <button class="timbre-btn" data-timbre="guitar">拨弦</button>
    </div>
  </div>

  <!-- 音量时长 -->
  <div class="controls-section">
    <div class="controls-row">
      <span class="ctrl-label">音量</span>
      <input type="range" class="ctrl-slider" id="volSlider" min="0" max="100" value="70" step="1">
      <span class="ctrl-val" id="volVal">70%</span>
    </div>
    <div class="controls-row">
      <span class="ctrl-label">持续</span>
      <input type="range" class="ctrl-slider" id="durSlider" min="500" max="5000" value="2000" step="100">
      <span class="ctrl-val" id="durVal">2.0s</span>
    </div>
  </div>

  <!-- 吉他六弦 -->
  <div class="guitar-section">
    <div class="section-title">吉他标准六弦</div>
    <div class="guitar-strings" id="guitarStrings">
      <div class="string-row" data-note="E2" data-string="1">
        <div class="string-num">6</div>
        <div class="string-visual"><div class="string-line"></div></div>
        <div class="string-info">
          <div class="string-note">E2</div>
          <div class="string-freq" id="sf-E2">82.41 Hz</div>
        </div>
      </div>
      <div class="string-row" data-note="A2" data-string="2">
        <div class="string-num">5</div>
        <div class="string-visual"><div class="string-line"></div></div>
        <div class="string-info">
          <div class="string-note">A2</div>
          <div class="string-freq" id="sf-A2">110.00 Hz</div>
        </div>
      </div>
      <div class="string-row" data-note="D3" data-string="3">
        <div class="string-num">4</div>
        <div class="string-visual"><div class="string-line"></div></div>
        <div class="string-info">
          <div class="string-note">D3</div>
          <div class="string-freq" id="sf-D3">146.83 Hz</div>
        </div>
      </div>
      <div class="string-row" data-note="G3" data-string="4">
        <div class="string-num">3</div>
        <div class="string-visual"><div class="string-line"></div></div>
        <div class="string-info">
          <div class="string-note">G3</div>
          <div class="string-freq" id="sf-G3">196.00 Hz</div>
        </div>
      </div>
      <div class="string-row" data-note="B3" data-string="5">
        <div class="string-num">2</div>
        <div class="string-visual"><div class="string-line"></div></div>
        <div class="string-info">
          <div class="string-note">B3</div>
          <div class="string-freq" id="sf-B3">246.94 Hz</div>
        </div>
      </div>
      <div class="string-row" data-note="E4" data-string="6">
        <div class="string-num">1</div>
        <div class="string-visual"><div class="string-line"></div></div>
        <div class="string-info">
          <div class="string-note">E4</div>
          <div class="string-freq" id="sf-E4">329.63 Hz</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 八度选择 -->
  <div class="octave-section">
    <div class="section-title">八度</div>
    <div class="octave-btns" id="octaveBtns">
      <button class="octave-btn" data-oct="2">2</button>
      <button class="octave-btn" data-oct="3">3</button>
      <button class="octave-btn active-oct" data-oct="4">4</button>
      <button class="octave-btn" data-oct="5">5</button>
      <button class="octave-btn" data-oct="6">6</button>
    </div>
  </div>

  <!-- 音名按键 -->
  <div class="notes-section">
    <div class="section-title">音名（C大调）</div>
    <div class="notes-grid" id="notesGrid">
      <button class="note-btn note-c" data-note="C"><span>C</span><span class="note-hz" id="nhz-C">261.6</span></button>
      <button class="note-btn note-d" data-note="D"><span>D</span><span class="note-hz" id="nhz-D">293.7</span></button>
      <button class="note-btn note-e" data-note="E"><span>E</span><span class="note-hz" id="nhz-E">329.6</span></button>
      <button class="note-btn note-f" data-note="F"><span>F</span><span class="note-hz" id="nhz-F">349.2</span></button>
      <button class="note-btn note-g" data-note="G"><span>G</span><span class="note-hz" id="nhz-G">392.0</span></button>
      <button class="note-btn note-a" data-note="A"><span>A</span><span class="note-hz" id="nhz-A">440.0</span></button>
      <button class="note-btn note-b" data-note="B"><span>B</span><span class="note-hz" id="nhz-B">493.9</span></button>
    </div>
  </div>

  <!-- 最近播放 -->
  <div class="history-section">
    <div class="section-title">最近播放</div>
    <div class="history-list" id="historyList"></div>
  </div>

</div>

<!-- 停止按钮 -->
<button class="stop-btn" id="stopBtn">■ 停止</button>

<script>
(function () {
  "use strict";

  // ---- 常量 ----
  const NOTE_SEMITONES = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  const NOTE_LABELS_CN = { C: 'Do', D: 'Re', E: 'Mi', F: 'Fa', G: 'Sol', A: 'La', B: 'Si' };
  const GUITAR_STRINGS = [
    { note: 'E', octave: 2, label: 'E2', strNum: 6 },
    { note: 'A', octave: 2, label: 'A2', strNum: 5 },
    { note: 'D', octave: 3, label: 'D3', strNum: 4 },
    { note: 'G', octave: 3, label: 'G3', strNum: 3 },
    { note: 'B', octave: 3, label: 'B3', strNum: 2 },
    { note: 'E', octave: 4, label: 'E4', strNum: 1 },
  ];

  // ---- 状态 ----
  let audioCtx = null;
  let currentNode = null;
  let currentGain = null;
  let loopTimeout = null;
  let isPlaying = false;
  let currentMode = 'hold';
  let currentTimbre = 'sine';
  let currentOctave = 4;
  let a4Freq = 440;
  let volume = 0.7;
  let duration = 2000;
  let history = [];
  let activeNoteKey = null;
  let holdTimer = null;

  // ---- DOM 引用 ----
  const displayCard   = document.getElementById('displayCard');
  const noteBig       = document.getElementById('noteBig');
  const freqDisplay   = document.getElementById('freqDisplay');
  const noteLabel     = document.getElementById('noteLabel');
  const stopBtn       = document.getElementById('stopBtn');
  const refSlider     = document.getElementById('refSlider');
  const refVal        = document.getElementById('refVal');
  const refReset      = document.getElementById('refReset');
  const volSlider     = document.getElementById('volSlider');
  const volVal        = document.getElementById('volVal');
  const durSlider     = document.getElementById('durSlider');
  const durVal        = document.getElementById('durVal');
  const historyList   = document.getElementById('historyList');
  const modeToggle    = document.getElementById('modeToggle');
  const timbreBtns    = document.getElementById('timbreBtns');
  const octaveBtns    = document.getElementById('octaveBtns');
  const notesGrid     = document.getElementById('notesGrid');
  const guitarStrings = document.getElementById('guitarStrings');

  // ---- 音频工具 ----
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function calcFreq(note, octave) {
    const semitone = NOTE_SEMITONES[note];
    const a4Semitone = NOTE_SEMITONES['A'] + (4 - octave) * 12;
    const diff = semitone - a4Semitone;
    return a4Freq * Math.pow(2, diff / 12);
  }

  function stopSound() {
    if (loopTimeout) { clearTimeout(loopTimeout); loopTimeout = null; }
    if (currentGain) {
      try {
        currentGain.gain.cancelScheduledValues(audioCtx.currentTime);
        currentGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
      } catch(e) {}
    }
    if (currentNode) {
      try { currentNode.stop(audioCtx ? audioCtx.currentTime + 0.1 : 0); } catch(e) {}
      currentNode = null;
    }
    currentGain = null;
    isPlaying = false;
    activeNoteKey = null;
    displayCard.classList.remove('playing');
    stopBtn.classList.remove('visible');
    clearActiveNotes();
  }

  function clearActiveNotes() {
    document.querySelectorAll('.string-row.active').forEach(function(el) { el.classList.remove('active'); });
    document.querySelectorAll('.note-btn.active-note').forEach(function(el) { el.classList.remove('active-note'); });
  }

  function makeSineOsc(ctx, freq, gainNode) {
    var osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.connect(gainNode);
    return osc;
  }

  function makeTriangleOsc(ctx, freq, gainNode) {
    var osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.connect(gainNode);
    return osc;
  }

  function makeSawOsc(ctx, freq, gainNode) {
    var osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    osc.connect(gainNode);
    return osc;
  }

  function makeGuitarOsc(ctx, freq, gainNode) {
    // Karplus-Strong风格：用多个正弦叠加模拟拨弦
    var merger = ctx.createGain();
    merger.gain.value = 1;
    merger.connect(gainNode);
    var harmonics = [1, 2, 3, 4, 5, 6];
    var amps = [1, 0.5, 0.3, 0.15, 0.08, 0.04];
    var oscs = [];
    for (var i = 0; i < harmonics.length; i++) {
      var o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * harmonics[i], ctx.currentTime);
      var g = ctx.createGain();
      g.gain.setValueAtTime(amps[i] / 2, ctx.currentTime);
      o.connect(g);
      g.connect(merger);
      oscs.push(o);
    }
    // 返回一个代理对象，统一管理start/stop
    return {
      start: function(t) { oscs.forEach(function(o) { o.start(t); }); },
      stop: function(t) { oscs.forEach(function(o) { try { o.stop(t); } catch(e) {} }); }
    };
  }

  function playNote(note, octave, label) {
    stopSound();
    var ctx = getAudioCtx();
    var freq = calcFreq(note, octave);
    var gn = ctx.createGain();
    var now = ctx.currentTime;
    gn.gain.setValueAtTime(0, now);
    gn.gain.linearRampToValueAtTime(volume, now + 0.015);
    gn.connect(ctx.destination);

    var node;
    if (currentTimbre === 'sine') {
      node = makeSineOsc(ctx, freq, gn);
    } else if (currentTimbre === 'triangle') {
      node = makeTriangleOsc(ctx, freq, gn);
    } else if (currentTimbre === 'sawtooth') {
      node = makeSawOsc(ctx, freq, gn);
    } else {
      node = makeGuitarOsc(ctx, freq, gn);
    }

    if (currentMode === 'hold') {
      node.start(now);
      currentNode = node;
      currentGain = gn;
      isPlaying = true;
    } else if (currentMode === 'once') {
      var durSec = duration / 1000;
      gn.gain.setValueAtTime(volume, now + 0.015);
      gn.gain.exponentialRampToValueAtTime(0.001, now + durSec);
      node.start(now);
      try { node.stop(now + durSec + 0.1); } catch(e) {}
      currentNode = node;
      currentGain = gn;
      isPlaying = true;
      loopTimeout = setTimeout(function() {
        isPlaying = false;
        activeNoteKey = null;
        displayCard.classList.remove('playing');
        stopBtn.classList.remove('visible');
        clearActiveNotes();
        loopTimeout = null;
      }, (durSec + 0.15) * 1000);
    } else if (currentMode === 'loop') {
      var lDur = duration / 1000;
      gn.gain.setValueAtTime(volume, now + 0.015);
      gn.gain.exponentialRampToValueAtTime(0.001, now + lDur);
      node.start(now);
      try { node.stop(now + lDur + 0.1); } catch(e) {}
      currentNode = node;
      currentGain = gn;
      isPlaying = true;
      loopTimeout = setTimeout(function() {
        if (isPlaying && activeNoteKey) {
          var parts = activeNoteKey.split('-');
          playNote(parts[0], parseInt(parts[1], 10), label);
        }
      }, (lDur + 0.3) * 1000);
    }

    // 更新UI
    displayCard.classList.add('playing');
    stopBtn.classList.add('visible');
    activeNoteKey = note + '-' + octave;

    var freqRounded = freq.toFixed(2);
    noteBig.textContent = label || (note + octave);
    freqDisplay.innerHTML = freqRounded + ' <span class="unit">Hz</span>';
    noteLabel.textContent = NOTE_LABELS_CN[note] + ' · ' + note + octave + ' · ' + (octave < 3 ? '低音区' : octave < 5 ? '中音区' : '高音区');

    // 音名大字动画
    noteBig.classList.remove('pop');
    void noteBig.offsetWidth;
    noteBig.classList.add('pop');

    addHistory(label || (note + octave), freqRounded);
  }

  // ---- 历史记录 ----
  function addHistory(label, freq) {
    history.unshift({ label: label, freq: freq });
    if (history.length > 12) { history = history.slice(0, 12); }
    try { localStorage.setItem('tuner_history', JSON.stringify(history)); } catch(e) {}
    renderHistory();
  }

  function renderHistory() {
    historyList.innerHTML = '';
    if (history.length === 0) {
      historyList.innerHTML = '<span style="color:var(--text-dim);font-size:12px;">暂无记录</span>';
      return;
    }
    history.forEach(function(item) {
      var chip = document.createElement('button');
      chip.className = 'history-chip';
      chip.textContent = item.label + ' ' + item.freq + 'Hz';
      chip.addEventListener('click', function() {
        // 解析历史item并播放
        var noteMatch = item.label.match(/^([A-G])(\d)$/);
        if (noteMatch) {
          var n = noteMatch[1];
          var o = parseInt(noteMatch[2], 10);
          clearActiveNotes();
          playNote(n, o, item.label);
        }
      });
      historyList.appendChild(chip);
    });
  }

  function loadHistory() {
    try {
      var stored = localStorage.getItem('tuner_history');
      if (stored) { history = JSON.parse(stored); }
    } catch(e) {}
    renderHistory();
  }

  // ---- 频率显示更新 ----
  function updateAllFreqDisplays() {
    // 吉他弦频率
    GUITAR_STRINGS.forEach(function(gs) {
      var f = calcFreq(gs.note, gs.octave).toFixed(2);
      var el = document.getElementById('sf-' + gs.label);
      if (el) { el.textContent = f + ' Hz'; }
    });
    // 音名按钮频率
    ['C','D','E','F','G','A','B'].forEach(function(n) {
      var f = calcFreq(n, currentOctave).toFixed(1);
      var el = document.getElementById('nhz-' + n);
      if (el) { el.textContent = f; }
    });
  }

  // ---- 事件绑定 ----

  // 停止按钮
  stopBtn.addEventListener('click', function() { stopSound(); });

  // A4参考频率
  refSlider.addEventListener('input', function() {
    a4Freq = parseInt(this.value, 10);
    refVal.textContent = a4Freq + ' Hz';
    updateAllFreqDisplays();
    try { localStorage.setItem('tuner_a4', a4Freq); } catch(e) {}
  });

  refReset.addEventListener('click', function() {
    a4Freq = 440;
    refSlider.value = 440;
    refVal.textContent = '440 Hz';
    updateAllFreqDisplays();
    try { localStorage.setItem('tuner_a4', 440); } catch(e) {}
  });

  // 音量
  volSlider.addEventListener('input', function() {
    volume = parseInt(this.value, 10) / 100;
    volVal.textContent = this.value + '%';
    if (currentGain && isPlaying) {
      try { currentGain.gain.setTargetAtTime(volume, audioCtx.currentTime, 0.05); } catch(e) {}
    }
    try { localStorage.setItem('tuner_vol', this.value); } catch(e) {}
  });

  // 时长
  durSlider.addEventListener('input', function() {
    duration = parseInt(this.value, 10);
    durVal.textContent = (duration / 1000).toFixed(1) + 's';
    try { localStorage.setItem('tuner_dur', this.value); } catch(e) {}
  });

  // 播放模式
  modeToggle.addEventListener('click', function(e) {
    var btn = e.target.closest('.mode-btn');
    if (!btn) { return; }
    currentMode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('active-mode'); });
    btn.classList.add('active-mode');
    stopSound();
    try { localStorage.setItem('tuner_mode', currentMode); } catch(e) {}
  });

  // 音色
  timbreBtns.addEventListener('click', function(e) {
    var btn = e.target.closest('.timbre-btn');
    if (!btn) { return; }
    currentTimbre = btn.dataset.timbre;
    document.querySelectorAll('.timbre-btn').forEach(function(b) { b.classList.remove('active-timbre'); });
    btn.classList.add('active-timbre');
    stopSound();
    try { localStorage.setItem('tuner_timbre', currentTimbre); } catch(e) {}
  });

  // 八度
  octaveBtns.addEventListener('click', function(e) {
    var btn = e.target.closest('.octave-btn');
    if (!btn) { return; }
    currentOctave = parseInt(btn.dataset.oct, 10);
    document.querySelectorAll('.octave-btn').forEach(function(b) { b.classList.remove('active-oct'); });
    btn.classList.add('active-oct');
    stopSound();
    updateAllFreqDisplays();
    try { localStorage.setItem('tuner_oct', currentOctave); } catch(e) {}
  });

  // 音名按钮 - 支持长按
  notesGrid.addEventListener('mousedown', function(e) {
    var btn = e.target.closest('.note-btn');
    if (!btn) { return; }
    var note = btn.dataset.note;
    clearActiveNotes();
    btn.classList.add('active-note');
    playNote(note, currentOctave, note + currentOctave);
  });

  notesGrid.addEventListener('touchstart', function(e) {
    var btn = e.target.closest('.note-btn');
    if (!btn) { return; }
    e.preventDefault();
    var note = btn.dataset.note;
    clearActiveNotes();
    btn.classList.add('active-note');
    playNote(note, currentOctave, note + currentOctave);
  }, { passive: false });

  notesGrid.addEventListener('mouseup', function() {
    if (currentMode === 'hold') { stopSound(); }
  });
  notesGrid.addEventListener('mouseleave', function(e) {
    if (currentMode === 'hold' && isPlaying) { stopSound(); }
  });
  notesGrid.addEventListener('touchend', function() {
    if (currentMode === 'hold') { stopSound(); }
  });

  // 吉他弦 - 支持长按
  guitarStrings.addEventListener('mousedown', function(e) {
    var row = e.target.closest('.string-row');
    if (!row) { return; }
    var noteLabel2 = row.dataset.note;
    var noteMatch = noteLabel2.match(/^([A-G])(\d)$/);
    if (!noteMatch) { return; }
    clearActiveNotes();
    row.classList.add('active');
    playNote(noteMatch[1], parseInt(noteMatch[2], 10), noteLabel2);
  });

  guitarStrings.addEventListener('touchstart', function(e) {
    var row = e.target.closest('.string-row');
    if (!row) { return; }
    e.preventDefault();
    var noteLabel2 = row.dataset.note;
    var noteMatch = noteLabel2.match(/^([A-G])(\d)$/);
    if (!noteMatch) { return; }
    clearActiveNotes();
    row.classList.add('active');
    playNote(noteMatch[1], parseInt(noteMatch[2], 10), noteLabel2);
  }, { passive: false });

  guitarStrings.addEventListener('mouseup', function() {
    if (currentMode === 'hold') { stopSound(); }
  });
  guitarStrings.addEventListener('mouseleave', function() {
    if (currentMode === 'hold' && isPlaying) { stopSound(); }
  });
  guitarStrings.addEventListener('touchend', function() {
    if (currentMode === 'hold') { stopSound(); }
  });

  // 键盘支持
  var KEY_MAP = {
    'a': 'C', 's': 'D', 'd': 'E', 'f': 'F',
    'g': 'G', 'h': 'A', 'j': 'B'
  };
  document.addEventListener('keydown', function(e) {
    if (e.repeat) { return; }
    if (e.target.tagName === 'INPUT') { return; }
    var note = KEY_MAP[e.key.toLowerCase()];
    if (note) {
      clearActiveNotes();
      var btn = notesGrid.querySelector('[data-note="' + note + '"]');
      if (btn) { btn.classList.add('active-note'); }
      playNote(note, currentOctave, note + currentOctave);
    }
    if (e.key === ' ') { e.preventDefault(); stopSound(); }
  });
  document.addEventListener('keyup', function(e) {
    if (currentMode === 'hold') {
      var note = KEY_MAP[e.key.toLowerCase()];
      if (note) { stopSound(); }
    }
  });

  // ---- 持久化读取 ----
  function loadSettings() {
    try {
      var savedA4 = localStorage.getItem('tuner_a4');
      if (savedA4) {
        a4Freq = parseInt(savedA4, 10);
        refSlider.value = a4Freq;
        refVal.textContent = a4Freq + ' Hz';
      }
      var savedVol = localStorage.getItem('tuner_vol');
      if (savedVol) {
        volSlider.value = savedVol;
        volume = parseInt(savedVol, 10) / 100;
        volVal.textContent = savedVol + '%';
      }
      var savedDur = localStorage.getItem('tuner_dur');
      if (savedDur) {
        durSlider.value = savedDur;
        duration = parseInt(savedDur, 10);
        durVal.textContent = (duration / 1000).toFixed(1) + 's';
      }
      var savedMode = localStorage.getItem('tuner_mode');
      if (savedMode) {
        currentMode = savedMode;
        document.querySelectorAll('.mode-btn').forEach(function(b) {
          b.classList.toggle('active-mode', b.dataset.mode === currentMode);
        });
      }
      var savedTimbre = localStorage.getItem('tuner_timbre');
      if (savedTimbre) {
        currentTimbre = savedTimbre;
        document.querySelectorAll('.timbre-btn').forEach(function(b) {
          b.classList.toggle('active-timbre', b.dataset.timbre === currentTimbre);
        });
      }
      var savedOct = localStorage.getItem('tuner_oct');
      if (savedOct) {
        currentOctave = parseInt(savedOct, 10);
        document.querySelectorAll('.octave-btn').forEach(function(b) {
          b.classList.toggle('active-oct', parseInt(b.dataset.oct, 10) === currentOctave);
        });
      }
    } catch(e) {}
  }

  // ---- 初始化 ----
  loadSettings();
  loadHistory();
  updateAllFreqDisplays();

})();
</script>
</body>
</html>
