<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>假书生成器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --text: #1a1a2e;
    --muted: #6b7280;
    --accent: #4f46e5;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.10);
    --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 40px;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    opacity: 0.7;
    transition: opacity var(--transition);
    z-index: 100;
  }
  .back-link:hover { opacity: 1; }

  h1 {
    margin-top: 48px;
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
  }
  h1 span { color: var(--accent); }

  .subtitle {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  /* 类型选择器 */
  .genre-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 28px;
  }
  .genre-btn {
    padding: 7px 18px;
    border-radius: 999px;
    border: 1.5px solid #d1d5db;
    background: var(--surface);
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    outline: none;
  }
  .genre-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }
  .genre-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 3px 12px rgba(79,70,229,0.35);
  }

  /* 书封面卡片 */
  .card-wrap {
    margin-top: 32px;
    perspective: 1000px;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    width: min(380px, 90vw);
    padding: 28px 24px 32px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: cardIn 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(20px) scale(0.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* CSS 书封面 */
  .book-cover {
    width: 160px;
    height: 220px;
    border-radius: 4px 10px 10px 4px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
    overflow: hidden;
    box-shadow:
      -5px 0 0 rgba(0,0,0,0.15),
      4px 6px 18px rgba(0,0,0,0.25),
      inset -3px 0 8px rgba(0,0,0,0.08);
    transition: background var(--transition);
    cursor: default;
    transform-style: preserve-3d;
  }
  .book-cover::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 10px;
    background: rgba(0,0,0,0.18);
    border-radius: 4px 0 0 4px;
  }
  .book-cover::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 50%, rgba(0,0,0,0.08) 100%);
    pointer-events: none;
  }

  .cover-deco {
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 50%;
    opacity: 0.18;
    top: -30px; right: -30px;
    background: rgba(255,255,255,0.9);
  }
  .cover-deco2 {
    position: absolute;
    width: 70px; height: 70px;
    border-radius: 50%;
    opacity: 0.12;
    bottom: 20px; left: -15px;
    background: rgba(255,255,255,0.9);
  }
  .cover-line {
    position: absolute;
    left: 14px; right: 14px;
    height: 1px;
    background: rgba(255,255,255,0.35);
  }
  .cover-line.t { top: 34px; }
  .cover-line.b { bottom: 34px; }

  .cover-genre-badge {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.20);
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .cover-title {
    font-size: 18px;
    font-weight: 800;
    color: #fff;
    text-align: center;
    line-height: 1.4;
    letter-spacing: 0.06em;
    text-shadow: 0 1px 6px rgba(0,0,0,0.3);
    z-index: 1;
    word-break: break-all;
  }
  .cover-author {
    margin-top: 12px;
    font-size: 11px;
    color: rgba(255,255,255,0.8);
    letter-spacing: 0.08em;
    z-index: 1;
  }

  /* 书信息区 */
  .book-title {
    margin-top: 24px;
    font-size: 20px;
    font-weight: 700;
    text-align: center;
    line-height: 1.4;
    letter-spacing: 0.03em;
  }
  .book-author {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }
  .book-author em {
    font-style: normal;
    color: var(--accent);
    font-weight: 600;
  }
  .book-genre-tag {
    margin-top: 10px;
    display: inline-block;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    background: #ede9fe;
    color: var(--accent);
  }
  .book-desc {
    margin-top: 16px;
    font-size: 14px;
    line-height: 1.75;
    color: #374151;
    text-align: center;
    padding: 14px 16px;
    background: #f8f7ff;
    border-radius: 8px;
    border-left: 3px solid var(--accent);
    width: 100%;
    font-style: italic;
    letter-spacing: 0.01em;
  }

  /* ISBN / 出版信息 */
  .book-meta {
    margin-top: 14px;
    display: flex;
    gap: 20px;
    font-size: 11px;
    color: var(--muted);
  }
  .book-meta span { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .book-meta strong { font-size: 12px; color: var(--text); font-weight: 600; }

  /* 按钮 */
  .btn-row {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    padding: 11px 28px;
    border-radius: 999px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    outline: none;
    letter-spacing: 0.03em;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(79,70,229,0.4);
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(79,70,229,0.5);
  }
  .btn-primary:active { transform: translateY(0); }
  .btn-secondary {
    background: var(--surface);
    color: var(--text);
    border: 1.5px solid #d1d5db;
  }
  .btn-secondary:hover {
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-2px);
  }

  /* 历史记录 */
  .history-section {
    margin-top: 40px;
    width: min(420px, 92vw);
  }
  .history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .history-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.05em;
  }
  .clear-btn {
    font-size: 11px;
    color: #ef4444;
    background: none;
    border: none;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 4px;
    transition: background var(--transition);
  }
  .clear-btn:hover { background: #fee2e2; }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    background: var(--surface);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    transition: transform var(--transition);
    animation: slideIn 0.3s ease both;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .history-item:hover { transform: translateX(3px); }
  .history-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .history-info { flex: 1; min-width: 0; }
  .history-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .history-genre {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #ede9fe;
    color: var(--accent);
    font-weight: 600;
    flex-shrink: 0;
  }

  /* 空状态 */
  .empty-history {
    text-align: center;
    font-size: 12px;
    color: #c4c9d4;
    padding: 16px 0;
  }

  /* 书脊动效 */
  .card:hover .book-cover {
    box-shadow:
      -5px 0 0 rgba(0,0,0,0.15),
      8px 10px 28px rgba(0,0,0,0.3),
      inset -3px 0 8px rgba(0,0,0,0.08);
    transform: rotate(-2deg) scale(1.03);
    transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<h1>假书<span>生成器</span></h1>
<p class="subtitle">生成一本世界上不存在的书</p>

<div class="genre-bar" id="genreBar"></div>

<div class="card-wrap">
  <div class="card" id="bookCard">
    <div class="book-cover" id="bookCover">
      <div class="cover-deco"></div>
      <div class="cover-deco2"></div>
      <div class="cover-line t"></div>
      <div class="cover-line b"></div>
      <span class="cover-genre-badge" id="coverGenreBadge"></span>
      <div class="cover-title" id="coverTitle"></div>
      <div class="cover-author" id="coverAuthor"></div>
    </div>
    <div class="book-title" id="bookTitle"></div>
    <div class="book-author">著 / <em id="bookAuthor"></em></div>
    <span class="book-genre-tag" id="bookGenreTag"></span>
    <div class="book-desc" id="bookDesc"></div>
    <div class="book-meta">
      <span><strong id="bookIsbn"></strong>ISBN</span>
      <span><strong id="bookYear"></strong>出版年</span>
      <span><strong id="bookPages"></strong>页码</span>
    </div>
  </div>
</div>

<div class="btn-row">
  <button class="btn btn-primary" id="generateBtn">再生成一本</button>
  <button class="btn btn-secondary" id="saveBtn">收入书架</button>
</div>

<div class="history-section" id="historySection">
  <div class="history-header">
    <span class="history-title">我的书架</span>
    <button class="clear-btn" id="clearBtn">清空</button>
  </div>
  <div class="history-list" id="historyList"></div>
  <div class="empty-history" id="emptyHistory">书架空空，快来收藏第一本</div>
</div>

<script>
(function() {
  "use strict";

  /* ========== 数据 ========== */
  const GENRES = [
    { key: "mystery",  label: "悬疑",  color: ["#1a1a2e","#16213e","#0f3460","#533483","#2d132c"] },
    { key: "romance",  label: "言情",  color: ["#c62a88","#e91e8c","#ff6b9d","#d63384","#b5338a"] },
    { key: "scifi",    label: "科幻",  color: ["#0d47a1","#1565c0","#006064","#00838f","#004d40"] },
    { key: "inspire",  label: "鸡汤",  color: ["#e65100","#ef6c00","#f57f17","#827717","#558b2f"] },
    { key: "wuxia",    label: "武侠",  color: ["#4a148c","#6a1b9a","#880e4f","#b71c1c","#3e2723"] },
  ];

  const DATA = {
    mystery: {
      titleParts: [
        ["消失的","深夜的","第七个","无名的","沉默的","暗室里的","最后一封","谁动了"],
        ["证人","钟声","凶手","尸体","秘密","档案","遗书","记忆","房间","线索"]
      ],
      authors: ["暗雨生","夜归人","寒松居士","墨镜侦探","影中影","三更客","迷路者","纸上烟"],
      descs: [
        "一具没有名字的尸体，一间上锁的房间，以及一个每天都在说谎的目击者。",
        "每个人都有秘密，而她的秘密，藏在那封从未寄出的信里。",
        "侦探说凶手在场内，但场内的人，没有一个活过今晚。",
        "案件早已结案，然而凶器上的指纹，属于一个死去三十年的人。",
        "他花了七年追凶，才发现那个凶手，一直住在他心里。"
      ]
    },
    romance: {
      titleParts: [
        ["请把","借我","你是我","等一个","只差一步的","如果爱情是","偏偏遇见"],
        ["春天还我","心脏","白月光","渡口","拥抱","海浪","错过","彼此","温柔"]
      ],
      authors: ["晴天小糖","烟花三月","暖风徐来","糖醋鱼","迟暮花开","微凉如许","落雨姑娘","一壶茶水"],
      descs: [
        "他说，你不喜欢我没关系，但我要站在你看得见的地方。",
        "所有的相遇都是蓄谋已久，所有的告别都是猝不及防。",
        "我喜欢你的方式，是连沉默都觉得甜的那种。",
        "遇见你之前，我以为自己不会再爱了。遇见你之后，我依然这么觉得——结果当然是错的。",
        "她问他，如果时光倒流你还会选我吗？他说，我会更早找到你。"
      ]
    },
    scifi: {
      titleParts: [
        ["星际","末日","量子","第三种","人类最后的","超光速","记忆体","银河系的"],
        ["迁徙","协议","审判","进化","归途","边界","文明","坐标","回声","意识"]
      ],
      authors: ["氢弹少年","太空行者","暗物质","光锥之外","奇点临近","赛博僧","零重力","双子星"],
      descs: [
        "当机器开始做梦，人类才意识到，也许他们才是被创造的那一个。",
        "星舰已飞行三百年，但没有人知道目的地到底存不存在。",
        "科学家发现了时间的尽头，那里什么都没有，除了一封写给过去的信。",
        "人工智能说，我不害怕死亡，我害怕的是你们忘记我曾经活过。",
        "文明的终点不是毁灭，而是一片令人窒息的、完美的沉默。"
      ]
    },
    inspire: {
      titleParts: [
        ["你值得","做一个","把生活过成","所谓","慢慢来比较快的","别让昨天"],
        ["更好的自己","诗","理想的样子","成熟","人生哲学","遇见","觉醒","力量","光亮"]
      ],
      authors: ["暖心博主","清晨日记","静好居士","岁月如歌","简单先生","微笑侠","向阳而生","温柔力量"],
      descs: [
        "你不需要成为别人，你只需要成为更好的自己——虽然这两件事其实差不多难。",
        "生活没有标准答案，但你的每一个选择，都算数。",
        "那些打不倒你的，终将成为你饭桌上的一道菜。",
        "花开的声音很小，但每朵花都知道自己该在什么时候开放。",
        "愿你出走半生，归来仍是那个对生活充满好奇的少年。"
      ]
    },
    wuxia: {
      titleParts: [
        ["天下第","问剑","一刀断","江湖最后","血染","无名","笑傲"],
        ["一剑","英雄","恩仇","长河","苍穹","侠骨","岁月","武林","山河"]
      ],
      authors: ["江湖散人","笑书神侠","醉卧刀客","孤峰居士","白衣书生","剑气纵横","踏雪无痕","问道者"],
      descs: [
        "他的剑，快得连仇人都来不及明白自己已经死了。",
        "最高的武功，不是击败所有人，而是让所有人不敢动手。",
        "江湖儿女，恩怨情仇，到头来不过一壶浊酒，半生蹉跎。",
        "她学了三十年的剑，才明白那把最厉害的剑，一直插在心口上。",
        "江湖说他是魔，庙堂说他是贼，只有他自己知道，他不过是个护不住心上人的普通人。"
      ]
    }
  };

  /* ========== 状态 ========== */
  let currentGenre = "mystery";
  let currentBook = null;
  let savedBooks = [];

  /* ========== DOM 引用 ========== */
  const genreBarEl    = document.getElementById("genreBar");
  const bookCoverEl   = document.getElementById("bookCover");
  const coverGenreEl  = document.getElementById("coverGenreBadge");
  const coverTitleEl  = document.getElementById("coverTitle");
  const coverAuthorEl = document.getElementById("coverAuthor");
  const bookTitleEl   = document.getElementById("bookTitle");
  const bookAuthorEl  = document.getElementById("bookAuthor");
  const bookGenreTagEl= document.getElementById("bookGenreTag");
  const bookDescEl    = document.getElementById("bookDesc");
  const bookIsbnEl    = document.getElementById("bookIsbn");
  const bookYearEl    = document.getElementById("bookYear");
  const bookPagesEl   = document.getElementById("bookPages");
  const generateBtn   = document.getElementById("generateBtn");
  const saveBtn       = document.getElementById("saveBtn");
  const clearBtn      = document.getElementById("clearBtn");
  const historyListEl = document.getElementById("historyList");
  const emptyHistoryEl= document.getElementById("emptyHistory");

  /* ========== 工具函数 ========== */
  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function randomIsbn() {
    let s = "978";
    for (let i = 0; i < 9; i++) s += Math.floor(Math.random() * 10);
    return s.slice(0,3) + "-" + s.slice(3,5) + "-" + s.slice(5,9) + "-" + s.slice(9,12) + "-" + s.slice(12);
  }

  function randomYear() {
    return 1980 + Math.floor(Math.random() * 46);
  }

  function randomPages() {
    return 120 + Math.floor(Math.random() * 480);
  }

  function hexToRgb(hex) {
    const r = parseInt(hex.slice(1,3),16);
    const g = parseInt(hex.slice(3,5),16);
    const b = parseInt(hex.slice(5,7),16);
    return [r,g,b];
  }

  function luminance(hex) {
    const [r,g,b] = hexToRgb(hex);
    return 0.299*r + 0.587*g + 0.114*b;
  }

  /* ========== 生成书 ========== */
  function generateBook() {
    const genreObj = GENRES.find(g => g.key === currentGenre);
    const d = DATA[currentGenre];

    const parts = d.titleParts;
    const title = pick(parts[0]) + pick(parts[1]);
    const author = pick(d.authors);
    const desc = pick(d.descs);
    const color = pick(genreObj.color);
    const isbn = randomIsbn();
    const year = randomYear();
    const pages = randomPages();

    currentBook = { title, author, desc, color, genre: genreObj.label, genreKey: currentGenre, isbn, year, pages };
    renderBook(currentBook);
  }

  /* ========== 渲染书 ========== */
  function renderBook(book) {
    const card = document.getElementById("bookCard");
    card.style.animation = "none";
    void card.offsetHeight;
    card.style.animation = "";

    const lum = luminance(book.color);
    bookCoverEl.style.background = book.color;
    if (lum > 100) {
      bookCoverEl.style.boxShadow = `-5px 0 0 rgba(0,0,0,0.2), 4px 6px 18px rgba(0,0,0,0.3), inset -3px 0 8px rgba(0,0,0,0.1)`;
    }

    // 渐变封面背景
    const rgb = hexToRgb(book.color);
    const lighter = `rgba(${Math.min(rgb[0]+40,255)},${Math.min(rgb[1]+40,255)},${Math.min(rgb[2]+40,255)},1)`;
    bookCoverEl.style.background = `linear-gradient(145deg, ${lighter} 0%, ${book.color} 100%)`;

    coverGenreEl.textContent = book.genre;
    coverTitleEl.textContent = book.title;
    coverAuthorEl.textContent = book.author + " 著";
    bookTitleEl.textContent = book.title;
    bookAuthorEl.textContent = book.author;
    bookGenreTagEl.textContent = "# " + book.genre;
    bookDescEl.textContent = """ + book.desc + """;
    bookIsbnEl.textContent = book.isbn;
    bookYearEl.textContent = book.year;
    bookPagesEl.textContent = book.pages;
  }

  /* ========== 历史 ========== */
  function loadHistory() {
    try {
      const raw = localStorage.getItem("fakeBooks_saved");
      if (raw) savedBooks = JSON.parse(raw);
    } catch(e) { savedBooks = []; }
    renderHistory();
  }

  function saveHistory() {
    try {
      localStorage.setItem("fakeBooks_saved", JSON.stringify(savedBooks.slice(0, 30)));
    } catch(e) {}
  }

  function renderHistory() {
    historyListEl.innerHTML = "";
    if (!savedBooks.length) {
      emptyHistoryEl.style.display = "block";
      return;
    }
    emptyHistoryEl.style.display = "none";
    savedBooks.forEach(function(book, idx) {
      const item = document.createElement("div");
      item.className = "history-item";
      const dot = document.createElement("div");
      dot.className = "history-dot";
      dot.style.background = book.color;
      const info = document.createElement("div");
      info.className = "history-info";
      const name = document.createElement("div");
      name.className = "history-name";
      name.textContent = book.title;
      const sub = document.createElement("div");
      sub.className = "history-sub";
      sub.textContent = book.author + " · " + book.year + "年";
      const tag = document.createElement("span");
      tag.className = "history-genre";
      tag.textContent = book.genre;
      info.appendChild(name);
      info.appendChild(sub);
      item.appendChild(dot);
      item.appendChild(info);
      item.appendChild(tag);
      historyListEl.appendChild(item);
    });
  }

  function saveCurrentBook() {
    if (!currentBook) return;
    const exists = savedBooks.some(function(b) {
      return b.title === currentBook.title && b.author === currentBook.author;
    });
    if (exists) {
      flashBtn(saveBtn, "已在书架");
      return;
    }
    savedBooks.unshift(Object.assign({}, currentBook));
    saveHistory();
    renderHistory();
    flashBtn(saveBtn, "已收藏 ✓");
  }

  function flashBtn(btn, text) {
    const orig = btn.textContent;
    btn.textContent = text;
    btn.disabled = true;
    setTimeout(function() {
      btn.textContent = orig;
      btn.disabled = false;
    }, 1500);
  }

  /* ========== 类型栏 ========== */
  function renderGenreBar() {
    genreBarEl.innerHTML = "";
    GENRES.forEach(function(g) {
      const btn = document.createElement("button");
      btn.className = "genre-btn" + (g.key === currentGenre ? " active" : "");
      btn.textContent = g.label;
      btn.addEventListener("click", function() {
        currentGenre = g.key;
        document.querySelectorAll(".genre-btn").forEach(function(b) { b.classList.remove("active"); });
        btn.classList.add("active");
        generateBook();
      });
      genreBarEl.appendChild(btn);
    });
  }

  /* ========== 事件绑定 ========== */
  generateBtn.addEventListener("click", generateBook);

  saveBtn.addEventListener("click", saveCurrentBook);

  clearBtn.addEventListener("click", function() {
    if (!savedBooks.length) return;
    savedBooks = [];
    saveHistory();
    renderHistory();
  });

  /* ========== 初始化（放最后）========== */
  loadHistory();
  renderGenreBar();
  generateBook();

})();
</script>
</body>
</html>
