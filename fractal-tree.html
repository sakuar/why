<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分形树</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --panel-bg: rgba(255,255,255,0.05);
    --panel-border: rgba(255,255,255,0.1);
    --text: #e8eaf0;
    --text-dim: #8b90a0;
    --accent: #6c8ebf;
    --accent2: #a8d8a8;
    --radius: 12px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  .back-link {
    position: fixed;
    top: 12px;
    left: 14px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    z-index: 100;
    transition: color 0.2s;
    background: rgba(0,0,0,0.3);
    padding: 4px 10px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
  }
  .back-link:hover { color: var(--text); }

  .main-layout {
    display: flex;
    flex: 1;
    gap: 0;
    min-height: 100vh;
  }

  .canvas-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  canvas {
    display: block;
    border-radius: var(--radius);
    max-width: 100%;
    max-height: 100%;
  }

  .panel {
    width: 280px;
    min-width: 260px;
    background: var(--panel-bg);
    border-left: 1px solid var(--panel-border);
    padding: 60px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    backdrop-filter: blur(12px);
    overflow-y: auto;
  }

  .panel-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
    margin-bottom: 4px;
  }
  .panel-sub {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .control-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .control-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .control-label {
    font-size: 13px;
    color: var(--text);
  }

  .control-value {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    min-width: 40px;
    text-align: right;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.12);
    outline: none;
    cursor: pointer;
    transition: background 0.2s;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 6px rgba(108,142,191,0.6);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  input[type=range]:hover::-webkit-slider-thumb {
    transform: scale(1.2);
    box-shadow: 0 0 10px rgba(108,142,191,0.9);
  }
  input[type=range]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  .season-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }

  .season-btn {
    padding: 8px 10px;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    background: transparent;
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .season-btn:hover {
    border-color: var(--accent);
    color: var(--text);
    background: rgba(108,142,191,0.1);
  }
  .season-btn.active {
    border-color: var(--accent);
    background: rgba(108,142,191,0.2);
    color: var(--text);
    font-weight: 600;
  }

  .season-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-top: 1px solid var(--panel-border);
  }
  .toggle-label {
    font-size: 13px;
    color: var(--text);
  }

  .toggle {
    position: relative;
    width: 40px;
    height: 22px;
  }
  .toggle input { display: none; }
  .toggle-slider {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.12);
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.25s;
  }
  .toggle-slider::before {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #fff;
    top: 3px;
    left: 3px;
    transition: transform 0.25s;
  }
  .toggle input:checked + .toggle-slider { background: var(--accent); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(18px); }

  .divider {
    height: 1px;
    background: var(--panel-border);
    margin: 4px 0;
  }

  .fps-badge {
    display: inline-block;
    font-size: 10px;
    color: var(--text-dim);
    background: rgba(255,255,255,0.05);
    padding: 2px 8px;
    border-radius: 10px;
    margin-top: 4px;
  }

  /* Mobile */
  @media (max-width: 640px) {
    .main-layout { flex-direction: column; }
    .panel {
      width: 100%;
      min-width: unset;
      border-left: none;
      border-top: 1px solid var(--panel-border);
      padding: 16px 16px 24px;
    }
    .canvas-area { min-height: 55vw; }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<div class="main-layout">
  <div class="canvas-area">
    <canvas id="treeCanvas"></canvas>
  </div>

  <div class="panel">
    <div>
      <div class="panel-title">分形树</div>
      <div class="panel-sub">递归算法生成的自相似树形结构，带风吹摆动动画</div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">参数调节</div>
      <div class="control-group">
        <div class="control-item">
          <div class="control-header">
            <span class="control-label">分支角度</span>
            <span class="control-value" id="angleVal">25°</span>
          </div>
          <input type="range" id="angleSlider" min="5" max="60" value="25">
        </div>
        <div class="control-item">
          <div class="control-header">
            <span class="control-label">递归深度</span>
            <span class="control-value" id="depthVal">10</span>
          </div>
          <input type="range" id="depthSlider" min="3" max="14" value="10">
        </div>
        <div class="control-item">
          <div class="control-header">
            <span class="control-label">长度衰减</span>
            <span class="control-value" id="ratioVal">0.68</span>
          </div>
          <input type="range" id="ratioSlider" min="50" max="85" value="68">
        </div>
        <div class="control-item">
          <div class="control-header">
            <span class="control-label">风力强度</span>
            <span class="control-value" id="windVal">0.5</span>
          </div>
          <input type="range" id="windSlider" min="0" max="100" value="50">
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="section-label">季节配色</div>
      <div class="season-grid">
        <button class="season-btn active" data-season="spring">
          <span class="season-dot" style="background:#f9a8d4"></span>春
        </button>
        <button class="season-btn" data-season="summer">
          <span class="season-dot" style="background:#4ade80"></span>夏
        </button>
        <button class="season-btn" data-season="autumn">
          <span class="season-dot" style="background:#fb923c"></span>秋
        </button>
        <button class="season-btn" data-season="winter">
          <span class="season-dot" style="background:#bae6fd"></span>冬
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="toggle-row">
        <span class="toggle-label">风吹动画</span>
        <label class="toggle">
          <input type="checkbox" id="animToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">显示叶片</span>
        <label class="toggle">
          <input type="checkbox" id="leafToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div>
      <span class="fps-badge" id="fpsBadge">FPS: --</span>
    </div>
  </div>
</div>

<script>
(function() {
  "use strict";

  /* ── 季节配色表 ── */
  const SEASONS = {
    spring: {
      bg: ['#0d0f14', '#1a1025'],
      trunkColor: '#6b4423',
      branchColors: ['#8B6334', '#a07840', '#c4914a'],
      leafColors: ['#f9a8d4', '#f472b6', '#fbcfe8', '#fce7f3', '#ffffff'],
      groundColor: '#1a1a2e',
      name: '春'
    },
    summer: {
      bg: ['#071020', '#0c1a18'],
      trunkColor: '#5c3d1e',
      branchColors: ['#7a5230', '#8f6235', '#a07840'],
      leafColors: ['#4ade80', '#16a34a', '#86efac', '#bbf7d0', '#dcfce7'],
      groundColor: '#0a1a10',
      name: '夏'
    },
    autumn: {
      bg: ['#1a0f08', '#1f1208'],
      trunkColor: '#7a4a1e',
      branchColors: ['#8B5E2C', '#a06c30', '#b57a36'],
      leafColors: ['#fb923c', '#f97316', '#fbbf24', '#ef4444', '#fde68a'],
      groundColor: '#1a0f08',
      name: '秋'
    },
    winter: {
      bg: ['#080c14', '#0f1520'],
      trunkColor: '#4a4a5a',
      branchColors: ['#5a5a6a', '#6a6a7a', '#7a7a8a'],
      leafColors: ['#bae6fd', '#e0f2fe', '#f0f9ff', '#ffffff', '#dbeafe'],
      groundColor: '#0a0e18',
      name: '冬'
    }
  };

  /* ── 状态变量 ── */
  const canvas = document.getElementById('treeCanvas');
  const ctx = canvas.getContext('2d');

  const angleSlider = document.getElementById('angleSlider');
  const depthSlider = document.getElementById('depthSlider');
  const ratioSlider = document.getElementById('ratioSlider');
  const windSlider  = document.getElementById('windSlider');
  const animToggle  = document.getElementById('animToggle');
  const leafToggle  = document.getElementById('leafToggle');
  const angleVal    = document.getElementById('angleVal');
  const depthVal    = document.getElementById('depthVal');
  const ratioVal    = document.getElementById('ratioVal');
  const windVal     = document.getElementById('windVal');
  const fpsBadge    = document.getElementById('fpsBadge');

  let params = {
    angle: 25,
    depth: 10,
    ratio: 0.68,
    wind: 0.5,
    season: 'spring',
    animated: true,
    showLeaves: true
  };

  let windTime = 0;
  let lastFrameTime = 0;
  let frameCount = 0;
  let fpsTimer = 0;
  let animFrameId = null;

  /* ── localStorage 持久化 ── */
  function saveParams() {
    try {
      localStorage.setItem('fractalTree_params', JSON.stringify(params));
    } catch(e) {}
  }

  function loadParams() {
    try {
      const saved = localStorage.getItem('fractalTree_params');
      if (saved) {
        const p = JSON.parse(saved);
        Object.assign(params, p);
      }
    } catch(e) {}
  }

  /* ── 同步 UI 控件到 params ── */
  function syncUI() {
    angleSlider.value = params.angle;
    depthSlider.value = params.depth;
    ratioSlider.value = Math.round(params.ratio * 100);
    windSlider.value  = Math.round(params.wind * 100);
    animToggle.checked = params.animated;
    leafToggle.checked = params.showLeaves;
    angleVal.textContent = params.angle + '°';
    depthVal.textContent = params.depth;
    ratioVal.textContent = params.ratio.toFixed(2);
    windVal.textContent  = params.wind.toFixed(1);

    document.querySelectorAll('.season-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.season === params.season);
    });
  }

  /* ── Canvas 尺寸 ── */
  function resizeCanvas() {
    const area = canvas.parentElement;
    const w = area.clientWidth;
    const h = area.clientHeight;
    const dpr = window.devicePixelRatio || 1;
    canvas.width  = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);
  }

  /* ── 绘制分形树 ── */
  function drawBranch(x, y, len, angle, depth, season, windOffset) {
    if (depth === 0) return;

    const s = SEASONS[season];
    const maxDepth = params.depth;
    const depthRatio = depth / maxDepth;

    // 风偏移：越末端摆动越大
    const windAmt = params.wind * (1 - depthRatio) * Math.sin(windTime * 1.2 + windOffset) * 0.4;
    const actualAngle = angle + windAmt;

    const endX = x + Math.sin(actualAngle * Math.PI / 180) * len;
    const endY = y - Math.cos(actualAngle * Math.PI / 180) * len;

    // 线宽与颜色
    const lineWidth = Math.max(0.5, depthRatio * (maxDepth < 8 ? 6 : 8));
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';

    if (depthRatio > 0.6) {
      ctx.strokeStyle = s.trunkColor;
    } else if (depthRatio > 0.3) {
      ctx.strokeStyle = s.branchColors[0];
    } else {
      ctx.strokeStyle = s.branchColors[1];
    }

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(endX, endY);
    ctx.stroke();

    // 叶片
    if (params.showLeaves && depth === 1) {
      const leafColor = s.leafColors[Math.floor(Math.random() * s.leafColors.length)];
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = leafColor;
      ctx.beginPath();
      const r = Math.max(2, len * 0.6);
      ctx.arc(endX, endY, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    const branchAngle = params.angle;
    const newLen = len * params.ratio;

    drawBranch(endX, endY, newLen, actualAngle - branchAngle, depth - 1, season, windOffset * 1.3 + 0.5);
    drawBranch(endX, endY, newLen, actualAngle + branchAngle, depth - 1, season, windOffset * 1.3 - 0.7);
  }

  function render() {
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.width / dpr;
    const H = canvas.height / dpr;
    const s = SEASONS[params.season];

    // 背景渐变
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, s.bg[0]);
    grad.addColorStop(1, s.bg[1]);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 地面
    ctx.fillStyle = s.groundColor;
    ctx.fillRect(0, H * 0.92, W, H * 0.08);

    // 远山/星空点缀 (冬/夏)
    if (params.season === 'winter') {
      drawStars(W, H);
    }

    // 树干起点
    const trunkLen = Math.min(H * 0.22, 130);
    const startX = W / 2;
    const startY = H * 0.92;

    ctx.save();
    drawBranch(startX, startY, trunkLen, 0, params.depth, params.season, 0);
    ctx.restore();
  }

  function drawStars(W, H) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    // 固定伪随机星星
    for (let i = 0; i < 60; i++) {
      const sx = ((i * 137.508) % W);
      const sy = ((i * 97.31)  % (H * 0.7));
      const sr = (i % 3 === 0) ? 1.2 : 0.6;
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  /* ── 动画循环 ── */
  function animate(ts) {
    animFrameId = requestAnimationFrame(animate);

    const dt = ts - lastFrameTime;
    lastFrameTime = ts;

    // FPS 统计
    frameCount++;
    fpsTimer += dt;
    if (fpsTimer >= 1000) {
      fpsBadge.textContent = 'FPS: ' + frameCount;
      frameCount = 0;
      fpsTimer = 0;
    }

    if (params.animated) {
      windTime += dt * 0.001;
    }

    render();
  }

  /* ── 事件绑定 ── */
  angleSlider.addEventListener('input', function() {
    params.angle = parseInt(this.value);
    angleVal.textContent = params.angle + '°';
    saveParams();
    if (!params.animated) render();
  });

  depthSlider.addEventListener('input', function() {
    params.depth = parseInt(this.value);
    depthVal.textContent = params.depth;
    saveParams();
    if (!params.animated) render();
  });

  ratioSlider.addEventListener('input', function() {
    params.ratio = parseInt(this.value) / 100;
    ratioVal.textContent = params.ratio.toFixed(2);
    saveParams();
    if (!params.animated) render();
  });

  windSlider.addEventListener('input', function() {
    params.wind = parseInt(this.value) / 100;
    windVal.textContent = params.wind.toFixed(1);
    saveParams();
    if (!params.animated) render();
  });

  animToggle.addEventListener('change', function() {
    params.animated = this.checked;
    saveParams();
    if (!params.animated) render();
  });

  leafToggle.addEventListener('change', function() {
    params.showLeaves = this.checked;
    saveParams();
    if (!params.animated) render();
  });

  document.querySelectorAll('.season-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      params.season = this.dataset.season;
      document.querySelectorAll('.season-btn').forEach(function(b) {
        b.classList.remove('active');
      });
      this.classList.add('active');
      saveParams();
      if (!params.animated) render();
    });
  });

  window.addEventListener('resize', function() {
    resizeCanvas();
    if (!params.animated) render();
  });

  /* ── 初始化（所有声明之后） ── */
  loadParams();
  syncUI();
  resizeCanvas();
  requestAnimationFrame(animate);

})();
</script>
</body>
</html>
