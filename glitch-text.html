<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>故障文字生成器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --bg2: #0f0f1a;
    --bg3: #141428;
    --cyan: #00fff5;
    --magenta: #ff00aa;
    --yellow: #ffff00;
    --green: #00ff88;
    --border: #1e1e3a;
    --text: #c8d8e8;
    --text-dim: #5a6a7a;
    --glow-cyan: 0 0 8px #00fff580, 0 0 20px #00fff530;
    --glow-mag: 0 0 8px #ff00aa80, 0 0 20px #ff00aa30;
    --radius: 10px;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
  }

  body {
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,245,0.015) 2px, rgba(0,255,245,0.015) 4px);
    animation: scanlines 8s linear infinite;
  }

  @keyframes scanlines {
    0% { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    z-index: 100;
    transition: color 0.2s;
    letter-spacing: 0.05em;
  }
  .back-link:hover { color: var(--cyan); }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 60px 20px 40px;
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
  }

  .header h1 {
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 900;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    position: relative;
    display: inline-block;
    color: #fff;
  }

  .header h1::before {
    content: attr(data-text);
    position: absolute;
    left: -2px;
    top: 0;
    color: var(--cyan);
    clip: rect(0, 900px, 0, 0);
    animation: glitch-top 3s infinite linear alternate-reverse;
  }
  .header h1::after {
    content: attr(data-text);
    position: absolute;
    left: 2px;
    top: 0;
    color: var(--magenta);
    clip: rect(0, 900px, 0, 0);
    animation: glitch-bot 2.7s infinite linear alternate-reverse;
  }

  @keyframes glitch-top {
    0%   { clip: rect(10px, 9999px, 30px, 0); transform: translate(-1px, 0); }
    10%  { clip: rect(40px, 9999px, 55px, 0); transform: translate(1px, 0); }
    20%  { clip: rect(5px,  9999px, 20px, 0); transform: translate(-2px, 0); }
    30%  { clip: rect(60px, 9999px, 75px, 0); transform: translate(0, 0); }
    40%  { clip: rect(25px, 9999px, 40px, 0); transform: translate(2px, 0); }
    50%  { clip: rect(0, 0, 0, 0); }
    60%  { clip: rect(15px, 9999px, 35px, 0); transform: translate(-1px, 0); }
    70%  { clip: rect(45px, 9999px, 60px, 0); transform: translate(1px, 0); }
    80%  { clip: rect(0, 0, 0, 0); }
    90%  { clip: rect(30px, 9999px, 50px, 0); transform: translate(-2px, 0); }
    100% { clip: rect(0, 0, 0, 0); }
  }

  @keyframes glitch-bot {
    0%   { clip: rect(50px, 9999px, 70px, 0); transform: translate(1px, 0); }
    15%  { clip: rect(20px, 9999px, 38px, 0); transform: translate(-1px, 0); }
    25%  { clip: rect(0, 0, 0, 0); }
    35%  { clip: rect(65px, 9999px, 80px, 0); transform: translate(2px, 0); }
    50%  { clip: rect(8px,  9999px, 22px, 0); transform: translate(0, 0); }
    60%  { clip: rect(0, 0, 0, 0); }
    75%  { clip: rect(35px, 9999px, 52px, 0); transform: translate(-2px, 0); }
    85%  { clip: rect(0, 0, 0, 0); }
    100% { clip: rect(55px, 9999px, 72px, 0); transform: translate(1px, 0); }
  }

  .header p {
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.1em;
    margin-top: 8px;
  }

  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--cyan), transparent);
    opacity: 0.4;
    border-radius: var(--radius) var(--radius) 0 0;
  }

  .label {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cyan);
    margin-bottom: 10px;
    font-weight: bold;
  }

  textarea {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 15px;
    padding: 12px 14px;
    resize: vertical;
    min-height: 80px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    line-height: 1.6;
  }
  textarea:focus {
    border-color: var(--cyan);
    box-shadow: var(--glow-cyan);
  }

  .controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 480px) {
    .controls-grid { grid-template-columns: 1fr; }
  }

  .control-item {}

  .slider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 6px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 4px;
    border-radius: 2px;
    background: var(--bg3);
    outline: none;
    cursor: pointer;
    position: relative;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: var(--glow-cyan);
    cursor: pointer;
    border: 2px solid var(--bg);
    transition: transform 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: var(--glow-cyan);
    cursor: pointer;
    border: 2px solid var(--bg);
  }

  .slider-val {
    font-size: 13px;
    color: var(--cyan);
    min-width: 28px;
    text-align: right;
    font-weight: bold;
  }

  .mode-btns {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .mode-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text-dim);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.05em;
    font-family: 'Courier New', monospace;
  }
  .mode-btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
  }
  .mode-btn.active {
    background: rgba(0,255,245,0.12);
    border-color: var(--cyan);
    color: var(--cyan);
    box-shadow: var(--glow-cyan);
  }

  .gen-btn {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, #00fff520, #ff00aa20);
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-size: 15px;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s;
    box-shadow: var(--glow-cyan);
    position: relative;
    overflow: hidden;
  }
  .gen-btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,255,245,0.15), transparent);
    transition: left 0.4s;
  }
  .gen-btn:hover::before { left: 100%; }
  .gen-btn:hover {
    background: linear-gradient(135deg, #00fff530, #ff00aa30);
    transform: translateY(-1px);
    box-shadow: 0 0 16px #00fff560, 0 0 32px #00fff520;
  }
  .gen-btn:active { transform: translateY(0); }

  .preview-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    margin-bottom: 20px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .preview-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--magenta), transparent);
    opacity: 0.4;
  }

  .scanline-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.12) 3px,
      rgba(0,0,0,0.12) 4px
    );
    pointer-events: none;
    z-index: 1;
  }

  #preview-text {
    font-size: clamp(18px, 4vw, 32px);
    font-weight: 900;
    text-align: center;
    line-height: 1.4;
    word-break: break-all;
    position: relative;
    z-index: 2;
    color: #fff;
    letter-spacing: 0.05em;
    max-width: 100%;
  }

  .preview-placeholder {
    color: var(--text-dim);
    font-size: 14px;
    letter-spacing: 0.1em;
    z-index: 2;
  }

  .result-area {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    font-size: 13px;
    color: var(--text);
    word-break: break-all;
    line-height: 1.8;
    min-height: 60px;
    max-height: 150px;
    overflow-y: auto;
    font-family: 'Courier New', monospace;
    margin-top: 10px;
  }
  .result-area::-webkit-scrollbar { width: 4px; }
  .result-area::-webkit-scrollbar-track { background: var(--bg3); }
  .result-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .copy-btn {
    margin-top: 12px;
    padding: 9px 22px;
    border-radius: 6px;
    border: 1px solid var(--magenta);
    background: rgba(255,0,170,0.1);
    color: var(--magenta);
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    float: right;
  }
  .copy-btn:hover {
    background: rgba(255,0,170,0.2);
    box-shadow: var(--glow-mag);
    transform: translateY(-1px);
  }
  .copy-btn.copied {
    border-color: var(--green);
    color: var(--green);
    background: rgba(0,255,136,0.1);
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 200px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .history-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .history-item:hover { border-color: var(--cyan); }
  .history-item-text {
    font-size: 12px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .history-item-badge {
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 10px;
    border: 1px solid var(--border);
    color: var(--text-dim);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .history-item-del {
    color: var(--text-dim);
    cursor: pointer;
    font-size: 14px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: color 0.2s;
    flex-shrink: 0;
    border: none;
    background: none;
  }
  .history-item-del:hover { color: var(--magenta); }

  .empty-history {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    padding: 16px;
    letter-spacing: 0.08em;
  }

  .clear-btn {
    font-size: 11px;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: color 0.2s;
    font-family: 'Courier New', monospace;
    float: right;
    margin-top: -2px;
  }
  .clear-btn:hover { color: var(--magenta); }

  .tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 8px;
    border-radius: 10px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .tag-glitch { background: rgba(0,255,245,0.12); color: var(--cyan); border: 1px solid rgba(0,255,245,0.3); }
  .tag-zalgo  { background: rgba(255,0,170,0.12); color: var(--magenta); border: 1px solid rgba(255,0,170,0.3); }
  .tag-scan   { background: rgba(255,255,0,0.10); color: var(--yellow); border: 1px solid rgba(255,255,0,0.25); }

  .footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 0.12em;
    margin-top: 10px;
    padding-bottom: 20px;
  }

  /* Glitch preview animations */
  .glitch-anim {
    animation: previewGlitch 0.4s infinite;
  }
  @keyframes previewGlitch {
    0%   { text-shadow: -2px 0 var(--cyan), 2px 0 var(--magenta); transform: translate(0); }
    20%  { text-shadow: 3px 0 var(--cyan), -3px 0 var(--magenta); transform: translate(-1px, 1px); }
    40%  { text-shadow: -1px 0 var(--magenta), 1px 0 var(--cyan); transform: translate(2px, 0); }
    60%  { text-shadow: 2px 0 var(--yellow), -2px 0 var(--cyan); transform: translate(-1px, -1px); }
    80%  { text-shadow: -3px 0 var(--cyan), 3px 0 var(--magenta); transform: translate(1px, 1px); }
    100% { text-shadow: -2px 0 var(--cyan), 2px 0 var(--magenta); transform: translate(0); }
  }

  .glitch-anim-med {
    animation: previewGlitchMed 0.8s infinite;
  }
  @keyframes previewGlitchMed {
    0%   { text-shadow: -1px 0 var(--cyan), 1px 0 var(--magenta); transform: translate(0); }
    25%  { text-shadow: 2px 0 var(--cyan), -2px 0 var(--magenta); transform: translate(-1px, 0); }
    50%  { text-shadow: 0 0 8px var(--cyan); transform: translate(1px, 0); }
    75%  { text-shadow: -2px 0 var(--magenta), 2px 0 var(--yellow); transform: translate(0, 0); }
    100% { text-shadow: -1px 0 var(--cyan), 1px 0 var(--magenta); transform: translate(0); }
  }

  .glitch-anim-low {
    animation: previewGlitchLow 1.5s infinite;
  }
  @keyframes previewGlitchLow {
    0%, 90%, 100% { text-shadow: -1px 0 var(--cyan), 1px 0 var(--magenta); transform: translate(0); }
    92% { text-shadow: 2px 0 var(--cyan), -2px 0 var(--magenta); transform: translate(-1px, 0); }
    95% { text-shadow: -2px 0 var(--magenta), 2px 0 var(--cyan); transform: translate(1px, 0); }
  }

  .noise-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.03;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .clearfix::after { content: ''; display: table; clear: both; }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="container">

  <div class="header">
    <h1 data-text="故障文字">故障文字</h1>
    <p>CYBER GLITCH TEXT GENERATOR · 赛博故障风格</p>
  </div>

  <!-- 输入区 -->
  <div class="card">
    <div class="label">// 输入文字</div>
    <textarea id="input-text" placeholder="输入要故障化的文字……" rows="3"></textarea>
  </div>

  <!-- 控制区 -->
  <div class="card">
    <div class="label">// 参数调节</div>
    <div class="controls-grid">
      <div class="control-item">
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">故障强度</div>
        <div class="slider-row">
          <input type="range" id="intensity" min="1" max="10" value="5">
          <span class="slider-val" id="intensity-val">5</span>
        </div>
      </div>
      <div class="control-item">
        <div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;">Zalgo 层数</div>
        <div class="slider-row">
          <input type="range" id="zalgo-level" min="1" max="5" value="2">
          <span class="slider-val" id="zalgo-val">2</span>
        </div>
      </div>
    </div>
    <div style="margin-top:18px;">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:8px;">效果模式</div>
      <div class="mode-btns">
        <button class="mode-btn active" data-mode="all">全部叠加</button>
        <button class="mode-btn" data-mode="glitch">错位故障</button>
        <button class="mode-btn" data-mode="zalgo">Zalgo乱码</button>
        <button class="mode-btn" data-mode="scan">扫描线</button>
      </div>
    </div>
  </div>

  <!-- 生成按钮 -->
  <button class="gen-btn" id="gen-btn">[ 生 成 故 障 ]</button>

  <!-- 预览区 -->
  <div class="preview-card" id="preview-card">
    <div class="scanline-overlay"></div>
    <div class="noise-overlay"></div>
    <div class="preview-placeholder" id="preview-placeholder">预览效果将在此显示</div>
    <div id="preview-text" style="display:none;"></div>
  </div>

  <!-- 结果复制区 -->
  <div class="card" id="result-card" style="display:none;">
    <div class="label">// Zalgo 文本（可复制）</div>
    <div class="result-area" id="result-text"></div>
    <div class="clearfix">
      <button class="copy-btn" id="copy-btn">复制文本</button>
    </div>
  </div>

  <!-- 历史记录 -->
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div class="label" style="margin-bottom:0;">// 历史记录</div>
      <button class="clear-btn" id="clear-history-btn">清空</button>
    </div>
    <div class="history-list" id="history-list">
      <div class="empty-history" id="empty-history">暂无记录</div>
    </div>
  </div>

  <div class="footer">GLITCH.EXE · 断网可用 · 纯前端</div>

</div>

<script>
(function() {
  "use strict";

  // ── Zalgo 字符集 ──
  var ZALGO_UP = [
    '̍','̎','̄','̅','̿','̑','̆','̐',
    '͒','͗','͑','̇','̈','̊','͂','̓',
    '̈́','͊','͋','͌','̃','̂','̌','͐',
    '̀','́','̋','̏','̒','̓','̔','̽',
    '̉','ͣ','ͤ','ͥ','ͦ','ͧ','ͨ','ͩ',
    'ͪ','ͫ','ͬ','ͭ','ͮ','ͯ','̾','͛'
  ];
  var ZALGO_MID = [
    '̕','̛','̀','́','͘','̡','̢','̧',
    '̨','̴','̵','̶','͏','͜','͝','͞',
    '͟','͠','͢','̸','̷','͡','҉'
  ];
  var ZALGO_DOWN = [
    '̖','̗','̘','̙','̜','̝','̞','̟',
    '̠','̤','̥','̦','̩','̪','̫','̬',
    '̭','̮','̯','̰','̱','̲','̳','̹',
    '̺','̻','̼','ͅ','͇','͈','͉','͍',
    '͎','͓','͔','͕','͖','͙','͚','̣'
  ];

  // ── 故障替换字符 ──
  var GLITCH_CHARS = '!@#$%^&*<>?/\\|[]{}~`ﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍ░▒▓█▄▀■□▪▫◈◉◊○●';

  // ── 状态变量 ──
  var currentMode = 'all';
  var currentResult = '';
  var history = [];

  // ── DOM 引用 ──
  var inputText     = document.getElementById('input-text');
  var intensitySlider = document.getElementById('intensity');
  var intensityVal  = document.getElementById('intensity-val');
  var zalgoSlider   = document.getElementById('zalgo-level');
  var zalgoVal      = document.getElementById('zalgo-val');
  var genBtn        = document.getElementById('gen-btn');
  var previewCard   = document.getElementById('preview-card');
  var previewText   = document.getElementById('preview-text');
  var previewPlaceholder = document.getElementById('preview-placeholder');
  var resultCard    = document.getElementById('result-card');
  var resultText    = document.getElementById('result-text');
  var copyBtn       = document.getElementById('copy-btn');
  var historyList   = document.getElementById('history-list');
  var emptyHistory  = document.getElementById('empty-history');
  var clearHistoryBtn = document.getElementById('clear-history-btn');

  // ── 工具函数 ──
  function randInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }
  function randFrom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // ── Zalgo 生成 ──
  function zalgoChar(ch, level) {
    var result = ch;
    var upCount   = randInt(0, level * 3);
    var midCount  = randInt(0, level);
    var downCount = randInt(0, level * 3);
    for (var i = 0; i < upCount;   i++) result += randFrom(ZALGO_UP);
    for (var j = 0; j < midCount;  j++) result += randFrom(ZALGO_MID);
    for (var k = 0; k < downCount; k++) result += randFrom(ZALGO_DOWN);
    return result;
  }

  function applyZalgo(text, level) {
    var out = '';
    for (var i = 0; i < text.length; i++) {
      out += zalgoChar(text[i], level);
    }
    return out;
  }

  // ── 错位故障文本（随机替换部分字符）──
  function applyGlitch(text, intensity) {
    var chars = text.split('');
    var replaceProb = intensity / 100 * 0.6;
    return chars.map(function(ch) {
      if (ch === ' ' || ch === '\n') return ch;
      if (Math.random() < replaceProb) return randFrom(GLITCH_CHARS);
      return ch;
    }).join('');
  }

  // ── 综合生成 ──
  function generateGlitch(text, mode, intensity, zalgoLevel) {
    var result = text;
    if (mode === 'zalgo') {
      result = applyZalgo(text, zalgoLevel);
    } else if (mode === 'glitch') {
      result = applyGlitch(text, intensity);
    } else if (mode === 'scan') {
      result = text;
    } else {
      // all
      result = applyGlitch(text, intensity * 0.5);
      result = applyZalgo(result, zalgoLevel);
    }
    return result;
  }

  // ── 预览动画类 ──
  function getAnimClass(intensity) {
    if (intensity >= 7) return 'glitch-anim';
    if (intensity >= 4) return 'glitch-anim-med';
    return 'glitch-anim-low';
  }

  // ── 更新预览 ──
  function updatePreview(text, mode, intensity) {
    if (!text.trim()) return;
    previewPlaceholder.style.display = 'none';
    previewText.style.display = 'block';
    previewText.textContent = text;

    // Reset classes
    previewText.className = '';

    if (mode === 'scan') {
      previewText.style.textShadow = '0 0 10px ' + (intensity > 5 ? 'var(--cyan)' : 'rgba(0,255,245,0.5)');
      previewText.style.color = '#fff';
    } else {
      previewText.style.textShadow = '';
      previewText.style.color = '#fff';
      previewText.className = getAnimClass(intensity);
    }

    // Scanline color accent
    if (intensity >= 8) {
      previewCard.style.boxShadow = '0 0 20px rgba(0,255,245,0.15), inset 0 0 40px rgba(255,0,170,0.05)';
    } else {
      previewCard.style.boxShadow = '';
    }
  }

  // ── 历史记录渲染 ──
  function renderHistory() {
    if (history.length === 0) {
      emptyHistory.style.display = 'block';
      // Remove all items except empty placeholder
      var items = historyList.querySelectorAll('.history-item');
      items.forEach(function(el) { el.remove(); });
      return;
    }
    emptyHistory.style.display = 'none';
    historyList.innerHTML = '';

    history.forEach(function(item, idx) {
      var div = document.createElement('div');
      div.className = 'history-item';

      var modeLabel = { all: '全部', glitch: '错位', zalgo: 'Zalgo', scan: '扫描' }[item.mode] || item.mode;
      var tagClass  = { all: 'tag-glitch', glitch: 'tag-glitch', zalgo: 'tag-zalgo', scan: 'tag-scan' }[item.mode] || 'tag-glitch';

      div.innerHTML =
        '<span class="history-item-text">' + escapeHtml(item.original) + '</span>' +
        '<span class="history-item-badge"><span class="tag ' + tagClass + '">' + modeLabel + '</span> ×' + item.intensity + '</span>' +
        '<button class="history-item-del" data-idx="' + idx + '" title="删除">×</button>';

      div.querySelector('.history-item-text').addEventListener('click', function() {
        loadHistoryItem(item);
      });
      div.querySelector('.history-item-del').addEventListener('click', function(e) {
        e.stopPropagation();
        history.splice(idx, 1);
        saveHistory();
        renderHistory();
      });

      historyList.appendChild(div);
    });
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function loadHistoryItem(item) {
    inputText.value = item.original;
    intensitySlider.value = item.intensity;
    intensityVal.textContent = item.intensity;
    zalgoSlider.value = item.zalgoLevel;
    zalgoVal.textContent = item.zalgoLevel;
    setMode(item.mode);
    doGenerate();
  }

  // ── 持久化 ──
  function saveHistory() {
    try {
      localStorage.setItem('glitch_history', JSON.stringify(history));
    } catch(e) {}
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem('glitch_history');
      if (raw) history = JSON.parse(raw);
    } catch(e) { history = []; }
  }

  // ── 模式切换 ──
  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(function(btn) {
      btn.classList.toggle('active', btn.dataset.mode === mode);
    });
  }

  // ── 主生成逻辑 ──
  function doGenerate() {
    var text = inputText.value.trim();
    if (!text) {
      inputText.focus();
      inputText.style.borderColor = 'var(--magenta)';
      inputText.style.boxShadow = 'var(--glow-mag)';
      setTimeout(function() {
        inputText.style.borderColor = '';
        inputText.style.boxShadow = '';
      }, 800);
      return;
    }

    var intensity  = parseInt(intensitySlider.value, 10);
    var zalgoLevel = parseInt(zalgoSlider.value, 10);
    var mode       = currentMode;

    var generated = generateGlitch(text, mode, intensity, zalgoLevel);
    currentResult = generated;

    updatePreview(generated, mode, intensity);

    resultText.textContent = generated;
    resultCard.style.display = 'block';

    // Scroll to preview
    previewCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

    // Save to history
    history.unshift({ original: text, result: generated, mode: mode, intensity: intensity, zalgoLevel: zalgoLevel });
    if (history.length > 20) history.pop();
    saveHistory();
    renderHistory();

    // Button flash
    genBtn.style.background = 'linear-gradient(135deg, rgba(0,255,245,0.25), rgba(255,0,170,0.25))';
    setTimeout(function() {
      genBtn.style.background = '';
    }, 300);
  }

  // ── 复制 ──
  function doCopy() {
    if (!currentResult) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(currentResult).then(function() {
        showCopied();
      }).catch(function() {
        fallbackCopy(currentResult);
      });
    } else {
      fallbackCopy(currentResult);
    }
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); showCopied(); } catch(e) {}
    document.body.removeChild(ta);
  }

  function showCopied() {
    copyBtn.textContent = '已复制 ✓';
    copyBtn.classList.add('copied');
    setTimeout(function() {
      copyBtn.textContent = '复制文本';
      copyBtn.classList.remove('copied');
    }, 1800);
  }

  // ── 事件绑定 ──
  intensitySlider.addEventListener('input', function() {
    intensityVal.textContent = this.value;
  });

  zalgoSlider.addEventListener('input', function() {
    zalgoVal.textContent = this.value;
  });

  document.querySelectorAll('.mode-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      setMode(this.dataset.mode);
    });
  });

  genBtn.addEventListener('click', doGenerate);

  inputText.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'Enter') doGenerate();
  });

  copyBtn.addEventListener('click', doCopy);

  clearHistoryBtn.addEventListener('click', function() {
    history = [];
    saveHistory();
    renderHistory();
  });

  // ── 初始化 ──
  loadHistory();
  renderHistory();

})();
</script>
</body>
</html>
