<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>复利与理财 · 钱怎么滚钱</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#070912;color:#e8eef7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  .wrap{width:100%;max-width:1240px;padding:0 18px;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px;}
  .top h1{font-size:18px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#ffd166,#56b6ff,#b98cff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .top .back{font-size:12px;color:#8090a8;text-decoration:none;border:1px solid #222840;border-radius:8px;padding:6px 11px;}
  .badge{font-size:12px;color:#56d6a8;margin:2px 2px 12px;}
  .work{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:stretch;}
  @media(max-width:780px){.work{grid-template-columns:1fr;}}
  #stage{position:relative;min-width:0;}
  canvas{width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 42%,#0e1426,#06070d 80%);border:1px solid #1c2236;border-radius:14px;touch-action:none;}
  .controls{background:#0e1322;border:1px solid #232c44;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;}
  .controls .ch{font-size:12px;color:#8090a8;font-weight:600;letter-spacing:1px;margin-bottom:12px;}
  .slider{margin-bottom:13px;}.slider:last-child{margin-bottom:0;}
  .slider .sl-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;}
  .slider .sl-top .nm{color:#cfd8ea;}.slider .sl-top .val{color:#56b6ff;font-weight:700;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#232c44;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;box-shadow:0 0 0 1px #6c63ff;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;}
  .hint{font-size:12px;color:#5a6680;line-height:1.6;border-top:1px solid #1a2138;padding-top:13px;}
  .info{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:780px){.info{grid-template-columns:1fr;}}
  .readout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;grid-column:1 / -1;}
  .readout .cell{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:14px 12px;text-align:center;}
  .readout .cell .k{font-size:11.5px;color:#8090a8;margin-bottom:6px;}
  .readout .cell .v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;color:#56b6ff;}
  .readout .cell.ok .v{color:#56d6a8;}.readout .cell.hi .v{color:#ffd166;}
  .card{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:16px 18px;}
  .card .ttl{font-size:13px;font-weight:800;color:#ffd166;margin-bottom:9px;}
  .card .eq{font-size:15.5px;line-height:1.8;color:#e8eef7;font-family:"Cambria Math","Times New Roman",Georgia,serif;}
  .card .eq .hl{color:#ffd166;font-weight:700;}
  .card .nt{font-size:13.5px;color:#9aa6bd;line-height:1.8;}.card .nt b{color:#cdd6e8;}
  footer{color:#5a6680;font-size:12px;text-align:center;padding:22px 0 36px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>💰 复利与理财 · 钱怎么滚钱</h1><a class="back" href="index.html">← 返回</a></div>
  <div class="badge">🎯 应用场景：用到 指数函数 · 等比数列求和 · 对数</div>
  <div class="work">
    <div id="stage"><canvas id="cv" width="900" height="540"></canvas></div>
    <div class="controls">
      <div><div class="ch">参数调节</div><div id="params"></div></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
  <div class="info">
    <div class="readout">
      <div class="cell"><div class="k">累计投入</div><div class="v" id="rIn">—</div></div>
      <div class="cell hi"><div class="k">到期总额</div><div class="v" id="rTot">—</div></div>
      <div class="cell ok"><div class="k">其中利息</div><div class="v" id="rInt">—</div></div>
    </div>
    <div class="card"><div class="ttl">公式</div><div class="eq" id="eq"></div></div>
    <div class="card"><div class="ttl">藏着哪些数学</div><div class="nt" id="note"></div></div>
  </div>
  <footer>蓝=复利总额(指数增长)，灰=本金投入，绿差额=利息 · 纯前端单文件教学</footer>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
var W=900,H=540;
function fit(){var st=document.getElementById("stage");var cw=st.clientWidth||900;W=cw;H=Math.round(cw*0.60);if(H<320)H=320;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
var P={};
var PARAMS=[
  {k:"p0",label:"起始本金（元）",min:0,max:100000,step:5000,def:10000},
  {k:"r",label:"年利率（%）",min:1,max:15,step:0.5,def:7},
  {k:"yr",label:"年限（年）",min:1,max:40,step:1,def:20},
  {k:"m",label:"每月定投（元）",min:0,max:5000,step:100,def:1000}
];
function total(t){var r=P.r/100,D=P.m*12;return P.p0*Math.pow(1+r,t)+(r>0?D*(Math.pow(1+r,t)-1)/r:D*t);}
function invested(t){return P.p0+P.m*12*t;}
function fmt(v){if(v>=1e8)return (v/1e8).toFixed(2)+"亿";if(v>=1e4)return (v/1e4).toFixed(1)+"万";return Math.round(v).toString();}
function buildParams(){var box=document.getElementById("params");box.innerHTML="";P={};
  PARAMS.forEach(function(pp){P[pp.k]=pp.def;var w=document.createElement("div");w.className="slider";
    w.innerHTML='<div class="sl-top"><span class="nm">'+pp.label+'</span><span class="val" id="v_'+pp.k+'">'+pp.def+'</span></div><input type="range" id="r_'+pp.k+'" min="'+pp.min+'" max="'+pp.max+'" step="'+pp.step+'" value="'+pp.def+'">';
    box.appendChild(w);var inp=w.querySelector("input");
    inp.oninput=function(){P[pp.k]=parseFloat(inp.value);document.getElementById("v_"+pp.k).textContent=P[pp.k];draw();};});}
function draw(){ctx.clearRect(0,0,W,H);var n=P.yr;
  var maxv=total(n)*1.05||1;
  var ox=W*0.10,oy=H*0.86,axW=W*0.84,axH=H*0.72;
  function X(t){return ox+t/n*axW;}function Y(v){return oy-v/maxv*axH;}
  // 轴
  ctx.strokeStyle="rgba(150,170,210,.35)";ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+axW,oy);ctx.moveTo(ox,oy);ctx.lineTo(ox,oy-axH);ctx.stroke();
  // y刻度
  ctx.fillStyle="#5a6680";ctx.font="10px system-ui";ctx.textAlign="right";ctx.textBaseline="middle";
  for(var g=1;g<=4;g++){var v=maxv*g/4;ctx.fillText(fmt(v),ox-5,Y(v));ctx.strokeStyle="rgba(120,140,180,.1)";ctx.beginPath();ctx.moveTo(ox,Y(v));ctx.lineTo(ox+axW,Y(v));ctx.stroke();}
  // 投入(本金)区域
  ctx.fillStyle="rgba(140,150,175,.18)";ctx.beginPath();ctx.moveTo(X(0),Y(0));for(var t1=0;t1<=n;t1+=0.5)ctx.lineTo(X(t1),Y(invested(t1)));ctx.lineTo(X(n),Y(0));ctx.closePath();ctx.fill();
  // 利息区域(投入到总额之间)
  ctx.fillStyle="rgba(86,214,168,.18)";ctx.beginPath();for(var t2=0;t2<=n;t2+=0.5)ctx.lineTo(X(t2),Y(invested(t2)));for(var t3=n;t3>=0;t3-=0.5)ctx.lineTo(X(t3),Y(total(t3)));ctx.closePath();ctx.fill();
  // 总额曲线
  ctx.strokeStyle="#56b6ff";ctx.lineWidth=3;ctx.beginPath();for(var t=0;t<=n;t+=0.25){var px=X(t),py=Y(total(t));if(t===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.stroke();
  // 投入线
  ctx.strokeStyle="rgba(140,150,175,.8)";ctx.lineWidth=1.8;ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(X(0),Y(invested(0)));ctx.lineTo(X(n),Y(invested(n)));ctx.stroke();ctx.setLineDash([]);
  // 标注
  ctx.fillStyle="#56b6ff";ctx.font="bold 13px system-ui";ctx.textAlign="right";ctx.textBaseline="bottom";ctx.fillText("总额 "+fmt(total(n)),X(n)-4,Y(total(n))-2);
  ctx.fillStyle="#8090a8";ctx.font="11px system-ui";ctx.textAlign="center";ctx.textBaseline="top";ctx.fillText("第 "+n+" 年",X(n),oy+5);ctx.fillText("0",X(0),oy+5);ctx.fillText("年 →",X(n/2),oy+5);
  // 读出
  var tot=total(n),inv=invested(n);
  document.getElementById("rIn").textContent=fmt(inv);
  document.getElementById("rTot").textContent=fmt(tot);
  document.getElementById("rInt").textContent=fmt(tot-inv);
  var dbl=P.r>0?Math.log(2)/Math.log(1+P.r/100):Infinity;
  document.getElementById("eq").innerHTML='总额 = 本金·(1+r)ⁿ + 月投·12·[(1+r)ⁿ−1]/r　·　翻倍约需 <span class="hl">'+(isFinite(dbl)?dbl.toFixed(1):"∞")+'</span> 年';
  document.getElementById("note").innerHTML='<b>复利</b> (1+r)ⁿ 是<b>指数增长</b>（指数函数页）—— 时间越久涨得越凶，前期慢、后期陡。<br><b>每月定投</b>的累积是<b>等比数列求和</b>（数列页）。<br>「钱翻倍要几年」要用<b>对数</b>反解：ln2/ln(1+r)（约等于 72÷利率，就是 72 法则）。';
  document.getElementById("hint").textContent="把年限拖大，看蓝线后期是怎么「翘起来」的——这就是复利的威力。";}
window.addEventListener("resize",function(){fit();draw();});
fit();buildParams();draw();
</script>
</body>
</html>
