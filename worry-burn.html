<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>烦恼焚烧炉</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a0f00;
    --bg2: #2d1a00;
    --paper: #f5ead6;
    --paper-shadow: #d4c4a0;
    --ember: #ff6b1a;
    --flame1: #ff4500;
    --flame2: #ff8c00;
    --flame3: #ffd700;
    --text-dark: #3b2a14;
    --text-light: #f0e8d8;
    --text-muted: #a08060;
    --accent: #e07030;
    --glow: rgba(255, 107, 26, 0.4);
  }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse at center bottom, #3d1f00 0%, #1a0f00 60%, #0d0800 100%);
    color: var(--text-light);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "SimHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    opacity: 0.7;
    transition: opacity 0.2s;
    z-index: 100;
  }
  .back-link:hover { opacity: 1; }

  header {
    text-align: center;
    margin: 48px 0 32px;
  }
  header h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--text-light);
    text-shadow: 0 0 20px var(--glow), 0 0 40px rgba(255,69,0,0.3);
  }
  header p {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .furnace-scene {
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  /* ---- 纸条区 ---- */
  .paper-zone {
    width: 100%;
    position: relative;
  }

  .paper-card {
    background: var(--paper);
    border-radius: 4px 4px 2px 2px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 1px 0 var(--paper-shadow) inset;
    padding: 20px;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s;
  }
  .paper-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: repeating-linear-gradient(90deg, #d4b896 0px, #d4b896 8px, transparent 8px, transparent 12px);
  }
  .paper-lines {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: repeating-linear-gradient(transparent, transparent 27px, #e0d0b0 27px, #e0d0b0 28px);
    background-position: 0 32px;
    pointer-events: none;
    opacity: 0.5;
  }

  #worry-input {
    width: 100%;
    min-height: 140px;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-size: 15px;
    line-height: 28px;
    color: var(--text-dark);
    font-family: inherit;
    position: relative;
    z-index: 1;
    caret-color: var(--accent);
  }
  #worry-input::placeholder { color: #b09878; }

  .char-count {
    text-align: right;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* ---- 焚烧动画舞台 ---- */
  .burn-stage {
    width: 100%;
    max-width: 460px;
    height: 200px;
    position: relative;
    display: none;
  }

  .burn-paper {
    position: absolute;
    left: 50%;
    top: 10px;
    transform: translateX(-50%);
    width: 280px;
    min-height: 120px;
    background: var(--paper);
    border-radius: 3px;
    padding: 16px;
    font-size: 14px;
    color: var(--text-dark);
    line-height: 1.7;
    word-break: break-all;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    transform-origin: bottom center;
    pointer-events: none;
  }

  /* Canvas for fire */
  #fire-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* ---- 按钮 ---- */
  .btn-burn {
    background: linear-gradient(135deg, #c84000, #ff6b1a);
    color: #fff;
    border: none;
    border-radius: 40px;
    padding: 14px 48px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 4px 24px rgba(255,107,26,0.45), 0 1px 0 rgba(255,255,255,0.15) inset;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    position: relative;
    overflow: hidden;
  }
  .btn-burn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(255,107,26,0.6);
  }
  .btn-burn:active:not(:disabled) { transform: translateY(0); }
  .btn-burn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* ---- 宽慰语 ---- */
  .comfort-box {
    display: none;
    background: rgba(255, 160, 60, 0.1);
    border: 1px solid rgba(255, 140, 40, 0.25);
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    width: 100%;
    max-width: 460px;
    backdrop-filter: blur(4px);
  }
  .comfort-box p {
    font-size: 15px;
    line-height: 1.8;
    color: #f0d8b0;
    font-style: italic;
  }
  .comfort-box .comfort-icon {
    font-size: 28px;
    margin-bottom: 10px;
    display: block;
  }

  /* ---- 历史 ---- */
  .history-section {
    width: 100%;
    max-width: 460px;
    margin-top: 16px;
  }
  .history-toggle {
    background: none;
    border: 1px solid rgba(160,128,96,0.3);
    color: var(--text-muted);
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }
  .history-toggle:hover { border-color: var(--accent); color: var(--accent); }

  #history-list {
    display: none;
    margin-top: 14px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #history-list.collapsed { display: none; }

  .history-item {
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .history-item .htext {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #c0a880;
  }
  .history-item .hdate { font-size: 11px; opacity: 0.6; flex-shrink: 0; }

  footer {
    margin: 32px 0 20px;
    font-size: 11px;
    color: #50382a;
    text-align: center;
    letter-spacing: 1px;
  }

  /* 灰烬粒子 */
  @keyframes ashFloat {
    0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--dr)); opacity: 0; }
  }

  /* 舞台激活时隐藏纸条输入区 */
  .burning .paper-zone { opacity: 0; pointer-events: none; transition: opacity 0.3s; }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<header>
  <h1>烦恼焚烧炉</h1>
  <p>写下它，烧掉它，放下它</p>
</header>

<div class="furnace-scene" id="main-scene">

  <!-- 纸条输入 -->
  <div class="paper-zone" id="paper-zone">
    <div class="paper-card">
      <div class="paper-lines"></div>
      <textarea id="worry-input" maxlength="200"
        placeholder="把烦恼写在这里……不管多委屈、多难受，都可以说出来。"></textarea>
    </div>
    <div class="char-count"><span id="char-num">0</span> / 200</div>
  </div>

  <!-- 焚烧动画舞台 -->
  <div class="burn-stage" id="burn-stage">
    <canvas id="fire-canvas"></canvas>
    <div class="burn-paper" id="burn-paper"></div>
  </div>

  <!-- 烧掉按钮 -->
  <button class="btn-burn" id="btn-burn" disabled>烧 掉 它</button>

  <!-- 宽慰语 -->
  <div class="comfort-box" id="comfort-box">
    <span class="comfort-icon">🌙</span>
    <p id="comfort-text"></p>
  </div>

  <!-- 历史 -->
  <div class="history-section" id="history-section">
    <button class="history-toggle" id="history-toggle">已烧掉的烦恼</button>
    <ul id="history-list" class="collapsed"></ul>
  </div>

</div>

<footer>烦恼付诸一炬，心归宁静</footer>

<script>
(function () {
  "use strict";

  /* ====== 数据 ====== */
  var STORAGE_KEY = "worry_burn_history";
  var MAX_HISTORY = 20;

  var COMFORT_WORDS = [
    "烦恼已化为灰烬，风会把它们带走。你比自己想象的更有力量。",
    "每一次烧掉，都是一次轻装上阵。明天的你，会感谢今天放手的你。",
    "说出来，再烧掉——这本身就是一种勇气。慢慢来，不着急。",
    "世界很大，烦恼很小。此刻烟散尽，心里多了一寸空地。",
    "没关系的，真的。有些事不必强撑，放下才是对自己最好的温柔。",
    "烦恼烧完了，剩下的是你本来的样子——那个很好的你。",
    "今天辛苦了。把这些烦恼留给火吧，今晚好好睡一觉。",
    "灰烬会滋养新芽。你经历的，终将变成你的底气。",
    "不是所有事都需要解决，有些事只需要放下。你做到了。",
    "深呼吸。烟散了，你还在——这就足够了。"
  ];

  /* ====== DOM 引用 ====== */
  var worryInput    = document.getElementById("worry-input");
  var charNum       = document.getElementById("char-num");
  var btnBurn       = document.getElementById("btn-burn");
  var paperZone     = document.getElementById("paper-zone");
  var burnStage     = document.getElementById("burn-stage");
  var burnPaper     = document.getElementById("burn-paper");
  var fireCanvas    = document.getElementById("fire-canvas");
  var comfortBox    = document.getElementById("comfort-box");
  var comfortText   = document.getElementById("comfort-text");
  var historyToggle = document.getElementById("history-toggle");
  var historyList   = document.getElementById("history-list");
  var mainScene     = document.getElementById("main-scene");

  /* ====== 状态 ====== */
  var isBurning      = false;
  var animFrameId    = null;
  var historyVisible = false;

  /* ====== 工具函数 ====== */
  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveHistory(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch (e) {}
  }

  function addToHistory(text) {
    var list = loadHistory();
    var now  = new Date();
    var dateStr = now.getFullYear() + "/" +
                  String(now.getMonth() + 1).padStart(2, "0") + "/" +
                  String(now.getDate()).padStart(2, "0");
    list.unshift({ text: text, date: dateStr });
    if (list.length > MAX_HISTORY) { list = list.slice(0, MAX_HISTORY); }
    saveHistory(list);
  }

  function renderHistory() {
    var list = loadHistory();
    historyList.innerHTML = "";
    if (list.length === 0) {
      var li = document.createElement("li");
      li.className = "history-item";
      li.style.justifyContent = "center";
      li.textContent = "还没有烧过烦恼";
      historyList.appendChild(li);
      return;
    }
    list.forEach(function (item) {
      var li   = document.createElement("li");
      li.className = "history-item";
      var sp1 = document.createElement("span");
      sp1.className = "htext";
      sp1.textContent = item.text;
      var sp2 = document.createElement("span");
      sp2.className = "hdate";
      sp2.textContent = item.date;
      li.appendChild(sp1);
      li.appendChild(sp2);
      historyList.appendChild(li);
    });
  }

  function randomComfort() {
    return COMFORT_WORDS[Math.floor(Math.random() * COMFORT_WORDS.length)];
  }

  /* ====== 火焰粒子系统 ====== */
  var ctx = null;
  var particles = [];
  var ashParticles = [];
  var burnProgress = 0;   // 0→1 纸条消耗进度
  var burnDone = false;
  var burnStartTime = 0;
  var BURN_DURATION = 3200; // ms

  function Particle(x, y, type) {
    this.x = x;
    this.y = y;
    this.type = type || "flame"; // flame | ember | ash
    this.reset();
  }
  Particle.prototype.reset = function () {
    this.vx   = (Math.random() - 0.5) * 1.5;
    this.vy   = -(Math.random() * 3 + 1.5);
    this.life = Math.random() * 0.6 + 0.4; // 0.4~1
    this.maxLife = this.life;
    this.r    = Math.random() * 12 + 6;
    this.waver = Math.random() * Math.PI * 2;
  };

  function spawnFlameParticles(baseX, edgeY, count) {
    for (var i = 0; i < count; i++) {
      var x = baseX + (Math.random() - 0.5) * 60;
      var p = new Particle(x, edgeY, "flame");
      p.vy = -(Math.random() * 2 + 1);
      p.r  = Math.random() * 10 + 4;
      particles.push(p);
    }
  }

  function spawnEmbers(baseX, edgeY, count) {
    for (var i = 0; i < count; i++) {
      var p = {
        x: baseX + (Math.random() - 0.5) * 80,
        y: edgeY,
        vx: (Math.random() - 0.5) * 2,
        vy: -(Math.random() * 1.5 + 0.5),
        life: 1,
        r: Math.random() * 2.5 + 1,
        type: "ember"
      };
      particles.push(p);
    }
  }

  function spawnAsh(baseX, baseY) {
    var p = {
      x: baseX + (Math.random() - 0.5) * 100,
      y: baseY,
      vx: (Math.random() - 0.5) * 0.6,
      vy: -(Math.random() * 0.8 + 0.2),
      life: 1,
      r: Math.random() * 3 + 1,
      type: "ash"
    };
    ashParticles.push(p);
  }

  function drawFlameParticle(c, p, progress) {
    var ratio = p.life / p.maxLife;
    var alpha = Math.min(ratio * 1.5, 1);
    var r0 = p.r * ratio;
    if (r0 < 0.5) return;

    var grad = c.createRadialGradient(p.x, p.y, 0, p.x, p.y, r0);
    var centerColor = "rgba(255,240,80," + alpha + ")";
    var midColor    = "rgba(255,130,10," + (alpha * 0.8) + ")";
    var outerColor  = "rgba(200,30,0,0)";
    grad.addColorStop(0,   centerColor);
    grad.addColorStop(0.4, midColor);
    grad.addColorStop(1,   outerColor);
    c.beginPath();
    c.arc(p.x, p.y, r0, 0, Math.PI * 2);
    c.fillStyle = grad;
    c.fill();
  }

  function drawEmber(c, p) {
    var alpha = p.life;
    c.beginPath();
    c.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    c.fillStyle = "rgba(255,200,50," + alpha + ")";
    c.fill();
  }

  function drawAsh(c, p) {
    var alpha = p.life * 0.7;
    c.beginPath();
    c.ellipse(p.x, p.y, p.r * 1.5, p.r * 0.5, p.waver || 0, 0, Math.PI * 2);
    c.fillStyle = "rgba(80,60,40," + alpha + ")";
    c.fill();
  }

  function resizeCanvas() {
    var stage = burnStage;
    fireCanvas.width  = stage.offsetWidth;
    fireCanvas.height = stage.offsetHeight;
  }

  function startBurnAnimation(text) {
    isBurning    = true;
    burnProgress = 0;
    burnDone     = false;
    burnStartTime = performance.now();
    particles    = [];
    ashParticles = [];

    // 显示舞台
    burnStage.style.display = "block";
    paperZone.style.display = "none";
    burnPaper.textContent   = text;
    comfortBox.style.display = "none";

    resizeCanvas();
    ctx = fireCanvas.getContext("2d");

    if (animFrameId) { cancelAnimationFrame(animFrameId); }
    animFrameId = requestAnimationFrame(animLoop);
  }

  function animLoop(now) {
    var elapsed  = now - burnStartTime;
    burnProgress = Math.min(elapsed / BURN_DURATION, 1);

    ctx.clearRect(0, 0, fireCanvas.width, fireCanvas.height);

    var paperEl = burnPaper;
    var pRect   = paperEl.getBoundingClientRect();
    var stRect  = burnStage.getBoundingClientRect();

    var paperLeft   = pRect.left   - stRect.left;
    var paperTop    = pRect.top    - stRect.top;
    var paperW      = pRect.width;
    var paperH      = pRect.height;
    var centerX     = paperLeft + paperW / 2;

    // 纸条从下往上烧——clipPath
    var burnLine = paperTop + paperH * (1 - burnProgress); // 火焰前沿 Y

    // 裁切：只显示未燃部分（上方）
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, fireCanvas.width, burnLine);
    ctx.clip();
    // 在裁切区外（纸条已燃部分）绘制发黑遮罩
    ctx.restore();

    // 用半透明黑色涂抹已燃部分（纸条下方）
    if (burnProgress > 0) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(paperLeft, burnLine, paperW, paperTop + paperH - burnLine);
      ctx.fillStyle = "rgba(10,5,0," + Math.min(burnProgress * 1.5, 0.9) + ")";
      ctx.fill();
      ctx.restore();
    }

    // 同步更新纸条的 clipPath 视觉
    paperEl.style.clipPath = "inset(0 0 " + (burnProgress * 100) + "% 0)";
    paperEl.style.filter   = burnProgress > 0.1
      ? "sepia(" + (burnProgress * 0.8) + ") brightness(" + (1 - burnProgress * 0.5) + ")"
      : "";

    // 生成火焰粒子
    if (!burnDone) {
      var spawnCount = Math.floor(burnProgress * 5) + 2;
      spawnFlameParticles(centerX, burnLine, spawnCount);
      if (Math.random() < 0.3) { spawnEmbers(centerX, burnLine, 1); }
    }

    // 灰烬生成（烧到后半段）
    if (burnProgress > 0.5 && !burnDone) {
      if (Math.random() < 0.4) {
        spawnAsh(centerX, burnLine);
      }
    }

    // 更新 & 绘制火焰/火星粒子
    particles = particles.filter(function (p) {
      p.waver = (p.waver || 0) + 0.1;
      p.x  += p.vx + Math.sin(p.waver) * 0.5;
      p.y  += p.vy;
      p.vy *= 0.97;
      p.life -= 0.035;
      return p.life > 0;
    });
    particles.forEach(function (p) {
      if (p.type === "ember") { drawEmber(ctx, p); }
      else                    { drawFlameParticle(ctx, p, burnProgress); }
    });

    // 灰烬粒子
    ashParticles = ashParticles.filter(function (p) {
      p.waver = (p.waver || Math.random() * Math.PI * 2);
      p.waver += 0.04;
      p.x += p.vx + Math.sin(p.waver) * 0.4;
      p.y += p.vy;
      p.vy -= 0.01;
      p.life -= 0.008;
      return p.life > 0;
    });
    ashParticles.forEach(function (p) {
      drawAsh(ctx, p);
    });

    // 全局火焰光晕
    if (!burnDone && burnProgress > 0.05) {
      var glow = ctx.createRadialGradient(centerX, burnLine, 0, centerX, burnLine, 60 * burnProgress);
      glow.addColorStop(0, "rgba(255,140,30," + (burnProgress * 0.18) + ")");
      glow.addColorStop(1, "rgba(255,80,0,0)");
      ctx.beginPath();
      ctx.arc(centerX, burnLine, 60 * burnProgress, 0, Math.PI * 2);
      ctx.fillStyle = glow;
      ctx.fill();
    }

    if (burnProgress < 1) {
      animFrameId = requestAnimationFrame(animLoop);
    } else {
      // 燃尽——继续播放灰烬飘散若干帧
      burnDone = true;
      paperEl.style.clipPath = "inset(0 0 100% 0)";
      // 多生成灰烬
      for (var i = 0; i < 20; i++) { spawnAsh(centerX, burnLine); }
      afterBurnLoop(performance.now());
    }
  }

  function afterBurnLoop(startT) {
    var maxDur = 1800;
    function loop(now) {
      var t = now - startT;
      ctx.clearRect(0, 0, fireCanvas.width, fireCanvas.height);
      if (Math.random() < 0.3) {
        var cx2 = fireCanvas.width / 2;
        var cy2 = fireCanvas.height * 0.85;
        spawnAsh(cx2, cy2);
      }
      ashParticles = ashParticles.filter(function (p) {
        p.waver = (p.waver || 0) + 0.04;
        p.x += p.vx + Math.sin(p.waver) * 0.4;
        p.y += p.vy;
        p.vy -= 0.01;
        p.life -= 0.012;
        return p.life > 0;
      });
      ashParticles.forEach(function (p) { drawAsh(ctx, p); });
      if (t < maxDur) {
        animFrameId = requestAnimationFrame(loop);
      } else {
        finishBurn();
      }
    }
    animFrameId = requestAnimationFrame(loop);
  }

  function finishBurn() {
    isBurning = false;
    burnStage.style.display = "none";
    burnPaper.style.clipPath = "";
    burnPaper.style.filter   = "";
    paperZone.style.display = "block";
    worryInput.value = "";
    charNum.textContent = "0";
    btnBurn.disabled = true;

    // 显示宽慰语
    comfortText.textContent = randomComfort();
    comfortBox.style.display = "block";
    comfortBox.style.animation = "none";
    comfortBox.offsetHeight; // reflow
    comfortBox.style.opacity = "0";
    comfortBox.style.transition = "opacity 0.8s";
    setTimeout(function () { comfortBox.style.opacity = "1"; }, 50);

    // 刷新历史
    if (historyVisible) { renderHistory(); }
  }

  /* ====== 事件绑定 ====== */
  worryInput.addEventListener("input", function () {
    var len = worryInput.value.length;
    charNum.textContent = len;
    btnBurn.disabled = (len === 0 || isBurning);
  });

  btnBurn.addEventListener("click", function () {
    var text = worryInput.value.trim();
    if (!text || isBurning) { return; }
    addToHistory(text);
    startBurnAnimation(text);
  });

  historyToggle.addEventListener("click", function () {
    historyVisible = !historyVisible;
    if (historyVisible) {
      renderHistory();
      historyList.classList.remove("collapsed");
      historyToggle.textContent = "收起历史";
    } else {
      historyList.classList.add("collapsed");
      historyToggle.textContent = "已烧掉的烦恼";
    }
  });

  window.addEventListener("resize", function () {
    if (isBurning) { resizeCanvas(); }
  });

  /* ====== 初始化 ====== */
  (function init() {
    charNum.textContent  = "0";
    btnBurn.disabled     = true;
    burnStage.style.display = "none";
    comfortBox.style.display = "none";
    historyList.classList.add("collapsed");
  })();

})();
</script>
</body>
</html>
