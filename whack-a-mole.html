<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打地鼠</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --card: #0f3460;
    --accent: #e94560;
    --accent2: #f5a623;
    --green: #4caf50;
    --text: #eaeaea;
    --muted: #8892a4;
    --hole: #0a1628;
    --dirt: #6b4c2a;
    --dirt2: #8b6340;
    --mole-body: #c8875a;
    --mole-face: #f0b98a;
    --radius: 16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  .back-link {
    position: fixed;
    top: 12px;
    left: 14px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    opacity: 0.7;
    transition: opacity 0.2s;
    z-index: 100;
  }
  .back-link:hover { opacity: 1; color: var(--text); }

  .game-wrapper {
    width: 100%;
    max-width: 480px;
    margin-top: 40px;
  }

  h1 {
    text-align: center;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 4px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }

  .scoreboard {
    display: flex;
    justify-content: space-around;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 10px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.06);
  }

  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .score-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .score-value {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--text);
    transition: transform 0.15s, color 0.15s;
    line-height: 1;
  }

  .score-value.pop {
    transform: scale(1.4);
    color: var(--accent2);
  }

  #timer-val {
    color: var(--accent);
  }

  #timer-val.urgent {
    animation: pulse-red 0.5s infinite;
  }

  @keyframes pulse-red {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }

  .hole-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .hole {
    width: 100%;
    aspect-ratio: 1 / 0.7;
    background: var(--dirt);
    border-radius: 50%;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    border: 3px solid var(--dirt2);
    box-shadow: inset 0 8px 16px rgba(0,0,0,0.5), 0 4px 12px rgba(0,0,0,0.4);
    transition: transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .hole:active { transform: scale(0.97); }

  .hole-inner {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 75%;
    aspect-ratio: 1 / 0.65;
    background: var(--hole);
    border-radius: 50%;
    z-index: 1;
  }

  .mole {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%) translateY(100%);
    width: 60%;
    z-index: 2;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    user-select: none;
  }

  .mole.up {
    transform: translateX(-50%) translateY(28%);
  }

  .mole.hit {
    transform: translateX(-50%) translateY(28%) rotate(-20deg) scale(0.8);
    filter: brightness(1.8) saturate(0.3);
  }

  .mole svg {
    width: 100%;
    height: auto;
    display: block;
  }

  .hit-flash {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(circle, rgba(255,200,0,0.7) 0%, transparent 70%);
    border-radius: 50%;
    opacity: 0;
    pointer-events: none;
    z-index: 5;
    animation: none;
  }

  .hit-flash.flash {
    animation: flashAnim 0.3s ease-out forwards;
  }

  @keyframes flashAnim {
    0% { opacity: 1; transform: scale(0.5); }
    100% { opacity: 0; transform: scale(1.4); }
  }

  .hit-score {
    position: absolute;
    top: 10%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.2rem;
    font-weight: 800;
    color: var(--accent2);
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }

  .hit-score.animate {
    animation: floatUp 0.7s ease-out forwards;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(1.4); }
  }

  .btn {
    display: block;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius);
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    outline: none;
  }

  .btn:active { transform: scale(0.97); }

  #start-btn {
    background: linear-gradient(135deg, var(--accent), #c0392b);
    color: #fff;
    box-shadow: 0 4px 20px rgba(233,69,96,0.4);
    margin-bottom: 10px;
  }

  #start-btn:hover { box-shadow: 0 6px 28px rgba(233,69,96,0.6); transform: translateY(-1px); }
  #start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,14,30,0.88);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }

  .overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 36px 32px;
    text-align: center;
    max-width: 320px;
    width: 90%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes modalIn {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .modal-icon {
    font-size: 3rem;
    margin-bottom: 12px;
  }

  .modal h2 {
    font-size: 1.6rem;
    font-weight: 800;
    margin-bottom: 8px;
    color: var(--accent2);
  }

  .modal-score {
    font-size: 3rem;
    font-weight: 900;
    color: var(--text);
    margin: 12px 0;
    line-height: 1;
  }

  .modal-best {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .modal-best span {
    color: var(--accent2);
    font-weight: 700;
  }

  .new-record {
    display: inline-block;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
    letter-spacing: 1px;
  }

  .modal .btn {
    background: linear-gradient(135deg, var(--accent), #c0392b);
    color: #fff;
    box-shadow: 0 4px 16px rgba(233,69,96,0.4);
  }

  .progress-bar-wrap {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    margin-bottom: 20px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 3px;
    transition: width 1s linear;
    width: 100%;
  }

  @media (max-width: 380px) {
    h1 { font-size: 1.6rem; }
    .score-value { font-size: 1.4rem; }
    .grid { gap: 10px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="game-wrapper">
  <h1>打地鼠</h1>
  <p class="subtitle">快速点击冒出的地鼠得分！</p>

  <div class="scoreboard">
    <div class="score-item">
      <span class="score-label">得分</span>
      <span class="score-value" id="score-val">0</span>
    </div>
    <div class="score-item">
      <span class="score-label">倒计时</span>
      <span class="score-value" id="timer-val">30</span>
    </div>
    <div class="score-item">
      <span class="score-label">最高分</span>
      <span class="score-value" id="best-val">0</span>
    </div>
  </div>

  <div class="progress-bar-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <div class="grid" id="grid"></div>

  <button class="btn" id="start-btn">开始游戏</button>
</div>

<div class="overlay" id="result-overlay">
  <div class="modal">
    <div class="modal-icon">🎉</div>
    <h2>游戏结束</h2>
    <div class="modal-score" id="result-score">0</div>
    <div id="new-record-badge" class="new-record" style="display:none;">新纪录！</div>
    <div class="modal-best">历史最高：<span id="result-best">0</span> 分</div>
    <button class="btn" id="replay-btn">再玩一次</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ---------- 常量 ---------- */
  var TOTAL_TIME = 30;
  var HOLE_COUNT = 9;
  var LS_KEY = "whack_a_mole_best";

  /* ---------- 状态变量 ---------- */
  var score = 0;
  var timeLeft = TOTAL_TIME;
  var running = false;
  var moleTimers = [];
  var countdownInterval = null;
  var holeStates = []; // true = 地鼠在上面
  var holeHitTimers = []; // 命中后隐藏计时器

  /* ---------- DOM 引用 ---------- */
  var scoreVal = document.getElementById("score-val");
  var timerVal = document.getElementById("timer-val");
  var bestVal = document.getElementById("best-val");
  var gridEl = document.getElementById("grid");
  var startBtn = document.getElementById("start-btn");
  var progressBar = document.getElementById("progress-bar");
  var resultOverlay = document.getElementById("result-overlay");
  var resultScore = document.getElementById("result-score");
  var resultBest = document.getElementById("result-best");
  var newRecordBadge = document.getElementById("new-record-badge");
  var replayBtn = document.getElementById("replay-btn");

  /* ---------- 工具函数 ---------- */
  function getBest() {
    var v = parseInt(localStorage.getItem(LS_KEY), 10);
    return isNaN(v) ? 0 : v;
  }

  function saveBest(v) {
    localStorage.setItem(LS_KEY, String(v));
  }

  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  /* ---------- 地鼠 SVG ---------- */
  function moleSVG(idx) {
    var colors = ["#c8875a", "#b87040", "#d09070"];
    var bodyColor = colors[idx % colors.length];
    return '<svg viewBox="0 0 60 52" xmlns="http://www.w3.org/2000/svg">'
      + '<ellipse cx="30" cy="36" rx="22" ry="18" fill="' + bodyColor + '"/>'
      + '<ellipse cx="30" cy="22" rx="16" ry="16" fill="' + bodyColor + '"/>'
      + '<ellipse cx="30" cy="22" rx="11" ry="12" fill="#f0b98a"/>'
      + '<ellipse cx="22" cy="17" rx="4" ry="5" fill="#fff"/>'
      + '<ellipse cx="38" cy="17" rx="4" ry="5" fill="#fff"/>'
      + '<circle cx="22" cy="18" r="2.5" fill="#2c1a0e"/>'
      + '<circle cx="38" cy="18" r="2.5" fill="#2c1a0e"/>'
      + '<circle cx="23" cy="17" r="1" fill="#fff"/>'
      + '<circle cx="39" cy="17" r="1" fill="#fff"/>'
      + '<ellipse cx="30" cy="27" rx="5" ry="3.5" fill="#e08070"/>'
      + '<ellipse cx="30" cy="26" rx="3" ry="2" fill="#c05060"/>'
      + '<ellipse cx="24" cy="24" rx="3" ry="2" fill="#e8a090" opacity="0.6"/>'
      + '<ellipse cx="36" cy="24" rx="3" ry="2" fill="#e8a090" opacity="0.6"/>'
      + '<ellipse cx="14" cy="20" rx="5" ry="3.5" transform="rotate(-20 14 20)" fill="' + bodyColor + '"/>'
      + '<ellipse cx="46" cy="20" rx="5" ry="3.5" transform="rotate(20 46 20)" fill="' + bodyColor + '"/>'
      + '</svg>';
  }

  /* ---------- 构建格子 ---------- */
  function buildGrid() {
    gridEl.innerHTML = "";
    holeStates = [];
    holeHitTimers = [];
    moleTimers = [];

    for (var i = 0; i < HOLE_COUNT; i++) {
      holeStates.push(false);
      holeHitTimers.push(null);
      moleTimers.push(null);

      var wrap = document.createElement("div");
      wrap.className = "hole-wrap";

      var hole = document.createElement("div");
      hole.className = "hole";
      hole.dataset.index = String(i);

      var inner = document.createElement("div");
      inner.className = "hole-inner";

      var mole = document.createElement("div");
      mole.className = "mole";
      mole.id = "mole-" + i;
      mole.innerHTML = moleSVG(i);

      var flash = document.createElement("div");
      flash.className = "hit-flash";
      flash.id = "flash-" + i;

      var hitScoreEl = document.createElement("div");
      hitScoreEl.className = "hit-score";
      hitScoreEl.id = "hitscore-" + i;
      hitScoreEl.textContent = "+1";

      hole.appendChild(inner);
      hole.appendChild(mole);
      hole.appendChild(flash);
      hole.appendChild(hitScoreEl);
      wrap.appendChild(hole);
      gridEl.appendChild(wrap);

      hole.addEventListener("click", onHoleClick);
      hole.addEventListener("touchend", function(e) { e.preventDefault(); });
    }
  }

  /* ---------- 点击洞 ---------- */
  function onHoleClick(e) {
    if (!running) return;
    var idx = parseInt(this.dataset.index, 10);
    if (!holeStates[idx]) return;

    // 命中！
    holeStates[idx] = false;
    score += 1;
    updateScore();

    var moleEl = document.getElementById("mole-" + idx);
    var flashEl = document.getElementById("flash-" + idx);
    var hitScoreEl = document.getElementById("hitscore-" + idx);

    // 命中动画
    moleEl.classList.remove("up");
    moleEl.classList.add("hit");

    flashEl.classList.remove("flash");
    void flashEl.offsetWidth;
    flashEl.classList.add("flash");

    hitScoreEl.classList.remove("animate");
    void hitScoreEl.offsetWidth;
    hitScoreEl.classList.add("animate");

    // 清除之前的隐藏计时器
    if (holeHitTimers[idx]) {
      clearTimeout(holeHitTimers[idx]);
      holeHitTimers[idx] = null;
    }
    if (moleTimers[idx]) {
      clearTimeout(moleTimers[idx]);
      moleTimers[idx] = null;
    }

    holeHitTimers[idx] = setTimeout(function() {
      moleEl.classList.remove("hit");
    }, 400);
  }

  /* ---------- 地鼠弹出逻辑 ---------- */
  function scheduleMole(idx) {
    if (!running) return;
    var delay = rand(300, 1200);
    moleTimers[idx] = setTimeout(function() {
      if (!running) return;
      popMole(idx);
    }, delay);
  }

  function popMole(idx) {
    if (!running || holeStates[idx]) return;
    holeStates[idx] = true;

    var moleEl = document.getElementById("mole-" + idx);
    moleEl.classList.remove("hit");
    moleEl.classList.add("up");

    var stayTime = rand(700, 1600);
    moleTimers[idx] = setTimeout(function() {
      hideMole(idx);
    }, stayTime);
  }

  function hideMole(idx) {
    holeStates[idx] = false;
    var moleEl = document.getElementById("mole-" + idx);
    moleEl.classList.remove("up", "hit");

    if (running) {
      scheduleMole(idx);
    }
  }

  /* ---------- 分数更新 ---------- */
  function updateScore() {
    scoreVal.textContent = String(score);
    scoreVal.classList.remove("pop");
    void scoreVal.offsetWidth;
    scoreVal.classList.add("pop");
    setTimeout(function() { scoreVal.classList.remove("pop"); }, 200);
  }

  /* ---------- 开始游戏 ---------- */
  function startGame() {
    score = 0;
    timeLeft = TOTAL_TIME;
    running = true;

    scoreVal.textContent = "0";
    timerVal.textContent = String(TOTAL_TIME);
    timerVal.classList.remove("urgent");
    progressBar.style.width = "100%";
    progressBar.style.transition = "width 1s linear";

    startBtn.disabled = true;
    resultOverlay.classList.remove("show");

    buildGrid();

    // 错开启动各洞
    for (var i = 0; i < HOLE_COUNT; i++) {
      scheduleMole(i);
    }

    countdownInterval = setInterval(tick, 1000);
  }

  function tick() {
    timeLeft -= 1;
    timerVal.textContent = String(timeLeft);
    var pct = (timeLeft / TOTAL_TIME) * 100;
    progressBar.style.width = pct + "%";

    if (timeLeft <= 5) {
      timerVal.classList.add("urgent");
    }

    if (timeLeft <= 0) {
      endGame();
    }
  }

  /* ---------- 结束游戏 ---------- */
  function endGame() {
    running = false;
    clearInterval(countdownInterval);
    countdownInterval = null;

    // 清除所有地鼠计时器
    for (var i = 0; i < HOLE_COUNT; i++) {
      if (moleTimers[i]) { clearTimeout(moleTimers[i]); moleTimers[i] = null; }
      if (holeHitTimers[i]) { clearTimeout(holeHitTimers[i]); holeHitTimers[i] = null; }
      // 隐藏所有地鼠
      var moleEl = document.getElementById("mole-" + i);
      if (moleEl) { moleEl.classList.remove("up", "hit"); }
      holeStates[i] = false;
    }

    var best = getBest();
    var isNew = score > best;
    if (isNew) {
      best = score;
      saveBest(best);
    }

    bestVal.textContent = String(best);
    resultScore.textContent = String(score);
    resultBest.textContent = String(best);
    newRecordBadge.style.display = isNew ? "inline-block" : "none";

    startBtn.disabled = false;
    resultOverlay.classList.add("show");
  }

  /* ---------- 事件绑定 ---------- */
  startBtn.addEventListener("click", function() {
    if (!running) { startGame(); }
  });

  replayBtn.addEventListener("click", function() {
    resultOverlay.classList.remove("show");
    startGame();
  });

  resultOverlay.addEventListener("click", function(e) {
    if (e.target === resultOverlay) {
      resultOverlay.classList.remove("show");
      startBtn.disabled = false;
    }
  });

  /* ---------- 初始化 ---------- */
  (function init() {
    var best = getBest();
    bestVal.textContent = String(best);
    buildGrid();
  }());

}());
</script>
</body>
</html>
