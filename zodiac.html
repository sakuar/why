<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生肖物语</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#160f28;color:#e8eef7;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:46px 16px 60px;}
  .back{position:fixed;top:14px;left:16px;color:#6b6f8a;text-decoration:none;font-size:13px;}
  .back:hover{color:#b98cff;}
  h1{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#b98cff,#ff8aa0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{color:#8090a8;font-size:13px;margin:6px 0 18px;}
  .row{display:flex;gap:10px;align-items:center;}
  input{background:#1d1636;border:1px solid #3a2a5e;border-radius:10px;color:#e8eef7;padding:11px 14px;font-size:15px;width:130px;text-align:center;font-family:inherit;}
  button{background:#7d5fff;color:#fff;border:none;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;}
  button:hover{background:#9579ff;}
  .res{margin-top:26px;text-align:center;max-width:480px;opacity:0;transition:.4s;}
  .res.show{opacity:1;}
  .emoji{font-size:5rem;}
  .name{font-size:1.6rem;font-weight:800;margin:6px 0;color:#d9c6ff;}
  .tag{display:inline-block;background:#2a1f48;border:1px solid #3a2a5e;border-radius:20px;padding:4px 14px;font-size:13px;color:#c3a6ff;margin:4px 4px;}
  .desc{color:#aab6cc;font-size:14px;line-height:1.8;margin-top:14px;}
</style>
</head>
<body>
<a class="back" href="index.html">← 入口</a>
<h1>生肖物语</h1>
<p class="sub">输入出生年份，看看你的生肖性格</p>
<div class="row"><input type="number" id="yr" value="2000" min="1900" max="2100"><button id="go">看生肖</button></div>
<div class="res" id="res"></div>
<script>
"use strict";
(function(){
  var Z=[
    ["鼠","🐭",["机灵","敏锐","节俭"],"心思活络，反应快，善于在变化中找到机会；有时想得太多，记得给自己留点松弛。"],
    ["牛","🐂",["踏实","坚韧","可靠"],"认定的事就一步步做到底，是朋友眼里最稳的那一个；偶尔也允许自己绕个弯。"],
    ["虎","🐯",["勇敢","热烈","有领导力"],"自带气场，敢冲敢拼，点子来了就行动；记得给身边人留点跟上的时间。"],
    ["兔","🐰",["温和","细腻","审美好"],"待人温柔，注重氛围与细节，是治愈系的存在；偶尔也要为自己的需求发声。"],
    ["龙","🐲",["自信","有魄力","理想主义"],"天生有主角感，目标远大，能带动一群人；落地时多一点耐心会更顺。"],
    ["蛇","🐍",["睿智","沉静","洞察力强"],"安静却看得很透，深思熟虑后才出手；适当表达，会让人更靠近你。"],
    ["马","🐴",["热情","自由","行动派"],"喜欢辽阔与远方，不爱被束缚，说走就走；专注一件事时能量惊人。"],
    ["羊","🐑",["善良","有创造力","重情"],"内心柔软，富有想象力，常为他人着想；也别忘了先照顾好自己。"],
    ["猴","🐵",["聪明","幽默","灵活"],"脑子转得飞快，幽默又会来事，走到哪都不冷场；坚持到底会更出彩。"],
    ["鸡","🐔",["勤奋","条理","直率"],"做事有规划、爱琢磨细节，眼里揉不得沙子；放松标准时人缘会更好。"],
    ["狗","🐶",["忠诚","正直","重义气"],"对人真诚、值得托付，是最讲义气的伙伴；偶尔也可以为自己自私一点点。"],
    ["猪","🐷",["豁达","真诚","有福气"],"心宽好相处，知足常乐，常被好运眷顾；目标感再强一点会更如愿。"]
  ];
  var yr=document.getElementById("yr"),res=document.getElementById("res");
  function go(){
    var y=parseInt(yr.value,10);
    if(isNaN(y)){res.className="res";return;}
    // 生肖以农历为准，这里用公历年近似（鼠年=4 余数）
    var idx=((y-4)%12+12)%12;
    var z=Z[idx];
    var tags="";for(var i=0;i<z[2].length;i++)tags+='<span class="tag">'+z[2][i]+'</span>';
    res.innerHTML='<div class="emoji">'+z[1]+'</div><div class="name">属'+z[0]+'</div><div>'+tags+'</div><div class="desc">'+z[3]+'</div>';
    res.className="res";void res.offsetWidth;res.className="res show";
  }
  document.getElementById("go").addEventListener("click",go);
  yr.addEventListener("keydown",function(e){if(e.key==="Enter")go();});
  go();
})();
</script>
</body>
</html>
