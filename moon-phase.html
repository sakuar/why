<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>此刻月相</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: #020b18;
    color: #e8f0fe;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    position: relative;
  }

  #back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    color: rgba(180,200,255,0.45);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.02em;
    z-index: 100;
    transition: color 0.2s;
  }
  #back-link:hover { color: rgba(180,200,255,0.85); }

  #starfield {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  .page-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    padding: 60px 24px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  .page-title {
    font-size: 15px;
    letter-spacing: 0.2em;
    color: rgba(180,200,255,0.5);
    margin-bottom: 32px;
    text-transform: uppercase;
  }

  .moon-container {
    position: relative;
    width: 220px;
    height: 220px;
    margin-bottom: 36px;
  }

  #moon-canvas {
    border-radius: 50%;
    display: block;
    filter: drop-shadow(0 0 28px rgba(200,220,255,0.18)) drop-shadow(0 0 60px rgba(160,190,255,0.1));
    animation: moonFloat 6s ease-in-out infinite;
  }

  @keyframes moonFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .moon-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 260px; height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(180,200,255,0.06) 0%, transparent 70%);
    pointer-events: none;
    animation: glowPulse 6s ease-in-out infinite;
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.06); }
  }

  .phase-name {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #d8e8ff;
    margin-bottom: 8px;
    text-align: center;
    text-shadow: 0 0 20px rgba(160,190,255,0.4);
  }

  .phase-en {
    font-size: 12px;
    letter-spacing: 0.15em;
    color: rgba(160,190,255,0.4);
    margin-bottom: 32px;
    text-align: center;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    width: 100%;
    margin-bottom: 32px;
  }

  .info-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(180,200,255,0.1);
    border-radius: 16px;
    padding: 16px 10px;
    text-align: center;
    backdrop-filter: blur(6px);
    transition: background 0.2s, border-color 0.2s;
  }
  .info-card:hover {
    background: rgba(255,255,255,0.07);
    border-color: rgba(180,200,255,0.2);
  }

  .info-label {
    font-size: 11px;
    color: rgba(160,190,255,0.5);
    margin-bottom: 6px;
    letter-spacing: 0.05em;
  }

  .info-value {
    font-size: 20px;
    font-weight: 700;
    color: #c8dcff;
    line-height: 1;
  }

  .info-unit {
    font-size: 11px;
    color: rgba(160,190,255,0.5);
    margin-top: 3px;
  }

  .progress-section {
    width: 100%;
    margin-bottom: 28px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: rgba(160,190,255,0.5);
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }

  .progress-track {
    width: 100%;
    height: 6px;
    background: rgba(255,255,255,0.07);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #3a5aff 0%, #a0b8ff 50%, #ffffff 100%);
    transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 8px rgba(160,190,255,0.5);
  }

  .cycle-row {
    display: flex;
    width: 100%;
    gap: 0;
    margin-bottom: 32px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(180,200,255,0.08);
    border-radius: 14px;
    overflow: hidden;
  }

  .cycle-item {
    flex: 1;
    padding: 10px 4px;
    text-align: center;
    font-size: 18px;
    border-right: 1px solid rgba(180,200,255,0.07);
    cursor: default;
    transition: background 0.15s;
    position: relative;
  }
  .cycle-item:last-child { border-right: none; }
  .cycle-item:hover { background: rgba(255,255,255,0.04); }
  .cycle-item.active {
    background: rgba(160,190,255,0.1);
  }
  .cycle-item.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 20px; height: 2px;
    background: rgba(180,210,255,0.6);
    border-radius: 999px;
  }

  .cycle-item-label {
    font-size: 9px;
    color: rgba(160,190,255,0.4);
    margin-top: 2px;
    letter-spacing: 0.03em;
  }

  .date-display {
    font-size: 13px;
    color: rgba(160,190,255,0.35);
    letter-spacing: 0.06em;
  }

  .tooltip {
    position: fixed;
    background: rgba(10,20,50,0.92);
    border: 1px solid rgba(180,200,255,0.15);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12px;
    color: #c8d8ff;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 200;
    white-space: nowrap;
  }

  @media (max-width: 400px) {
    .moon-container { width: 180px; height: 180px; }
    .info-value { font-size: 17px; }
    .phase-name { font-size: 24px; }
  }
</style>
</head>
<body>
<a href="index.html" id="back-link">← 入口</a>
<canvas id="starfield"></canvas>
<div class="page-wrap">
  <div class="page-title">此刻月相</div>
  <div class="moon-container">
    <div class="moon-glow"></div>
    <canvas id="moon-canvas" width="220" height="220"></canvas>
  </div>
  <div class="phase-name" id="phase-name">--</div>
  <div class="phase-en" id="phase-en">--</div>
  <div class="info-grid">
    <div class="info-card">
      <div class="info-label">月龄</div>
      <div class="info-value" id="moon-age">--</div>
      <div class="info-unit">天</div>
    </div>
    <div class="info-card">
      <div class="info-label">距满月</div>
      <div class="info-value" id="days-to-full">--</div>
      <div class="info-unit">天</div>
    </div>
    <div class="info-card">
      <div class="info-label">周期进度</div>
      <div class="info-value" id="cycle-pct">--</div>
      <div class="info-unit">%</div>
    </div>
  </div>
  <div class="progress-section">
    <div class="progress-label">
      <span>新月</span>
      <span>满月</span>
      <span>新月</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill" style="width:0%"></div>
    </div>
  </div>
  <div class="cycle-row" id="cycle-row">
    <div class="cycle-item" data-idx="0"><div>🌑</div><div class="cycle-item-label">新月</div></div>
    <div class="cycle-item" data-idx="1"><div>🌒</div><div class="cycle-item-label">蛾眉月</div></div>
    <div class="cycle-item" data-idx="2"><div>🌓</div><div class="cycle-item-label">上弦月</div></div>
    <div class="cycle-item" data-idx="3"><div>🌔</div><div class="cycle-item-label">盈凸月</div></div>
    <div class="cycle-item" data-idx="4"><div>🌕</div><div class="cycle-item-label">满月</div></div>
    <div class="cycle-item" data-idx="5"><div>🌖</div><div class="cycle-item-label">亏凸月</div></div>
    <div class="cycle-item" data-idx="6"><div>🌗</div><div class="cycle-item-label">下弦月</div></div>
    <div class="cycle-item" data-idx="7"><div>🌘</div><div class="cycle-item-label">残月</div></div>
  </div>
  <div class="date-display" id="date-display">--</div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
(function () {
  "use strict";

  // ── 常量 ──────────────────────────────────────────────
  var LUNAR_CYCLE = 29.53058867;
  var KNOWN_NEW_MOON = new Date(Date.UTC(2000, 0, 6, 18, 14, 0)); // J2000 基准新月

  var PHASES = [
    { name: "新月",  en: "New Moon",            idx: 0, min: 0,       max: 1.845  },
    { name: "蛾眉月",en: "Waxing Crescent",      idx: 1, min: 1.845,  max: 7.383  },
    { name: "上弦月",en: "First Quarter",        idx: 2, min: 7.383,  max: 11.073 },
    { name: "盈凸月",en: "Waxing Gibbous",       idx: 3, min: 11.073, max: 14.765 },
    { name: "满月",  en: "Full Moon",            idx: 4, min: 14.765, max: 16.610 },
    { name: "亏凸月",en: "Waning Gibbous",       idx: 5, min: 16.610, max: 22.153 },
    { name: "下弦月",en: "Last Quarter",         idx: 6, min: 22.153, max: 25.843 },
    { name: "残月",  en: "Waning Crescent",      idx: 7, min: 25.843, max: 29.531 }
  ];

  // ── DOM 引用 ──────────────────────────────────────────
  var moonCanvas  = document.getElementById("moon-canvas");
  var starCanvas  = document.getElementById("starfield");
  var phaseNameEl = document.getElementById("phase-name");
  var phaseEnEl   = document.getElementById("phase-en");
  var moonAgeEl   = document.getElementById("moon-age");
  var daysToFullEl= document.getElementById("days-to-full");
  var cyclePctEl  = document.getElementById("cycle-pct");
  var progressFill= document.getElementById("progress-fill");
  var dateDisplay = document.getElementById("date-display");
  var cycleRow    = document.getElementById("cycle-row");
  var tooltip     = document.getElementById("tooltip");

  var moonCtx  = moonCanvas.getContext("2d");
  var starCtx  = starCanvas.getContext("2d");

  // ── 星空 ─────────────────────────────────────────────
  var stars = [];

  function initStars() {
    var W = window.innerWidth;
    var H = window.innerHeight;
    starCanvas.width  = W;
    starCanvas.height = H;
    stars = [];
    var count = Math.min(320, Math.floor(W * H / 4000));
    for (var i = 0; i < count; i++) {
      stars.push({
        x:  Math.random() * W,
        y:  Math.random() * H,
        r:  Math.random() * 1.4 + 0.2,
        a:  Math.random(),
        da: (Math.random() * 0.004 + 0.001) * (Math.random() < 0.5 ? 1 : -1),
        twinkle: Math.random() < 0.3
      });
    }
  }

  function drawStars() {
    var W = starCanvas.width;
    var H = starCanvas.height;
    starCtx.clearRect(0, 0, W, H);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      if (s.twinkle) {
        s.a += s.da;
        if (s.a > 1 || s.a < 0.1) s.da = -s.da;
      }
      starCtx.beginPath();
      starCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      starCtx.fillStyle = "rgba(200,220,255," + s.a.toFixed(2) + ")";
      starCtx.fill();
    }
  }

  // ── 月相计算 ──────────────────────────────────────────
  function getMoonAge(date) {
    var diff = date.getTime() - KNOWN_NEW_MOON.getTime();
    var days = diff / 86400000;
    var age  = ((days % LUNAR_CYCLE) + LUNAR_CYCLE) % LUNAR_CYCLE;
    return age;
  }

  function getPhase(age) {
    for (var i = 0; i < PHASES.length; i++) {
      if (age >= PHASES[i].min && age < PHASES[i].max) return PHASES[i];
    }
    return PHASES[0];
  }

  function getDaysToFull(age) {
    var fullMoonAge = LUNAR_CYCLE / 2; // ~14.765
    var diff = fullMoonAge - age;
    if (diff < 0) diff += LUNAR_CYCLE;
    return diff;
  }

  // ── 月亮绘制 ──────────────────────────────────────────
  function drawMoon(age) {
    var size    = moonCanvas.width;
    var cx      = size / 2;
    var cy      = size / 2;
    var R       = size * 0.44;
    var ctx     = moonCtx;

    ctx.clearRect(0, 0, size, size);

    // 月相角度：0=新月，0.5=满月，1=下一新月
    var phase = age / LUNAR_CYCLE; // 0~1

    // 亮面比例：illumination
    var illum = (1 - Math.cos(2 * Math.PI * phase)) / 2;

    // 上弦前：右边亮；下弦后：左边亮
    var waxing = phase < 0.5;

    // ── 深色月球底色 ──
    var moonGrad = ctx.createRadialGradient(cx - R * 0.2, cy - R * 0.2, R * 0.1, cx, cy, R);
    moonGrad.addColorStop(0, "#8a9ab5");
    moonGrad.addColorStop(0.5, "#5a6a82");
    moonGrad.addColorStop(1, "#2a3245");

    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = moonGrad;
    ctx.fill();
    ctx.restore();

    // ── 陨石坑纹理 ──
    drawCraters(ctx, cx, cy, R);

    // ── 暗面遮罩 ──
    ctx.save();
    ctx.globalCompositeOperation = "source-atop";

    // 用椭圆终止线画暗面
    // 左半圆 or 右半圆 = 暗面；椭圆控制明暗分界线
    var shadowPath = buildShadowPath(cx, cy, R, phase);
    ctx.beginPath();
    shadowPath(ctx);
    ctx.fillStyle = "rgba(2,8,20,0.88)";
    ctx.fill();
    ctx.restore();

    // ── 高光边缘 ──
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(200,220,255,0.12)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();

    // ── 亮边光晕 ──
    if (illum > 0.05) {
      ctx.save();
      var glowR = R + 6;
      var glowGrad = ctx.createRadialGradient(cx, cy, R - 2, cx, cy, glowR);
      glowGrad.addColorStop(0, "rgba(200,220,255,0.08)");
      glowGrad.addColorStop(1, "rgba(200,220,255,0)");
      ctx.beginPath();
      ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
      ctx.fillStyle = glowGrad;
      ctx.fill();
      ctx.restore();
    }
  }

  function buildShadowPath(cx, cy, R, phase) {
    // phase 0~1
    // 0~0.5: 上弦（waxing）：右边亮，左边暗
    // 0.5~1: 下弦（waning）：左边亮，右边暗
    // illumination = (1-cos(2π*phase))/2
    // 终止线椭圆横轴 = R * |cos(2π*phase)|  (负=凹入，正=凸出)
    // 当 phase<0.25 或 phase>0.75: 椭圆凹向亮面
    // 当 0.25<phase<0.75: 椭圆凸向亮面

    return function (ctx) {
      var cos2p   = Math.cos(2 * Math.PI * phase);
      // 终止线椭圆 x 半轴，可正可负
      var termX   = R * cos2p; // 负=左弦，0=四分之一，正=右弦

      // 暗面始终包含一个半圆 + 椭圆校正
      // waxing (phase<0.5): 左半圆暗
      // waning (phase>=0.5): 右半圆暗
      var waxing  = phase < 0.5;

      ctx.save();
      ctx.beginPath();
      if (waxing) {
        // 左半暗：从顶部顺时针左半圆
        ctx.moveTo(cx, cy - R);
        ctx.arc(cx, cy, R, -Math.PI / 2, Math.PI / 2, false); // 右半圆（亮，暂不遮）
        // 连回终止线椭圆 (从bottom到top)
        // 实际：我们画左半圆 + 终止线椭圆形成暗区
        ctx.reset && ctx.reset();
        ctx.beginPath();
        // 左半圆（暗区基础）
        ctx.arc(cx, cy, R, Math.PI / 2, -Math.PI / 2, false); // 左半（π/2 → 3π/2）
        // 终止线：从bottom(cx, cy+R) 经由椭圆到top(cx, cy-R)
        // 当 cos2p>0 (phase<0.25 或 0.75<phase<1): 终止线凸向右(亮面缩小)
        // 当 cos2p<0 (0.25<phase<0.75): 终止线凸向左(亮面扩大)
        // 贝塞尔近似椭圆
        var kx = termX * 0.5523; // 贝塞尔魔术数
        ctx.bezierCurveTo(cx + kx, cy + R, cx + kx, cy - R, cx, cy - R);
        ctx.closePath();
      } else {
        // 右半暗
        ctx.arc(cx, cy, R, -Math.PI / 2, Math.PI / 2, true); // 左半（亮）
        ctx.reset && ctx.reset();
        ctx.beginPath();
        ctx.arc(cx, cy, R, -Math.PI / 2, Math.PI / 2, false); // 右半圆
        var kx2 = termX * 0.5523;
        ctx.bezierCurveTo(cx + kx2, cy + R, cx + kx2, cy - R, cx, cy - R);
        ctx.closePath();
      }
      ctx.restore();
    };
  }

  function drawMoonProper(age) {
    var size = moonCanvas.width;
    var cx   = size / 2;
    var cy   = size / 2;
    var R    = size * 0.44;
    var ctx  = moonCtx;

    ctx.clearRect(0, 0, size, size);

    var phase   = age / LUNAR_CYCLE;
    var cos2p   = Math.cos(2 * Math.PI * phase);
    var waxing  = phase < 0.5;

    // 底色
    var mg = ctx.createRadialGradient(cx - R * 0.15, cy - R * 0.15, R * 0.05, cx, cy, R);
    mg.addColorStop(0, "#9dafc8");
    mg.addColorStop(0.4, "#6b7e9a");
    mg.addColorStop(1, "#242e40");
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.fillStyle = mg;
    ctx.fill();
    ctx.restore();

    // 陨石坑
    drawCraters(ctx, cx, cy, R);

    // 暗面 clip
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.clip();

    ctx.beginPath();
    if (waxing) {
      // 暗 = 左半圆 + 终止线椭圆
      ctx.moveTo(cx, cy - R);
      // 左半圆顺时针（从top，经左，到bottom）
      ctx.arc(cx, cy, R, -Math.PI / 2, Math.PI / 2, true);
      // 终止线：bottom -> top，贝塞尔
      var bx = cos2p * R;
      var k  = Math.abs(bx) * 0.5523 * Math.sign(bx);
      ctx.bezierCurveTo(cx + k, cy + R * 0.98, cx + k, cy - R * 0.98, cx, cy - R);
    } else {
      // 暗 = 右半圆 + 终止线椭圆
      ctx.moveTo(cx, cy - R);
      ctx.arc(cx, cy, R, -Math.PI / 2, Math.PI / 2, false);
      var bx2 = cos2p * R;
      var k2  = Math.abs(bx2) * 0.5523 * Math.sign(bx2);
      ctx.bezierCurveTo(cx + k2, cy + R * 0.98, cx + k2, cy - R * 0.98, cx, cy - R);
    }
    ctx.closePath();
    ctx.fillStyle = "rgba(2,6,18,0.90)";
    ctx.fill();
    ctx.restore();

    // 边缘高光
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(180,210,255,0.10)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  function drawCraters(ctx, cx, cy, R) {
    var craterDefs = [
      { rx: -0.28, ry: -0.18, r: 0.10 },
      { rx:  0.20, ry:  0.30, r: 0.08 },
      { rx: -0.10, ry:  0.35, r: 0.06 },
      { rx:  0.30, ry: -0.30, r: 0.07 },
      { rx: -0.35, ry:  0.20, r: 0.05 },
      { rx:  0.05, ry: -0.40, r: 0.055 },
      { rx:  0.38, ry:  0.10, r: 0.045 }
    ];
    for (var i = 0; i < craterDefs.length; i++) {
      var c = craterDefs[i];
      var x = cx + c.rx * R;
      var y = cy + c.ry * R;
      var cr = c.r * R;
      var g = ctx.createRadialGradient(x - cr * 0.2, y - cr * 0.2, cr * 0.1, x, y, cr);
      g.addColorStop(0, "rgba(30,45,65,0.55)");
      g.addColorStop(0.7, "rgba(50,65,90,0.25)");
      g.addColorStop(1, "rgba(120,140,170,0.15)");
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, cr, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.restore();
    }
  }

  // ── 更新 UI ──────────────────────────────────────────
  function updateUI() {
    var now     = new Date();
    var age     = getMoonAge(now);
    var phase   = getPhase(age);
    var toFull  = getDaysToFull(age);
    var pct     = (age / LUNAR_CYCLE * 100);

    phaseNameEl.textContent = phase.name;
    phaseEnEl.textContent   = phase.en;
    moonAgeEl.textContent   = age.toFixed(1);
    daysToFullEl.textContent= toFull.toFixed(1);
    cyclePctEl.textContent  = pct.toFixed(0);
    progressFill.style.width = pct.toFixed(1) + "%";

    // 高亮当前阶段
    var items = cycleRow.querySelectorAll(".cycle-item");
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("active", parseInt(items[i].getAttribute("data-idx")) === phase.idx);
    }

    // 日期
    var y  = now.getFullYear();
    var mo = String(now.getMonth() + 1).padStart(2, "0");
    var d  = String(now.getDate()).padStart(2, "0");
    dateDisplay.textContent = y + " 年 " + mo + " 月 " + d + " 日";

    // 画月亮
    drawMoonProper(age);

    // 存入 localStorage
    try {
      localStorage.setItem("moonPhaseLastVisit", now.toISOString());
    } catch (e) {}
  }

  // ── Tooltip ───────────────────────────────────────────
  (function setupTooltip() {
    var items = cycleRow.querySelectorAll(".cycle-item");
    var PHASE_DAYS = ["0 天","1–7 天","7–11 天","11–15 天","15–17 天","17–22 天","22–26 天","26–30 天"];
    for (var i = 0; i < items.length; i++) {
      (function (item, idx) {
        item.addEventListener("mouseenter", function (e) {
          tooltip.textContent = PHASES[idx].name + "（" + PHASES[idx].en + "）· 月龄 " + PHASE_DAYS[idx];
          tooltip.style.opacity = "1";
        });
        item.addEventListener("mousemove", function (e) {
          tooltip.style.left = (e.clientX + 12) + "px";
          tooltip.style.top  = (e.clientY - 36) + "px";
        });
        item.addEventListener("mouseleave", function () {
          tooltip.style.opacity = "0";
        });
      })(items[i], i);
    }
  })();

  // ── 响应式星空 ─────────────────────────────────────────
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      initStars();
    }, 200);
  });

  // ── 动画循环 ──────────────────────────────────────────
  var lastStarFrame = 0;
  function starLoop(ts) {
    if (ts - lastStarFrame > 80) {
      drawStars();
      lastStarFrame = ts;
    }
    requestAnimationFrame(starLoop);
  }

  // ── 月相自动刷新（每分钟一次）────────────────────────
  function startAutoRefresh() {
    updateUI();
    setInterval(updateUI, 60000);
  }

  // ── 初始化（所有声明和定义之后）─────────────────────
  initStars();
  requestAnimationFrame(starLoop);
  startAutoRefresh();

})();
</script>
</body>
</html>
