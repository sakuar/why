<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星球年龄</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1a2236;
    --border: #2a3650;
    --text: #e8edf5;
    --text-muted: #7a8aaa;
    --accent: #4f8ef7;
    --accent2: #7c5cbf;
    --radius: 16px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
  }

  .back-link {
    position: fixed;
    top: 16px;
    left: 16px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    z-index: 100;
    transition: color 0.2s;
    background: rgba(10,14,26,0.8);
    padding: 4px 8px;
    border-radius: 6px;
  }
  .back-link:hover { color: var(--accent); }

  .container {
    max-width: 700px;
    margin: 0 auto;
    padding-top: 20px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  .star-bg {
    font-size: 48px;
    margin-bottom: 8px;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  h1 {
    font-size: clamp(24px, 5vw, 36px);
    font-weight: 700;
    background: linear-gradient(135deg, #4f8ef7, #b06ef7, #f7a24f);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
  }

  .input-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 32px;
    box-shadow: var(--shadow);
  }

  .input-label {
    display: block;
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 10px;
    font-weight: 500;
  }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  input[type="date"] {
    flex: 1;
    min-width: 160px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 16px;
    padding: 12px 16px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    color-scheme: dark;
  }

  input[type="date"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(79,142,247,0.15);
  }

  .calc-btn {
    background: linear-gradient(135deg, #4f8ef7, #7c5cbf);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    white-space: nowrap;
  }

  .calc-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(79,142,247,0.35);
  }

  .calc-btn:active { transform: translateY(0); }

  .earth-info {
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--surface2);
    border-radius: 10px;
    font-size: 14px;
    color: var(--text-muted);
    display: none;
  }

  .earth-info .earth-age {
    color: var(--text);
    font-weight: 600;
    font-size: 15px;
  }

  .cards-title {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 16px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-bottom: 40px;
  }

  .planet-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.5s ease, transform 0.5s ease, box-shadow 0.2s;
    cursor: default;
  }

  .planet-card.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .planet-card:hover {
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    transform: translateY(-3px);
    border-color: var(--card-color, var(--accent));
  }

  .planet-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--card-color, var(--accent));
  }

  .planet-card::after {
    content: var(--card-emoji, '🪐');
    position: absolute;
    right: -8px;
    bottom: -12px;
    font-size: 72px;
    opacity: 0.08;
    pointer-events: none;
    line-height: 1;
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .card-emoji {
    font-size: 28px;
    line-height: 1;
  }

  .card-name {
    font-size: 18px;
    font-weight: 700;
  }

  .card-period {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .card-age {
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 4px;
    color: var(--card-color, var(--accent));
  }

  .card-age-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .card-divider {
    height: 1px;
    background: var(--border);
    margin: 14px 0;
  }

  .card-birthday {
    font-size: 13px;
    color: var(--text-muted);
  }

  .card-birthday strong {
    color: var(--text);
    font-size: 14px;
  }

  .days-badge {
    display: inline-block;
    background: rgba(79,142,247,0.15);
    color: var(--accent);
    border-radius: 20px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 600;
    margin-top: 6px;
  }

  .fun-fact {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 10px;
    line-height: 1.5;
  }

  .tip {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 40px 20px;
  }

  .tip-icon { font-size: 40px; margin-bottom: 12px; }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    padding: 20px 0 40px;
    border-top: 1px solid var(--border);
  }

  @media (max-width: 480px) {
    .cards-grid { grid-template-columns: 1fr; }
    .input-row { flex-direction: column; align-items: stretch; }
    .calc-btn { width: 100%; }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<div class="container">
  <header>
    <div class="star-bg">🌌</div>
    <h1>星球年龄计算器</h1>
    <p class="subtitle">在宇宙中，你的岁数取决于你站在哪颗星球上</p>
  </header>

  <div class="input-card">
    <label class="input-label" for="birthdate">输入你的出生日期</label>
    <div class="input-row">
      <input type="date" id="birthdate" />
      <button class="calc-btn" id="calcBtn">✨ 计算年龄</button>
    </div>
    <div class="earth-info" id="earthInfo">
      🌍 地球年龄：<span class="earth-age" id="earthAge"></span> &nbsp;|&nbsp; 已存活 <span id="totalDays"></span> 天
    </div>
  </div>

  <div id="resultsSection">
    <div class="tip" id="tipBox">
      <div class="tip-icon">🚀</div>
      <div>选择你的出生日期，探索你在各星球的年龄</div>
    </div>
    <div id="cardsContainer" style="display:none">
      <div class="cards-title">各星球年龄</div>
      <div class="cards-grid" id="cardsGrid"></div>
    </div>
  </div>

  <footer>数据基于各行星公转周期（近日点年）&nbsp;·&nbsp; 宇宙有多大，你就有多少种年龄</footer>
</div>

<script>
(function () {
  "use strict";

  var PLANETS = [
    {
      name: "水星",
      emoji: "☿️",
      color: "#b0a090",
      periodDays: 87.969,
      fact: "水星公转极快，一个水星年仅约 88 天，你在这里会老得很快！"
    },
    {
      name: "金星",
      emoji: "♀️",
      color: "#e8c87a",
      periodDays: 224.701,
      fact: "金星表面温度高达 465°C，但你在金星上会比地球年轻一些。"
    },
    {
      name: "火星",
      emoji: "🔴",
      color: "#d9634a",
      periodDays: 686.971,
      fact: "火星一年接近两个地球年，科幻小说中移居火星的人会老得更慢。"
    },
    {
      name: "木星",
      emoji: "🟠",
      color: "#c47b3e",
      periodDays: 4332.589,
      fact: "木星是太阳系最大行星，绕太阳一圈需约 12 个地球年！"
    },
    {
      name: "土星",
      emoji: "🪐",
      color: "#a08060",
      periodDays: 10759.22,
      fact: "土星有美丽的光环，绕太阳一圈需约 29.5 个地球年，婴儿在土星上还没过 1 岁！"
    }
  ];

  var MS_PER_DAY = 86400000;

  var birthdateInput = document.getElementById("birthdate");
  var calcBtn = document.getElementById("calcBtn");
  var earthInfo = document.getElementById("earthInfo");
  var earthAgeEl = document.getElementById("earthAge");
  var totalDaysEl = document.getElementById("totalDays");
  var tipBox = document.getElementById("tipBox");
  var cardsContainer = document.getElementById("cardsContainer");
  var cardsGrid = document.getElementById("cardsGrid");

  function pad(n) {
    return String(n).padStart(2, "0");
  }

  function formatDate(date) {
    return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate());
  }

  function calcAge(totalDays, periodDays) {
    return totalDays / periodDays;
  }

  function nextBirthday(birthDate, periodDays) {
    var now = Date.now();
    var born = birthDate.getTime();
    var totalMs = now - born;
    var periodMs = periodDays * MS_PER_DAY;
    var elapsed = totalMs % periodMs;
    var remaining = periodMs - elapsed;
    var nextDate = new Date(now + remaining);
    var daysLeft = Math.ceil(remaining / MS_PER_DAY);
    return { date: nextDate, daysLeft: daysLeft };
  }

  function earthAgeStr(totalDays) {
    var years = Math.floor(totalDays / 365.25);
    var remaining = totalDays - years * 365.25;
    var months = Math.floor(remaining / 30.44);
    var days = Math.floor(remaining - months * 30.44);
    return years + " 岁 " + months + " 个月 " + days + " 天";
  }

  function renderCards(birthDate) {
    var now = Date.now();
    var totalDays = (now - birthDate.getTime()) / MS_PER_DAY;

    cardsGrid.innerHTML = "";

    PLANETS.forEach(function (planet, index) {
      var age = calcAge(totalDays, planet.periodDays);
      var wholeAge = Math.floor(age);
      var decimal = age - wholeAge;
      var progressPct = Math.round(decimal * 100);

      var bday = nextBirthday(birthDate, planet.periodDays);

      var card = document.createElement("div");
      card.className = "planet-card";
      card.style.setProperty("--card-color", planet.color);
      card.style.setProperty("--card-emoji", '"' + planet.emoji + '"');
      card.style.transitionDelay = (index * 80) + "ms";

      var bdayStr = formatDate(bday.date);
      var daysLeftTxt = bday.daysLeft === 1 ? "明天就是你的生日！🎉" : bday.daysLeft + " 天后";

      card.innerHTML =
        '<div class="card-header">' +
          '<span class="card-emoji">' + planet.emoji + '</span>' +
          '<div>' +
            '<div class="card-name">' + planet.name + '</div>' +
            '<div class="card-period">公转周期 ' + planet.periodDays.toFixed(1) + ' 天</div>' +
          '</div>' +
        '</div>' +
        '<div class="card-age">' + wholeAge + '</div>' +
        '<div class="card-age-label">岁（已过 ' + progressPct + '%）</div>' +
        '<div class="card-divider"></div>' +
        '<div class="card-birthday">' +
          '下次生日：<strong>' + bdayStr + '</strong><br>' +
          '<span class="days-badge">⏳ ' + daysLeftTxt + '</span>' +
        '</div>' +
        '<div class="fun-fact">' + planet.fact + '</div>';

      cardsGrid.appendChild(card);

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          card.classList.add("visible");
        });
      });
    });
  }

  function calculate() {
    var val = birthdateInput.value;
    if (!val) {
      alert("请先选择出生日期");
      return;
    }

    var parts = val.split("-");
    var birthDate = new Date(
      parseInt(parts[0], 10),
      parseInt(parts[1], 10) - 1,
      parseInt(parts[2], 10)
    );

    if (isNaN(birthDate.getTime())) {
      alert("日期格式不正确，请重新选择");
      return;
    }

    if (birthDate.getTime() > Date.now()) {
      alert("出生日期不能是未来的日期");
      return;
    }

    var totalDays = (Date.now() - birthDate.getTime()) / MS_PER_DAY;

    earthAgeEl.textContent = earthAgeStr(totalDays);
    totalDaysEl.textContent = Math.floor(totalDays).toLocaleString();
    earthInfo.style.display = "block";

    tipBox.style.display = "none";
    cardsContainer.style.display = "block";

    renderCards(birthDate);

    localStorage.setItem("star-age-birthdate", val);
  }

  calcBtn.addEventListener("click", calculate);

  birthdateInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { calculate(); }
  });

  var saved = localStorage.getItem("star-age-birthdate");
  if (saved) {
    birthdateInput.value = saved;
  }

  var today = new Date();
  var maxVal = formatDate(today);
  birthdateInput.setAttribute("max", maxVal);

})();
</script>
</body>
</html>
