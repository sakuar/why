<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发光水母</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{background:radial-gradient(ellipse at 50% 30%,#0a1f3a,#020812 70%);color:#e8eef7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  .back{position:fixed;top:14px;left:16px;color:#6fa8d8;text-decoration:none;font-size:13px;z-index:5;}
  .back:hover{color:#bfe3ff;}
  .hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#3a6a9a;font-size:13px;z-index:5;pointer-events:none;}
  canvas{display:block;position:fixed;inset:0;}
</style>
</head>
<body>
<a class="back" href="index.html">← 入口</a>
<canvas id="cv"></canvas>
<div class="hint">点一下，再放一只水母</div>
<script>
"use strict";
(function(){
  var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  var W,H,jellies=[];
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  window.addEventListener("resize",resize);resize();
  var HUES=[190,210,265,300,330];
  function Jelly(x,y){
    this.x=x;this.y=y;this.r=18+Math.random()*22;
    this.hue=HUES[Math.floor(Math.random()*HUES.length)];
    this.vy=-(0.3+Math.random()*0.5);this.vx=(Math.random()-0.5)*0.4;
    this.phase=Math.random()*Math.PI*2;this.legs=6+Math.floor(Math.random()*4);
    this.t=Math.random()*100;
  }
  Jelly.prototype.step=function(){
    this.t+=0.03;
    this.y+=this.vy+Math.sin(this.t)*0.25;
    this.x+=this.vx+Math.sin(this.t*0.7)*0.3;
    if(this.y<-60){this.y=H+60;this.x=Math.random()*W;}
    if(this.x<-60)this.x=W+60;if(this.x>W+60)this.x=-60;
  };
  Jelly.prototype.draw=function(){
    var pulse=1+Math.sin(this.t*2)*0.08;
    var r=this.r*pulse;
    var x=this.x,y=this.y;
    // 光晕
    var g=ctx.createRadialGradient(x,y,0,x,y,r*3.4);
    g.addColorStop(0,"hsla("+this.hue+",90%,65%,0.35)");
    g.addColorStop(1,"hsla("+this.hue+",90%,55%,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3.4,0,Math.PI*2);ctx.fill();
    // 触须
    ctx.strokeStyle="hsla("+this.hue+",85%,72%,0.55)";ctx.lineWidth=2;
    for(var i=0;i<this.legs;i++){
      var off=(i/(this.legs-1)-0.5)*r*1.4;
      ctx.beginPath();ctx.moveTo(x+off,y);
      for(var s=1;s<=6;s++){
        var ly=y+s*r*0.55;
        var lx=x+off+Math.sin(this.t*2+s*0.6+i)*6;
        ctx.lineTo(lx,ly);
      }
      ctx.stroke();
    }
    // 伞盖
    var bg=ctx.createLinearGradient(x,y-r,x,y+r*0.4);
    bg.addColorStop(0,"hsla("+this.hue+",90%,80%,0.95)");
    bg.addColorStop(1,"hsla("+this.hue+",85%,55%,0.55)");
    ctx.fillStyle=bg;
    ctx.beginPath();
    ctx.ellipse(x,y,r,r*0.9,0,Math.PI,Math.PI*2);
    ctx.quadraticCurveTo(x+r,y+r*0.3,x,y+r*0.18);
    ctx.quadraticCurveTo(x-r,y+r*0.3,x-r,y);
    ctx.fill();
  };
  for(var i=0;i<5;i++)jellies.push(new Jelly(Math.random()*W,Math.random()*H));
  cv.addEventListener("pointerdown",function(e){if(jellies.length<24)jellies.push(new Jelly(e.clientX,e.clientY));});
  function loop(){
    ctx.fillStyle="rgba(2,8,18,0.22)";ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    for(var i=0;i<jellies.length;i++){jellies[i].step();jellies[i].draw();}
    ctx.globalCompositeOperation="source-over";
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
