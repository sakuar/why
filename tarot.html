<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔罗牌占卜</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0a1a;
    --bg2: #160f2e;
    --purple: #7c3aed;
    --purple-light: #a78bfa;
    --purple-dark: #4c1d95;
    --gold: #f59e0b;
    --gold-light: #fcd34d;
    --gold-dark: #92400e;
    --text: #e8e0ff;
    --text-muted: #9d8ec4;
    --card-front: #1e1040;
    --card-back: #12082a;
    --border: rgba(167, 139, 250, 0.25);
    --glow: rgba(124, 58, 237, 0.4);
    --gold-glow: rgba(245, 158, 11, 0.3);
  }

  html, body {
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
  }

  body {
    background: radial-gradient(ellipse at 20% 20%, rgba(124,58,237,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(245,158,11,0.08) 0%, transparent 50%),
                var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* 星星背景 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 25%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 50%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 70%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 85%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 90%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 75% 5%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 50%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 48% 35%, rgba(255,215,0,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 70%, rgba(255,215,0,0.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 20% 90%, rgba(255,215,0,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    z-index: 100;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    opacity: 0.7;
    transition: opacity 0.2s;
  }
  .back-link:hover { opacity: 1; color: var(--purple-light); }

  .container {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: 60px 20px 40px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
  }

  .header .moon-icon {
    font-size: 36px;
    display: block;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 12px var(--gold));
    animation: moonFloat 4s ease-in-out infinite;
  }

  @keyframes moonFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .header h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 700;
    background: linear-gradient(135deg, var(--gold-light), var(--purple-light), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    margin-bottom: 8px;
  }

  .header p {
    color: var(--text-muted);
    font-size: 14px;
    letter-spacing: 1px;
  }

  /* 历史记录按钮 */
  .history-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    margin-top: 10px;
    transition: all 0.2s;
    font-family: inherit;
  }
  .history-btn:hover {
    border-color: var(--purple-light);
    color: var(--purple-light);
  }

  /* 牌区域 */
  .card-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 32px;
  }

  .card-scene {
    width: 200px;
    height: 340px;
    perspective: 1000px;
    margin-bottom: 28px;
    cursor: pointer;
  }

  .card-inner {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card-inner.flipped {
    transform: rotateY(180deg);
  }

  .card-inner.reversed .card-front {
    transform: rotateY(180deg) rotate(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  .card-back {
    background: var(--card-back);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 20px var(--glow), inset 0 1px 0 rgba(167,139,250,0.2);
  }

  .card-back-pattern {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(124,58,237,0.07) 8px, rgba(124,58,237,0.07) 9px),
      repeating-linear-gradient(-45deg, transparent, transparent 8px, rgba(245,158,11,0.05) 8px, rgba(245,158,11,0.05) 9px);
    border-radius: 14px;
  }

  .card-back-symbol {
    position: relative;
    z-index: 1;
    font-size: 64px;
    opacity: 0.5;
    filter: drop-shadow(0 0 16px var(--purple));
    animation: symbolPulse 3s ease-in-out infinite;
  }

  @keyframes symbolPulse {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.05); }
  }

  .card-front {
    background: linear-gradient(160deg, #1e1040 0%, #0f0824 100%);
    border: 2px solid var(--gold);
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 16px 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 24px var(--gold-glow), inset 0 1px 0 rgba(252,211,77,0.3);
  }

  .card-number {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 3px;
    opacity: 0.8;
    font-weight: 600;
  }

  .card-symbol-large {
    font-size: 72px;
    line-height: 1;
    filter: drop-shadow(0 0 20px var(--gold));
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card-name-en {
    font-size: 10px;
    color: var(--gold-light);
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.9;
    text-align: center;
    line-height: 1.4;
  }

  .card-name-zh {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
    text-align: center;
    text-shadow: 0 0 12px var(--gold);
  }

  .card-border-deco {
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(245,158,11,0.3);
    border-radius: 10px;
    pointer-events: none;
  }

  .card-corner {
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: var(--gold);
    border-style: solid;
    opacity: 0.6;
  }
  .card-corner.tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
  .card-corner.tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
  .card-corner.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
  .card-corner.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

  /* 逆位标签 */
  .reversed-badge {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #7f1d1d, #991b1b);
    color: #fca5a5;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    white-space: nowrap;
    border: 1px solid rgba(252,165,165,0.3);
    display: none;
    z-index: 10;
  }

  .card-scene.show-reversed .reversed-badge {
    display: block;
  }

  /* 解读面板 */
  .reading-panel {
    width: 100%;
    background: linear-gradient(160deg, rgba(30,16,64,0.9), rgba(15,8,36,0.95));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    display: none;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(167,139,250,0.1);
  }

  .reading-panel.visible {
    opacity: 1;
    transform: translateY(0);
    display: block;
  }

  .reading-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .reading-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 12px var(--gold-glow);
    letter-spacing: 1px;
  }

  .reading-en {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .orientation-badge {
    margin-left: auto;
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .orientation-badge.upright {
    background: rgba(124,58,237,0.2);
    color: var(--purple-light);
    border: 1px solid rgba(124,58,237,0.4);
  }

  .orientation-badge.reversed {
    background: rgba(127,29,29,0.3);
    color: #fca5a5;
    border: 1px solid rgba(252,165,165,0.3);
  }

  .reading-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 16px 0;
  }

  .reading-keyword {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .keyword-tag {
    padding: 4px 10px;
    background: rgba(124,58,237,0.15);
    border: 1px solid rgba(124,58,237,0.3);
    border-radius: 8px;
    font-size: 12px;
    color: var(--purple-light);
  }

  .reading-text {
    font-size: 15px;
    line-height: 1.9;
    color: var(--text);
    opacity: 0.9;
  }

  .reading-advice {
    margin-top: 16px;
    padding: 14px 16px;
    background: rgba(245,158,11,0.07);
    border-left: 3px solid var(--gold);
    border-radius: 0 10px 10px 0;
    font-size: 13px;
    color: var(--gold-light);
    line-height: 1.7;
  }

  .reading-advice strong {
    display: block;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0.8;
    margin-bottom: 4px;
    text-transform: uppercase;
  }

  /* 按钮 */
  .btn-draw {
    background: linear-gradient(135deg, var(--purple-dark), var(--purple));
    color: white;
    border: 1px solid rgba(167,139,250,0.4);
    padding: 14px 40px;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.3s;
    font-family: inherit;
    box-shadow: 0 4px 20px var(--glow);
    position: relative;
    overflow: hidden;
  }

  .btn-draw::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .btn-draw:hover::before { opacity: 1; }
  .btn-draw:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px var(--glow);
  }
  .btn-draw:active { transform: translateY(0); }
  .btn-draw:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  /* 历史记录弹窗 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: linear-gradient(160deg, #1a0d38, #0d0a1a);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .modal-title {
    font-size: 18px;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 2px;
  }

  .modal-close {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    font-family: inherit;
  }
  .modal-close:hover { border-color: var(--purple-light); color: var(--purple-light); }

  .history-empty {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 0;
    font-size: 14px;
  }

  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    margin-bottom: 10px;
    background: rgba(124,58,237,0.05);
    transition: background 0.2s;
  }
  .history-item:hover { background: rgba(124,58,237,0.1); }

  .history-icon {
    font-size: 28px;
    flex-shrink: 0;
  }

  .history-info { flex: 1; min-width: 0; }

  .history-name {
    font-size: 15px;
    font-weight: 600;
    color: var(--gold-light);
  }

  .history-meta {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .history-clear {
    background: transparent;
    border: 1px solid rgba(239,68,68,0.3);
    color: #f87171;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    margin-top: 12px;
    display: block;
    width: 100%;
  }
  .history-clear:hover { background: rgba(239,68,68,0.1); }

  .draw-count {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  /* 粒子效果 */
  .particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    opacity: 0;
    animation: particleFly 1.2s ease-out forwards;
  }

  @keyframes particleFly {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
  }

  .hint-text {
    font-size: 13px;
    color: var(--text-muted);
    text-align: center;
    margin-bottom: 24px;
    opacity: 0.7;
  }

  @media (max-width: 480px) {
    .container { padding: 50px 16px 32px; }
    .card-scene { width: 170px; height: 290px; }
    .card-symbol-large { font-size: 56px; }
    .reading-panel { padding: 20px 16px; }
    .btn-draw { padding: 12px 32px; font-size: 15px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="particles" id="particles"></div>

<div class="container">
  <header class="header">
    <span class="moon-icon">🌙</span>
    <h1>塔罗牌占卜</h1>
    <p>大阿卡纳 · 22 张 · 正逆位</p>
    <button class="history-btn" id="historyBtn">查看历史记录</button>
  </header>

  <div class="card-area">
    <div id="drawCount" class="draw-count"></div>
    <div class="card-scene" id="cardScene">
      <div class="reversed-badge">逆位</div>
      <div class="card-inner" id="cardInner">
        <div class="card-face card-back">
          <div class="card-back-pattern"></div>
          <div class="card-back-symbol">✦</div>
        </div>
        <div class="card-face card-front" id="cardFront">
          <div class="card-border-deco"></div>
          <div class="card-corner tl"></div>
          <div class="card-corner tr"></div>
          <div class="card-corner bl"></div>
          <div class="card-corner br"></div>
          <div class="card-number" id="cardNumber">0</div>
          <div class="card-symbol-large" id="cardSymbol">☀</div>
          <div class="card-name-zh" id="cardNameZh">愚者</div>
          <div class="card-name-en" id="cardNameEn">THE FOOL</div>
        </div>
      </div>
    </div>

    <p class="hint-text" id="hintText">点击下方按钮，开始你的占卜之旅</p>

    <button class="btn-draw" id="drawBtn">✦ 抽取塔罗牌 ✦</button>
  </div>

  <div class="reading-panel" id="readingPanel">
    <div class="reading-header">
      <div>
        <div class="reading-title" id="readingTitle">愚者</div>
        <div class="reading-en" id="readingEn">The Fool</div>
      </div>
      <div class="orientation-badge upright" id="orientationBadge">正位</div>
    </div>
    <div class="reading-keyword" id="readingKeyword"></div>
    <div class="reading-divider"></div>
    <div class="reading-text" id="readingText"></div>
    <div class="reading-advice" id="readingAdvice">
      <strong>建议</strong>
      <span id="adviceText"></span>
    </div>
  </div>
</div>

<!-- 历史记录弹窗 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">占卜历史</div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<script>
(function() {
  "use strict";

  // ===== 塔罗牌数据 =====
  var CARDS = [
    {
      num: 0, symbol: "🌟", nameZh: "愚者", nameEn: "The Fool",
      keywords: ["自由","冒险","新开始","天真"],
      upright: "愚者象征一段全新旅程的开端。你正站在悬崖边，怀抱无限的可能与纯粹的热情。这张牌鼓励你放下对未知的恐惧，以开放的心态踏入新的篇章。此刻的你无需担心结果，冒险本身就是礼物。",
      reversed: "逆位的愚者提醒你，莽撞与鲁莽可能带来风险。你可能过于冲动，缺乏必要的规划。在做出重大决定之前，停下来认真审视自己是否忽视了潜在的风险与责任。",
      uprightAdvice: "勇敢迈出第一步，不要让过度的思虑阻碍你前进。",
      reversedAdvice: "在行动之前，花时间做好充分准备，避免因冲动而后悔。"
    },
    {
      num: 1, symbol: "🪄", nameZh: "魔法师", nameEn: "The Magician",
      keywords: ["意志","技能","创造","掌控"],
      upright: "魔法师代表你拥有将梦想变为现实所需的一切资源与才能。你的手中握着土、水、火、风四种元素的力量。这是一个充满创造力的时机，你的意志与行动力将使目标得以实现。",
      reversed: "逆位魔法师警示着才能的虚耗或欺骗的危险。你可能正在将自己的天赋用于错误的方向，或者身边存在操控与欺骗。重新审视自己的动机，确保你的行动出于诚实与善意。",
      uprightAdvice: "充分发挥你现有的技能与资源，此刻是化愿望为行动的最佳时机。",
      reversedAdvice: "检视内心，确保你的目标与手段都是真诚且正直的。"
    },
    {

  // ===== 函数定义 =====

  function loadHistory() {
    try {
      var raw = localStorage.getItem('tarot_history');
      if (raw) { history = JSON.parse(raw); }
    } catch (e) { history = []; }
  }

  function saveHistory() {
    try { localStorage.setItem('tarot_history', JSON.stringify(history)); } catch (e) {}
  }

  function updateDrawCount() {
    var total = history.length;
    if (total === 0) {
      drawCount.textContent = '';
    } else {
      drawCount.textContent = '已占卜 ' + total + ' 次';
    }
  }

  function spawnParticles(x, y) {
    var colors = ['#f59e0b', '#a78bfa', '#fcd34d', '#7c3aed', '#ffffff'];
    for (var i = 0; i < 16; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      var angle = (Math.random() * 360) * Math.PI / 180;
      var dist = 60 + Math.random() * 120;
      var tx = Math.cos(angle) * dist;
      var ty = Math.sin(angle) * dist;
      p.style.cssText = [
        'left:' + x + 'px',
        'top:' + y + 'px',
        'background:' + colors[Math.floor(Math.random() * colors.length)],
        '--tx:' + tx + 'px',
        '--ty:' + ty + 'px',
        'animation-delay:' + (Math.random() * 0.2) + 's',
        'width:' + (3 + Math.random() * 4) + 'px',
        'height:' + (3 + Math.random() * 4) + 'px'
      ].join(';');
      particlesEl.appendChild(p);
      setTimeout(function(el) { el.parentNode && el.parentNode.removeChild(el); }, 1500, p);
    }
  }

  function drawCard() {
    if (isAnimating) { return; }
    isAnimating = true;
    drawBtn.disabled = true;
    hintText.textContent = '牌正在翻转……';

    // 如果已有翻开的牌，先翻回去
    if (isFlipped) {
      readingPanel.classList.remove('visible');
      setTimeout(function() { readingPanel.style.display = 'none'; }, 300);
      cardInner.classList.remove('flipped', 'reversed');
      cardScene.classList.remove('show-reversed');
      isFlipped = false;
      setTimeout(function() { doFlip(); }, 600);
    } else {
      doFlip();
    }
  }

  function doFlip() {
    var idx = Math.floor(Math.random() * CARDS.length);
    currentCard = CARDS[idx];
    isReversed = Math.random() < 0.5;

    // 更新正面内容
    cardNumber.textContent = 'Ⅰ'.replace('Ⅰ', toRoman(currentCard.num));
    cardSymbol.textContent = currentCard.symbol;
    cardNameZh.textContent = currentCard.nameZh;
    cardNameEn.textContent = currentCard.nameEn.toUpperCase();

    // 执行翻牌动画
    setTimeout(function() {
      cardInner.classList.add('flipped');
      if (isReversed) {
        cardScene.classList.add('show-reversed');
        setTimeout(function() { cardInner.classList.add('reversed'); }, 400);
      }

      // 粒子效果
      var rect = cardScene.getBoundingClientRect();
      spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2);

      setTimeout(function() {
        showReading();
        isFlipped = true;
        isAnimating = false;
        drawBtn.disabled = false;
        drawBtn.textContent = '✦ 再抽一张 ✦';
        hintText.textContent = '点击卡牌可翻回背面';
      }, 900);
    }, 80);
  }

  function toRoman(n) {
    var romans = ['0','Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ','Ⅶ','Ⅷ','Ⅸ','Ⅹ','Ⅺ','Ⅻ','XIII','XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
    if (n === 0) return '0';
    return romans[n] || String(n);
  }

  function showReading() {
    var card = currentCard;
    var rev = isReversed;

    readingTitle.textContent = card.nameZh;
    readingEn.textContent = card.nameEn;

    if (rev) {
      orientationBadge.textContent = '逆位';
      orientationBadge.className = 'orientation-badge reversed';
    } else {
      orientationBadge.textContent = '正位';
      orientationBadge.className = 'orientation-badge upright';
    }

    readingKeyword.innerHTML = '';
    card.keywords.forEach(function(kw) {
      var span = document.createElement('span');
      span.className = 'keyword-tag';
      span.textContent = kw;
      readingKeyword.appendChild(span);
    });

    readingText.textContent = rev ? card.reversed : card.upright;
    adviceText.textContent = rev ? card.reversedAdvice : card.uprightAdvice;

    readingPanel.style.display = 'block';
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        readingPanel.classList.add('visible');
      });
    });

    // 保存历史
    var record = {
      num: card.num,
      nameZh: card.nameZh,
      nameEn: card.nameEn,
      symbol: card.symbol,
      reversed: rev,
      time: Date.now()
    };
    history.unshift(record);
    if (history.length > 50) { history = history.slice(0, 50); }
    saveHistory();
    updateDrawCount();
  }

  function formatTime(ts) {
    var d = new Date(ts);
    var pad = function(n) { return n < 10 ? '0' + n : String(n); };
    return d.getFullYear() + '/' + pad(d.getMonth() + 1) + '/' + pad(d.getDate()) +
           ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function renderHistory() {
    if (history.length === 0) {
      historyList.innerHTML = '<div class="history-empty">还没有占卜记录<br>快去抽第一张牌吧</div>';
      return;
    }
    var html = '';
    history.forEach(function(r) {
      html += '<div class="history-item">' +
        '<div class="history-icon">' + r.symbol + '</div>' +
        '<div class="history-info">' +
          '<div class="history-name">' + r.nameZh + ' <span style="font-size:11px;color:var(--text-muted)">' + r.nameEn + '</span></div>' +
          '<div class="history-meta">' + (r.reversed ? '逆位' : '正位') + ' · ' + formatTime(r.time) + '</div>' +
        '</div>' +
      '</div>';
    });
    html += '<button class="history-clear" id="clearHistoryBtn">清空历史记录</button>';
    historyList.innerHTML = html;
    var clearBtn = document.getElementById('clearHistoryBtn');
    if (clearBtn) {
      clearBtn.addEventListener('click', function() {
        history = [];
        saveHistory();
        updateDrawCount();
        renderHistory();
      });
    }
  }

  function openModal() {
    renderHistory();
    modalOverlay.classList.add('open');
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
  }

  function onCardClick() {
    if (!isFlipped || isAnimating) { return; }
    isAnimating = true;
    readingPanel.classList.remove('visible');
    setTimeout(function() { readingPanel.style.display = 'none'; }, 300);
    cardInner.classList.remove('flipped', 'reversed');
    cardScene.classList.remove('show-reversed');
    isFlipped = false;
    hintText.textContent = '点击下方按钮，开始你的占卜之旅';
    setTimeout(function() { isAnimating = false; }, 900);
  }

  function init() {
    // 获取 DOM
    drawBtn = document.getElementById('drawBtn');
    cardScene = document.getElementById('cardScene');
    cardInner = document.getElementById('cardInner');
    cardNumber = document.getElementById('cardNumber');
    cardSymbol = document.getElementById('cardSymbol');
    cardNameZh = document.getElementById('cardNameZh');
    cardNameEn = document.getElementById('cardNameEn');
    readingPanel = document.getElementById('readingPanel');
    readingTitle = document.getElementById('readingTitle');
    readingEn = document.getElementById('readingEn');
    orientationBadge = document.getElementById('orientationBadge');
    readingKeyword = document.getElementById('readingKeyword');
    readingText = document.getElementById('readingText');
    adviceText = document.getElementById('adviceText');
    historyBtn = document.getElementById('historyBtn');
    modalOverlay = document.getElementById('modalOverlay');
    modalClose = document.getElementById('modalClose');
    historyList = document.getElementById('historyList');
    drawCount = document.getElementById('drawCount');
    hintText = document.getElementById('hintText');
    particlesEl = document.getElementById('particles');

    // 事件绑定
    drawBtn.addEventListener('click', drawCard);
    cardScene.addEventListener('click', onCardClick);
    historyBtn.addEventListener('click', openModal);
    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', function(e) {
      if (e.target === modalOverlay) { closeModal(); }
    });

    // 加载历史
    loadHistory();
    updateDrawCount();
  }

  // ===== 入口：所有声明完成后执行 =====
  init();

})();
</script>
</body>
</html>
