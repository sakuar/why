<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>三角函数图像 · 单位圆生成正弦波</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#070912;color:#e8eef7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  .wrap{width:100%;max-width:1240px;padding:0 18px;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px;}
  .top h1{font-size:18px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#ffd166,#56b6ff,#b98cff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .top .back{font-size:12px;color:#8090a8;text-decoration:none;border:1px solid #222840;border-radius:8px;padding:6px 11px;}
  .chips{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap;}
  .chip{flex:1;min-width:96px;display:flex;align-items:center;gap:7px;justify-content:center;font-size:13px;padding:11px 8px;border-radius:11px;background:#0e1322;border:1px solid #232c44;color:#aab6cc;cursor:pointer;transition:.14s;}
  .chip:hover{border-color:#3a445e;color:#e8eef7;}
  .chip.on{background:#6c63ff;border-color:#6c63ff;color:#fff;font-weight:700;}
  .work{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:stretch;}
  @media(max-width:780px){.work{grid-template-columns:1fr;}}
  #stage{position:relative;min-width:0;}
  canvas{width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 42%,#0e1426,#06070d 80%);border:1px solid #1c2236;border-radius:14px;touch-action:none;}
  .controls{background:#0e1322;border:1px solid #232c44;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;}
  .controls .ch{font-size:12px;color:#8090a8;font-weight:600;letter-spacing:1px;margin-bottom:12px;}
  .slider{margin-bottom:13px;}.slider:last-child{margin-bottom:0;}
  .slider .sl-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;}
  .slider .sl-top .nm{color:#cfd8ea;}.slider .sl-top .val{color:#56b6ff;font-weight:700;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#232c44;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;box-shadow:0 0 0 1px #6c63ff;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;}
  .btn{font-size:14px;padding:11px 16px;border-radius:10px;background:#6c63ff;border:1px solid #6c63ff;color:#fff;font-weight:700;cursor:pointer;width:100%;}
  .btn.off{background:#121829;border-color:#232c44;color:#cdd6e8;}
  .hint{font-size:12px;color:#5a6680;line-height:1.6;border-top:1px solid #1a2138;padding-top:13px;}
  .info{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:780px){.info{grid-template-columns:1fr;}}
  .readout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;grid-column:1 / -1;}
  .readout .cell{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:14px 12px;text-align:center;}
  .readout .cell .k{font-size:11.5px;color:#8090a8;margin-bottom:6px;}
  .readout .cell .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:#56b6ff;}
  .card{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:16px 18px;}
  .card .ttl{font-size:13px;font-weight:800;color:#ffd166;margin-bottom:9px;}
  .card .eq{font-size:19px;line-height:1.8;color:#e8eef7;font-family:"Cambria Math","Times New Roman",Georgia,serif;}
  .card .eq .hl{color:#ffd166;font-weight:700;}
  .card .nt{font-size:13.5px;color:#9aa6bd;line-height:1.8;}.card .nt b{color:#cdd6e8;}
  footer{color:#5a6680;font-size:12px;text-align:center;padding:22px 0 36px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>〰️ 三角函数图像 · 圆生成波</h1><a class="back" href="index.html">← 返回</a></div>
  <div class="chips" id="chips"></div>
  <div class="work">
    <div id="stage"><canvas id="cv" width="900" height="520"></canvas></div>
    <div class="controls">
      <div><div class="ch">参数调节</div><div id="params"></div></div>
      <button class="btn" id="bPlay">⏸ 暂停转动</button>
      <div class="hint" id="hint"></div>
    </div>
  </div>
  <div class="info">
    <div class="readout">
      <div class="cell"><div class="k">振幅 A</div><div class="v" id="rA">—</div></div>
      <div class="cell"><div class="k">周期 T = 2π/ω</div><div class="v" id="rT">—</div></div>
      <div class="cell"><div class="k">此刻函数值</div><div class="v" id="rV">—</div></div>
    </div>
    <div class="card"><div class="ttl">函数</div><div class="eq" id="eq"></div></div>
    <div class="card"><div class="ttl">每个参数管什么</div><div class="nt" id="note"></div></div>
  </div>
  <footer>左边圆上的点转一圈，它的高度（纵坐标）描出来就是右边的正弦波 · 纯前端单文件教学</footer>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
var W=900,H=520;
function fit(){var st=document.getElementById("stage");var cw=st.clientWidth||900;W=cw;H=Math.round(cw*0.58);if(H<300)H=300;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
var PI=Math.PI;
var idx=0,P={},phase=0,playing=true;
var FUNCS=[
  {id:"sin",name:"正弦 sin",f:Math.sin,nm:"sin"},
  {id:"cos",name:"余弦 cos",f:Math.cos,nm:"cos"}
];
function buildChips(){var box=document.getElementById("chips");box.innerHTML="";
  FUNCS.forEach(function(c,i){var el=document.createElement("div");el.className="chip"+(i===idx?" on":"");el.textContent=c.name;el.onclick=function(){idx=i;location.hash=c.id;draw();document.querySelectorAll('.chip').forEach(function(e,j){e.className='chip'+(j===idx?' on':'');});};box.appendChild(el);});}
var PARAMS=[{k:"A",label:"振幅 A",min:0.3,max:2.5,step:0.1,def:1.5},{k:"w",label:"角频率 ω",min:0.5,max:4,step:0.5,def:1},{k:"phi",label:"相位 φ",min:-3.14,max:3.14,step:0.1,def:0},{k:"k",label:"上下平移 k",min:-2,max:2,step:0.5,def:0}];
function buildParams(){var box=document.getElementById("params");box.innerHTML="";P={};
  PARAMS.forEach(function(pp){P[pp.k]=pp.def;var w=document.createElement("div");w.className="slider";
    w.innerHTML='<div class="sl-top"><span class="nm">'+pp.label+'</span><span class="val" id="v_'+pp.k+'">'+pp.def.toFixed(1)+'</span></div><input type="range" id="r_'+pp.k+'" min="'+pp.min+'" max="'+pp.max+'" step="'+pp.step+'" value="'+pp.def+'">';
    box.appendChild(w);var inp=w.querySelector("input");
    inp.oninput=function(){P[pp.k]=parseFloat(inp.value);document.getElementById("v_"+pp.k).textContent=P[pp.k].toFixed(1);draw();};});}
function draw(){ctx.clearRect(0,0,W,H);
  var F=FUNCS[idx],fn=F.f;
  var cx=W*0.16,cy=H*0.5,R=Math.min(H*0.34,W*0.12);
  var ax0=W*0.30,axW=W*0.64,yscale=R; // 波区
  // --- 左：单位圆 ---
  ctx.strokeStyle="rgba(120,140,180,.25)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-R-10,cy);ctx.lineTo(cx+R+10,cy);ctx.moveTo(cx,cy-R-10);ctx.lineTo(cx,cy+R+10);ctx.stroke();
  ctx.strokeStyle="rgba(150,170,210,.5)";ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(cx,cy,R*P.A,0,2*PI);ctx.stroke();
  var ang=P.w*phase+P.phi;
  var ptx=cx+R*P.A*Math.cos(ang), pty=cy-R*P.A*(F.id==="sin"?Math.sin(ang):Math.cos(ang))* (F.id==="sin"?1:1);
  // 圆上的点（用统一角度，纵坐标取 sin 或横坐标取 cos 的值映射到波）
  var val=fn(ang);
  var pcx=cx+R*P.A*Math.cos(ang), pcy=cy-R*P.A*Math.sin(ang);
  ctx.strokeStyle="#e8eef7";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(pcx,pcy);ctx.stroke();
  ctx.fillStyle="#ffd166";ctx.beginPath();ctx.arc(pcx,pcy,4.5,0,2*PI);ctx.fill();
  // 当前函数值在圆上的"高度"投影
  var wy=cy - (P.A*val + P.k)*yscale;
  ctx.strokeStyle="rgba(255,209,102,.5)";ctx.lineWidth=1.2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(pcx,pcy);ctx.lineTo(ax0,pcy);ctx.stroke();ctx.setLineDash([]);
  // --- 右：波形 ---
  // 轴
  ctx.strokeStyle="rgba(120,140,180,.25)";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(ax0,cy);ctx.lineTo(ax0+axW,cy);ctx.stroke();
  ctx.strokeStyle="rgba(120,140,180,.12)";for(var gx=0;gx<=4;gx++){var X=ax0+gx/4*axW;ctx.beginPath();ctx.moveTo(X,cy-R-20);ctx.lineTo(X,cy+R+20);ctx.stroke();}
  // 曲线 y=A f(ωx+φ)+k
  ctx.strokeStyle="#56b6ff";ctx.lineWidth=2.6;ctx.beginPath();
  var xspan=4*PI/P.w; // 显示约两个周期
  for(var i=0;i<=240;i++){var xx=i/240*xspan;var yy=P.A*fn(P.w*(xx)+P.phi)+P.k;var Px=ax0+(xx/xspan)*axW,Py=cy-yy*yscale;if(i===0)ctx.moveTo(Px,Py);else ctx.lineTo(Px,Py);}
  ctx.stroke();
  // 当前点（相位对应）
  var curX=ax0, curY=cy-(P.A*val+P.k)*yscale;
  ctx.fillStyle="#56d6a8";ctx.beginPath();ctx.arc(curX,curY,5,0,2*PI);ctx.fill();
  // 文字
  ctx.fillStyle="#8090a8";ctx.font="12px system-ui";ctx.textAlign="center";ctx.textBaseline="top";
  ctx.fillText("圆：点在转",cx,cy+R+16);ctx.fillText("波：高度被记录下来",ax0+axW*0.5,cy+R+16);
  // 读出
  document.getElementById("rA").textContent=P.A.toFixed(1);
  document.getElementById("rT").textContent=(2*PI/P.w).toFixed(2);
  document.getElementById("rV").textContent=(P.A*val+P.k).toFixed(3);
  var sign=function(x){return x>=0?"+ "+x.toFixed(1):"− "+Math.abs(x).toFixed(1);};
  document.getElementById("eq").innerHTML='y = <span class="hl">'+P.A.toFixed(1)+'</span>·'+F.nm+'('+(P.w.toFixed(1))+'x '+(P.phi>=0?'+ ':'− ')+Math.abs(P.phi).toFixed(1)+') '+sign(P.k);
  document.getElementById("note").innerHTML='<b>A 振幅</b>：波的高矮（峰值 = A）。<br><b>ω 角频率</b>：转得多快 → 周期 <b>T = 2π/ω</b>，ω 越大波越密。<br><b>φ 相位</b>：波左右平移（起跑点）。<br><b>k</b>：整条波上下平移。';
  document.getElementById("hint").textContent="左边点转一圈 = 右边波走一个周期。拖 ω 看周期变化。";
}
var anim=null;
function loop(){if(playing)phase+=0.03;draw();anim=requestAnimationFrame(loop);}
var bPlay=document.getElementById("bPlay");
bPlay.onclick=function(){playing=!playing;bPlay.classList.toggle("off",!playing);bPlay.textContent=playing?"⏸ 暂停转动":"▶ 继续转动";};
window.addEventListener("resize",function(){fit();draw();});
(function(){var hs=(location.hash||"").replace("#","");for(var i=0;i<FUNCS.length;i++)if(FUNCS[i].id===hs)idx=i;})();
fit();buildChips();buildParams();draw();requestAnimationFrame(loop);
</script>
</body>
</html>
