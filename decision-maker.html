<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一句话决定器</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:radial-gradient(ellipse at top,#241b3a,#120c1f 70%);
    color:#f0eaff; font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:26px 14px 60px; }
  h1{ font-size:27px; font-weight:700; letter-spacing:1px; }
  .sub{ color:#a99bc7; font-size:13px; margin:5px 0 22px; }
  .panel{ width:min(460px,100%); }
  .opt{ display:flex; gap:8px; margin-bottom:9px; }
  .opt input{ flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14);
    color:#fff; padding:11px 14px; border-radius:10px; font-size:15px; outline:none; }
  .opt input:focus{ border-color:#b98cff; }
  .opt .del{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); color:#a99bc7;
    border-radius:10px; width:42px; cursor:pointer; font-size:18px; }
  .opt .del:hover{ color:#ff8aa0; }
  .add{ width:100%; background:rgba(185,140,255,.12); border:1px dashed #6f5aa0; color:#cbb8ff;
    padding:10px; border-radius:10px; cursor:pointer; font-size:14px; margin-bottom:18px; }
  .add:hover{ background:rgba(185,140,255,.2); }
  .methods{ display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-bottom:18px; }
  .method{ font-size:12px; padding:7px 12px; border-radius:20px; cursor:pointer;
    border:1px solid rgba(255,255,255,.14); color:#bdaee0; transition:.15s; }
  .method:hover{ color:#fff; }
  .method.on{ background:#b98cff; color:#1a1030; border-color:#b98cff; font-weight:600; }
  .go{ width:min(460px,100%); background:linear-gradient(90deg,#b98cff,#7d5fff); color:#fff; border:none;
    padding:15px; border-radius:12px; font-size:17px; font-weight:700; cursor:pointer; letter-spacing:2px;
    box-shadow:0 10px 30px rgba(125,95,255,.35); }
  .go:active{ transform:translateY(1px); }
  .go:disabled{ opacity:.4; cursor:not-allowed; }
  .stage{ width:min(460px,100%); margin-top:24px; min-height:60px; text-align:center; }
  .rolling{ font-size:30px; font-weight:700; color:#cbb8ff; height:44px; }
  .result{ display:none; }
  .result.show{ display:block; animation:pop .4s ease; }
  @keyframes pop{ 0%{transform:scale(.6);opacity:0} 100%{transform:scale(1);opacity:1} }
  .verdict{ font-size:14px; color:#a99bc7; }
  .winner{ font-size:34px; font-weight:800; margin:8px 0 12px;
    background:linear-gradient(90deg,#ffd166,#ff8aa0,#b98cff); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  .reason{ font-size:15px; line-height:1.7; color:#ded3f5; background:rgba(255,255,255,.05);
    border:1px solid rgba(255,255,255,.1); border-radius:12px; padding:14px 18px; }
  .reason .tag{ display:inline-block; font-size:11px; color:#1a1030; background:#b98cff;
    padding:2px 9px; border-radius:10px; margin-bottom:8px; font-weight:600; }
  .again{ margin-top:16px; background:transparent; border:1px solid rgba(255,255,255,.18); color:#bdaee0;
    padding:9px 20px; border-radius:20px; cursor:pointer; font-size:13px; }
  .again:hover{ color:#fff; border-color:#b98cff; }
  .back{ position:fixed; top:16px; left:18px; color:#a99bc7; text-decoration:none; font-size:13px; }
</style>
</head>
<body>
<a class="back" href="index.html">← 回到入口</a>
<h1>🎲 一句话决定器</h1>
<p class="sub">把纠结交给荒诞。它不一定对，但一定快。</p>

<div class="panel">
  <div id="opts"></div>
  <button class="add" onclick="addOpt()">＋ 再加一个选项</button>
  <div class="methods" id="methods"></div>
</div>
<button class="go" id="go" onclick="decide()">让 命 运 决 定</button>

<div class="stage">
  <div class="rolling" id="rolling"></div>
  <div class="result" id="result">
    <div class="verdict" id="verdict"></div>
    <div class="winner" id="winner"></div>
    <div class="reason" id="reason"></div>
    <button class="again" onclick="reset()">↻ 再问一次</button>
  </div>
</div>

<script>
// —— 占卜方式 ——
const METHODS={
  coin:{label:"🪙 抛硬币", verdict:"硬币在空中翻了七个跟头，落地时正面朝上指向——",
    reason:o=>`硬币是不会撒谎的。它在 ${o.length} 个选项之间弹跳、犹豫，最终用冰冷的金属意志选择了「${o.win}」。物理学站在你这边。`},
  tarot:{label:"🔮 塔罗牌", verdict:"我洗了洗牌，抽出的那张牌缓缓翻开——",
    reason:o=>`你抽到了「${pick(["命运之轮","星星","太阳","愚者","力量","世界"])}」（${pick(["正位","逆位"])}）。牌面指引很明确：宇宙希望你选择「${o.win}」。逆着牌意走，是会有代价的。`},
  weather:{label:"🌦 天气占卜", verdict:"我望了望窗外此刻的云——",
    reason:o=>`今天的风从${pick(["东","南","西","北"])}边吹来，湿度刚好，气压偏${pick(["高","低"])}。这种天气最适合做的事，就是「${o.win}」。古人云：顺天时者昌。`},
  dice:{label:"🎲 掷骰子", verdict:"三颗骰子在桌上滚动、碰撞、停下——",
    reason:o=>`骰子点数之和是 ${rnd(3,18)}，除以选项数取余，命运的指针稳稳停在「${o.win}」。数学的归数学，神秘的归神秘，结果都指向同一个答案。`},
  flip:{label:"🐢 灵龟摇卦", verdict:"铜钱在龟壳里摇了三摇，叮当落下——",
    reason:o=>`六爻已成，得卦象「${pick(["乾为天","水雷屯","地火明夷","风泽中孚","山水蒙","火天大有"])}」。卦辞晦涩，但断语清晰：宜「${o.win}」，不宜犹豫。`},
  vibe:{label:"✨ 凭感觉", verdict:"我闭上眼，让所有理性走开，只留下直觉——",
    reason:o=>`别想那么多了。你心里其实早就有答案了，对吧？「${o.win}」——看到它的瞬间你是不是松了一口气，或者有点不甘心？那个反应，才是真正的答案。`},
};
let method="coin";
const mwrap=document.getElementById('methods');
Object.entries(METHODS).forEach(([k,v])=>{
  const el=document.createElement('span'); el.className='method'+(k==='coin'?' on':''); el.textContent=v.label;
  el.onclick=()=>{ method=k; [...mwrap.children].forEach(c=>c.classList.remove('on')); el.classList.add('on'); };
  mwrap.appendChild(el);
});
const pick=a=>a[Math.floor(Math.random()*a.length)];
const rnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1));

// —— 选项管理 ——
const opts=document.getElementById('opts');
function addOpt(val=""){
  if(opts.children.length>=8) return;
  const d=document.createElement('div'); d.className='opt';
  d.innerHTML=`<input maxlength="30" placeholder="选项 ${opts.children.length+1}" value="${val.replace(/"/g,'&quot;')}">
    <button class="del" title="删除">×</button>`;
  d.querySelector('.del').onclick=()=>{ if(opts.children.length>2)d.remove(); };
  opts.appendChild(d);
}
addOpt("点外卖"); addOpt("自己做饭");

// —— 决定 ——
let rolling=false;
function getOpts(){ return [...opts.querySelectorAll('input')].map(i=>i.value.trim()).filter(Boolean); }
function decide(){
  if(rolling)return;
  const list=getOpts();
  if(list.length<2){ alert("至少填两个选项，命运才好下手～"); return; }
  rolling=true;
  document.getElementById('go').disabled=true;
  document.getElementById('result').classList.remove('show');
  const win=pick(list);
  const m=METHODS[method];
  // 滚动动画
  const roll=document.getElementById('rolling');
  let n=0; const dur=1400, t0=performance.now();
  (function spin(now){
    const p=(now-t0)/dur;
    if(p<1){
      roll.textContent=pick(list);
      roll.style.transform=`scale(${1+0.05*Math.sin(p*40)})`;
      requestAnimationFrame(spin);
    } else {
      roll.textContent=""; roll.style.transform="";
      show(win,m,list);
    }
  })(t0);
}
function show(win,m,list){
  document.getElementById('verdict').textContent=m.verdict;
  document.getElementById('winner').textContent=win;
  document.getElementById('reason').innerHTML=
    `<span class="tag">${m.label} 的判词</span><br>${m.reason({win,length:list.length})}`;
  document.getElementById('result').classList.add('show');
  rolling=false; document.getElementById('go').disabled=false;
}
function reset(){
  document.getElementById('result').classList.remove('show');
  document.getElementById('rolling').textContent="";
}
</script>
</body>
</html>
