<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秒表计时</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22253a;
    --accent: #4f8ef7;
    --accent2: #7c5cfc;
    --green: #3ecf8e;
    --red: #f7604f;
    --yellow: #f7c94f;
    --text: #e8eaf6;
    --text-muted: #7a7f9a;
    --border: #2c2f45;
    --radius: 18px;
    --radius-sm: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 16px 40px;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    z-index: 100;
    transition: color .2s;
  }
  .back-link:hover { color: var(--text); }

  .app {
    width: 100%;
    max-width: 420px;
    margin-top: 52px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* Mode tabs */
  .tabs {
    display: flex;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 5px;
    gap: 4px;
  }
  .tab {
    flex: 1;
    padding: 9px 0;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    border-radius: 13px;
    cursor: pointer;
    transition: background .25s, color .25s;
  }
  .tab.active {
    background: var(--surface2);
    color: var(--text);
  }

  /* Main display */
  .display-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 36px 24px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative;
    overflow: hidden;
  }
  .display-card::before {
    content: '';
    position: absolute;
    top: -60px; left: 50%;
    transform: translateX(-50%);
    width: 260px; height: 120px;
    background: radial-gradient(ellipse, rgba(79,142,247,.18) 0%, transparent 70%);
    pointer-events: none;
  }

  .time-display {
    font-size: clamp(52px, 14vw, 76px);
    font-weight: 700;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    background: linear-gradient(135deg, #e8eaf6 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    transition: opacity .2s;
  }
  .time-display.flash {
    animation: flash-anim .4s ease;
  }
  @keyframes flash-anim {
    0%,100% { opacity: 1; }
    50% { opacity: .35; }
  }

  .ms-display {
    font-size: clamp(22px, 6vw, 32px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    letter-spacing: 1px;
    margin-top: -4px;
  }

  .lap-badge {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--surface2);
    padding: 3px 10px;
    border-radius: 20px;
    margin-top: 2px;
  }

  /* Countdown input */
  .cd-input-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 4px;
  }
  .cd-field {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .cd-field label {
    font-size: 11px;
    color: var(--text-muted);
  }
  .cd-field input {
    width: 62px;
    text-align: center;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 22px;
    font-weight: 700;
    padding: 8px 4px;
    outline: none;
    transition: border-color .2s;
    font-variant-numeric: tabular-nums;
  }
  .cd-field input:focus { border-color: var(--accent); }
  .cd-sep {
    font-size: 26px;
    font-weight: 700;
    color: var(--text-muted);
    margin-top: -12px;
  }

  /* Progress ring */
  .progress-ring-wrap {
    display: none;
    align-items: center;
    justify-content: center;
    margin: 4px 0 -4px;
  }
  .progress-ring-wrap.visible { display: flex; }
  .progress-ring {
    transform: rotate(-90deg);
  }
  .ring-bg { fill: none; stroke: var(--surface2); stroke-width: 5; }
  .ring-fg {
    fill: none;
    stroke: url(#ring-grad);
    stroke-width: 5;
    stroke-linecap: round;
    transition: stroke-dashoffset .25s linear;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .btn {
    flex: 1;
    max-width: 130px;
    padding: 14px 0;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s, filter .15s, opacity .2s;
    position: relative;
    overflow: hidden;
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .38; cursor: default; }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
  }
  .btn-primary:not(:disabled):hover { filter: brightness(1.12); }

  .btn-danger {
    background: linear-gradient(135deg, #f7604f, #d63031);
    color: #fff;
  }
  .btn-danger:not(:disabled):hover { filter: brightness(1.1); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1.5px solid var(--border);
  }
  .btn-secondary:not(:disabled):hover { background: var(--border); }

  .btn-green {
    background: linear-gradient(135deg, var(--green), #27ae60);
    color: #fff;
  }
  .btn-green:not(:disabled):hover { filter: brightness(1.1); }

  /* Lap list */
  .lap-section {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    display: none;
  }
  .lap-section.visible { display: block; }
  .lap-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
  }
  .lap-clear {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 6px;
    transition: background .15s, color .15s;
  }
  .lap-clear:hover { background: var(--border); color: var(--text); }

  .lap-list {
    max-height: 220px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .lap-list::-webkit-scrollbar { width: 4px; }
  .lap-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .lap-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    animation: slide-in .22s ease;
  }
  .lap-item:last-child { border-bottom: none; }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .lap-item.best .lap-time { color: var(--green); }
  .lap-item.worst .lap-time { color: var(--red); }
  .lap-num { color: var(--text-muted); font-size: 13px; }
  .lap-split { color: var(--text-muted); font-size: 12px; }
  .lap-time { font-weight: 600; }

  /* Finish overlay */
  .finish-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,17,23,.85);
    backdrop-filter: blur(6px);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  .finish-overlay.visible { display: flex; }
  .finish-box {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 40px 36px;
    text-align: center;
    max-width: 320px;
    width: 90%;
    animation: pop-in .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop-in {
    from { opacity: 0; transform: scale(.8); }
    to { opacity: 1; transform: scale(1); }
  }
  .finish-icon {
    font-size: 52px;
    margin-bottom: 12px;
  }
  .finish-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .finish-sub {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
  .finish-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px 36px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: filter .15s;
  }
  .finish-btn:hover { filter: brightness(1.12); }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<div class="app">
  <!-- Mode Tabs -->
  <div class="tabs">
    <button class="tab active" id="tab-sw">秒表</button>
    <button class="tab" id="tab-cd">倒计时</button>
  </div>

  <!-- Main Card -->
  <div class="display-card">
    <!-- Progress ring (countdown only) -->
    <div class="progress-ring-wrap" id="ring-wrap">
      <svg class="progress-ring" width="110" height="110" viewBox="0 0 110 110">
        <defs>
          <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f8ef7"/>
            <stop offset="100%" stop-color="#7c5cfc"/>
          </linearGradient>
        </defs>
        <circle class="ring-bg" cx="55" cy="55" r="48"/>
        <circle class="ring-fg" id="ring-fg" cx="55" cy="55" r="48"/>
      </svg>
    </div>

    <!-- Time -->
    <div class="time-display" id="time-display">00:00</div>
    <div class="ms-display" id="ms-display">.000</div>
    <div class="lap-badge" id="lap-badge" style="display:none"></div>

    <!-- Countdown input fields -->
    <div class="cd-input-row" id="cd-input-row" style="display:none">
      <div class="cd-field">
        <label>时</label>
        <input type="number" id="cd-h" min="0" max="99" value="0" placeholder="00">
      </div>
      <span class="cd-sep">:</span>
      <div class="cd-field">
        <label>分</label>
        <input type="number" id="cd-m" min="0" max="59" value="5" placeholder="00">
      </div>
      <span class="cd-sep">:</span>
      <div class="cd-field">
        <label>秒</label>
        <input type="number" id="cd-s" min="0" max="59" value="0" placeholder="00">
      </div>
    </div>
  </div>

  <!-- Buttons row -->
  <div class="btn-row" id="btn-row">
    <button class="btn btn-primary" id="btn-start">开始</button>
    <button class="btn btn-secondary" id="btn-lap" disabled>计圈</button>
    <button class="btn btn-secondary" id="btn-reset" disabled>重置</button>
  </div>

  <!-- Lap list (stopwatch) -->
  <div class="lap-section" id="lap-section">
    <div class="lap-header">
      <span>计圈记录</span>
      <button class="lap-clear" id="btn-lap-clear">清空</button>
    </div>
    <div class="lap-list" id="lap-list"></div>
  </div>
</div>

<!-- Finish overlay -->
<div class="finish-overlay" id="finish-overlay">
  <div class="finish-box">
    <div class="finish-icon">&#9200;</div>
    <div class="finish-title">时间到！</div>
    <div class="finish-sub" id="finish-sub">倒计时已结束</div>
    <button class="finish-btn" id="finish-close">好的</button>
  </div>
</div>

<script>
(function() {
  "use strict";

  /* ---- Constants ---- */
  var CIRCUMFERENCE = 2 * Math.PI * 48; // r=48

  /* ---- State variables ---- */
  var mode = "sw"; // "sw" | "cd"
  var running = false;
  var startTime = 0;
  var elapsed = 0;
  var rafId = null;
  var laps = [];
  var lapStartElapsed = 0;
  var cdTotal = 0; // total countdown ms
  var cdRemaining = 0;
  var cdStartTime = 0;
  var cdElapsedAtPause = 0;

  /* ---- DOM refs ---- */
  var tabSw = document.getElementById("tab-sw");
  var tabCd = document.getElementById("tab-cd");
  var timeDisplay = document.getElementById("time-display");
  var msDisplay = document.getElementById("ms-display");
  var lapBadge = document.getElementById("lap-badge");
  var cdInputRow = document.getElementById("cd-input-row");
  var cdH = document.getElementById("cd-h");
  var cdM = document.getElementById("cd-m");
  var cdS = document.getElementById("cd-s");
  var btnStart = document.getElementById("btn-start");
  var btnLap = document.getElementById("btn-lap");
  var btnReset = document.getElementById("btn-reset");
  var lapSection = document.getElementById("lap-section");
  var lapList = document.getElementById("lap-list");
  var btnLapClear = document.getElementById("btn-lap-clear");
  var ringWrap = document.getElementById("ring-wrap");
  var ringFg = document.getElementById("ring-fg");
  var finishOverlay = document.getElementById("finish-overlay");
  var finishSub = document.getElementById("finish-sub");
  var finishClose = document.getElementById("finish-close");

  /* ---- Helpers ---- */
  function pad2(n) {
    return n < 10 ? "0" + n : "" + n;
  }

  function pad3(n) {
    if (n < 10) return "00" + n;
    if (n < 100) return "0" + n;
    return "" + n;
  }

  function formatTime(ms) {
    var totalSec = Math.floor(ms / 1000);
    var h = Math.floor(totalSec / 3600);
    var m = Math.floor((totalSec % 3600) / 60);
    var s = totalSec % 60;
    if (h > 0) {
      return pad2(h) + ":" + pad2(m) + ":" + pad2(s);
    }
    return pad2(m) + ":" + pad2(s);
  }

  function formatMs(ms) {
    return "." + pad3(ms % 1000);
  }

  function setRing(fraction) {
    // fraction 0..1, 1 = full
    var offset = CIRCUMFERENCE * (1 - Math.max(0, Math.min(1, fraction)));
    ringFg.style.strokeDasharray = CIRCUMFERENCE;
    ringFg.style.strokeDashoffset = offset;
  }

  function saveLaps() {
    try { localStorage.setItem("sw_laps", JSON.stringify(laps)); } catch(e) {}
  }

  function loadLaps() {
    try {
      var raw = localStorage.getItem("sw_laps");
      if (raw) { laps = JSON.parse(raw); }
    } catch(e) { laps = []; }
  }

  function saveCdPrefs() {
    try {
      localStorage.setItem("cd_h", cdH.value);
      localStorage.setItem("cd_m", cdM.value);
      localStorage.setItem("cd_s", cdS.value);
    } catch(e) {}
  }

  function loadCdPrefs() {
    try {
      var h = localStorage.getItem("cd_h");
      var m = localStorage.getItem("cd_m");
      var s = localStorage.getItem("cd_s");
      if (h !== null) cdH.value = h;
      if (m !== null) cdM.value = m;
      if (s !== null) cdS.value = s;
    } catch(e) {}
  }

  /* ---- Display update ---- */
  function updateSwDisplay(ms) {
    timeDisplay.textContent = formatTime(ms);
    msDisplay.textContent = formatMs(ms);
  }

  function updateCdDisplay(ms) {
    var remaining = Math.max(0, ms);
    timeDisplay.textContent = formatTime(remaining);
    msDisplay.textContent = formatMs(remaining);
    setRing(cdTotal > 0 ? remaining / cdTotal : 0);
  }

  /* ---- Lap rendering ---- */
  function getBestWorst() {
    if (laps.length < 2) return { best: -1, worst: -1 };
    var splits = laps.map(function(l) { return l.split; });
    var minVal = Math.min.apply(null, splits);
    var maxVal = Math.max.apply(null, splits);
    var bestIdx = splits.indexOf(minVal);
    var worstIdx = splits.indexOf(maxVal);
    return { best: bestIdx, worst: worstIdx };
  }

  function renderLaps() {
    lapList.innerHTML = "";
    if (laps.length === 0) {
      lapSection.classList.remove("visible");
      return;
    }
    lapSection.classList.add("visible");
    var bw = getBestWorst();
    // render newest first
    for (var i = laps.length - 1; i >= 0; i--) {
      var lap = laps[i];
      var item = document.createElement("div");
      item.className = "lap-item";
      if (i === bw.best) item.className += " best";
      else if (i === bw.worst) item.className += " worst";
      item.innerHTML =
        '<span class="lap-num">第 ' + (i + 1) + ' 圈</span>' +
        '<span class="lap-time">' + formatTime(lap.split) + formatMs(lap.split) + '</span>' +
        '<span class="lap-split">总 ' + formatTime(lap.total) + '</span>';
      lapList.appendChild(item);
    }
  }

  /* ---- Button state management ---- */
  function updateBtns() {
    if (mode === "sw") {
      btnLap.style.display = "";
      if (running) {
        btnStart.textContent = "暂停";
        btnStart.className = "btn btn-danger";
        btnLap.disabled = false;
        btnReset.disabled = true;
      } else if (elapsed > 0) {
        btnStart.textContent = "继续";
        btnStart.className = "btn btn-green";
        btnLap.disabled = true;
        btnReset.disabled = false;
      } else {
        btnStart.textContent = "开始";
        btnStart.className = "btn btn-primary";
        btnLap.disabled = true;
        btnReset.disabled = true;
      }
      lapBadge.style.display = laps.length > 0 ? "" : "none";
      lapBadge.textContent = "已计 " + laps.length + " 圈";
    } else {
      // countdown
      btnLap.style.display = "none";
      if (running) {
        btnStart.textContent = "暂停";
        btnStart.className = "btn btn-danger";
        btnReset.disabled = false;
      } else if (cdElapsedAtPause > 0) {
        btnStart.textContent = "继续";
        btnStart.className = "btn btn-green";
        btnReset.disabled = false;
      } else {
        btnStart.textContent = "开始";
        btnStart.className = "btn btn-primary";
        btnReset.disabled = true;
      }
      lapBadge.style.display = "none";
    }
  }

  /* ---- Stopwatch logic ---- */
  function swTick() {
    if (!running || mode !== "sw") return;
    elapsed = Date.now() - startTime;
    updateSwDisplay(elapsed);
    rafId = requestAnimationFrame(swTick);
  }

  function swStart() {
    startTime = Date.now() - elapsed;
    running = true;
    rafId = requestAnimationFrame(swTick);
    updateBtns();
  }

  function swPause() {
    running = false;
    cancelAnimationFrame(rafId);
    updateBtns();
  }

  function swReset() {
    running = false;
    cancelAnimationFrame(rafId);
    elapsed = 0;
    lapStartElapsed = 0;
    updateSwDisplay(0);
    updateBtns();
  }

  function swLap() {
    if (!running) return;
    var lapSplit = elapsed - lapStartElapsed;
    laps.push({ split: lapSplit, total: elapsed });
    lapStartElapsed = elapsed;
    saveLaps();
    renderLaps();
    lapBadge.style.display = "";
    lapBadge.textContent = "已计 " + laps.length + " 圈";
    // flash badge
    lapBadge.style.transform = "scale(1.2)";
    setTimeout(function() { lapBadge.style.transform = ""; }, 160);
  }

  /* ---- Countdown logic ---- */
  function getCdMs() {
    var h = parseInt(cdH.value) || 0;
    var m = parseInt(cdM.value) || 0;
    var s = parseInt(cdS.value) || 0;
    h = Math.max(0, Math.min(99, h));
    m = Math.max(0, Math.min(59, m));
    s = Math.max(0, Math.min(59, s));
    return (h * 3600 + m * 60 + s) * 1000;
  }

  function cdTick() {
    if (!running || mode !== "cd") return;
    var now = Date.now();
    var used = now - cdStartTime + cdElapsedAtPause;
    cdRemaining = Math.max(0, cdTotal - used);
    updateCdDisplay(cdRemaining);
    if (cdRemaining <= 0) {
      cdFinish();
      return;
    }
    rafId = requestAnimationFrame(cdTick);
  }

  function cdStart() {
    if (cdElapsedAtPause === 0) {
      // fresh start
      cdTotal = getCdMs();
      if (cdTotal <= 0) return;
      saveCdPrefs();
    }
    cdStartTime = Date.now();
    running = true;
    setRing(1);
    rafId = requestAnimationFrame(cdTick);
    updateBtns();
  }

  function cdPause() {
    running = false;
    cancelAnimationFrame(rafId);
    var used = Date.now() - cdStartTime + cdElapsedAtPause;
    cdElapsedAtPause = used;
    updateBtns();
  }

  function cdReset() {
    running = false;
    cancelAnimationFrame(rafId);
    cdElapsedAtPause = 0;
    cdRemaining = 0;
    cdTotal = 0;
    updateCdDisplay(getCdMs());
    setRing(0);
    updateBtns();
    cdInputRow.style.display = "";
  }

  function cdFinish() {
    running = false;
    cancelAnimationFrame(rafId);
    cdElapsedAtPause = 0;
    cdRemaining = 0;
    updateCdDisplay(0);
    updateBtns();
    cdInputRow.style.display = "";
    // Flash
    timeDisplay.classList.add("flash");
    setTimeout(function() { timeDisplay.classList.remove("flash"); }, 500);
    // Show overlay
    finishSub.textContent = "已完成 " + formatTime(cdTotal) + " 倒计时";
    finishOverlay.classList.add("visible");
  }

  /* ---- Mode switching ---- */
  function switchMode(newMode) {
    if (newMode === mode) return;
    // Stop any running timer
    running = false;
    cancelAnimationFrame(rafId);

    mode = newMode;
    elapsed = 0;
    lapStartElapsed = 0;
    cdElapsedAtPause = 0;
    cdRemaining = 0;
    cdTotal = 0;

    if (mode === "sw") {
      tabSw.classList.add("active");
      tabCd.classList.remove("active");
      cdInputRow.style.display = "none";
      ringWrap.classList.remove("visible");
      lapBadge.style.display = laps.length > 0 ? "" : "none";
      updateSwDisplay(0);
      renderLaps();
    } else {
      tabCd.classList.add("active");
      tabSw.classList.remove("active");
      cdInputRow.style.display = "";
      ringWrap.classList.add("visible");
      lapSection.classList.remove("visible");
      lapBadge.style.display = "none";
      var ms = getCdMs();
      updateCdDisplay(ms);
      setRing(ms > 0 ? 1 : 0);
    }
    updateBtns();
  }

  /* ---- Event listeners ---- */
  tabSw.addEventListener("click", function() { switchMode("sw"); });
  tabCd.addEventListener("click", function() { switchMode("cd"); });

  btnStart.addEventListener("click", function() {
    if (mode === "sw") {
      if (running) swPause();
      else swStart();
    } else {
      if (running) cdPause();
      else cdStart();
    }
  });

  btnLap.addEventListener("click", function() {
    if (mode === "sw") swLap();
  });

  btnReset.addEventListener("click", function() {
    if (mode === "sw") {
      swReset();
      laps = [];
      saveLaps();
      renderLaps();
    } else {
      cdReset();
    }
  });

  btnLapClear.addEventListener("click", function() {
    laps = [];
    saveLaps();
    renderLaps();
    lapBadge.style.display = "none";
    lapBadge.textContent = "";
  });

  finishClose.addEventListener("click", function() {
    finishOverlay.classList.remove("visible");
  });

  // Clamp countdown inputs on blur
  function clampCdInput(el, min, max) {
    el.addEventListener("blur", function() {
      var v = parseInt(el.value) || 0;
      el.value = Math.max(min, Math.min(max, v));
      if (!running && mode === "cd") {
        var ms = getCdMs();
        updateCdDisplay(ms);
        setRing(ms > 0 ? 1 : 0);
      }
    });
  }
  clampCdInput(cdH, 0, 99);
  clampCdInput(cdM, 0, 59);
  clampCdInput(cdS, 0, 59);

  // Hide cd input row when running
  btnStart.addEventListener("click", function() {
    if (mode === "cd" && running) {
      cdInputRow.style.display = "none";
    }
  });

  /* ---- Init ---- */
  loadLaps();
  loadCdPrefs();
  ringWrap.classList.remove("visible");
  cdInputRow.style.display = "none";
  updateSwDisplay(0);
  renderLaps();
  updateBtns();
  setRing(0);

})();
</script>
</body>
</html>
