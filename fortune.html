<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日运势</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red:    #c0392b;
    --gold:   #d4a017;
    --gold-l: #f5d76e;
    --cream:  #fdf6e3;
    --ink:    #2c1a0e;
    --ink2:   #5a3e28;
    --ink3:   #8b6347;
    --paper:  #fff8ee;
    --border: #e8c97a;
    --shadow: rgba(180,120,40,0.18);
  }

  html, body {
    min-height: 100%;
    background: var(--cream);
    color: var(--ink);
    font-family: "PingFang SC","Microsoft YaHei","SimSun",serif;
  }

  body {
    background:
      radial-gradient(ellipse at 20% 10%, #f9e4b7 0%, transparent 60%),
      radial-gradient(ellipse at 80% 90%, #fce8c5 0%, transparent 60%),
      var(--cream);
    min-height: 100vh;
    padding: 0 0 40px;
  }

  /* Back link */
  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    z-index: 100;
    font-size: 13px;
    color: var(--ink3);
    text-decoration: none;
    background: rgba(253,246,227,0.85);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    transition: color .2s, background .2s;
    backdrop-filter: blur(4px);
  }
  .back-link:hover { color: var(--red); background: #fff8ee; }

  /* Header */
  .header {
    text-align: center;
    padding: 56px 16px 24px;
  }
  .header .badge {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 20px;
    padding: 3px 14px;
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  .header h1 {
    font-size: clamp(26px, 7vw, 42px);
    font-weight: 700;
    color: var(--red);
    letter-spacing: 4px;
    text-shadow: 0 2px 8px rgba(192,57,43,0.15);
  }
  .header .date-line {
    margin-top: 8px;
    font-size: 13px;
    color: var(--ink3);
    letter-spacing: 2px;
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 0 auto 28px;
    max-width: 320px;
    color: var(--gold);
    font-size: 18px;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* Main container */
  .container {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  /* Card base */
  .card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px 24px;
    box-shadow: 0 4px 18px var(--shadow);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px var(--shadow);
  }
  .card-title {
    font-size: 12px;
    letter-spacing: 3px;
    color: var(--ink3);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, var(--border), transparent);
  }

  /* Overall index */
  .overall-card {
    background: linear-gradient(135deg, #c0392b 0%, #8b1a1a 100%);
    border-color: #8b1a1a;
    color: #fff;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .overall-card::before {
    content: '福';
    position: absolute;
    right: -10px; top: -20px;
    font-size: 120px;
    color: rgba(255,255,255,0.06);
    font-weight: 900;
    pointer-events: none;
  }
  .overall-card .card-title { color: rgba(255,255,255,0.7); }
  .overall-card .card-title::after { background: linear-gradient(90deg, rgba(255,255,255,0.3), transparent); }
  .overall-score-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 8px 0 4px;
  }
  .overall-num {
    font-size: clamp(52px, 14vw, 72px);
    font-weight: 900;
    line-height: 1;
    color: var(--gold-l);
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    animation: popIn .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  .overall-unit { font-size: 20px; color: rgba(255,255,255,0.7); align-self: flex-end; margin-bottom: 6px; }
  .overall-label {
    font-size: 18px;
    color: var(--gold-l);
    letter-spacing: 3px;
    margin-top: 6px;
    font-weight: 600;
  }
  .ring-wrap {
    position: relative;
    width: 80px; height: 80px;
    flex-shrink: 0;
  }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 6; }
  .ring-fg { fill: none; stroke: var(--gold-l); stroke-width: 6; stroke-linecap: round;
    transition: stroke-dashoffset 1.2s cubic-bezier(.4,0,.2,1);
  }

  /* Sub fortune grid */
  .sub-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .sub-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    padding: 14px 8px;
    background: rgba(255,248,238,0.7);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: transform .2s;
  }
  .sub-item:hover { transform: scale(1.03); }
  .sub-icon { font-size: 22px; }
  .sub-label { font-size: 11px; color: var(--ink3); letter-spacing: 2px; }
  .sub-stars { display: flex; gap: 3px; }
  .star { font-size: 16px; transition: transform .3s; }
  .star.lit { color: var(--gold); animation: starPop .4s ease both; }
  .star.dim { color: #ddd; }
  .sub-score-num { font-size: 11px; color: var(--ink3); }

  /* Lucky info */
  .lucky-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }
  .lucky-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 14px 6px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(255,248,238,0.6);
  }
  .lucky-item-label { font-size: 10px; color: var(--ink3); letter-spacing: 2px; }
  .lucky-color-box {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 3px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    transition: transform .3s;
  }
  .lucky-color-box:hover { transform: scale(1.15); }
  .lucky-color-name { font-size: 12px; color: var(--ink2); font-weight: 600; }
  .lucky-num-display {
    font-size: 28px;
    font-weight: 900;
    color: var(--red);
    line-height: 1;
  }
  .lucky-direction { font-size: 18px; font-weight: 700; color: var(--ink2); }
  .lucky-direction-sub { font-size: 10px; color: var(--ink3); }

  /* Yi/Ji */
  .yiji-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .yi-box, .ji-box {
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .yi-box {
    background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
    border: 1px solid #a5d6a7;
  }
  .ji-box {
    background: linear-gradient(135deg, #fce4ec, #fef9f9);
    border: 1px solid #ef9a9a;
  }
  .yi-title { font-size: 12px; color: #2e7d32; font-weight: 700; letter-spacing: 2px; }
  .ji-title { font-size: 12px; color: #c62828; font-weight: 700; letter-spacing: 2px; }
  .yi-item, .ji-item {
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .yi-item { color: #2e7d32; }
  .ji-item { color: #c62828; }
  .yi-dot { width: 5px; height: 5px; border-radius: 50%; background: #4caf50; flex-shrink: 0; }
  .ji-dot { width: 5px; height: 5px; border-radius: 50%; background: #ef5350; flex-shrink: 0; }

  /* Advice card */
  .advice-text {
    font-size: 14px;
    line-height: 1.9;
    color: var(--ink2);
    letter-spacing: .5px;
    position: relative;
    padding-left: 14px;
    border-left: 3px solid var(--gold);
  }

  /* Refresh button */
  .refresh-wrap {
    text-align: center;
    margin-top: 8px;
  }
  .btn-refresh {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, var(--red), #9b1a1a);
    color: #fff;
    border: none;
    border-radius: 28px;
    padding: 12px 32px;
    font-size: 15px;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 16px rgba(192,57,43,0.35);
    transition: transform .2s, box-shadow .2s;
    position: relative;
    overflow: hidden;
  }
  .btn-refresh:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(192,57,43,0.45);
  }
  .btn-refresh:active { transform: scale(0.97); }
  .btn-refresh .spin-icon { display: inline-block; transition: transform .4s ease; }
  .btn-refresh:hover .spin-icon { transform: rotate(180deg); }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 32px;
    font-size: 11px;
    color: var(--ink3);
    letter-spacing: 2px;
    opacity: .6;
  }

  /* Animations */
  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes starPop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.3); }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes fadeSlideUp {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .card { animation: fadeSlideUp .5s ease both; }
  .card:nth-child(1) { animation-delay: .05s; }
  .card:nth-child(2) { animation-delay: .12s; }
  .card:nth-child(3) { animation-delay: .19s; }
  .card:nth-child(4) { animation-delay: .26s; }
  .card:nth-child(5) { animation-delay: .33s; }
  .card:nth-child(6) { animation-delay: .40s; }

  /* Responsive tweaks */
  @media (max-width: 380px) {
    .lucky-grid { grid-template-columns: 1fr 1fr; }
    .lucky-item:last-child { grid-column: 1 / -1; }
  }
</style>
</head>

  /* ─── Seeded PRNG (mulberry32) ─── */
  function createRng(seed) {
    var s = seed >>> 0;
    return function() {
      s += 0x6D2B79F5;
      var t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = t + Math.imul(t ^ (t >>> 7), 61 | t) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function dateSeed() {
    var now = new Date();
    var y = now.getFullYear();
    var m = now.getMonth() + 1;
    var d = now.getDate();
    return (y * 10000 + m * 100 + d) | 0;
  }

  function pickN(rng, arr, n) {
    var copy = arr.slice();
    var result = [];
    for (var i = 0; i < n && copy.length > 0; i++) {
      var idx = Math.floor(rng() * copy.length);
      result.push(copy.splice(idx, 1)[0]);
    }
    return result;
  }

  function randInt(rng, min, max) {
    return min + Math.floor(rng() * (max - min + 1));
  }

  /* ─── DOM helpers ─── */
  function el(id) { return document.getElementById(id); }

  function renderStars(containerId, count) {
    var container = el(containerId);
    if (!container) { return; }
    container.innerHTML = "";
    for (var i = 1; i <= 5; i++) {
      var span = document.createElement("span");
      span.className = "star " + (i <= count ? "lit" : "dim");
      span.textContent = "★";
      if (i <= count) {
        span.style.animationDelay = (0.05 * i) + "s";
      }
      container.appendChild(span);
    }
  }

  function formatDate(d) {
    var weekDays = ["日","一","二","三","四","五","六"];
    var y = d.getFullYear();
    var m = d.getMonth() + 1;
    var day = d.getDate();
    var w = d.getDay();
    return y + " 年 " + m + " 月 " + day + " 日  星期" + weekDays[w];
  }

  /* ─── Main render ─── */
  function render(useSeed) {
    var seed = (useSeed !== undefined) ? useSeed : dateSeed();
    var rng = createRng(seed);

    /* Scores */
    var love    = randInt(rng, 1, 5);
    var career  = randInt(rng, 1, 5);
    var wealth  = randInt(rng, 1, 5);
    var health  = randInt(rng, 1, 5);
    var overall = Math.round((love + career + wealth + health) / 20 * 100 * 0.6 + rng() * 40);
    if (overall < 30) { overall = 30; }
    if (overall > 99) { overall = 99; }

    /* Label */
    var label = LEVEL_LABELS[0];
    for (var li = 0; li < LEVEL_THRESHOLDS.length; li++) {
      if (overall <= LEVEL_THRESHOLDS[li]) { label = LEVEL_LABELS[li]; break; }
    }

    /* Lucky */
    var colorIdx = Math.floor(rng() * COLORS.length);
    var luckyColor = COLORS[colorIdx];
    var luckyNum = randInt(rng, 1, 99);
    var dirIdx = Math.floor(rng() * DIRECTIONS.length);
    var luckyDir = DIRECTIONS[dirIdx];

    /* Yi / Ji */
    var yiItems = pickN(rng, YI_POOL, 4);
    var jiItems = pickN(rng, JI_POOL, 4);

    /* Advice */
    var adviceIdx = Math.floor(rng() * ADVICES.length);
    var advice = ADVICES[adviceIdx];

    /* ─── Update DOM ─── */
    el("date-line").textContent = formatDate(new Date());
    el("overall-num").textContent = overall;
    el("overall-label").textContent = label;

    /* Ring animation */
    var circumference = 213.6;
    var offset = circumference - (overall / 100) * circumference;
    var circle = el("ring-circle");
    if (circle) {
      circle.style.strokeDashoffset = circumference;
      setTimeout(function() {
        circle.style.strokeDashoffset = offset;
      }, 120);
    }

    /* Sub stars */
    renderStars("stars-love",   love);
    renderStars("stars-career", career);
    renderStars("stars-wealth", wealth);
    renderStars("stars-health", health);

    var scoreTexts = [
      { id: "score-love",   val: love },
      { id: "score-career", val: career },
      { id: "score-wealth", val: wealth },
      { id: "score-health", val: health }
    ];
    for (var si = 0; si < scoreTexts.length; si++) {
      var node = el(scoreTexts[si].id);
      if (node) { node.textContent = scoreTexts[si].val + " / 5 星"; }
    }

    /* Lucky color */
    var colorBox = el("lucky-color-box");
    if (colorBox) { colorBox.style.background = luckyColor.hex; }
    var colorName = el("lucky-color-name");
    if (colorName) { colorName.textContent = luckyColor.name; }

    /* Lucky num */
    var luckyNumEl = el("lucky-num");
    if (luckyNumEl) { luckyNumEl.textContent = luckyNum; }

    /* Direction */
    var dirEl = el("lucky-dir");
    var dirSubEl = el("lucky-dir-sub");
    if (dirEl) { dirEl.textContent = luckyDir.name; }
    if (dirSubEl) { dirSubEl.textContent = luckyDir.sub; }

    /* Yi list */
    var yiList = el("yi-list");
    if (yiList) {
      yiList.innerHTML = "";
      for (var yi = 0; yi < yiItems.length; yi++) {
        var div = document.createElement("div");
        div.className = "yi-item";
        div.innerHTML = '<span class="yi-dot"></span>' + yiItems[yi];
        yiList.appendChild(div);
      }
    }

    /* Ji list */
    var jiList = el("ji-list");
    if (jiList) {
      jiList.innerHTML = "";
      for (var ji = 0; ji < jiItems.length; ji++) {
        var div2 = document.createElement("div");
        div2.className = "ji-item";
        div2.innerHTML = '<span class="ji-dot"></span>' + jiItems[ji];
        jiList.appendChild(div2);
      }
    }

    /* Advice */
    var adviceEl = el("advice-text");
    if (adviceEl) { adviceEl.textContent = advice; }

    /* Persist */
    try {
      localStorage.setItem("fortune_seed", String(seed));
      localStorage.setItem("fortune_date", String(dateSeed()));
    } catch (e) { /* ignore */ }
  }

  /* ─── Re-roll with time-based extra salt ─── */
  function reRoll() {
    var extraSalt = dateSeed() * 1000 + (Date.now() % 1000);
    render(extraSalt | 0);
  }

  /* ─── Init ─── */
  var savedSeed = null;
  try {
    var storedDate = localStorage.getItem("fortune_date");
    var storedSeed = localStorage.getItem("fortune_seed");
    if (storedDate && storedSeed && parseInt(storedDate, 10) === dateSeed()) {
      savedSeed = parseInt(storedSeed, 10);
    }
  } catch (e) { /* ignore */ }

  var refreshBtn = el("btn-refresh");
  if (refreshBtn) {
    refreshBtn.addEventListener("click", reRoll);
  }

  render(savedSeed !== null ? savedSeed : undefined);

})();
</script>
</body>
</html>
