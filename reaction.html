<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反应测试</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232635;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --red: #ef4444;
    --green: #22c55e;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --radius: 16px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    color: var(--text2);
    text-decoration: none;
    font-size: 13px;
    opacity: 0.7;
    transition: opacity 0.2s;
    z-index: 100;
    background: rgba(15,17,23,0.8);
    padding: 4px 10px;
    border-radius: 20px;
    backdrop-filter: blur(8px);
  }
  .back-link:hover { opacity: 1; }

  .container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding-top: 56px;
  }

  h1 {
    font-size: clamp(22px, 5vw, 28px);
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
  }

  .subtitle {
    color: var(--text2);
    font-size: 13px;
    text-align: center;
    line-height: 1.6;
    margin-top: -10px;
  }

  /* Main arena */
  .arena {
    width: 100%;
    aspect-ratio: 1 / 0.75;
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 0.15s ease, box-shadow 0.3s ease;
    box-shadow: var(--shadow);
  }

  .arena.state-idle {
    background: var(--surface2);
    box-shadow: var(--shadow);
  }
  .arena.state-waiting {
    background: var(--red);
    box-shadow: 0 8px 40px rgba(239,68,68,0.4);
    animation: pulse-red 1s ease-in-out infinite;
  }
  .arena.state-go {
    background: var(--green);
    box-shadow: 0 8px 40px rgba(34,197,94,0.5);
    animation: pop-in 0.12s ease-out;
  }
  .arena.state-result {
    background: var(--surface2);
    box-shadow: var(--shadow);
  }
  .arena.state-foul {
    background: var(--yellow);
    box-shadow: 0 8px 40px rgba(245,158,11,0.4);
    animation: shake 0.4s ease;
  }

  @keyframes pulse-red {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.12); }
  }

  @keyframes pop-in {
    0% { transform: scale(0.96); filter: brightness(1.3); }
    100% { transform: scale(1); filter: brightness(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  .arena-msg {
    font-size: clamp(18px, 4.5vw, 26px);
    font-weight: 700;
    text-align: center;
    padding: 0 20px;
    line-height: 1.4;
    pointer-events: none;
  }

  .arena-sub {
    font-size: clamp(12px, 3vw, 15px);
    opacity: 0.85;
    margin-top: 8px;
    pointer-events: none;
    text-align: center;
  }

  .result-time {
    font-size: clamp(44px, 12vw, 72px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -2px;
    pointer-events: none;
  }

  .result-unit {
    font-size: clamp(14px, 3.5vw, 18px);
    font-weight: 400;
    opacity: 0.8;
    margin-top: 4px;
    pointer-events: none;
  }

  /* Stats */
  .stats-card {
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .stat-value {
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 700;
    color: var(--text);
  }

  .stat-value.best { color: var(--accent2); }
  .stat-value.avg { color: #38bdf8; }
  .stat-value.count { color: #fb923c; }

  /* History */
  .history-card {
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
  }

  .history-title {
    font-size: 12px;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 200px;
    overflow-y: auto;
  }

  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    animation: slide-in 0.25s ease;
  }

  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .history-rank {
    color: var(--text2);
    font-size: 11px;
    width: 20px;
  }

  .history-val {
    font-weight: 600;
    font-size: 15px;
  }

  .history-val.top1 { color: #fbbf24; }
  .history-val.top2 { color: #94a3b8; }
  .history-val.top3 { color: #cd7c3b; }

  .history-bar-wrap {
    flex: 1;
    margin: 0 12px;
    height: 4px;
    background: var(--bg);
    border-radius: 2px;
    overflow: hidden;
  }

  .history-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  .history-time {
    color: var(--text2);
    font-size: 11px;
    white-space: nowrap;
  }

  .btn-clear {
    margin-top: 10px;
    background: none;
    border: 1px solid rgba(148,163,184,0.2);
    color: var(--text2);
    font-size: 12px;
    padding: 6px 16px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-clear:hover {
    border-color: var(--red);
    color: var(--red);
  }

  .empty-hint {
    color: var(--text2);
    font-size: 13px;
    text-align: center;
    padding: 16px 0;
  }

  /* Badge rating */
  .rating-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin-top: 6px;
  }
  .rating-elite { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .rating-great { background: rgba(34,197,94,0.15); color: #22c55e; }
  .rating-good { background: rgba(56,189,248,0.15); color: #38bdf8; }
  .rating-avg { background: rgba(108,99,255,0.15); color: var(--accent2); }
  .rating-slow { background: rgba(148,163,184,0.15); color: var(--text2); }

  .footer {
    color: var(--text2);
    font-size: 11px;
    opacity: 0.4;
    padding-bottom: 20px;
    text-align: center;
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<div class="container">
  <h1>反应测试</h1>
  <p class="subtitle">屏幕变绿时立刻点击 · 越快越好<br>变绿前点击视为抢跑犯规</p>

  <div class="arena state-idle" id="arena">
    <div class="arena-msg" id="arenaMsg">点击开始</div>
    <div class="arena-sub" id="arenaSub">准备好了吗？</div>
  </div>

  <div class="stats-card" id="statsCard">
    <div class="stat-item">
      <span class="stat-label">最佳</span>
      <span class="stat-value best" id="statBest">—</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">平均</span>
      <span class="stat-value avg" id="statAvg">—</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">次数</span>
      <span class="stat-value count" id="statCount">0</span>
    </div>
  </div>

  <div class="history-card" id="historyCard">
    <div class="history-title">历史记录</div>
    <div class="history-list" id="historyList">
      <div class="empty-hint" id="emptyHint">还没有记录，开始测试吧！</div>
    </div>
    <button class="btn-clear" id="btnClear">清除记录</button>
  </div>

  <div class="footer">单位：毫秒（ms）· 成绩保存于本地</div>
</div>

<script>
(function () {
  "use strict";

  /* ── 常量 ── */
  var STORAGE_KEY = "reaction_records_v1";
  var MAX_RECORDS = 20;

  /* ── 状态变量 ── */
  var state = "idle"; // idle | waiting | go | result | foul
  var startTime = 0;
  var waitTimer = null;
  var records = [];

  /* ── DOM 引用 ── */
  var arena = document.getElementById("arena");
  var arenaMsg = document.getElementById("arenaMsg");
  var arenaSub = document.getElementById("arenaSub");
  var statBest = document.getElementById("statBest");
  var statAvg = document.getElementById("statAvg");
  var statCount = document.getElementById("statCount");
  var historyList = document.getElementById("historyList");
  var emptyHint = document.getElementById("emptyHint");
  var btnClear = document.getElementById("btnClear");

  /* ── 工具函数 ── */
  function getRating(ms) {
    if (ms < 180) return { label: "反应超人", cls: "rating-elite" };
    if (ms < 230) return { label: "极速高手", cls: "rating-great" };
    if (ms < 280) return { label: "反应灵敏", cls: "rating-good" };
    if (ms < 350) return { label: "正常水平", cls: "rating-avg" };
    return { label: "继续练习", cls: "rating-slow" };
  }

  function loadRecords() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          records = parsed.filter(function (v) { return typeof v === "number" && isFinite(v); });
        }
      }
    } catch (e) {
      records = [];
    }
  }

  function saveRecords() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    } catch (e) {}
  }

  function calcStats() {
    if (records.length === 0) return null;
    var sorted = records.slice().sort(function (a, b) { return a - b; });
    var best = sorted[0];
    var avg = Math.round(records.reduce(function (s, v) { return s + v; }, 0) / records.length);
    return { best: best, avg: avg, count: records.length };
  }

  /* ── 渲染 ── */
  function renderStats() {
    var stats = calcStats();
    if (!stats) {
      statBest.textContent = "—";
      statAvg.textContent = "—";
      statCount.textContent = "0";
    } else {
      statBest.textContent = stats.best + "ms";
      statAvg.textContent = stats.avg + "ms";
      statCount.textContent = stats.count;
    }
  }

  function renderHistory() {
    if (records.length === 0) {
      if (!emptyHint.parentNode) historyList.appendChild(emptyHint);
      return;
    }
    if (emptyHint.parentNode) emptyHint.parentNode.removeChild(emptyHint);

    var sorted = records.slice().sort(function (a, b) { return a - b; });
    var minVal = sorted[0];
    var maxVal = sorted[sorted.length - 1];

    historyList.innerHTML = "";

    // Show most recent first, up to MAX_RECORDS
    var display = records.slice(-MAX_RECORDS).reverse();
    display.forEach(function (val, idx) {
      var rankInAll = sorted.indexOf(val);
      var barPct = maxVal === minVal ? 60 : Math.max(10, Math.round(60 + (val - minVal) / (maxVal - minVal) * 35));

      var valCls = "";
      if (rankInAll === 0) valCls = " top1";
      else if (rankInAll === 1) valCls = " top2";
      else if (rankInAll === 2) valCls = " top3";

      var item = document.createElement("div");
      item.className = "history-item";
      item.innerHTML =
        '<span class="history-rank">#' + (idx + 1) + '</span>' +
        '<span class="history-val' + valCls + '">' + val + 'ms</span>' +
        '<div class="history-bar-wrap"><div class="history-bar" style="width:' + barPct + '%"></div></div>' +
        '<span class="history-time">' + getRating(val).label + '</span>';
      historyList.appendChild(item);
    });
  }

  /* ── 状态机 ── */
  function setArenaState(newState, msg, sub) {
    state = newState;
    arena.className = "arena state-" + newState;
    arenaMsg.textContent = msg || "";
    arenaSub.textContent = sub || "";
  }

  function startWaiting() {
    setArenaState("waiting", "等待…", "不要抢跑！");
    var delay = 1000 + Math.random() * 3000;
    waitTimer = setTimeout(function () {
      waitTimer = null;
      startTime = Date.now();
      setArenaState("go", "点击！", "");
    }, delay);
  }

  function handleFoul() {
    if (waitTimer !== null) {
      clearTimeout(waitTimer);
      waitTimer = null;
    }
    setArenaState("foul", "抢跑犯规！", "点击重新开始");
  }

  function handleResult() {
    var elapsed = Date.now() - startTime;
    records.push(elapsed);
    if (records.length > MAX_RECORDS) {
      records = records.slice(-MAX_RECORDS);
    }
    saveRecords();

    var rating = getRating(elapsed);
    arenaMsg.innerHTML =
      '<span class="result-time">' + elapsed + '</span>' +
      '<span class="result-unit">毫秒</span>' +
      '<span class="rating-badge ' + rating.cls + '">' + rating.label + '</span>';
    arenaSub.textContent = "点击再试一次";
    arena.className = "arena state-result";
    state = "result";

    renderStats();
    renderHistory();
  }

  /* ── 事件 ── */
  arena.addEventListener("click", function () {
    if (state === "idle" || state === "result" || state === "foul") {
      startWaiting();
    } else if (state === "waiting") {
      handleFoul();
    } else if (state === "go") {
      handleResult();
    }
  });

  // Keyboard support
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "Enter") {
      e.preventDefault();
      arena.click();
    }
  });

  btnClear.addEventListener("click", function (e) {
    e.stopPropagation();
    if (records.length === 0) return;
    if (!confirm("确定清除所有记录吗？")) return;
    records = [];
    saveRecords();
    renderStats();
    renderHistory();
    if (state === "result") {
      setArenaState("idle", "点击开始", "准备好了吗？");
    }
  });

  /* ── 初始化 ── */
  loadRecords();
  renderStats();
  renderHistory();

}());
</script>
</body>
</html>
