<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>感恩日记</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fdf8f3;
    --surface: #ffffff;
    --surface2: #fff9f4;
    --primary: #e8845a;
    --primary-light: #f4a97d;
    --primary-dark: #c96a42;
    --accent: #f7c59f;
    --accent2: #ffe0c8;
    --text: #3d2b1f;
    --text-muted: #8a6a57;
    --text-light: #b89080;
    --border: #f0ddd3;
    --shadow: rgba(180, 100, 60, 0.10);
    --shadow-deep: rgba(180, 100, 60, 0.18);
    --radius: 18px;
    --radius-sm: 10px;
    --transition: 0.25s cubic-bezier(.4,0,.2,1);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 10%, #ffe8d6 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, #ffd6c8 0%, transparent 50%);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                 "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    padding: 0 0 60px;
  }

  /* Back link */
  .back-link {
    display: inline-block;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    transition: color var(--transition);
    letter-spacing: 0.02em;
  }
  .back-link:hover { color: var(--primary); }

  /* Header */
  .header {
    text-align: center;
    padding: 10px 20px 32px;
  }
  .header-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 10px;
    animation: float 3.5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary-dark);
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .header p {
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 0.03em;
  }

  /* Main container */
  .container {
    max-width: 620px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* Write card */
  .write-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 26px 24px 22px;
    box-shadow: 0 4px 24px var(--shadow), 0 1px 4px var(--shadow);
    margin-bottom: 28px;
    border: 1.5px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .write-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light), var(--accent));
    border-radius: var(--radius) var(--radius) 0 0;
  }

  .card-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--primary-dark);
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .card-title .dot {
    width: 8px; height: 8px;
    background: var(--primary);
    border-radius: 50%;
    display: inline-block;
  }

  /* Date display */
  .date-display {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 18px;
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  /* Gratitude items input */
  .items-wrapper {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }

  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .item-num {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(232,132,90,0.35);
  }

  .item-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 14.5px;
    font-family: inherit;
    color: var(--text);
    background: var(--surface2);
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    resize: none;
    line-height: 1.5;
    min-height: 44px;
  }
  .item-input::placeholder { color: var(--text-light); }
  .item-input:focus {
    border-color: var(--primary-light);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(232,132,90,0.13);
  }

  /* Save button */
  .save-btn {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--primary), var(--primary-light));
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
    box-shadow: 0 4px 16px rgba(232,132,90,0.40);
    position: relative;
    overflow: hidden;
  }
  .save-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .save-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(232,132,90,0.50); }
  .save-btn:active { transform: translateY(0); box-shadow: 0 2px 8px rgba(232,132,90,0.35); }
  .save-btn:active::after { opacity: 0.08; }
  .save-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(61, 43, 31, 0.88);
    color: white;
    padding: 11px 22px;
    border-radius: 99px;
    font-size: 13.5px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    white-space: nowrap;
    backdrop-filter: blur(6px);
    z-index: 999;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* History section */
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .history-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .history-count {
    background: var(--accent2);
    color: var(--primary-dark);
    border-radius: 99px;
    padding: 2px 10px;
    font-size: 12px;
    font-weight: 700;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-light);
  }
  .empty-state .empty-icon { font-size: 44px; margin-bottom: 12px; opacity: 0.7; }
  .empty-state p { font-size: 14px; line-height: 1.7; }

  /* Record cards */
  .records-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .record-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px 20px 16px;
    border: 1.5px solid var(--border);
    box-shadow: 0 2px 12px var(--shadow);
    transition: transform var(--transition), box-shadow var(--transition);
    animation: slideIn 0.35s cubic-bezier(.4,0,.2,1);
    position: relative;
    overflow: hidden;
  }
  .record-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--primary), var(--accent));
    border-radius: 4px 0 0 4px;
  }
  .record-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 24px var(--shadow-deep);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .record-card.removing {
    animation: slideOut 0.3s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes slideOut {
    from { opacity: 1; transform: translateY(0) scale(1); max-height: 300px; }
    to { opacity: 0; transform: translateY(-10px) scale(0.97); max-height: 0; padding: 0; margin: 0; }
  }

  .record-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .record-date {
    font-size: 12.5px;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.03em;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .delete-btn {
    width: 28px; height: 28px;
    border: none;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-light);
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition), color var(--transition), transform var(--transition);
    flex-shrink: 0;
  }
  .delete-btn:hover {
    background: #ffeae0;
    color: var(--primary);
    transform: scale(1.12);
  }

  .record-items {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .record-item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--text);
  }
  .record-item-num {
    width: 22px; height: 22px;
    background: var(--accent2);
    color: var(--primary-dark);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
    margin-top: 1px;
  }
  .record-item-text { flex: 1; word-break: break-word; }

  /* Streak */
  .streak-bar {
    background: linear-gradient(135deg, #fff3ec, #ffe8d6);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius);
    padding: 14px 20px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .streak-icon { font-size: 28px; flex-shrink: 0; }
  .streak-info { flex: 1; }
  .streak-num {
    font-size: 20px;
    font-weight: 800;
    color: var(--primary-dark);
    line-height: 1;
  }
  .streak-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .header h1 { font-size: 24px; }
    .write-card { padding: 20px 16px 18px; }
    .record-card { padding: 16px 16px 14px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="header">
  <span class="header-icon">🌻</span>
  <h1>感恩日记</h1>
  <p>每天记录三件小事，让心灵充满阳光</p>
</div>

<div class="container">

  <!-- Streak bar -->
  <div class="streak-bar" id="streakBar" style="display:none">
    <span class="streak-icon">🔥</span>
    <div class="streak-info">
      <div class="streak-num" id="streakNum">0</div>
      <div class="streak-label">连续打卡天数，继续保持！</div>
    </div>
  </div>

  <!-- Write card -->
  <div class="write-card">
    <div class="card-title">
      <span class="dot"></span>今日感恩
    </div>
    <div class="date-display" id="dateDisplay">
      <span>📅</span><span id="todayLabel"></span>
    </div>
    <div class="items-wrapper">
      <div class="item-row">
        <div class="item-num">1</div>
        <textarea class="item-input" id="item1" placeholder="今天让我感恩的第一件事…" rows="2"></textarea>
      </div>
      <div class="item-row">
        <div class="item-num">2</div>
        <textarea class="item-input" id="item2" placeholder="今天让我感恩的第二件事…" rows="2"></textarea>
      </div>
      <div class="item-row">
        <div class="item-num">3</div>
        <textarea class="item-input" id="item3" placeholder="今天让我感恩的第三件事…" rows="2"></textarea>
      </div>
    </div>
    <button class="save-btn" id="saveBtn">✨ 保存今日感恩</button>
  </div>

  <!-- History -->
  <div class="history-header">
    <div class="history-title">
      <span>📖</span> 往日记录
      <span class="history-count" id="historyCount">0</span>
    </div>
  </div>

  <div id="recordsContainer"></div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ── Constants ── */
  var STORAGE_KEY = "gratitude_records_v1";

  /* ── DOM refs ── */
  var elTodayLabel    = document.getElementById("todayLabel");
  var elItem1         = document.getElementById("item1");
  var elItem2         = document.getElementById("item2");
  var elItem3         = document.getElementById("item3");
  var elSaveBtn       = document.getElementById("saveBtn");
  var elRecords       = document.getElementById("recordsContainer");
  var elHistoryCount  = document.getElementById("historyCount");
  var elToast         = document.getElementById("toast");
  var elStreakBar     = document.getElementById("streakBar");
  var elStreakNum     = document.getElementById("streakNum");

  /* ── Helpers ── */
  var toastTimer = null;

  function showToast(msg) {
    elToast.textContent = msg;
    elToast.classList.add("show");
    if (toastTimer) { clearTimeout(toastTimer); }
    toastTimer = setTimeout(function () {
      elToast.classList.remove("show");
    }, 2400);
  }

  function formatDate(dateStr) {
    var parts = dateStr.split("-");
    var y = parts[0];
    var m = parseInt(parts[1], 10);
    var d = parseInt(parts[2], 10);
    var weeks = ["日", "一", "二", "三", "四", "五", "六"];
    var dt = new Date(parseInt(y, 10), m - 1, d);
    var w = weeks[dt.getDay()];
    return y + " 年 " + m + " 月 " + d + " 日  星期" + w;
  }

  function todayKey() {
    var now = new Date();
    var y = now.getFullYear();
    var m = String(now.getMonth() + 1).padStart(2, "0");
    var d = String(now.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }

  /* ── Storage ── */
  function loadRecords() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { return []; }
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) { return parsed; }
      return [];
    } catch (e) {
      return [];
    }
  }

  function saveRecords(records) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
    } catch (e) {
      showToast("存储失败，请检查浏览器设置");
    }
  }

  /* ── Streak calculation ── */
  function calcStreak(records) {
    if (!records || records.length === 0) { return 0; }
    var sorted = records.slice().sort(function (a, b) {
      return b.date > a.date ? 1 : b.date < a.date ? -1 : 0;
    });
    var streak = 0;
    var cursor = new Date();
    var todayStr = todayKey();
    var latestDate = sorted[0].date;

    // If latest record is not today or yesterday, streak is 0
    var diff = dateDiff(todayStr, latestDate);
    if (diff > 1) { return 0; }

    // Walk backwards
    var expected = new Date(latestDate.replace(/-/g, "/"));
    for (var i = 0; i < sorted.length; i++) {
      var recDate = sorted[i].date;
      var expStr = dateToStr(expected);
      if (recDate === expStr) {
        streak++;
        expected.setDate(expected.getDate() - 1);
      } else {
        break;
      }
    }
    return streak;
  }

  function dateDiff(a, b) {
    var da = new Date(a.replace(/-/g, "/"));
    var db = new Date(b.replace(/-/g, "/"));
    return Math.round(Math.abs(da - db) / 86400000);
  }

  function dateToStr(dt) {
    var y = dt.getFullYear();
    var m = String(dt.getMonth() + 1).padStart(2, "0");
    var d = String(dt.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + d;
  }

  /* ── Render ── */
  function render() {
    var records = loadRecords();

    // Update count
    elHistoryCount.textContent = records.length;

    // Update streak
    var streak = calcStreak(records);
    if (streak >= 1) {
      elStreakBar.style.display = "flex";
      elStreakNum.textContent = streak + " 天";
    } else {
      elStreakBar.style.display = "none";
    }

    // Check if today already saved
    var today = todayKey();
    var todayRecord = null;
    for (var i = 0; i < records.length; i++) {
      if (records[i].date === today) {
        todayRecord = records[i];
        break;
      }
    }

    if (todayRecord) {
      elItem1.value = todayRecord.items[0] || "";
      elItem2.value = todayRecord.items[1] || "";
      elItem3.value = todayRecord.items[2] || "";
      elSaveBtn.textContent = "✏️ 修改今日感恩";
    } else {
      elSaveBtn.textContent = "✨ 保存今日感恩";
    }

    // Render records (newest first)
    var sorted = records.slice().sort(function (a, b) {
      return b.date > a.date ? 1 : b.date < a.date ? -1 : 0;
    });

    if (sorted.length === 0) {
      elRecords.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-icon">🌱</div>' +
          '<p>还没有记录哦<br>写下今天值得感恩的三件小事吧</p>' +
        '</div>';
      return;
    }

    var html = '<div class="records-list">';
    for (var j = 0; j < sorted.length; j++) {
      var rec = sorted[j];
      var isToday = rec.date === today;
      var dateLabel = formatDate(rec.date) + (isToday ? "  <span style='color:var(--primary);font-size:11px;font-weight:700;'>今天</span>" : "");
      var itemsHtml = "";
      for (var k = 0; k < rec.items.length; k++) {
        var itemText = rec.items[k];
        if (itemText && itemText.trim()) {
          itemsHtml +=
            '<div class="record-item">' +
              '<div class="record-item-num">' + (k + 1) + '</div>' +
              '<div class="record-item-text">' + escapeHtml(itemText) + '</div>' +
            '</div>';
        }
      }
      html +=
        '<div class="record-card" data-date="' + escapeAttr(rec.date) + '">' +
          '<div class="record-top">' +
            '<div class="record-date">📅 ' + dateLabel + '</div>' +
            '<button class="delete-btn" data-delete="' + escapeAttr(rec.date) + '" title="删除这条记录">✕</button>' +
          '</div>' +
          '<div class="record-items">' + itemsHtml + '</div>' +
        '</div>';
    }
    html += '</div>';
    elRecords.innerHTML = html;

    // Bind delete buttons
    var btns = elRecords.querySelectorAll(".delete-btn");
    for (var b = 0; b < btns.length; b++) {
      btns[b].addEventListener("click", handleDelete);
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function escapeAttr(str) {
    return String(str).replace(/"/g, "&quot;");
  }

  /* ── Save ── */
  function handleSave() {
    var v1 = elItem1.value.trim();
    var v2 = elItem2.value.trim();
    var v3 = elItem3.value.trim();

    if (!v1 && !v2 && !v3) {
      showToast("请至少写一件感恩的小事 🌸");
      elItem1.focus();
      return;
    }

    var records = loadRecords();
    var today = todayKey();

    // Remove existing today record if any
    var filtered = [];
    for (var i = 0; i < records.length; i++) {
      if (records[i].date !== today) {
        filtered.push(records[i]);
      }
    }

    filtered.push({
      date: today,
      items: [v1, v2, v3],
      ts: Date.now()
    });

    saveRecords(filtered);
    showToast("已保存，感恩让生活更美好 🌻");
    render();
  }

  /* ── Delete ── */
  function handleDelete(e) {
    var btn = e.currentTarget;
    var dateKey = btn.getAttribute("data-delete");
    var card = btn.closest(".record-card");

    card.classList.add("removing");
    setTimeout(function () {
      var records = loadRecords();
      var filtered = [];
      for (var i = 0; i < records.length; i++) {
        if (records[i].date !== dateKey) {
          filtered.push(records[i]);
        }
      }
      saveRecords(filtered);
      render();
    }, 300);
  }

  /* ── Auto-resize textareas ── */
  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = (el.scrollHeight) + "px";
  }

  function bindAutoResize(el) {
    el.addEventListener("input", function () { autoResize(el); });
  }

  /* ── Init ── */
  function init() {
    // Set today label
    var today = todayKey();
    elTodayLabel.textContent = formatDate(today);

    // Bind auto-resize
    bindAutoResize(elItem1);
    bindAutoResize(elItem2);
    bindAutoResize(elItem3);

    // Bind save
    elSaveBtn.addEventListener("click", handleSave);

    // Keyboard shortcut: Ctrl+Enter to save
    document.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        handleSave();
      }
    });

    // Render
    render();
  }

  init();

}());
</script>
</body>
</html>
