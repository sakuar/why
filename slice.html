<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>切片求和 · 曲线图形的面积与体积</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#070912;color:#e8eef7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  .wrap{width:100%;max-width:1240px;padding:0 18px;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px;}
  .top h1{font-size:18px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,#ffd166,#56b6ff,#b98cff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .top .back{font-size:12px;color:#8090a8;text-decoration:none;border:1px solid #222840;border-radius:8px;padding:6px 11px;}
  .chips{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap;}
  .chip{flex:1;min-width:110px;display:flex;align-items:center;gap:7px;justify-content:center;
    font-size:13px;padding:11px 8px;border-radius:11px;background:#0e1322;border:1px solid #232c44;color:#aab6cc;cursor:pointer;transition:.14s;}
  .chip:hover{border-color:#3a445e;color:#e8eef7;}
  .chip.on{background:#6c63ff;border-color:#6c63ff;color:#fff;font-weight:700;}
  .work{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:stretch;}
  @media(max-width:780px){.work{grid-template-columns:1fr;}}
  #stage{position:relative;min-width:0;}
  canvas{width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 42%,#0e1426,#06070d 80%);
    border:1px solid #1c2236;border-radius:14px;touch-action:none;}
  .controls{background:#0e1322;border:1px solid #232c44;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;}
  .controls .ch{font-size:12px;color:#8090a8;font-weight:600;letter-spacing:1px;margin-bottom:12px;}
  .slider{margin-bottom:14px;}.slider:last-child{margin-bottom:0;}
  .slider .sl-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
  .slider .sl-top .nm{color:#cfd8ea;}
  .slider .sl-top .val{color:#56b6ff;font-weight:700;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#232c44;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;box-shadow:0 0 0 1px #6c63ff;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;}
  .quick{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;}
  .qchip{font-size:13px;padding:7px 12px;border-radius:20px;background:#121829;border:1px solid #232c44;color:#aab6cc;cursor:pointer;flex:1;text-align:center;min-width:48px;}
  .qchip:hover{border-color:#3a445e;color:#e8eef7;}
  .hint{font-size:12px;color:#5a6680;line-height:1.6;border-top:1px solid #1a2138;padding-top:14px;}
  .info{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:780px){.info{grid-template-columns:1fr;}}
  .readout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;grid-column:1 / -1;}
  .readout .cell{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:14px 12px;text-align:center;}
  .readout .cell .k{font-size:11.5px;color:#8090a8;margin-bottom:6px;}
  .readout .cell .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:#56b6ff;}
  .readout .cell.hi .v{color:#ffd166;}
  .readout .cell.ok .v{color:#56d6a8;}
  .readout .cell .u{font-size:11px;color:#5a6680;margin-top:5px;}
  .card{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:16px 18px;}
  .card .ttl{font-size:13px;font-weight:800;color:#ffd166;margin-bottom:9px;}
  .card .eq{font-size:18px;line-height:1.8;color:#e8eef7;font-family:"Cambria Math","Times New Roman",Georgia,serif;}
  .card .eq sup{font-size:62%;}.card .eq .hl{color:#ffd166;font-weight:700;}
  .card .nt{font-size:13.5px;color:#9aa6bd;line-height:1.8;}.card .nt b{color:#cdd6e8;}
  footer{color:#5a6680;font-size:12px;text-align:center;padding:22px 0 36px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🍰 切片求和 · 曲线图形怎么算</h1>
    <a class="back" href="index.html">← 返回</a>
  </div>
  <div class="chips" id="chips"></div>
  <div class="work">
    <div id="stage"><canvas id="cv" width="900" height="560"></canvas></div>
    <div class="controls">
      <div>
        <div class="ch">参数调节</div>
        <div id="params"></div>
        <div class="quick" id="quickN"></div>
      </div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
  <div class="info">
    <div class="readout">
      <div class="cell"><div class="k">切成几片</div><div class="v" id="rN">—</div><div class="u">片越多越准</div></div>
      <div class="cell hi"><div class="k">切片求和</div><div class="v" id="rS">—</div><div class="u">逼近真值</div></div>
      <div class="cell ok"><div class="k">真值</div><div class="v" id="rT">—</div><div class="u" id="rE"></div></div>
    </div>
    <div class="card"><div class="ttl">公式</div><div class="eq" id="eq"></div></div>
    <div class="card"><div class="ttl">怎么来的</div><div class="nt" id="note"></div></div>
  </div>
  <footer>切成无穷薄片，每片当成规则形状，加起来 —— 这就是积分的灵魂</footer>
</div>

<script>
"use strict";
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
var DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
var W=900,H=560;
function fit(){
  var st=document.getElementById("stage");
  var cw=st.clientWidth||900; W=cw; H=Math.round(cw*0.62); if(H<320)H=320;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
var PI=Math.PI;
var Vw={ox:450,oy:280,s:40};
function fitView(x0,x1,y0,y1){
  var p=28, sx=(W-2*p)/(x1-x0), sy=(H-2*p)/(y1-y0), s=Math.min(sx,sy);
  Vw.s=s; Vw.ox=W/2-(x0+x1)/2*s; Vw.oy=H/2+(y0+y1)/2*s;
}
function PX(x){return Vw.ox+x*Vw.s;}
function PY(y){return Vw.oy-y*Vw.s;}
function axes(){
  ctx.strokeStyle="rgba(150,170,210,.30)";ctx.lineWidth=1.1;ctx.beginPath();
  ctx.moveTo(PX(-100),PY(0));ctx.lineTo(PX(100),PY(0));
  ctx.moveTo(PX(0),PY(-100));ctx.lineTo(PX(0),PY(100));ctx.stroke();
}
function rectW(x0,y0,x1,y1,fill,stroke){
  var ax=PX(x0),ay=PY(y0),bx=PX(x1),by=PY(y1);
  ctx.beginPath();ctx.rect(Math.min(ax,bx),Math.min(ay,by),Math.abs(bx-ax),Math.abs(by-ay));
  if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}
}
function curve(fn,x0,x1,col,w){
  ctx.strokeStyle=col;ctx.lineWidth=w||2.5;ctx.beginPath();
  var n=160;for(var i=0;i<=n;i++){var x=x0+(x1-x0)*i/n,y=fn(x),px=PX(x),py=PY(y);if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.stroke();
}
function paramCurve(fx,fy,col,w){
  ctx.strokeStyle=col;ctx.lineWidth=w||2.5;ctx.beginPath();
  var n=180;for(var i=0;i<=n;i++){var t=i/n*2*PI,px=PX(fx(t)),py=PY(fy(t));if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
  ctx.closePath();ctx.stroke();
}
function lblPx(txt,px,py,col,size,align){ctx.fillStyle=col;ctx.font="bold "+(size||13)+"px system-ui";ctx.textAlign=align||"center";ctx.textBaseline="middle";ctx.fillText(txt,px,py);}
var BL="rgba(86,182,255,0.35)",BLs="#56b6ff",YE="#ffd166",GR="#56d6a8",DASH="rgba(255,209,102,0.45)";

var idx=0,P={};

var CONCEPTS=[
{ id:"ellipse", emoji:"🥚", name:"椭圆",
  params:[{k:"N",label:"切成几片 N",min:4,max:120,step:2,def:12},{k:"a",label:"半轴 a",min:2,max:6,step:0.5,def:4},{k:"b",label:"半轴 b",min:1.5,max:4,step:0.5,def:2.5}],
  truth:function(){return PI*P.a*P.b;},
  approx:function(){var s=0,dx=2*P.a/P.N;for(var i=0;i<P.N;i++){var x=-P.a+(i+0.5)*dx,h=2*P.b*Math.sqrt(Math.max(0,1-x*x/(P.a*P.a)));s+=h*dx;}return s;},
  eq:function(){return '面积 = π · a · b = π × '+P.a.toFixed(1)+' × '+P.b.toFixed(1)+' = <span class="hl">'+(PI*P.a*P.b).toFixed(3)+'</span>';},
  hint:"椭圆 = 把圆的 x 拉 a 倍、y 拉 b 倍。也可切竖条累加验证。",
  note:'椭圆就是<b>把圆压扁/拉伸</b>：x 方向拉 a 倍、y 方向拉 b 倍。圆面积 πr²（r=1 时 π），两个方向各乘 a、b，面积就变成 <b>π·a·b</b>。<br>右图把它切成竖条累加，也能逼近同一个值。',
  draw:function(){
    var a=P.a,b=P.b;fitView(-a-0.6,a+0.6,-b-1,b+1);axes();
    var dx=2*a/P.N;
    for(var i=0;i<P.N;i++){var xl=-a+i*dx,xm=xl+dx/2,h=b*Math.sqrt(Math.max(0,1-xm*xm/(a*a)));
      rectW(xl,-h,xl+dx,h,BL,"rgba(255,255,255,.14)");}
    paramCurve(function(t){return a*Math.cos(t);},function(t){return b*Math.sin(t);},BLs,2.5);
    lblPx("a="+a.toFixed(1),PX(a/2),PY(0)+16,"#9aa6bd",12);
    lblPx("b="+b.toFixed(1),PX(0)-16,PY(b/2),"#9aa6bd",12,"right");
  }
},
{ id:"para", emoji:"🅿️", name:"抛物线",
  params:[{k:"N",label:"切成几片 N",min:4,max:120,step:2,def:10},{k:"w",label:"宽度 w",min:2,max:4.5,step:0.5,def:3}],
  truth:function(){return Math.pow(P.w,3)/3;},
  approx:function(){var s=0,dx=P.w/P.N;for(var i=0;i<P.N;i++){var x=(i+0.5)*dx;s+=x*x*dx;}return s;},
  eq:function(){return '面积 = ∫₀ᵂ x² dx = w³⁄3 = '+P.w.toFixed(1)+'³⁄3 = <span class="hl">'+(Math.pow(P.w,3)/3).toFixed(3)+'</span>　(外接矩形的 ⅓)';},
  hint:"抛物线 y=x² 下方的面积，正好是外接矩形 w×w² 的 1/3。",
  note:'抛物线 y = x² 在 [0, w] 下方围出的面积，恰好是<b>外接矩形（w × w²）的 ⅓</b>。<br>切成竖条，每条高 = x²、宽 = dx，加起来 = w³⁄3。<br>（还记得圆锥也是圆柱的 ⅓ 吗？同一种 ⅓。）',
  draw:function(){
    var w=P.w,top=w*w;fitView(-0.6,w+0.6,-top*0.12,top+0.6);axes();
    rectW(0,0,w,top,null,DASH);
    var dx=w/P.N;
    for(var i=0;i<P.N;i++){var xl=i*dx,xm=xl+dx/2,h=xm*xm;rectW(xl,0,xl+dx,h,BL,"rgba(255,255,255,.14)");}
    curve(function(x){return x*x;},0,w,BLs,2.6);
    lblPx("外接矩形 w×w²",PX(w/2),PY(top)-12,YE,12);
    lblPx("w="+w.toFixed(1),PX(w),PY(0)+16,"#9aa6bd",12);
  }
},
{ id:"sphere", emoji:"🔮", name:"球",
  params:[{k:"N",label:"切成几片 N",min:4,max:120,step:2,def:12},{k:"r",label:"半径 r",min:2,max:5,step:0.5,def:3.5}],
  truth:function(){return 4/3*PI*Math.pow(P.r,3);},
  approx:function(){var s=0,dz=2*P.r/P.N;for(var i=0;i<P.N;i++){var z=-P.r+(i+0.5)*dz,rr=P.r*P.r-z*z;s+=PI*Math.max(0,rr)*dz;}return s;},
  eq:function(){return 'V = Σ π(r²−z²)·dz → <span class="hl">4⁄3 π r³</span> = '+(4/3*PI*Math.pow(P.r,3)).toFixed(2);},
  hint:"球横切成一摞圆盘，第 z 层圆盘半径 √(r²−z²)。把所有圆盘体积加起来。",
  note:'把球<b>横切成一摞薄圆盘</b>（侧面看就是一条条横带）。高度 z 处的圆盘半径 = √(r²−z²)，面积 = π(r²−z²)，厚 dz。<br>全部加起来 = <b>4⁄3 π r³</b>。切得越薄越准。',
  draw:function(){
    var r=P.r;fitView(-r-0.6,r+0.6,-r-0.6,r+0.6);
    paramCurve(function(t){return r*Math.cos(t);},function(t){return r*Math.sin(t);},"rgba(120,140,180,.5)",1.4);
    var dz=2*r/P.N;
    for(var i=0;i<P.N;i++){var zl=-r+i*dz,zm=zl+dz/2,rad=Math.sqrt(Math.max(0,r*r-zm*zm));
      rectW(-rad,zl,rad,zl+dz,BL,"rgba(255,255,255,.12)");}
    paramCurve(function(t){return r*Math.cos(t);},function(t){return r*Math.sin(t);},BLs,2.2);
    lblPx("每条横带 = 一个圆盘的侧面",PX(0),PY(r)+14,"#9aa6bd",12);
  }
},
{ id:"cap", emoji:"⛑️", name:"球冠",
  params:[{k:"N",label:"切成几片 N",min:4,max:120,step:2,def:10},{k:"r",label:"球半径 r",min:2.5,max:5,step:0.5,def:3.5},{k:"h",label:"球冠高 h",min:0.5,max:5,step:0.5,def:2.5}],
  truth:function(){var h=Math.min(P.h,2*P.r);return PI*h*h*(P.r-h/3);},
  approx:function(){var r=P.r,h=Math.min(P.h,2*r),s=0,dz=h/P.N;for(var i=0;i<P.N;i++){var z=(r-h)+(i+0.5)*dz,rr=r*r-z*z;s+=PI*Math.max(0,rr)*dz;}return s;},
  eq:function(){var h=Math.min(P.h,2*P.r);return 'V = π h²(r − h⁄3) = π×'+h.toFixed(1)+'²×('+P.r.toFixed(1)+'−'+(h/3).toFixed(2)+') = <span class="hl">'+(PI*h*h*(P.r-h/3)).toFixed(2)+'</span>';},
  hint:"球冠 = 球顶切下的一块。同样用圆盘叠加，只从 z=r−h 累加到 z=r。",
  note:'<b>球冠</b>就是从球顶往下切 h 高度的一块（像切下的西瓜顶）。用<b>同一套圆盘叠加</b>，只是累加范围从 z = r−h 到 z = r。<br>结果 = <b>π h²(r − h⁄3)</b>。当 h = 2r（整个球）时，正好回到 4⁄3πr³。',
  draw:function(){
    var r=P.r,h=Math.min(P.h,2*r);fitView(-r-0.6,r+0.6,-r-0.6,r+0.6);
    paramCurve(function(t){return r*Math.cos(t);},function(t){return r*Math.sin(t);},"rgba(120,140,180,.45)",1.3);
    var dz=h/P.N;
    for(var i=0;i<P.N;i++){var zl=(r-h)+i*dz,zm=zl+dz/2,rad=Math.sqrt(Math.max(0,r*r-zm*zm));
      rectW(-rad,zl,rad,zl+dz,"rgba(86,214,168,0.32)","rgba(255,255,255,.12)");}
    // 切割弦
    var chordR=Math.sqrt(Math.max(0,r*r-(r-h)*(r-h)));
    ctx.strokeStyle=DASH;ctx.lineWidth=1.5;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.moveTo(PX(-chordR),PY(r-h));ctx.lineTo(PX(chordR),PY(r-h));ctx.stroke();ctx.setLineDash([]);
    paramCurve(function(t){return r*Math.cos(t);},function(t){return r*Math.sin(t);},"rgba(86,182,255,.5)",1.6);
    lblPx("球冠高 h="+h.toFixed(1),PX(0),PY(r)+14,GR,12);
  }
}
];

function buildChips(){
  var box=document.getElementById("chips");box.innerHTML="";
  CONCEPTS.forEach(function(c,i){
    var el=document.createElement("div");el.className="chip"+(i===idx?" on":"");
    el.innerHTML='<span>'+c.emoji+'</span>'+c.name;
    el.onclick=function(){idx=i;location.hash=c.id;load();};
    box.appendChild(el);
  });
}
function buildParams(){
  var box=document.getElementById("params");box.innerHTML="";P={};
  CONCEPTS[idx].params.forEach(function(pp){
    P[pp.k]=pp.def;
    var w=document.createElement("div");w.className="slider";
    var disp=pp.k==="N"?pp.def.toFixed(0):pp.def.toFixed(1);
    w.innerHTML='<div class="sl-top"><span class="nm">'+pp.label+'</span><span class="val" id="v_'+pp.k+'">'+disp+'</span></div>'+
      '<input type="range" id="r_'+pp.k+'" min="'+pp.min+'" max="'+pp.max+'" step="'+pp.step+'" value="'+pp.def+'">';
    box.appendChild(w);
    var inp=w.querySelector("input");
    inp.oninput=function(){P[pp.k]=parseFloat(inp.value);document.getElementById("v_"+pp.k).textContent=pp.k==="N"?P[pp.k].toFixed(0):P[pp.k].toFixed(1);draw();};
  });
}
function buildQuick(){
  var box=document.getElementById("quickN");box.innerHTML="";
  [6,16,40,120].forEach(function(n){
    var el=document.createElement("div");el.className="qchip";el.textContent=n+"片";
    el.onclick=function(){P.N=n;var inp=document.getElementById("r_N");if(inp)inp.value=n;document.getElementById("v_N").textContent=n;draw();};
    box.appendChild(el);
  });
}
function draw(){
  ctx.clearRect(0,0,W,H);
  var c=CONCEPTS[idx];c.draw();
  document.getElementById("eq").innerHTML=c.eq();
  document.getElementById("note").innerHTML=c.note;
  document.getElementById("hint").textContent=c.hint;
  var ap=c.approx(),tr=c.truth();
  document.getElementById("rN").textContent=P.N.toFixed(0);
  document.getElementById("rS").textContent=ap.toFixed(3);
  document.getElementById("rT").textContent=tr.toFixed(3);
  document.getElementById("rE").textContent="误差 "+(Math.abs(tr-ap)/tr*100).toFixed(2)+"%";
}
function load(){buildChips();buildParams();buildQuick();draw();}
window.addEventListener("resize",function(){fit();draw();});
(function(){var hs=(location.hash||"").replace("#","");for(var i=0;i<CONCEPTS.length;i++)if(CONCEPTS[i].id===hs)idx=i;})();
fit();load();
</script>
</body>
</html>
