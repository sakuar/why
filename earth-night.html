<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>此刻，地球的夜晚</title>
<style>
  :root { --ink:#e8eef7; --dim:#7d8aa3; --accent:#ffd166; }
  * { box-sizing: border-box; margin:0; padding:0; }
  body {
    background: radial-gradient(ellipse at top, #0b1326 0%, #05070f 70%);
    color: var(--ink);
    font-family: "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding: 28px 16px 60px;
  }
  h1 { font-weight:600; font-size: clamp(22px,4vw,32px); letter-spacing:2px; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:22px; }
  .search { display:flex; gap:8px; width:min(520px,100%); margin-bottom:18px; }
  input {
    flex:1; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.12);
    color:var(--ink); padding:11px 14px; border-radius:10px; font-size:15px; outline:none;
  }
  input:focus { border-color:var(--accent); }
  button {
    background:var(--accent); color:#1a1206; border:none; padding:0 18px; border-radius:10px;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  button:hover { filter:brightness(1.08); }
  .chips { display:flex; flex-wrap:wrap; gap:7px; justify-content:center; width:min(640px,100%); margin-bottom:24px; }
  .chip { font-size:12px; color:var(--dim); border:1px solid rgba(255,255,255,.1);
    padding:5px 11px; border-radius:20px; cursor:pointer; transition:.15s; }
  .chip:hover { color:var(--ink); border-color:var(--accent); }
  .mapwrap { position:relative; width:min(720px,100%); border-radius:14px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.08); }
  canvas { display:block; width:100%; }
  #marker { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; pointer-events:none; }
  #marker::before { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--accent);
    box-shadow:0 0 12px 3px var(--accent); }
  #marker::after { content:""; position:absolute; inset:0; border-radius:50%; border:2px solid var(--accent);
    animation:pulse 1.8s ease-out infinite; }
  @keyframes pulse { 0%{transform:scale(.6);opacity:.9} 100%{transform:scale(2.6);opacity:0} }
  .card { width:min(720px,100%); margin-top:22px; background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:22px 24px; }
  .city { font-size:21px; font-weight:600; }
  .city small { color:var(--dim); font-weight:400; font-size:13px; margin-left:8px; }
  .row { display:flex; gap:26px; flex-wrap:wrap; margin-top:14px; }
  .stat .k { font-size:11px; color:var(--dim); letter-spacing:1px; }
  .stat .v { font-size:24px; font-weight:600; font-variant-numeric:tabular-nums; }
  .poem { margin-top:18px; padding-top:16px; border-top:1px dashed rgba(255,255,255,.12);
    font-size:16px; line-height:1.8; color:#cdd7ea; font-style:italic; }
  .poem .where { color:var(--accent); font-style:normal; }
  .legend { display:flex; gap:18px; font-size:12px; color:var(--dim); margin-top:12px; justify-content:center; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:3px; vertical-align:-1px; margin-right:5px; }
  .back { position:fixed; top:16px; left:18px; color:var(--dim); text-decoration:none; font-size:13px; }
  .back:hover { color:var(--ink); }
</style>
</head>
<body>
<a class="back" href="index.html">← 回到入口</a>
<h1>此刻，地球的夜晚</h1>
<p class="sub">同一个瞬间，有人在迎接黎明，有人正坠入深夜。</p>

<div class="search">
  <input id="q" placeholder="输入一个城市，比如 北京 / Tokyo / Paris…" autocomplete="off">
  <button onclick="go()">看看</button>
</div>
<div class="chips" id="chips"></div>

<div class="mapwrap">
  <canvas id="map" width="720" height="360"></canvas>
  <div id="marker" style="display:none"></div>
</div>
<div class="legend">
  <span><i style="background:#ffe9a8"></i>白昼</span>
  <span><i style="background:#1b2b4d"></i>黑夜</span>
  <span><i style="background:var(--accent)"></i>你选的城市</span>
</div>

<div class="card" id="card" style="display:none"></div>

<script>
// —— 城市库：名称(含别名) / 纬度 / 经度 / UTC偏移(小时) ——
const CITIES = [
  {n:"北京",a:["beijing"],lat:39.9,lon:116.4,tz:8},
  {n:"上海",a:["shanghai"],lat:31.2,lon:121.5,tz:8},
  {n:"东京",a:["tokyo","tokyo"],lat:35.7,lon:139.7,tz:9},
  {n:"首尔",a:["seoul"],lat:37.6,lon:127.0,tz:9},
  {n:"新加坡",a:["singapore"],lat:1.35,lon:103.8,tz:8},
  {n:"曼谷",a:["bangkok"],lat:13.8,lon:100.5,tz:7},
  {n:"新德里",a:["delhi","new delhi"],lat:28.6,lon:77.2,tz:5.5},
  {n:"迪拜",a:["dubai"],lat:25.2,lon:55.3,tz:4},
  {n:"莫斯科",a:["moscow"],lat:55.8,lon:37.6,tz:3},
  {n:"伊斯坦布尔",a:["istanbul"],lat:41.0,lon:28.9,tz:3},
  {n:"开罗",a:["cairo"],lat:30.0,lon:31.2,tz:2},
  {n:"雅典",a:["athens"],lat:38.0,lon:23.7,tz:3},
  {n:"罗马",a:["rome"],lat:41.9,lon:12.5,tz:2},
  {n:"巴黎",a:["paris"],lat:48.9,lon:2.35,tz:2},
  {n:"柏林",a:["berlin"],lat:52.5,lon:13.4,tz:2},
  {n:"伦敦",a:["london"],lat:51.5,lon:-0.13,tz:1},
  {n:"里斯本",a:["lisbon"],lat:38.7,lon:-9.14,tz:1},
  {n:"雷克雅未克",a:["reykjavik"],lat:64.1,lon:-21.9,tz:0},
  {n:"纽约",a:["new york","newyork","nyc"],lat:40.7,lon:-74.0,tz:-4},
  {n:"多伦多",a:["toronto"],lat:43.7,lon:-79.4,tz:-4},
  {n:"芝加哥",a:["chicago"],lat:41.9,lon:-87.6,tz:-5},
  {n:"墨西哥城",a:["mexico city","mexico"],lat:19.4,lon:-99.1,tz:-6},
  {n:"洛杉矶",a:["los angeles","la"],lat:34.1,lon:-118.2,tz:-7},
  {n:"旧金山",a:["san francisco","sf"],lat:37.8,lon:-122.4,tz:-7},
  {n:"温哥华",a:["vancouver"],lat:49.3,lon:-123.1,tz:-7},
  {n:"圣保罗",a:["sao paulo","são paulo"],lat:-23.6,lon:-46.6,tz:-3},
  {n:"布宜诺斯艾利斯",a:["buenos aires"],lat:-34.6,lon:-58.4,tz:-3},
  {n:"开普敦",a:["cape town"],lat:-33.9,lon:18.4,tz:2},
  {n:"内罗毕",a:["nairobi"],lat:-1.29,lon:36.8,tz:3},
  {n:"悉尼",a:["sydney"],lat:-33.9,lon:151.2,tz:10},
  {n:"墨尔本",a:["melbourne"],lat:-37.8,lon:145.0,tz:10},
  {n:"奥克兰",a:["auckland"],lat:-36.8,lon:174.8,tz:12},
  {n:"火奴鲁鲁",a:["honolulu","hawaii"],lat:21.3,lon:-157.9,tz:-10},
  {n:"广州",a:["guangzhou"],lat:23.1,lon:113.3,tz:8},
  {n:"成都",a:["chengdu"],lat:30.6,lon:104.1,tz:8},
  {n:"台北",a:["taipei"],lat:25.0,lon:121.6,tz:8},
  {n:"香港",a:["hong kong","hongkong"],lat:22.3,lon:114.2,tz:8},
];

// 推荐 chips
const chips = document.getElementById('chips');
["北京","东京","巴黎","纽约","悉尼","雷克雅未克","火奴鲁鲁","开普敦"].forEach(name=>{
  const c=document.createElement('span'); c.className='chip'; c.textContent=name;
  c.onclick=()=>{document.getElementById('q').value=name; go();};
  chips.appendChild(c);
});

// —— 天文：太阳直射点 ——
function subsolar(date){
  // 年内天数
  const start=new Date(date.getUTCFullYear(),0,0);
  const day=Math.floor((date-start)/86400000);
  // 太阳赤纬（近似）
  const decl = -23.44*Math.cos((2*Math.PI/365)*(day+10));
  // UTC 小数小时
  const h = date.getUTCHours()+date.getUTCMinutes()/60+date.getUTCSeconds()/3600;
  // 直射点经度：UTC 正午时在 0°，向西移动
  let lon = -(h-12)*15;
  while(lon>180)lon-=360; while(lon<-180)lon+=360;
  return {lat:decl, lon};
}
function solarAltitude(lat,lon,ss){
  const d2r=Math.PI/180;
  const H=(lon-ss.lon)*d2r;
  return Math.asin(
    Math.sin(lat*d2r)*Math.sin(ss.lat*d2r) +
    Math.cos(lat*d2r)*Math.cos(ss.lat*d2r)*Math.cos(H)
  )/d2r;
}

// —— 绘制昼夜地图 ——
const cv=document.getElementById('map'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height;
function lonToX(lon){return (lon+180)/360*W;}
function latToY(lat){return (90-lat)/180*H;}

function draw(ss){
  const img=ctx.createImageData(W,H);
  for(let y=0;y<H;y++){
    const lat=90-(y/H)*180;
    for(let x=0;x<W;x++){
      const lon=(x/W)*360-180;
      const alt=solarAltitude(lat,lon,ss);
      let r,g,b;
      if(alt>0){           // 白昼
        const t=Math.min(1,alt/45);
        r=120+135*t; g=160+95*t; b=190+40*t;
      } else if(alt>-6){   // 民用曙暮光
        const t=(alt+6)/6;
        r=70+50*t; g=80+60*t; b=110+70*t;
      } else {             // 黑夜
        r=18; g=28; b=52;
      }
      const i=(y*W+x)*4;
      img.data[i]=r; img.data[i+1]=g; img.data[i+2]=b; img.data[i+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  // 经纬网格
  ctx.strokeStyle='rgba(255,255,255,.06)'; ctx.lineWidth=1;
  for(let lon=-180;lon<=180;lon+=30){ctx.beginPath();ctx.moveTo(lonToX(lon),0);ctx.lineTo(lonToX(lon),H);ctx.stroke();}
  for(let lat=-60;lat<=60;lat+=30){ctx.beginPath();ctx.moveTo(0,latToY(lat));ctx.lineTo(W,latToY(lat));ctx.stroke();}
  // 直射点（太阳）
  ctx.fillStyle='rgba(255,221,102,.9)';
  ctx.beginPath();ctx.arc(lonToX(ss.lon),latToY(ss.lat),5,0,7);ctx.fill();
  // 所有城市暗点
  ctx.fillStyle='rgba(255,255,255,.45)';
  CITIES.forEach(c=>{ctx.beginPath();ctx.arc(lonToX(c.lon),latToY(c.lat),1.6,0,7);ctx.fill();});
}

// —— 诗句 / 心情：按当地时段 ——
function localHour(c,now){
  let h=now.getUTCHours()+now.getUTCMinutes()/60+c.tz;
  while(h<0)h+=24; while(h>=24)h-=24; return h;
}
function period(h){
  if(h<5) return {name:"深夜",poem:"整座城市睡着了，只有路灯还醒着。"};
  if(h<7) return {name:"黎明",poem:"天边刚裂开一道缝，光正从那里渗进来。"};
  if(h<11) return {name:"清晨",poem:"咖啡的热气、第一班地铁、新的一天还没来得及犯错。"};
  if(h<13) return {name:"正午",poem:"影子缩到了脚下，时间像被晒得发烫。"};
  if(h<17) return {name:"午后",poem:"阳光斜斜地铺在桌上，困意和阳光一起来了。"};
  if(h<19) return {name:"黄昏",poem:"天空把一天攒下的颜色，全在这一刻还给世界。"};
  if(h<23) return {name:"夜晚",poem:"窗户一扇扇亮起来，每一盏灯后面都有一个故事。"};
  return {name:"午夜",poem:"日期刚刚翻篇，而你还在这里，挺好。"};
}

let timer=null, current=null;
function find(q){
  q=q.trim().toLowerCase();
  return CITIES.find(c=>c.n===q || c.a.some(x=>x===q) || c.n.includes(q) || c.a.some(x=>x.includes(q)));
}
function go(){
  const c=find(document.getElementById('q').value);
  if(!c){ alert("这个城市还不在小小的城市库里，试试列表里的名字～"); return; }
  current=c;
  if(timer)clearInterval(timer);
  tick(); timer=setInterval(tick,1000);
}
function tick(){
  const now=new Date();
  const ss=subsolar(now);
  draw(ss);
  const c=current;
  // marker
  const wrap=document.querySelector('.mapwrap');
  const scale=wrap.clientWidth/W;
  const m=document.getElementById('marker');
  m.style.display='block';
  m.style.left=(lonToX(c.lon)*scale)+'px';
  m.style.top=(latToY(c.lat)*scale)+'px';
  // 当地时间 & 昼夜
  const h=localHour(c,now);
  const hh=Math.floor(h), mm=Math.floor((h-hh)*60), ss2=Math.floor(((h-hh)*60-mm)*60);
  const alt=solarAltitude(c.lat,c.lon,ss);
  const isDay=alt>-0.83;
  const pd=period(h);
  const card=document.getElementById('card');
  card.style.display='block';
  card.innerHTML=`
    <div class="city">${c.n}<small>${isDay?'☀ 此刻是白昼':'🌙 此刻是夜晚'} · ${pd.name}</small></div>
    <div class="row">
      <div class="stat"><div class="k">当地时间</div><div class="v">${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:${String(ss2).padStart(2,'0')}</div></div>
      <div class="stat"><div class="k">太阳高度角</div><div class="v">${alt.toFixed(1)}°</div></div>
      <div class="stat"><div class="k">时区</div><div class="v">UTC${c.tz>=0?'+':''}${c.tz}</div></div>
    </div>
    <div class="poem">在 <span class="where">${c.n}</span> 的此刻——${pd.poem}</div>
  `;
}

// 回车搜索
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')go();});
// 默认先画一张当前昼夜图
draw(subsolar(new Date()));
</script>
</body>
</html>
