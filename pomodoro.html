<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>番茄钟</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --card: #0f3460;
    --accent: #e94560;
    --accent2: #4ecdc4;
    --text: #eaeaea;
    --text-muted: #8892a4;
    --radius: 20px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
  }

  .back-link {
    position: fixed;
    top: 16px;
    left: 16px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    opacity: 0.7;
    transition: opacity var(--transition);
    z-index: 10;
  }
  .back-link:hover { opacity: 1; }

  .container {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }

  .header {
    text-align: center;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .mode-tabs {
    display: flex;
    background: var(--surface);
    border-radius: 50px;
    padding: 4px;
    gap: 4px;
  }
  .mode-tab {
    padding: 8px 20px;
    border-radius: 50px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
  }
  .mode-tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
  }
  .mode-tab.active.break {
    background: var(--accent2);
    box-shadow: 0 4px 15px rgba(78, 205, 196, 0.4);
  }

  .clock-card {
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 40px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    position: relative;
    overflow: hidden;
  }
  .clock-card::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 50% 50%, rgba(233, 69, 96, 0.05) 0%, transparent 60%);
    pointer-events: none;
    transition: background var(--transition);
  }
  .clock-card.break-mode::before {
    background: radial-gradient(circle at 50% 50%, rgba(78, 205, 196, 0.05) 0%, transparent 60%);
  }

  .ring-container {
    position: relative;
    width: 220px;
    height: 220px;
  }

  .ring-svg {
    width: 220px;
    height: 220px;
    transform: rotate(-90deg);
  }

  .ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 6;
  }

  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 628;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear, stroke 0.5s ease;
    filter: drop-shadow(0 0 6px rgba(233, 69, 96, 0.6));
  }
  .ring-progress.break {
    stroke: var(--accent2);
    filter: drop-shadow(0 0 6px rgba(78, 205, 196, 0.6));
  }

  .time-display {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }

  .time-text {
    font-size: 56px;
    font-weight: 300;
    letter-spacing: 4px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    transition: color var(--transition);
  }

  .mode-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .controls {
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .btn {
    border: none;
    cursor: pointer;
    border-radius: 50px;
    font-weight: 600;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:active { transform: scale(0.95); }

  .btn-primary {
    padding: 14px 40px;
    font-size: 16px;
    background: linear-gradient(135deg, var(--accent), #c0392b);
    color: #fff;
    box-shadow: 0 8px 25px rgba(233, 69, 96, 0.4);
  }
  .btn-primary:hover {
    box-shadow: 0 12px 30px rgba(233, 69, 96, 0.55);
    transform: translateY(-2px);
  }
  .btn-primary.break-btn {
    background: linear-gradient(135deg, var(--accent2), #38b2ac);
    box-shadow: 0 8px 25px rgba(78, 205, 196, 0.4);
  }
  .btn-primary.break-btn:hover {
    box-shadow: 0 12px 30px rgba(78, 205, 196, 0.55);
  }

  .btn-secondary {
    width: 48px;
    height: 48px;
    font-size: 18px;
    background: var(--card);
    color: var(--text-muted);
  }
  .btn-secondary:hover {
    color: var(--text);
    background: rgba(255,255,255,0.1);
  }

  .stats-card {
    width: 100%;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
  }

  .stats-left { display: flex; flex-direction: column; gap: 2px; }
  .stats-label { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; }
  .stats-value {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tomatoes {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
    max-width: 160px;
  }
  .tomato-icon {
    font-size: 22px;
    animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .notify-bar {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #c0392b);
    border-radius: 12px;
    padding: 14px 20px;
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 1px;
    display: none;
    box-shadow: 0 8px 25px rgba(233, 69, 96, 0.4);
  }
  .notify-bar.show { display: block; }
  .notify-bar.break-notify {
    background: linear-gradient(135deg, var(--accent2), #38b2ac);
    box-shadow: 0 8px 25px rgba(78, 205, 196, 0.4);
  }

  @keyframes flash {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .flashing { animation: flash 0.6s ease-in-out infinite; }

  @media (max-width: 480px) {
    .time-text { font-size: 48px; }
    .ring-container { width: 190px; height: 190px; }
    .ring-svg { width: 190px; height: 190px; }
    .clock-card { padding: 30px 20px; }
  }
</style>
</head>
<body>
<a href="index.html" class="back-link">← 入口</a>

<div class="container">
  <div class="header">
    <h1>番茄钟</h1>
  </div>

  <div class="mode-tabs">
    <button class="mode-tab active" id="tabFocus">专注</button>
    <button class="mode-tab" id="tabBreak">休息</button>
  </div>

  <div class="clock-card" id="clockCard">
    <div class="ring-container">
      <svg class="ring-svg" viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="100"/>
        <circle class="ring-progress" id="ringProgress" cx="110" cy="110" r="100"/>
      </svg>
      <div class="time-display">
        <div class="time-text" id="timeText">25:00</div>
        <div class="mode-label" id="modeLabel">专注时间</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" id="btnReset" title="重置">↺</button>
      <button class="btn btn-primary" id="btnStart">▶ 开始</button>
      <button class="btn btn-secondary" id="btnSkip" title="跳过">⏭</button>
    </div>
  </div>

  <div class="notify-bar" id="notifyBar"></div>

  <div class="stats-card">
    <div class="stats-left">
      <div class="stats-label">今日完成</div>
      <div class="stats-value" id="countText">0 个番茄</div>
    </div>
    <div class="tomatoes" id="tomatoesDisplay"></div>
  </div>
</div>

<script>
(function() {
  "use strict";

  // --- Constants ---
  var FOCUS_DURATION = 25 * 60;
  var BREAK_DURATION = 5 * 60;
  var CIRCUMFERENCE = 2 * Math.PI * 100; // ~628.3

  // --- State ---
  var currentMode = "focus"; // "focus" | "break"
  var timeLeft = FOCUS_DURATION;
  var totalTime = FOCUS_DURATION;
  var isRunning = false;
  var timerId = null;
  var completedToday = 0;
  var flashInterval = null;

  // --- DOM refs ---
  var clockCard = document.getElementById("clockCard");
  var timeText = document.getElementById("timeText");
  var modeLabel = document.getElementById("modeLabel");
  var ringProgress = document.getElementById("ringProgress");
  var btnStart = document.getElementById("btnStart");
  var btnReset = document.getElementById("btnReset");
  var btnSkip = document.getElementById("btnSkip");
  var tabFocus = document.getElementById("tabFocus");
  var tabBreak = document.getElementById("tabBreak");
  var notifyBar = document.getElementById("notifyBar");
  var countText = document.getElementById("countText");
  var tomatoesDisplay = document.getElementById("tomatoesDisplay");

  // --- LocalStorage helpers ---
  function getTodayKey() {
    var d = new Date();
    return "pomodoro_" + d.getFullYear() + "_" + (d.getMonth() + 1) + "_" + d.getDate();
  }

  function loadCount() {
    var val = localStorage.getItem(getTodayKey());
    return val ? parseInt(val, 10) : 0;
  }

  function saveCount(n) {
    localStorage.setItem(getTodayKey(), String(n));
  }

  // --- Format time ---
  function formatTime(seconds) {
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }

  // --- Ring progress ---
  function updateRing() {
    var progress = timeLeft / totalTime;
    var offset = CIRCUMFERENCE * (1 - progress);
    ringProgress.style.strokeDashoffset = offset;
    ringProgress.style.strokeDasharray = CIRCUMFERENCE;
  }

  // --- UI sync ---
  function syncUI() {
    timeText.textContent = formatTime(timeLeft);
    updateRing();

    var isFocus = currentMode === "focus";

    // Card style
    if (isFocus) {
      clockCard.classList.remove("break-mode");
      ringProgress.classList.remove("break");
    } else {
      clockCard.classList.add("break-mode");
      ringProgress.classList.add("break");
    }

    // Mode label
    modeLabel.textContent = isFocus ? "专注时间" : "休息时间";

    // Tabs
    tabFocus.classList.toggle("active", isFocus);
    tabFocus.classList.remove("break");
    tabBreak.classList.toggle("active", !isFocus);
    if (!isFocus) tabBreak.classList.add("break");
    else tabBreak.classList.remove("break");

    // Start button
    if (isRunning) {
      btnStart.textContent = "⏸ 暂停";
    } else {
      btnStart.textContent = "▶ 开始";
    }

    if (isFocus) {
      btnStart.classList.remove("break-btn");
    } else {
      btnStart.classList.add("break-btn");
    }
  }

  // --- Tomatoes display ---
  function renderTomatoes() {
    countText.textContent = completedToday + " 个番茄";
    tomatoesDisplay.innerHTML = "";
    var show = Math.min(completedToday, 8);
    for (var i = 0; i < show; i++) {
      var span = document.createElement("span");
      span.className = "tomato-icon";
      span.textContent = "🍅";
      tomatoesDisplay.appendChild(span);
    }
    if (completedToday > 8) {
      var extra = document.createElement("span");
      extra.className = "tomato-icon";
      extra.style.fontSize = "14px";
      extra.textContent = "+" + (completedToday - 8);
      tomatoesDisplay.appendChild(extra);
    }
  }

  // --- Notify ---
  function showNotify(msg, isBreak) {
    notifyBar.textContent = msg;
    notifyBar.classList.add("show");
    if (isBreak) {
      notifyBar.classList.add("break-notify");
    } else {
      notifyBar.classList.remove("break-notify");
    }

    // Flash the time display
    if (flashInterval) clearInterval(flashInterval);
    var flashCount = 0;
    timeText.classList.add("flashing");
    flashInterval = setInterval(function() {
      flashCount++;
      if (flashCount >= 6) {
        clearInterval(flashInterval);
        flashInterval = null;
        timeText.classList.remove("flashing");
      }
    }, 600);

    setTimeout(function() {
      notifyBar.classList.remove("show");
    }, 5000);
  }

  // --- Timer tick ---
  function tick() {
    if (timeLeft <= 0) {
      stopTimer();
      onPhaseComplete();
      return;
    }
    timeLeft--;
    syncUI();
  }

  function startTimer() {
    if (timerId !== null) return;
    timerId = setInterval(tick, 1000);
    isRunning = true;
    syncUI();
  }

  function stopTimer() {
    if (timerId !== null) {
      clearInterval(timerId);
      timerId = null;
    }
    isRunning = false;
    syncUI();
  }

  function onPhaseComplete() {
    if (currentMode === "focus") {
      completedToday++;
      saveCount(completedToday);
      renderTomatoes();
      showNotify("专注完成！休息一下吧 🎉", false);
      switchMode("break");
    } else {
      showNotify("休息结束，继续专注！💪", true);
      switchMode("focus");
    }
  }

  function switchMode(mode) {
    currentMode = mode;
    timeLeft = mode === "focus" ? FOCUS_DURATION : BREAK_DURATION;
    totalTime = timeLeft;
    isRunning = false;
    if (timerId !== null) {
      clearInterval(timerId);
      timerId = null;
    }
    syncUI();
  }

  // --- Button handlers ---
  btnStart.addEventListener("click", function() {
    if (isRunning) {
      stopTimer();
    } else {
      startTimer();
    }
  });

  btnReset.addEventListener("click", function() {
    stopTimer();
    timeLeft = currentMode === "focus" ? FOCUS_DURATION : BREAK_DURATION;
    totalTime = timeLeft;
    notifyBar.classList.remove("show");
    syncUI();
  });

  btnSkip.addEventListener("click", function() {
    stopTimer();
    var nextMode = currentMode === "focus" ? "break" : "focus";
    switchMode(nextMode);
  });

  tabFocus.addEventListener("click", function() {
    if (currentMode === "focus") return;
    stopTimer();
    switchMode("focus");
  });

  tabBreak.addEventListener("click", function() {
    if (currentMode === "break") return;
    stopTimer();
    switchMode("break");
  });

  // --- Init ---
  completedToday = loadCount();
  renderTomatoes();
  syncUI();

})();
</script>
</body>
</html>
