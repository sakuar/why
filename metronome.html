<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>节拍器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --beat: #f5c842;
    --text: #e8eaf0;
    --text-sub: #8890a4;
    --radius: 16px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    color: var(--text-sub);
    text-decoration: none;
    font-size: 13px;
    opacity: 0.7;
    transition: opacity 0.2s;
    z-index: 100;
  }
  .back-link:hover { opacity: 1; }

  .app {
    width: 100%;
    max-width: 420px;
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--text);
  }

  /* BPM Display */
  .bpm-section {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 28px 24px 24px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .bpm-display {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .bpm-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid var(--surface2);
    background: var(--surface2);
    color: var(--text);
    font-size: 22px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .bpm-btn:hover { background: var(--accent); border-color: var(--accent); }
  .bpm-btn:active { transform: scale(0.92); }

  .bpm-number {
    font-size: 72px;
    font-weight: 800;
    line-height: 1;
    color: var(--accent);
    min-width: 140px;
    text-align: center;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
  }

  .bpm-label {
    font-size: 13px;
    color: var(--text-sub);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* Slider */
  .bpm-slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 3px;
    background: var(--surface2);
    outline: none;
    cursor: pointer;
  }
  .bpm-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 0 4px rgba(108,99,255,0.25);
    transition: box-shadow 0.2s;
  }
  .bpm-slider::-webkit-slider-thumb:hover {
    box-shadow: 0 0 0 7px rgba(108,99,255,0.3);
  }
  .bpm-slider::-moz-range-thumb {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    border: none;
  }

  .bpm-range-labels {
    width: 100%;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-sub);
    margin-top: -8px;
  }

  /* Beat indicators */
  .beat-section {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .beat-lights {
    display: flex;
    gap: 14px;
    justify-content: center;
  }

  .beat-light {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--surface2);
    border: 2px solid transparent;
    transition: background 0.05s, box-shadow 0.05s, border-color 0.05s;
    position: relative;
  }
  .beat-light.active-accent {
    background: var(--accent2);
    border-color: rgba(255,101,132,0.5);
    box-shadow: 0 0 18px rgba(255,101,132,0.7);
  }
  .beat-light.active-normal {
    background: var(--beat);
    border-color: rgba(245,200,66,0.5);
    box-shadow: 0 0 14px rgba(245,200,66,0.6);
  }

  /* Time signature */
  .time-sig-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .time-sig-label {
    font-size: 13px;
    color: var(--text-sub);
    margin-right: 4px;
  }

  .sig-btn {
    padding: 7px 16px;
    border-radius: 20px;
    border: 2px solid var(--surface2);
    background: var(--surface2);
    color: var(--text-sub);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .sig-btn:hover { border-color: var(--accent); color: var(--text); }
  .sig-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    justify-content: center;
  }

  .btn-start {
    flex: 1;
    max-width: 180px;
    height: 56px;
    border-radius: 28px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
    box-shadow: 0 4px 16px rgba(108,99,255,0.4);
    letter-spacing: 0.05em;
  }
  .btn-start:hover {
    background: #7d75ff;
    box-shadow: 0 6px 24px rgba(108,99,255,0.55);
  }
  .btn-start:active { transform: scale(0.96); }
  .btn-start.running {
    background: var(--accent2);
    box-shadow: 0 4px 16px rgba(255,101,132,0.4);
  }
  .btn-start.running:hover {
    background: #ff7a96;
    box-shadow: 0 6px 24px rgba(255,101,132,0.55);
  }

  .btn-tap {
    flex: 1;
    max-width: 140px;
    height: 56px;
    border-radius: 28px;
    border: 2px solid var(--surface2);
    background: var(--surface2);
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.1s;
  }
  .btn-tap:hover { border-color: var(--beat); color: var(--beat); }
  .btn-tap:active {
    transform: scale(0.95);
    background: rgba(245,200,66,0.12);
    border-color: var(--beat);
    color: var(--beat);
  }

  /* Tempo label */
  .tempo-name {
    text-align: center;
    font-size: 13px;
    color: var(--text-sub);
    letter-spacing: 0.08em;
    height: 18px;
  }

  /* Pulse animation for body during beat */
  @keyframes beatPulse {
    0% { transform: scale(1); }
    30% { transform: scale(1.04); }
    100% { transform: scale(1); }
  }
  .beat-light.pulse {
    animation: beatPulse 0.12s ease-out;
  }

  @media (max-width: 400px) {
    .bpm-number { font-size: 58px; min-width: 110px; }
    .beat-light { width: 44px; height: 44px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="app">
  <h1>节拍器</h1>

  <div class="bpm-section">
    <div class="bpm-display">
      <button class="bpm-btn" id="bpmMinus">−</button>
      <div>
        <div class="bpm-number" id="bpmDisplay">120</div>
        <div class="bpm-label" style="text-align:center">BPM</div>
      </div>
      <button class="bpm-btn" id="bpmPlus">+</button>
    </div>
    <div class="tempo-name" id="tempoName">中板 Moderato</div>
    <input type="range" class="bpm-slider" id="bpmSlider" min="40" max="240" value="120">
    <div class="bpm-range-labels"><span>40</span><span>240</span></div>
  </div>

  <div class="beat-section">
    <div class="beat-lights" id="beatLights"></div>
    <div class="time-sig-row">
      <span class="time-sig-label">拍号</span>
      <button class="sig-btn" data-sig="2">2/4</button>
      <button class="sig-btn active" data-sig="4">4/4</button>
      <button class="sig-btn" data-sig="3">3/4</button>
    </div>
  </div>

  <div class="controls">
    <button class="btn-start" id="startBtn">开始</button>
    <button class="btn-tap" id="tapBtn">Tap 测速</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ── 常量 ── */
  var STORAGE_KEY = "metronome_v1";
  var MIN_BPM = 40;
  var MAX_BPM = 240;
  var TAP_TIMEOUT = 2500;

  /* ── 状态变量 ── */
  var bpm = 120;
  var beatsPerMeasure = 4;
  var isRunning = false;
  var currentBeat = 0;
  var schedulerTimer = null;
  var nextNoteTime = 0.0;
  var audioCtx = null;

  var tapTimes = [];
  var tapTimeoutHandle = null;

  /* ── DOM refs ── */
  var bpmDisplay = document.getElementById("bpmDisplay");
  var bpmSlider = document.getElementById("bpmSlider");
  var tempoName = document.getElementById("tempoName");
  var beatLightsContainer = document.getElementById("beatLights");
  var startBtn = document.getElementById("startBtn");
  var tapBtn = document.getElementById("tapBtn");
  var bpmMinus = document.getElementById("bpmMinus");
  var bpmPlus = document.getElementById("bpmPlus");
  var sigButtons = document.querySelectorAll(".sig-btn");

  /* ── Tempo 名称映射 ── */
  var TEMPO_MARKS = [
    [40,  60,  "最缓板 Larghissimo"],
    [60,  66,  "缓板 Largo"],
    [66,  76,  "庄板 Grave"],
    [76,  108, "行板 Andante"],
    [108, 120, "小行板 Andantino"],
    [120, 132, "中板 Moderato"],
    [132, 156, "小快板 Allegretto"],
    [156, 176, "快板 Allegro"],
    [176, 200, "甚快板 Vivace"],
    [200, 212, "急板 Presto"],
    [212, 241, "最急板 Prestissimo"]
  ];

  function getTempoName(b) {
    for (var i = 0; i < TEMPO_MARKS.length; i++) {
      if (b >= TEMPO_MARKS[i][0] && b < TEMPO_MARKS[i][1]) {
        return TEMPO_MARKS[i][2];
      }
    }
    return "";
  }

  /* ── Audio ── */
  function ensureAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function scheduleClick(time, isAccent) {
    var osc = audioCtx.createOscillator();
    var gainNode = audioCtx.createGain();

    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    if (isAccent) {
      osc.frequency.setValueAtTime(1200, time);
      gainNode.gain.setValueAtTime(0.0, time);
      gainNode.gain.linearRampToValueAtTime(0.9, time + 0.002);
      gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.06);
    } else {
      osc.frequency.setValueAtTime(800, time);
      gainNode.gain.setValueAtTime(0.0, time);
      gainNode.gain.linearRampToValueAtTime(0.5, time + 0.002);
      gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
    }

    osc.start(time);
    osc.stop(time + 0.1);
  }

  var SCHEDULE_AHEAD = 0.1;
  var SCHEDULER_INTERVAL = 25;

  function scheduler() {
    while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD) {
      var beat = currentBeat;
      var noteTime = nextNoteTime;

      scheduleClick(noteTime, beat === 0);

      var delayMs = (noteTime - audioCtx.currentTime) * 1000;
      if (delayMs < 0) delayMs = 0;
      (function (b, d) {
        setTimeout(function () {
          if (isRunning) flashBeat(b);
        }, d);
      })(beat, delayMs);

      currentBeat = (currentBeat + 1) % beatsPerMeasure;
      nextNoteTime += 60.0 / bpm;
    }
    schedulerTimer = setTimeout(scheduler, SCHEDULER_INTERVAL);
  }

  /* ── Beat lights ── */
  function buildBeatLights() {
    beatLightsContainer.innerHTML = "";
    for (var i = 0; i < beatsPerMeasure; i++) {
      var el = document.createElement("div");
      el.className = "beat-light";
      el.dataset.idx = i;
      beatLightsContainer.appendChild(el);
    }
  }

  function flashBeat(beatIdx) {
    var lights = beatLightsContainer.querySelectorAll(".beat-light");
    lights.forEach(function (el, i) {
      el.classList.remove("active-accent", "active-normal", "pulse");
      if (i === beatIdx) {
        el.classList.add(beatIdx === 0 ? "active-accent" : "active-normal");
        el.classList.add("pulse");
      }
    });
    setTimeout(function () {
      var tgt = beatLightsContainer.querySelector('[data-idx="' + beatIdx + '"]');
      if (tgt) {
        tgt.classList.remove("active-accent", "active-normal");
      }
    }, Math.min(200, (60000 / bpm) * 0.5));
  }

  /* ── Start / Stop ── */
  function startMetronome() {
    ensureAudioCtx();
    isRunning = true;
    currentBeat = 0;
    nextNoteTime = audioCtx.currentTime + 0.05;
    scheduler();
    startBtn.textContent = "停止";
    startBtn.classList.add("running");
  }

  function stopMetronome() {
    isRunning = false;
    if (schedulerTimer !== null) {
      clearTimeout(schedulerTimer);
      schedulerTimer = null;
    }
    startBtn.textContent = "开始";
    startBtn.classList.remove("running");
    var lights = beatLightsContainer.querySelectorAll(".beat-light");
    lights.forEach(function (el) {
      el.classList.remove("active-accent", "active-normal", "pulse");
    });
  }

  /* ── BPM update ── */
  function setBpm(val) {
    bpm = Math.max(MIN_BPM, Math.min(MAX_BPM, val));
    bpmDisplay.textContent = bpm;
    bpmSlider.value = bpm;
    tempoName.textContent = getTempoName(bpm);
    saveSettings();
  }

  /* ── Time signature ── */
  function setTimeSig(beats) {
    beatsPerMeasure = beats;
    sigButtons.forEach(function (btn) {
      btn.classList.toggle("active", parseInt(btn.dataset.sig, 10) === beats);
    });
    buildBeatLights();
    if (isRunning) {
      stopMetronome();
      startMetronome();
    }
    saveSettings();
  }

  /* ── Tap tempo ── */
  function handleTap() {
    var now = performance.now();

    if (tapTimeoutHandle !== null) {
      clearTimeout(tapTimeoutHandle);
    }
    tapTimeoutHandle = setTimeout(function () {
      tapTimes = [];
    }, TAP_TIMEOUT);

    tapTimes.push(now);
    if (tapTimes.length > 8) tapTimes.shift();

    if (tapTimes.length >= 2) {
      var intervals = [];
      for (var i = 1; i < tapTimes.length; i++) {
        intervals.push(tapTimes[i] - tapTimes[i - 1]);
      }
      var avg = intervals.reduce(function (a, b) { return a + b; }, 0) / intervals.length;
      var tapped = Math.round(60000 / avg);
      setBpm(tapped);
    }
  }

  /* ── Persistence ── */
  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ bpm: bpm, sig: beatsPerMeasure }));
    } catch (e) {}
  }

  function loadSettings() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var data = JSON.parse(raw);
        if (data.bpm) bpm = Math.max(MIN_BPM, Math.min(MAX_BPM, data.bpm));
        if (data.sig && [2, 3, 4].indexOf(data.sig) !== -1) beatsPerMeasure = data.sig;
      }
    } catch (e) {}
  }

  /* ── Event listeners ── */
  startBtn.addEventListener("click", function () {
    if (isRunning) {
      stopMetronome();
    } else {
      startMetronome();
    }
  });

  tapBtn.addEventListener("click", handleTap);

  bpmMinus.addEventListener("click", function () { setBpm(bpm - 1); });
  bpmPlus.addEventListener("click", function () { setBpm(bpm + 1); });

  bpmSlider.addEventListener("input", function () {
    setBpm(parseInt(this.value, 10));
  });

  sigButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      setTimeSig(parseInt(this.dataset.sig, 10));
    });
  });

  /* Long press for bpm buttons */
  function setupLongPress(btn, delta) {
    var timer = null;
    var fastTimer = null;

    function start() {
      setBpm(bpm + delta);
      timer = setTimeout(function () {
        fastTimer = setInterval(function () {
          setBpm(bpm + delta);
        }, 80);
      }, 400);
    }
    function stop() {
      clearTimeout(timer);
      clearInterval(fastTimer);
    }

    btn.addEventListener("mousedown", start);
    btn.addEventListener("touchstart", function (e) { e.preventDefault(); start(); }, { passive: false });
    btn.addEventListener("mouseup", stop);
    btn.addEventListener("mouseleave", stop);
    btn.addEventListener("touchend", stop);
    btn.addEventListener("touchcancel", stop);
  }

  setupLongPress(bpmMinus, -1);
  setupLongPress(bpmPlus, 1);

  /* Keyboard shortcuts */
  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") {
      e.preventDefault();
      if (isRunning) stopMetronome(); else startMetronome();
    } else if (e.code === "ArrowUp") {
      e.preventDefault();
      setBpm(bpm + 1);
    } else if (e.code === "ArrowDown") {
      e.preventDefault();
      setBpm(bpm - 1);
    } else if (e.code === "KeyT") {
      handleTap();
    }
  });

  /* ── Init ── */
  loadSettings();
  bpmSlider.value = bpm;
  bpmDisplay.textContent = bpm;
  tempoName.textContent = getTempoName(bpm);
  buildBeatLights();

  sigButtons.forEach(function (btn) {
    btn.classList.toggle("active", parseInt(btn.dataset.sig, 10) === beatsPerMeasure);
  });

})();
</script>
</body>
</html>
