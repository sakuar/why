<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>趣味单位换算</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4ff;
    --surface: #ffffff;
    --surface2: #f8f9ff;
    --primary: #5b6af0;
    --primary-light: #e8eaff;
    --primary-dark: #3d4ed4;
    --accent: #ff7043;
    --text: #1a1d3a;
    --text-muted: #7780a0;
    --border: #e2e5f5;
    --shadow: 0 4px 24px rgba(91,106,240,0.10);
    --shadow-sm: 0 2px 8px rgba(91,106,240,0.07);
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 60px;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    z-index: 100;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color 0.2s, background 0.2s;
  }
  .back-link:hover { color: var(--primary); background: var(--primary-light); }

  header {
    background: linear-gradient(135deg, #5b6af0 0%, #8b6cf0 100%);
    color: #fff;
    text-align: center;
    padding: 56px 20px 40px;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 220px; height: 220px;
    background: rgba(255,255,255,0.07);
    border-radius: 50%;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -40px; left: -30px;
    width: 160px; height: 160px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
  }
  header h1 { font-size: clamp(24px,5vw,36px); font-weight: 800; letter-spacing: -0.5px; }
  header p { margin-top: 8px; font-size: 15px; opacity: 0.85; }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 16px;
  }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px 24px;
    margin-top: 24px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 0;
  }
  .tab-btn {
    padding: 8px 16px;
    border-radius: 50px;
    border: 2px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .tab-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
  }
  .tab-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(91,106,240,0.35);
  }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    margin-top: 20px;
  }
  .input-group {
    flex: 1;
  }
  .input-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .input-group input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    background: var(--surface2);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-group input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(91,106,240,0.12);
    background: #fff;
  }
  .input-group input::placeholder { color: #c5cadf; font-weight: 400; font-size: 16px; }

  .unit-badge {
    padding: 12px 16px;
    background: var(--primary-light);
    color: var(--primary);
    border-radius: var(--radius-sm);
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .convert-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    background: linear-gradient(135deg, var(--primary) 0%, #8b6cf0 100%);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: 0 4px 16px rgba(91,106,240,0.35);
  }
  .convert-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(91,106,240,0.45); }
  .convert-btn:active { transform: translateY(0); }

  .results-area {
    margin-top: 24px;
    display: none;
  }
  .results-area.visible { display: block; }

  .results-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }

  .result-item {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 18px 16px;
    border: 1.5px solid var(--border);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    animation: fadeUp 0.35s ease both;
  }
  .result-item:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow-sm);
    border-color: var(--primary);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .result-emoji { font-size: 32px; margin-bottom: 8px; display: block; }
  .result-number {
    font-size: 26px;
    font-weight: 800;
    color: var(--primary);
    line-height: 1.1;
  }
  .result-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 4px;
    line-height: 1.4;
  }
  .result-desc {
    font-size: 12px;
    color: #aab0c8;
    margin-top: 6px;
  }

  .history-card { margin-top: 24px; }
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .clear-btn {
    font-size: 12px;
    color: var(--text-muted);
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 10px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .clear-btn:hover { color: var(--accent); border-color: var(--accent); }

  .history-list { display: flex; flex-direction: column; gap: 8px; }
  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    font-size: 13px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    animation: fadeUp 0.3s ease both;
  }
  .history-item:hover { background: var(--primary-light); border-color: var(--primary); }
  .history-tag {
    background: var(--primary-light);
    color: var(--primary);
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .history-val { font-weight: 700; color: var(--text); }
  .history-summary { color: var(--text-muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .no-history {
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
    padding: 20px;
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 40px;
    padding: 0 20px;
  }

  @media (max-width: 480px) {
    header { padding: 50px 16px 32px; }
    .card { padding: 20px 16px; }
    .input-row { flex-direction: column; gap: 8px; }
    .unit-badge { text-align: center; }
    .results-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<header>
  <h1>趣味单位换算</h1>
  <p>把枯燥数字变成生动参照，感受世界的尺度</p>
</header>

<div class="container">

  <div class="card">
    <div class="section-title">选择类型</div>
    <div class="tabs" id="tabs"></div>

    <div class="input-row">
      <div class="input-group">
        <label id="input-label">请输入数值</label>
        <input type="number" id="main-input" placeholder="输入数字..." min="0" step="any">
      </div>
      <div class="unit-badge" id="unit-badge">cm</div>
    </div>
    <button class="convert-btn" id="convert-btn">开始换算 ✨</button>
  </div>

  <div class="results-area" id="results-area">
    <div class="card">
      <div class="section-title">换算结果</div>
      <div class="results-grid" id="results-grid"></div>
    </div>
  </div>

  <div class="card history-card" id="history-card">
    <div class="history-header">
      <div class="section-title" style="margin-bottom:0">最近记录</div>
      <button class="clear-btn" id="clear-btn">清空</button>
    </div>
    <div class="history-list" id="history-list"></div>
  </div>

</div>

<footer>数值来源于公开参考数据，仅供趣味参考</footer>

<script>
(function () {
  "use strict";

  /* =========================================================
     数据定义
  ========================================================= */
  var CATEGORIES = [
    {
      id: "height",
      label: "身高 / 长度",
      unit: "cm",
      inputLabel: "输入长度（厘米）",
      refs: [
        { emoji: "🍌", name: "香蕉", factor: 19, unit: "根", desc: "普通香蕉约 19 cm" },
        { emoji: "🏢", name: "楼层", factor: 300, unit: "层", desc: "标准楼层高约 300 cm" },
        { emoji: "🦒", name: "长颈鹿", factor: 560, unit: "只", desc: "长颈鹿身高约 560 cm" },
        { emoji: "🚌", name: "公交车", factor: 1200, unit: "辆", desc: "标准公交车约 12 m" },
        { emoji: "🗼", name: "埃菲尔铁塔", factor: 33000, unit: "座", desc: "埃菲尔铁塔约 330 m" },
        { emoji: "✏️", name: "铅笔", factor: 19, unit: "支", desc: "标准铅笔约 19 cm" }
      ]
    },
    {
      id: "weight",
      label: "体重 / 重量",
      unit: "kg",
      inputLabel: "输入重量（千克）",
      refs: [
        { emoji: "🐱", name: "猫咪", factor: 4.5, unit: "只", desc: "成年猫约 4.5 kg" },
        { emoji: "🍎", name: "苹果", factor: 0.2, unit: "个", desc: "一个苹果约 200 g" },
        { emoji: "🐶", name: "柯基犬", factor: 12, unit: "只", desc: "成年柯基约 12 kg" },
        { emoji: "🧱", name: "标准砖块", factor: 2.5, unit: "块", desc: "普通红砖约 2.5 kg" },
        { emoji: "🐘", name: "大象", factor: 5000, unit: "头", desc: "非洲象约 5000 kg" },
        { emoji: "🥛", name: "牛奶", factor: 1, unit: "升", desc: "1 升牛奶约 1 kg" }
      ]
    },
    {
      id: "distance",
      label: "距离",
      unit: "m",
      inputLabel: "输入距离（米）",
      refs: [
        { emoji: "⚽", name: "足球场", factor: 105, unit: "个", desc: "标准足球场长 105 m" },
        { emoji: "🏀", name: "篮球场", factor: 28, unit: "个", desc: "标准篮球场长 28 m" },
        { emoji: "🏊", name: "游泳池", factor: 50, unit: "个", desc: "标准游泳池长 50 m" },
        { emoji: "🚗", name: "轿车", factor: 4.5, unit: "辆", desc: "普通轿车长约 4.5 m" },
        { emoji: "🌍", name: "地球周长", factor: 40075000, unit: "圈", desc: "地球周长约 40075 km" },
        { emoji: "🦁", name: "狮子跳跃", factor: 11, unit: "次", desc: "狮子最远跳跃约 11 m" }
      ]
    },
    {
      id: "area",
      label: "面积",
      unit: "m²",
      inputLabel: "输入面积（平方米）",
      refs: [
        { emoji: "🏠", name: "单间公寓", factor: 30, unit: "间", desc: "小单间约 30 m²" },
        { emoji: "🏟️", name: "足球场", factor: 7140, unit: "个", desc: "标准足球场约 7140 m²" },
        { emoji: "🛏️", name: "双人床", factor: 3.5, unit: "张", desc: "标准双人床约 3.5 m²" },
        { emoji: "🎾", name: "网球场", factor: 260, unit: "个", desc: "标准网球场约 260 m²" },
        { emoji: "🍕", name: "披萨", factor: 0.07, unit: "张", desc: "12寸披萨约 0.07 m²" },
        { emoji: "🏖️", name: "篮球场", factor: 420, unit: "个", desc: "标准篮球场约 420 m²" }
      ]
    },
    {
      id: "time",
      label: "时间",
      unit: "秒",
      inputLabel: "输入时间（秒）",
      refs: [
        { emoji: "💓", name: "心跳", factor: 0.8, unit: "次", desc: "人类心跳约 0.8 秒/次" },
        { emoji: "😴", name: "睡一觉", factor: 28800, unit: "觉", desc: "8 小时睡眠 = 28800 秒" },
        { emoji: "🎬", name: "电影", factor: 7200, unit: "部", desc: "平均电影约 2 小时" },
        { emoji: "🐢", name: "乌龟寿命", factor: 3153600000, unit: "辈子", desc: "乌龟寿命约 100 年" },
        { emoji: "⚡", name: "闪电", factor: 0.0003, unit: "次", desc: "闪电持续约 0.3 毫秒" },
        { emoji: "🌅", name: "完整一天", factor: 86400, unit: "天", desc: "一天 = 86400 秒" }
      ]
    },
    {
      id: "speed",
      label: "速度",
      unit: "km/h",
      inputLabel: "输入速度（千米/小时）",
      refs: [
        { emoji: "🚶", name: "步行", factor: 5, unit: "倍", desc: "正常步行约 5 km/h" },
        { emoji: "🚲", name: "骑自行车", factor: 20, unit: "倍", desc: "普通骑行约 20 km/h" },
        { emoji: "🐆", name: "猎豹冲刺", factor: 120, unit: "倍", desc: "猎豹最高速 120 km/h" },
        { emoji: "✈️", name: "民航客机", factor: 900, unit: "倍", desc: "客机巡航约 900 km/h" },
        { emoji: "🚀", name: "火箭", factor: 28000, unit: "倍", desc: "火箭入轨约 28000 km/h" },
        { emoji: "🔊", name: "音速", factor: 1235, unit: "倍", desc: "音速约 1235 km/h" }
      ]
    },
    {
      id: "data",
      label: "数据量",
      unit: "MB",
      inputLabel: "输入数据量（兆字节 MB）",
      refs: [
        { emoji: "📸", name: "手机照片", factor: 4, unit: "张", desc: "一张手机照片约 4 MB" },
        { emoji: "🎵", name: "MP3 歌曲", factor: 5, unit: "首", desc: "一首 MP3 约 5 MB" },
        { emoji: "📖", name: "电子书", factor: 1, unit: "本", desc: "普通电子书约 1 MB" },
        { emoji: "🎬", name: "高清电影", factor: 4000, unit: "部", desc: "1080P 电影约 4 GB" },
        { emoji: "💿", name: "光盘 CD", factor: 700, unit: "张", desc: "一张 CD 约 700 MB" },
        { emoji: "📱", name: "微信聊天记录", factor: 0.001, unit: "条", desc: "一条文字消息约 1 KB" }
      ]
    },
    {
      id: "money",
      label: "金钱",
      unit: "元",
      inputLabel: "输入金额（人民币 元）",
      refs: [
        { emoji: "🧋", name: "奶茶", factor: 28, unit: "杯", desc: "一杯奶茶约 28 元" },
        { emoji: "🍜", name: "兰州拉面", factor: 14, unit: "碗", desc: "一碗拉面约 14 元" },
        { emoji: "📱", name: "旗舰手机", factor: 6000, unit: "部", desc: "旗舰手机约 6000 元" },
        { emoji: "🚗", name: "代步车", factor: 80000, unit: "辆", desc: "入门轿车约 8 万元" },
        { emoji: "🏠", name: "北京均价㎡", factor: 60000, unit: "㎡", desc: "北京房价均价约 6 万/㎡" },
        { emoji: "☕", name: "咖啡", factor: 32, unit: "杯", desc: "一杯美式约 32 元" }
      ]
    }
  ];

  var STORAGE_KEY = "unit-fun-history";
  var MAX_HISTORY = 20;

  /* =========================================================
     状态变量
  ========================================================= */
  var currentCatId = CATEGORIES[0].id;
  var history = [];

  /* =========================================================
     DOM 引用 (在 init 内部获取，确保 DOM 已就绪)
  ========================================================= */
  var tabsEl, mainInput, unitBadge, inputLabel, convertBtn;
  var resultsArea, resultsGrid, historyList, clearBtn;

  /* =========================================================
     工具函数
  ========================================================= */
  function formatNumber(n) {
    if (n === 0) return "0";
    if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + " 亿";
    if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(2) + " 亿";
    if (Math.abs(n) >= 1e4) return (n / 1e4).toFixed(2) + " 万";
    if (Math.abs(n) >= 1) return parseFloat(n.toFixed(2)).toLocaleString("zh-CN");
    if (Math.abs(n) >= 0.01) return parseFloat(n.toFixed(4)).toString();
    return n.toExponential(2);
  }

  function getCurrentCat() {
    for (var i = 0; i < CATEGORIES.length; i++) {
      if (CATEGORIES[i].id === currentCatId) return CATEGORIES[i];
    }
    return CATEGORIES[0];
  }

  /* =========================================================
     历史记录
  ========================================================= */
  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) history = JSON.parse(raw);
    } catch (e) {
      history = [];
    }
  }

  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) { /* ignore */ }
  }

  function addHistory(cat, value, summary) {
    history.unshift({ cat: cat, value: value, summary: summary, time: Date.now() });
    if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
    saveHistory();
    renderHistory();
  }

  function renderHistory() {
    if (!historyList) return;
    if (history.length === 0) {
      historyList.innerHTML = '<div class="no-history">暂无记录，快来换算一下吧~</div>';
      return;
    }
    var html = "";
    for (var i = 0; i < history.length; i++) {
      var item = history[i];
      html += '<div class="history-item" data-index="' + i + '">'
        + '<span class="history-tag">' + escHtml(item.cat) + '</span>'
        + '<span class="history-val">' + escHtml(String(item.value)) + '</span>'
        + '<span class="history-summary">' + escHtml(item.summary) + '</span>'
        + '</div>';
    }
    historyList.innerHTML = html;
    var items = historyList.querySelectorAll(".history-item");
    for (var j = 0; j < items.length; j++) {
      (function (el, idx) {
        el.addEventListener("click", function () {
          recallHistory(idx);
        });
      })(items[j], j);
    }
  }

  function recallHistory(idx) {
    var item = history[idx];
    if (!item) return;
    for (var i = 0; i < CATEGORIES.length; i++) {
      if (CATEGORIES[i].label === item.cat) {
        currentCatId = CATEGORIES[i].id;
        break;
      }
    }
    renderTabs();
    updateUnitUI();
    mainInput.value = item.value;
    doConvert();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  /* =========================================================
     换算核心
  ========================================================= */
  function doConvert() {
    var rawVal = parseFloat(mainInput.value);
    if (isNaN(rawVal) || rawVal < 0) {
      shake(mainInput);
      return;
    }

    var cat = getCurrentCat();
    var html = "";
    var summaryParts = [];

    for (var i = 0; i < cat.refs.length; i++) {
      var ref = cat.refs[i];
      var count = rawVal / ref.factor;
      var numStr = formatNumber(count);
      html += '<div class="result-item" style="animation-delay:' + (i * 0.05) + 's">'
        + '<span class="result-emoji">' + ref.emoji + '</span>'
        + '<div class="result-number">' + numStr + ' <small style="font-size:14px;font-weight:600;color:#9aa0c8">' + ref.unit + '</small></div>'
        + '<div class="result-label">' + ref.name + '</div>'
        + '<div class="result-desc">' + ref.desc + '</div>'
        + '</div>';
      if (summaryParts.length < 2) {
        summaryParts.push(numStr + ref.unit + ref.name);
      }
    }

    resultsGrid.innerHTML = html;
    resultsArea.classList.add("visible");
    resultsArea.scrollIntoView({ behavior: "smooth", block: "nearest" });

    addHistory(cat.label, rawVal, summaryParts.join(" / "));
  }

  /* =========================================================
     UI 渲染
  ========================================================= */
  function renderTabs() {
    var html = "";
    for (var i = 0; i < CATEGORIES.length; i++) {
      var cat = CATEGORIES[i];
      var active = cat.id === currentCatId ? " active" : "";
      html += '<button class="tab-btn' + active + '" data-id="' + cat.id + '">' + cat.label + '</button>';
    }
    tabsEl.innerHTML = html;
    var btns = tabsEl.querySelectorAll(".tab-btn");
    for (var j = 0; j < btns.length; j++) {
      (function (btn) {
        btn.addEventListener("click", function () {
          currentCatId = btn.getAttribute("data-id");
          renderTabs();
          updateUnitUI();
          resultsArea.classList.remove("visible");
          mainInput.value = "";
          mainInput.focus();
        });
      })(btns[j]);
    }
  }

  function updateUnitUI() {
    var cat = getCurrentCat();
    unitBadge.textContent = cat.unit;
    inputLabel.textContent = cat.inputLabel;
  }

  function escHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function shake(el) {
    el.style.animation = "none";
    el.style.borderColor = "#ff7043";
    setTimeout(function () {
      el.style.borderColor = "";
      el.style.animation = "";
    }, 600);
  }

  /* =========================================================
     初始化 (所有定义之后执行)
  ========================================================= */
  function init() {
    tabsEl       = document.getElementById("tabs");
    mainInput    = document.getElementById("main-input");
    unitBadge    = document.getElementById("unit-badge");
    inputLabel   = document.getElementById("input-label");
    convertBtn   = document.getElementById("convert-btn");
    resultsArea  = document.getElementById("results-area");
    resultsGrid  = document.getElementById("results-grid");
    historyList  = document.getElementById("history-list");
    clearBtn     = document.getElementById("clear-btn");

    loadHistory();
    renderTabs();
    updateUnitUI();
    renderHistory();

    convertBtn.addEventListener("click", function () {
      doConvert();
    });

    mainInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") doConvert();
    });

    clearBtn.addEventListener("click", function () {
      history = [];
      saveHistory();
      renderHistory();
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }

})();
</script>
</body>
</html>
