<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字转大写 · 财务金额</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0f4f8;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --border: #e2e8f0;
    --primary: #3b5bdb;
    --primary-light: #eef2ff;
    --primary-dark: #2f4ac0;
    --accent: #0ea5e9;
    --text: #1e293b;
    --text-muted: #64748b;
    --text-light: #94a3b8;
    --success: #10b981;
    --error: #ef4444;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(59,91,219,.08);
    --shadow-lg: 0 8px 32px rgba(59,91,219,.14);
    --radius: 14px;
    --radius-sm: 8px;
    --transition: .2s cubic-bezier(.4,0,.2,1);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 16px;
  }

  /* 返回链接 */
  .back-link {
    position: fixed;
    top: 12px;
    left: 16px;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    padding: 4px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,.72);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    transition: var(--transition);
    z-index: 100;
  }
  .back-link:hover { color: var(--primary); background: var(--primary-light); border-color: var(--primary); }

  /* 主容器 */
  .container {
    max-width: 600px;
    margin: 0 auto;
    padding-top: 48px;
  }

  /* 头部 */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }
  .header-icon {
    width: 64px;
    height: 64px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 14px;
    font-size: 28px;
    box-shadow: 0 4px 16px rgba(59,91,219,.3);
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .header p {
    font-size: 13px;
    color: var(--text-muted);
  }

  /* 卡片 */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 16px;
    border: 1px solid var(--border);
  }

  /* 输入区 */
  .input-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: .6px;
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .currency-badge {
    position: absolute;
    left: 14px;
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    pointer-events: none;
    user-select: none;
  }

  #numInput {
    width: 100%;
    height: 56px;
    padding: 0 100px 0 44px;
    font-size: 24px;
    font-weight: 600;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface2);
    color: var(--text);
    outline: none;
    transition: var(--transition);
    letter-spacing: .5px;
  }
  #numInput:focus {
    border-color: var(--primary);
    background: var(--surface);
    box-shadow: 0 0 0 4px rgba(59,91,219,.1);
  }
  #numInput::placeholder { color: var(--text-light); font-weight: 400; font-size: 16px; }

  .clear-btn {
    position: absolute;
    right: 12px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-light);
    font-size: 20px;
    padding: 6px;
    border-radius: 6px;
    transition: var(--transition);
    line-height: 1;
    display: none;
  }
  .clear-btn:hover { color: var(--error); background: #fef2f2; }
  .clear-btn.visible { display: flex; align-items: center; }

  /* 快捷金额 */
  .quick-label {
    font-size: 12px;
    color: var(--text-light);
    margin: 12px 0 8px;
  }
  .quick-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .quick-btn {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-muted);
    cursor: pointer;
    transition: var(--transition);
    font-family: inherit;
  }
  .quick-btn:hover {
    background: var(--primary-light);
    border-color: var(--primary);
    color: var(--primary);
  }

  /* 结果区 */
  .result-card {
    background: linear-gradient(135deg, #eef2ff 0%, #e0f2fe 100%);
    border: 2px solid var(--primary);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    min-height: 80px;
    display: flex;
    align-items: center;
    transition: var(--transition);
  }
  .result-card::before {
    content: '';
    position: absolute;
    top: -20px;
    right: -20px;
    width: 80px;
    height: 80px;
    background: rgba(59,91,219,.06);
    border-radius: 50%;
  }
  .result-card.empty {
    background: var(--surface2);
    border-color: var(--border);
    border-style: dashed;
  }

  .result-text {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary-dark);
    line-height: 1.5;
    word-break: break-all;
    flex: 1;
    padding-right: 8px;
  }
  .result-text.placeholder {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-light);
  }
  .result-text.error-text {
    color: var(--error);
    font-size: 14px;
    font-weight: 500;
  }

  /* 复制按钮 */
  .copy-btn {
    flex-shrink: 0;
    height: 40px;
    padding: 0 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .copy-btn:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,91,219,.35); }
  .copy-btn:active { transform: translateY(0); }
  .copy-btn.hidden { display: none; }
  .copy-btn.success { background: var(--success); }

  /* 历史记录 */
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .6px;
  }
  .clear-history-btn {
    font-size: 12px;
    color: var(--text-light);
    background: none;
    border: none;
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 4px;
    font-family: inherit;
    transition: var(--transition);
  }
  .clear-history-btn:hover { color: var(--error); background: #fef2f2; }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: var(--transition);
    gap: 8px;
  }
  .history-item:hover { background: var(--primary-light); border-color: var(--primary); }
  .history-num {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }
  .history-result {
    font-size: 12px;
    color: var(--text-muted);
    flex: 1;
    text-align: right;
    word-break: break-all;
    line-height: 1.4;
  }
  .history-copy {
    font-size: 11px;
    color: var(--text-light);
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    cursor: pointer;
    font-family: inherit;
    transition: var(--transition);
    flex-shrink: 0;
    white-space: nowrap;
  }
  .history-copy:hover { color: var(--primary); border-color: var(--primary); background: var(--primary-light); }

  .empty-history {
    text-align: center;
    color: var(--text-light);
    font-size: 13px;
    padding: 16px 0;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1e293b;
    color: #fff;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    z-index: 9999;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s ease;
    opacity: 0;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  /* 动画 */
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-card { animation: fadeSlideIn .25s ease; }
  .history-item { animation: fadeSlideIn .2s ease; }

  /* 响应式 */
  @media (max-width: 480px) {
    .container { padding-top: 44px; }
    .card { padding: 18px; }
    .result-card { padding: 16px 18px; }
    #numInput { font-size: 20px; height: 50px; }
    .result-text { font-size: 15px; }
    .header h1 { font-size: 18px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="container">

  <!-- 头部 -->
  <div class="header">
    <div class="header-icon">&#20803;</div>
    <h1>数字转大写</h1>
    <p>输入金额，自动生成人民币大写，财务专用</p>
  </div>

  <!-- 输入卡片 -->
  <div class="card">
    <label class="input-label" for="numInput">输入金额（阿拉伯数字）</label>
    <div class="input-wrap">
      <span class="currency-badge">¥</span>
      <input
        id="numInput"
        type="text"
        inputmode="decimal"
        placeholder="例如：1234.56"
        autocomplete="off"
        spellcheck="false"
      >
      <button class="clear-btn" id="clearBtn" title="清除" aria-label="清除">&#10005;</button>
    </div>
    <div class="quick-label">快捷金额</div>
    <div class="quick-btns" id="quickBtns"></div>
  </div>

  <!-- 结果卡片 -->
  <div class="result-card empty" id="resultCard">
    <span class="result-text placeholder" id="resultText">等待输入...</span>
    <button class="copy-btn hidden" id="copyBtn">&#128203; 复制</button>
  </div>

  <!-- 历史记录 -->
  <div class="card" id="historyCard">
    <div class="history-header">
      <span class="section-title">转换历史</span>
      <button class="clear-history-btn" id="clearHistoryBtn">清空</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ============================================================
     核心：数字 → 人民币大写
  ============================================================ */
  var DIGITS = ["零","壹","贰","叁","肆","伍","陆","柒","捌","玖"];
  var UNIT4  = ["","拾","佰","仟"];
  var UNIT_SECTION = ["","万","亿","万亿","兆"];

  function section2Chinese(num) {
    // 处理 0-9999 的整数段，返回中文及末尾是否为零
    var result = "";
    var zero = false;
    for (var i = 3; i >= 0; i--) {
      var d = Math.floor(num / Math.pow(10, i)) % 10;
      if (d === 0) {
        zero = true;
      } else {
        if (zero && result !== "") result += "零";
        result += DIGITS[d] + UNIT4[i];
        zero = false;
      }
    }
    return { str: result, leadZero: (num > 0 && Math.floor(num / 1000) === 0) };
  }

  function intToChinese(n) {
    if (n === 0) return "零";
    var result = "";
    var sectionIndex = 0;
    while (n > 0) {
      var section = n % 10000;
      var sec = section2Chinese(section);
      if (section !== 0) {
        var needZero = (result !== "" && sec.leadZero);
        result = sec.str + UNIT_SECTION[sectionIndex] + (needZero ? "零" : "") + result;
      }
      n = Math.floor(n / 10000);
      sectionIndex++;
    }
    return result;
  }

  function numberToChinese(input) {
    input = String(input).trim();

    // 去掉千分位逗号
    input = input.replace(/,/g, "");

    if (input === "" || input === ".") return { ok: false, msg: "请输入有效金额" };

    var neg = false;
    if (input.charAt(0) === "-") {
      neg = true;
      input = input.slice(1);
    }

    if (!/^\d+(\.\d{0,2})?$/.test(input)) {
      return { ok: false, msg: "格式有误：仅支持数字，最多2位小数" };
    }

    var parts = input.split(".");
    var intStr = parts[0];
    var decStr = parts[1] ? (parts[1] + "00").slice(0, 2) : "00";

    // 超大数检测（超过万亿亿容易溢出）
    if (intStr.length > 16) return { ok: false, msg: "金额过大，请输入16位以内整数" };

    var intNum = parseInt(intStr, 10) || 0;
    var jiao = parseInt(decStr.charAt(0), 10);
    var fen  = parseInt(decStr.charAt(1), 10);

    var zheng = "";
    if (intNum === 0) {
      zheng = "";
    } else {
      zheng = intToChinese(intNum) + "元";
    }

    var dec = "";
    if (jiao === 0 && fen === 0) {
      dec = "整";
    } else if (jiao === 0) {
      dec = (intNum > 0 ? "零" : "") + DIGITS[fen] + "分";
    } else if (fen === 0) {
      dec = DIGITS[jiao] + "角整";
    } else {
      dec = DIGITS[jiao] + "角" + DIGITS[fen] + "分";
    }

    if (intNum === 0 && (jiao > 0 || fen > 0)) {
      dec = (jiao > 0 ? DIGITS[jiao] + "角" : "") + (fen > 0 ? DIGITS[fen] + "分" : "");
    }

    if (intNum === 0 && jiao === 0 && fen === 0) {
      return { ok: true, result: "人民币零元整" };
    }

    var prefix = neg ? "负" : "";
    return { ok: true, result: "人民币" + prefix + zheng + dec };
  }

  /* ============================================================
     历史记录（localStorage）
  ============================================================ */
  var STORAGE_KEY = "num_spell_history";
  var MAX_HISTORY = 20;

  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveHistory(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    } catch (e) {}
  }

  function addHistory(num, result) {
    var list = loadHistory();
    // 去重：同样的数字不重复添加
    list = list.filter(function (item) { return item.num !== num; });
    list.unshift({ num: num, result: result, time: Date.now() });
    if (list.length > MAX_HISTORY) list = list.slice(0, MAX_HISTORY);
    saveHistory(list);
    renderHistory();
  }

  /* ============================================================
     DOM 引用
  ============================================================ */
  var numInput      = document.getElementById("numInput");
  var clearBtn      = document.getElementById("clearBtn");
  var resultCard    = document.getElementById("resultCard");
  var resultText    = document.getElementById("resultText");
  var copyBtn       = document.getElementById("copyBtn");
  var historyList   = document.getElementById("historyList");
  var clearHistoryBtn = document.getElementById("clearHistoryBtn");
  var toastEl       = document.getElementById("toast");
  var quickBtnsEl   = document.getElementById("quickBtns");

  /* ============================================================
     Toast
  ============================================================ */
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove("show");
    }, 1800);
  }

  /* ============================================================
     复制到剪贴板
  ============================================================ */
  function copyText(text, btn) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        if (btn) flashCopy(btn);
        showToast("已复制到剪贴板");
      }).catch(function () {
        fallbackCopy(text, btn);
      });
    } else {
      fallbackCopy(text, btn);
    }
  }

  function fallbackCopy(text, btn) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0;top:0;left:0;";
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand("copy");
      if (btn) flashCopy(btn);
      showToast("已复制到剪贴板");
    } catch (e) {
      showToast("复制失败，请手动复制");
    }
    document.body.removeChild(ta);
  }

  function flashCopy(btn) {
    var origText = btn.innerHTML;
    btn.innerHTML = "&#10003; 已复制";
    btn.classList.add("success");
    setTimeout(function () {
      btn.innerHTML = origText;
      btn.classList.remove("success");
    }, 1500);
  }

  /* ============================================================
     当前结果
  ============================================================ */
  var currentResult = "";

  /* ============================================================
     更新结果显示
  ============================================================ */
  function updateResult() {
    var val = numInput.value.trim();

    // 显示/隐藏清除按钮
    if (val) {
      clearBtn.classList.add("visible");
    } else {
      clearBtn.classList.remove("visible");
    }

    if (!val) {
      resultCard.classList.add("empty");
      resultText.className = "result-text placeholder";
      resultText.textContent = "等待输入...";
      copyBtn.classList.add("hidden");
      currentResult = "";
      return;
    }

    var res = numberToChinese(val);
    resultCard.classList.remove("empty");

    if (res.ok) {
      resultText.className = "result-text";
      resultText.textContent = res.result;
      copyBtn.classList.remove("hidden");
      currentResult = res.result;
      // 延迟一点加入历史，避免每次击键都记录
      scheduleHistory(val, res.result);
    } else {
      resultText.className = "result-text error-text";
      resultText.textContent = res.msg;
      copyBtn.classList.add("hidden");
      currentResult = "";
    }
  }

  /* ============================================================
     防抖历史记录
  ============================================================ */
  var historyDebounce = null;
  function scheduleHistory(num, result) {
    clearTimeout(historyDebounce);
    historyDebounce = setTimeout(function () {
      addHistory(num, result);
    }, 800);
  }

  /* ============================================================
     渲染历史列表
  ============================================================ */
  function renderHistory() {
    var list = loadHistory();
    if (list.length === 0) {
      historyList.innerHTML = '<div class="empty-history">暂无转换历史</div>';
      return;
    }
    historyList.innerHTML = "";
    list.forEach(function (item) {
      var div = document.createElement("div");
      div.className = "history-item";
      div.innerHTML =
        '<span class="history-num">¥ ' + item.num + '</span>' +
        '<span class="history-result">' + item.result + '</span>' +
        '<button class="history-copy" data-result="' + encodeURIComponent(item.result) + '" data-num="' + encodeURIComponent(item.num) + '">复制</button>';

      div.addEventListener("click", function (e) {
        if (e.target.classList.contains("history-copy")) return;
        numInput.value = item.num;
        updateResult();
        numInput.focus();
      });

      var copyHistBtn = div.querySelector(".history-copy");
      copyHistBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        var r = decodeURIComponent(this.getAttribute("data-result"));
        copyText(r, this);
      });

      historyList.appendChild(div);
    });
  }

  /* ============================================================
     快捷金额
  ============================================================ */
  var QUICK_AMOUNTS = ["100", "1000", "10000", "100000", "1000000", "123456.78", "0.5", "99.99"];

  function initQuickBtns() {
    QUICK_AMOUNTS.forEach(function (amount) {
      var btn = document.createElement("button");
      btn.className = "quick-btn";
      btn.textContent = amount;
      btn.addEventListener("click", function () {
        numInput.value = amount;
        updateResult();
        numInput.focus();
      });
      quickBtnsEl.appendChild(btn);
    });
  }

  /* ============================================================
     事件绑定
  ============================================================ */
  numInput.addEventListener("input", function () {
    // 只允许数字、小数点、负号（限首位）
    var v = numInput.value;
    var cleaned = v.replace(/[^\d.\-]/g, "");
    // 确保负号只在首位
    cleaned = cleaned.replace(/(?!^)-/g, "");
    // 确保只有一个小数点
    var dotIdx = cleaned.indexOf(".");
    if (dotIdx !== -1) {
      cleaned = cleaned.slice(0, dotIdx + 1) + cleaned.slice(dotIdx + 1).replace(/\./g, "");
    }
    if (cleaned !== v) {
      numInput.value = cleaned;
    }
    updateResult();
  });

  numInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && currentResult) {
      copyText(currentResult, copyBtn);
    }
  });

  clearBtn.addEventListener("click", function () {
    numInput.value = "";
    updateResult();
    numInput.focus();
  });

  copyBtn.addEventListener("click", function () {
    if (currentResult) copyText(currentResult, copyBtn);
  });

  clearHistoryBtn.addEventListener("click", function () {
    saveHistory([]);
    renderHistory();
    showToast("历史已清空");
  });

  /* ============================================================
     初始化（所有变量和函数定义后才执行）
  ============================================================ */
  initQuickBtns();
  renderHistory();
  numInput.focus();

})();
</script>
</body>
