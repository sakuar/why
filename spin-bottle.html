<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>转瓶子</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#160f28;color:#e8eef7;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:46px 16px 60px;user-select:none;}
  .back{position:fixed;top:14px;left:16px;color:#6b6f8a;text-decoration:none;font-size:13px;}
  .back:hover{color:#ff8aa0;}
  h1{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#ff8aa0,#b98cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{color:#8090a8;font-size:13px;margin:6px 0 18px;}
  canvas{touch-action:none;cursor:pointer;}
  .tip{margin-top:10px;color:#9a8fc0;font-size:14px;height:22px;}
  button{margin-top:14px;background:#7d5fff;color:#fff;border:none;border-radius:10px;padding:11px 26px;font-size:15px;font-weight:600;cursor:pointer;}
  button:hover{background:#9579ff;}
</style>
</head>
<body>
<a class="back" href="index.html">← 入口</a>
<h1>转瓶子</h1>
<p class="sub">点一下瓶子转起来，看它指向谁</p>
<canvas id="cv" width="340" height="340"></canvas>
<div class="tip" id="tip">点击瓶子开始</div>
<button id="spin">转一下</button>
<script>
"use strict";
(function(){
  var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  var cx=cv.width/2,cy=cv.height/2,R=140;
  var angle=0,vel=0,spinning=false;
  function drawBottle(a){
    ctx.clearRect(0,0,cv.width,cv.height);
    // 外圈
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);
    ctx.strokeStyle="#3a2a5e";ctx.lineWidth=3;ctx.stroke();
    // 圆周小点
    for(var i=0;i<12;i++){
      var t=i/12*Math.PI*2;
      ctx.beginPath();ctx.arc(cx+Math.cos(t)*R,cy+Math.sin(t)*R,5,0,Math.PI*2);
      ctx.fillStyle=i%2?"#7d5fff":"#ff8aa0";ctx.fill();
    }
    // 瓶子
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a);
    var g=ctx.createLinearGradient(0,-R+18,0,R-18);
    g.addColorStop(0,"#ffd166");g.addColorStop(0.5,"#56cfaf");g.addColorStop(1,"#7d5fff");
    // 瓶身（指向上方为头）
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(0,-R+20);            // 瓶口尖
    ctx.lineTo(11,-R+58);
    ctx.lineTo(9,R-70);
    ctx.quadraticCurveTo(0,R-30,-9,R-70);
    ctx.lineTo(-11,-R+58);
    ctx.closePath();ctx.fill();
    // 瓶口圆点
    ctx.beginPath();ctx.arc(0,-R+22,7,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
    ctx.restore();
    // 中心轴
    ctx.beginPath();ctx.arc(cx,cy,8,0,Math.PI*2);ctx.fillStyle="#2a1f48";ctx.fill();
  }
  function spin(){
    if(spinning)return;
    spinning=true;
    document.getElementById("tip").textContent="转动中……";
    vel=0.35+Math.random()*0.25;
    requestAnimationFrame(step);
  }
  function step(){
    if(vel>0.002){
      angle+=vel;vel*=0.985;
      drawBottle(angle);
      requestAnimationFrame(step);
    }else{
      spinning=false;
      var deg=Math.round((angle%(Math.PI*2))*180/Math.PI);
      document.getElementById("tip").textContent="🍾 瓶口指向 "+((deg%360+360)%360)+"°";
      drawBottle(angle);
    }
  }
  cv.addEventListener("click",spin);
  document.getElementById("spin").addEventListener("click",spin);
  drawBottle(0);
})();
</script>
</body>
</html>
