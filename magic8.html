<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>神奇8号球</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a40;
    --accent: #7c5cbf;
    --accent2: #a07de8;
    --text: #e8e0f0;
    --muted: #7a7090;
    --positive: #6ee7b7;
    --negative: #f87171;
    --neutral: #93c5fd;
    --glow: rgba(124, 92, 191, 0.4);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    background: radial-gradient(ellipse at 50% 0%, #1a0d2e 0%, #0a0a0f 70%);
  }

  /* Stars background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 25%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 82% 50%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 75%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 85%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 48% 35%, rgba(200,180,255,0.7) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 75% 70%, rgba(200,180,255,0.5) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 20% 55%, rgba(200,180,255,0.6) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    color: var(--muted);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.02em;
    z-index: 100;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--text); }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding-top: 48px;
    padding-bottom: 40px;
  }

  .title {
    text-align: center;
  }
  .title h1 {
    font-size: clamp(22px, 5vw, 30px);
    font-weight: 700;
    letter-spacing: 0.06em;
    background: linear-gradient(135deg, #c4a8ff, #7c5cbf, #a07de8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .title p {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  /* 8-Ball */
  .ball-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .ball {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a2a3a, #0d0d14 60%, #050508);
    box-shadow:
      0 0 0 3px #1a1a28,
      0 0 40px rgba(124, 92, 191, 0.25),
      0 8px 40px rgba(0,0,0,0.8),
      inset 0 -10px 30px rgba(0,0,0,0.6),
      inset 0 10px 20px rgba(255,255,255,0.04);
    position: relative;
    transition: box-shadow 0.3s;
  }

  .ball-wrap:hover .ball {
    box-shadow:
      0 0 0 3px #2a2a40,
      0 0 60px rgba(124, 92, 191, 0.45),
      0 8px 40px rgba(0,0,0,0.8),
      inset 0 -10px 30px rgba(0,0,0,0.6),
      inset 0 10px 20px rgba(255,255,255,0.04);
  }

  /* Highlight on ball */
  .ball::before {
    content: '';
    position: absolute;
    top: 14%;
    left: 22%;
    width: 30%;
    height: 18%;
    background: radial-gradient(ellipse, rgba(255,255,255,0.15) 0%, transparent 100%);
    border-radius: 50%;
    transform: rotate(-20deg);
  }

  /* Number 8 ring */
  .ball-number {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #f0eaff, #b8a0e8 40%, #7c5cbf 80%);
    box-shadow: 0 0 20px rgba(124,92,191,0.6), inset 0 2px 4px rgba(255,255,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ball-number span {
    font-size: 40px;
    font-weight: 900;
    color: #0d0d18;
    line-height: 1;
    letter-spacing: -2px;
    text-shadow: 0 1px 2px rgba(255,255,255,0.2);
  }

  /* Crystal window */
  .crystal-window {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #1a1030, #0a0818 60%, #050510);
    box-shadow:
      0 0 20px rgba(80,40,160,0.5),
      inset 0 0 20px rgba(0,0,0,0.8),
      inset 0 0 8px rgba(124,92,191,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.5s;
  }

  .crystal-window.visible {
    opacity: 1;
  }

  .crystal-answer {
    font-size: 9px;
    font-weight: 700;
    text-align: center;
    padding: 8px;
    line-height: 1.3;
    letter-spacing: 0.03em;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.4s 0.2s, transform 0.4s 0.2s;
  }

  .crystal-window.visible .crystal-answer {
    opacity: 1;
    transform: scale(1);
  }

  .crystal-answer.positive { color: var(--positive); text-shadow: 0 0 8px var(--positive); }
  .crystal-answer.negative { color: var(--negative); text-shadow: 0 0 8px var(--negative); }
  .crystal-answer.neutral { color: var(--neutral); text-shadow: 0 0 8px var(--neutral); }

  /* Shake animation */
  @keyframes shake {
    0%   { transform: rotate(0deg) scale(1); }
    10%  { transform: rotate(-8deg) scale(1.03); }
    20%  { transform: rotate(8deg) scale(1.06); }
    30%  { transform: rotate(-10deg) scale(1.04); }
    40%  { transform: rotate(10deg) scale(1.07); }
    50%  { transform: rotate(-8deg) scale(1.05); }
    60%  { transform: rotate(8deg) scale(1.03); }
    70%  { transform: rotate(-5deg) scale(1.02); }
    80%  { transform: rotate(5deg) scale(1.01); }
    90%  { transform: rotate(-2deg) scale(1.005); }
    100% { transform: rotate(0deg) scale(1); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }

  .ball-wrap.shaking { animation: shake 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
  .ball-wrap.floating { animation: float 3s ease-in-out infinite; }

  /* Ripple */
  @keyframes ripple {
    0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(2.2); opacity: 0; }
  }

  .ball-ripple {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 240px;
    height: 240px;
    border-radius: 50%;
    border: 2px solid var(--accent);
    pointer-events: none;
    animation: ripple 1s ease-out forwards;
    transform-origin: center;
  }

  /* Input area */
  .input-area {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .input-label {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.05em;
    text-align: center;
  }

  .input-group {
    display: flex;
    gap: 10px;
  }

  .question-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    caret-color: var(--accent2);
  }

  .question-input::placeholder { color: var(--muted); }

  .question-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,92,191,0.15);
  }

  .ask-btn {
    background: linear-gradient(135deg, var(--accent), #5a3fa0);
    border: none;
    border-radius: 12px;
    padding: 12px 20px;
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    white-space: nowrap;
    letter-spacing: 0.03em;
    box-shadow: 0 4px 16px rgba(124,92,191,0.35);
  }

  .ask-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 24px rgba(124,92,191,0.5);
  }

  .ask-btn:active:not(:disabled) {
    transform: translateY(0px);
  }

  .ask-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* Answer display */
  .answer-card {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 24px;
    text-align: center;
    min-height: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: border-color 0.3s, box-shadow 0.3s;
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }

  .answer-card.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
    transition: opacity 0.4s, transform 0.4s, border-color 0.3s, box-shadow 0.3s;
  }

  .answer-card.positive {
    border-color: rgba(110, 231, 183, 0.4);
    box-shadow: 0 0 20px rgba(110, 231, 183, 0.08);
  }
  .answer-card.negative {
    border-color: rgba(248, 113, 113, 0.4);
    box-shadow: 0 0 20px rgba(248, 113, 113, 0.08);
  }
  .answer-card.neutral {
    border-color: rgba(147, 197, 253, 0.4);
    box-shadow: 0 0 20px rgba(147, 197, 253, 0.08);
  }

  .answer-type-badge {
    font-size: 11px;
    letter-spacing: 0.08em;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-positive { background: rgba(110,231,183,0.15); color: var(--positive); }
  .badge-negative { background: rgba(248,113,113,0.15); color: var(--negative); }
  .badge-neutral  { background: rgba(147,197,253,0.15); color: var(--neutral); }

  .answer-text {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.04em;
    line-height: 1.4;
  }
  .answer-text.positive { color: var(--positive); }
  .answer-text.negative { color: var(--negative); }
  .answer-text.neutral  { color: var(--neutral); }

  .answer-question {
    font-size: 12px;
    color: var(--muted);
    font-style: italic;
    margin-top: 2px;
  }

  /* History */
  .history-section {
    width: 100%;
  }

  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .history-title {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.05em;
    font-weight: 600;
  }

  .clear-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 4px 10px;
    color: var(--muted);
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .clear-btn:hover { color: var(--negative); border-color: var(--negative); }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 240px;
    overflow-y: auto;
    padding-right: 4px;
  }

  .history-list::-webkit-scrollbar { width: 4px; }
  .history-list::-webkit-scrollbar-track { background: transparent; }
  .history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .history-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .history-q {
    color: var(--muted);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .history-a {
    font-weight: 600;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .history-a.positive { color: var(--positive); }
  .history-a.negative { color: var(--negative); }
  .history-a.neutral  { color: var(--neutral); }

  .empty-history {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 20px;
    opacity: 0.6;
  }

  /* Hint text */
  .hint {
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    letter-spacing: 0.03em;
  }

  @media (max-width: 400px) {
    .ball-wrap { width: 200px; height: 200px; }
    .ball-number { width: 76px; height: 76px; }
    .crystal-window { width: 76px; height: 76px; }
    .ball-number span { font-size: 34px; }
    .crystal-answer { font-size: 8px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="container">
  <div class="title">
    <h1>✦ 神奇 8 号球 ✦</h1>
    <p>提问，让命运之球给出答案</p>
  </div>

  <div class="ball-wrap floating" id="ballWrap">
    <div class="ball" id="ball">
      <div class="ball-number" id="ballNumber">
        <span>8</span>
      </div>
      <div class="crystal-window" id="crystalWindow">
        <div class="crystal-answer" id="crystalAnswer"></div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-label">输入你的是非问题</div>
    <div class="input-group">
      <input
        type="text"
        id="questionInput"
        class="question-input"
        placeholder="例：我今天会很顺利吗？"
        maxlength="80"
        autocomplete="off"
      />
      <button class="ask-btn" id="askBtn">摇一摇</button>
    </div>
    <div class="hint" id="hintText">点击摇晃8号球，或按回车键</div>
  </div>

  <div class="answer-card" id="answerCard">
    <div class="answer-type-badge" id="answerBadge"></div>
    <div class="answer-text" id="answerText"></div>
    <div class="answer-question" id="answerQuestion"></div>
  </div>

  <div class="history-section" id="historySection" style="display:none;">
    <div class="history-header">
      <span class="history-title">历史记录</span>
      <button class="clear-btn" id="clearBtn">清除</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
(function() {
  "use strict";

  var ANSWERS = [
    { text: "确定无疑", type: "positive" },
    { text: "毋庸置疑", type: "positive" },
    { text: "当然如此", type: "positive" },
    { text: "是的，绝对是", type: "positive" },
    { text: "可以依靠它", type: "positive" },
    { text: "展望良好", type: "positive" },
    { text: "迹象指向是", type: "positive" },
    { text: "前景看好", type: "positive" },
    { text: "极有可能", type: "positive" },
    { text: "答案是肯定的", type: "positive" },
    { text: "不要依靠它", type: "negative" },
    { text: "我的回答是否定的", type: "negative" },
    { text: "我的消息不好", type: "negative" },
    { text: "非常存疑", type: "negative" },
    { text: "前景不佳", type: "negative" },
    { text: "现在难以预测", type: "neutral" },
    { text: "集中精力再问一次", type: "neutral" },
    { text: "稍后再问", type: "neutral" },
    { text: "目前无法预知", type: "neutral" },
    { text: "现在不要指望它", type: "neutral" }
  ];

  var BADGE_LABELS = { positive: "肯定", negative: "否定", neutral: "模糊" };
  var STORAGE_KEY = "magic8_history";
  var MAX_HISTORY = 20;

  var ballWrap = document.getElementById("ballWrap");
  var ball = document.getElementById("ball");
  var ballNumber = document.getElementById("ballNumber");
  var crystalWindow = document.getElementById("crystalWindow");
  var crystalAnswer = document.getElementById("crystalAnswer");
  var questionInput = document.getElementById("questionInput");
  var askBtn = document.getElementById("askBtn");
  var hintText = document.getElementById("hintText");
  var answerCard = document.getElementById("answerCard");
  var answerBadge = document.getElementById("answerBadge");
  var answerText = document.getElementById("answerText");
  var answerQuestion = document.getElementById("answerQuestion");
  var historySection = document.getElementById("historySection");
  var historyList = document.getElementById("historyList");
  var clearBtn = document.getElementById("clearBtn");

  var isShaking = false;
  var currentAnswer = null;

  function getRandomAnswer() {
    var idx = Math.floor(Math.random() * ANSWERS.length);
    return ANSWERS[idx];
  }

  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return [];
  }

  function saveHistory(history) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) {}
  }

  function addToHistory(question, answer) {
    var history = loadHistory();
    history.unshift({ question: question, answer: answer.text, type: answer.type, time: Date.now() });
    if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
    saveHistory(history);
  }

  function renderHistory() {
    var history = loadHistory();
    if (history.length === 0) {
      historySection.style.display = "none";
      return;
    }
    historySection.style.display = "block";
    var html = "";
    for (var i = 0; i < history.length; i++) {
      var item = history[i];
      var q = item.question.length > 24 ? item.question.slice(0, 24) + "…" : item.question;
      html += '<div class="history-item">' +
        '<span class="history-q">' + escapeHtml(q) + '</span>' +
        '<span class="history-a ' + item.type + '">' + escapeHtml(item.answer) + '</span>' +
        '</div>';
    }
    historyList.innerHTML = html;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function addRipple() {
    var existing = ball.querySelectorAll(".ball-ripple");
    for (var i = 0; i < existing.length; i++) {
      existing[i].parentNode.removeChild(existing[i]);
    }
    var ripple = document.createElement("div");
    ripple.className = "ball-ripple";
    ball.appendChild(ripple);
    setTimeout(function() {
      if (ripple.parentNode) ripple.parentNode.removeChild(ripple);
    }, 1000);
  }

  function showCrystalAnswer(answer) {
    crystalAnswer.textContent = answer.text;
    crystalAnswer.className = "crystal-answer " + answer.type;
    crystalWindow.className = "crystal-window visible";
    ballNumber.style.opacity = "0";
    ballNumber.style.transition = "opacity 0.3s";
  }

  function hideCrystalAnswer() {
    crystalWindow.className = "crystal-window";
    setTimeout(function() {
      ballNumber.style.opacity = "1";
    }, 300);
  }

  function showAnswerCard(question, answer) {
    var typeClass = answer.type;
    answerBadge.className = "answer-type-badge badge-" + typeClass;
    answerBadge.textContent = BADGE_LABELS[typeClass];
    answerText.className = "answer-text " + typeClass;
    answerText.textContent = answer.text;
    answerQuestion.textContent = question ? "「" + question + "」" : "";
    answerCard.className = "answer-card visible " + typeClass;
  }

  function shake() {
    if (isShaking) return;

    var question = questionInput.value.trim();
    if (!question) {
      questionInput.focus();
      questionInput.style.borderColor = "var(--negative)";
      setTimeout(function() {
        questionInput.style.borderColor = "";
      }, 1000);
      hintText.textContent = "请先输入你的问题 ~";
      hintText.style.color = "var(--negative)";
      setTimeout(function() {
        hintText.textContent = "点击摇晃8号球，或按回车键";
        hintText.style.color = "";
      }, 2000);
      return;
    }

    isShaking = true;
    askBtn.disabled = true;
    ballWrap.classList.remove("floating");

    hideCrystalAnswer();

    setTimeout(function() {
      ballWrap.classList.add("shaking");
      addRipple();

      setTimeout(function() {
        var answer = getRandomAnswer();
        currentAnswer = answer;

        showCrystalAnswer(answer);
        showAnswerCard(question, answer);
        addToHistory(question, answer);
        renderHistory();

        ballWrap.classList.remove("shaking");
        ballWrap.classList.add("floating");

        isShaking = false;
        askBtn.disabled = false;
        hintText.textContent = "再摇一次？";
      }, 900);
    }, 50);
  }

  function clearHistory() {
    localStorage.removeItem(STORAGE_KEY);
    historySection.style.display = "none";
    historyList.innerHTML = "";
  }

  askBtn.addEventListener("click", shake);

  ballWrap.addEventListener("click", function() {
    var question = questionInput.value.trim();
    if (question) {
      shake();
    } else {
      questionInput.focus();
    }
  });

  questionInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      e.preventDefault();
      shake();
    }
  });

  clearBtn.addEventListener("click", clearHistory);

  // Init
  renderHistory();

}());
</script>
</body>
</html>
