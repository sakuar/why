<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>圆的家族 · 正多边形 / 扇形 / 弓形 / 圆环</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#070912;color:#e8eef7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  .wrap{width:100%;max-width:1240px;padding:0 18px;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:14px 2px 10px;}
  .top h1{font-size:18px;font-weight:800;letter-spacing:.5px;background:linear-gradient(90deg,#ffd166,#56b6ff,#b98cff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .top .back{font-size:12px;color:#8090a8;text-decoration:none;border:1px solid #222840;border-radius:8px;padding:6px 11px;}
  .chips{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap;}
  .chip{flex:1;min-width:100px;display:flex;align-items:center;gap:7px;justify-content:center;font-size:13px;padding:11px 8px;border-radius:11px;background:#0e1322;border:1px solid #232c44;color:#aab6cc;cursor:pointer;transition:.14s;}
  .chip:hover{border-color:#3a445e;color:#e8eef7;}
  .chip.on{background:#6c63ff;border-color:#6c63ff;color:#fff;font-weight:700;}
  .work{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:stretch;}
  @media(max-width:780px){.work{grid-template-columns:1fr;}}
  #stage{position:relative;min-width:0;}
  canvas{width:100%;height:100%;display:block;background:radial-gradient(ellipse at 50% 42%,#0e1426,#06070d 80%);border:1px solid #1c2236;border-radius:14px;touch-action:none;}
  .controls{background:#0e1322;border:1px solid #232c44;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;}
  .controls .ch{font-size:12px;color:#8090a8;font-weight:600;letter-spacing:1px;margin-bottom:12px;}
  .slider{margin-bottom:14px;}.slider:last-child{margin-bottom:0;}
  .slider .sl-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;}
  .slider .sl-top .nm{color:#cfd8ea;}
  .slider .sl-top .val{color:#56b6ff;font-weight:700;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:#232c44;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;box-shadow:0 0 0 1px #6c63ff;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;}
  .hint{font-size:12px;color:#5a6680;line-height:1.6;border-top:1px solid #1a2138;padding-top:13px;}
  .info{margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:780px){.info{grid-template-columns:1fr;}}
  .readout{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;grid-column:1 / -1;}
  .readout .cell{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:14px 12px;text-align:center;}
  .readout .cell .k{font-size:11.5px;color:#8090a8;margin-bottom:6px;}
  .readout .cell .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:#56b6ff;}
  .readout .cell.hi .v{color:#ffd166;}.readout .cell.ok .v{color:#56d6a8;}
  .readout .cell .u{font-size:11px;color:#5a6680;margin-top:5px;}
  .card{background:#0e1322;border:1px solid #232c44;border-radius:12px;padding:16px 18px;}
  .card .ttl{font-size:13px;font-weight:800;color:#ffd166;margin-bottom:9px;}
  .card .eq{font-size:18px;line-height:1.8;color:#e8eef7;font-family:"Cambria Math","Times New Roman",Georgia,serif;}
  .card .eq sup{font-size:62%;}.card .eq .hl{color:#ffd166;font-weight:700;}
  .card .nt{font-size:13.5px;color:#9aa6bd;line-height:1.8;}.card .nt b{color:#cdd6e8;}
  footer{color:#5a6680;font-size:12px;text-align:center;padding:22px 0 36px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>⭕ 圆的家族</h1><a class="back" href="index.html">← 返回</a></div>
  <div class="chips" id="chips"></div>
  <div class="work">
    <div id="stage"><canvas id="cv" width="900" height="540"></canvas></div>
    <div class="controls">
      <div><div class="ch">参数调节</div><div id="params"></div></div>
      <div class="hint" id="hint"></div>
    </div>
  </div>
  <div class="info">
    <div class="readout">
      <div class="cell"><div class="k" id="k0">—</div><div class="v" id="r0">—</div></div>
      <div class="cell hi"><div class="k" id="k1">—</div><div class="v" id="r1">—</div></div>
      <div class="cell ok"><div class="k">面积</div><div class="v" id="r2">—</div></div>
    </div>
    <div class="card"><div class="ttl">公式</div><div class="eq" id="eq"></div></div>
    <div class="card"><div class="ttl">怎么理解</div><div class="nt" id="note"></div></div>
  </div>
  <footer>正多边形、扇形、弓形、圆环 —— 都是圆的亲戚 · 纯前端单文件教学</footer>
</div>
<script>
"use strict";
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var DPR=Math.max(1,Math.min(2,window.devicePixelRatio||1));
var W=900,H=540;
function fit(){var st=document.getElementById("stage");var cw=st.clientWidth||900;W=cw;H=Math.round(cw*0.60);if(H<320)H=320;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0);}
var PI=Math.PI,Vw={ox:0,oy:0,s:40};
function fitView(x0,x1,y0,y1){var p=30,sx=(W-2*p)/(x1-x0),sy=(H-2*p)/(y1-y0),s=Math.min(sx,sy);Vw.s=s;Vw.ox=W/2-(x0+x1)/2*s;Vw.oy=H/2+(y0+y1)/2*s;}
function PX(x){return Vw.ox+x*Vw.s;}function PY(y){return Vw.oy-y*Vw.s;}
function circleP(cx,cy,r,col,w,dash,fill){ctx.beginPath();ctx.arc(PX(cx),PY(cy),r*Vw.s,0,2*PI);if(fill){ctx.fillStyle=fill;ctx.fill();}if(col){ctx.strokeStyle=col;ctx.lineWidth=w||2;ctx.setLineDash(dash||[]);ctx.stroke();ctx.setLineDash([]);}}
function polyP(pts,fill,stroke,w){ctx.beginPath();ctx.moveTo(PX(pts[0][0]),PY(pts[0][1]));for(var i=1;i<pts.length;i++)ctx.lineTo(PX(pts[i][0]),PY(pts[i][1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=w||2;ctx.stroke();}}
function lineP(x1,y1,x2,y2,col,w,dash){ctx.strokeStyle=col;ctx.lineWidth=w||1.5;ctx.setLineDash(dash||[]);ctx.beginPath();ctx.moveTo(PX(x1),PY(y1));ctx.lineTo(PX(x2),PY(y2));ctx.stroke();ctx.setLineDash([]);}
function lbl(txt,x,y,col,size){ctx.fillStyle=col;ctx.font="bold "+(size||13)+"px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(txt,PX(x),PY(y));}
var BL="rgba(86,182,255,.30)",BLs="#56b6ff",YE="#ffd166",GR="#56d6a8",PU="#b98cff";
var idx=0,P={};

var CONCEPTS=[
{ id:"polygon",emoji:"⬡",name:"正多边形",
  params:[{k:"n",label:"边数 n",min:3,max:30,step:1,def:6},{k:"r",label:"外接圆半径 r",min:2,max:5,step:0.5,def:4}],
  read:function(){return ["边数 n",P.n.toFixed(0),"逼近 πr²",(PI*P.r*P.r).toFixed(2)];},
  area:function(){return 0.5*P.n*P.r*P.r*Math.sin(2*PI/P.n);},
  eq:function(){return '面积 = ½ · n · r² · sin(360°/n) = <span class="hl">'+this.area().toFixed(3)+'</span>　(n→∞ 时 → πr² = '+(PI*P.r*P.r).toFixed(2)+')';},
  hint:"边数越多，正多边形越贴近外接圆。",
  note:'正 n 边形 = n 个等腰三角形拼成。面积 = <b>½ × 周长 × 边心距</b>（边心距 = 中心到边的垂距）。<br>边数 n 越大，越贴近圆 —— 这正是<b>圆面积 πr² 的另一种由来</b>（无限多条边）。',
  draw:function(){
    var n=P.n,r=P.r;fitView(-r-0.6,r+0.6,-r-0.6,r+0.6);
    circleP(0,0,r,"rgba(120,140,180,.45)",1.4,[6,5]);
    var pts=[];for(var i=0;i<n;i++){var a=-PI/2+i*2*PI/n;pts.push([r*Math.cos(a),r*Math.sin(a)]);}
    polyP(pts,BL,BLs,2.4);
    // 一个扇形三角形 + 边心距
    var a0=-PI/2,a1=-PI/2+2*PI/n;
    lineP(0,0,r*Math.cos(a0),r*Math.sin(a0),YE,1.4);
    lineP(0,0,r*Math.cos(a1),r*Math.sin(a1),YE,1.4);
    var mx=(r*Math.cos(a0)+r*Math.cos(a1))/2,my=(r*Math.sin(a0)+r*Math.sin(a1))/2;
    lineP(0,0,mx,my,GR,1.6,[4,3]);
    lbl("边心距",mx*0.5-0.3,my*0.5,GR,11);
    lbl("r",r*Math.cos(a0)*0.5,r*Math.sin(a0)*0.5+0.3,YE,12);
  }
},
{ id:"sector",emoji:"🍕",name:"扇形",
  params:[{k:"r",label:"半径 r",min:2,max:5,step:0.5,def:4},{k:"deg",label:"圆心角 °",min:10,max:350,step:5,def:90}],
  read:function(){return ["圆心角",P.deg.toFixed(0)+"°","弧长",(P.r*P.deg*PI/180).toFixed(2)];},
  area:function(){return 0.5*P.r*P.r*(P.deg*PI/180);},
  eq:function(){return '面积 = (θ/360°) · πr² = ('+P.deg.toFixed(0)+'/360)·π·'+P.r.toFixed(1)+'² = <span class="hl">'+this.area().toFixed(3)+'</span>';},
  hint:"扇形是整个圆切下的一块「披萨」，占 θ/360。",
  note:'扇形是圆的<b>一块「披萨」</b>，占整圆的 θ/360。<br>面积 = (θ/360)·πr²，弧长 = (θ/360)·2πr = r·θ(弧度)。圆心角越大，那块越大。',
  draw:function(){
    var r=P.r,rad=P.deg*PI/180;fitView(-r-0.6,r+0.6,-r-0.6,r+0.6);
    circleP(0,0,r,"rgba(120,140,180,.4)",1.3,[6,5]);
    // 扇形
    ctx.beginPath();ctx.moveTo(PX(0),PY(0));
    var steps=Math.max(2,Math.round(rad/0.05));
    for(var i=0;i<=steps;i++){var a=i/steps*rad;ctx.lineTo(PX(r*Math.cos(a)),PY(r*Math.sin(a)));}
    ctx.closePath();ctx.fillStyle="rgba(86,182,255,.32)";ctx.fill();ctx.strokeStyle=BLs;ctx.lineWidth=2.2;ctx.stroke();
    lbl("θ="+P.deg.toFixed(0)+"°",r*0.32,r*0.18,YE,13);
    lbl("r",r*0.55,-0.3,"#9aa6bd",12);
  }
},
{ id:"segment",emoji:"🌙",name:"弓形",
  params:[{k:"r",label:"半径 r",min:2,max:5,step:0.5,def:4},{k:"deg",label:"圆心角 °",min:20,max:340,step:5,def:120}],
  read:function(){return ["圆心角",P.deg.toFixed(0)+"°","扇形−三角形",""];},
  area:function(){var rad=P.deg*PI/180;return 0.5*P.r*P.r*(rad-Math.sin(rad));},
  eq:function(){var rad=P.deg*PI/180;return '面积 = ½r²(θ − sinθ) = ½·'+P.r.toFixed(1)+'²·('+rad.toFixed(2)+'−'+Math.sin(rad).toFixed(2)+') = <span class="hl">'+this.area().toFixed(3)+'</span>';},
  hint:"弓形 = 扇形 减去 中间那个三角形。",
  note:'弓形是弦与弧之间的「月牙」。<br>它 = <b>扇形 − 三角形</b>：面积 = ½r²θ − ½r²sinθ = ½r²(θ − sinθ)。',
  draw:function(){
    var r=P.r,rad=P.deg*PI/180;fitView(-r-0.6,r+0.6,-r-0.6,r+0.6);
    circleP(0,0,r,"rgba(120,140,180,.4)",1.3,[6,5]);
    var A=[r*Math.cos(0),r*Math.sin(0)],B=[r*Math.cos(rad),r*Math.sin(rad)];
    // 三角形（扇形的两半径+弦）
    polyP([[0,0],A,B],"rgba(255,209,102,.14)",null);
    lineP(0,0,A[0],A[1],"rgba(255,209,102,.5)",1.2);lineP(0,0,B[0],B[1],"rgba(255,209,102,.5)",1.2);
    // 弓形区域（弧 + 弦）
    ctx.beginPath();var steps=Math.max(2,Math.round(rad/0.05));
    ctx.moveTo(PX(A[0]),PY(A[1]));
    for(var i=0;i<=steps;i++){var a=i/steps*rad;ctx.lineTo(PX(r*Math.cos(a)),PY(r*Math.sin(a)));}
    ctx.closePath();ctx.fillStyle="rgba(86,214,168,.40)";ctx.fill();ctx.strokeStyle=GR;ctx.lineWidth=2.2;ctx.stroke();
    lbl("弓形",((A[0]+B[0])/2+r*Math.cos(rad/2))/2,((A[1]+B[1])/2+r*Math.sin(rad/2))/2,GR,12);
  }
},
{ id:"annulus",emoji:"⭕",name:"圆环",
  params:[{k:"R",label:"外半径 R",min:3,max:6,step:0.5,def:4.5},{k:"r",label:"内半径 r",min:0.5,max:5,step:0.5,def:2.5}],
  read:function(){return ["外 πR²",(PI*P.R*P.R).toFixed(2),"内 πr²",(PI*Math.min(P.r,P.R-0.3)*Math.min(P.r,P.R-0.3)).toFixed(2)];},
  area:function(){var r=Math.min(P.r,P.R-0.3);return PI*(P.R*P.R-r*r);},
  eq:function(){var r=Math.min(P.r,P.R-0.3);return '面积 = πR² − πr² = π(R²−r²) = <span class="hl">'+this.area().toFixed(3)+'</span>';},
  hint:"圆环就是大圆挖掉一个同心小圆。",
  note:'圆环（环形）= <b>大圆挖掉一个同心小圆</b>。<br>面积 = 大圆 − 小圆 = πR² − πr² = <b>π(R² − r²)</b>。像垫圈、甜甜圈的俯视轮廓。',
  draw:function(){
    var R=P.R,r=Math.min(P.r,P.R-0.3);fitView(-R-0.6,R+0.6,-R-0.6,R+0.6);
    ctx.beginPath();ctx.arc(PX(0),PY(0),R*Vw.s,0,2*PI);ctx.arc(PX(0),PY(0),r*Vw.s,0,2*PI,true);
    ctx.fillStyle="rgba(86,182,255,.32)";ctx.fill("evenodd");
    circleP(0,0,R,BLs,2.2);circleP(0,0,r,PU,2);
    lineP(0,0,R*Math.cos(-0.6),R*Math.sin(-0.6),YE,1.4);lbl("R",R*0.5*Math.cos(-0.6),R*0.5*Math.sin(-0.6)+0.3,YE,12);
    lineP(0,0,r*Math.cos(2.4),r*Math.sin(2.4),PU,1.4);lbl("r",r*0.5*Math.cos(2.4),r*0.5*Math.sin(2.4),PU,12);
  }
}
];
function buildChips(){var box=document.getElementById("chips");box.innerHTML="";
  CONCEPTS.forEach(function(c,i){var el=document.createElement("div");el.className="chip"+(i===idx?" on":"");el.innerHTML='<span>'+c.emoji+'</span>'+c.name;el.onclick=function(){idx=i;location.hash=c.id;load();};box.appendChild(el);});}
function buildParams(){var box=document.getElementById("params");box.innerHTML="";P={};
  CONCEPTS[idx].params.forEach(function(pp){P[pp.k]=pp.def;var w=document.createElement("div");w.className="slider";
    var d=pp.k==="n"||pp.k==="deg"?pp.def.toFixed(0):pp.def.toFixed(1);
    w.innerHTML='<div class="sl-top"><span class="nm">'+pp.label+'</span><span class="val" id="v_'+pp.k+'">'+d+'</span></div><input type="range" id="r_'+pp.k+'" min="'+pp.min+'" max="'+pp.max+'" step="'+pp.step+'" value="'+pp.def+'">';
    box.appendChild(w);var inp=w.querySelector("input");
    inp.oninput=function(){P[pp.k]=parseFloat(inp.value);document.getElementById("v_"+pp.k).textContent=(pp.k==="n"||pp.k==="deg")?P[pp.k].toFixed(0):P[pp.k].toFixed(1);draw();};});}
function draw(){ctx.clearRect(0,0,W,H);var c=CONCEPTS[idx];c.draw();
  document.getElementById("eq").innerHTML=c.eq();document.getElementById("note").innerHTML=c.note;document.getElementById("hint").textContent=c.hint;
  var r=c.read();document.getElementById("k0").textContent=r[0];document.getElementById("r0").textContent=r[1];
  document.getElementById("k1").textContent=r[2];document.getElementById("r1").textContent=r[3];document.getElementById("r2").textContent=c.area().toFixed(2);}
function load(){buildChips();buildParams();draw();}
window.addEventListener("resize",function(){fit();draw();});
(function(){var hs=(location.hash||"").replace("#","");for(var i=0;i<CONCEPTS.length;i++)if(CONCEPTS[i].id===hs)idx=i;})();
fit();load();
</script>
</body>
</html>
