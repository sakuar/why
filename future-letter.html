<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给未来的信</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #faf8f5;
    --surface: #ffffff;
    --surface2: #f5f1eb;
    --accent: #c8956c;
    --accent2: #e8b89a;
    --text: #3d3530;
    --text2: #7a6e68;
    --text3: #b0a49e;
    --border: #e8e0d8;
    --locked: #8b9dc3;
    --locked-bg: #eef1f8;
    --shadow: 0 4px 24px rgba(100,80,60,0.10);
    --shadow2: 0 2px 8px rgba(100,80,60,0.07);
    --radius: 18px;
    --radius-sm: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    min-height: 100vh;
    line-height: 1.7;
  }

  .back-link {
    position: fixed;
    top: 16px;
    left: 18px;
    font-size: 13px;
    color: var(--text3);
    text-decoration: none;
    z-index: 100;
    transition: color 0.2s;
    letter-spacing: 0.02em;
  }
  .back-link:hover { color: var(--accent); }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 60px 20px 60px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 40px;
    animation: fadeInDown 0.6s ease both;
  }
  .page-header .icon {
    font-size: 40px;
    display: block;
    margin-bottom: 12px;
    animation: floatIcon 3s ease-in-out infinite;
  }
  .page-header h1 {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.05em;
  }
  .page-header p {
    margin-top: 8px;
    font-size: 14px;
    color: var(--text2);
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    background: var(--surface2);
    border-radius: var(--radius);
    padding: 6px;
    animation: fadeIn 0.6s ease 0.1s both;
  }
  .tab-btn {
    flex: 1;
    padding: 10px 0;
    border: none;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text2);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.25s ease;
    letter-spacing: 0.03em;
  }
  .tab-btn.active {
    background: var(--surface);
    color: var(--accent);
    box-shadow: var(--shadow2);
    font-weight: 600;
  }
  .tab-btn:hover:not(.active) { color: var(--text); }

  /* PANEL */
  .panel { display: none; animation: fadeIn 0.35s ease both; }
  .panel.active { display: block; }

  /* WRITE PANEL */
  .write-form {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 28px;
  }
  .form-row { margin-bottom: 22px; }
  .form-label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 8px;
    letter-spacing: 0.04em;
  }
  .form-input {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }
  .form-input:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(200,149,108,0.12);
  }
  textarea.form-input {
    min-height: 200px;
    resize: vertical;
    line-height: 1.8;
  }

  .days-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 10px;
  }
  .day-btn {
    padding: 10px 0;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--bg);
    color: var(--text2);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }
  .day-btn:hover { border-color: var(--accent2); color: var(--accent); }
  .day-btn.selected {
    border-color: var(--accent);
    background: linear-gradient(135deg, #fdf0e8, #fae5d4);
    color: var(--accent);
    font-weight: 700;
  }

  .custom-days-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .custom-days-input {
    width: 90px;
    padding: 10px 12px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
    text-align: center;
  }
  .custom-days-input:focus { border-color: var(--accent2); }
  .custom-days-label { font-size: 14px; color: var(--text2); }

  .btn-submit {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--accent), #d4855a);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: all 0.25s ease;
    box-shadow: 0 4px 16px rgba(200,149,108,0.35);
  }
  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(200,149,108,0.45);
  }
  .btn-submit:active { transform: translateY(0); }

  /* LETTERS PANEL */
  .letters-empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }
  .letters-empty .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .letters-empty p { font-size: 14px; }

  .letter-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow2);
    margin-bottom: 16px;
    overflow: hidden;
    transition: box-shadow 0.25s, transform 0.25s;
    animation: fadeInUp 0.4s ease both;
  }
  .letter-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }

  .letter-card-header {
    padding: 18px 22px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .letter-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .letter-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 20px;
    flex-shrink: 0;
  }
  .letter-status.locked {
    background: var(--locked-bg);
    color: var(--locked);
  }
  .letter-status.unlocked {
    background: #edf7f1;
    color: #5a9e78;
  }

  .letter-card-meta {
    padding: 0 22px 14px;
    font-size: 13px;
    color: var(--text3);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .letter-countdown {
    padding: 12px 22px;
    background: var(--locked-bg);
    font-size: 13px;
    color: var(--locked);
    font-weight: 500;
  }
  .countdown-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--locked);
  }

  .letter-actions {
    padding: 12px 22px;
    display: flex;
    gap: 8px;
    border-top: 1px solid var(--border);
  }
  .btn-read {
    padding: 8px 18px;
    border: none;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, #5a9e78, #4a8a68);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }
  .btn-read:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-delete {
    padding: 8px 14px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text3);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-delete:hover { border-color: #e07070; color: #e07070; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(40,30,25,0.45);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }
  .modal-overlay.show {
    opacity: 1;
    pointer-events: all;
  }
  .modal {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: 0 16px 60px rgba(40,30,25,0.22);
    max-width: 600px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    transform: scale(0.94) translateY(10px);
    transition: transform 0.3s ease;
  }
  .modal-overlay.show .modal { transform: scale(1) translateY(0); }

  .modal-header {
    padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title { font-size: 18px; font-weight: 700; color: var(--text); }
  .modal-close {
    width: 32px; height: 32px;
    border: none; background: var(--surface2);
    border-radius: 50%; cursor: pointer;
    font-size: 16px; color: var(--text2);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .modal-close:hover { background: var(--border); color: var(--text); }

  .modal-meta {
    padding: 16px 28px 8px;
    font-size: 13px;
    color: var(--text3);
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }

  .modal-body {
    padding: 16px 28px 28px;
    font-size: 15px;
    line-height: 1.9;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s ease;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* CONFIRM DIALOG */
  .confirm-overlay {
    position: fixed;
    inset: 0;
    background: rgba(40,30,25,0.4);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .confirm-overlay.show { opacity: 1; pointer-events: all; }
  .confirm-box {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 28px;
    max-width: 340px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(40,30,25,0.2);
    transform: scale(0.95);
    transition: transform 0.25s ease;
  }
  .confirm-overlay.show .confirm-box { transform: scale(1); }
  .confirm-box h3 { font-size: 17px; margin-bottom: 10px; }
  .confirm-box p { font-size: 14px; color: var(--text2); margin-bottom: 22px; }
  .confirm-btns { display: flex; gap: 10px; }
  .confirm-btns button {
    flex: 1; padding: 10px;
    border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: all 0.2s; border: none;
  }
  .confirm-cancel { background: var(--surface2); color: var(--text2); }
  .confirm-ok { background: #e07070; color: #fff; }
  .confirm-cancel:hover { background: var(--border); }
  .confirm-ok:hover { background: #cc5c5c; }

  /* PAPER TEXTURE on letter */
  .letter-paper {
    background:
      repeating-linear-gradient(
        transparent,
        transparent 27px,
        rgba(200,149,108,0.08) 28px
      ),
      var(--surface);
  }

  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  @media (max-width: 480px) {
    .container { padding: 52px 14px 50px; }
    .days-grid { grid-template-columns: repeat(3, 1fr); }
    .write-form { padding: 20px 16px; }
    .modal-header, .modal-meta, .modal-body { padding-left: 18px; padding-right: 18px; }
    .letter-card-header, .letter-card-meta, .letter-countdown, .letter-actions { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="container">
  <div class="page-header">
    <span class="icon">✉️</span>
    <h1>给未来的信</h1>
    <p>写下此刻的心声，让未来的自己收到</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tabWrite">✍️ 写信</button>
    <button class="tab-btn" id="tabLetters">📬 信箱</button>
  </div>

  <!-- WRITE PANEL -->
  <div class="panel active" id="panelWrite">
    <div class="write-form">
      <div class="form-row">
        <label class="form-label" for="letterTitle">信件标题</label>
        <input class="form-input" type="text" id="letterTitle" placeholder="写一个让未来的你一眼认出的标题…" maxlength="60">
      </div>
      <div class="form-row">
        <label class="form-label" for="letterContent">信件内容</label>
        <textarea class="form-input letter-paper" id="letterContent" placeholder="亲爱的未来的我，&#10;&#10;此刻的我想告诉你……"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">多少天后解封</label>
        <div class="days-grid" id="daysGrid">
          <button class="day-btn" data-days="7">7 天</button>
          <button class="day-btn" data-days="14">14 天</button>
          <button class="day-btn selected" data-days="30">30 天</button>
          <button class="day-btn" data-days="60">60 天</button>
          <button class="day-btn" data-days="100">100 天</button>
          <button class="day-btn" data-days="180">180 天</button>
          <button class="day-btn" data-days="365">1 年</button>
          <button class="day-btn" data-days="0">自定义</button>
        </div>
        <div class="custom-days-row" id="customDaysRow" style="display:none;">
          <input class="custom-days-input" type="number" id="customDaysInput" min="1" max="3650" placeholder="天数">
          <span class="custom-days-label">天后解封</span>
        </div>
      </div>
      <button class="btn-submit" id="btnSave">封存这封信 🔒</button>
    </div>
  </div>

  <!-- LETTERS PANEL -->
  <div class="panel" id="panelLetters">
    <div id="lettersContainer"></div>
  </div>
</div>

<!-- READ MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle"></div>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-meta" id="modalMeta"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- CONFIRM DIALOG -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>确认删除</h3>
    <p>这封信将被永久销毁，无法恢复。</p>
    <div class="confirm-btns">
      <button class="confirm-cancel" id="confirmCancel">取消</button>
      <button class="confirm-ok" id="confirmOk">删除</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ── constants ── */
  var STORAGE_KEY = "future_letters_v1";
  var SELECTED_DAYS = 30;
  var confirmCallback = null;
  var countdownTimers = [];

  /* ── helpers ── */
  function $(id) { return document.getElementById(id); }

  function showToast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(function () { el.classList.remove("show"); }, 2500);
  }

  function formatDate(ts) {
    var d = new Date(ts);
    return d.getFullYear() + " 年 " + (d.getMonth() + 1) + " 月 " + d.getDate() + " 日";
  }

  function formatCountdown(ms) {
    if (ms <= 0) return "已解封";
    var s = Math.floor(ms / 1000);
    var days = Math.floor(s / 86400);
    var hours = Math.floor((s % 86400) / 3600);
    var mins = Math.floor((s % 3600) / 60);
    var secs = s % 60;
    if (days > 0) {
      return days + " 天 " + hours + " 小时 " + mins + " 分 " + secs + " 秒";
    }
    return hours + " 小时 " + mins + " 分 " + secs + " 秒";
  }

  function loadLetters() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveLetters(list) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
  }

  function isUnlocked(letter) {
    return Date.now() >= letter.unlockAt;
  }

  /* ── tabs ── */
  function switchTab(tabName) {
    var panels = { write: $("panelWrite"), letters: $("panelLetters") };
    var tabs = { write: $("tabWrite"), letters: $("tabLetters") };
    Object.keys(panels).forEach(function (k) {
      panels[k].classList.remove("active");
      tabs[k].classList.remove("active");
    });
    panels[tabName].classList.add("active");
    tabs[tabName].classList.add("active");
    if (tabName === "letters") {
      renderLetters();
    }
  }

  /* ── day selector ── */
  function initDaySelector() {
    var grid = $("daysGrid");
    var customRow = $("customDaysRow");

    grid.addEventListener("click", function (e) {
      var btn = e.target.closest(".day-btn");
      if (!btn) return;
      var days = parseInt(btn.getAttribute("data-days"), 10);
      grid.querySelectorAll(".day-btn").forEach(function (b) { b.classList.remove("selected"); });
      btn.classList.add("selected");
      if (days === 0) {
        customRow.style.display = "flex";
        SELECTED_DAYS = 0;
        $("customDaysInput").focus();
      } else {
        customRow.style.display = "none";
        SELECTED_DAYS = days;
      }
    });

    $("customDaysInput").addEventListener("input", function () {
      var v = parseInt(this.value, 10);
      SELECTED_DAYS = (isNaN(v) || v < 1) ? 0 : v;
    });
  }

  /* ── save letter ── */
  function saveLetter() {
    var title = $("letterTitle").value.trim();
    var content = $("letterContent").value.trim();
    var days = SELECTED_DAYS;

    if ($("daysGrid").querySelector("[data-days='0']").classList.contains("selected")) {
      days = parseInt($("customDaysInput").value, 10);
    }

    if (!title) { showToast("请填写信件标题"); return; }
    if (!content) { showToast("请写下信件内容"); return; }
    if (!days || days < 1) { showToast("请选择或输入有效的解封天数"); return; }

    var now = Date.now();
    var letter = {
      id: now + "_" + Math.random().toString(36).slice(2, 7),
      title: title,
      content: content,
      createdAt: now,
      days: days,
      unlockAt: now + days * 86400000
    };

    var list = loadLetters();
    list.unshift(letter);
    saveLetters(list);

    $("letterTitle").value = "";
    $("letterContent").value = "";

    showToast("信件已封存，" + days + " 天后解封 ✉️");
    switchTab("letters");
  }

  /* ── render letters ── */
  function renderLetters() {
    clearCountdownTimers();
    var container = $("lettersContainer");
    var list = loadLetters();

    if (list.length === 0) {
      container.innerHTML =
        '<div class="letters-empty">' +
        '<div class="empty-icon">📭</div>' +
        '<p>还没有封存的信件<br>去写一封给未来的自己吧</p>' +
        '</div>';
      return;
    }

    container.innerHTML = "";
    list.forEach(function (letter, idx) {
      var unlocked = isUnlocked(letter);
      var card = document.createElement("div");
      card.className = "letter-card";
      card.style.animationDelay = (idx * 0.05) + "s";

      var statusHtml = unlocked
        ? '<span class="letter-status unlocked">🔓 已解封</span>'
        : '<span class="letter-status locked">🔒 封存中</span>';

      var countdownHtml = unlocked
        ? ""
        : '<div class="letter-countdown">解封倒计时：<span class="countdown-value" id="cd_' + letter.id + '">' + formatCountdown(letter.unlockAt - Date.now()) + '</span></div>';

      var readBtn = unlocked
        ? '<button class="btn-read" data-id="' + letter.id + '">阅读这封信 📖</button>'
        : "";

      card.innerHTML =
        '<div class="letter-card-header">' +
        '  <div class="letter-title">' + escapeHtml(letter.title) + '</div>' +
        '  ' + statusHtml +
        '</div>' +
        '<div class="letter-card-meta">' +
        '  <span>写于 ' + formatDate(letter.createdAt) + '</span>' +
        '  <span>解封日期：' + formatDate(letter.unlockAt) + '（封存 ' + letter.days + ' 天）</span>' +
        '</div>' +
        countdownHtml +
        '<div class="letter-actions">' +
        '  ' + readBtn +
        '  <button class="btn-delete" data-id="' + letter.id + '">删除</button>' +
        '</div>';

      container.appendChild(card);

      if (!unlocked) {
        startCountdown(letter.id, letter.unlockAt);
      }
    });

    container.addEventListener("click", handleLetterClick);
  }

  function handleLetterClick(e) {
    var readBtn = e.target.closest(".btn-read");
    var delBtn = e.target.closest(".btn-delete");
    if (readBtn) {
      openLetter(readBtn.getAttribute("data-id"));
    } else if (delBtn) {
      openConfirm(delBtn.getAttribute("data-id"));
    }
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* ── countdown timers ── */
  function startCountdown(id, unlockAt) {
    var tid = setInterval(function () {
      var el = $("cd_" + id);
      if (!el) { clearInterval(tid); return; }
      var remaining = unlockAt - Date.now();
      if (remaining <= 0) {
        clearInterval(tid);
        renderLetters();
        return;
      }
      el.textContent = formatCountdown(remaining);
    }, 1000);
    countdownTimers.push(tid);
  }

  function clearCountdownTimers() {
    countdownTimers.forEach(function (tid) { clearInterval(tid); });
    countdownTimers = [];
  }

  /* ── open letter modal ── */
  function openLetter(id) {
    var list = loadLetters();
    var letter = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) { letter = list[i]; break; }
    }
    if (!letter || !isUnlocked(letter)) return;

    $("modalTitle").textContent = letter.title;
    $("modalMeta").innerHTML =
      '<span>写于 ' + formatDate(letter.createdAt) + '</span>' +
      '<span>解封于 ' + formatDate(letter.unlockAt) + '</span>' +
      '<span>封存了 ' + letter.days + ' 天</span>';
    $("modalBody").textContent = letter.content;
    $("modalOverlay").classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function closeModal() {
    $("modalOverlay").classList.remove("show");
    document.body.style.overflow = "";
  }

  /* ── confirm delete ── */
  function openConfirm(id) {
    confirmCallback = function () {
      var list = loadLetters().filter(function (l) { return l.id !== id; });
      saveLetters(list);
      showToast("信件已删除");
      renderLetters();
    };
    $("confirmOverlay").classList.add("show");
  }

  function closeConfirm() {
    $("confirmOverlay").classList.remove("show");
    confirmCallback = null;
  }

  /* ── event binding ── */
  function bindEvents() {
    $("tabWrite").addEventListener("click", function () { switchTab("write"); });
    $("tabLetters").addEventListener("click", function () { switchTab("letters"); });
    $("btnSave").addEventListener("click", saveLetter);
    $("modalClose").addEventListener("click", closeModal);
    $("modalOverlay").addEventListener("click", function (e) {
      if (e.target === $("modalOverlay")) closeModal();
    });
    $("confirmCancel").addEventListener("click", closeConfirm);
    $("confirmOk").addEventListener("click", function () {
      if (confirmCallback) confirmCallback();
      closeConfirm();
    });
    $("confirmOverlay").addEventListener("click", function (e) {
      if (e.target === $("confirmOverlay")) closeConfirm();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        closeModal();
        closeConfirm();
      }
    });
  }

  /* ── init ── */
  function init() {
    initDaySelector();
    bindEvents();
  }

  init();

})();
</script>
</body>
</html>
