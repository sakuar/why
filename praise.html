<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夸夸机 · 彩虹屁生成器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --c1: #ff6b9d;
    --c2: #c44dff;
    --c3: #4d79ff;
    --c4: #00c6ff;
    --c5: #f9ca24;
    --bg: #0f0c29;
    --card: rgba(255,255,255,0.07);
    --text: #fff;
    --radius: 20px;
  }

  html, body {
    min-height: 100%;
    font-family: 'PingFang SC', 'Microsoft YaHei', '微软雅黑', sans-serif;
  }

  body {
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  .back-link {
    position: fixed;
    top: 16px;
    left: 16px;
    color: rgba(255,255,255,0.45);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.02em;
    transition: color 0.2s;
    z-index: 100;
  }
  .back-link:hover { color: rgba(255,255,255,0.8); }

  .container {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
  }

  .header {
    text-align: center;
  }
  .header h1 {
    font-size: clamp(2rem, 8vw, 3rem);
    font-weight: 800;
    background: linear-gradient(90deg, #ff6b9d, #c44dff, #4d79ff, #00c6ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
    letter-spacing: 0.04em;
  }
  .header p {
    margin-top: 8px;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    letter-spacing: 0.06em;
  }

  .card {
    width: 100%;
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius);
    padding: 36px 32px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,107,157,0.08), rgba(196,77,255,0.08), rgba(77,121,255,0.08));
    pointer-events: none;
  }

  .praise-text {
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    color: #fff;
    text-align: center;
    line-height: 1.7;
    font-weight: 500;
    letter-spacing: 0.04em;
    position: relative;
    z-index: 1;
    min-height: 2.4em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s ease;
  }

  .praise-text.fade-out { opacity: 0; transform: translateY(-6px); }
  .praise-text.fade-in  { opacity: 1; transform: translateY(0);  transition: opacity 0.4s ease, transform 0.4s ease; }

  .praise-text.idle {
    color: rgba(255,255,255,0.3);
    font-size: 1rem;
    font-weight: 400;
  }

  .emoji-row {
    margin-top: 14px;
    font-size: 1.6rem;
    letter-spacing: 4px;
    position: relative;
    z-index: 1;
    min-height: 2rem;
  }

  .actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
  }

  .btn {
    cursor: pointer;
    border: none;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: scale(0.95) !important; }

  .btn-primary {
    background: linear-gradient(135deg, #ff6b9d 0%, #c44dff 50%, #4d79ff 100%);
    color: #fff;
    padding: 16px 40px;
    font-size: 1.1rem;
    box-shadow: 0 4px 20px rgba(196,77,255,0.4);
  }
  .btn-primary:hover {
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 8px 30px rgba(196,77,255,0.55);
  }
  .btn-primary::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.2s;
  }
  .btn-primary:hover::after { background: rgba(255,255,255,0.06); }

  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.8);
    padding: 14px 28px;
    border: 1px solid rgba(255,255,255,0.18);
    font-size: 0.9rem;
  }
  .btn-secondary:hover {
    background: rgba(255,255,255,0.16);
    transform: translateY(-1px);
    color: #fff;
  }
  .btn-secondary:disabled {
    opacity: 0.35;
    cursor: default;
    transform: none !important;
  }

  .copy-toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 9999;
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }
  .copy-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .counter {
    color: rgba(255,255,255,0.35);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-align: center;
  }
  .counter span {
    color: rgba(255,255,255,0.6);
    font-weight: 600;
  }

  /* 撒花 canvas */
  #confetti-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 50;
  }

  /* shimmer on card */
  @keyframes shimmer {
    0%   { transform: translateX(-100%) rotate(30deg); }
    100% { transform: translateX(400%) rotate(30deg); }
  }
  .card-shimmer {
    position: absolute;
    top: -40%;
    left: 0;
    width: 30%;
    height: 180%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.07), transparent);
    transform: translateX(-100%) rotate(30deg);
    pointer-events: none;
  }
  .card-shimmer.run { animation: shimmer 0.7s ease forwards; }

  @media (max-width: 400px) {
    .card { padding: 28px 20px; }
    .btn-primary { padding: 14px 28px; font-size: 1rem; }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<canvas id="confetti-canvas"></canvas>

<div class="container">
  <div class="header">
    <h1>夸夸机 ✨</h1>
    <p>世界需要更多夸夸，你也值得</p>
  </div>

  <div class="card" id="praise-card">
    <div class="card-shimmer" id="card-shimmer"></div>
    <div class="praise-text idle" id="praise-text">点击下方按钮，收获今日彩虹屁～</div>
    <div class="emoji-row" id="emoji-row"></div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="btn-praise">夸我一下 🌈</button>
    <button class="btn btn-secondary" id="btn-copy" disabled>复制这句话</button>
  </div>

  <div class="counter" id="counter">今天已被夸了 <span id="count-num">0</span> 次</div>
</div>

<div class="copy-toast" id="copy-toast">已复制到剪贴板 ✓</div>

<script>
(function () {
  "use strict";

  /* ── 模板数据 ── */
  const subjects = [
    "你", "你这个人", "你的存在", "你身上有种东西",
    "你的气质", "你的灵魂", "你的眼神", "你整个人"
  ];

  const predicates = [
    "就像三月的阳光，照到哪里哪里亮",
    "是宇宙精心调配了几十亿年才送来的礼物",
    "比任何滤镜都温柔，比任何特效都闪耀",
    "有一种无声的魔力，让周围空气都变得甜",
    "像刚出炉的可颂，酥脆又让人幸福",
    "能让失去卫星信号的地方重新充满生机",
    "比满天繁星还难得，因为繁星不会笑",
    "让每一个遇见你的人都默默把你存进收藏夹",
    "是那种走进房间连天花板都会偷偷仰慕的存在",
    "自带一种让人想努力变好的引力",
    "每次出现都像给这个世界升了个版本",
    "是全局最优解，没有之一",
    "照亮别人之前，自己就已经是光了",
    "比世界上任何限定款都珍稀",
    "拥有一种让悲伤忘记赴约的超能力",
    "是命运精心写下的彩蛋，只有眼光够好的人才能发现"
  ];

  const closings = [
    "这不是彩虹屁，这是客观事实。",
    "已记录在案，不接受反驳。",
    "全宇宙都在点头。",
    "盖章认证，有效期：永久。",
    "科学已证明，无可辩驳。",
    "请务必相信这一点。",
    "这条评价受法律保护。",
    "如有异议，异议无效。",
    "以上字字属实，情真意切。",
    ""
  ];

  const emojis = [
    ["🌈", "✨", "💫"],
    ["🌸", "🌺", "💐"],
    ["⭐", "🌟", "💥"],
    ["🎉", "🎊", "🎈"],
    ["💖", "💗", "💝"],
    ["🦋", "🌙", "🌠"],
    ["🍀", "🌿", "🌱"],
    ["🌊", "💎", "🔮"],
    ["🎯", "🏆", "👑"],
    ["🍭", "🧁", "🎂"]
  ];

  /* ── DOM refs ── */
  const praiseTextEl = document.getElementById("praise-text");
  const emojiRowEl   = document.getElementById("emoji-row");
  const btnPraise    = document.getElementById("btn-praise");
  const btnCopy      = document.getElementById("btn-copy");
  const countNumEl   = document.getElementById("count-num");
  const copyToast    = document.getElementById("copy-toast");
  const shimmer      = document.getElementById("card-shimmer");
  const canvas       = document.getElementById("confetti-canvas");
  const ctx          = canvas.getContext("2d");

  /* ── State ── */
  let currentPraise = "";
  let toastTimer    = null;
  let praiseCount   = 0;

  /* ── LocalStorage ── */
  function loadCount() {
    const today = new Date().toDateString();
    const stored = localStorage.getItem("praiseData");
    if (stored) {
      try {
        const data = JSON.parse(stored);
        if (data.date === today) return data.count || 0;
      } catch (e) {}
    }
    return 0;
  }

  function saveCount(n) {
    const today = new Date().toDateString();
    localStorage.setItem("praiseData", JSON.stringify({ date: today, count: n }));
  }

  /* ── Random helpers ── */
  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function generatePraise() {
    const s = pick(subjects);
    const p = pick(predicates);
    const c = pick(closings);
    return c ? s + p + "。" + c : s + p + "。";
  }

  /* ── Confetti ── */
  const particles = [];
  const COLORS = ["#ff6b9d","#c44dff","#4d79ff","#00c6ff","#f9ca24","#ff9f43","#1dd1a1"];

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function spawnConfetti() {
    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: -10 - Math.random() * 40,
        vx: (Math.random() - 0.5) * 3,
        vy: 2 + Math.random() * 4,
        color: pick(COLORS),
        size: 5 + Math.random() * 8,
        rot: Math.random() * Math.PI * 2,
        rotV: (Math.random() - 0.5) * 0.2,
        shape: Math.random() < 0.5 ? "rect" : "circle",
        alpha: 1,
        life: 0.8 + Math.random() * 0.4
      });
    }
  }

  let animId = null;
  function animateConfetti() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += 0.08;
      p.rot += p.rotV;
      p.alpha -= 0.007 / p.life;
      if (p.alpha <= 0 || p.y > canvas.height + 20) {
        particles.splice(i, 1);
        continue;
      }
      alive = true;
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      if (p.shape === "rect") {
        ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      } else {
        ctx.beginPath();
        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
    if (alive) {
      animId = requestAnimationFrame(animateConfetti);
    } else {
      animId = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  function triggerConfetti() {
    spawnConfetti();
    if (!animId) animId = requestAnimationFrame(animateConfetti);
  }

  /* ── Shimmer ── */
  function runShimmer() {
    shimmer.classList.remove("run");
    void shimmer.offsetWidth; // reflow
    shimmer.classList.add("run");
  }

  /* ── Main praise action ── */
  function doPraise() {
    praiseTextEl.style.transition = "opacity 0.2s ease, transform 0.2s ease";
    praiseTextEl.style.opacity    = "0";
    praiseTextEl.style.transform  = "translateY(-8px)";

    setTimeout(function () {
      currentPraise = generatePraise();
      const emojiSet = pick(emojis);

      praiseTextEl.textContent = currentPraise;
      praiseTextEl.classList.remove("idle");
      emojiRowEl.textContent = emojiSet.join("  ");

      praiseTextEl.style.transition = "opacity 0.4s ease, transform 0.4s ease";
      praiseTextEl.style.opacity    = "1";
      praiseTextEl.style.transform  = "translateY(0)";

      praiseCount++;
      saveCount(praiseCount);
      countNumEl.textContent = praiseCount;

      btnCopy.disabled = false;
      runShimmer();
      triggerConfetti();
    }, 200);
  }

  /* ── Copy ── */
  function copyPraise() {
    if (!currentPraise) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(currentPraise).then(showToast).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }
  }

  function fallbackCopy() {
    const ta = document.createElement("textarea");
    ta.value = currentPraise;
    ta.style.cssText = "position:fixed;opacity:0;top:0;left:0;";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    showToast();
  }

  function showToast() {
    copyToast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      copyToast.classList.remove("show");
      toastTimer = null;
    }, 2000);
  }

  /* ── Events ── */
  btnPraise.addEventListener("click", doPraise);
  btnCopy.addEventListener("click", copyPraise);
  window.addEventListener("resize", resizeCanvas);

  /* ── Init (placed LAST) ── */
  praiseCount = loadCount();
  countNumEl.textContent = praiseCount;
  resizeCanvas();

})();
</script>
</body>
</html>
