<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凯撒密码</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232638;
    --border: #2e3250;
    --accent: #6c63ff;
    --accent2: #ff6584;
    --text: #e8eaf6;
    --text-muted: #8b90b8;
    --green: #43e97b;
    --radius: 14px;
    --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    padding: 0;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 18px;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    z-index: 100;
    transition: color var(--transition);
    letter-spacing: 0.02em;
  }
  .back-link:hover { color: var(--accent); }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 54px 20px 60px;
  }

  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }
  .header p {
    color: var(--text-muted);
    font-size: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .card:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent)22;
  }

  .card-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    padding: 12px 14px;
    resize: vertical;
    min-height: 110px;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
    line-height: 1.6;
  }
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent)22;
  }
  textarea::placeholder { color: var(--text-muted); }
  textarea[readonly] {
    cursor: default;
    opacity: 0.92;
  }

  .shift-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 20px;
  }

  .shift-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .shift-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }
  .shift-display {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .shift-number {
    font-size: 28px;
    font-weight: 700;
    color: var(--accent);
    min-width: 44px;
    text-align: center;
    line-height: 1;
    transition: transform var(--transition);
  }
  .shift-number.pop {
    animation: pop 0.18s ease;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
  }
  .shift-arrows {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .arrow-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    width: 26px;
    height: 22px;
    cursor: pointer;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
    user-select: none;
  }
  .arrow-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .arrow-btn:active { transform: scale(0.92); }

  .slider-wrap {
    position: relative;
  }
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--surface2);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: 2px solid var(--bg);
    box-shadow: 0 2px 8px var(--accent)66;
    cursor: pointer;
    transition: transform var(--transition);
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); }
  input[type=range]::-moz-range-thumb {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: 2px solid var(--bg);
    box-shadow: 0 2px 8px var(--accent)66;
    cursor: pointer;
  }

  .slider-labels {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .alphabet-row {
    display: flex;
    gap: 4px;
    flex-wrap: nowrap;
    overflow-x: auto;
    margin-top: 18px;
    padding-bottom: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .alpha-pair {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 24px;
  }
  .alpha-char {
    font-size: 12px;
    font-weight: 600;
    width: 24px;
    height: 24px;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background var(--transition), color var(--transition);
  }
  .alpha-char.orig {
    background: var(--surface2);
    color: var(--text-muted);
  }
  .alpha-char.enc {
    background: var(--accent)33;
    color: var(--accent);
  }
  .alpha-arrow {
    font-size: 8px;
    color: var(--text-muted);
    line-height: 1;
  }

  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  @media (max-width: 520px) {
    .results-grid { grid-template-columns: 1fr; }
  }

  .result-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .result-card.enc-card { border-color: var(--accent)55; }
  .result-card.dec-card { border-color: var(--green)55; }
  .result-card:hover.enc-card { box-shadow: 0 0 0 2px var(--accent)22; }
  .result-card:hover.dec-card { box-shadow: 0 0 0 2px var(--green)22; }

  .result-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .result-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .enc-card .result-label { color: var(--accent); }
  .dec-card .result-label { color: var(--green); }

  .copy-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 11px;
    padding: 3px 9px;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { border-color: var(--green); color: var(--green); }

  .result-text {
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
    word-break: break-all;
    min-height: 42px;
    transition: opacity 0.15s;
  }
  .result-text.empty { color: var(--text-muted); font-style: italic; font-size: 13px; }

  .history-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 24px;
    margin-bottom: 20px;
  }
  .history-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .history-title {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }
  .clear-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 11px;
    padding: 3px 9px;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
  }
  .clear-btn:hover { border-color: var(--accent2); color: var(--accent2); }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 200px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .history-item {
    background: var(--surface2);
    border-radius: 8px;
    padding: 8px 12px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 6px 10px;
    align-items: start;
    cursor: pointer;
    transition: background var(--transition), border-color var(--transition);
    border: 1px solid transparent;
    font-size: 13px;
  }
  .history-item:hover { border-color: var(--accent); background: var(--accent)11; }
  .history-shift {
    background: var(--accent)33;
    color: var(--accent);
    font-weight: 700;
    border-radius: 5px;
    padding: 1px 7px;
    font-size: 12px;
    white-space: nowrap;
    align-self: center;
  }
  .history-texts {
    overflow: hidden;
  }
  .history-orig {
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-enc {
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-empty {
    color: var(--text-muted);
    font-style: italic;
    font-size: 13px;
    text-align: center;
    padding: 10px 0;
  }

  .save-btn {
    background: linear-gradient(135deg, var(--accent), #9b6dff);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 11px 24px;
    cursor: pointer;
    transition: opacity var(--transition), transform var(--transition), box-shadow var(--transition);
    font-family: inherit;
    box-shadow: 0 4px 16px var(--accent)44;
    letter-spacing: 0.03em;
  }
  .save-btn:hover { opacity: 0.88; box-shadow: 0 6px 24px var(--accent)66; transform: translateY(-1px); }
  .save-btn:active { transform: scale(0.97); }

  .badge {
    display: inline-block;
    background: var(--accent)22;
    color: var(--accent);
    border-radius: 6px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 600;
    margin-left: 6px;
    vertical-align: middle;
    animation: fadein 0.3s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .mode-tab {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    font-size: 13px;
    padding: 6px 16px;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
    font-weight: 500;
  }
  .mode-tab.active {
    background: var(--accent)22;
    border-color: var(--accent);
    color: var(--accent);
  }
  .mode-tab:hover:not(.active) { border-color: var(--text-muted); color: var(--text); }

  @media (max-width: 480px) {
    .page { padding: 50px 14px 50px; }
    .header h1 { font-size: 1.5rem; }
    .alphabet-row { gap: 2px; }
    .alpha-char { min-width: 20px; width: 20px; height: 20px; font-size: 11px; }
  }
</style>
</head>
<body>
<a href="index.html" class="back-link">← 入口</a>

<div class="page">
  <div class="header">
    <h1>凯撒密码</h1>
    <p>通过字母位移实现加密与解密，字母环绕，保留非字母字符</p>
  </div>

  <!-- Input -->
  <div class="card">
    <div class="card-label">输入文本</div>
    <textarea id="inputText" placeholder="在此输入要加密或解密的文本…" rows="4" spellcheck="false"></textarea>
  </div>

  <!-- Shift Control -->
  <div class="shift-card">
    <div class="shift-header">
      <span class="shift-title">位移量</span>
      <div class="shift-display">
        <div class="shift-arrows">
          <button class="arrow-btn" id="shiftUp" title="增加">▲</button>
          <button class="arrow-btn" id="shiftDown" title="减少">▼</button>
        </div>
        <span class="shift-number" id="shiftNumber">3</span>
      </div>
    </div>
    <div class="slider-wrap">
      <input type="range" id="shiftSlider" min="0" max="25" value="3">
      <div class="slider-labels">
        <span>0</span><span>5</span><span>10</span><span>15</span><span>20</span><span>25</span>
      </div>
    </div>

    <!-- Alphabet map -->
    <div class="alphabet-row" id="alphabetRow"></div>
  </div>

  <!-- Results -->
  <div class="results-grid">
    <div class="result-card enc-card">
      <div class="result-header">
        <span class="result-label">加密结果</span>
        <button class="copy-btn" id="copyEnc">复制</button>
      </div>
      <div class="result-text empty" id="encResult">等待输入…</div>
    </div>
    <div class="result-card dec-card">
      <div class="result-header">
        <span class="result-label">解密结果</span>
        <button class="copy-btn" id="copyDec">复制</button>
      </div>
      <div class="result-text empty" id="decResult">等待输入…</div>
    </div>
  </div>

  <!-- Save to history -->
  <div style="text-align:right;margin-bottom:20px;">
    <button class="save-btn" id="saveBtn">保存到历史</button>
  </div>

  <!-- History -->
  <div class="history-card">
    <div class="history-header">
      <span class="history-title">历史记录 <span id="historyCount"></span></span>
      <button class="clear-btn" id="clearHistory">清空</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ── DOM refs ── */
  var inputText    = document.getElementById("inputText");
  var shiftSlider  = document.getElementById("shiftSlider");
  var shiftNumber  = document.getElementById("shiftNumber");
  var shiftUp      = document.getElementById("shiftUp");
  var shiftDown    = document.getElementById("shiftDown");
  var encResult    = document.getElementById("encResult");
  var decResult    = document.getElementById("decResult");
  var copyEnc      = document.getElementById("copyEnc");
  var copyDec      = document.getElementById("copyDec");
  var saveBtn      = document.getElementById("saveBtn");
  var clearHistory = document.getElementById("clearHistory");
  var historyList  = document.getElementById("historyList");
  var historyCount = document.getElementById("historyCount");
  var alphabetRow  = document.getElementById("alphabetRow");

  /* ── State ── */
  var currentShift = 3;
  var history      = [];

  /* ── Caesar cipher core ── */
  function caesarChar(ch, shift) {
    var base;
    if (ch >= "A" && ch <= "Z") { base = 65; }
    else if (ch >= "a" && ch <= "z") { base = 97; }
    else { return ch; }
    return String.fromCharCode(((ch.charCodeAt(0) - base + shift + 26) % 26) + base);
  }

  function caesarText(text, shift) {
    var result = "";
    for (var i = 0; i < text.length; i++) {
      result += caesarChar(text[i], shift);
    }
    return result;
  }

  /* ── Alphabet visualization ── */
  function buildAlphabet(shift) {
    alphabetRow.innerHTML = "";
    var letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    for (var i = 0; i < 26; i++) {
      var orig = letters[i];
      var enc  = letters[(i + shift) % 26];

      var pair = document.createElement("div");
      pair.className = "alpha-pair";

      var top = document.createElement("div");
      top.className = "alpha-char orig";
      top.textContent = orig;

      var arr = document.createElement("div");
      arr.className = "alpha-arrow";
      arr.textContent = "↓";

      var bot = document.createElement("div");
      bot.className = "alpha-char enc";
      bot.textContent = enc;

      pair.appendChild(top);
      pair.appendChild(arr);
      pair.appendChild(bot);
      alphabetRow.appendChild(pair);
    }
  }

  /* ── Update display ── */
  function updateDisplay() {
    var text  = inputText.value;
    var shift = currentShift;

    if (text.length === 0) {
      encResult.textContent = "等待输入…";
      encResult.className   = "result-text empty";
      decResult.textContent = "等待输入…";
      decResult.className   = "result-text empty";
    } else {
      var enc = caesarText(text, shift);
      var dec = caesarText(text, 26 - shift);
      encResult.textContent = enc;
      encResult.className   = "result-text";
      decResult.textContent = dec;
      decResult.className   = "result-text";
    }

    shiftNumber.textContent = shift;
    buildAlphabet(shift);
  }

  /* ── Shift change ── */
  function setShift(val) {
    val = Math.max(0, Math.min(25, val));
    currentShift = val;
    shiftSlider.value = val;

    shiftNumber.classList.remove("pop");
    void shiftNumber.offsetWidth; /* reflow */
    shiftNumber.classList.add("pop");

    updateDisplay();
  }

  /* ── Copy helper ── */
  function copyText(btn, textEl) {
    var txt = textEl.textContent;
    if (!txt || textEl.classList.contains("empty")) { return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () {
        btn.textContent = "已复制";
        btn.classList.add("copied");
        setTimeout(function () {
          btn.textContent = "复制";
          btn.classList.remove("copied");
        }, 1500);
      });
    } else {
      var ta = document.createElement("textarea");
      ta.value = txt;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) { /* ignore */ }
      document.body.removeChild(ta);
      btn.textContent = "已复制";
      btn.classList.add("copied");
      setTimeout(function () {
        btn.textContent = "复制";
        btn.classList.remove("copied");
      }, 1500);
    }
  }

  /* ── History ── */
  var STORAGE_KEY = "caesar_history";

  function loadHistory() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { history = JSON.parse(raw); }
    } catch (e) {
      history = [];
    }
  }

  function saveHistory() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) { /* ignore */ }
  }

  function renderHistory() {
    var count = history.length;
    historyCount.textContent = count > 0 ? ("(" + count + ")") : "";

    if (count === 0) {
      historyList.innerHTML = '<div class="history-empty">暂无历史记录</div>';
      return;
    }

    historyList.innerHTML = "";
    for (var i = history.length - 1; i >= 0; i--) {
      (function (item) {
        var div = document.createElement("div");
        div.className = "history-item";
        div.title = "点击恢复";

        var badge = document.createElement("div");
        badge.className = "history-shift";
        badge.textContent = "+" + item.shift;

        var texts = document.createElement("div");
        texts.className = "history-texts";

        var orig = document.createElement("div");
        orig.className = "history-orig";
        orig.textContent = item.original.length > 40
          ? item.original.slice(0, 40) + "…"
          : item.original;

        var enc = document.createElement("div");
        enc.className = "history-enc";
        enc.textContent = item.encrypted.length > 40
          ? item.encrypted.slice(0, 40) + "…"
          : item.encrypted;

        texts.appendChild(orig);
        texts.appendChild(enc);
        div.appendChild(badge);
        div.appendChild(texts);

        div.addEventListener("click", function () {
          inputText.value = item.original;
          setShift(item.shift);
        });

        historyList.appendChild(div);
      })(history[i]);
    }
  }

  function addToHistory() {
    var text = inputText.value.trim();
    if (!text) { return; }

    var entry = {
      original:  text,
      encrypted: caesarText(text, currentShift),
      shift:     currentShift,
      ts:        Date.now()
    };

    /* Avoid exact duplicates */
    for (var i = 0; i < history.length; i++) {
      if (history[i].original === entry.original && history[i].shift === entry.shift) {
        history.splice(i, 1);
        break;
      }
    }

    history.push(entry);
    if (history.length > 50) { history.shift(); }

    saveHistory();
    renderHistory();

    /* Flash button */
    saveBtn.textContent = "已保存 ✓";
    setTimeout(function () { saveBtn.textContent = "保存到历史"; }, 1200);
  }

  /* ── Event listeners ── */
  inputText.addEventListener("input", updateDisplay);

  shiftSlider.addEventListener("input", function () {
    currentShift = parseInt(shiftSlider.value, 10);
    shiftNumber.classList.remove("pop");
    void shiftNumber.offsetWidth;
    shiftNumber.classList.add("pop");
    updateDisplay();
  });

  shiftUp.addEventListener("click", function () { setShift(currentShift + 1); });
  shiftDown.addEventListener("click", function () { setShift(currentShift - 1); });

  document.addEventListener("keydown", function (e) {
    if (document.activeElement === inputText) { return; }
    if (e.key === "ArrowRight" || e.key === "ArrowUp") {
      e.preventDefault();
      setShift(currentShift + 1);
    } else if (e.key === "ArrowLeft" || e.key === "ArrowDown") {
      e.preventDefault();
      setShift(currentShift - 1);
    }
  });

  copyEnc.addEventListener("click", function () { copyText(copyEnc, encResult); });
  copyDec.addEventListener("click", function () { copyText(copyDec, decResult); });

  saveBtn.addEventListener("click", addToHistory);

  clearHistory.addEventListener("click", function () {
    history = [];
    saveHistory();
    renderHistory();
  });

  /* ── Init ── */
  loadHistory();
  renderHistory();
  updateDisplay();

})();
</script>
</body>
</html>
