<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚饭转盘</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fdf6ee;
    --surface: #ffffff;
    --primary: #ff6b35;
    --primary-dark: #e85520;
    --text: #2d2d2d;
    --text-muted: #888;
    --border: #e8e0d8;
    --shadow: 0 4px 24px rgba(0,0,0,0.10);
    --radius: 16px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 16px;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    z-index: 100;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--primary); }

  header {
    text-align: center;
    padding: 52px 16px 16px;
  }
  header h1 {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--primary);
  }
  header p {
    font-size: 14px;
    color: var(--text-muted);
    margin-top: 6px;
  }

  main {
    flex: 1;
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    align-items: flex-start;
    padding: 16px 16px 40px;
    max-width: 960px;
    margin: 0 auto;
    width: 100%;
  }

  /* ── 转盘区 ── */
  .wheel-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    flex: 0 0 auto;
  }

  .wheel-wrap {
    position: relative;
    display: inline-block;
  }

  #wheelCanvas {
    border-radius: 50%;
    box-shadow: 0 8px 32px rgba(255,107,53,0.20), 0 2px 8px rgba(0,0,0,0.08);
    display: block;
    cursor: pointer;
    transition: transform 0.12s;
  }
  #wheelCanvas:active { transform: scale(0.98); }

  /* 指针 */
  .pointer {
    position: absolute;
    top: 50%;
    right: -18px;
    transform: translateY(-50%);
    width: 0;
    height: 0;
    border-top: 16px solid transparent;
    border-bottom: 16px solid transparent;
    border-right: 32px solid var(--primary);
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.25));
  }

  .spin-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 14px 40px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(255,107,53,0.35);
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    letter-spacing: 0.05em;
  }
  .spin-btn:hover { background: var(--primary-dark); box-shadow: 0 6px 20px rgba(255,107,53,0.45); }
  .spin-btn:active { transform: scale(0.96); }
  .spin-btn:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; }

  /* ── 选项编辑区 ── */
  .options-section {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 24px 20px;
    flex: 1 1 260px;
    min-width: 240px;
    max-width: 340px;
  }

  .options-section h2 {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .options-section h2 span { font-size: 18px; }

  .option-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .option-list::-webkit-scrollbar { width: 4px; }
  .option-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .option-item {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    border-radius: 10px;
    padding: 8px 10px;
    border: 1.5px solid transparent;
    transition: border-color 0.2s, background 0.2s;
    animation: slideIn 0.25s ease;
  }
  .option-item:hover { border-color: var(--border); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .color-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .option-item input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 14px;
    color: var(--text);
    outline: none;
    min-width: 0;
  }

  .del-btn {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    padding: 0 2px;
    transition: color 0.2s, transform 0.15s;
    flex-shrink: 0;
  }
  .del-btn:hover { color: #e74c3c; transform: scale(1.2); }

  .add-row {
    display: flex;
    gap: 8px;
  }
  .add-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.2s;
  }
  .add-input:focus { border-color: var(--primary); }
  .add-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 20px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    font-weight: 700;
  }
  .add-btn:hover { background: var(--primary-dark); }
  .add-btn:active { transform: scale(0.92); }

  /* ── 结果弹窗 ── */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(3px);
  }
  .overlay.show { display: flex; }

  .result-card {
    background: var(--surface);
    border-radius: 24px;
    padding: 40px 36px 32px;
    text-align: center;
    box-shadow: 0 16px 48px rgba(0,0,0,0.18);
    max-width: 320px;
    width: 90%;
    animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.7) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .result-emoji { font-size: 52px; margin-bottom: 12px; }
  .result-label { font-size: 15px; color: var(--text-muted); margin-bottom: 8px; }
  .result-name {
    font-size: clamp(24px, 8vw, 36px);
    font-weight: 800;
    color: var(--primary);
    word-break: break-all;
    line-height: 1.2;
    margin-bottom: 24px;
  }
  .close-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 50px;
    padding: 12px 36px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 4px 14px rgba(255,107,53,0.30);
  }
  .close-btn:hover { background: var(--primary-dark); }
  .close-btn:active { transform: scale(0.96); }

  @media (max-width: 600px) {
    main { flex-direction: column; align-items: center; }
    .options-section { max-width: 100%; width: 100%; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<header>
  <h1>🍜 晚饭转盘</h1>
  <p>选不了今晚吃什么？让转盘替你决定！</p>
</header>

<main>
  <div class="wheel-section">
    <div class="wheel-wrap">
      <canvas id="wheelCanvas" width="320" height="320"></canvas>
      <div class="pointer"></div>
    </div>
    <button class="spin-btn" id="spinBtn">开始转动 🎲</button>
  </div>

  <div class="options-section">
    <h2><span>🍽</span> 候选菜单</h2>
    <ul class="option-list" id="optionList"></ul>
    <div class="add-row">
      <input class="add-input" id="addInput" type="text" placeholder="添加新选项…" maxlength="12">
      <button class="add-btn" id="addBtn" title="添加">＋</button>
    </div>
  </div>
</main>

<div class="overlay" id="overlay">
  <div class="result-card">
    <div class="result-emoji">🎉</div>
    <div class="result-label">今天就吃</div>
    <div class="result-name" id="resultName"></div>
    <button class="close-btn" id="closeBtn">好的，就这个！</button>
  </div>
</div>

<script>
(function(){
  // ── 默认选项 ──
  const DEFAULT_OPTIONS = [
    '红烧肉','麻辣火锅','寿司','兰州拉面','炸鸡','番茄炒蛋','烤肉','酸菜鱼','饺子','披萨'
  ];

  // ── 配色板 ──
  const PALETTE = [
    '#FF6B6B','#FF8E53','#FFC23A','#6BCB77','#4D96FF',
    '#C77DFF','#FF6FD8','#00C9A7','#FF9A3C','#56CFE1',
    '#FF595E','#FFCA3A','#8AC926','#1982C4','#6A4C93'
  ];

  const LS_KEY = 'dinner_wheel_options';

  let options = [];
  let spinning = false;
  let currentAngle = 0; // radians, start of first slice

  // ── 读取/保存 ──
  function load() {
    try {
      const s = localStorage.getItem(LS_KEY);
      if (s) { options = JSON.parse(s); }
    } catch(e) {}
    if (!options || options.length === 0) options = DEFAULT_OPTIONS.slice();
  }

  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(options)); } catch(e) {}
  }

  // ── Canvas ──
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const SIZE = 320;
  const CX = SIZE / 2, CY = SIZE / 2, R = SIZE / 2 - 4;

  function drawWheel(angle) {
    ctx.clearRect(0, 0, SIZE, SIZE);
    const n = options.length;
    if (n === 0) {
      ctx.fillStyle = '#eee';
      ctx.beginPath();
      ctx.arc(CX, CY, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#aaa';
      ctx.font = '16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('请添加选项', CX, CY + 6);
      return;
    }
    const slice = (Math.PI * 2) / n;

    for (let i = 0; i < n; i++) {
      const start = angle + i * slice;
      const end = start + slice;
      const color = PALETTE[i % PALETTE.length];

      // 扇形
      ctx.beginPath();
      ctx.moveTo(CX, CY);
      ctx.arc(CX, CY, R, start, end);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 文字
      ctx.save();
      ctx.translate(CX, CY);
      ctx.rotate(start + slice / 2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      const fontSize = n > 8 ? 12 : 14;
      ctx.font = `bold ${fontSize}px -apple-system, "PingFang SC", sans-serif`;
      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur = 3;
      const label = options[i].length > 6 ? options[i].slice(0,6)+'…' : options[i];
      ctx.fillText(label, R - 12, fontSize / 3);
      ctx.restore();
    }

    // 中心圆
    const grad = ctx.createRadialGradient(CX, CY, 0, CX, CY, 28);
    grad.addColorStop(0, '#fff');
    grad.addColorStop(1, '#f0e8de');
    ctx.beginPath();
    ctx.arc(CX, CY, 28, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.shadowColor = 'rgba(0,0,0,0.15)';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // 中心图标
    ctx.font = '18px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff6b35';
    ctx.fillText('🍴', CX, CY + 7);
  }

  // ── 指针指向右侧 (angle=0 时，指针在 0 弧度位置) ──
  // 指针在 canvas 右侧，即 angle = 0（3点钟方向）
  // 结果：指针停在 0 弧度，即第 0 扇区的起始边开始
  // 我们让 currentAngle 表示整个轮盘的旋转偏移，指针固定在右侧(0弧度)

  function getResult(angle) {
    const n = options.length;
    const slice = (Math.PI * 2) / n;
    // 指针在 0 弧度，规范化 angle
    let a = (((-angle) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    const idx = Math.floor(a / slice) % n;
    return options[idx];
  }

  // ── 动画旋转 ──
  function spin() {
    if (spinning || options.length === 0) return;
    spinning = true;
    document.getElementById('spinBtn').disabled = true;

    // 随机总旋转：5~9 圈 + 随机偏移
    const extraRounds = (5 + Math.random() * 4) * Math.PI * 2;
    const extraAngle = Math.random() * Math.PI * 2;
    const totalRotation = extraRounds + extraAngle;

    const duration = 4000 + Math.random() * 1500; // ms
    const startAngle = currentAngle;
    const targetAngle = startAngle + totalRotation;
    const startTime = performance.now();

    function easeOut(t) {
      // cubic ease-out
      return 1 - Math.pow(1 - t, 3);
    }

    function frame(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      const eased = easeOut(t);
      currentAngle = startAngle + eased * totalRotation;
      drawWheel(currentAngle);

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        currentAngle = targetAngle;
        drawWheel(currentAngle);
        spinning = false;
        document.getElementById('spinBtn').disabled = false;
        showResult(getResult(currentAngle));
      }
    }
    requestAnimationFrame(frame);
  }

  // ── 弹窗 ──
  function showResult(name) {
    document.getElementById('resultName').textContent = name;
    document.getElementById('overlay').classList.add('show');
  }
  function hideResult() {
    document.getElementById('overlay').classList.remove('show');
  }
  document.getElementById('closeBtn').addEventListener('click', hideResult);
  document.getElementById('overlay').addEventListener('click', function(e){
    if (e.target === this) hideResult();
  });

  // ── 选项列表渲染 ──
  function renderList() {
    const list = document.getElementById('optionList');
    list.innerHTML = '';
    options.forEach((opt, i) => {
      const li = document.createElement('li');
      li.className = 'option-item';

      const dot = document.createElement('span');
      dot.className = 'color-dot';
      dot.style.background = PALETTE[i % PALETTE.length];

      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = opt;
      inp.maxLength = 12;
      inp.addEventListener('change', function() {
        const v = this.value.trim();
        if (v) { options[i] = v; save(); drawWheel(currentAngle); }
        else { this.value = options[i]; }
      });
      inp.addEventListener('blur', function() {
        const v = this.value.trim();
        if (v) { options[i] = v; save(); renderList(); drawWheel(currentAngle); }
        else { this.value = options[i]; }
      });

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.title = '删除';
      del.textContent = '×';
      del.addEventListener('click', function() {
        options.splice(i, 1);
        save();
        renderList();
        drawWheel(currentAngle);
      });

      li.appendChild(dot);
      li.appendChild(inp);
      li.appendChild(del);
      list.appendChild(li);
    });
  }

  // ── 添加选项 ──
  function addOption() {
    const inp = document.getElementById('addInput');
    const v = inp.value.trim();
    if (!v) return;
    if (options.includes(v)) { inp.select(); return; }
    options.push(v);
    inp.value = '';
    save();
    renderList();
    drawWheel(currentAngle);
    // 滚动到底部
    const list = document.getElementById('optionList');
    list.scrollTop = list.scrollHeight;
  }

  document.getElementById('addBtn').addEventListener('click', addOption);
  document.getElementById('addInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') addOption();
  });

  document.getElementById('spinBtn').addEventListener('click', spin);
  canvas.addEventListener('click', spin);

  // ── 初始化 ──
  load();
  renderList();
  drawWheel(currentAngle);
})();
</script>
</body>
</html>
