<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>假数据生成</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0c0f1a;color:#e8eef7;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:46px 16px 60px;}
  .back{position:fixed;top:14px;left:16px;color:#6b6f8a;text-decoration:none;font-size:13px;}
  .back:hover{color:#ffd166;}
  h1{font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,#ffd166,#ff8aa0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{color:#8090a8;font-size:13px;margin:6px 0 18px;}
  .row{display:flex;gap:10px;margin-bottom:16px;align-items:center;}
  button{background:#e0a93c;color:#1a1407;border:none;border-radius:10px;padding:10px 22px;font-size:14px;font-weight:700;cursor:pointer;}
  button:hover{background:#f0bb50;}
  select{background:#161a28;border:1px solid #2a2f44;border-radius:10px;color:#e8eef7;padding:10px 12px;font-size:14px;font-family:inherit;}
  .card{width:100%;max-width:520px;background:#11151f;border:1px solid #222840;border-radius:16px;padding:6px 6px;}
  .field{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #1c2233;cursor:pointer;transition:.12s;}
  .field:last-child{border-bottom:none;}
  .field:hover{background:#161c2b;}
  .field .l{color:#8090a8;font-size:12px;}
  .field .v{color:#e8eef7;font-size:15px;font-weight:600;text-align:right;}
  .hint{color:#5a6680;font-size:12px;margin-top:14px;}
</style>
</head>
<body>
<a class="back" href="index.html">← 入口</a>
<h1>假数据生成</h1>
<p class="sub">一键生成虚构的身份信息（仅供测试占位，请勿当真）</p>
<div class="row">
  <button id="gen">🎰 换一批</button>
  <select id="cnt"><option value="1">1 条</option><option value="3">3 条</option><option value="5">5 条</option></select>
</div>
<div id="list"></div>
<div class="hint">点任意一行可单独复制 · 数据均为随机虚构</div>
<script>
"use strict";
(function(){
  var XING="赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜林徐高罗".split("");
  var MING="伟芳娜秀英敏静丽强磊军洋勇艳杰娟涛明超秀霞平刚桂兰云鹏宇浩然子轩思涵欣怡梓萱".split("");
  var CITY=["北京","上海","广州","深圳","杭州","成都","武汉","西安","南京","重庆","苏州","长沙"];
  var ROAD=["人民","解放","中山","建设","和平","幸福","青年","花园","滨江","学院"];
  var COMPANY=["云图","星河","拾光","未然","知行","原点","引力","木合","清和","南山"];
  var SUFFIX=["科技","网络","文化","信息","数字","智能"];
  var DOMAIN=["example.com","test.cn","mail.com","demo.net","fake.org"];
  var JOB=["产品经理","前端工程师","设计师","运营专员","数据分析师","项目经理","市场顾问","内容编辑"];
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function digits(n){var s="";for(var i=0;i<n;i++)s+=Math.floor(Math.random()*10);return s;}
  function person(){
    var name=pick(XING)+pick(MING)+(Math.random()<0.4?pick(MING):"");
    var phone="1"+pick(["3","5","7","8","9"])+digits(9);
    var pinyin=Math.random().toString(36).slice(2,8);
    var email=pinyin+"@"+pick(DOMAIN);
    var city=pick(CITY);
    var addr=city+"市"+pick(ROAD)+"路"+(1+Math.floor(Math.random()*200))+"号";
    var company=pick(COMPANY)+pick(SUFFIX)+"有限公司";
    var age=18+Math.floor(Math.random()*45);
    return [["姓名",name],["性别",pick(["男","女"])],["年龄",age+" 岁"],["手机",phone],["邮箱",email],["城市",city],["地址",addr],["公司",company],["职位",pick(JOB)]];
  }
  var list=document.getElementById("list"),cnt=document.getElementById("cnt");
  function copy(text,el){
    var ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");}catch(e){}
    document.body.removeChild(ta);
    var old=el.querySelector(".v").textContent;el.querySelector(".v").textContent="已复制 ✓";
    setTimeout(function(){el.querySelector(".v").textContent=old;},900);
  }
  function gen(){
    var n=parseInt(cnt.value,10),html="";
    list.innerHTML="";
    for(var p=0;p<n;p++){
      var card=document.createElement("div");card.className="card";card.style.marginBottom="14px";
      var data=person();
      for(var i=0;i<data.length;i++){(function(pair){
        var f=document.createElement("div");f.className="field";
        f.innerHTML='<span class="l">'+pair[0]+'</span><span class="v">'+pair[1]+'</span>';
        f.addEventListener("click",function(){copy(pair[1],f);});
        card.appendChild(f);
      })(data[i]);}
      list.appendChild(card);
    }
  }
  document.getElementById("gen").addEventListener("click",gen);
  cnt.addEventListener("change",gen);
  gen();
})();
</script>
</body>
</html>
