<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水波纹</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{background:#06121f;color:#e8eef7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;}
  .back{position:fixed;top:14px;left:16px;color:#7fb8e6;text-decoration:none;font-size:13px;z-index:5;}
  .back:hover{color:#bfe3ff;}
  .hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#4a7aa0;font-size:13px;z-index:5;pointer-events:none;}
  canvas{display:block;position:fixed;inset:0;}
</style>
</head>
<body>
<a class="back" href="index.html">← 入口</a>
<canvas id="cv"></canvas>
<div class="hint">点击或移动，激起一圈圈水波</div>
<script>
"use strict";
(function(){
  var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  var W,H,ripples=[];
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  window.addEventListener("resize",resize);resize();
  function add(x,y,strong){
    ripples.push({x:x,y:y,r:0,max:strong?260:150,a:1,w:strong?3:2});
  }
  function loop(){
    ctx.fillStyle="rgba(6,18,31,0.16)";ctx.fillRect(0,0,W,H);
    for(var i=ripples.length-1;i>=0;i--){
      var p=ripples[i];
      p.r+=2.4;p.a=1-p.r/p.max;
      if(p.a<=0){ripples.splice(i,1);continue;}
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.strokeStyle="rgba(120,200,255,"+(p.a*0.7).toFixed(3)+")";
      ctx.lineWidth=p.w;ctx.stroke();
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*0.6,0,Math.PI*2);
      ctx.strokeStyle="rgba(90,160,230,"+(p.a*0.4).toFixed(3)+")";
      ctx.lineWidth=1;ctx.stroke();
    }
    requestAnimationFrame(loop);
  }
  var last=0;
  function move(x,y){
    var now=Date.now?0:0; // 不用时间，靠节流计数
    add(x,y,false);
  }
  cv.addEventListener("pointerdown",function(e){add(e.clientX,e.clientY,true);});
  var skip=0;
  cv.addEventListener("pointermove",function(e){skip++;if(skip%4===0)add(e.clientX,e.clientY,false);});
  // 自动随机水滴
  var tick=0;
  (function auto(){
    tick++;
    if(tick%55===0)add(Math.random()*W,Math.random()*H,false);
    requestAnimationFrame(auto);
  })();
  loop();
})();
</script>
</body>
</html>
