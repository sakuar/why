<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>数学之美 · 动态可视化</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{background:#070912;color:#e8eef7;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow-x:hidden;}
  .top{width:100%;max-width:880px;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px;}
  .top h1{font-size:17px;font-weight:800;letter-spacing:1px;
    background:linear-gradient(90deg,#ffd166,#56b6ff,#b98cff);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .top .back{font-size:12px;color:#8090a8;text-decoration:none;border:1px solid #222840;border-radius:8px;padding:5px 10px;}
  #stage{position:relative;width:100%;max-width:880px;}
  canvas{width:100%;display:block;background:radial-gradient(ellipse at 50% 35%,#0e1426,#06070d 78%);
    border:1px solid #1c2236;border-radius:14px;touch-action:none;}
  /* 公式卡 */
  .formula{width:100%;max-width:880px;margin:10px 0 4px;padding:13px 16px;background:#0e1322;border:1px solid #232c44;border-radius:12px;}
  .formula .ttl{font-size:14px;font-weight:800;color:#ffd166;margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .formula .eq{font-size:17px;line-height:1.7;color:#e8eef7;font-family:"Cambria Math","Latin Modern Math","Times New Roman",Georgia,serif;letter-spacing:.3px;overflow-x:auto;white-space:nowrap;padding-bottom:2px;}
  .formula .eq sub,.formula .eq sup{font-size:64%;}
  .formula .nt{font-size:12.5px;color:#8b96ad;margin-top:8px;line-height:1.6;}
  .formula .nt b{color:#aab6cc;}
  .formula .live{color:#56b6ff;font-weight:700;}
  .panel{width:100%;max-width:880px;padding:6px 14px 30px;}
  .row{margin-bottom:12px;}
  .row .lab{font-size:12px;color:#8090a8;font-weight:600;letter-spacing:1px;margin-bottom:7px;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{font-size:13px;padding:7px 12px;border-radius:20px;background:#121829;border:1px solid #232c44;color:#aab6cc;cursor:pointer;transition:.13s;white-space:nowrap;}
  .chip:hover{border-color:#3a445e;color:#e8eef7;}
  .chip.on{background:#6c63ff;border-color:#6c63ff;color:#fff;}
  .chip .em{margin-right:4px;}
  #params{display:grid;grid-template-columns:1fr 1fr;gap:11px 18px;}
  @media(max-width:520px){#params{grid-template-columns:1fr;}}
  .slider .sl-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;}
  .slider .sl-top .nm{color:#cfd8ea;}
  .slider .sl-top .val{color:#56b6ff;font-weight:700;font-variant-numeric:tabular-nums;}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:3px;background:#232c44;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;box-shadow:0 0 0 1px #6c63ff;}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#6c63ff;cursor:pointer;border:2px solid #0b0e18;}
  .selrow{display:flex;gap:7px;flex-wrap:wrap;}
  .selrow .chip{font-size:12px;padding:5px 11px;}
  .globals{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center;}
  .globals .slider{min-width:160px;flex:1;}
  .toggle{display:flex;align-items:center;gap:8px;font-size:13px;color:#cfd8ea;cursor:pointer;user-select:none;}
  .sw{width:38px;height:21px;border-radius:11px;background:#232c44;position:relative;transition:.15s;flex:0 0 auto;}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#8090a8;transition:.15s;}
  .toggle.on .sw{background:#6c63ff;}
  .toggle.on .sw::after{left:19px;background:#fff;}
  .btn{font-size:12.5px;padding:7px 13px;border-radius:9px;background:#121829;border:1px solid #232c44;color:#aab6cc;cursor:pointer;}
</style>
</head>
<body>
<div class="top">
  <h1>🧮 数学之美</h1>
  <a class="back" href="index.html">← 返回合集</a>
</div>

<div id="stage"><canvas id="cv" width="880" height="500"></canvas></div>

<div class="formula">
  <div class="ttl" id="fTtl"></div>
  <div class="eq" id="fEq"></div>
  <div class="nt" id="fNt"></div>
</div>

<div class="panel">
  <div class="row">
    <div class="lab">数学概念</div>
    <div class="chips" id="topicChips"></div>
  </div>
  <div class="row" id="paramRow">
    <div class="lab">参数</div>
    <div id="params"></div>
  </div>
  <div class="row">
    <div class="lab">播放</div>
    <div class="globals">
      <div class="toggle on" id="playTog"><span class="sw"></span><span>播放动画</span></div>
      <div class="slider"><div class="sl-top"><span class="nm">速度</span><span class="val" id="vSpeed">1.0</span></div>
        <input type="range" id="rSpeed" min="0.1" max="3" step="0.1" value="1"></div>
      <button class="btn" id="btnReset">重置</button>
    </div>
  </div>
</div>

<script>
"use strict";
var cv=document.getElementById("cv"), ctx=cv.getContext("2d");
function fmtn(v){return (Math.round(v*1000)/1000).toString();}

/* ====== 通用绘图工具 ====== */
function axes(g,w,h,ox,oy,sx,sy,opt){
  opt=opt||{};
  g.strokeStyle="rgba(120,140,180,0.22)";g.lineWidth=1;
  g.beginPath();g.moveTo(0,oy);g.lineTo(w,oy);g.moveTo(ox,0);g.lineTo(ox,h);g.stroke();
}
function fact(n){var r=1;for(var i=2;i<=n;i++)r*=i;return r;}

/* ============================== 概念集 ============================== */
var MOD={}; // 当前概念的内部状态

var TOPICS=[
{
  id:"fourier", em:"〰️", name:"傅里叶级数",
  ttl:"傅里叶级数 (Fourier Series)",
  eq:"f(x) = (4/π) · Σ<sub>k=1,3,5…</sub> sin(kx)/k　　（方波）",
  nt:"任何周期函数都能拆成正弦波之和。左侧每个旋转的<b>本轮(epicycle)</b>对应一个谐波，半径=该项系数；它们首尾相接，末端轨迹正是右侧合成的波形。叠加的项越多，越逼近理想方波。",
  params:[{k:"N",label:"谐波项数",min:1,max:40,step:1,def:6},{k:"wave",label:"目标波形",type:"sel",opts:[["方波","sq"],["锯齿波","saw"],["三角波","tri"]],def:"sq"}],
  init:function(){MOD.wave=[];},
  frame:function(g,w,h,t,dt,P){
    var cy=h/2, cx=w*0.28, R=Math.min(h*0.32,140);
    // 计算各谐波 (系数, 频率)
    var terms=[];
    for(var k=1;k<=P.N;k++){
      var coef=0,freq=k;
      if(P.wave==="sq"){ if(k%2===1)coef=4/Math.PI/k; }
      else if(P.wave==="saw"){ coef=2/Math.PI/k*(k%2?1:-1); }
      else if(P.wave==="tri"){ if(k%2===1)coef=8/(Math.PI*Math.PI)/(k*k)*((((k-1)/2)%2)?-1:1); }
      if(coef!==0)terms.push([coef,freq]);
    }
    // 本轮链
    var x=cx,y=cy,ang=t*1.1;
    g.lineWidth=1;
    var px=x,py=y;
    for(var i=0;i<terms.length;i++){
      var r=terms[i][0]*R, fr=terms[i][1];
      g.strokeStyle="rgba(120,150,200,0.35)";
      g.beginPath();g.arc(px,py,Math.abs(r),0,Math.PI*2);g.stroke();
      var nx=px+r*Math.cos(fr*ang), ny=py+r*Math.sin(fr*ang);
      g.strokeStyle="hsl("+((200+i*12)%360)+",80%,65%)";
      g.beginPath();g.moveTo(px,py);g.lineTo(nx,ny);g.stroke();
      g.fillStyle="#cfe3ff";g.beginPath();g.arc(nx,ny,1.6,0,Math.PI*2);g.fill();
      px=nx;py=ny;
    }
    // 记录末端 y 到波形
    if(dt>0)MOD.wave.unshift(py);
    if(MOD.wave.length>w-cx-30)MOD.wave.pop();
    // 连接到波形起点
    var waveX0=cx+R*0.55+18;
    g.strokeStyle="rgba(255,209,102,0.5)";g.lineWidth=1;
    g.beginPath();g.moveTo(px,py);g.lineTo(waveX0,MOD.wave.length?MOD.wave[0]:py);g.stroke();
    // 画波形
    g.strokeStyle="#ffd166";g.lineWidth=2;g.beginPath();
    for(var j=0;j<MOD.wave.length;j++){var wx=waveX0+j;if(j===0)g.moveTo(wx,MOD.wave[j]);else g.lineTo(wx,MOD.wave[j]);}
    g.stroke();
    setLive("叠加 <span class='live'>"+terms.length+"</span> 个谐波");
  }
},
{
  id:"taylor", em:"📈", name:"泰勒展开",
  ttl:"泰勒级数 (Taylor Series)",
  eq:"sin x = Σ<sub>n=0</sub><sup>∞</sup> (−1)<sup>n</sup> x<sup>2n+1</sup>/(2n+1)!　　e<sup>x</sup> = Σ x<sup>n</sup>/n!",
  nt:"用多项式无限逼近一个函数。<b>白线</b>是真实函数，<b>彩线</b>是取前 N 项的泰勒多项式。看着项数增加，多项式从原点开始一点点贴合整条曲线——这正是「局部用导数信息重建全局」的威力。",
  params:[{k:"N",label:"最大项数",min:1,max:14,step:1,def:8},{k:"fn",label:"函数",type:"sel",opts:[["sin x","sin"],["cos x","cos"],["eˣ","exp"]],def:"sin"}],
  init:function(){MOD.an=0;},
  frame:function(g,w,h,t,dt,P){
    var oy=h/2, ox=w/2, sx=w/(4*Math.PI)*1.6, sy=h*0.16;
    axes(g,w,h,ox,oy,sx,sy);
    MOD.an+=dt*1.2*1; if(MOD.an>P.N+1.5)MOD.an=0;
    var curN=Math.min(P.N,Math.floor(MOD.an));
    function fTrue(x){return P.fn==="sin"?Math.sin(x):P.fn==="cos"?Math.cos(x):Math.exp(x);}
    function fApprox(x,N){var s=0;
      if(P.fn==="exp"){for(var n=0;n<=N;n++)s+=Math.pow(x,n)/fact(n);}
      else if(P.fn==="sin"){for(var n2=0;n2<=N;n2++)s+=Math.pow(-1,n2)*Math.pow(x,2*n2+1)/fact(2*n2+1);}
      else{for(var n3=0;n3<=N;n3++)s+=Math.pow(-1,n3)*Math.pow(x,2*n3)/fact(2*n3);}
      return s;}
    // 真曲线
    g.strokeStyle="rgba(255,255,255,0.9)";g.lineWidth=2;g.beginPath();
    for(var px=0;px<=w;px+=2){var x=(px-ox)/sx, y=oy-fTrue(x)*sy;if(px===0)g.moveTo(px,y);else g.lineTo(px,y);}
    g.stroke();
    // 逼近曲线
    g.strokeStyle="hsl("+((40+curN*22)%360)+",90%,62%)";g.lineWidth=2.4;g.beginPath();var started=false;
    for(var px2=0;px2<=w;px2+=2){var x2=(px2-ox)/sx, ya=fApprox(x2,curN);var y2=oy-ya*sy;
      if(y2<-2000||y2>h+2000){started=false;continue;}
      if(!started){g.moveTo(px2,y2);started=true;}else g.lineTo(px2,y2);}
    g.stroke();
    setLive("当前取前 <span class='live'>"+(curN+1)+"</span> 项");
  }
},
{
  id:"riemann", em:"∫", name:"黎曼和·定积分",
  ttl:"黎曼和 → 定积分 (Riemann Sum)",
  eq:"∫<sub>a</sub><sup>b</sup> f(x) dx = lim<sub>n→∞</sub> Σ<sub>i=1</sub><sup>n</sup> f(x<sub>i</sub>)·Δx",
  nt:"定积分=曲线下的面积。把区间切成 n 个小矩形求和(黎曼和)，<b>n 越大、矩形越细，总面积越接近真实积分值</b>。这就是积分的定义——无限细分再求和的极限。",
  params:[{k:"n",label:"分割数 n",min:2,max:120,step:1,def:10},{k:"fn",label:"被积函数",type:"sel",opts:[["½+½sin x","s"],["x²/8","q"],["e^(−x²/4)","g"]],def:"s"}],
  init:function(){MOD.an=2;},
  frame:function(g,w,h,t,dt,P){
    var a=0,b=Math.PI*2, oy=h*0.82, ox=40, plotW=w-80, sx=plotW/(b-a), sy=h*0.5;
    function f(x){return P.fn==="s"?(0.5+0.5*Math.sin(x)):P.fn==="q"?(x*x/8):Math.exp(-x*x/4)*2;}
    // 动态从2增长到n
    MOD.an+=dt*8; if(MOD.an>P.n)MOD.an=2;
    var n=Math.min(P.n,Math.round(MOD.an));
    var dx=(b-a)/n, area=0;
    // 矩形
    for(var i=0;i<n;i++){var x=a+i*dx, xc=x+dx/2, fv=f(xc);area+=fv*dx;
      var rx=ox+(x-a)*sx, rw=dx*sx, rh=fv*sy;
      g.fillStyle="hsla("+((190+i*3)%360)+",75%,55%,0.4)";
      g.fillRect(rx,oy-rh,rw,rh);
      g.strokeStyle="rgba(120,180,255,0.5)";g.lineWidth=1;g.strokeRect(rx,oy-rh,rw,rh);}
    // 真曲线
    g.strokeStyle="#ffd166";g.lineWidth=2.4;g.beginPath();
    for(var px=0;px<=plotW;px+=2){var xx=a+px/sx, yy=oy-f(xx)*sy;if(px===0)g.moveTo(ox+px,yy);else g.lineTo(ox+px,yy);}
    g.stroke();
    g.strokeStyle="rgba(120,140,180,0.4)";g.beginPath();g.moveTo(ox,oy);g.lineTo(ox+plotW,oy);g.stroke();
    // 真积分(数值精算)
    var exact=0,M=2000;for(var k=0;k<M;k++){exact+=f(a+(k+0.5)*(b-a)/M)*(b-a)/M;}
    setLive("n=<span class='live'>"+n+"</span>　黎曼和≈<span class='live'>"+fmtn(area)+"</span>　真值≈"+fmtn(exact));
  }
},
{
  id:"euler", em:"🌀", name:"欧拉公式",
  ttl:"欧拉公式 (Euler's Formula)",
  eq:"e<sup>iθ</sup> = cos θ + i · sin θ　　⟹　　e<sup>iπ</sup> + 1 = 0",
  nt:"被誉为「上帝公式」。复平面上 e<sup>iθ</sup> 就是单位圆上转动的点：它的实部是 cos θ、虚部是 sin θ。当 θ=π 时正好转到 −1，于是 e<sup>iπ</sup>+1=0 把 e、i、π、1、0 五个常数神奇地连在一起。",
  params:[],
  init:function(){},
  frame:function(g,w,h,t,dt,P){
    var cx=w*0.32, cy=h/2, R=Math.min(h*0.36,150);
    var th=t*0.8;
    axes(g,w,h,cx,cy,1,1);
    g.strokeStyle="rgba(120,150,200,0.5)";g.lineWidth=1.4;g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.stroke();
    var ex=cx+R*Math.cos(th), ey=cy-R*Math.sin(th);
    // 投影线
    g.strokeStyle="rgba(86,182,255,0.7)";g.setLineDash([4,4]);
    g.beginPath();g.moveTo(ex,ey);g.lineTo(ex,cy);g.stroke();
    g.strokeStyle="rgba(255,138,160,0.7)";
    g.beginPath();g.moveTo(ex,ey);g.lineTo(cx,ey);g.stroke();
    g.setLineDash([]);
    // 向量
    g.strokeStyle="#ffd166";g.lineWidth=2.4;g.beginPath();g.moveTo(cx,cy);g.lineTo(ex,ey);g.stroke();
    g.fillStyle="#fff";g.beginPath();g.arc(ex,ey,4,0,Math.PI*2);g.fill();
    // 右侧 sin/cos 滚动波
    if(dt>0){MOD.cos=MOD.cos||[];MOD.sin=MOD.sin||[];MOD.cos.unshift(Math.cos(th));MOD.sin.unshift(Math.sin(th));
      if(MOD.cos.length>w*0.5)MOD.cos.pop();if(MOD.sin.length>w*0.5)MOD.sin.pop();}
    var bx=w*0.6, bw=w*0.36;
    g.strokeStyle="rgba(120,140,180,0.3)";g.beginPath();g.moveTo(bx,cy);g.lineTo(bx+bw,cy);g.stroke();
    function wave(arr,col){g.strokeStyle=col;g.lineWidth=2;g.beginPath();for(var i=0;i<arr.length;i++){var wx=bx+i,wy=cy-arr[i]*R*0.6;if(i===0)g.moveTo(wx,wy);else g.lineTo(wx,wy);}g.stroke();}
    if(MOD.cos)wave(MOD.cos,"#56b6ff");if(MOD.sin)wave(MOD.sin,"#ff8aa0");
    var deg=((th*180/Math.PI)%360).toFixed(0);
    setLive("θ=<span class='live'>"+deg+"°</span>　cos θ=<span style='color:#56b6ff'>"+fmtn(Math.cos(th))+"</span>　sin θ=<span style='color:#ff8aa0'>"+fmtn(Math.sin(th))+"</span>");
  }
},
{
  id:"lissajous", em:"🎼", name:"利萨茹曲线",
  ttl:"利萨茹曲线 (Lissajous Curve)",
  eq:"x = A·sin(a·t + δ)　　y = B·sin(b·t)",
  nt:"两个垂直方向的简谐振动合成的轨迹。频率比 a:b 决定图形的「编织」结构，相位差 δ 让它旋转变形。示波器上两路正弦信号就会画出这种图案。",
  params:[{k:"a",label:"频率 a",min:1,max:9,step:1,def:3},{k:"b",label:"频率 b",min:1,max:9,step:1,def:2},{k:"delta",label:"相位差 δ(×π)",min:0,max:2,step:0.01,def:0.5}],
  init:function(){},
  frame:function(g,w,h,t,dt,P){
    var cx=w/2,cy=h/2,R=Math.min(w,h)*0.38;
    var delta=P.delta*Math.PI + t*0.25; // 相位缓慢漂移
    g.strokeStyle="#56b6ff";g.lineWidth=2;g.beginPath();
    var Np=600;
    for(var i=0;i<=Np;i++){var tt=i/Np*Math.PI*2;
      var x=cx+R*Math.sin(P.a*tt+delta), y=cy+R*Math.sin(P.b*tt);
      if(i===0)g.moveTo(x,y);else g.lineTo(x,y);}
    g.stroke();
    // 动点
    var tp=(t*0.5)%(Math.PI*2);
    var hx=cx+R*Math.sin(P.a*tp+delta), hy=cy+R*Math.sin(P.b*tp);
    g.fillStyle="#ffd166";g.beginPath();g.arc(hx,hy,5,0,Math.PI*2);g.fill();
    setLive("频率比 <span class='live'>"+P.a+":"+P.b+"</span>　δ≈"+fmtn(delta%(2*Math.PI))+" rad");
  }
},
{
  id:"lorenz", em:"🦋", name:"洛伦兹吸引子",
  ttl:"洛伦兹吸引子 (Lorenz Attractor)",
  eq:"dx/dt=σ(y−x)　dy/dt=x(ρ−z)−y　dz/dt=xy−βz",
  nt:"气象学家洛伦兹研究对流时发现的<b>混沌系统</b>：三条简单的微分方程，轨迹却永不重复、缠成一对「蝴蝶翅膀」。初始条件极微小的差异会被无限放大——这就是著名的<b>蝴蝶效应</b>。",
  params:[{k:"sigma",label:"σ",min:1,max:20,step:0.5,def:10},{k:"rho",label:"ρ",min:1,max:50,step:0.5,def:28},{k:"beta",label:"β",min:0.5,max:5,step:0.05,def:2.667}],
  init:function(){MOD.pts=[];MOD.s={x:0.1,y:0,z:0};MOD.rot=0;},
  frame:function(g,w,h,t,dt,P){
    var steps=Math.min(40,Math.round(80*dt*60/60)+6);
    var h0=0.006;
    for(var i=0;i<steps;i++){var s=MOD.s;
      var dx=P.sigma*(s.y-s.x), dy=s.x*(P.rho-s.z)-s.y, dz=s.x*s.y-P.beta*s.z;
      s.x+=dx*h0;s.y+=dy*h0;s.z+=dz*h0;
      MOD.pts.push({x:s.x,y:s.y,z:s.z});}
    if(MOD.pts.length>2600)MOD.pts.splice(0,MOD.pts.length-2600);
    MOD.rot+=dt*0.25;
    var cx=w/2, cy=h*0.56, sc=Math.min(w,h)*0.026, cosr=Math.cos(MOD.rot),sinr=Math.sin(MOD.rot);
    g.lineWidth=1.4;
    for(var j=1;j<MOD.pts.length;j++){
      var a=MOD.pts[j-1],b=MOD.pts[j];
      var ax=a.x*cosr - a.z*sinr, bx=b.x*cosr - b.z*sinr;
      var px0=cx+ax*sc, py0=cy-(a.y)*sc*0.7 -(a.z*0)*0+ (a.z*0);
      var py0b=cy-(a.z-25)*sc;
      var X0=cx+ax*sc, Y0=cy-(a.z-25)*sc;
      var X1=cx+bx*sc, Y1=cy-(b.z-25)*sc;
      var dgr=j/MOD.pts.length;
      g.strokeStyle="hsla("+((200+dgr*120)%360)+",85%,"+(45+dgr*25)+"%,"+(0.15+dgr*0.85)+")";
      g.beginPath();g.moveTo(X0,Y0);g.lineTo(X1,Y1);g.stroke();
    }
    setLive("σ=<span class='live'>"+P.sigma+"</span> ρ=<span class='live'>"+P.rho+"</span> β=<span class='live'>"+fmtn(P.beta)+"</span>　轨迹点 "+MOD.pts.length);
  }
},
{
  id:"rose", em:"🌹", name:"Maurer 玫瑰",
  ttl:"Maurer 玫瑰线 (Maurer Rose)",
  eq:"r = sin(n·θ)　，连接 θ = k·d°　(k = 0,1,…,360)",
  nt:"先画极坐标玫瑰 r=sin(nθ)，再每隔 d 度取一个点、用直线把它们顺次连起来。这些<b>弦</b>交织出意想不到的繁复花纹。n 控制花瓣数，d 控制编织密度——小小两个整数，图案千变万化。",
  params:[{k:"n",label:"花瓣参数 n",min:2,max:12,step:1,def:6},{k:"d",label:"步进角 d°",min:11,max:120,step:1,def:71}],
  init:function(){},
  frame:function(g,w,h,t,dt,P){
    var cx=w/2,cy=h/2,R=Math.min(w,h)*0.42;
    // 底层玫瑰(淡)
    g.strokeStyle="rgba(255,138,160,0.25)";g.lineWidth=1;g.beginPath();
    for(var i=0;i<=360;i++){var th=i*Math.PI/180, r=Math.sin(P.n*th)*R;var x=cx+r*Math.cos(th),y=cy+r*Math.sin(th);if(i===0)g.moveTo(x,y);else g.lineTo(x,y);}
    g.stroke();
    // Maurer 弦(动态描绘)
    var prog=(t*0.18)%1; var maxK=Math.max(2,Math.floor(prog*360)+1);
    g.lineWidth=1.3;g.beginPath();
    for(var k=0;k<=maxK;k++){var th2=k*P.d*Math.PI/180, r2=Math.sin(P.n*th2)*R;var x2=cx+r2*Math.cos(th2),y2=cy+r2*Math.sin(th2);if(k===0)g.moveTo(x2,y2);else g.lineTo(x2,y2);}
    g.strokeStyle="#b98cff";g.stroke();
    setLive("n=<span class='live'>"+P.n+"</span>　d=<span class='live'>"+P.d+"°</span>　已绘 "+maxK+"/360 条弦");
  }
},
{
  id:"galton", em:"🎯", name:"高尔顿板·正态",
  ttl:"高尔顿板 & 中心极限定理",
  eq:"f(x) = 1/√(2πσ²) · e<sup>−(x−μ)²/(2σ²)</sup>",
  nt:"小球从顶端落下，每碰一颗钉子就随机向左或向右(各 50%)。单次纯属偶然，但成千上万颗球累积起来，竟然稳定地堆成钟形的<b>正态分布</b>——这就是<b>中心极限定理</b>：大量独立随机因素之和趋于正态。",
  params:[{k:"rows",label:"钉子层数",min:4,max:14,step:1,def:9},{k:"rate",label:"放球速度",min:1,max:12,step:1,def:5}],
  init:function(){MOD.balls=[];MOD.bins=null;MOD.acc=0;MOD.rows=null;},
  frame:function(g,w,h,t,dt,P){
    var rows=Math.round(P.rows);
    if(MOD.rows!==rows){MOD.rows=rows;MOD.bins=new Array(rows+1).fill(0);MOD.balls=[];}
    var topY=h*0.08, pegGap=Math.min(28,(h*0.5)/rows), cx=w/2, pegDX=pegGap*0.9;
    var binY=topY+rows*pegGap+18, binMax=h-10;
    // 放新球
    MOD.acc+=dt*P.rate;
    while(MOD.acc>=1){MOD.acc-=1; if(MOD.balls.length<260)MOD.balls.push({row:0,x:cx,y:topY,slot:0,done:false});}
    // 钉子
    g.fillStyle="rgba(120,140,180,0.35)";
    for(var r=0;r<rows;r++){for(var c=0;c<=r;c++){var pxx=cx+(c-r/2)*pegDX, pyy=topY+r*pegGap;g.beginPath();g.arc(pxx,pyy,2,0,Math.PI*2);g.fill();}}
    // 更新+画球
    for(var i=MOD.balls.length-1;i>=0;i--){var b=MOD.balls[i];
      if(!b.done){
        b.y+=pegGap*dt*3.2;
        var targetRow=Math.floor((b.y-topY)/pegGap);
        while(b.row<targetRow && b.row<rows){var dir=Math.random()<0.5?-1:1;b.x+=dir*pegDX/2;b.slot+=(dir>0?1:0);b.row++;}
        if(b.row>=rows){b.done=true;MOD.bins[b.slot]++;}
      }
      g.fillStyle=b.done?"rgba(86,182,255,0.5)":"#ffd166";
      if(!b.done){g.beginPath();g.arc(b.x,Math.min(b.y,binY),3,0,Math.PI*2);g.fill();}
      if(b.done && MOD.balls.length>200)MOD.balls.splice(i,1);
    }
    // 直方图
    var total=0;for(var z=0;z<MOD.bins.length;z++)total+=MOD.bins[z];
    var maxC=1;for(var z2=0;z2<MOD.bins.length;z2++)maxC=Math.max(maxC,MOD.bins[z2]);
    var bw=pegDX;
    for(var s=0;s<MOD.bins.length;s++){var bh=(MOD.bins[s]/maxC)*(binMax-binY);
      var bxx=cx+(s-rows/2)*pegDX;
      g.fillStyle="hsl("+(200+s*8)+",70%,55%)";
      g.fillRect(bxx-bw*0.42,binMax-bh,bw*0.84,bh);}
    // 理论正态曲线
    g.strokeStyle="#ff8aa0";g.lineWidth=2;g.beginPath();
    var sigma=Math.sqrt(rows*0.25), mu=rows/2;
    for(var px=0;px<=rows;px+=0.1){var val=Math.exp(-(px-mu)*(px-mu)/(2*sigma*sigma));
      var bxx2=cx+(px-rows/2)*pegDX, byy=binMax-val*(binMax-binY);
      if(px===0)g.moveTo(bxx2,byy);else g.lineTo(bxx2,byy);}
    g.stroke();
    setLive("已落 <span class='live'>"+total+"</span> 球　趋近钟形正态分布");
  }
}
];

/* ============================== 状态 + 主循环 ============================== */
var S={cur:"fourier", play:true, speed:1, t:0, vals:{}, last:0};
function curTopic(){for(var i=0;i<TOPICS.length;i++)if(TOPICS[i].id===S.cur)return TOPICS[i];return TOPICS[0];}
function ensureVals(tp){if(!S.vals[tp.id]){S.vals[tp.id]={};for(var i=0;i<tp.params.length;i++)S.vals[tp.id][tp.params[i].k]=tp.params[i].def;}}
function curParams(){var tp=curTopic();ensureVals(tp);return S.vals[tp.id];}
function setLive(html){var el=document.getElementById("fLive");if(el)el.innerHTML=html;}

function fit(){var ww=Math.min(880,window.innerWidth);cv.width=ww;cv.height=Math.max(360,Math.round(Math.min(520,window.innerHeight*0.5)));}

function loop(ts){
  if(!S.last)S.last=ts;
  var dt=Math.min(0.05,(ts-S.last)/1000); S.last=ts;
  if(S.play)S.t+=dt*S.speed; else dt=0;
  ctx.clearRect(0,0,cv.width,cv.height);
  var tp=curTopic();
  try{ tp.frame(ctx,cv.width,cv.height,S.t,dt*S.speed,curParams()); }catch(e){}
  requestAnimationFrame(loop);
}

/* ============================== UI ============================== */
function renderTopics(){
  var h="";for(var i=0;i<TOPICS.length;i++){var tp=TOPICS[i];
    h+='<div class="chip'+(tp.id===S.cur?" on":"")+'" data-t="'+tp.id+'"><span class="em">'+tp.em+'</span>'+tp.name+'</div>';}
  document.getElementById("topicChips").innerHTML=h;
}
function renderFormula(){
  var tp=curTopic();
  document.getElementById("fTtl").innerHTML=tp.em+" "+tp.ttl;
  document.getElementById("fEq").innerHTML=tp.eq;
  document.getElementById("fNt").innerHTML=tp.nt+' <span id="fLive" style="display:block;margin-top:6px;color:#56b6ff"></span>';
}
function renderParams(){
  var tp=curTopic();ensureVals(tp);var h="";
  if(!tp.params.length){document.getElementById("paramRow").style.display="none";document.getElementById("params").innerHTML="";return;}
  document.getElementById("paramRow").style.display="";
  for(var i=0;i<tp.params.length;i++){var pr=tp.params[i];var val=S.vals[tp.id][pr.k];
    if(pr.type==="sel"){
      h+='<div class="slider"><div class="sl-top"><span class="nm">'+pr.label+'</span></div><div class="selrow" data-sel="'+pr.k+'">';
      for(var o=0;o<pr.opts.length;o++)h+='<div class="chip'+(pr.opts[o][1]===val?" on":"")+'" data-v="'+pr.opts[o][1]+'">'+pr.opts[o][0]+'</div>';
      h+='</div></div>';
    }else{
      h+='<div class="slider"><div class="sl-top"><span class="nm">'+pr.label+'</span><span class="val" id="pv_'+pr.k+'">'+fmtn(val)+'</span></div>'+
         '<input type="range" data-p="'+pr.k+'" min="'+pr.min+'" max="'+pr.max+'" step="'+pr.step+'" value="'+val+'"></div>';
    }
  }
  document.getElementById("params").innerHTML=h;
}
function reinit(){var tp=curTopic();if(tp.init)tp.init();}

document.getElementById("topicChips").addEventListener("click",function(e){
  var c=e.target.closest(".chip");if(!c)return;S.cur=c.getAttribute("data-t");S.t=0;
  renderTopics();renderFormula();renderParams();reinit();
});
document.getElementById("params").addEventListener("input",function(e){
  var inp=e.target;if(inp.tagName!=="INPUT")return;var k=inp.getAttribute("data-p");
  S.vals[curTopic().id][k]=parseFloat(inp.value);
  var lbl=document.getElementById("pv_"+k);if(lbl)lbl.textContent=fmtn(parseFloat(inp.value));
  reinit();
});
document.getElementById("params").addEventListener("click",function(e){
  var c=e.target.closest(".chip");if(!c)return;var row=c.closest("[data-sel]");if(!row)return;
  var k=row.getAttribute("data-sel"), v=c.getAttribute("data-v");
  S.vals[curTopic().id][k]=v;
  var chips=row.querySelectorAll(".chip");for(var i=0;i<chips.length;i++)chips[i].classList.toggle("on",chips[i]===c);
  reinit();
});
var playTog=document.getElementById("playTog");
playTog.addEventListener("click",function(){S.play=!S.play;playTog.classList.toggle("on",S.play);});
document.getElementById("rSpeed").addEventListener("input",function(e){S.speed=parseFloat(e.target.value);document.getElementById("vSpeed").textContent=fmtn(S.speed);});
document.getElementById("btnReset").addEventListener("click",function(){S.t=0;reinit();});
window.addEventListener("resize",fit);

/* ============================== 启动 ============================== */
fit();renderTopics();renderFormula();renderParams();reinit();
requestAnimationFrame(loop);
</script>
</body>
