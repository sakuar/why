<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雨窗</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #1a2030;
    --glass: rgba(180,200,220,0.08);
    --text: rgba(220,235,250,0.9);
    --text-dim: rgba(180,210,240,0.5);
    --btn-bg: rgba(120,160,200,0.18);
    --btn-hover: rgba(120,160,200,0.32);
    --btn-active: rgba(100,180,255,0.4);
    --radius: 14px;
    --shadow: 0 8px 40px rgba(0,20,60,0.5);
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    overflow: hidden;
    user-select: none;
  }

  #back-link {
    position: fixed;
    top: 14px; left: 16px;
    z-index: 100;
    color: var(--text-dim);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.03em;
    transition: color 0.3s;
    padding: 4px 8px;
    border-radius: 8px;
  }
  #back-link:hover { color: var(--text); background: rgba(255,255,255,0.06); }

  #canvas-bg {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  #canvas-rain {
    position: fixed;
    inset: 0;
    width: 100%; height: 100%;
    z-index: 1;
  }

  #ui {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(10,20,40,0.55);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(150,190,230,0.15);
    border-radius: 50px;
    padding: 10px 20px;
    box-shadow: var(--shadow);
  }

  .ctrl-btn {
    background: var(--btn-bg);
    border: 1px solid rgba(150,200,250,0.18);
    border-radius: 50px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    padding: 7px 16px;
    transition: background 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  .ctrl-btn:hover { background: var(--btn-hover); }
  .ctrl-btn:active { background: var(--btn-active); transform: scale(0.96); }
  .ctrl-btn.on { background: rgba(80,160,240,0.28); border-color: rgba(100,180,255,0.4); }

  #volume-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #volume-wrap label { color: var(--text-dim); font-size: 12px; }
  #vol-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 72px; height: 4px;
    border-radius: 4px;
    background: rgba(120,170,230,0.25);
    outline: none;
    cursor: pointer;
  }
  #vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(140,200,255,0.85);
    border: none;
    cursor: pointer;
    transition: background 0.2s;
  }
  #vol-slider::-webkit-slider-thumb:hover { background: #a0d8ff; }

  .divider {
    width: 1px; height: 22px;
    background: rgba(150,190,230,0.18);
    border-radius: 1px;
  }

  #title-label {
    color: var(--text-dim);
    font-size: 13px;
    letter-spacing: 0.1em;
  }

  #intensity-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #intensity-wrap label { color: var(--text-dim); font-size: 12px; }
  #intensity-select {
    background: var(--btn-bg);
    border: 1px solid rgba(150,200,250,0.18);
    border-radius: 8px;
    color: var(--text);
    font-size: 12px;
    padding: 4px 8px;
    outline: none;
    cursor: pointer;
  }
  #intensity-select option { background: #1a2030; color: #cce; }

  @media (max-width: 540px) {
    #ui { gap: 8px; padding: 8px 14px; bottom: 18px; }
    .ctrl-btn { padding: 6px 11px; font-size: 12px; }
    #vol-slider { width: 56px; }
    #title-label { display: none; }
  }
</style>
</head>
<body>

<a href="index.html" id="back-link">← 入口</a>
<canvas id="canvas-bg"></canvas>
<canvas id="canvas-rain"></canvas>

<div id="ui">
  <span id="title-label">雨窗</span>
  <div class="divider"></div>
  <div id="intensity-wrap">
    <label>雨势</label>
    <select id="intensity-select">
      <option value="light">小雨</option>
      <option value="medium" selected>中雨</option>
      <option value="heavy">大雨</option>
    </select>
  </div>
  <div class="divider"></div>
  <button class="ctrl-btn on" id="sound-btn">🔊 雨声</button>
  <div id="volume-wrap">
    <label>音量</label>
    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.5">
  </div>
</div>

<script>
(function() {
  "use strict";

  /* ─── 常量与状态 ─── */
  const STORAGE_KEY = "rain-window-prefs";

  const intensityConfig = {
    light:  { spawnRate: 0.018, maxDrops: 60,  slideChance: 0.008, windX: 0.12 },
    medium: { spawnRate: 0.04,  maxDrops: 120, slideChance: 0.018, windX: 0.22 },
    heavy:  { spawnRate: 0.085, maxDrops: 220, slideChance: 0.035, windX: 0.38 }
  };

  let W = 0, H = 0;
  let drops = [];
  let animId = null;
  let lastT = 0;

  let currentIntensity = "medium";
  let soundOn = true;
  let volume = 0.5;

  /* Audio */
  let audioCtx = null;
  let masterGain = null;
  let noiseNodes = [];
  let audioStarted = false;

  /* ─── DOM refs ─── */
  const canvasBg   = document.getElementById("canvas-bg");
  const canvasRain = document.getElementById("canvas-rain");
  const ctxBg      = canvasBg.getContext("2d");
  const ctxRain    = canvasRain.getContext("2d");
  const soundBtn   = document.getElementById("sound-btn");
  const volSlider  = document.getElementById("vol-slider");
  const intensitySel = document.getElementById("intensity-select");

  /* ─── 持久化 ─── */
  function loadPrefs() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const p = JSON.parse(raw);
      if (p.intensity && intensityConfig[p.intensity]) currentIntensity = p.intensity;
      if (typeof p.soundOn === "boolean") soundOn = p.soundOn;
      if (typeof p.volume === "number") volume = Math.max(0, Math.min(1, p.volume));
    } catch(e) {}
  }

  function savePrefs() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        intensity: currentIntensity,
        soundOn: soundOn,
        volume: volume
      }));
    } catch(e) {}
  }

  /* ─── 背景绘制 ─── */
  function drawBackground() {
    const w = W, h = H;
    ctxBg.clearRect(0, 0, w, h);

    // 天空渐变
    const sky = ctxBg.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0,   "#0d1525");
    sky.addColorStop(0.4, "#1a2a3f");
    sky.addColorStop(0.7, "#243348");
    sky.addColorStop(1,   "#1c2535");
    ctxBg.fillStyle = sky;
    ctxBg.fillRect(0, 0, w, h);

    // 朦胧云层
    drawClouds();

    // 远景城市轮廓
    drawCityscape();

    // 玻璃反光覆层
    const gloss = ctxBg.createLinearGradient(0, 0, w * 0.6, h);
    gloss.addColorStop(0,   "rgba(180,210,255,0.04)");
    gloss.addColorStop(0.3, "rgba(180,210,255,0.02)");
    gloss.addColorStop(1,   "rgba(0,0,0,0)");
    ctxBg.fillStyle = gloss;
    ctxBg.fillRect(0, 0, w, h);
  }

  function drawClouds() {
    ctxBg.save();
    // 几层模糊云团
    const clouds = [
      { x: W * 0.1, y: H * 0.18, rx: W * 0.28, ry: H * 0.10, a: 0.06 },
      { x: W * 0.55, y: H * 0.12, rx: W * 0.35, ry: H * 0.09, a: 0.05 },
      { x: W * 0.75, y: H * 0.25, rx: W * 0.22, ry: H * 0.08, a: 0.04 },
      { x: W * 0.3,  y: H * 0.08, rx: W * 0.20, ry: H * 0.06, a: 0.07 }
    ];
    clouds.forEach(function(c) {
      const g = ctxBg.createRadialGradient(c.x, c.y, 0, c.x, c.y, Math.max(c.rx, c.ry));
      g.addColorStop(0,   "rgba(160,190,230," + c.a + ")");
      g.addColorStop(0.6, "rgba(120,160,210," + (c.a * 0.5) + ")");
      g.addColorStop(1,   "rgba(0,0,0,0)");
      ctxBg.beginPath();
      ctxBg.ellipse(c.x, c.y, c.rx, c.ry, 0, 0, Math.PI * 2);
      ctxBg.fillStyle = g;
      ctxBg.fill();
    });
    ctxBg.restore();
  }

  function drawCityscape() {
    ctxBg.save();
    const baseY = H * 0.72;

    // 远景楼群
    const buildings = [
      { x: 0,         w: W * 0.08, h: H * 0.18 },
      { x: W * 0.06,  w: W * 0.06, h: H * 0.25 },
      { x: W * 0.11,  w: W * 0.09, h: H * 0.20 },
      { x: W * 0.19,  w: W * 0.05, h: H * 0.30 },
      { x: W * 0.23,  w: W * 0.10, h: H * 0.22 },
      { x: W * 0.32,  w: W * 0.07, h: H * 0.28 },
      { x: W * 0.38,  w: W * 0.06, h: H * 0.18 },
      { x: W * 0.43,  w: W * 0.11, h: H * 0.34 },
      { x: W * 0.53,  w: W * 0.08, h: H * 0.24 },
      { x: W * 0.60,  w: W * 0.07, h: H * 0.20 },
      { x: W * 0.66,  w: W * 0.09, h: H * 0.29 },
      { x: W * 0.74,  w: W * 0.08, h: H * 0.22 },
      { x: W * 0.81,  w: W * 0.06, h: H * 0.26 },
      { x: W * 0.86,  w: W * 0.08, h: H * 0.18 },
      { x: W * 0.93,  w: W * 0.07, h: H * 0.22 }
    ];

    buildings.forEach(function(b, i) {
      const depth = (i % 3);
      const alpha = 0.18 + depth * 0.06;
      ctxBg.fillStyle = "rgba(30,50,90," + alpha + ")";
      ctxBg.fillRect(b.x, baseY - b.h, b.w, b.h + H * 0.28);

      // 楼窗灯光
      const winCols = Math.floor(b.w / 10);
      const winRows = Math.floor(b.h / 14);
      for (let r = 0; r < winRows; r++) {
        for (let c = 0; c < winCols; c++) {
          if (Math.random() > 0.55) {
            const wx = b.x + 3 + c * 10;
            const wy = baseY - b.h + 6 + r * 14;
            const wAlpha = 0.3 + Math.random() * 0.35;
            // 暖黄或冷蓝灯
            const warm = Math.random() > 0.4;
            ctxBg.fillStyle = warm
              ? "rgba(255,220,130," + wAlpha + ")"
              : "rgba(160,210,255," + wAlpha + ")";
            ctxBg.fillRect(wx, wy, 5, 7);
          }
        }
      }
    });

    // 地面反光水坑
    const pudG = ctxBg.createLinearGradient(0, baseY + H * 0.1, 0, H);
    pudG.addColorStop(0,   "rgba(30,60,110,0.35)");
    pudG.addColorStop(0.4, "rgba(20,40,80,0.20)");
    pudG.addColorStop(1,   "rgba(10,20,50,0.10)");
    ctxBg.fillStyle = pudG;
    ctxBg.fillRect(0, baseY + H * 0.05, W, H);

    ctxBg.restore();
  }

  /* ─── 雨滴系统 ─── */
  function createDrop() {
    const x = Math.random() * W;
    const y = Math.random() * H * 0.6;
    const size = 2 + Math.random() * 5;
    return {
      x: x,
      y: y,
      size: size,
      vx: 0,
      vy: 0,
      water: size * 0.6 + Math.random() * size,  // 水量
      trail: [],                                   // 滑落轨迹
      state: "attach",   // attach | merge | slide | done
      age: 0,
      slideSpeed: 0,
      opacity: 0.6 + Math.random() * 0.4,
      wobble: Math.random() * Math.PI * 2,
      wobbleSpeed: 0.02 + Math.random() * 0.03
    };
  }

  function updateDrops(dt) {
    const cfg = intensityConfig[currentIntensity];

    // 生成新雨滴
    if (drops.length < cfg.maxDrops && Math.random() < cfg.spawnRate * dt * 0.06) {
      drops.push(createDrop());
    }

    const toRemove = [];

    drops.forEach(function(d, idx) {
      d.age += dt;
      d.wobble += d.wobbleSpeed;

      if (d.state === "attach") {
        // 附着状态：微微颤动，水量增加
        d.water += 0.002 * dt;
        d.size = Math.min(d.size + 0.001 * dt, 9);

        // 达到阈值开始滑落
        if (d.water > 8 + Math.random() * 4 || Math.random() < cfg.slideChance * dt * 0.06) {
          d.state = "slide";
          d.slideSpeed = 0.3 + Math.random() * 0.4;
          d.trail = [{ x: d.x, y: d.y, a: 0.5 }];
        }
      } else if (d.state === "slide") {
        // 滑落：沿玻璃向下，带轻微横向偏移
        const windInfluence = cfg.windX * (0.5 + Math.random() * 0.5);
        d.slideSpeed = Math.min(d.slideSpeed + 0.025 * dt * 0.06, 3.5);
        d.x += windInfluence * dt * 0.06 + Math.sin(d.wobble * 0.5) * 0.3;
        d.y += d.slideSpeed * dt * 0.06;

        // 留下轨迹
        d.trail.unshift({ x: d.x, y: d.y, a: 0.35 });
        if (d.trail.length > 22) d.trail.pop();

        // 边界检测
        if (d.y > H + 20 || d.x < -20 || d.x > W + 20) {
          toRemove.push(idx);
        }

        // 水滴缩小（水分蒸发）
        d.size = Math.max(d.size - 0.003 * dt * 0.06, 1.5);
        if (d.size < 1.5) toRemove.push(idx);
      }
    });

    // 倒序移除
    for (let i = toRemove.length - 1; i >= 0; i--) {
      drops.splice(toRemove[i], 1);
    }
  }

  function renderRain() {
    ctxRain.clearRect(0, 0, W, H);

    drops.forEach(function(d) {
      if (d.state === "attach") {
        drawAttachedDrop(d);
      } else if (d.state === "slide") {
        drawSlidingDrop(d);
      }
    });
  }

  function drawAttachedDrop(d) {
    const x = d.x + Math.sin(d.wobble) * 0.5;
    const y = d.y + Math.cos(d.wobble * 0.7) * 0.3;
    const r = d.size;

    ctxRain.save();

    // 水滴主体
    const grad = ctxRain.createRadialGradient(x - r * 0.25, y - r * 0.3, r * 0.1, x, y, r);
    grad.addColorStop(0,   "rgba(220,240,255," + (d.opacity * 0.85) + ")");
    grad.addColorStop(0.4, "rgba(180,215,250," + (d.opacity * 0.5) + ")");
    grad.addColorStop(1,   "rgba(120,170,220," + (d.opacity * 0.2) + ")");

    ctxRain.beginPath();
    // 略扁的椭圆模拟附着水珠
    ctxRain.ellipse(x, y, r * 0.85, r, 0, 0, Math.PI * 2);
    ctxRain.fillStyle = grad;
    ctxRain.fill();

    // 高光
    ctxRain.beginPath();
    ctxRain.ellipse(x - r * 0.3, y - r * 0.3, r * 0.2, r * 0.15, -0.5, 0, Math.PI * 2);
    ctxRain.fillStyle = "rgba(255,255,255,0.55)";
    ctxRain.fill();

    ctxRain.restore();
  }

  function drawSlidingDrop(d) {
    ctxRain.save();

    // 绘制轨迹（细水线）
    if (d.trail.length > 1) {
      ctxRain.beginPath();
      ctxRain.moveTo(d.trail[0].x, d.trail[0].y);
      for (let i = 1; i < d.trail.length; i++) {
        const pt = d.trail[i];
        ctxRain.lineTo(pt.x, pt.y);
      }
      const trailAlpha = d.opacity * 0.25;
      ctxRain.strokeStyle = "rgba(180,220,255," + trailAlpha + ")";
      ctxRain.lineWidth = Math.max(0.5, d.size * 0.35);
      ctxRain.lineCap = "round";
      ctxRain.stroke();
    }

    // 滑落水珠主体（拉长水滴形）
    const r = d.size;
    const x = d.x;
    const y = d.y;

    const dropGrad = ctxRain.createRadialGradient(x - r * 0.2, y - r * 0.4, r * 0.1, x, y + r * 0.2, r * 1.1);
    dropGrad.addColorStop(0,   "rgba(230,245,255," + (d.opacity * 0.9) + ")");
    dropGrad.addColorStop(0.5, "rgba(170,215,250," + (d.opacity * 0.55) + ")");
    dropGrad.addColorStop(1,   "rgba(100,160,220," + (d.opacity * 0.15) + ")");

    ctxRain.beginPath();
    // 水滴形路径（上圆下尖）
    ctxRain.moveTo(x, y - r * 1.2);
    ctxRain.bezierCurveTo(x + r * 0.8, y - r * 0.6, x + r * 0.8, y + r * 0.4, x, y + r * 1.0);
    ctxRain.bezierCurveTo(x - r * 0.8, y + r * 0.4, x - r * 0.8, y - r * 0.6, x, y - r * 1.2);
    ctxRain.fillStyle = dropGrad;
    ctxRain.fill();

    // 高光
    ctxRain.beginPath();
    ctxRain.ellipse(x - r * 0.25, y - r * 0.5, r * 0.18, r * 0.28, -0.3, 0, Math.PI * 2);
    ctxRain.fillStyle = "rgba(255,255,255,0.5)";
    ctxRain.fill();

    ctxRain.restore();
  }

  /* ─── 动画循环 ─── */
  function loop(t) {
    if (!lastT) lastT = t;
    const dt = Math.min(t - lastT, 50);
    lastT = t;

    updateDrops(dt);
    renderRain();

    animId = requestAnimationFrame(loop);
  }

  /* ─── Resize ─── */
  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvasBg.width   = W; canvasBg.height   = H;
    canvasRain.width = W; canvasRain.height = H;
    drawBackground();
  }

  /* ─── Web Audio 雨声合成 ─── */
  function buildAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = soundOn ? volume : 0;
      masterGain.connect(audioCtx.destination);
      startRainAudio();
    } catch(e) {
      console.warn("AudioContext unavailable:", e);
    }
  }

  function createNoiseBuffer(duration) {
    const sr = audioCtx.sampleRate;
    const len = sr * duration;
    const buf = audioCtx.createBuffer(1, len, sr);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      data[i] = Math.random() * 2 - 1;
    }
    return buf;
  }

  function startRainAudio() {
    if (!audioCtx) return;
    stopRainAudio();
    noiseNodes = [];

    // 层1：白噪底层（远处雨声）
    (function() {
      const src = audioCtx.createBufferSource();
      src.buffer = createNoiseBuffer(3);
      src.loop = true;

      const lpf = audioCtx.createBiquadFilter();
      lpf.type = "lowpass";
      lpf.frequency.value = 900;
      lpf.Q.value = 0.6;

      const g = audioCtx.createGain();
      g.gain.value = 0.08;

      src.connect(lpf);
      lpf.connect(g);
      g.connect(masterGain);
      src.start();
      noiseNodes.push(src);
    })();

    // 层2：中频雨滴撞击声
    (function() {
      const src = audioCtx.createBufferSource();
      src.buffer = createNoiseBuffer(2);
      src.loop = true;

      const bpf = audioCtx.createBiquadFilter();
      bpf.type = "bandpass";
      bpf.frequency.value = 2200;
      bpf.Q.value = 1.8;

      const g = audioCtx.createGain();
      g.gain.value = 0.055;

      // 缓慢 LFO 调制增益营造节律感
      const lfo = audioCtx.createOscillator();
      lfo.frequency.value = 0.35;
      const lfoGain = audioCtx.createGain();
      lfoGain.gain.value = 0.02;
      lfo.connect(lfoGain);
      lfoGain.connect(g.gain);
      lfo.start();

      src.connect(bpf);
      bpf.connect(g);
      g.connect(masterGain);
      src.start();
      noiseNodes.push(src);
    })();

    // 层3：高频细雨沙沙声
    (function() {
      const src = audioCtx.createBufferSource();
      src.buffer = createNoiseBuffer(4);
      src.loop = true;

      const hpf = audioCtx.createBiquadFilter();
      hpf.type = "highpass";
      hpf.frequency.value = 4000;
      hpf.Q.value = 0.5;

      const lpf2 = audioCtx.createBiquadFilter();
      lpf2.type = "lowpass";
      lpf2.frequency.value = 8000;

      const g = audioCtx.createGain();
      g.gain.value = 0.038;

      src.connect(hpf);
      hpf.connect(lpf2);
      lpf2.connect(g);
      g.connect(masterGain);
      src.start();
      noiseNodes.push(src);
    })();

    // 层4：水滴滴落低频共鸣
    (function() {
      const src = audioCtx.createBufferSource();
      src.buffer = createNoiseBuffer(2.5);
      src.loop = true;

      const bpf = audioCtx.createBiquadFilter();
      bpf.type = "bandpass";
      bpf.frequency.value = 350;
      bpf.Q.value = 4;

      const g = audioCtx.createGain();
      g.gain.value = 0.045;

      const lfo2 = audioCtx.createOscillator();
      lfo2.frequency.value = 0.18;
      const lg2 = audioCtx.createGain();
      lg2.gain.value = 0.015;
      lfo2.connect(lg2);
      lg2.connect(g.gain);
      lfo2.start();

      src.connect(bpf);
      bpf.connect(g);
      g.connect(masterGain);
      src.start();
      noiseNodes.push(src);
    })();
  }

  function stopRainAudio() {
    noiseNodes.forEach(function(n) {
      try { n.stop(); } catch(e) {}
    });
    noiseNodes = [];
  }

  function setAudioVolume(v) {
    if (!masterGain) return;
    masterGain.gain.cancelScheduledValues(audioCtx.currentTime);
    masterGain.gain.setTargetAtTime(soundOn ? v : 0, audioCtx.currentTime, 0.15);
  }

  function resumeAudio() {
    if (!audioCtx) {
      buildAudio();
      audioStarted = true;
      return;
    }
    if (audioCtx.state === "suspended") {
      audioCtx.resume().then(function() {
        if (!audioStarted) {
          startRainAudio();
          audioStarted = true;
        }
        setAudioVolume(volume);
      });
    }
  }

  /* ─── UI 交互 ─── */
  function updateSoundBtn() {
    if (soundOn) {
      soundBtn.textContent = "🔊 雨声";
      soundBtn.classList.add("on");
    } else {
      soundBtn.textContent = "🔇 雨声";
      soundBtn.classList.remove("on");
    }
    if (masterGain) setAudioVolume(volume);
  }

  soundBtn.addEventListener("click", function() {
    soundOn = !soundOn;
    updateSoundBtn();
    if (soundOn) {
      resumeAudio();
    }
    savePrefs();
  });

  volSlider.addEventListener("input", function() {
    volume = parseFloat(volSlider.value);
    if (masterGain) setAudioVolume(volume);
    savePrefs();
  });

  intensitySel.addEventListener("change", function() {
    currentIntensity = intensitySel.value;
    // 清空雨滴重新生成
    drops = [];
    savePrefs();
  });

  // 首次点击/触摸启动音频（浏览器策略）
  function firstInteraction() {
    if (soundOn) resumeAudio();
    document.removeEventListener("click", firstInteraction);
    document.removeEventListener("touchstart", firstInteraction);
  }
  document.addEventListener("click", firstInteraction);
  document.addEventListener("touchstart", firstInteraction);

  window.addEventListener("resize", resize);

  /* ─── 启动 ─── */
  function init() {
    loadPrefs();

    // 同步UI到已加载的偏好
    intensitySel.value = currentIntensity;
    volSlider.value    = volume;
    updateSoundBtn();

    resize();
    lastT = 0;
    animId = requestAnimationFrame(loop);
  }

  init();

})();
</script>
</body>
</html>
