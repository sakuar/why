<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>各星球体重计算器</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e1a;
    --surface: #111827;
    --surface2: #1e2a3a;
    --accent: #6366f1;
    --accent2: #818cf8;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --border: rgba(99,102,241,0.2);
    --glow: rgba(99,102,241,0.15);
    --radius: 16px;
    --radius-sm: 10px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding: 0 0 60px;
    position: relative;
    overflow-x: hidden;
  }

  /* starfield */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 10%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 42% 70%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 45%, rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 5%  60%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 93% 80%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 28% 88%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 5%,  rgba(255,255,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 33% 33%, rgba(255,255,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 78% 67%, rgba(255,255,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 10% 95%, rgba(255,255,255,0.3) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  .back-link {
    position: fixed;
    top: 16px;
    left: 16px;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 13px;
    z-index: 100;
    transition: color 0.2s;
    background: rgba(10,14,26,0.7);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
  }
  .back-link:hover { color: var(--accent2); }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 16px;
  }

  header {
    text-align: center;
    padding: 72px 0 40px;
  }

  .hero-emoji {
    font-size: 56px;
    display: block;
    margin-bottom: 12px;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-size: clamp(22px, 5vw, 36px);
    font-weight: 800;
    background: linear-gradient(135deg, #a5b4fc, #6366f1, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 14px;
  }

  /* Input section */
  .input-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    margin-bottom: 32px;
    box-shadow: 0 0 40px var(--glow);
  }

  .input-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }

  .input-label {
    font-size: 14px;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .weight-input-wrap {
    position: relative;
    flex: 1;
    min-width: 160px;
  }

  .weight-input {
    width: 100%;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 44px 12px 16px;
    color: var(--text);
    font-size: 18px;
    font-weight: 600;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -moz-appearance: textfield;
  }
  .weight-input::-webkit-outer-spin-button,
  .weight-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .weight-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
  }

  .unit-badge {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 13px;
    pointer-events: none;
  }

  .calc-btn {
    background: linear-gradient(135deg, #6366f1, #818cf8);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px 28px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    white-space: nowrap;
    box-shadow: 0 4px 20px rgba(99,102,241,0.4);
  }
  .calc-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(99,102,241,0.5);
  }
  .calc-btn:active { transform: translateY(0); opacity: 0.9; }

  .earth-result {
    margin-top: 16px;
    padding: 12px 16px;
    background: var(--surface2);
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text-muted);
    display: none;
    border-left: 3px solid var(--accent);
  }
  .earth-result.visible { display: block; }
  .earth-result strong { color: var(--text); }

  /* Cards grid */
  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-muted);
    margin-bottom: 16px;
    font-weight: 600;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .planet-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 20px;
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s, border-color 0.25s;
    position: relative;
    overflow: hidden;
    cursor: default;
    opacity: 0;
    transform: translateY(20px);
  }

  .planet-card.animate-in {
    animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .planet-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--card-glow, transparent);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .planet-card:hover::before { opacity: 1; }

  .planet-card:hover {
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 12px 40px rgba(0,0,0,0.4);
    border-color: var(--card-accent, var(--border));
  }

  .card-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .planet-emoji {
    font-size: 36px;
    line-height: 1;
    flex-shrink: 0;
  }

  .planet-meta { flex: 1; }
  .planet-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 2px;
  }
  .gravity-tag {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface2);
    padding: 2px 8px;
    border-radius: 20px;
    display: inline-block;
  }

  .weight-display {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 4px;
    color: var(--card-color, var(--accent2));
    transition: all 0.4s;
  }

  .weight-unit { font-size: 14px; font-weight: 400; color: var(--text-muted); }

  .weight-bar-wrap {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    margin: 10px 0;
    overflow: hidden;
  }
  .weight-bar {
    height: 100%;
    border-radius: 2px;
    background: var(--card-color, var(--accent));
    width: 0;
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1) 0.2s;
  }

  .fun-fact {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-top: 8px;
    min-height: 36px;
  }

  /* empty state */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    display: block;
  }
  .empty-state .big-emoji { font-size: 48px; display: block; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  /* error */
  .error-msg {
    color: #f87171;
    font-size: 13px;
    margin-top: 8px;
    display: none;
  }
  .error-msg.visible { display: block; }

  /* footer tip */
  .footer-tip {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 48px;
    opacity: 0.6;
  }

  @media (max-width: 480px) {
    .input-row { flex-direction: column; align-items: stretch; }
    .calc-btn { width: 100%; }
    .cards-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<a href="index.html" class="back-link">← 入口</a>

<div class="wrapper">
  <header>
    <span class="hero-emoji">🪐</span>
    <h1>各星球体重计算器</h1>
    <p class="subtitle">输入你在地球上的体重，探索宇宙中的你</p>
  </header>

  <div class="input-card">
    <div class="input-row">
      <span class="input-label">我在地球上的体重</span>
      <div class="weight-input-wrap">
        <input type="number" id="weightInput" class="weight-input"
               placeholder="例如 65" min="1" max="1000" step="0.1">
        <span class="unit-badge">kg</span>
      </div>
      <button class="calc-btn" id="calcBtn">计 算</button>
    </div>
    <div class="error-msg" id="errorMsg">请输入有效的体重（1 - 1000 kg）</div>
    <div class="earth-result" id="earthResult"></div>
  </div>

  <div class="section-title" id="sectionTitle" style="display:none;">各星球体重结果</div>

  <div class="cards-grid" id="cardsGrid">
    <div class="empty-state" id="emptyState">
      <span class="big-emoji">🌍</span>
      <p>输入体重后点击「计算」<br>探索你在宇宙各处的重量</p>
    </div>
  </div>

  <p class="footer-tip">重力加速度数据来源：NASA。体重 = 质量 × 重力加速度（相对地球比值）</p>
</div>

<script>
(function () {
  "use strict";

  var PLANETS = [
    {
      name: "水星",
      emoji: "🪨",
      gravity: 0.376,
      color: "#94a3b8",
      glow: "radial-gradient(circle at top right, rgba(148,163,184,0.08), transparent 60%)",
      fact: "重力仅为地球的 38%，在这里你轻盈得像羽毛，跑步一步能跨越好几米。"
    },
    {
      name: "金星",
      emoji: "☁️",
      gravity: 0.889,
      color: "#f59e0b",
      glow: "radial-gradient(circle at top right, rgba(245,158,11,0.08), transparent 60%)",
      fact: "重力接近地球，但你会被高达 465°C 的高温和硫酸云立即「融化」。"
    },
    {
      name: "月球",
      emoji: "🌕",
      gravity: 0.166,
      color: "#e2e8f0",
      glow: "radial-gradient(circle at top right, rgba(226,232,240,0.06), transparent 60%)",
      fact: "只有地球 1/6 的重力，阿波罗宇航员在这里可以跳到 2 米高。"
    },
    {
      name: "火星",
      emoji: "🔴",
      gravity: 0.379,
      color: "#f97316",
      glow: "radial-gradient(circle at top right, rgba(249,115,22,0.08), transparent 60%)",
      fact: "重力约为地球的 38%，马斯克的移民梦想地——你在这里会比地球轻很多。"
    },
    {
      name: "木星",
      emoji: "🟠",
      gravity: 2.528,
      color: "#fb923c",
      glow: "radial-gradient(circle at top right, rgba(251,146,60,0.08), transparent 60%)",
      fact: "巨大的重力超过地球 2.5 倍，踏上这颗气态巨行星你会被压扁……如果有地面的话。"
    },
    {
      name: "土星",
      emoji: "🪐",
      gravity: 1.065,
      color: "#fbbf24",
      glow: "radial-gradient(circle at top right, rgba(251,191,36,0.08), transparent 60%)",
      fact: "重力仅略高于地球，带着美丽光环的它其实密度极低，能「漂浮」在水面上。"
    },
    {
      name: "天王星",
      emoji: "🧊",
      gravity: 0.886,
      color: "#67e8f9",
      glow: "radial-gradient(circle at top right, rgba(103,232,249,0.08), transparent 60%)",
      fact: "冰巨星，重力接近地球，整颗星球是侧躺着自转的——宇宙中的「躺平达人」。"
    },
    {
      name: "海王星",
      emoji: "💙",
      gravity: 1.137,
      color: "#3b82f6",
      glow: "radial-gradient(circle at top right, rgba(59,130,246,0.08), transparent 60%)",
      fact: "风速高达 2100 km/h 的冰蓝星球，重力比地球稍大，体验极端风暴的最佳地点。"
    }
  ];

  var weightInput = document.getElementById("weightInput");
  var calcBtn = document.getElementById("calcBtn");
  var errorMsg = document.getElementById("errorMsg");
  var earthResult = document.getElementById("earthResult");
  var cardsGrid = document.getElementById("cardsGrid");
  var emptyState = document.getElementById("emptyState");
  var sectionTitle = document.getElementById("sectionTitle");

  var lastWeight = null;

  function showError(msg) {
    errorMsg.textContent = msg || "请输入有效的体重（1 - 1000 kg）";
    errorMsg.classList.add("visible");
  }

  function hideError() {
    errorMsg.classList.remove("visible");
  }

  function saveWeight(w) {
    try { localStorage.setItem("planet_weight_kg", String(w)); } catch (e) {}
  }

  function loadWeight() {
    try { return parseFloat(localStorage.getItem("planet_weight_kg")) || null; } catch (e) { return null; }
  }

  function renderCards(earthKg) {
    var maxW = earthKg * 2.528;

    // Remove existing planet cards
    var existing = cardsGrid.querySelectorAll(".planet-card");
    for (var i = 0; i < existing.length; i++) {
      cardsGrid.removeChild(existing[i]);
    }

    if (emptyState) emptyState.style.display = "none";
    sectionTitle.style.display = "block";

    earthResult.innerHTML = "你在地球上的体重：<strong>" + earthKg.toFixed(1) + " kg</strong>（质量不会改变，只是重力不同哦）";
    earthResult.classList.add("visible");

    PLANETS.forEach(function (planet, idx) {
      var planetW = (earthKg * planet.gravity).toFixed(2);
      var barPct = Math.min(100, ((earthKg * planet.gravity) / maxW) * 100);

      var card = document.createElement("div");
      card.className = "planet-card";
      card.style.setProperty("--card-color", planet.color);
      card.style.setProperty("--card-glow", planet.glow);
      card.style.setProperty("--card-accent", planet.color);

      card.innerHTML =
        '<div class="card-top">' +
          '<span class="planet-emoji">' + planet.emoji + '</span>' +
          '<div class="planet-meta">' +
            '<div class="planet-name">' + planet.name + '</div>' +
            '<span class="gravity-tag">重力系数 ' + planet.gravity + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="weight-display">' +
          planetW + '<span class="weight-unit"> kg</span>' +
        '</div>' +
        '<div class="weight-bar-wrap">' +
          '<div class="weight-bar" data-pct="' + barPct + '"></div>' +
        '</div>' +
        '<div class="fun-fact">' + planet.fact + '</div>';

      cardsGrid.appendChild(card);

      // Staggered animation
      (function (c, bar, pct, delay) {
        setTimeout(function () {
          c.style.animationDelay = "0ms";
          c.classList.add("animate-in");
          setTimeout(function () {
            bar.style.width = pct + "%";
          }, 100);
        }, delay);
      })(card, card.querySelector(".weight-bar"), barPct, idx * 80);
    });
  }

  function calculate() {
    hideError();
    var raw = weightInput.value.trim();
    var w = parseFloat(raw);

    if (!raw || isNaN(w) || w < 1 || w > 1000) {
      showError("请输入有效的体重（1 - 1000 kg）");
      return;
    }

    lastWeight = w;
    saveWeight(w);
    renderCards(w);
  }

  function init() {
    calcBtn.addEventListener("click", calculate);

    weightInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") calculate();
    });

    weightInput.addEventListener("input", function () {
      hideError();
    });

    var saved = loadWeight();
    if (saved && saved >= 1 && saved <= 1000) {
      weightInput.value = saved;
      renderCards(saved);
    }
  }

  init();
})();
</script>
</body>
</html>
