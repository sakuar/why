<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字数统计</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface2: #f0f3fa;
    --primary: #4f6ef7;
    --primary-light: #e8ecff;
    --text: #1a1d2e;
    --text-muted: #7a7f9a;
    --border: #e2e6f3;
    --radius: 14px;
    --shadow: 0 2px 16px rgba(79,110,247,0.08);
    --transition: 0.18s ease;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .back-link {
    position: fixed;
    top: 14px;
    left: 18px;
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    z-index: 100;
    transition: color var(--transition);
    letter-spacing: 0.02em;
  }
  .back-link:hover { color: var(--primary); }

  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 60px 18px 40px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  header {
    text-align: center;
    padding-bottom: 4px;
  }
  header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text);
  }
  header p {
    margin-top: 6px;
    font-size: 14px;
    color: var(--text-muted);
  }

  .editor-wrap {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    overflow: hidden;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .editor-wrap:focus-within {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px var(--primary-light), var(--shadow);
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .toolbar-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-right: auto;
  }
  .btn {
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: background var(--transition), color var(--transition), border-color var(--transition);
    letter-spacing: 0.02em;
  }
  .btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
  .btn.danger:hover { background: #ffe8e8; color: #e53935; border-color: #e53935; }

  #main-textarea {
    width: 100%;
    min-height: 260px;
    padding: 18px;
    font-size: 15px;
    line-height: 1.75;
    border: none;
    outline: none;
    resize: vertical;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }

  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    padding: 16px 14px 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition);
  }
  .stat-card:hover {
    transform: translateY(-2px);
    border-color: var(--primary);
    box-shadow: 0 4px 20px rgba(79,110,247,0.13);
  }

  .stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1;
    transition: transform 0.12s cubic-bezier(.34,1.56,.64,1);
    display: inline-block;
  }
  .stat-value.bump {
    transform: scale(1.18);
  }
  .stat-label {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.4;
  }

  .time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .time-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: transform var(--transition), border-color var(--transition);
  }
  .time-card:hover {
    transform: translateY(-2px);
    border-color: var(--primary);
  }
  .time-icon {
    font-size: 22px;
    flex-shrink: 0;
  }
  .time-info { flex: 1; }
  .time-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
    line-height: 1.2;
  }
  .time-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .extra-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .char-detail-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .char-detail-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .char-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .char-row-label { font-size: 13px; color: var(--text-muted); }
  .char-row-value { font-size: 15px; font-weight: 700; color: var(--text); }

  .settings-card {
    background: var(--surface);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    grid-column: span 2;
  }
  .settings-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.04em;
  }
  .settings-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .settings-row label {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .settings-row input[type="range"] {
    width: 100%;
    accent-color: var(--primary);
  }
  .speed-val {
    font-weight: 700;
    color: var(--primary);
  }

  footer {
    text-align: center;
    padding: 16px 0 24px;
    font-size: 12px;
    color: var(--text-muted);
  }

  @media (max-width: 600px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .extra-row { grid-template-columns: 1fr; }
    .settings-card { grid-column: span 1; }
    .time-row { grid-template-columns: 1fr; }
    header h1 { font-size: 22px; }
    .stat-value { font-size: 24px; }
  }
  @media (max-width: 360px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<a class="back-link" href="index.html">← 入口</a>

<div class="container">
  <header>
    <h1>字数统计</h1>
    <p>实时统计文字数据，估算阅读与朗读时长</p>
  </header>

  <div class="editor-wrap">
    <div class="toolbar">
      <span class="toolbar-label">输入或粘贴文本</span>
      <button class="btn" id="btn-sample">示例文本</button>
      <button class="btn" id="btn-copy">复制文本</button>
      <button class="btn danger" id="btn-clear">清空</button>
    </div>
    <textarea id="main-textarea" placeholder="在此输入或粘贴文本，统计数据将实时更新…" spellcheck="false"></textarea>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-value" id="stat-words">0</span>
      <span class="stat-label">词数<br>(空格分隔)</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-chinese">0</span>
      <span class="stat-label">中文字数</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-lines">0</span>
      <span class="stat-label">行数</span>
    </div>
    <div class="stat-card">
      <span class="stat-value" id="stat-paragraphs">0</span>
      <span class="stat-label">段落数</span>
    </div>
  </div>

  <div class="time-row">
    <div class="time-card">
      <span class="time-icon">👁️</span>
      <div class="time-info">
        <div class="time-value" id="stat-read-time">0 秒</div>
        <div class="time-label">估算阅读时长</div>
      </div>
    </div>
    <div class="time-card">
      <span class="time-icon">🎙️</span>
      <div class="time-info">
        <div class="time-value" id="stat-speak-time">0 秒</div>
        <div class="time-label">估算朗读时长</div>
      </div>
    </div>
  </div>

  <div class="extra-row">
    <div class="char-detail-card">
      <div class="char-detail-title">字符统计</div>
      <div class="char-row">
        <span class="char-row-label">含空格字符数</span>
        <span class="char-row-value" id="stat-chars-with">0</span>
      </div>
      <div class="char-row">
        <span class="char-row-label">不含空格字符数</span>
        <span class="char-row-value" id="stat-chars-without">0</span>
      </div>
      <div class="char-row">
        <span class="char-row-label">空格 / 换行数</span>
        <span class="char-row-value" id="stat-spaces">0</span>
      </div>
      <div class="char-row">
        <span class="char-row-label">标点符号数</span>
        <span class="char-row-value" id="stat-punct">0</span>
      </div>
    </div>

    <div class="char-detail-card">
      <div class="char-detail-title">文字分布</div>
      <div class="char-row">
        <span class="char-row-label">英文字母</span>
        <span class="char-row-value" id="stat-english">0</span>
      </div>
      <div class="char-row">
        <span class="char-row-label">数字</span>
        <span class="char-row-value" id="stat-digits">0</span>
      </div>
      <div class="char-row">
        <span class="char-row-label">中文字符</span>
        <span class="char-row-value" id="stat-chinese2">0</span>
      </div>
      <div class="char-row">
        <span class="char-row-label">其他字符</span>
        <span class="char-row-value" id="stat-other">0</span>
      </div>
    </div>

    <div class="settings-card">
      <div class="settings-title">速度设置</div>
      <div class="settings-row">
        <label>
          <span>阅读速度（字/分钟）</span>
          <span class="speed-val" id="read-speed-val">500</span>
        </label>
        <input type="range" id="read-speed" min="100" max="1200" step="50" value="500">
      </div>
      <div class="settings-row">
        <label>
          <span>朗读速度（字/分钟）</span>
          <span class="speed-val" id="speak-speed-val">200</span>
        </label>
        <input type="range" id="speak-speed" min="50" max="600" step="10" value="200">
      </div>
    </div>
  </div>

  <footer>实时统计 · 数据本地处理 · 断网可用</footer>
</div>

<script>
(function () {
  "use strict";

  // --- DOM refs ---
  var textarea        = document.getElementById("main-textarea");
  var statWords       = document.getElementById("stat-words");
  var statChinese     = document.getElementById("stat-chinese");
  var statLines       = document.getElementById("stat-lines");
  var statParagraphs  = document.getElementById("stat-paragraphs");
  var statReadTime    = document.getElementById("stat-read-time");
  var statSpeakTime   = document.getElementById("stat-speak-time");
  var statCharsWith   = document.getElementById("stat-chars-with");
  var statCharsWithout= document.getElementById("stat-chars-without");
  var statSpaces      = document.getElementById("stat-spaces");
  var statPunct       = document.getElementById("stat-punct");
  var statEnglish     = document.getElementById("stat-english");
  var statDigits      = document.getElementById("stat-digits");
  var statChinese2    = document.getElementById("stat-chinese2");
  var statOther       = document.getElementById("stat-other");
  var readSpeedInput  = document.getElementById("read-speed");
  var speakSpeedInput = document.getElementById("speak-speed");
  var readSpeedVal    = document.getElementById("read-speed-val");
  var speakSpeedVal   = document.getElementById("speak-speed-val");
  var btnSample       = document.getElementById("btn-sample");
  var btnCopy         = document.getElementById("btn-copy");
  var btnClear        = document.getElementById("btn-clear");

  // --- State ---
  var readSpeed  = 500;
  var speakSpeed = 200;
  var bumpTimers = {};

  var SAMPLE_TEXT = "春晓\n作者：孟浩然\n\n春眠不觉晓，处处闻啼鸟。\n夜来风雨声，花落知多少。\n\n这是一首描写春天清晨景象的五言绝句。诗人从听觉出发，用清新自然的语言，勾勒出了一幅充满生机的春日图景。全诗意境优美，语言简洁，是唐诗中的经典之作。读来朗朗上口，令人回味无穷。";

  // --- Helpers ---
  function formatTime(seconds) {
    if (seconds < 60) {
      return Math.max(0, Math.round(seconds)) + " 秒";
    } else if (seconds < 3600) {
      var m = Math.floor(seconds / 60);
      var s = Math.round(seconds % 60);
      return s > 0 ? m + " 分 " + s + " 秒" : m + " 分钟";
    } else {
      var h = Math.floor(seconds / 3600);
      var rem = seconds % 3600;
      var mm = Math.floor(rem / 60);
      return mm > 0 ? h + " 小时 " + mm + " 分" : h + " 小时";
    }
  }

  function bump(el) {
    var id = el.id;
    if (bumpTimers[id]) {
      clearTimeout(bumpTimers[id]);
      el.classList.remove("bump");
      void el.offsetWidth; // reflow
    }
    el.classList.add("bump");
    bumpTimers[id] = setTimeout(function () {
      el.classList.remove("bump");
      bumpTimers[id] = null;
    }, 200);
  }

  function setVal(el, val) {
    var str = String(val);
    if (el.textContent !== str) {
      el.textContent = str;
      bump(el);
    }
  }

  // --- Core stats ---
  function computeStats(text) {
    var charsWith    = text.length;
    var charsWithout = text.replace(/\s/g, "").length;
    var spaces       = charsWith - charsWithout;
    var chineseCount = (text.match(/[一-龥㐀-䶿 0-⩭f]/g) || []).length;
    var englishCount = (text.match(/[a-zA-Z]/g) || []).length;
    var digitCount   = (text.match(/\d/g) || []).length;
    var punctCount   = (text.match(/[^\w\s一-龥㐀-䶿 0-⩭f]/g) || []).length;
    var otherCount   = charsWithout - chineseCount - englishCount - digitCount - punctCount;
    if (otherCount < 0) otherCount = 0;

    var words = 0;
    var trimmed = text.trim();
    if (trimmed.length > 0) {
      var parts = trimmed.split(/\s+/);
      words = parts.filter(function(p) { return p.length > 0; }).length;
    }

    var lines = 0;
    if (text.length === 0) {
      lines = 0;
    } else {
      lines = text.split("\n").length;
    }

    var paragraphs = 0;
    if (trimmed.length > 0) {
      var pArr = trimmed.split(/\n\s*\n/);
      paragraphs = pArr.filter(function(p) { return p.trim().length > 0; }).length;
    }

    // For time estimation, use Chinese chars + word count approximation
    var effectiveChars = chineseCount + words;
    var readSec  = effectiveChars > 0 ? (effectiveChars / readSpeed) * 60 : 0;
    var speakSec = effectiveChars > 0 ? (effectiveChars / speakSpeed) * 60 : 0;

    return {
      charsWith: charsWith,
      charsWithout: charsWithout,
      spaces: spaces,
      chinese: chineseCount,
      english: englishCount,
      digits: digitCount,
      punct: punctCount,
      other: otherCount,
      words: words,
      lines: lines,
      paragraphs: paragraphs,
      readSec: readSec,
      speakSec: speakSec
    };
  }

  function updateDisplay(stats) {
    setVal(statWords,       stats.words);
    setVal(statChinese,     stats.chinese);
    setVal(statLines,       stats.lines);
    setVal(statParagraphs,  stats.paragraphs);
    setVal(statCharsWith,   stats.charsWith);
    setVal(statCharsWithout,stats.charsWithout);
    setVal(statSpaces,      stats.spaces);
    setVal(statPunct,       stats.punct);
    setVal(statEnglish,     stats.english);
    setVal(statDigits,      stats.digits);
    setVal(statChinese2,    stats.chinese);
    setVal(statOther,       stats.other);

    var rt = formatTime(stats.readSec);
    var st = formatTime(stats.speakSec);
    if (statReadTime.textContent !== rt)  statReadTime.textContent  = rt;
    if (statSpeakTime.textContent !== st) statSpeakTime.textContent = st;
  }

  function onInput() {
    var text = textarea.value;
    var stats = computeStats(text);
    updateDisplay(stats);
    try { localStorage.setItem("wc_text", text); } catch(e) {}
  }

  // --- Speed controls ---
  function onReadSpeedChange() {
    readSpeed = parseInt(readSpeedInput.value, 10);
    readSpeedVal.textContent = readSpeed;
    try { localStorage.setItem("wc_read_speed", String(readSpeed)); } catch(e) {}
    onInput();
  }

  function onSpeakSpeedChange() {
    speakSpeed = parseInt(speakSpeedInput.value, 10);
    speakSpeedVal.textContent = speakSpeed;
    try { localStorage.setItem("wc_speak_speed", String(speakSpeed)); } catch(e) {}
    onInput();
  }

  // --- Button actions ---
  function onSample() {
    textarea.value = SAMPLE_TEXT;
    onInput();
    textarea.focus();
  }

  function onCopy() {
    var text = textarea.value;
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        var orig = btnCopy.textContent;
        btnCopy.textContent = "已复制!";
        setTimeout(function() { btnCopy.textContent = orig; }, 1200);
      }).catch(function() {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  function fallbackCopy(text) {
    var tmp = document.createElement("textarea");
    tmp.value = text;
    tmp.style.position = "fixed";
    tmp.style.opacity = "0";
    document.body.appendChild(tmp);
    tmp.select();
    try {
      document.execCommand("copy");
      var orig = btnCopy.textContent;
      btnCopy.textContent = "已复制!";
      setTimeout(function() { btnCopy.textContent = orig; }, 1200);
    } catch(e) {}
    document.body.removeChild(tmp);
  }

  function onClear() {
    textarea.value = "";
    onInput();
    textarea.focus();
  }

  // --- Event bindings ---
  textarea.addEventListener("input", onInput);
  readSpeedInput.addEventListener("input", onReadSpeedChange);
  speakSpeedInput.addEventListener("input", onSpeakSpeedChange);
  btnSample.addEventListener("click", onSample);
  btnCopy.addEventListener("click", onCopy);
  btnClear.addEventListener("click", onClear);

  // --- Init: restore from localStorage ---
  (function init() {
    try {
      var savedReadSpeed  = localStorage.getItem("wc_read_speed");
      var savedSpeakSpeed = localStorage.getItem("wc_speak_speed");
      var savedText       = localStorage.getItem("wc_text");

      if (savedReadSpeed) {
        var rs = parseInt(savedReadSpeed, 10);
        if (!isNaN(rs) && rs >= 100 && rs <= 1200) {
          readSpeed = rs;
          readSpeedInput.value = rs;
          readSpeedVal.textContent = rs;
        }
      }
      if (savedSpeakSpeed) {
        var ss = parseInt(savedSpeakSpeed, 10);
        if (!isNaN(ss) && ss >= 50 && ss <= 600) {
          speakSpeed = ss;
          speakSpeedInput.value = ss;
          speakSpeedVal.textContent = ss;
        }
      }
      if (savedText && savedText.length > 0) {
        textarea.value = savedText;
      }
    } catch(e) {}
    onInput();
  })();

})();
</script>
</body>
</html>
