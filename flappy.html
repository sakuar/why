<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素小鸟</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#0f1117;color:#e8eef7;min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:40px 16px 50px;user-select:none;}
  .back{position:fixed;top:14px;left:16px;color:#6b6f8a;text-decoration:none;font-size:13px;}
  .back:hover{color:#ffd166;}
  h1{font-size:1.7rem;font-weight:800;background:linear-gradient(135deg,#ffd166,#56cfaf);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .sub{color:#8090a8;font-size:13px;margin:6px 0 16px;}
  .wrap{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 10px 36px rgba(0,0,0,.5);}
  canvas{display:block;background:#7ec8e3;cursor:pointer;}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(15,17,23,.78);backdrop-filter:blur(3px);transition:.2s;}
  .overlay.hidden{opacity:0;pointer-events:none;}
  .ot{font-size:1.4rem;font-weight:800;margin-bottom:6px;color:#ffd166;}
  .os{color:#aab6cc;font-size:14px;margin-bottom:18px;text-align:center;line-height:1.7;}
  button{background:#ffd166;color:#1a1407;border:none;border-radius:10px;padding:11px 30px;font-size:15px;font-weight:700;cursor:pointer;}
  button:hover{background:#ffdc85;}
</style>
</head>
<body>
<a class="back" href="index.html">← 入口</a>
<h1>像素小鸟</h1>
<p class="sub">点击 / 空格 让小鸟拍翅膀，别撞管子</p>
<div class="wrap">
  <canvas id="cv" width="360" height="500"></canvas>
  <div class="overlay" id="ov">
    <div class="ot" id="ot">像素小鸟</div>
    <div class="os" id="os">点击屏幕或按空格起飞<br>穿过缝隙得分</div>
    <button id="start">开始</button>
  </div>
</div>
<script>
"use strict";
(function(){
  var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
  var W=cv.width,H=cv.height;
  var ov=document.getElementById("ov"),ot=document.getElementById("ot"),os=document.getElementById("os"),startBtn=document.getElementById("start");
  var GRAV=0.45,FLAP=-7.4,GAP=140,PIPE_W=58,SPEED=2.2;
  var bird,pipes,score,best,running,timer;
  best=parseInt(localStorage.getItem("flappy_best")||"0",10);
  function reset(){
    bird={x:90,y:H/2,v:0,r:14};
    pipes=[];score=0;
    addPipe(W+80);addPipe(W+80+220);addPipe(W+80+440);
  }
  function addPipe(x){
    var top=60+Math.random()*(H-GAP-160);
    pipes.push({x:x,top:top,passed:false});
  }
  function flap(){
    if(!running)return;
    bird.v=FLAP;
  }
  function start(){
    reset();running=true;ov.classList.add("hidden");
    clearInterval(timer);timer=setInterval(step,1000/60);
  }
  function over(){
    running=false;clearInterval(timer);
    if(score>best){best=score;localStorage.setItem("flappy_best",String(best));}
    ot.textContent="撞上啦！";
    os.innerHTML="得分 "+score+"　最高 "+best;
    startBtn.textContent="再来一局";
    ov.classList.remove("hidden");
  }
  function step(){
    bird.v+=GRAV;bird.y+=bird.v;
    for(var i=0;i<pipes.length;i++){
      var p=pipes[i];p.x-=SPEED;
      if(!p.passed&&p.x+PIPE_W<bird.x){p.passed=true;score++;}
      // 碰撞
      if(bird.x+bird.r>p.x&&bird.x-bird.r<p.x+PIPE_W){
        if(bird.y-bird.r<p.top||bird.y+bird.r>p.top+GAP){return over();}
      }
    }
    if(pipes.length&&pipes[0].x+PIPE_W<0){pipes.shift();addPipe(pipes[pipes.length-1].x+220);}
    if(bird.y+bird.r>H-20||bird.y-bird.r<0){return over();}
    render();
  }
  function render(){
    ctx.fillStyle="#7ec8e3";ctx.fillRect(0,0,W,H);
    // 云
    ctx.fillStyle="rgba(255,255,255,.5)";
    ctx.beginPath();ctx.arc(70,90,22,0,6.3);ctx.arc(100,90,28,0,6.3);ctx.arc(132,90,20,0,6.3);ctx.fill();
    // 管子
    for(var i=0;i<pipes.length;i++){
      var p=pipes[i];
      ctx.fillStyle="#5cb85c";
      ctx.fillRect(p.x,0,PIPE_W,p.top);
      ctx.fillRect(p.x,p.top+GAP,PIPE_W,H-p.top-GAP-20);
      ctx.fillStyle="#4a9d4a";
      ctx.fillRect(p.x-4,p.top-18,PIPE_W+8,18);
      ctx.fillRect(p.x-4,p.top+GAP,PIPE_W+8,18);
    }
    // 地面
    ctx.fillStyle="#d9b75e";ctx.fillRect(0,H-20,W,20);
    ctx.fillStyle="#c2a24a";for(var g=0;g<W;g+=16)ctx.fillRect(g,H-20,8,20);
    // 小鸟
    ctx.save();ctx.translate(bird.x,bird.y);
    var rot=Math.max(-0.5,Math.min(1.2,bird.v*0.08));ctx.rotate(rot);
    ctx.fillStyle="#ffd166";ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#ff8c42";ctx.beginPath();ctx.moveTo(bird.r-2,0);ctx.lineTo(bird.r+8,-3);ctx.lineTo(bird.r+8,4);ctx.closePath();ctx.fill();
    ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(5,-5,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#111";ctx.beginPath();ctx.arc(7,-5,2.4,0,Math.PI*2);ctx.fill();
    ctx.restore();
    // 分数
    ctx.fillStyle="#fff";ctx.strokeStyle="#3a3a3a";ctx.lineWidth=3;ctx.font="bold 38px system-ui";ctx.textAlign="center";
    ctx.strokeText(score,W/2,70);ctx.fillText(score,W/2,70);
  }
  cv.addEventListener("pointerdown",function(){if(running)flap();else start();});
  document.addEventListener("keydown",function(e){if(e.key===" "){e.preventDefault();if(running)flap();else start();}});
  startBtn.addEventListener("click",start);
  reset();render();
})();
</script>
</body>
</html>
