<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>像素花园</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:linear-gradient(#bfe3ff 0%,#e8f6ff 45%,#dff3e0 100%);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; color:#2b3a2e;
    display:flex; flex-direction:column; align-items:center; padding:24px 14px 60px; }
  h1{ font-size:26px; font-weight:700; letter-spacing:1px; }
  .sub{ color:#5a7060; font-size:13px; margin:4px 0 18px; }
  .garden{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; max-width:760px; }
  .pot{ width:150px; background:rgba(255,255,255,.55); border:1px solid rgba(0,0,0,.06);
    border-radius:14px; padding:10px; text-align:center; backdrop-filter:blur(4px);
    box-shadow:0 8px 24px rgba(80,120,90,.18); }
  canvas{ image-rendering:pixelated; width:130px; height:160px; cursor:pointer; }
  .stage{ font-weight:600; font-size:14px; margin-top:2px; }
  .age{ font-size:11px; color:#6a7d6e; }
  .bar{ height:6px; background:rgba(0,0,0,.08); border-radius:4px; overflow:hidden; margin:6px 4px 4px; }
  .bar i{ display:block; height:100%; background:linear-gradient(90deg,#8bd17c,#4caf50); width:0; transition:width .4s; }
  .acts{ display:flex; gap:6px; margin-top:8px; }
  .acts button{ flex:1; font-size:11px; padding:6px 0; border:none; border-radius:8px; cursor:pointer;
    background:#eaf6ea; color:#2f6b35; font-weight:600; }
  .acts button:hover{ background:#d8efd8; }
  .acts button.kill{ background:#fdeaea; color:#b14444; }
  .new{ width:150px; min-height:230px; border:2px dashed #9ec79e; border-radius:14px; background:transparent;
    color:#4f7a52; font-size:40px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .new:hover{ background:rgba(255,255,255,.4); }
  .toolbar{ margin-top:20px; font-size:12px; color:#5a7060; text-align:center; }
  .back{ position:fixed; top:16px; left:18px; color:#3c5a40; text-decoration:none; font-size:13px; }
  .toast{ position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#2b3a2e; color:#fff;
    padding:9px 16px; border-radius:20px; font-size:13px; opacity:0; transition:.3s; pointer-events:none; }
  .toast.show{ opacity:1; }
  .water{ position:absolute; font-size:14px; animation:fall .8s ease-in forwards; pointer-events:none; }
  @keyframes fall{ to{ transform:translateY(40px); opacity:0; } }
</style>
</head>
<body>
<a class="back" href="index.html">← 回到入口</a>
<h1>🌱 像素花园</h1>
<p class="sub">它按真实时间生长。关掉网页，它也在长。明天回来看看。</p>

<div class="garden" id="garden"></div>

<div class="toolbar">
  浇水会让它长得快一点点 · 数据存在你自己的浏览器里 · 一颗种子约 <b>3 天</b> 长成开花
</div>
<div class="toast" id="toast"></div>

<script>
const KEY="pixel-garden-v1";
const STAGES=[
  {t:0,            name:"种子",   emoji:"·"},
  {t:1*3600e3,     name:"破土",   emoji:"芽"},
  {t:6*3600e3,     name:"幼苗",   emoji:"苗"},
  {t:24*3600e3,    name:"成长",   emoji:"茎"},
  {t:48*3600e3,    name:"抽叶",   emoji:"叶"},
  {t:72*3600e3,    name:"开花",   emoji:"花"},
];
const FULL=STAGES[STAGES.length-1].t;
const SPECIES=[
  {n:"向日葵",flower:"#ffcc33",center:"#7a4a1a",stem:"#3f9442",leaf:"#4caf50"},
  {n:"郁金香",flower:"#ff6f91",center:"#ff3d68",stem:"#3f9442",leaf:"#56b85a"},
  {n:"蓝铃花",flower:"#6c8cff",center:"#3f5fd6",stem:"#3f9442",leaf:"#4caf50"},
  {n:"小雏菊",flower:"#ffffff",center:"#ffd23f",stem:"#3f9442",leaf:"#56b85a"},
  {n:"风信子",flower:"#b06cff",center:"#7d3fd6",stem:"#3f9442",leaf:"#4caf50"},
];

function load(){ try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return[];} }
function save(p){ localStorage.setItem(KEY,JSON.stringify(p)); }
let plants=load();

function effectiveAge(p){
  // 真实年龄 + 浇水奖励（每次浇水折算 +20 分钟）
  return (Date.now()-p.born) + (p.waters||0)*20*60e3;
}
function stageOf(age){ let s=0; for(let i=0;i<STAGES.length;i++) if(age>=STAGES[i].t)s=i; return s; }
function fmtAge(ms){
  const m=Math.floor(ms/60e3); if(m<60)return m+" 分钟";
  const h=Math.floor(m/60); if(h<24)return h+" 小时 "+(m%60)+" 分";
  return Math.floor(h/24)+" 天 "+(h%24)+" 小时";
}

// —— 像素绘制 ——
function drawPlant(cv,p){
  const ctx=cv.getContext('2d'); const G=10; // 像素格大小
  cv.width=130; cv.height=160; ctx.clearRect(0,0,130,160);
  const px=(x,y,c)=>{ctx.fillStyle=c;ctx.fillRect(x*G,y*G,G,G);};
  // 花盆
  for(let x=3;x<=9;x++){px(x,14,"#c8794a");}
  for(let y=15;y<=15;y++)for(let x=4;x<=8;x++)px(x,y,"#a85f36");
  ctx.fillStyle="#5a3a22"; ctx.fillRect(4*G,14*G,5*G,G*0.4);
  const sp=SPECIES[p.sp];
  const age=effectiveAge(p); const st=stageOf(age);
  // 生长进度 0..1
  const grow=Math.min(1, age/FULL);
  const stemTop = 13 - Math.round(grow*9); // 茎顶端 y
  // 茎
  if(st>=1){ for(let y=13;y>=stemTop;y--) px(6,y,sp.stem); }
  // 叶子
  if(st>=2){ px(5,11,sp.leaf); px(7,11,sp.leaf); }
  if(st>=4){ px(4,9,sp.leaf); px(8,9,sp.leaf); }
  // 花苞 / 花
  if(st===5){ // 开花：十字花瓣
    const fy=stemTop;
    px(6,fy,sp.center);
    px(5,fy,sp.flower);px(7,fy,sp.flower);px(6,fy-1,sp.flower);px(6,fy+1,sp.flower);
    px(5,fy-1,sp.flower);px(7,fy-1,sp.flower);
  } else if(st>=3){ // 花苞
    px(6,stemTop,"#7fae5a");
  } else if(st===0){ // 种子埋土里
    px(6,13,"#5a3a22");
  }
}

function render(){
  const g=document.getElementById('garden'); g.innerHTML='';
  plants.forEach((p,idx)=>{
    const age=effectiveAge(p); const st=stageOf(age); const stage=STAGES[st];
    const pct=Math.min(100, age/FULL*100);
    const sp=SPECIES[p.sp];
    const d=document.createElement('div'); d.className='pot';
    d.innerHTML=`
      <canvas></canvas>
      <div class="stage">${sp.n} · ${stage.name}</div>
      <div class="age">已生长 ${fmtAge(age)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="acts">
        <button data-water="${idx}">💧 浇水</button>
        <button class="kill" data-kill="${idx}">铲除</button>
      </div>`;
    g.appendChild(d);
    drawPlant(d.querySelector('canvas'),p);
  });
  // 新种子按钮
  if(plants.length<8){
    const n=document.createElement('div'); n.className='new'; n.textContent='＋';
    n.title='种一颗新种子';
    n.onclick=plant; g.appendChild(n);
  }
}
function plant(){
  plants.push({born:Date.now(), sp:Math.floor(Math.random()*SPECIES.length), waters:0});
  save(plants); render(); toast("种下了一颗种子，耐心等它发芽 🌱");
}
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800);
}
document.getElementById('garden').addEventListener('click',e=>{
  const w=e.target.dataset.water, k=e.target.dataset.kill;
  if(w!==undefined){
    const p=plants[w]; p.waters=(p.waters||0)+1; save(plants);
    // 水滴动画
    const r=e.target.getBoundingClientRect();
    for(let i=0;i<3;i++){ const s=document.createElement('span'); s.className='water'; s.textContent='💧';
      s.style.left=(r.left+r.width/2-8+(i-1)*10)+'px'; s.style.top=(r.top-20)+'px'; s.style.position='fixed';
      document.body.appendChild(s); setTimeout(()=>s.remove(),800); }
    render(); toast("浇了水，悄悄长快了一点点 💧");
  }
  if(k!==undefined){
    if(confirm("确定要铲除这株植物吗？")){ plants.splice(k,1); save(plants); render(); }
  }
});
// 每 30 秒刷新一次进度
setInterval(render,30000);
render();
if(plants.length===0) toast("点 ＋ 种下你的第一颗种子吧");
</script>
</body>
</html>
